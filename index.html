// Mapa día → coords del alojamiento donde se pasa esa NOCHE (hotel con coords cuyo
// rango cubre esa noche). Sirve para calcular el clima de cada día según dónde duermes.
const nightCoordsMap = (planningItems) => {
  const map = {};
  for (const it of (planningItems || [])) {
    if (it.type === 'hotel' && it.lat != null && it.lng != null
        && it.consultation_planned_d1 && it.consultation_planned_d2
        && it.consultation_planned_d1 < it.consultation_planned_d2) {
      let d = parseDate(it.consultation_planned_d1);
      const end = parseDate(it.consultation_planned_d2);
      while (d < end) {
        map[isoLocal(d)] = { lat: it.lat, lng: it.lng };
        d.setDate(d.getDate() + 1);
      }
    }
  }
  return map;
};

// === Parser LOCAL de reservas (sin IA, sin coste). Reconoce vuelos, hoteles y
// transportes pegando el texto de un email de confirmación y extrae lo que puede. ===
const ReservationParser = {
  MONTHS: { ene:1,jan:1, feb:2, mar:3, abr:4,apr:4, may:5, jun:6, jul:7, ago:8,aug:8, sep:9, oct:10, nov:11, dic:12,dec:12 },
  _dates(text) {
    const found = [];
    const add = (idx, y, m, d) => {
      y = +y; m = +m; d = +d; if (y < 100) y += 2000;
      if (m >= 1 && m <= 12 && d >= 1 && d <= 31) found.push({ idx, iso:`${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}` });
    };
    let m, re;
    re = /(\d{4})-(\d{2})-(\d{2})/g;                       while ((m = re.exec(text))) add(m.index, m[1], m[2], m[3]);
    re = /\b(\d{1,2})[\/.](\d{1,2})[\/.](\d{2,4})\b/g;      while ((m = re.exec(text))) add(m.index, m[3], m[2], m[1]);
    re = /\b(\d{1,2})\s*(?:de\s+)?([a-záéíóú]{3,12})\.?\s*(?:de\s+)?(\d{4})\b/gi;
    while ((m = re.exec(text))) { const mo = this.MONTHS[m[2].toLowerCase().slice(0,3)]; if (mo) add(m.index, m[3], mo, m[1]); }
    found.sort((a,b) => a.idx - b.idx);
    const seen = new Set(), out = [];
    for (const f of found) if (!seen.has(f.iso)) { seen.add(f.iso); out.push(f.iso); }
    return out;
  },
  _times(text) {
    const out = []; let m, re = /\b([01]?\d|2[0-3]):([0-5]\d)\b/g;
    while ((m = re.exec(text))) out.push(`${String(+m[1]).padStart(2,'0')}:${m[2]}`);
    return out;
  },
  parse(raw) {
    if (!raw || raw.trim().length < 4) return null;
    const text = String(raw).replace(/ /g, ' ');
    const low = text.toLowerCase();
    const out = { metadata: {} };
    const dates = this._dates(text);
    const times = this._times(text);

    const isHotel  = /\b(hotel|check[\s-]?in|check[\s-]?out|alojamiento|habitaci[oó]n|noches?|booking\.com|airbnb)\b/.test(low);
    const isTrain  = /\b(tren|renfe|ave|iryo|ouigo|avlo|eurostar|ferry|bus|flixbus|alsa|trenitalia|sncf)\b/.test(low);
    const route    = text.match(/\b([A-Z]{3})\s*(?:[-–—>→]|\/|\s+a\s+|\s+to\s+)\s*([A-Z]{3})\b/);
    const flightNo = text.match(/\b([A-Z]{2})\s?-?\s?(\d{2,4})\b/);
    const looksFlight = /\b(vuelo|flight|boarding|aerol[ií]nea|airline|terminal|puerta|gate|pasabordo|embarque)\b/.test(low) || (!!route && !!flightNo);

    let type;
    if (isHotel && !looksFlight) type = 'hotel';
    else if (looksFlight)        type = 'vuelo';
    else if (isTrain)            type = 'transporte';
    else if (route)              type = 'vuelo';
    else return null;

    const loc = text.match(/\b(?:localizador|c[oó]digo de reserva|pnr|booking ref(?:erence)?|confirmation(?: (?:code|number))?|reference)\b[:#\s-]*([A-Z0-9]{5,8})\b/i);
    if (loc) out.metadata.localizador = loc[1].toUpperCase();

    const seatM = text.match(/\b(?:asientos?|seats?|plaza)\b[:#\s-]*((?:\d{1,2}[A-K])(?:\s*[,/y o&+]+\s*\d{1,2}[A-K])*)/i);
    if (seatM) {
      const seats = seatM[1].match(/\d{1,2}[A-K]/gi) || [];
      if (seats.length) out.metadata.asientos = seats.map(s => ({ nombre:'', asiento: s.toUpperCase() }));
    }

    if (type === 'vuelo' || type === 'transporte') {
      if (route) { out.metadata.origen = route[1].toUpperCase(); out.metadata.destino = route[2].toUpperCase(); }
      if (flightNo) out.metadata.numero = (flightNo[1] + flightNo[2]).toUpperCase();
      const cap = s => s.replace(/\b\w/g, c => c.toUpperCase());
      const air = low.match(/\b(iberia|vueling|ryanair|air europa|easyjet|lufthansa|avianca|latam|american|delta|united|emirates|qatar|klm|air france|tap|wizz air|norwegian|british airways)\b/);
      if (type === 'vuelo' && air) out.metadata.aerolinea = cap(air[1]);
      const comp = low.match(/\b(renfe|iryo|ouigo|avlo|eurostar|trenitalia|sncf|alsa|flixbus)\b/);
      if (type === 'transporte' && comp) out.metadata.compania = cap(comp[1]);
      if (dates[0]) out.day_date = dates[0];
      if (times[0]) out.time = times[0];
      const o = out.metadata.origen, d = out.metadata.destino;
      out.label = `${typeDef(type).label}${o && d ? ' ' + o + '-' + d : ''}`;
      out.title = (type === 'vuelo' ? 'Vuelo' : 'Transporte')
        + (out.metadata.numero ? ' ' + out.metadata.numero : '')
        + (o && d ? ' ' + o + '-' + d : '');
    } else { // hotel
      const nameM = text.match(/\b(?:hotel|hostal|aparthotel|apartamento|resort)\b[^\n,;:·]{0,45}/i);
      if (nameM) {
        let nm = nameM[0].trim().replace(/\s+/g, ' ')
          .replace(/\s+(check[\s-]?in|check[\s-]?out|reserva|fecha|noches?|confirmaci|\d).*$/i, '')
          .replace(/[.\s]+$/, '');
        if (nm) { out.place_name = nm; out.metadata.nombre = nm; }
      }
      if (dates[0]) { out.checkin = dates[0]; out.day_date = dates[0]; }
      if (dates[1]) out.checkout = dates[1];
      if (times[0]) out.checkinTime = times[0];
      if (times[1]) out.checkoutTime = times[1];
      out.label = 'Hotel';
      out.title = out.place_name || 'Hotel';
    }
    out.type = type;
    return out;
  },
};
// Formato medio inequívoco: "vie 2 ago" (con día de la semana corto delante).
// Antes era solo "2 ago", que se confundía con "hace 2".
const fmtDateShort = (iso) => fmtDate(iso, {weekday:'short', day:'numeric', month:'short'});
// Para tarjetas de viaje: "9 oct – 12 oct 2026". Si abarca dos años:
// "29 dec 2025 – 5 ene 2026". Sin día de la semana para que quepa.
const fmtTripDateRange = (start, end) => {
  if (!start || !end) return 'Sin fechas';
  const d1 = new Date(start + 'T00:00:00');
  const d2 = new Date(end + 'T00:00:00');
  const y1 = d1.getFullYear(), y2 = d2.getFullYear();
  const part = (d, withYear) => d.toLocaleDateString('es-ES',
    { day:'numeric', month:'short', ...(withYear ? { year:'numeric' } : {}) });
  if (y1 === y2) return `${part(d1, false)} – ${part(d2, true)}`;
  return `${part(d1, true)} – ${part(d2, true)}`;
};
const daysBetween = (a, b) => {
  if (!a || !b) return 0;
  const ms = parseDate(b) - parseDate(a);
  return Math.round(ms / (24*3600*1000));
};
const daysFromToday = (iso) => {
  if (!iso) return null;
  const today = parseDate(todayIso());
  return Math.round((parseDate(iso) - today) / (24*3600*1000));
};

// Money
const fmtMoney = (amount, currency='EUR') => {
  const n = Number(amount || 0);
  try {
    return new Intl.NumberFormat('es-ES', { style:'currency', currency }).format(n);
  } catch (e) {
    return n.toFixed(2) + ' ' + currency;
  }
};

// Status de un viaje según fechas + in_preparation
const tripStatus = (t) => {
  const today = todayIso();
  if (t.start_date && t.end_date && t.start_date <= today && t.end_date >= today) return 'curso';
  if (t.in_preparation) return 'prep';
  if (t.start_date && t.start_date > today) return 'prox';
  if (t.end_date && t.end_date < today) return 'pas';
  return 'prep';
};
const statusLabel = (s) => ({curso:'En curso', prep:'En preparación', prox:'Próximo', pas:'Pasado'}[s] || s);
// Confirmación del viaje — independiente del estado temporal. Tiñe la franja
// inferior de la tarjeta. null (Sin definir) = blanco.
const TRIP_CONFIRMATIONS = [
  { id:'',           label:'Sin definir', hint:'Tarjeta en blanco',          hex:null },
  { id:'confirmado', label:'Confirmado',  hint:'El viaje va seguro',          hex:'#10b981' },
  { id:'dudoso',     label:'Dudoso',      hint:'Tal vez · pendiente de decidir', hex:'#f59e0b' },
  { id:'aplazado',   label:'Aplazado',    hint:'Pospuesto para más adelante', hex:'#a855f7' },
  { id:'cancelado',  label:'Cancelado',   hint:'Descartado o anulado',        hex:'#ef4444' },
  { id:'sin_fecha',  label:'Sin fecha',   hint:'Plan sin fecha concreta',     hex:'#e879f9' },
];
// Confirmaciones que requieren un motivo (se pide y se muestra en la tarjeta).
const CONF_NEEDS_REASON = ['cancelado', 'aplazado'];
const statusDays = (t) => {
  const s = tripStatus(t);
  if (s === 'curso') {
    const dia = daysBetween(t.start_date, todayIso()) + 1;
    const total = daysBetween(t.start_date, t.end_date) + 1;
    return `Día ${dia} de ${total}`;
  }
  if (s === 'prox') {
    const d = daysFromToday(t.start_date);
    if (d === 0) return 'Hoy mismo';
    if (d === 1) return 'Mañana';
    return `Faltan ${d} días`;
  }
  if (s === 'pas') return 'Finalizado';
  if (s === 'prep') {
    if (t.start_date) {
      const d = daysFromToday(t.start_date);
      if (d !== null && d > 0) return `En preparación · faltan ${d} d`;
    }
    return 'En preparación';
  }
  return '';
};

// Gmaps URL
const gmapsUrl = (lat, lng, q) => {
  if (lat != null && lng != null) {
    return `https://www.google.com/maps/search/?api=1&query=${lat},${lng}`;
  }
  if (q) return `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(q)}`;
  return null;
};
// Indicaciones a PIE hasta un destino (coords o dirección). null si no hay ubicación.
const gmapsWalkUrl = (lat, lng, address) => {
  let dest = null;
  if (lat != null && lng != null) dest = `${lat},${lng}`;
  else if (address && address.trim()) dest = encodeURIComponent(address.trim());
  if (!dest) return null;
  return `https://www.google.com/maps/dir/?api=1&destination=${dest}&travelmode=walking`;
};

/* ============================================================
   DB — IndexedDB con idb UMD
   ============================================================ */
const DB = {
  db: null,
  STORES: [
    'trips', 'trip_legs', 'planning_items', 'budget_items', 'bookings', 'inquiries',
    'wishlist_items', 'day_notes',
    'packing_items', 'packing_templates', 'addresses', 'destination_info',
    'emergency_contacts', 'phrases', 'shared_expenses', 'diary',
    'travel_docs', 'visited_countries',
    'wardrobe_items', 'wardrobe_catalog',
    'media',
  ],

  async open() {
    // Si ya está abierta, devolver directamente.
    if (this.db) return this.db;
    if (!window.idb) throw new Error('idb no cargada');
    const STORES = this.STORES;
    // ---
    // Migrar inquiries antiguas a planning_items con in_consultation=true.
    // Se ejecuta una vez por dispositivo (marcado en _meta).
    const runMigration = async (db) => {
      // Cada migración en su propio try/catch + flag — así una posterior no se salta
      // si la anterior ya estaba aplicada.
      try {
        const done = await db.get('_meta', 'mig_inquiries_to_planning');
        if (done) throw 'skip';
        const inquiries = await db.getAll('inquiries').catch(() => []);
        for (const i of inquiries) {
          if (i.deleted_at) continue;
          if (i.status === 'confirmado' && i.planning_item_id) continue;
          const planningItem = {
            id: uuid(), trip_id: i.trip_id, leg_id: null,
            day_date: i.planned_d1 || null,
            time: i.planned_t1 || null,
            type: ['vuelo','hotel','coche'].includes(i.type) ? i.type : (i.type === 'actividad' ? 'actividad' : 'otro'),
            title: i.name,
            place_name: i.name, lat: null, lng: null,
            gmaps_url: null, address: null,
            notes: i.notes || '',
            order_index: 0,
            in_consultation: i.status !== 'confirmado',
            consultation_url: i.url || null,
            consultation_price: i.price ?? null,
            consultation_currency: i.currency || null,
            consultation_query_date: i.query_date || null,
            consultation_planned_d1: i.planned_d1 || null,
            consultation_planned_t1: i.planned_t1 || null,
            consultation_planned_d2: i.planned_d2 || null,
            consultation_planned_t2: i.planned_t2 || null,
            updated_at: i.updated_at || nowIso(),
          };
          await db.put('planning_items', planningItem);
          // Marcar el inquiry como migrado
          i.deleted_at = nowIso(); i.updated_at = nowIso();
          await db.put('inquiries', i);
        }
        await db.put('_meta', { key:'mig_inquiries_to_planning', value:true });
      } catch (e) { if (e !== 'skip') console.warn('Migración inquiries→planning falló:', e); }

      // Migración: pasar perfil 'rubén' → 'ruben' (ASCII) en todas las tablas con campo profile.
      // Necesario porque las cabeceras HTTP no llevan bien caracteres no-ASCII y rompía la RLS.
      try {
        const done = await db.get('_meta', 'mig_ruben_ascii');
        if (done) throw 'skip';
        const tablesWithProfile = ['trips','packing_templates','travel_docs','visited_countries'];
        for (const tbl of tablesWithProfile) {
          const rows = await db.getAll(tbl).catch(() => []);
          for (const r of rows) {
            if (r.profile === 'rubén') {
              r.profile = 'ruben';
              r.updated_at = nowIso();
              await db.put(tbl, r);
            }
          }
        }
        // localStorage también
        if (localStorage.getItem('viajes_profile') === 'rubén') {
          localStorage.setItem('viajes_profile', 'ruben');
        }
        // Meta del last_sync con el perfil viejo → renombrar
        const oldMeta = await db.get('_meta', 'last_sync_rubén');
        if (oldMeta) {
          await db.put('_meta', { key:'last_sync_ruben', value: oldMeta.value });
          await db.delete('_meta', 'last_sync_rubén');
        }
        // Cola pendiente — también puede tener records con perfil viejo,
        // si fallaron a empujarlos antes de la migración.
        try {
          const pending = await db.getAll('_pending').catch(() => []);
          for (const item of pending) {
            if (item.record?.profile === 'rubén') {
              item.record.profile = 'ruben';
              item.record.updated_at = nowIso();
              await db.put('_pending', item);
            }
          }
        } catch (_) {}
        await db.put('_meta', { key:'mig_ruben_ascii', value:true });
      } catch (e) { if (e !== 'skip') console.warn('Migración perfil ASCII falló:', e); }

      // Migración: resetear last_sync_* a 1970 para forzar un pull completo desde Supabase.
      // V2: se vuelve a ejecutar ahora que el bug de `amount_eur` (columna generated)
      // está arreglado y la cola por fin puede vaciarse. La V1 corrió cuando los pushes
      // aún estaban rotos, así que el dispositivo que la ejecutó pudo terminar sin
      // ver datos del otro.
      try {
        const done = await db.get('_meta', 'mig_reset_lastsync_v2');
        if (done) throw 'skip';
        for (const prof of ['ruben','sergio','invitado']) {
          await db.delete('_meta', 'last_sync_' + prof).catch(() => {});
        }
        await db.put('_meta', { key:'mig_reset_lastsync_v2', value:true });
      } catch (e) { if (e !== 'skip') console.warn('Reset last_sync falló:', e); }
    };
    // Versión 5: añade store 'media' para fotos locales (cover, etc.).
    // Race contra timeout: si openDB tarda más de 10s (otra pestaña bloqueando, migración colgada…),
    // rechazamos para no dejar el spinner para siempre.
    const openPromise = window.idb.openDB('viajes', 6, {
      upgrade(db, oldVersion) {
        for (const name of STORES) {
          if (!db.objectStoreNames.contains(name)) {
            const store = db.createObjectStore(name, { keyPath: 'id' });
            if (['trips','packing_templates','travel_docs','visited_countries'].includes(name)) {
              store.createIndex('by_profile', 'profile');
            } else {
              store.createIndex('by_trip', 'trip_id');
            }
            store.createIndex('by_updated', 'updated_at');
            store.createIndex('by_deleted', 'deleted_at');
          }
        }
        if (!db.objectStoreNames.contains('_meta')) {
          db.createObjectStore('_meta', { keyPath: 'key' });
        }
        if (!db.objectStoreNames.contains('_pending')) {
          const s = db.createObjectStore('_pending', { keyPath: 'id', autoIncrement: true });
          s.createIndex('by_table', 'table');
        }
      },
      blocked() {
        console.warn('IDB: bloqueado por otra pestaña con versión anterior');
      },
      blocking() {
        // Otra pestaña quiere actualizar la versión — cerramos para no bloquear
        console.warn('IDB: nuestra conexión está bloqueando un upgrade — cerrando');
        try { if (DB.db) { DB.db.close(); DB.db = null; } } catch (_) {}
      },
      terminated() {
        console.warn('IDB: conexión terminada inesperadamente');
        DB.db = null;
      }
    });
    const timeout = new Promise((_, reject) => setTimeout(
      () => reject(new Error('Tiempo agotado (10s) al abrir la base de datos. Cierra otras pestañas de esta app y recarga.')),
      10000
    ));
    this.db = await Promise.race([openPromise, timeout]);
    if (!this.db) throw new Error('La base de datos devolvió null');
    await runMigration(this.db);
    return this.db;
  },

  async put(table, record) {
    record.updated_at = record.updated_at || nowIso();
    if (!record.id) record.id = uuid();
    await this.db.put(table, record);
    await this._enqueue(table, record);
    return record;
  },

  async remove(table, id) {
    const existing = await this.db.get(table, id);
    if (!existing) return;
    existing.deleted_at = nowIso();
    existing.updated_at = nowIso();
    await this.db.put(table, existing);
    await this._enqueue(table, existing);
  },

  async get(table, id) {
    return this.db.get(table, id);
  },

  async listByProfile(table, profile) {
    const all = await this.db.getAllFromIndex(table, 'by_profile', profile);
    return all.filter(r => !r.deleted_at);
  },

  async listByTrip(table, tripId) {
    const all = await this.db.getAllFromIndex(table, 'by_trip', tripId);
    return all.filter(r => !r.deleted_at);
  },

  async _enqueue(table, record) {
    await this.db.add('_pending', { table, record, ts: Date.now() });
    SYNC.scheduleFlush();
  },

  // === Media (fotos locales por perfil) ===
  // Cada entrada: { id, profile, blob, mime, created_at }
  async saveMedia(blob, mime) {
    const id = uuid();
    await this.db.put('media', { id, profile: STATE.profile, blob, mime: mime || blob.type || 'image/jpeg', created_at: nowIso() });
    return id;
  },
  async getMedia(id) {
    if (!id) return null;
    try { return await this.db.get('media', id); } catch (_) { return null; }
  },
  async deleteMedia(id) {
    if (!id) return;
    try { await this.db.delete('media', id); } catch (_) {}
  },

  async meta(key, value) {
    if (value === undefined) {
      const r = await this.db.get('_meta', key);
      return r?.value;
    }
    await this.db.put('_meta', { key, value });
  },

  // export / import JSON
  async exportProfile(profile) {
    const out = { _meta: { profile, exported_at: nowIso(), version: 1 } };
    for (const t of this.STORES) {
      const rows = await this.db.getAll(t);
      // filtrar por perfil: directamente para tablas con profile, indirectamente por trips
      if (['trips','packing_templates','travel_docs','visited_countries'].includes(t)) {
        out[t] = rows.filter(r => r.profile === profile);
      } else {
        // necesitamos saber qué trip_ids pertenecen al perfil
        const tripIds = new Set((await this.db.getAllFromIndex('trips','by_profile', profile)).map(r => r.id));
        out[t] = rows.filter(r => tripIds.has(r.trip_id));
      }
    }
    return out;
  },

  async importProfile(data) {
    if (!data || !data._meta) throw new Error('Archivo de import inválido');
    const tx = this.db.transaction(this.STORES, 'readwrite');
    for (const t of this.STORES) {
      if (Array.isArray(data[t])) {
        for (const row of data[t]) await tx.objectStore(t).put(row);
      }
    }
    await tx.done;
  },
};

/* ============================================================
   SYNC — Supabase + cola
   ============================================================ */
const SYNC = {
  client: null,
  enabled: false,
  flushTimer: null,
  status: 'idle', // 'idle'|'syncing'|'offline'|'error'
  lastError: null,    // último mensaje de error de upsert/pull (para mostrarlo en el pill)
  lastErrorTable: null,

  init() {
    if (!CFG.supabaseUrl || !CFG.supabaseAnonKey) {
      this.enabled = false;
      this._setStatus(navigator.onLine ? 'idle' : 'offline');
      return;
    }
    if (!window.supabase) {
      console.warn('Supabase JS no cargado.');
      this.enabled = false;
      return;
    }
    this.client = window.supabase.createClient(CFG.supabaseUrl, CFG.supabaseAnonKey, {
      global: { headers: { 'x-app-profile': STATE.profile || 'invitado' } },
      auth: { persistSession: false }
    });
    this.enabled = true;
    this.lastError = null;
    this._setStatus(navigator.onLine ? 'idle' : 'offline');
  },

  _setStatus(s) {
    this.status = s;
    UI.updateSyncPill();
  },

  scheduleFlush() {
    if (!this.enabled) return;
    if (!navigator.onLine) { this._setStatus('offline'); return; }
    clearTimeout(this.flushTimer);
    this.flushTimer = setTimeout(() => this.flush().catch(e => console.warn('flush', e)), 1500);
  },

  async flush() {
    if (!this.enabled || !navigator.onLine) return;
    const tx = DB.db.transaction('_pending', 'readwrite');
    const store = tx.objectStore('_pending');
    const all = await store.getAll();
    await tx.done;
    if (!all.length) { this._setStatus('idle'); return; }

    this._setStatus('syncing');
    let blocked = false;   // error transitorio (red…) → parar y reintentar luego
    let skipped = 0;       // filas con error permanente → se dejan en cola sin bloquear al resto
    for (const item of all) {
      try {
        await this._upsert(item.table, item.record);
        await DB.db.delete('_pending', item.id);
      } catch (e) {
        this.lastError = `[${item.table}] ` + (e?.message || e?.error_description || JSON.stringify(e).slice(0, 400));
        this.lastErrorTable = item.table;
        if (this._isPermanentRowError(e)) {
          // Esta fila no pasará hasta que cambie el esquema remoto (p. ej. un CHECK que no
          // contempla un valor nuevo). La dejamos en cola pero seguimos con el resto del
          // lote para no bloquear todo. Volverá a intentarse en el próximo flush.
          console.warn('sync: fila rechazada (permanente), se omite del lote', item.table, e);
          skipped++;
          continue;
        }
        // Error transitorio (red, 5xx…): paramos y reintentamos en el próximo flush.
        console.warn('sync upsert error (transitorio)', item.table, e);
        this._setStatus('error');
        blocked = true;
        break;
      }
    }
    if (blocked) return;                              // ya en estado error
    if (skipped > 0) { this._setStatus('error'); return; }  // el resto sí se subió; queda el error visible
    // Si llegamos aquí, todo fue OK
    this.lastError = null;
    this.lastErrorTable = null;
    // pull tras el push
    try { await this.pullAll(); } catch (e) { console.warn('pull', e); }
    this._setStatus(navigator.onLine ? 'idle' : 'offline');
  },

  // ¿Error de fila que no se resolverá reintentando (constraint/valor inválido)?
  // Distingue de los transitorios (red) para no bloquear toda la cola por una fila mala.
  _isPermanentRowError(e) {
    const code = String((e && (e.code || e.error_code)) || '');
    if (/^(22|23)/.test(code)) return true;          // data exception / integrity constraint (Postgres)
    const msg = String(e?.message || e?.error_description || '').toLowerCase();
    return /violates|check constraint|invalid input|foreign key|not-null|out of range|value too long|duplicate key/.test(msg);
  },

  async _upsert(table, record) {
    if (!this.client) return;
    // Algunas columnas en Supabase son GENERATED (calculadas por la DB) o derivadas
    // y no admiten valores enviados desde el cliente. Las quitamos antes del upsert.
    // Si no hacemos esto, Postgres rechaza con "cannot insert a non-DEFAULT value into column …"
    // y la cola se atasca.
    const GENERATED_BY_TABLE = {
      budget_items: ['amount_eur'],
    };
    const drop = GENERATED_BY_TABLE[table];
    let payload = { ...record };
    if (drop && drop.length) drop.forEach(k => { delete payload[k]; });

    // Resiliencia: si Supabase rechaza por una columna que no existe en su esquema
    // (p. ej. un campo nuevo de la app que aún no se ha migrado en la DB), la quitamos
    // del payload y reintentamos, en lugar de atascar la cola indefinidamente. El dato
    // queda local-only hasta que se cree la columna remota.
    for (let attempt = 0; attempt < 16; attempt++) {
      const { error } = await this.client.from(table).upsert(payload, { onConflict: 'id' });
      if (!error) return;
      const m = /Could not find the '([^']+)' column/i.exec(error.message || '');
      if (m && m[1] && Object.prototype.hasOwnProperty.call(payload, m[1])) {
        delete payload[m[1]];
        console.warn(`[sync] columna '${m[1]}' no existe en '${table}'; se omite del push (queda local-only).`);
        continue;
      }
      throw error;
    }
    throw new Error(`[sync] '${table}': demasiadas columnas desconocidas, abortado`);
  },

  async pullAll() {
    if (!this.enabled || !STATE.profile) return 0;
    let changed = 0;
    // Restamos 60s al `since` por seguridad: cubre clock-drift entre cliente y servidor.
    // Si no hay last_sync previo, usamos 1970 para traer todo desde cero.
    const sinceRaw = await DB.meta('last_sync_' + STATE.profile);
    const since = sinceRaw
      ? new Date(Date.parse(sinceRaw) - 60_000).toISOString()
      : '1970-01-01T00:00:00.000Z';
    // Para tablas con `profile`: filtramos por el perfil dueño (no STATE.profile),
    // así Sergio/Invitado descargan los datos de Rubén.
    // Para tablas hijas: confiamos en la RLS de Supabase (la cabecera x-app-profile lo restringe).
    const ownerForRead = dataProfile();
    for (const t of DB.STORES) {
      try {
        let q = this.client.from(t).select('*').gt('updated_at', since);
        if (['trips','packing_templates','travel_docs','visited_countries'].includes(t)) {
          q = q.eq('profile', ownerForRead);
        }
        const { data, error } = await q;
        if (error) throw error;
        if (data) for (const r of data) { if (await this._mergeRow(t, r)) changed++; }
      } catch (e) {
        console.warn('pull', t, e);
      }
    }
    await DB.meta('last_sync_' + STATE.profile, nowIso());
    return changed;
  },

  async _mergeRow(table, remote) {
    const local = await DB.db.get(table, remote.id);
    if (!local || (local.updated_at || '') < (remote.updated_at || '')) {
      await DB.db.put(table, remote);
      return true;
    }
    return false;
  },

  // Pull automático: trae cambios de otros dispositivos y re-renderiza si hay novedades
  // (sin interrumpir si hay una hoja de edición abierta o un campo enfocado).
  _autoPullBusy: false,
  async autoPull() {
    if (this._autoPullBusy || !this.enabled || !navigator.onLine || document.visibilityState !== 'visible') return;
    this._autoPullBusy = true;
    try {
      const changed = await this.pullAll();
      if (changed > 0 && this._safeToRerender()) { try { Router.render(); } catch (_) {} }
    } catch (e) { console.warn('autoPull', e); }
    finally { this._autoPullBusy = false; }
  },
  _safeToRerender() {
    if (document.querySelector('.sheet.show')) return false;        // editando en una hoja
    const ae = document.activeElement;
    if (ae && /^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName)) return false;
    return true;
  },
};

window.addEventListener('online',  () => { SYNC._setStatus('idle'); SYNC.scheduleFlush(); SYNC.autoPull(); });
window.addEventListener('offline', () => SYNC._setStatus('offline'));
// Mantener todo sincronizado "al momento": al volver el foco / hacerse visible la app
// (p. ej. al coger el otro dispositivo) se traen los cambios; y mientras está visible,
// un pull periódico ligero. Re-renderiza solo si hay novedades y no estás editando.
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') SYNC.autoPull(); });
window.addEventListener('focus', () => SYNC.autoPull());
setInterval(() => SYNC.autoPull(), 20000);

/* ============================================================
   MediaCache — cache de object URLs para fotos locales.
   Recicla URLs revocadas al cambiar de vista para no leak memoria.
   ============================================================ */
const MediaCache = {
  _byId: new Map(),  // id → { url, blob }
  async urlFor(id) {
    if (!id) return null;
    if (this._byId.has(id)) return this._byId.get(id).url;
    const rec = await DB.getMedia(id);
    if (!rec) return null;
    const url = URL.createObjectURL(rec.blob);
    this._byId.set(id, { url, blob: rec.blob });
    return url;
  },
  revokeAll() {
    for (const { url } of this._byId.values()) {
      try { URL.revokeObjectURL(url); } catch (_) {}
    }
    this._byId.clear();
  },
};

const UI = {
  _sheetSubmit: null,
  _previousFocus: null,

  toast(msg) {
    const box = $('#toast-box');
    const t = el('div', { class:'toast', text: msg, role:'status', 'aria-live':'polite' });
    box.appendChild(t);
    setTimeout(() => { t.style.opacity = '0'; t.style.transform = 'translateY(10px)'; }, 1800);
    setTimeout(() => t.remove(), 2200);
  },

  openSheet({ title, body, footer, onSubmit }) {
    // Guardar elemento foco previo para restaurarlo al cerrar
    UI._previousFocus = document.activeElement;
    $('#sheet-title').textContent = title || '';
    const sbody = $('#sheet-body');
    sbody.innerHTML = '';
    if (typeof body === 'string') sbody.innerHTML = body;
    else if (body instanceof Node) sbody.appendChild(body);
    const sfoot = $('#sheet-foot');
    sfoot.innerHTML = '';
    if (footer) {
      if (typeof footer === 'string') sfoot.innerHTML = footer;
      else (Array.isArray(footer) ? footer : [footer]).forEach(b => sfoot.appendChild(b));
    } else {
      sfoot.appendChild(el('button', { class:'btn btn-ghost', onclick: () => UI.closeSheet() }, 'Cerrar'));
    }
    this._sheetSubmit = onSubmit || null;
    // En iOS las teselas de Leaflet (capa GPU) se cuelan por encima de overlays:
    // ocultamos los mapas que quedan DETRÁS de la hoja mientras está abierta.
    document.body.classList.add('sheet-open');
    $('#sheet-back').classList.add('show');
    $('#sheet').classList.add('show');
    // Asociar labels con sus inputs (a11y)
    autoLinkLabels($('#sheet'));
    // Enfocar primer focuseable tras la animación
    setTimeout(() => {
      const focusable = $('#sheet').querySelector(
        'input:not([type="hidden"]):not([disabled]), select:not([disabled]), textarea:not([disabled]), button:not([disabled]), [tabindex]:not([tabindex="-1"])'
      );
      (focusable || $('#sheet')).focus();
    }, 80);
  },

  closeSheet() {
    document.body.classList.remove('sheet-open');
    $('#sheet-back').classList.remove('show');
    $('#sheet').classList.remove('show');
    this._sheetSubmit = null;
    // Restaurar foco al elemento anterior
    setTimeout(() => {
      if (UI._previousFocus && typeof UI._previousFocus.focus === 'function') {
        try { UI._previousFocus.focus(); } catch (_) {}
      }
      UI._previousFocus = null;
    }, 60);
  },

  confirm(message, okLabel = 'Sí, borrar') {
    return new Promise(resolve => {
      const body = el('div', { class:'muted', text: message });
      const danger = okLabel === 'Sí, borrar';
      const yes = el('button', { class:'btn ' + (danger ? 'btn-danger' : 'btn-primary'), onclick: () => { UI.closeSheet(); resolve(true); } }, okLabel);
      const no  = el('button', { class:'btn btn-ghost', onclick: () => { UI.closeSheet(); resolve(false); } }, 'Cancelar');
      UI.openSheet({ title:'Confirmar', body, footer:[no, yes] });
    });
  },

  updateSyncPill() {
    const p = $('#sync-pill'); if (!p) return;
    p.classList.remove('online','offline','error');
    const t = p.querySelector('.t');
    if (!SYNC.enabled) {
      p.classList.add('online');
      t.textContent = navigator.onLine ? 'Local' : 'Sin conexión';
      p.style.cursor = 'default';
      p.onclick = null;
      return;
    }
    if (SYNC.status === 'offline') { p.classList.add('offline'); t.textContent = 'Sin conexión'; }
    else if (SYNC.status === 'syncing') { p.classList.add('online'); t.textContent = 'Sincronizando…'; }
    else if (SYNC.status === 'error') { p.classList.add('error'); t.textContent = 'Error sync'; }
    else { p.classList.add('online'); t.textContent = 'Sincronizado'; }
    // En estado "error" hacemos el pill clickable: muestra detalle + permite acciones.
    p.style.cursor = 'pointer';
    p.title = SYNC.status === 'error' ? 'Toca para ver el error y reintentar' : 'Toca para ver detalle de sync';
    p.onclick = () => UI._openSyncDetail();
  },

  _openSyncDetail() {
    const body = el('div', { class:'sync-detail' });
    body.appendChild(el('div', { class:'sync-row' }, [
      el('span', { class:'sync-label', text:'Estado' }),
      el('span', { class:'sync-val', text:
        !SYNC.enabled ? 'Local (sin Supabase)' :
        SYNC.status === 'error' ? 'Error' :
        SYNC.status === 'syncing' ? 'Sincronizando…' :
        SYNC.status === 'offline' ? 'Sin conexión' : 'Sincronizado'
      }),
    ]));
    body.appendChild(el('div', { class:'sync-row' }, [
      el('span', { class:'sync-label', text:'Perfil enviado' }),
      el('span', { class:'sync-val', text: STATE.profile || '—' }),
    ]));
    if (SYNC.lastError) {
      body.appendChild(el('div', { class:'sync-error-box' }, [
        el('div', { class:'sync-error-title', text:'Último error' }),
        el('pre', { class:'sync-error-msg', text: String(SYNC.lastError).slice(0, 600) }),
      ]));
    }
    // Contar elementos pendientes
    DB.db?.getAll('_pending').then(p => {
      const cnt = (p || []).length;
      body.appendChild(el('div', { class:'sync-row' }, [
        el('span', { class:'sync-label', text:'Cambios pendientes en cola' }),
        el('span', { class:'sync-val', text: String(cnt) }),
      ]));
    }).catch(() => {});

    const retryBtn = el('button', { class:'btn btn-primary', onclick: async () => {
      UI.closeSheet();
      UI.toast('Reintentando…');
      SYNC._setStatus('syncing');
      try { await SYNC.flush(); UI.toast('Sync completado'); Router.render(); }
      catch (e) { console.warn(e); UI.toast('Falló — vuelve a abrir el detalle'); }
    }}, 'Reintentar');

    // Forzar pull desde cero — borra last_sync y trae todo lo que haya en Supabase.
    // Útil cuando los dispositivos llevan datos divergentes y no se reconcilian.
    const forcePullBtn = el('button', { class:'btn', onclick: async () => {
      try {
        UI.closeSheet();
        UI.toast('Trayendo todos los datos…');
        await DB.db.delete('_meta', 'last_sync_' + STATE.profile).catch(() => {});
        SYNC._setStatus('syncing');
        await SYNC.pullAll();
        SYNC._setStatus('idle');
        UI.toast('Pull completo OK');
        Router.render();
      } catch (e) { console.warn(e); UI.toast('Falló — revisa la consola'); }
    }}, 'Pull completo');

    // Forzar push de todo lo local — encola cada fila de cada tabla.
    // Útil cuando se vació la cola por error y hay datos locales que nunca se subieron.
    const forcePushBtn = el('button', { class:'btn', onclick: async () => {
      try {
        UI.closeSheet();
        UI.toast('Subiendo todos los datos locales…');
        let count = 0;
        // Tablas con profile: solo las del perfil activo
        for (const tbl of ['trips','packing_templates','travel_docs','visited_countries']) {
          const rows = await DB.db.getAll(tbl).catch(() => []);
          for (const r of rows) {
            if (r.profile !== STATE.profile) continue;
            await DB.db.add('_pending', { table: tbl, record: r, ts: Date.now() });
            count++;
          }
        }
        // Tablas hijas: encolar todas las filas (la RLS de Supabase filtra por trip→profile)
        const childTables = ['trip_legs','planning_items','budget_items','bookings','inquiries',
          'wishlist_items','day_notes','packing_items','addresses','destination_info',
          'emergency_contacts','phrases','shared_expenses','diary'];
        for (const tbl of childTables) {
          const rows = await DB.db.getAll(tbl).catch(() => []);
          for (const r of rows) {
            await DB.db.add('_pending', { table: tbl, record: r, ts: Date.now() });
            count++;
          }
        }
        UI.toast(`${count} cambios encolados — sincronizando…`);
        SYNC._setStatus('syncing');
        await SYNC.flush();
        SYNC._setStatus('idle');
        UI.toast('Push completo OK');
        Router.render();
      } catch (e) { console.warn(e); UI.toast('Falló — revisa la consola'); }
    }}, 'Push completo');

    const clearBtn = el('button', { class:'btn btn-danger', onclick: async () => {
      if (!confirm('¿Vaciar la cola de cambios pendientes? Los datos locales NO se borran; quedará todo sin enviar a Supabase hasta que vuelvas a editar algo.')) return;
      try {
        const all = await DB.db.getAll('_pending');
        for (const p of all) await DB.db.delete('_pending', p.id);
        SYNC.lastError = null;
        SYNC._setStatus('idle');
        UI.closeSheet();
        UI.toast('Cola vaciada');
      } catch (e) { console.warn(e); UI.toast('No se pudo vaciar la cola'); }
    }}, 'Vaciar cola');

    UI.openSheet({
      title: 'Sincronización',
      body,
      footer: [
        el('button', { class:'btn btn-ghost', onclick: () => UI.closeSheet() }, 'Cerrar'),
        clearBtn,
        forcePushBtn,
        forcePullBtn,
        retryBtn,
      ],
    });
  },
};

// Asocia automáticamente cada <label> con su <input>/<select>/<textarea> hermano
// dentro de un .form-row. Esto da labels programáticos sin tener que pasar `for`
// manualmente en cada uno de los ~60 form-rows del editor.
function autoLinkLabels(root) {
  if (!root) return;
  root.querySelectorAll('.form-row').forEach(row => {
    const label = row.querySelector(':scope > label:not([for])');
    if (!label) return;
    const ctrl = row.querySelector(':scope > input[id], :scope > select[id], :scope > textarea[id]');
    if (ctrl) label.htmlFor = ctrl.id;
  });
}

// Focus trap dentro del sheet — Tab cicla; Shift+Tab cicla hacia atrás.
document.addEventListener('keydown', (e) => {
  if (e.key !== 'Tab') return;
  const sheet = document.getElementById('sheet');
  if (!sheet || !sheet.classList.contains('show')) return;
  const focusables = Array.from(sheet.querySelectorAll(
    'input:not([type="hidden"]):not([disabled]), select:not([disabled]), textarea:not([disabled]), button:not([disabled]), [tabindex]:not([tabindex="-1"]), a[href]'
  )).filter(el => el.offsetParent !== null);
  if (focusables.length === 0) return;
  const first = focusables[0];
  const last = focusables[focusables.length - 1];
  if (e.shiftKey && document.activeElement === first) {
    e.preventDefault(); last.focus();
  } else if (!e.shiftKey && document.activeElement === last) {
    e.preventDefault(); first.focus();
  }
});

// click fuera y botón cierran sheet — registrados directamente,
// no dentro de DOMContentLoaded, porque los elementos ya existen
// en el DOM cuando este script se ejecuta (está al final del body).
// Esto evita que en algunos navegadores móviles los listeners
// nunca se enganchen si DCL ya se ha disparado.
(function attachSheetCloseHandlers(){
  const close = () => UI.closeSheet();
  document.getElementById('sheet-back')?.addEventListener('click', close);
  document.getElementById('sheet-close')?.addEventListener('click', close);
  // tap fallback para Safari iOS si el click no se propaga bien
  document.getElementById('sheet-close')?.addEventListener('touchend', (e) => {
    e.preventDefault(); close();
  }, { passive: false });
})();

// Gesto "volver" deslizando desde el borde IZQUIERDO hacia la derecha (estilo Chrome),
// solo en táctil. Cierra el overlay de tarjetas o el sheet abierto; si no, vuelve atrás.
(function attachEdgeBackGesture(){
  const EDGE = 28, THRESH = 84;
  let st = null;
  const ind = el('div', { id:'edge-back-ind', html: svg('back') });
  document.body.appendChild(ind);
  const reset = () => { ind.style.opacity = '0'; ind.style.transform = 'translateY(-50%)'; };
  document.addEventListener('touchstart', (e) => {
    if (e.touches.length !== 1) { st = null; return; }
    const tch = e.touches[0];
    st = (tch.clientX <= EDGE) ? { x: tch.clientX, y: tch.clientY } : null;
  }, { passive:true });
  document.addEventListener('touchmove', (e) => {
    if (!st || e.touches.length !== 1) return;
    const tch = e.touches[0];
    const dx = tch.clientX - st.x, dy = Math.abs(tch.clientY - st.y);
    if (dy > 44 && dy > dx) { st = null; reset(); return; }   // gesto vertical → cancelar
    if (dx > 10) { ind.style.opacity = String(Math.min(1, dx / THRESH)); ind.style.transform = `translateY(-50%) translateX(${Math.min(dx * 0.4, 34)}px)`; }
  }, { passive:true });
  document.addEventListener('touchend', (e) => {
    if (!st) { reset(); return; }
    const tch = e.changedTouches[0];
    const dx = tch.clientX - st.x, dy = Math.abs(tch.clientY - st.y);
    st = null; reset();
    if (dx > THRESH && dy < 70) {
      const flashClose = document.querySelector('.flashview .flash-close');
      if (flashClose) { flashClose.click(); return; }
      const sheet = document.getElementById('sheet');
      if (sheet && sheet.classList.contains('show')) { UI.closeSheet(); return; }
      const back = document.getElementById('btn-back');
      if (back && !back.hidden) back.click();
    }
  }, { passive:true });
  document.addEventListener('touchcancel', () => { st = null; reset(); });
})();
// Enter dentro de un sheet (en input, no en textarea) → dispara el botón primario
// del footer. Permite guardar formularios sin levantar el dedo del teclado.
document.addEventListener('keydown', (e) => {
  if (e.key !== 'Enter' || e.shiftKey || e.ctrlKey || e.metaKey || e.altKey) return;
  const sheet = document.getElementById('sheet');
  if (!sheet || !sheet.classList.contains('show')) return;
  const tag = (e.target?.tagName || '').toUpperCase();
  // Ignorar dentro de textarea, botones (su Enter ya dispara click) o contenteditable
  if (tag === 'TEXTAREA' || tag === 'BUTTON' || tag === 'SELECT') return;
  if (e.target?.isContentEditable) return;
  // Dentro de un input → buscamos el botón principal y lo pulsamos
  if (tag !== 'INPUT') return;
  const primary = sheet.querySelector('.sheet-foot .btn-primary')
    || sheet.querySelector('.sheet-foot button:last-child:not(.btn-ghost):not(.btn-danger)');
  if (primary && !primary.disabled) {
    e.preventDefault();
    primary.click();
  }
});

const GlobalSearch = {
  // Normalización: quita acentos/diacríticos y pasa a minúscula.
  // "Curaçao" → "curacao", "Andalucía" → "andalucia", "2026" → "2026".
  _norm(s) {
    // Normaliza para que la búsqueda ignore tildes, acentos y caracteres especiales.
    //   1) NFD descompone "á" en "a" + "´", "ç" en "c" + "¸", "ñ" en "n" + "~".
    //   2) Quita las marcas combinantes (U+0300–U+036F).
    //   3) Pasa a minúscula.
    //   4) Sustituye cualquier carácter que no sea letra/dígito por espacio
    //      (así "Curaçao · Willemstad + lagunas" → "curacao willemstad lagunas").
    //   5) Colapsa espacios.
    return (s || '').toString()
      .normalize('NFD')
      .replace(/[̀-ͯ]/g, '')
      .toLowerCase()
      .replace(/[^a-z0-9\s]/g, ' ')
      .replace(/\s+/g, ' ')
      .trim();
  },

  // Tokens textuales asociados a una fecha ISO (yyyy-mm-dd):
  //  - "octubre", "oct", "2026", "octubre 2026", "oct 2026", "10", "10/2026", "2026-10".
  // Así "octubre" o "oct 26" matchea, y "2026" o "2026-10" también.
  _dateTokens(iso) {
    if (!iso) return '';
    const MONTHS = ['enero','febrero','marzo','abril','mayo','junio',
                    'julio','agosto','septiembre','octubre','noviembre','diciembre'];
    const SHORT  = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
    const d = new Date(iso + 'T00:00:00');
    if (isNaN(d.getTime())) return '';
    const m = d.getMonth();
    const y = d.getFullYear();
    const mm = String(m + 1).padStart(2, '0');
    return [
      MONTHS[m], SHORT[m],
      `${MONTHS[m]} ${y}`, `${SHORT[m]} ${y}`,
      `${y}`, `${y}-${mm}`, `${mm}/${y}`,
      `${m+1}`,
      iso,
    ].join(' ');
  },

  // Construye el "haystack": cadena normalizada con TODA la info searchable de un item.
  _buildHaystack(parts) {
    return this._norm(parts.filter(Boolean).join(' '));
  },

  async open() {
    if (!STATE.profile) return;
    const trips = await DB.listByProfile('trips', dataProfile());
    const corpus = [];
    for (const t of trips) {
      // Haystack del viaje: nombre + ciudad + país + tokens de fechas (mes/año)
      const tripParts = [
        t.name, t.city, t.country,
        this._dateTokens(t.start_date),
        this._dateTokens(t.end_date),
      ];
      const tripHaystack = this._buildHaystack(tripParts);
      corpus.push({
        type:'trip', tripId:t.id,
        label:t.name,
        sub:[t.city, t.country].filter(Boolean).join(', '),
        tab:'resumen',
        haystack: tripHaystack,
      });

      // Hijos heredan el haystack del viaje + sus propios campos.
      // Así si buscas "Curaçao" salen también las paradas del viaje a Curaçao.
      const plan = await DB.listByTrip('planning_items', t.id);
      plan.forEach(p => {
        corpus.push({
          type:'parada', tripId:t.id, tripName:t.name,
          label:p.title,
          sub:[p.place_name, p.address, p.notes].filter(Boolean).join(' · '),
          tab:'planning',
          haystack: tripHaystack + ' ' + this._buildHaystack([
            p.title, p.place_name, p.address, p.notes,
            this._dateTokens(p.day_date),
            this._dateTokens(p.consultation_planned_d1),
          ]),
        });
      });

      if (canSeeMoney()) {
        const bud = await DB.listByTrip('budget_items', t.id);
        bud.forEach(b => {
          corpus.push({
            type:'gasto', tripId:t.id, tripName:t.name,
            label:b.concept,
            sub:`${fmtMoney(b.amount, b.currency || 'EUR')} · ${b.notes || ''}`,
            tab:'presu',
            haystack: tripHaystack + ' ' + this._buildHaystack([
              b.concept, b.notes, b.category, this._dateTokens(b.date),
            ]),
          });
        });
      }

      const bks = await DB.listByTrip('bookings', t.id);
      bks.forEach(b => {
        const sd = b.structured_data || {};
        corpus.push({
          type:'reserva', tripId:t.id, tripName:t.name,
          label:(b.type + ' · ' + (sd.nombre || sd.aerolinea || '')).trim(),
          sub: Object.values(sd).filter(Boolean).slice(0,3).join(' · '),
          tab:'reservas',
          haystack: tripHaystack + ' ' + this._buildHaystack([
            b.type, ...Object.values(sd),
            this._dateTokens(b.date),
          ]),
        });
      });
    }

    const body = el('div', {}, [
      el('div', { class:'form-row' }, [
        el('input', { id:'gs-input', type:'search',
          placeholder:'Nombre, destino, país, "octubre 2026"…',
          autocomplete:'off',
          oninput: (e) => render(e.target.value) }),
        el('div', { class:'field-hint', text: `${corpus.length} elementos. Busca por nombre, ciudad, país, mes o año (varias palabras = todas deben coincidir). Esc cierra.` }),
      ]),
      el('div', { id:'gs-results', class:'list', style:{maxHeight:'50vh', overflowY:'auto', marginTop:'8px'} }),
    ]);

    const render = (q) => {
      const box = document.getElementById('gs-results');
      if (!box) return;
      box.innerHTML = '';
      const needle = this._norm((q || '').trim());
      if (!needle) return;
      // Tokens AND: cada palabra debe estar en el haystack (orden libre).
      const tokens = needle.split(/\s+/).filter(Boolean);
      const hits = corpus.filter(it => {
        const h = it.haystack || '';
        return tokens.every(tok => h.includes(tok));
      }).slice(0, 50);

      hits.forEach(it => {
        const TYPES = { trip:'Viaje', parada:'Parada', gasto:'Gasto', reserva:'Reserva' };
        box.appendChild(el('div', { class:'list-item', style:{cursor:'pointer'},
          onclick: () => {
            UI.closeSheet();
            STATE.currentTripId = it.tripId;
            STATE.currentTab = it.tab;
            Router.go('trip', { tripId: it.tripId, tab: it.tab });
          }
        }, [
          el('div', { class:'li-main' }, [
            el('div', { class:'li-title' }, [
              el('span', { class:'tag', text: TYPES[it.type] }),
              ' ',
              el('span', { text: it.label || '(sin título)' }),
            ]),
            el('div', { class:'li-sub', text: [
              it.tripName && it.type !== 'trip' ? `en ${it.tripName}` : null,
              it.sub
            ].filter(Boolean).join(' — ') }),
          ]),
        ]));
      });
      if (!hits.length) box.appendChild(el('div', { class:'muted', style:{padding:'12px'}, text:'Sin resultados.' }));
    };

    UI.openSheet({
      title:'Buscar',
      body,
      footer:[el('button', { class:'btn btn-ghost', onclick: () => UI.closeSheet() }, 'Cerrar')],
    });
    setTimeout(() => document.getElementById('gs-input')?.focus(), 100);
  }
};

const Theme = {
  apply() {
    const t = STATE.theme;
    if (t === 'auto') document.documentElement.removeAttribute('data-tema');
    else document.documentElement.setAttribute('data-tema', t);
  },
  cycle() {
    STATE.theme = STATE.theme === 'claro' ? 'oscuro' : STATE.theme === 'oscuro' ? 'auto' : 'claro';
    localStorage.setItem('viajes_theme', STATE.theme);
    Theme.apply();

/* ============================================================
   ROUTER
   ============================================================ */
const Router = {
  async go(view, opts={}) {
    STATE.view = view;
    if (view === 'trip') STATE.currentTripId = opts.tripId || STATE.currentTripId;
    if (opts.tab) STATE.currentTab = opts.tab;
    await this.render();
  },

  _setDocTitle() {
    const base = 'Viajes';
    if (STATE.view === 'profile') { document.title = 'Elegir perfil · ' + base; return; }
    if (STATE.view === 'trips')   { document.title = base; return; }
    if (STATE.view === 'perfil')  { document.title = 'Mi perfil · ' + base; return; }
    if (STATE.view === 'trip') {
      DB.get('trips', STATE.currentTripId).then(t => {
        if (!t) { document.title = base; return; }
        const tabLabel = ({
          resumen:'Resumen', planning:'Planning', presu:'Presupuesto',
          maleta:'Maleta', reservas:'Reservas', mapa:'Mapa',
          destino:'Ficha destino', gastos:'Compartir gastos', diario:'Diario',
        })[STATE.currentTab] || '';
        document.title = (tabLabel ? `${tabLabel} · ` : '') + t.name + ' · ' + base;
      }).catch(() => { document.title = base; });
    }
  },

  // Re-render conservando la posición de scroll (para ediciones in situ, p. ej. el
  // título/color de un día, donde saltar arriba del todo es molesto).
  async renderKeepScroll() {
    const sc = document.scrollingElement || document.documentElement;
    const y = sc ? sc.scrollTop : 0;
    await this.render();
    const s = document.scrollingElement || document.documentElement;
    if (s) { s.scrollTop = y; requestAnimationFrame(() => { s.scrollTop = y; }); }
  },

  async render() {
    const root = $('#view-root');
    const back = $('#btn-back');
    const title = $('#topbar-title');
    const fab = $('#fab');

    if (STATE.view === 'profile') {
      $('#profile-screen').hidden = false;
      $('#app').hidden = true;
      document.body.classList.remove('readonly');
      return;
    }
    $('#profile-screen').hidden = true;
    $('#app').hidden = false;
    document.body.classList.toggle('readonly', isReadonly());

    fab.hidden = true;
    back.hidden = STATE.view === 'trips';
    back.onclick = async () => {
      if (STATE.view === 'trip')  return Router.go('trips');
      if (STATE.view === 'perfil')return Router.go('trips');
    };
    // Limpiar slot de acciones del topbar — cada vista lo rellena si lo necesita.
    const extras = document.getElementById('topbar-extras');
    if (extras) extras.innerHTML = '';
    // Quitar/poner clase del body para que el CSS sepa la vista activa
    document.body.classList.toggle('view-trip', STATE.view === 'trip');
    // Actualizar el avatar del topbar con la inicial del perfil activo
    const initEl = document.getElementById('profile-initial');
    if (initEl) {
      const pf = PROFILES.find(p => p.id === STATE.profile);
      initEl.textContent = pf?.initial || '?';
      initEl.className = 'profile-initial profile-' + (STATE.profile || 'invitado');
    }

    root.classList.remove('fade');
    // (Antes se forzaba un reflow para repetir la animación de entrada en CADA render,
    //  lo que hacía un "mini-zoom" molesto al guardar. La animación queda solo en la
    //  carga inicial.)

    // Wrap dispatch en try/catch para que un error nunca deje el main vacío silenciosamente.
    try {
      if (STATE.view === 'trips')  await Trips.render(root, title, fab);
      else if (STATE.view === 'trip')   await TripDetail.render(root, title, fab);
      else if (STATE.view === 'perfil') await PerfilView.render(root, title, fab);
      else { STATE.view = 'trips'; await Trips.render(root, title, fab); }
      // Title dinámico — refleja la vista actual
      Router._setDocTitle();
      // Asociar labels en lo renderizado
      autoLinkLabels(root);
      return;
    } catch (err) {
      console.error('Router.render', err);
      try {
        root.innerHTML = '';
        root.appendChild(el('div', { class:'render-error' }, [
          el('strong', { text:'No se pudo cargar la vista' }),
          'Ha ocurrido un error al renderizar esta pantalla. Esto suele deberse a una versión cacheada antigua.',
          el('code', { text: String(err?.message || err) }),
          el('div', { style:{marginTop:'12px', display:'flex', gap:'8px', flexWrap:'wrap'} }, [
            el('button', { class:'btn btn-sm', onclick: () => window.location.reload() }, 'Recargar'),
            el('button', { class:'btn btn-sm', onclick: async () => {
              try {
                if ('caches' in window) for (const k of await caches.keys()) await caches.delete(k);
                if (navigator.serviceWorker) {
                  const regs = await navigator.serviceWorker.getRegistrations();
                  for (const r of regs) await r.unregister();
                }
              } catch (e) { console.warn(e); }
              window.location.reload(true);
            }}, 'Vaciar caché y recargar'),
            el('button', { class:'btn btn-sm btn-danger', onclick: async () => {
              if (!confirm('Esto BORRA todos tus viajes locales y reinicia la app. ¿Continuar?')) return;
              try {
                if ('caches' in window) for (const k of await caches.keys()) await caches.delete(k);
                if (navigator.serviceWorker) {
                  const regs = await navigator.serviceWorker.getRegistrations();
                  for (const r of regs) await r.unregister();
                }
                await new Promise(res => { const r = indexedDB.deleteDatabase('viajes'); r.onsuccess=res; r.onerror=res; r.onblocked=res; });
                localStorage.clear();
              } catch (e) { console.warn(e); }
              window.location.reload(true);
            }}, 'Reset total (borra todo)'),
          ]),
        ]));
      } catch (e2) { /* nothing more to do */ }
    }
  },
};

  mount() {

    PROFILES.forEach(p => {
      const btn = el('button', { class:'profile-btn', onclick: () => ProfilePicker.choose(p.id) }, [

        el('div', { class:'profile-info' }, [
