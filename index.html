  async openPlanningEditor(t, existing=null) {
    if (!canEdit()) { UI.toast('Modo lector — no puedes modificar'); return; }
    // Busca un budget_item vinculado a este planning_item (lo hubo o no).
    // Sirve para precargar el importe en el editor y para no duplicar al guardar.
    let linkedBudget = null;
    if (existing?.id) {
      try {
        const all = await DB.listByTrip('budget_items', t.id);
        linkedBudget = all.find(b => b.planning_item_id === existing.id) || null;
      } catch (_) {}
    }
    const it = existing || {
      id: uuid(), trip_id: t.id, type:'lugar',
      day_date: t.start_date || todayIso(), time:'', title:'',
      place_name:'', lat:null, lng:null, gmaps_url:'', address:'', notes:'', order_index:0,
      status: null,                       // se setea según el tipo al renderizar
      in_consultation: false,             // legacy, derivado de status
      consultation_url:'', consultation_price:null, consultation_currency: t.default_currency || 'EUR',
      consultation_query_date: todayIso(),
      consultation_planned_d1:null, consultation_planned_t1:null,
      consultation_planned_d2:null, consultation_planned_t2:null,
      metadata: {},
    };
    if (!it.metadata) it.metadata = {};
    // Estado inicial: respeta lo que tenga, o default por_iniciar si el tipo requiere reserva
    let currentStatus = itemStatus(it);

    let searchTimer = null;
    const doSearch = async (q) => {
      const box = $('#plan-search-results');
      box.innerHTML = '';
      if (!q || q.length < 3) return;
      if (!navigator.onLine) {
        box.innerHTML = '<div class="search-result muted">Sin conexión: introduce manualmente.</div>';
        return;
      }
      try {
        const url = `https://nominatim.openstreetmap.org/search?format=json&limit=5&q=${encodeURIComponent(q)}`;
        const r = await fetch(url, { headers: { 'Accept-Language':'es', 'User-Agent': CFG.appName } });
        const data = await r.json();
        data.forEach(p => {
          const node = el('div', { class:'search-result', text: p.display_name, onclick: () => {
            it.place_name = p.display_name.split(',')[0];
            it.address = p.display_name;
            it.lat = parseFloat(p.lat); it.lng = parseFloat(p.lon);
            it.gmaps_url = gmapsUrl(it.lat, it.lng);
            const fTitle = $('#f-title'); if (fTitle) fTitle.value = it.title || it.place_name;
            const fPlace = $('#f-place'); if (fPlace) fPlace.value = it.place_name;
            const fAddr  = $('#f-address'); if (fAddr) fAddr.value = it.address;
            // Limpiamos el input de búsqueda para que se vea que "ha registrado" la selección
            const fSearch = $('#f-search'); if (fSearch) fSearch.value = '';
            box.innerHTML = '';
            // Refrescar la confirmación visual del lugar elegido
            refreshSelectedPlace();
          }});
          box.appendChild(node);
        });
      } catch (e) { console.warn(e); }
    };

    // Bloque dinámico de fechas para transporte/vuelo/coche — visible SIEMPRE
    // que aplica (no solo en modo consulta). El usuario rellena UNA vez los datos
    // y se reutilizan al confirmar la reserva.
    const transportDatesBlock = el('div', { id:'transport-dates', class:'form-row' });
    const renderTransportDates = () => {
      const type = $('#f-type')?.value || it.type;
      transportDatesBlock.innerHTML = '';
      const labels = {
        coche:      { d1:'Recogida',     d2:'Devolución', withTime:false, header:'Fechas del alquiler' },
        vuelo:      { d1:'Fecha salida', d2:'Fecha llegada', withTime:true, header:'Fechas del vuelo' },
        transporte: { d1:'Salida',       d2:'Llegada', withTime:true, header:'Fechas del transporte' },
      }[type];
      if (!labels) { transportDatesBlock.style.display = 'none'; return; }
      transportDatesBlock.style.display = '';
      const d1 = it.consultation_planned_d1 || it.day_date || '';
      const d2 = it.consultation_planned_d2 || '';
      transportDatesBlock.appendChild(el('label', { text: labels.header }));
      if (labels.withTime) {
        transportDatesBlock.appendChild(el('div', { class:'form-grid-2' }, [
          el('div', { class:'form-row' }, [ el('label',{class:'muted', style:{fontSize:'12px'}, text: labels.d1}), el('input',{id:'tr-d1', type:'date', value:d1}) ]),
          el('div', { class:'form-row' }, [ el('label',{class:'muted', style:{fontSize:'12px'}, text:'Hora'}), el('input',{id:'tr-t1', type:'time', value: it.consultation_planned_t1 || ''}) ]),
        ]));
        transportDatesBlock.appendChild(el('div', { class:'form-grid-2' }, [
          el('div', { class:'form-row' }, [ el('label',{class:'muted', style:{fontSize:'12px'}, text: labels.d2}), el('input',{id:'tr-d2', type:'date', value:d2}) ]),
          el('div', { class:'form-row' }, [ el('label',{class:'muted', style:{fontSize:'12px'}, text:'Hora'}), el('input',{id:'tr-t2', type:'time', value: it.consultation_planned_t2 || ''}) ]),
        ]));
      } else {
        transportDatesBlock.appendChild(el('div', { class:'form-grid-2' }, [
          el('div', { class:'form-row' }, [ el('label',{class:'muted', style:{fontSize:'12px'}, text: labels.d1}), el('input',{id:'tr-d1', type:'date', value:d1}) ]),
          el('div', { class:'form-row' }, [ el('label',{class:'muted', style:{fontSize:'12px'}, text: labels.d2}), el('input',{id:'tr-d2', type:'date', value:d2}) ]),
        ]));
      }
    };
    // Alias para retrocompat — la API antigua del editor (openConfirmPlanning) llama renderConsultationDates
    const renderConsultationDates = renderTransportDates;

    // Bloque "Fechas del hotel" — siempre visible cuando type=hotel, fuera del bloque de consulta.
    // No son obligatorios; si se rellenan, el hotel aparece automáticamente en todas las noches
    // del rango (último item del día), y el check-out aparece al inicio del último día.
    const hotelDatesBlock = el('div', { id:'hotel-dates', class:'form-row' }, [
      el('label', { text:'Check-in / Check-out (opcional)' }),
      el('div', { class:'form-grid-2' }, [
        el('div', { class:'form-row' }, [
          el('label', { text:'Check-in' }),
          el('input', { id:'h-d1', type:'date', value: it.consultation_planned_d1 || '' }),
        ]),
        el('div', { class:'form-row' }, [
          el('label', { text:'Hora' }),
          el('input', { id:'h-t1', type:'time', value: it.consultation_planned_t1 || '' }),
        ]),
      ]),
      el('div', { class:'form-grid-2' }, [
        el('div', { class:'form-row' }, [
          el('label', { text:'Check-out' }),
          el('input', { id:'h-d2', type:'date', value: it.consultation_planned_d2 || '' }),
        ]),
        el('div', { class:'form-row' }, [
          el('label', { text:'Hora' }),
          el('input', { id:'h-t2', type:'time', value: it.consultation_planned_t2 || '' }),
        ]),
      ]),
      el('div', { class:'field-hint', text:'Si rellenas las fechas, el hotel aparecerá automáticamente como noche al final de cada día del rango. El check-out se mostrará al inicio del último día con su hora.' }),
    ]);
    const refreshHotelDatesVisibility = () => {
      hotelDatesBlock.style.display = (($('#f-type')?.value || it.type) === 'hotel') ? '' : 'none';
    };

    const consultaBlock = el('div', { class:'consulta-fields', id:'consulta-block' }, [
      el('h4', { text:'Datos de la consulta (opcional)' }),
      el('p', { class:'muted', style:{fontSize:'12.5px', margin:'0 0 10px'},
        text:'Si has anotado precio y enlace mientras comparas opciones, va aquí. Las fechas y resto de datos están arriba en el bloque del vuelo/hotel/coche.' }),
      el('div', { class:'form-grid-2' }, [
        el('div', { class:'form-row' }, [
          el('label', { text:'Enlace' }),
          el('input', { id:'cq-url', type:'url', value: it.consultation_url || '', placeholder:'https://…' }),
        ]),
        el('div', { class:'form-row' }, [
          el('label', { text:'Fecha de consulta' }),
          el('input', { id:'cq-date', type:'date', value: it.consultation_query_date || todayIso() }),
        ]),
      ]),
      el('div', { class:'form-grid-2' }, [
        el('div', { class:'form-row num' }, [
          el('label', { text:'Precio' }),
          el('input', { id:'cq-price', type:'number', step:'0.01', value: it.consultation_price ?? '', placeholder:'0,00' }),
        ]),
        el('div', { class:'form-row' }, [
          el('label', { text:'Moneda' }),
          el('input', { id:'cq-cur', type:'text', value: it.consultation_currency || t.default_currency || 'EUR' }),
        ]),
      ]),
    ]);

    // Selector de estado (4 opciones) — solo visible si el tipo requiere reserva
    const statusPicker = el('div', { class:'status-picker', id:'status-picker' });
    const statusRow = el('div', { class:'form-row', id:'status-row' }, [
      el('label', { text:'Estado' }),
      statusPicker,
    ]);
    const renderStatusPicker = () => {
      const td = typeDef($('#f-type')?.value || it.type);
      const visible = td.requiresBooking;
      statusRow.style.display = visible ? '' : 'none';
      consultaBlock.style.display = visible ? '' : 'none';
      if (!visible) return;
      statusPicker.innerHTML = '';
      STATUS_PLANNING.forEach(s => {
        const isActive = currentStatus === s.id || (!currentStatus && s.id === 'por_iniciar');
        const opt = el('button', {
          type:'button',
          class: `opt s-${s.id}` + (isActive ? ' active' : ''),
          onclick: () => {
            currentStatus = s.id;
            renderStatusPicker();
          }
        }, [
          el('div', { class:'dot' }),
          el('div', {}, [
            el('div', { class:'lbl', text: s.label }),
            el('div', { class:'h', text: s.hint }),
          ]),
        ]);
        statusPicker.appendChild(opt);
      });
    };

    // Si abre por primera vez y el tipo requiere reserva pero no tiene status, asigna por_iniciar
    if (!currentStatus && typeDef(it.type).requiresBooking) currentStatus = 'por_iniciar';

    // Campo Hora: dinámico según tipo.
    //  - Hotel → oculto entero (las horas son check-in/check-out).
    //  - Lugar/playa → grid 2 columnas: "Hora inicio" + "Hora fin" (ambas opcionales).
    //  - Resto → solo "Hora".
    const fTimeInput     = el('input', { id:'f-time',     type:'time', value: it.time || '' });
    const fEndTimeInput  = el('input', { id:'f-end-time', type:'time', value: it.end_time || '' });
    const startCell = el('div', { class:'form-row', style:{margin:0} }, [
      el('label', { class:'muted', style:{fontSize:'12px'}, text:'Hora inicio' }),
      fTimeInput,
    ]);
    const endCell = el('div', { class:'form-row', id:'f-end-time-cell', style:{margin:0} }, [
      el('label', { class:'muted', style:{fontSize:'12px'}, text:'Hora fin (opcional)' }),
      fEndTimeInput,
    ]);
    const timeGrid = el('div', { class:'form-grid-2', id:'f-time-grid' }, [startCell, endCell]);
    const timeFieldWrap = el('div', { class:'form-row', id:'f-time-wrap' }, [
      el('label', { id:'f-time-label', text:'Hora' }),
      timeGrid,
    ]);
    const refreshTimeVisibility = () => {
      const type = $('#f-type')?.value || it.type;
      const td = typeDef(type);
      timeFieldWrap.style.display = td.hideTime ? 'none' : '';
      // Mostrar "Hora fin" sólo en lugar/playa; en el resto, ocultar la celda
      // y dejar la "Hora" suelta ocupando todo el ancho.
      const showEnd = (type === 'lugar' || type === 'playa');
      endCell.style.display = showEnd ? '' : 'none';
      timeGrid.style.gridTemplateColumns = showEnd ? '' : '1fr';
      const lbl = $('#f-time-label'); if (lbl) lbl.textContent = showEnd ? 'Horario (opcional)' : 'Hora';
    };

    // Bloque de zonas horarias — solo para vuelo / transporte intercontinental
    const tzBlock = el('div', { id:'tz-block', class:'form-row' }, [
      el('label', { text:'Zonas horarias (vuelos internacionales)' }),
      el('div', { class:'form-grid-2' }, [
        el('div', { class:'form-row' }, [
          el('label', { class:'muted', style:{fontSize:'12px'}, text:'Origen' }),
          el('input', { id:'f-origin-tz', type:'text', list:'tz-list', value: it.origin_tz || '', placeholder:'Europe/Madrid' }),
        ]),
        el('div', { class:'form-row' }, [
          el('label', { class:'muted', style:{fontSize:'12px'}, text:'Destino' }),
          el('input', { id:'f-dest-tz', type:'text', list:'tz-list', value: it.dest_tz || '', placeholder:'Asia/Tokyo' }),
        ]),
      ]),
      el('datalist', { id:'tz-list' }, COMMON_TIMEZONES.map(tz => el('option', { value: tz }))),
      el('div', { class:'field-hint', text:'IANA TZ. Útil para vuelos transoceánicos: muestra la hora local de cada extremo en el planning.' }),
    ]);
    const refreshTzVisibility = () => {
      const type = $('#f-type')?.value || it.type;
      tzBlock.style.display = (type === 'vuelo' || type === 'transporte') ? '' : 'none';
    };

    // Bloque de metadata específica por tipo (aerolínea, asiento, modelo coche…)
    const metadataBlock = el('div', { id:'metadata-block', class:'form-row' });
    const renderMetadata = () => {
      const type = $('#f-type')?.value || it.type;
      const def = PLANNING_METADATA[type];
      metadataBlock.innerHTML = '';
      if (!def) { metadataBlock.style.display = 'none'; return; }
      metadataBlock.style.display = '';
      metadataBlock.appendChild(el('label', { text: def.label }));
      const grid = el('div', { class:'form-grid-2' });
      const single = el('div');
      const meta = it.metadata || {};
      def.fields.forEach(f => {
        let node;
        if (f.type === 'seats') {
          node = renderSeatsField(f, Array.isArray(meta.asientos) ? meta.asientos : []);
        } else {
          node = el('div', { class:'form-row' }, [
            el('label', { class:'muted', style:{fontSize:'12px'}, text: f.label }),
            el('input', { id:`meta-${f.id}`, type: f.type || 'text', value: meta[f.id] || '', placeholder: f.placeholder || '' }),
          ]);
        }
        if (f.full) single.appendChild(node);
        else grid.appendChild(node);
      });
      if (grid.children.length) metadataBlock.appendChild(grid);
      if (single.children.length) metadataBlock.appendChild(single);
    };

    // Componente repetidor de asientos: cada fila [nombre] [asiento] [×]
    // y un botón "+ Añadir pasajero" debajo.
    const renderSeatsField = (f, initial) => {
      const wrap = el('div', { class:'form-row', id:'meta-seats-wrap' });
      wrap.appendChild(el('label', { class:'muted', style:{fontSize:'12px'}, text: f.label + ' (uno por pasajero)' }));
      const list = el('div', { class:'seats-list', style:{display:'flex', flexDirection:'column', gap:'8px'} });
      wrap.appendChild(list);

      const addRow = (nombre = '', asiento = '') => {
        const row = el('div', { class:'seats-row', style:{display:'grid', gridTemplateColumns:'1fr 100px 36px', gap:'8px', alignItems:'center'} }, [
          el('input', { class:'seat-name',    type:'text', value: nombre,  placeholder:'Nombre del pasajero' }),
          el('input', { class:'seat-seat',    type:'text', value: asiento, placeholder:'25K' }),
          el('button', { type:'button', class:'icon-btn', 'aria-label':'Eliminar fila',
            onclick: () => row.remove(), html: svg('trash') }),
        ]);
        list.appendChild(row);
      };
      (initial.length ? initial : [{nombre:'', asiento:''}]).forEach(s => addRow(s.nombre || '', s.asiento || ''));

      wrap.appendChild(el('button', { type:'button', class:'btn btn-sm', style:{marginTop:'8px'},
        onclick: () => addRow('', '') }, [ el('span',{html:svg('plus')}), 'Añadir pasajero' ]));
      return wrap;
    };

    // Bloque "Lugar + dirección + buscador" — útil solo para tipos con localización física
    // (lugar, comida, hotel, actividad). Vuelo/coche/transporte usan sus propios campos.
    const TYPES_WITH_PLACE = ['lugar', 'playa', 'comida', 'hotel', 'actividad', 'otro'];

    // Confirmación visual del lugar seleccionado — se refresca cuando el usuario
    // pulsa un resultado de Nominatim o cuando reabre un item con coords.
    const selectedPlaceBlock = el('div', { id:'selected-place-block' });
    const refreshSelectedPlace = () => {
      selectedPlaceBlock.innerHTML = '';
      if (it.lat == null || it.lng == null) return;
      selectedPlaceBlock.appendChild(el('div', { class:'place-selected' }, [
        el('span', { class:'icon', html: svg('check') }),
        el('div', { class:'name', text: it.place_name || it.address || 'Lugar seleccionado' }),
        el('div', { class:'coords', text: `${Number(it.lat).toFixed(4)}, ${Number(it.lng).toFixed(4)}` }),
        el('button', { type:'button', class:'clear', title:'Quitar coordenadas',
          'aria-label':'Quitar lugar seleccionado',
          html: svg('close'),
          onclick: () => { it.lat = null; it.lng = null; it.gmaps_url = ''; refreshSelectedPlace(); }
        }),
      ]));
    };

    const placeBlock = el('div', { id:'place-block' }, [
      el('div', { class:'form-row' }, [
        el('label', { text:'Buscar lugar (online)' }),
        el('input', { id:'f-search', type:'text', placeholder:'Ej. Museo del Prado Madrid',
          oninput: (e) => { clearTimeout(searchTimer); searchTimer = setTimeout(() => doSearch(e.target.value), 800); } }),
        el('div', { id:'plan-search-results', class:'search-results', style:{display:'block'} }),
        selectedPlaceBlock,
        el('div', { class:'field-hint', text:'Si no encuentras, escribe los campos manualmente abajo.' }),
      ]),
      el('div', { class:'form-grid-2' }, [
        el('div', { class:'form-row' }, [
          el('label', { text:'Lugar' }),
          el('input', { id:'f-place', type:'text', value: it.place_name || '' }),
        ]),
        timeFieldWrap,
      ]),
      el('div', { class:'form-row' }, [
        el('label', { text:'Dirección' }),
        el('input', { id:'f-address', type:'text', value: it.address || '' }),
      ]),
    ]);
    const refreshPlaceVisibility = () => {
      const type = $('#f-type')?.value || it.type;
      placeBlock.style.display = TYPES_WITH_PLACE.includes(type) ? '' : 'none';
    };

    // timeFieldWrap independiente para tipos sin "lugar": para vuelo/coche/transporte
    // la hora va aparte (porque tienen sus propias horas de salida/llegada).
    const standaloneTimeWrap = el('div', { class:'form-row', id:'f-time-standalone' });
    const refreshStandaloneTime = () => {
      const type = $('#f-type')?.value || it.type;
      // Para tipos sin place_block y sin hideTime, mostrar la hora suelta
      const td = typeDef(type);
      if (!TYPES_WITH_PLACE.includes(type) && !td.hideTime && type !== 'vuelo' && type !== 'transporte') {
        standaloneTimeWrap.style.display = '';
        standaloneTimeWrap.innerHTML = '';
        standaloneTimeWrap.appendChild(el('label', { text:'Hora' }));
        const inp = el('input', { id:'f-time-alt', type:'time', value: it.time || '' });
        standaloneTimeWrap.appendChild(inp);
      } else {
        standaloneTimeWrap.style.display = 'none';
      }
    };

    // Selector de color del borde (solo lugar/playa) — verde/amarillo/rojo o sin color.
    // Marca cuánta certeza tienes sobre incluir esa parada (sin tocar el fondo de la card).
    let currentBorder = it.border_color || null;
    const borderBlock = el('div', { class:'form-row', id:'border-block' });
    const renderBorderPicker = () => {
      const type = $('#f-type')?.value || it.type;
      const visible = (type === 'lugar' || type === 'playa');
      borderBlock.style.display = visible ? '' : 'none';
      if (!visible) return;
      borderBlock.innerHTML = '';
      borderBlock.appendChild(el('label', { text:'Color del borde (opcional)' }));
      const grid = el('div', { class:'border-color-grid' });
      // Opción "ninguno"
      const noneActive = !currentBorder;
      grid.appendChild(el('button', {
        type:'button',
        class:'border-color-swatch b-ninguno' + (noneActive ? ' active' : ''),
        'aria-pressed': noneActive ? 'true' : 'false',
        onclick: () => { currentBorder = null; renderBorderPicker(); }
      }, [
        el('div', { class:'dot' }),
        el('span', { text:'Sin marcar' }),
      ]));
      BORDER_COLORS.forEach(c => {
        const active = currentBorder === c.id;
        grid.appendChild(el('button', {
          type:'button',
          class:`border-color-swatch b-${c.id}` + (active ? ' active' : ''),
          'aria-pressed': active ? 'true' : 'false',
          title: c.hint,
          onclick: () => { currentBorder = c.id; renderBorderPicker(); }
        }, [
          el('div', { class:'dot' }),
          el('span', { text: c.label }),
        ]));
      });
      borderBlock.appendChild(grid);
      borderBlock.appendChild(el('div', { class:'field-hint', text:'Verde = sitio seguro; amarillo = dudoso/a mover; rojo = quitar o no visto. Solo se colorea el borde.' }));
    };

    const body = el('div', {}, [
      el('div', { class:'form-grid-2' }, [
        el('div', { class:'form-row' }, [
          el('label', { text:'Tipo' }),
          el('select', { id:'f-type', onchange: () => {
            // Si cambia a tipo con reserva y no había status, asume por_iniciar
            const td = typeDef($('#f-type').value);
            if (td.requiresBooking && !currentStatus) currentStatus = 'por_iniciar';
            if (!td.requiresBooking) currentStatus = null;
            renderConsultationDates();
            renderStatusPicker();
            refreshTimeVisibility();
            refreshHotelDatesVisibility();
            refreshTzVisibility();
            renderMetadata();
            refreshPlaceVisibility();
            refreshStandaloneTime();
            renderBorderPicker();
          }},
            TYPES_PLANNING.map(o => el('option', { value:o.id, selected: it.type===o.id?true:null }, o.label))
          ),
        ]),
        el('div', { class:'form-row' }, [
          el('label', { text:'Día' }),
          el('input', { id:'f-day', type:'date', value: it.day_date || '' }),
        ]),
      ]),
      statusRow,
      el('div', { class:'form-row' }, [
        el('label', { text:'Título (auto si lo dejas vacío)' }),
        el('input', { id:'f-title', type:'text', value: it.title || '' }),
      ]),
      // Bloque metadata específica según tipo (campos dinámicos)
      metadataBlock,
      // Bloque lugar + búsqueda + dirección (solo tipos con localización física)
      placeBlock,
      // Hora suelta para tipos sin place_block (actividad sin lugar, etc.) — raro
      standaloneTimeWrap,
      // Selector de color del borde (solo lugar/playa)
      borderBlock,
      // Fechas dinámicas del hotel (check-in/check-out + horas)
      hotelDatesBlock,
      // Fechas de salida/llegada/recogida/devolución para vuelo/transporte/coche
      transportDatesBlock,
      // Zonas horarias
      tzBlock,
      el('div', { class:'form-row' }, [
        el('label', { text:'Notas' }),
        el('textarea', { id:'f-notes' }, it.notes || ''),
      ]),
      consultaBlock,
      el('div', { class:'form-row', id:'f-amount-row' }, [
        el('label', { text:'Importe asociado (crea gasto)' }),
        // Concepto opcional — por defecto el título de la parada al guardar si lo dejas vacío
        el('input', { id:'f-concept', type:'text', placeholder:'Concepto (por defecto: título)',
          value: linkedBudget?.concept || '' }),
        el('div', { class:'form-grid-2', style:{marginTop:'8px'} }, [
          el('input', { id:'f-amount', type:'number', step:'0.01', placeholder:'0,00',
            value: linkedBudget ? String(linkedBudget.amount) : '' }),
          el('input', { id:'f-cur', type:'text', placeholder:t.default_currency || 'EUR',
            value: linkedBudget ? (linkedBudget.currency || t.default_currency || 'EUR') : (t.default_currency || 'EUR') }),
        ]),
        el('div', { class:'field-hint', text:'Opcional. Si pones importe se crea un gasto vinculado en estado "planeado". Vacíalo a 0 para eliminarlo.' }),
      ]),
    ]);
    setTimeout(() => {
      renderConsultationDates(); renderStatusPicker();
      refreshTimeVisibility(); refreshHotelDatesVisibility(); refreshTzVisibility();
      renderMetadata(); refreshPlaceVisibility(); refreshStandaloneTime();
      renderBorderPicker(); refreshSelectedPlace();
    }, 0);

    const collect = () => {
      const type = $('#f-type').value;
      let title = ($('#f-title').value || '').trim();
      // Si no hay título, generar uno por defecto según el tipo y los datos disponibles
      if (!title) {
        title = TripDetail._defaultTitle(type, t);
        if (!title) { UI.toast('Pon un título'); return false; }
      }
      it.title = title;
      it.type = type;
      const td = typeDef(it.type);
      it.day_date = $('#f-day').value || null;
      // Hora: si el tipo la oculta (hotel), no la guardamos. Si hay placeBlock usa f-time;
      // si no, busca f-time-alt (tipos sin lugar como otro).
      const hourSource = $('#f-time')?.value || $('#f-time-alt')?.value || '';
      it.time = td.hideTime ? null : (hourSource || null);
      // Hora fin: solo aplica a lugar/playa (campo opcional). Si el tipo cambia
      // a otro y antes había end_time guardada, la limpiamos para no contaminar.
      if (it.type === 'lugar' || it.type === 'playa') {
        it.end_time = ($('#f-end-time')?.value || '').trim() || null;
      } else {
        it.end_time = null;
      }
      // place_name / address: solo si el tipo los expone
      const TYPES_WITH_PLACE_LOCAL = ['lugar', 'playa', 'comida', 'hotel', 'actividad', 'otro'];
      if (TYPES_WITH_PLACE_LOCAL.includes(it.type)) {
        it.place_name = $('#f-place')?.value.trim() || null;
        it.address = $('#f-address')?.value.trim() || null;
      } else {
        // Para vuelo/coche/transporte mantenemos los valores anteriores si los había
        // (no hay UI para editarlos directamente). Pueden venir del buscador Nominatim.
      }
      it.notes = $('#f-notes').value;
      if (it.lat != null) it.gmaps_url = gmapsUrl(it.lat, it.lng);

      // Metadata específica del tipo
      const metaDef = PLANNING_METADATA[it.type];
      if (metaDef) {
        const meta = {};
        metaDef.fields.forEach(f => {
          if (f.type === 'seats') {
            // Repetidor: recolectar filas (nombre, asiento)
            const rows = Array.from(document.querySelectorAll('#meta-seats-wrap .seats-row'));
            const seats = rows.map(r => ({
              nombre:  (r.querySelector('.seat-name')?.value  || '').trim(),
              asiento: (r.querySelector('.seat-seat')?.value  || '').trim(),
            })).filter(s => s.nombre || s.asiento);
            if (seats.length) meta.asientos = seats;
          } else {
            const v = ($(`#meta-${f.id}`)?.value || '').trim();
            if (v) meta[f.id] = v;
          }
        });
        it.metadata = meta;
      } else {
        it.metadata = {};
      }
      // Zonas horarias (vuelos / transporte intercontinental)
      if (it.type === 'vuelo' || it.type === 'transporte') {
        it.origin_tz = ($('#f-origin-tz')?.value || '').trim() || null;
        it.dest_tz = ($('#f-dest-tz')?.value || '').trim() || null;
      } else {
        it.origin_tz = null; it.dest_tz = null;
      }
      // Status
      it.status = td.requiresBooking ? (currentStatus || 'por_iniciar') : null;
      it.in_consultation = (it.status === 'en_consulta'); // legacy compat
      // Color del borde (solo para lugar/playa)
      it.border_color = (it.type === 'lugar' || it.type === 'playa') ? (currentBorder || null) : null;
      // Datos de consulta/reserva — siempre persistir si el tipo requiere reserva
      if (td.requiresBooking) {
        it.consultation_url = ($('#cq-url')?.value || '').trim() || null;
        it.consultation_query_date = $('#cq-date')?.value || null;
        const priceRaw = $('#cq-price')?.value;
        it.consultation_price = (priceRaw === '' || priceRaw == null) ? null : (parseFloat(priceRaw) || 0);
        it.consultation_currency = ($('#cq-cur')?.value || 'EUR').toUpperCase();
        // Hotel: check-in/out vienen de h-d1/h-d2 (fuera del bloque consulta).
        // Vuelo/coche/transporte: vienen de tr-d1/tr-d2 (bloque transport-dates).
        if (it.type === 'hotel') {
          it.consultation_planned_d1 = $('#h-d1')?.value || null;
          it.consultation_planned_t1 = $('#h-t1')?.value || null;
          it.consultation_planned_d2 = $('#h-d2')?.value || null;
          it.consultation_planned_t2 = $('#h-t2')?.value || null;
        } else if (['vuelo', 'coche', 'transporte'].includes(it.type)) {
          it.consultation_planned_d1 = $('#tr-d1')?.value || null;
          it.consultation_planned_t1 = $('#tr-t1')?.value || null;
          it.consultation_planned_d2 = $('#tr-d2')?.value || null;
          it.consultation_planned_t2 = $('#tr-t2')?.value || null;
        }
        if (!it.day_date && it.consultation_planned_d1) it.day_date = it.consultation_planned_d1;
      }
      return true;
    };

    const save = el('button', { class:'btn btn-primary', onclick: async () => {
      try {
        if (!collect()) return;
        await DB.put('planning_items', it);
        if (!it.in_consultation) {
          const amtRaw = ($('#f-amount').value || '').trim();
          const amt = parseFloat(amtRaw);
          const cur = (($('#f-cur').value || '').trim() || 'EUR').toUpperCase();
          // Concepto opcional — si vacío, usa el título de la parada
          const concept = ($('#f-concept')?.value || '').trim() || it.title;
          if (linkedBudget) {
            if (amtRaw === '' || isNaN(amt) || amt <= 0) {
              // Usuario borró el importe → eliminamos el budget vinculado
              await DB.remove('budget_items', linkedBudget.id);
            } else {
              // Actualizamos el existente (mismo id, no duplica)
              const rate = FX.rateToEur(cur) ?? 1;
              linkedBudget.amount = amt;
              linkedBudget.currency = cur;
              linkedBudget.rate_to_eur = rate;
              linkedBudget.amount_eur = +(amt * rate).toFixed(2);
              linkedBudget.concept = concept;
              linkedBudget.date = it.day_date;
              await DB.put('budget_items', linkedBudget);
            }
          } else if (!isNaN(amt) && amt > 0) {
            // No había budget vinculado y el usuario ha puesto importe → crear nuevo
            const rate = FX.rateToEur(cur) ?? 1;
            await DB.put('budget_items', {
              id: uuid(), trip_id: t.id, planning_item_id: it.id,
              category: it.type === 'comida' ? 'comida' : (it.type === 'transporte' ? 'transporte' : 'actividades'),
              concept, amount: amt, currency: cur,
              rate_to_eur: rate, amount_eur: +(amt * rate).toFixed(2),
              status: 'planeado', date: it.day_date,
            });
          }
        }
        UI.toast('Guardado');
      } catch (err) { console.error(err); UI.toast('Error al guardar'); }
      finally { UI.closeSheet(); Router.render(); }
    }}, 'Guardar');

    // El botón Confirmar aparece si existe y su estado es por_iniciar o en_consulta
    const confirmBtn = (existing && (currentStatus === 'en_consulta' || currentStatus === 'por_iniciar')) ? el('button', {
      class:'btn', style:{background:'var(--status-curso)', color:'#fff', borderColor:'transparent'},
      onclick: async () => {
        try { if (!collect()) return; await DB.put('planning_items', it); }
        catch (err) { console.error(err); }
        UI.closeSheet();
        setTimeout(() => TripDetail.openConfirmPlanning(t, it), 280);
      }
    }, [ el('span', { html: svg('check') }), 'Confirmar' ]) : null;

    const delBtn = existing ? el('button', { class:'btn btn-danger', onclick: async () => {
      const ok = await UI.confirm('¿Borrar esta parada? Irá a la papelera; podrás recuperarla desde "Editar viaje".');
      if (!ok) return;
      await DB.remove('planning_items', it.id);
      UI.closeSheet(); UI.toast('A papelera'); Router.render();
    }}, 'Borrar') : null;

    UI.openSheet({
      title: existing ? 'Editar parada' : 'Nueva parada',
      body,
      footer:[delBtn, el('button', { class:'btn btn-ghost', onclick: () => UI.closeSheet() }, 'Cancelar'), confirmBtn, save].filter(Boolean),
    });
  },

  // Marca/desmarca un item del planning como "visto". Persistencia + actualización
  // visual local sin re-render — así no se pierde la posición de scroll.
  async toggleVisited(it) {
    if (!canEdit()) { UI.toast('Modo lector — no puedes modificar'); return; }
    it.visited = !it.visited;
    it.visited_at = it.visited ? new Date().toISOString() : null;
    try {
      await DB.put('planning_items', it);
      // Buscar la card en el DOM por su data-id y togglear las clases / botón.
      const card = document.querySelector(`.timeline-item[data-id="${CSS.escape(it.id)}"]`);
      if (card) {
        card.classList.toggle('visited', !!it.visited);
        const btn = card.querySelector('.li-actions button[aria-pressed]');
        if (btn) {
          btn.classList.toggle('btn-visited-on', !!it.visited);
          btn.setAttribute('aria-pressed', it.visited ? 'true' : 'false');
          btn.setAttribute('title', it.visited ? 'Marcar como no visto' : 'Marcar como visto');
        }
      }
      UI.toast(it.visited ? 'Marcado como visto' : 'Sin marcar');
    } catch (e) {
      console.warn('toggleVisited', e);
      it.visited = !it.visited; // revert estado en memoria
      UI.toast('No se pudo guardar');
    }
  },

  openConfirmPlanning(t, it) {
    if (!canEdit()) return;
    const tdef = it.type;
    const d1 = it.consultation_planned_d1 || it.day_date || todayIso();
    const d2 = it.consultation_planned_d2 || '';
    const t1 = it.consultation_planned_t1 || it.time || '';
    const t2 = it.consultation_planned_t2 || '';

    let dateFields;
    if (tdef === 'hotel') {
      dateFields = el('div', { class:'form-grid-2' }, [
        el('div', { class:'form-row' }, [ el('label',{text:'Check-in'}),  el('input',{id:'cf-d1', type:'date', value: d1 }) ]),
        el('div', { class:'form-row' }, [ el('label',{text:'Check-out'}), el('input',{id:'cf-d2', type:'date', value: d2 }) ]),
      ]);
    } else if (tdef === 'vuelo' || tdef === 'transporte') {
      dateFields = el('div', {}, [
        el('div', { class:'form-grid-2' }, [
          el('div', { class:'form-row' }, [ el('label',{text:'Salida'}),  el('input',{id:'cf-d1', type:'date', value: d1 }) ]),
          el('div', { class:'form-row' }, [ el('label',{text:'Hora salida'}), el('input',{id:'cf-t1', type:'time', value: t1 }) ]),
        ]),
        el('div', { class:'form-grid-2' }, [
          el('div', { class:'form-row' }, [ el('label',{text:'Llegada'}), el('input',{id:'cf-d2', type:'date', value: d2 || d1 }) ]),
          el('div', { class:'form-row' }, [ el('label',{text:'Hora llegada'}), el('input',{id:'cf-t2', type:'time', value: t2 }) ]),
        ]),
      ]);
    } else if (tdef === 'coche') {
      dateFields = el('div', { class:'form-grid-2' }, [
        el('div', { class:'form-row' }, [ el('label',{text:'Recogida'}),    el('input',{id:'cf-d1', type:'date', value: d1 }) ]),
        el('div', { class:'form-row' }, [ el('label',{text:'Devolución'}), el('input',{id:'cf-d2', type:'date', value: d2 }) ]),
      ]);
    } else {
      dateFields = el('div', { class:'form-grid-2' }, [
        el('div', { class:'form-row' }, [ el('label',{text:'Día'}),  el('input',{id:'cf-d1', type:'date', value: d1 }) ]),
        el('div', { class:'form-row' }, [ el('label',{text:'Hora'}), el('input',{id:'cf-t1', type:'time', value: t1 }) ]),
      ]);
    }

    const body = el('div', {}, [
      el('p', { class:'muted', style:{marginTop:0}, text:`Confirmando: ${it.title}` }),
      dateFields,
      el('div', { class:'form-grid-2' }, [
        el('div', { class:'form-row num' }, [
          el('label', { text:'Importe final' }),
          el('input', { id:'cf-amount', type:'number', step:'0.01', value: it.consultation_price ?? '' }),
        ]),
        el('div', { class:'form-row' }, [
          el('label', { text:'Moneda' }),
          el('input', { id:'cf-cur', type:'text', value: it.consultation_currency || t.default_currency || 'EUR' }),
        ]),
      ]),
      el('div', { class:'form-row' }, [
        el('label', { text:'Localizador / referencia (opcional)' }),
        el('input', { id:'cf-loc', type:'text', placeholder:'Ej. XB7H9K' }),
      ]),
      el('div', { class:'field-hint', text:'Al confirmar se quita el resaltado amarillo y se crea un gasto en el presupuesto (estado "reservado").' }),
    ]);

    const confirm = el('button', {
      class:'btn btn-primary',
      onclick: async () => {
        try {
          const amount = parseFloat($('#cf-amount').value);
          if (isNaN(amount) || amount < 0) { UI.toast('Pon un importe válido'); return; }
          const currency = ($('#cf-cur').value || 'EUR').toUpperCase();
          const newD1 = $('#cf-d1')?.value || it.day_date;
          const newD2 = $('#cf-d2')?.value || null;
          const newT1 = $('#cf-t1')?.value || it.time;
          const newT2 = $('#cf-t2')?.value || null;
          const locator = $('#cf-loc')?.value?.trim() || null;

          it.status = 'confirmado';
          it.in_consultation = false;
          it.day_date = newD1;
          // Si el tipo oculta hora (hotel) no la usamos aunque cf-t1 venga rellenado
          it.time = typeDef(it.type).hideTime ? null : newT1;
          if (locator) it.notes = (it.notes ? it.notes + '\n' : '') + `Localizador: ${locator}`;
          await DB.put('planning_items', it);

          const rate = FX.rateToEur(currency) ?? 1;
          const budgetItem = {
            id: uuid(), trip_id: t.id, planning_item_id: it.id,
            category: ({hotel:'alojamiento', vuelo:'transporte', coche:'transporte', transporte:'transporte', comida:'comida'})[it.type] || 'actividades',
            concept: it.title, amount, currency,
            rate_to_eur: rate, amount_eur: +(amount * rate).toFixed(2),
            status: 'reservado', date: newD1,
          };
          await DB.put('budget_items', budgetItem);

          if (['vuelo','hotel','coche'].includes(it.type)) {
            const sd = { nombre: it.title };
            if (it.type === 'hotel') { if (newD1) sd.checkin = newD1; if (newD2) sd.checkout = newD2; }
            if (it.type === 'vuelo') { if (newD1) sd.fecha_salida = newD1; if (newT1) sd.hora_salida = newT1; if (newD2) sd.fecha_llegada = newD2; if (newT2) sd.hora_llegada = newT2; }
            if (it.type === 'coche') { if (newD1) sd.recogida = newD1; if (newD2) sd.devolucion = newD2; }
            if (locator) sd.localizador = locator;
            await DB.put('bookings', {
              id: uuid(), trip_id: t.id, type: it.type,
              structured_data: sd, ref_date: newD1, ref_time: newT1,
              doc_name: it.consultation_url ? `Enlace consulta` : null,
              doc_url: it.consultation_url || null,
            });
          }

          if (newD2 && newD2 !== newD1 && ['hotel','coche','vuelo'].includes(it.type)) {
            const t2title = it.type === 'hotel' ? `Hotel ${it.title}: Check-out`
              : it.type === 'coche' ? `Coche ${it.title}: Devolución`
              : `Vuelo ${it.title}: Llegada`;
            await DB.put('planning_items', {
              id: uuid(), trip_id: t.id, leg_id: null,
              day_date: newD2, time: typeDef(it.type).hideTime ? null : (newT2 || null),
              type: it.type, title: t2title, place_name: it.place_name,
              lat:null, lng:null, gmaps_url:null, address: it.address,
              notes: locator ? `Localizador: ${locator}` : '',
              order_index: 0, in_consultation: false, status: 'confirmado',
            });
          }

          UI.toast('Confirmado');
          UI.closeSheet();

          const others = (await DB.listByTrip('planning_items', t.id))
            .filter(p => p.id !== it.id && p.type === it.type
                     && (itemStatus(p) === 'en_consulta' || itemStatus(p) === 'por_iniciar')
                     && (p.day_date === newD1 || p.consultation_planned_d1 === newD1));
          if (others.length) {
            setTimeout(() => TripDetail._askDiscardOthers(t, it, others), 350);
          } else {
            Router.render();
          }
        } catch (err) {
          console.error('confirm planning', err);
          UI.toast('Error al confirmar');
          UI.closeSheet(); Router.render();
        }
      }
    }, [ el('span', { html: svg('check') }), 'Confirmar definitivamente' ]);

    UI.openSheet({
      title:'Confirmar reserva',
      body,
      footer:[el('button', { class:'btn btn-ghost', onclick: () => UI.closeSheet() }, 'Atrás'), confirm],
    });
  },

  _askDiscardOthers(t, confirmed, others) {
    const tdef = TYPES_PLANNING.find(p => p.id === confirmed.type)?.label || confirmed.type;
    const body = el('div', {}, [
      el('p', { text: `Tenías ${others.length} consulta${others.length>1?'s':''} más de tipo "${tdef}" para el mismo día. ¿Quieres moverlas a la papelera?` }),
      el('div', { class:'list', style:{marginTop:'12px'} },
        others.map(o => el('div', { class:'list-item' }, [
          el('div', { class:`dot-type ${o.type}`, style:{display:'inline-block'} }),
          el('div', { class:'li-main' }, [

            el('div', { class:'li-sub', text: o.consultation_price != null && canSeeMoney()

    UI.openSheet({ title:'¿Eliminar las otras consultas?', body, footer:[no, yes] });

  /* ----- Presupuesto ----- */
  async tabPresupuesto(root, t) {
    const items = (await DB.listByTrip('budget_items', t.id))
      .sort((a, b) => (b.date || '').localeCompare(a.date || ''));

    if (canEdit()) {
      root.appendChild(el('div', { class:'toolbar' }, [
        el('button', { class:'btn btn-primary', onclick: () => TripDetail.openBudgetEditor(t) }, [
          el('span', { html: svg('plus') }), 'Añadir gasto'
        ]),
        el('button', { class:'btn btn-sm', onclick: async () => {
          await FX.load(); UI.toast('Tasas actualizadas'); Router.render();
        }}, [ el('span', { html: svg('refresh') }), 'Actualizar tasas' ]),
      ]));
    }

    // Métricas
    const total = items.reduce((a, b) => a + (Number(b.amount_eur) || 0), 0);
    const paid  = items.filter(b => b.status === 'pagado').reduce((a, b) => a + (Number(b.amount_eur) || 0), 0);
    const reservado = items.filter(b => b.status === 'reservado').reduce((a, b) => a + (Number(b.amount_eur) || 0), 0);
    const pendiente = items.filter(b => b.status === 'planeado').reduce((a, b) => a + (Number(b.amount_eur) || 0), 0);
    const target = Number(t.budget_target) || 0;

    root.appendChild(el('div', { class:'metric-grid' }, [
      el('div', { class:'metric' }, [ el('div',{class:'label',text:'Total previsto'}), el('div',{class:'value',text:fmtMoney(total,'EUR')}) ]),
      el('div', { class:'metric' }, [ el('div',{class:'label',text:'Pagado'}), el('div',{class:'value',text:fmtMoney(paid,'EUR')}) ]),
      el('div', { class:'metric' }, [ el('div',{class:'label',text:'Reservado'}), el('div',{class:'value',text:fmtMoney(reservado,'EUR')}) ]),
      el('div', { class:'metric' }, [ el('div',{class:'label',text:'Por reservar'}), el('div',{class:'value',text:fmtMoney(pendiente,'EUR')}) ]),
    ]));

    // Barra de progreso respecto al objetivo
    if (target > 0) {
      const pct = Math.min(100, (total / target) * 100);
      const over = total > target;
      root.appendChild(el('h2', { class:'section-title', text:'Progreso vs. objetivo' }));
      root.appendChild(el('div', { class:'card' }, el('div', { class:'card-body' }, [
        el('div', { class:'budget-progress' }, [
          el('div', { class:'budget-bar' }, el('div', {
            class:'budget-fill' + (over ? ' over' : ''),
            style:{ width: pct.toFixed(1) + '%' }
          })),
          el('div', { class:'budget-legend' }, [
            el('span', { class:'mono', text: fmtMoney(total, 'EUR') }),
            el('span', { class:'muted', text: ' / ' + fmtMoney(target, 'EUR') + (over ? ' (te has pasado)' : '') }),
          ]),
        ]),
      ])));
    }

    if (!items.length) {
      root.appendChild(el('div', { class:'empty' }, [
        el('div', { class:'icon', html: svg('money') }),
        el('h3', { text:'Sin gastos todavía' }),
        el('p', { text:'Añade los gastos a medida que los planifiques o ya los hayas pagado. Verás aquí el desglose por categoría.' }),
      ]));
      return;
    }

    // Donut + barras por categoría
    const CAT_COLORS = { transporte:'#0ea5e9', alojamiento:'#a855f7', comida:'#f97316', actividades:'#10b981', compras:'#ec4899', otros:'#64748b' };
    const byCat = {};
    items.forEach(i => { byCat[i.category] = (byCat[i.category] || 0) + (Number(i.amount_eur) || 0); });
    const maxVal = Math.max(1, ...Object.values(byCat));
    const totalByCat = Object.values(byCat).reduce((a, b) => a + b, 0) || 1;

    const donutWrap = el('div', { class:'budget-split' });
    const NS = 'http://www.w3.org/2000/svg';
    const donut = document.createElementNS(NS, 'svg');
    donut.setAttribute('viewBox', '0 0 36 36'); donut.setAttribute('class', 'donut');
    const ring = document.createElementNS(NS, 'circle');
    ring.setAttribute('cx','18'); ring.setAttribute('cy','18'); ring.setAttribute('r','15.915');
    ring.setAttribute('fill','none'); ring.setAttribute('stroke','var(--bg-soft)'); ring.setAttribute('stroke-width','4');
    donut.appendChild(ring);
    let acc = 0;
    CATS_BUDGET.forEach(c => {
      const v = byCat[c.id] || 0; if (!v) return;
      const pct = (v / totalByCat) * 100;
      const arc = document.createElementNS(NS, 'circle');
      arc.setAttribute('cx','18'); arc.setAttribute('cy','18'); arc.setAttribute('r','15.915');
      arc.setAttribute('fill','none'); arc.setAttribute('stroke', CAT_COLORS[c.id] || '#94a3b8');
      arc.setAttribute('stroke-width','4');
      arc.setAttribute('stroke-dasharray', `${pct.toFixed(2)} ${(100 - pct).toFixed(2)}`);
      arc.setAttribute('stroke-dashoffset', (100 - acc).toFixed(2));
      arc.setAttribute('transform','rotate(-90 18 18)');
      donut.appendChild(arc);
      acc += pct;
    });
    const txt = document.createElementNS(NS, 'text');
    txt.setAttribute('x','18'); txt.setAttribute('y','19.5'); txt.setAttribute('text-anchor','middle');
    txt.setAttribute('class','donut-total');
    txt.textContent = fmtMoney(total, 'EUR');
    donut.appendChild(txt);
    donutWrap.appendChild(donut);

    const cont = el('div', { class:'budget-bars' });
    CATS_BUDGET.forEach(c => {
      const v = byCat[c.id] || 0; if (!v) return;
      cont.appendChild(el('div', { class:'bar-row' }, [
        el('div', { class:'cat' }, [
          el('span', { style:{display:'inline-block', width:'8px', height:'8px', borderRadius:'50%', background: CAT_COLORS[c.id] || '#94a3b8', marginRight:'6px' } }),
          c.label,
        ]),
        el('div', { class:'bar-wrap' }, el('div', { class:'bar-fill', style:{ width: (v / maxVal * 100).toFixed(1) + '%', background: CAT_COLORS[c.id] || '#94a3b8' } })),
        el('div', { class:'amount mono', text: fmtMoney(v, 'EUR') }),
      ]));
    });
    donutWrap.appendChild(cont);
    root.appendChild(el('h2', { class:'section-title', text:'Por categoría' }));
    root.appendChild(donutWrap);

    // Lista de gastos
    root.appendChild(el('h2', { class:'section-title', text:'Gastos' }));
    const list = el('div', { class:'list' });
    items.forEach(i => {
      const catLabel = CATS_BUDGET.find(c => c.id === i.category)?.label || i.category;
      const statusLabel = STATUS_BUDGET.find(s => s.id === i.status)?.label || i.status;
      list.appendChild(el('div', { class:'list-item' }, [
        el('div', { class:'li-main', onclick: () => TripDetail.openBudgetEditor(t, i) }, [
          el('div', { class:'li-title', text: i.concept }),
          el('div', { class:'li-sub', text: [
            catLabel,
            statusLabel,
            i.date ? fmtDateShort(i.date) : null,
            i.notes ? i.notes.slice(0, 40) : null,
          ].filter(Boolean).join(' · ') }),
        ]),
        el('div', { class:'amount-eur', style:{textAlign:'right', minWidth:'80px'}, text: fmtMoney(i.amount_eur, 'EUR') }),
      ]));
    });
    root.appendChild(list);
  },

      ]),

        el('span', { html: svg('upload') }), 'Importar desde email'
      ]),
      el('div', { class:'gap' }),
      el('div', { class:'segmented' }, [
        el('button', {
          class: TripDetail._reservasView === 'tipo' ? 'active' : '',
          onclick: () => { TripDetail._reservasView = 'tipo'; Router.render(); }
        }, 'Por tipo'),
        el('button', {
          class: TripDetail._reservasView === 'cron' ? 'active' : '',
          onclick: () => { TripDetail._reservasView = 'cron'; Router.render(); }
        }, 'Cronológica'),
      ]),
    ]);
    root.appendChild(toolbar);

    if (!items.length) {
      root.appendChild(el('div', { class:'empty' }, [
        el('div', { class:'icon', html: svg('doc') }),
        el('h3', { text:'Sin reservas' }),
        el('p', { text:'Guarda aquí vuelos, hoteles, trenes, ferries, coches, actividades y seguros — funciona offline.' }),
      ]));
      return;
    }

    if (TripDetail._reservasView === 'cron') {
      // vista cronológica: todas las reservas con fecha, ordenadas
      const withDate = items.filter(b => b.ref_date || TripDetail._inferRefDate(b))
        .map(b => ({ ...b, _refDate: b.ref_date || TripDetail._inferRefDate(b), _refTime: b.ref_time || TripDetail._inferRefTime(b) }))
        .sort((a,b) => (a._refDate || '').localeCompare(b._refDate || '') || (a._refTime || '').localeCompare(b._refTime || ''));
      const withoutDate = items.filter(b => !b.ref_date && !TripDetail._inferRefDate(b));

      let lastDay = null;
      const ul = el('div', { class:'list' });
      withDate.forEach(b => {
        if (b._refDate !== lastDay) {
          ul.appendChild(el('div', { class:'cron-divider', text: fmtDayLong(b._refDate) }));
          lastDay = b._refDate;
        }
        ul.appendChild(this._bookingRow(b, t));
      });
      if (withoutDate.length) {
        ul.appendChild(el('div', { class:'cron-divider', text:'Sin fecha' }));
        withoutDate.forEach(b => ul.appendChild(this._bookingRow(b, t)));
      }
      root.appendChild(ul);
    } else {
      const groups = {};
      TYPES_BOOKING.forEach(tb => groups[tb.id] = []);
      items.forEach(i => { (groups[i.type] = groups[i.type] || []).push(i); });
      for (const tb of TYPES_BOOKING) {
        const list = groups[tb.id]; if (!list || !list.length) continue;
        root.appendChild(el('h2', { class:'section-title', text: tb.label }));
        const ul = el('div', { class:'list' });
        list.forEach(b => ul.appendChild(this._bookingRow(b, t)));
        root.appendChild(ul);
      }
    }
  },

  // Si el usuario no fijó ref_date al editar, intentar deducir del structured_data
  _inferRefDate(b) {
    const d = b.structured_data || {};
    return d.fecha_salida || d.checkin || d.recogida || d.fecha || d.vigencia_hasta || null;
  },
  _inferRefTime(b) {
    const d = b.structured_data || {};
    return d.hora_salida || d.hora || null;
  },

  // Campos de structured_data que son "documentales" (localizadores, números, referencias)
  // y se ocultan a Invitado para no exponer datos sensibles.
  _DOC_FIELDS: new Set(['localizador','poliza','matricula','numero','referencia']),
  // Campos con info económica (precio/importe).
  _MONEY_FIELDS: new Set(['precio','importe','coste','total','price']),

  _bookingRow(b, t) {
    const d = b.structured_data || {};
    const entries = Object.entries(d).filter(([k,v]) => {
      if (!v) return false;
      if (!canSeeDocs()  && TripDetail._DOC_FIELDS.has(k))   return false;
      if (!canSeeMoney() && TripDetail._MONEY_FIELDS.has(k)) return false;
      return true;
    });
    const keys = entries.slice(0,4)
      .map(([k,v]) => `${k.replace(/_/g,' ')}: ${v}`).join(' · ');
    const tdef = TYPES_BOOKING.find(x => x.id === b.type);
    const ref = b.ref_date || TripDetail._inferRefDate(b);
    return el('div', { class:'list-item' }, [
      el('div', { html: svg(bookingIcon(b.type)) }),
      el('div', { class:'li-main', onclick: () => TripDetail.openBookingEditor(t, b) }, [
        el('div', { class:'li-title' }, [
          (tdef?.label || b.type),
          ref ? el('span', { class:'time-pill', style:{marginLeft:'8px'}, text: fmtDateShort(ref) }) : null,
        ].filter(Boolean)),
        el('div', { class:'li-sub', text: keys || 'Sin detalles' }),
        (b.doc_url && canSeeDocs()) ? el('div', { style:{marginTop:'6px'} }, el('a', { href: b.doc_url, target:'_blank', rel:'noopener', text: b.doc_name || 'Documento' })) : null,
      ].filter(Boolean)),
      el('button', { class:'icon-btn', onclick: () => TripDetail.openBookingEditor(t, b), html: svg('edit') }),
    ]);
  },

  // Importa una reserva pegando el cuerpo de un email de confirmación.
  // Sin LLM: heurísticas regex para localizadores, IATA, fechas, horas, importes,
  // números de vuelo. Pre-llena el editor de bookings con lo que detecta.
  openImportBooking(t) {

    const body = el('div', {}, [
      el('p', { class:'muted', style:{marginTop:0}, text:'Pega aquí el cuerpo de un email de confirmación (vuelo, hotel, alquiler). Detectaremos fechas, importes y localizadores y pre-llenaremos la reserva.' }),
      el('div', { class:'form-row' }, [
        el('label', { text:'Texto del email' }),
        el('textarea', { id:'ib-text', style:{minHeight:'180px', fontSize:'12.5px', lineHeight:'1.45'}, placeholder:'From: confirmaciones@iberia.com\nLocalizador: ABC123\nVuelo IB6253 · 1 de marzo de 2027 · 08:00 → 14:30\nImporte: 420,00 €\n…' }),
      ]),
      el('div', { class:'form-row' }, [
        el('label', { text:'Tipo de reserva' }),
        el('select', { id:'ib-type' }, TYPES_BOOKING.map(tb => el('option', { value:tb.id }, tb.label))),
      ]),
    ]);
    const parse = el('button', { class:'btn btn-primary', onclick: () => {

  _parseBookingText(text, type) {
    const out = {
      id: uuid(), trip_id: STATE.currentTripId, type,
      structured_data: {}, doc_name:'', doc_url:'', ref_date:null, ref_time:null,
    };
    const t = text || '';
    const sd = out.structured_data;

    // Localizador: 6 caracteres alfanuméricos en mayúsculas, posiblemente precedido de palabra clave.
    const loc = t.match(/(?:localizador|loc(?:ator)?|c[oó]digo de reserva|booking ref(?:erence)?|reservation code|PNR|reference|c[oó]digo|confirmation(?: code| number)?|n[uú]mero de confirmaci[oó]n)\s*[:\-#]?\s*([A-Z0-9]{5,8})\b/i)
            || t.match(/\b([A-Z0-9]{6})\b(?=.{0,80}(?:vuelo|booking|reserva|hotel))/);
    if (loc) sd.localizador = loc[1].toUpperCase();

    // Importe: cifra seguida de € / EUR / USD / $ o precedida de "Total/Importe"
    const amt = t.match(/(?:total|importe|amount|price|precio)[^\d]*([\d.,]+)\s*(?:€|EUR|usd|\$)/i)
              || t.match(/([\d]{1,3}(?:[.,]\d{3})*(?:[.,]\d{2}))\s*(€|EUR|USD|\$)/);
    if (amt) {
      sd.precio = amt[0].match(/[\d.,]+\s*[€EURUSD$]+/i)?.[0] || amt[0];
    }

    // Fechas (DD/MM/YYYY, DD-MM-YYYY, YYYY-MM-DD)
    const dates = [...t.matchAll(/\b(\d{1,2})[\/\-\.](\d{1,2})[\/\-\.](\d{2,4})\b/g)].map(m => {
      const d = m[1].padStart(2,'0'), mo = m[2].padStart(2,'0'), y = m[3].length === 2 ? '20'+m[3] : m[3];
      return `${y}-${mo}-${d}`;
    });
    const datesISO = [...t.matchAll(/\b(20\d{2})[\/\-](\d{1,2})[\/\-](\d{1,2})\b/g)].map(m => {
      return `${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`;
    });
    const allDates = [...new Set([...dates, ...datesISO])].filter(d => /^\d{4}-\d{2}-\d{2}$/.test(d)).sort();

    // Horas (HH:MM)
    const times = [...t.matchAll(/\b(\d{1,2}):(\d{2})\b/g)].map(m => `${m[1].padStart(2,'0')}:${m[2]}`);

    // Aeropuertos IATA: 3 letras mayúsculas a aisladas o precedidas de "to/from"
    const iataMatches = [...t.matchAll(/\b([A-Z]{3})\b(?=[^A-Z])/g)].map(m => m[1])
      .filter(c => !['EUR','USD','GBP','PNR','VAT','IVA','UTC','GMT','VIP','TUI'].includes(c));

    // Número de vuelo (2 letras + 1-4 dígitos)
    const flight = t.match(/\b([A-Z]{2,3})\s?(\d{1,4})\b/);

    if (type === 'vuelo') {
      if (flight) { sd.aerolinea = flight[1].toUpperCase(); sd.numero = flight[1].toUpperCase() + flight[2]; }
      if (iataMatches.length >= 2) {
        sd.origen = iataMatches[0]; sd.destino = iataMatches[1];
      }
      if (allDates.length) sd.fecha_salida = allDates[0];
      if (allDates.length > 1) sd.fecha_llegada = allDates[1];
      if (times.length) sd.hora_salida = times[0];
      if (times.length > 1) sd.hora_llegada = times[1];
      out.ref_date = sd.fecha_salida; out.ref_time = sd.hora_salida;
    } else if (type === 'hotel') {
      // Hotel: primera fecha = checkin, segunda = checkout
      if (allDates.length) sd.checkin = allDates[0];
      if (allDates.length > 1) sd.checkout = allDates[1];
      // Nombre: primera línea con "Hotel" o capitalized
      const hotelMatch = t.match(/(?:Hotel|Hostal|Hostel|Apartamento|Resort)\s+([^\n,]{2,40})/i);
      if (hotelMatch) sd.nombre = (hotelMatch[0]).trim();
      out.ref_date = sd.checkin;
    } else if (type === 'coche') {
      if (allDates.length) sd.recogida = allDates[0];
      if (allDates.length > 1) sd.devolucion = allDates[1];
      const company = t.match(/(?:Hertz|Avis|Sixt|Europcar|Enterprise|Budget|Goldcar|OK Mobility|Centauro|Alamo|National)/i);
      if (company) sd.compania = company[0];
      out.ref_date = sd.recogida;
    } else if (type === 'tren') {
      if (allDates.length) sd.fecha_salida = allDates[0];
      if (times.length) sd.hora_salida = times[0];
      if (times.length > 1) sd.hora_llegada = times[1];
      const renfe = t.match(/(?:RENFE|AVE|Iryo|Ouigo|SNCF|TGV|Trenitalia|JR|Eurostar)/i);
      if (renfe) sd.compania = renfe[0];
      out.ref_date = sd.fecha_salida;
    }
    return out;
  },

  openBookingEditor(t, existing=null) {

    if (!canEdit()) { UI.toast('Modo lector — no puedes modificar'); return; }
    const b = existing || { id: uuid(), trip_id: t.id, type:'vuelo', structured_data:{}, doc_name:'', doc_url:'', ref_date:null, ref_time:null };
    const FIELDS_BY_TYPE = {
      vuelo:     ['aerolinea','numero','origen','destino','fecha_salida','hora_salida','fecha_llegada','hora_llegada','terminal','localizador'],
      hotel:     ['nombre','direccion','checkin','checkout','localizador'],
      tren:      ['compania','numero','origen','destino','fecha_salida','hora_salida','hora_llegada','coche','asiento','localizador'],
      ferry:     ['compania','origen','destino','fecha_salida','hora_salida','hora_llegada','localizador'],
      coche:     ['compania','recogida','devolucion','matricula','localizador'],
      actividad: ['nombre','lugar','fecha','hora','duracion','localizador'],
      seguro:    ['compania','poliza','telefono','vigencia_hasta'],
      otro:      ['nombre','fecha','referencia'],
    };
    const buildFields = () => {
      const wrap = $('#booking-fields'); wrap.innerHTML = '';
      const type = $('#f-btype').value;
      const fields = FIELDS_BY_TYPE[type] || [];
      fields.forEach(f => {
        const isDate = /^fecha|^checkin|^checkout|^recogida|^devolucion|vigencia/.test(f);
        const isTime = /^hora/.test(f);
        wrap.appendChild(el('div', { class:'form-row' }, [
          el('label', { text: f.replace(/_/g,' ').replace(/^./, c => c.toUpperCase()) }),
          el('input', { id:`d-${f}`, type: isDate ? 'date' : isTime ? 'time' : 'text', value: b.structured_data?.[f] || '' }),
        ]));
      });
    };

    const body = el('div', {}, [
      el('div', { class:'form-row' }, [
        el('label', { text:'Tipo' }),
        el('select', { id:'f-btype', onchange: buildFields },
          TYPES_BOOKING.map(o => el('option', { value:o.id, selected: b.type===o.id?true:null }, o.label))),
      ]),
      el('div', { id:'booking-fields' }),
      el('div', { class:'form-grid-2' }, [
        el('div', { class:'form-row' }, [
          el('label', { text:'Nombre del documento' }),
          el('input', { id:'f-doc-name', type:'text', value: b.doc_name || '', placeholder:'Billete vuelo IB1234' }),
        ]),
        el('div', { class:'form-row' }, [
          el('label', { text:'Enlace al documento' }),
          el('input', { id:'f-doc-url', type:'url', value: b.doc_url || '', placeholder:'https://drive.google.com/…' }),
        ]),
      ]),
      el('div', { class:'field-hint', text:'El documento se abre desde Drive/Dropbox/web — el offline lo gestiona esa app.' }),
    ]);
    setTimeout(buildFields, 0);

    const save = el('button', { class:'btn btn-primary', onclick: async () => {
      try {
        b.type = $('#f-btype').value;
        b.structured_data = {};
        $$('#booking-fields input').forEach(i => {
          const k = i.id.replace('d-','');
          if (i.value) b.structured_data[k] = i.value;
        });
        // ref_date para vista cronológica (deducido del structured_data si no se editó manual)
        b.ref_date = TripDetail._inferRefDate(b) || null;
        b.ref_time = TripDetail._inferRefTime(b) || null;
        b.doc_name = $('#f-doc-name').value.trim() || null;
        b.doc_url = $('#f-doc-url').value.trim() || null;
        await DB.put('bookings', b);
      } catch (err) { console.error(err); UI.toast('Error al guardar'); }
      finally { UI.closeSheet(); Router.render(); }
    }}, 'Guardar');
    const delBtn = existing ? el('button', { class:'btn btn-danger', onclick: async () => {
      const ok = await UI.confirm('¿Borrar reserva?'); if (!ok) return;
      await DB.remove('bookings', b.id); UI.closeSheet(); Router.render();
    }}, 'Borrar') : null;

    UI.openSheet({
      title: existing ? 'Editar reserva' : 'Nueva reserva',
      body,
      footer:[delBtn, el('button', { class:'btn btn-ghost', onclick: () => UI.closeSheet() }, 'Cancelar'), save].filter(Boolean),
    });
  },

  /* ----- Mapa ----- */
  async tabMapa(root, t) {
    const planning = await DB.listByTrip('planning_items', t.id);
    const addresses = await DB.listByTrip('addresses', t.id);

    const pins = [
      ...planning.filter(p => p.lat != null && p.lng != null).map(p => ({ lat:p.lat, lng:p.lng, name:p.title, sub:p.place_name || p.address || '' })),
      ...addresses.filter(a => a.lat != null && a.lng != null).map(a => ({ lat:a.lat, lng:a.lng, name:a.label, sub:a.address || '' })),
    ];

    const container = el('div', { class:'map-container', id:'mapa-container' });
    root.appendChild(container);
    if (!pins.length) {
      root.appendChild(el('p', { class:'muted', style:{marginTop:'12px'}, text:'Aún no hay puntos con coordenadas. Añade un lugar desde Planning buscando con el buscador online.' }));
    }

    setTimeout(() => {
      if (STATE.leaflet) { STATE.leaflet.remove(); STATE.leaflet = null; }
      const map = L.map('mapa-container');
      L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19, attribution: '© OpenStreetMap'
      }).addTo(map);

      if (!pins.length) {
        map.setView([20, 0], 2);
      } else {
        const group = L.featureGroup(pins.map(p => {
          const m = L.marker([p.lat, p.lng]);
          const gm = gmapsUrl(p.lat, p.lng);
          m.bindPopup(`<b>${escHtml(p.name)}</b><br>${escHtml(p.sub)}<br><a href="${gm}" target="_blank">Abrir en Google Maps</a>`);
          return m;
        })).addTo(map);
        map.fitBounds(group.getBounds().pad(0.2));
      }
      STATE.leaflet = map;
    }, 50);
  },

function simplifySettlement(balances) {
  const eps = 0.01;
  const debtors = [];
  const creditors = [];
  for (const [p,v] of Object.entries(balances)) {
    if (v > eps) creditors.push({ p, v });
    else if (v < -eps) debtors.push({ p, v: -v });
  }
  debtors.sort((a,b) => b.v - a.v); creditors.sort((a,b) => b.v - a.v);
  const out = [];
  let i = 0, j = 0;
  while (i < debtors.length && j < creditors.length) {
    const amt = Math.min(debtors[i].v, creditors[j].v);
    if (amt > eps) out.push({ from: debtors[i].p, to: creditors[j].p, amount: +amt.toFixed(2) });
    debtors[i].v -= amt; creditors[j].v -= amt;
    if (debtors[i].v <= eps) i++;
    if (creditors[j].v <= eps) j++;
  }
  return out;
}

/* ============================================================
   Exporter — PDF + JSON
   ============================================================ */
const Exporter = {
  async tripToPdf(t) {
    if (!window.jspdf) { UI.toast('PDF no disponible offline si no se cargó la lib'); return; }
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ unit:'pt', format:'a4' });
    const planning = await DB.listByTrip('planning_items', t.id);
    const budget = await DB.listByTrip('budget_items', t.id);
    const bookings = await DB.listByTrip('bookings', t.id);

    let y = 56;
    const left = 56, right = 540;
    const line = (text, opts={}) => {
      doc.setFont('helvetica', opts.bold ? 'bold' : 'normal');
      doc.setFontSize(opts.size || 11);
      const lines = doc.splitTextToSize(text, right-left);
      lines.forEach(l => {
        if (y > 780) { doc.addPage(); y = 56; }
        doc.text(l, left, y); y += (opts.size || 11) * 1.3;
      });
    };

    line(t.name, { bold:true, size:22 });
    y += 6;
    if (t.start_date && t.end_date) line(`${fmtDate(t.start_date, {day:'numeric',month:'long',year:'numeric'})} – ${fmtDate(t.end_date, {day:'numeric',month:'long',year:'numeric'})}`, { size:12 });
    if (t.city || t.country) line([t.city, t.country].filter(Boolean).join(', '), { size:12 });
    y += 12;

    // Reservas
    if (bookings.length) {
      line('Reservas', { bold:true, size:14 }); y += 4;
      bookings.forEach(b => {
        line(`• ${b.type.toUpperCase()}: ${Object.entries(b.structured_data||{}).map(([k,v]) => `${k} ${v}`).join(' · ')}`);
        if (b.doc_url) line(`  Documento: ${b.doc_name || b.doc_url}`);
      });
      y += 8;
    }

    // Planning
    if (planning.length) {
      line('Planning', { bold:true, size:14 }); y += 4;
      const byDay = {};
      planning.forEach(p => { (byDay[p.day_date || 'Sin fecha'] = byDay[p.day_date || 'Sin fecha'] || []).push(p); });
      Object.keys(byDay).sort().forEach(k => {
        line(k === 'Sin fecha' ? 'Sin fecha' : fmtDayLong(k), { bold:true, size:12 });
        byDay[k].sort((a,b) => (a.time||'').localeCompare(b.time||''));
        byDay[k].forEach(p => {
          line(`  ${p.time ? p.time+' · ' : ''}${p.title}${p.place_name && p.place_name !== p.title ? ' ('+p.place_name+')' : ''}`);
          if (p.address) line(`    ${p.address}`);
        });
        y += 4;
      });
    }

    // Presupuesto resumen
    if (budget.length) {
      line('Presupuesto', { bold:true, size:14 }); y += 4;
      const totalEur = budget.reduce((a,b) => a + (Number(b.amount_eur)||0), 0);
      const byCat = {};
      budget.forEach(b => { byCat[b.category] = (byCat[b.category] || 0) + (Number(b.amount_eur)||0); });
      line(`Total estimado: ${fmtMoney(totalEur,'EUR')}`, { bold:true });
      Object.entries(byCat).forEach(([cat,v]) => line(`  ${CATS_BUDGET.find(c=>c.id===cat)?.label || cat}: ${fmtMoney(v,'EUR')}`));
    }

    doc.save(`${t.name.replace(/\W+/g,'_')}.pdf`);
  },

  /* -------- Compartir viaje con tercero (HTML standalone) -------- */
  openShareSheet(t) {
    const body = el('div', {}, [

      el('label', { class:'switch', style:{padding:'6px 0'} }, [

        el('input', { id:'sh-docs', type:'checkbox', checked: null }),

    ]);
    const generate = el('button', { class:'btn btn-primary', onclick: async () => {

  async _gatherTrip(t) {
    const tripId = t.id;
    const planning = await DB.listByTrip('planning_items', tripId);
    const bookings = await DB.listByTrip('bookings', tripId);
    const addresses = await DB.listByTrip('addresses', tripId);
    const destination_info = (await DB.listByTrip('destination_info', tripId))[0] || null;
    const emergency_contacts = await DB.listByTrip('emergency_contacts', tripId);
    const phrases = await DB.listByTrip('phrases', tripId);
    const day_notes = await DB.listByTrip('day_notes', tripId);
    return { trip: t, planning, bookings, addresses, destination_info, emergency_contacts, phrases, day_notes };
  },

  _buildShareHtml(t, data, opts) {
    // Filtrar datos según opts antes de embeber
    const safe = JSON.parse(JSON.stringify(data));

    // Limpiar planning notes de URLs si !includeLinks
    if (!opts.includeLinks) {
      safe.planning.forEach(p => {
        p.gmaps_url = null;
        if (p.notes) p.notes = p.notes.replace(/https?:\/\/\S+/g, '[enlace omitido]');
      });
    }

    // Bookings: limpiar doc_url/doc_name si !includeDocs; campos $/loc si corresponde
    const DOC_FIELDS = new Set(['localizador','poliza','matricula','numero','referencia']);
    const MONEY_FIELDS = new Set(['precio','importe','coste','total','price']);
    safe.bookings.forEach(b => {
      if (!opts.includeDocs)  { b.doc_url = null; b.doc_name = null; }
      const d = b.structured_data || {};
      Object.keys(d).forEach(k => {
        if (!opts.includeDocs  && DOC_FIELDS.has(k))   delete d[k];
        if (!opts.includeMoney && MONEY_FIELDS.has(k)) delete d[k];
      });
    });

    if (!opts.includeNotes) {
      safe.trip.notes = null;
      safe.day_notes = [];
      safe.phrases = [];
    }

    if (!opts.includeMap) {
      safe.planning.forEach(p => { p.lat = null; p.lng = null; });
      safe.addresses.forEach(a => { a.lat = null; a.lng = null; });
    }

    // Quitar datos completamente irrelevantes / sensibles que nunca compartimos
    safe.trip.budget_target = null;
    delete safe.trip.profile;
    delete safe.trip.is_shared;
    delete safe.trip.cover_photo_url; // opcional: el receptor puede no tener acceso a la URL
    safe.trip.cover_photo_url = data.trip.cover_photo_url; // mantenerla; es solo decorativa

    const payload = JSON.stringify(safe).replace(/<\/script>/g, '<\\/script>');
    const titleEsc = escHtml(t.name);
    const subtitle = [t.city, t.country].filter(Boolean).join(', ');
    const dates = (t.start_date && t.end_date)
      ? `${fmtDateShort(t.start_date)} – ${fmtDateShort(t.end_date)}`
      : 'Sin fechas';

    // El script embebido se construye reemplazando placeholders en una plantilla
    // (los ${...} dentro de ese script son del VIEWER, no del main).
    const viewerScript = Exporter._viewerScript(payload, JSON.stringify(opts));

    return `<!DOCTYPE html>

  // Script JS del viewer standalone. Se devuelve como string concatenado para
  // que los ${...} y backticks de DENTRO no los interprete el template literal
  // del main script (problema clásico de templates anidados).
  _viewerScript(dataJSON, optsJSON) {
    const lines = [];
    lines.push('const DATA = ' + dataJSON + ';');
    lines.push('const OPTS = ' + optsJSON + ';');
    lines.push("function escHtml(s){return String(s==null?'':s).replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c]));}");
    lines.push("function fmtDayLong(iso){if(!iso)return'';return new Date(iso+'T00:00:00').toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'long'});}");
    lines.push("function fmtDateShort(iso){if(!iso)return'';return new Date(iso+'T00:00:00').toLocaleDateString('es-ES',{day:'numeric',month:'short'});}");
    lines.push("function daysBetween(a,b){if(!a||!b)return 0;return Math.round((new Date(b+'T00:00:00')-new Date(a+'T00:00:00'))/(24*3600*1000));}");
    lines.push("function gmapsUrl(lat,lng,q){if(lat!=null&&lng!=null)return 'https://www.google.com/maps/search/?api=1&query='+lat+','+lng;if(q)return 'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(q);return null;}");
