<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="format-detection" content="telephone=no, date=no, address=no, email=no" />
<title>Viajes</title>

<meta name="description" content="Planificación y gestión de viajes personales — local-first, offline" />
<meta name="theme-color" content="#2563eb" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#0b1220" media="(prefers-color-scheme: dark)" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" type="image/svg+xml" href="icons/icon.svg" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />

<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Viajes" />

<!-- Aplicar tema antes del primer paint para evitar flash (FOUC) -->
<script>
(function(){
  try {
    var t = localStorage.getItem('viajes_theme');
    if (t === 'claro' || t === 'oscuro') document.documentElement.setAttribute('data-tema', t);
  } catch (e) {}
})();
</script>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&display=swap" />
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

<style>
/* ========================================================================
   Sistema de diseño — paleta slate/azul, tipografía Manrope única
   (sin mono: los números usan números tabulares de Manrope)
   ====================================================================== */
:root {
  --r-sm:8px; --r-md:14px; --r-lg:20px; --r-pill:999px;
  --sh-1:0 1px 2px rgba(0,0,0,.04),0 1px 1px rgba(0,0,0,.03);
  --sh-2:0 2px 10px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04);
  --sh-3:0 12px 28px rgba(0,0,0,.10);
  --gap-1:4px; --gap-2:8px; --gap-3:12px; --gap-4:16px;
  --gap-5:24px; --gap-6:32px; --gap-7:48px;
  --font-ui:'Manrope', system-ui, -apple-system, sans-serif;
  --font-titulo:'Manrope', system-ui, -apple-system, sans-serif;
  /* --font-num: alias a Manrope con números tabulares. Mantiene compatibilidad
     con el código que aún referencia esta variable. */
  --font-num:'Manrope', system-ui, -apple-system, sans-serif;
  --ease: cubic-bezier(.2,.8,.2,1);
}
:root, :root[data-tema="claro"] {
  --bg:#f8fafc; --bg-elev:#fff; --bg-soft:#f1f5f9; --bg-input:#fff;
  --text:#0f172a; --text-muted:#64748b; --text-inv:#fff;
  --line:#e2e8f0; --line-soft:#f1f5f9;
  --accent:#2563eb; --accent-2:#06b6d4; --accent-bg:#dbeafe;
  --focus:#2563eb; --danger:#dc2626;
  --status-curso:#059669; --status-prep:#d97706; --status-prox:#2563eb; --status-pas:#64748b;
}
:root[data-tema="oscuro"] {
  --bg:#0b1220; --bg-elev:#111a2e; --bg-soft:#1e293b; --bg-input:#111a2e;
  --text:#f1f5f9; --text-muted:#94a3b8; --text-inv:#0b1220;
  --line:#334155; --line-soft:#1e293b;
  --accent:#60a5fa; --accent-2:#22d3ee; --accent-bg:#1e3a5f;
  --focus:#93c5fd; --danger:#f87171;
  --status-curso:#34d399; --status-prep:#fbbf24; --status-prox:#60a5fa; --status-pas:#94a3b8;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-tema]) {
    --bg:#0b1220; --bg-elev:#111a2e; --bg-soft:#1e293b; --bg-input:#111a2e;
    --text:#f1f5f9; --text-muted:#94a3b8; --text-inv:#0b1220;
    --line:#334155; --line-soft:#1e293b;
    --accent:#60a5fa; --accent-2:#22d3ee; --accent-bg:#1e3a5f;
    --focus:#93c5fd; --danger:#f87171;
  }
}

* { box-sizing:border-box; }
html, body { margin:0; padding:0; }
html { -webkit-text-size-adjust:100%; }
body {
  font-family:var(--font-ui);
  background:var(--bg); color:var(--text);
  font-size:16px; line-height:1.5; font-weight:400;
  -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale;
  padding-bottom:env(safe-area-inset-bottom);
  overflow-x:hidden;
}
button, input, select, textarea { font:inherit; color:inherit; }
a { color:var(--accent); text-decoration:none; }
a:hover { text-decoration:underline; }
:focus-visible { outline:2px solid var(--focus); outline-offset:2px; border-radius:6px; }

/* .mono: ya no cambia la fuente; solo activa números tabulares para alinear
   columnas de cifras en listas de gastos, fechas, etc. */
.mono { font-family:var(--font-ui); font-feature-settings:"tnum","ss01"; }
.muted { color:var(--text-muted); }

/* Skip link — invisible hasta foco con teclado */
.skip-link {
  position:absolute; left:8px; top:-44px; z-index:200;
  background:var(--accent); color:#fff;
  padding:10px 16px; border-radius:var(--r-md);
  text-decoration:none; font-weight:600;
  transition:top .15s var(--ease);
}
.skip-link:focus { top:8px; outline:2px solid #fff; outline-offset:2px; }

/* Respetar preferencia de movimiento reducido */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration:.01ms !important;
    animation-iteration-count:1 !important;
    transition-duration:.01ms !important;
    scroll-behavior:auto !important;
  }
}

/* ========================================================================
   Layout
   ====================================================================== */
.app-shell { min-height:100dvh; display:flex; flex-direction:column; }

header.topbar {
  position:sticky; top:0; z-index:40;
  background:color-mix(in srgb, var(--bg) 80%, transparent);
  backdrop-filter: saturate(180%) blur(14px);
  -webkit-backdrop-filter: saturate(180%) blur(14px);
  border-bottom:1px solid var(--line-soft);
  padding:14px 16px;
  padding-top:calc(14px + env(safe-area-inset-top));
}
.topbar-inner {
  max-width:1100px; margin:0 auto;
  display:flex; align-items:center; gap:12px;
}
.topbar-title {
  font-family:var(--font-titulo); font-weight:700; letter-spacing:-.02em;
  font-size:18px;
}
.topbar-spacer { flex:1; }

/* Slot de acciones específicas de la vista actual (Editar/PDF en detalle de viaje). */
.topbar-extras { display:flex; align-items:center; gap:6px; }
.topbar-extras:empty { display:none; }

/* En el detalle de viaje el título grande estilo Apple va en el cuerpo de la vista,
   no en el topbar — para no duplicarlo. Ocultamos el topbar-title en todas las
   resoluciones cuando estamos dentro de un viaje. La sync-pill se oculta solo en móvil. */
body.view-trip .topbar-title { display:none; }
@media (max-width: 720px) {
  body.view-trip .status-pill { display:none; }
}

/* Título grande "Apple-style" para el detalle de viaje — copiado del estilo
   de las recetas: degradado de color, peso 700, letter-spacing negativo. */
.trip-detail-title {
  font-family:var(--font-titulo);
  font-size:40px; font-weight:700;
  letter-spacing:-.03em; line-height:1.12;
  margin:14px 0 6px; padding-bottom:.08em;
  word-break:break-word; overflow-wrap:break-word;
  hyphens:auto;
  max-width:100%;
  background-image:linear-gradient(135deg,
    var(--accent) 0%,
    color-mix(in srgb, var(--accent) 72%, #000 28%) 100%);
  -webkit-background-clip:text; background-clip:text;
  color:transparent; -webkit-text-fill-color:transparent;
}
@media (min-width:720px) {
  .trip-detail-title { font-size:56px; letter-spacing:-.035em; }
}
:root[data-tema="oscuro"] .trip-detail-title {
  background-image:linear-gradient(135deg,
    color-mix(in srgb, var(--accent) 85%, #fff 15%) 0%,
    var(--accent) 100%);
}

/* Subtítulo: fechas + faltan X días. Sin destino. */
.trip-detail-sub {
  margin:0 0 18px;
  font-size:14px; color:var(--text-muted);
  font-feature-settings:"tnum","ss01";
}
.trip-detail-sub .sep { opacity:.55; margin:0 2px; }

/* Portada con foto del viaje — visible solo en escritorio (≥720px).
   En móvil la ocultamos por completo para más limpieza visual. */
.trip-detail-cover-wrap {
  display:none;
  margin:0 0 14px;
}
.trip-detail-cover-inner {
  position:relative; overflow:hidden;
  border-radius:var(--r-lg); border:1px solid var(--line);
  height:240px;
}
.trip-detail-cover-inner img {
  position:absolute; inset:0;
  width:100%; height:100%; object-fit:cover;
  display:block;
}
@media (min-width:720px) {
  .trip-detail-cover-wrap { display:block; }
}

/* Panel de detalle de sincronización (sheet desde el sync-pill) */
.sync-detail { display:flex; flex-direction:column; gap:10px; }
.sync-row {
  display:flex; justify-content:space-between; align-items:center;
  padding:10px 12px; border:1px solid var(--line); border-radius:var(--r-md);
  background:var(--bg-elev);
}
.sync-label { font-size:13px; color:var(--text-muted); }
.sync-val   { font-size:13px; font-weight:600; color:var(--text);
  font-feature-settings:"tnum","ss01"; }
.sync-error-box {
  padding:12px 14px; border-radius:var(--r-md);
  background:color-mix(in srgb, var(--danger) 10%, var(--bg-elev));
  border:1px solid color-mix(in srgb, var(--danger) 35%, var(--line));
}
.sync-error-title {
  font-size:12px; font-weight:700; text-transform:uppercase;
  letter-spacing:.05em; color:var(--danger); margin-bottom:6px;
}
.sync-error-msg {
  font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  font-size:11.5px; line-height:1.4;
  margin:0; white-space:pre-wrap; word-break:break-word;
  color:var(--text);
}

/* Menú de acciones del viaje (sheet desde el hamburguesa) */
.action-menu { display:flex; flex-direction:column; gap:4px; }
.action-menu-item {
  display:flex; align-items:center; gap:14px;
  padding:14px 12px; border-radius:var(--r-md);
  background:transparent; border:1px solid transparent;
  cursor:pointer; text-align:left;
  font:inherit; color:var(--text); font-size:15px; font-weight:500;
  transition:background .12s var(--ease);
}
.action-menu-item:hover { background:var(--bg-soft); }
.action-menu-icon {
  display:flex; align-items:center; justify-content:center;
  width:36px; height:36px; border-radius:50%;
  background:var(--bg-soft); border:1px solid var(--line);
  color:var(--accent); flex-shrink:0;
}
.action-menu-icon svg { width:18px; height:18px; }
.action-menu-label { flex:1; }

.icon-btn {
  border:1px solid var(--line); background:var(--bg-elev); color:var(--text);
  width:38px; height:38px; border-radius:var(--r-md);
  display:inline-flex; align-items:center; justify-content:center;
  cursor:pointer; transition:transform .18s var(--ease), box-shadow .18s var(--ease), background .18s var(--ease);
}
.icon-btn:hover { transform:translateY(-1px); box-shadow:var(--sh-2); }
.icon-btn svg { width:18px; height:18px; }

main {
  max-width:1100px; margin:0 auto;
  padding:16px 16px 48px;
  flex:1; width:100%;
  /* `clip` evita scroll horizontal accidental por elementos que sobresalen
     (títulos con gradiente, cards con contenido ancho, tablists). Sin él,
     algunas pantallas iOS Safari hacen scroll lateral y "descentran". */
  overflow-x: clip;
  animation: fadeIn .18s var(--ease);
}
/* Defensa global: el body nunca debe permitir scroll horizontal. */
html, body { overflow-x: clip; }
@keyframes fadeIn { from { opacity:0; transform:translateY(4px); } to { opacity:1; transform:none; } }

/* ========================================================================
   Tipografía de vista
   ====================================================================== */
h1.view-title {
  font-family:var(--font-titulo); font-weight:600; letter-spacing:-.03em;
  font-size:28px; margin:8px 0 4px;
}
@media (min-width:720px) { h1.view-title { font-size:34px; } }
.view-sub { color:var(--text-muted); font-size:14px; margin:0 0 24px; }

h2.section-title {
  font-family:var(--font-titulo); font-weight:600; letter-spacing:-.02em;
  font-size:20px; margin:32px 0 12px;
}

/* ========================================================================
   Componentes — botones
   ====================================================================== */
.btn {
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  height:44px; padding:0 18px;
  border:1px solid var(--line); background:var(--bg-elev); color:var(--text);
  border-radius:var(--r-pill);
  font-weight:600; font-size:14px; letter-spacing:-.01em;
  cursor:pointer; transition:transform .18s var(--ease), box-shadow .18s var(--ease), background .18s var(--ease);
}
.btn:hover { transform:translateY(-1px); box-shadow:var(--sh-2); }
.btn:disabled { opacity:.5; cursor:not-allowed; transform:none; box-shadow:none; }
.btn svg { width:16px; height:16px; }

.btn-primary {
  background:linear-gradient(135deg, var(--accent), var(--accent-2));
  color:#fff; border:none;
  box-shadow: 0 6px 18px color-mix(in srgb, var(--accent) 28%, transparent);
}
.btn-primary:hover {
  box-shadow: 0 10px 24px color-mix(in srgb, var(--accent) 36%, transparent);
}
.btn-ghost { background:transparent; border-color:transparent; }
.btn-danger { color:var(--danger); border-color:color-mix(in srgb, var(--danger) 40%, var(--line)); }
.btn-sm { height:32px; padding:0 12px; font-size:13px; }

/* FAB principal */
.fab {
  position:fixed; right:20px; bottom:20px; z-index:30;
  width:60px; height:60px; border-radius:50%;
  background:linear-gradient(135deg, var(--accent), var(--accent-2)); color:#fff;
  border:none; cursor:pointer;
  box-shadow: 0 12px 28px color-mix(in srgb, var(--accent) 36%, transparent);
  display:flex; align-items:center; justify-content:center;
  transition:transform .18s var(--ease), box-shadow .18s var(--ease);
}
.fab:hover { transform:translateY(-2px); box-shadow: 0 16px 36px color-mix(in srgb, var(--accent) 48%, transparent); }
.fab svg { width:24px; height:24px; }

/* ========================================================================
   Componentes — chips, segmented, dot
   ====================================================================== */
.chip-row { display:flex; gap:8px; overflow-x:auto; padding:2px; margin:0 -2px 24px; -webkit-overflow-scrolling:touch; scrollbar-width:none; }
.chip-row::-webkit-scrollbar { display:none; }
.chip {
  flex-shrink:0;
  display:inline-flex; align-items:center; gap:7px;
  height:36px; padding:0 15px;
  background:var(--bg-elev); border:1px solid var(--line); color:var(--text-muted);
  border-radius:var(--r-pill);
  font-family:var(--font-ui);
  font-size:13px; font-weight:600;
  letter-spacing:-.005em;
  cursor:pointer; transition:all .18s var(--ease);
}
.chip:hover { color:var(--text); }
.chip.active {
  background:var(--accent); border-color:var(--accent); color:#fff;
  box-shadow: 0 4px 12px color-mix(in srgb, var(--accent) 22%, transparent);
}
.chip .badge {
  font-family:var(--font-ui);
  font-feature-settings:"tnum";
  font-size:11px; font-weight:600;
  background:color-mix(in srgb, var(--text) 8%, transparent);
  padding:2px 7px; border-radius:var(--r-pill);
  line-height:1.2;
}
.chip.active .badge { background:rgba(255,255,255,.22); color:#fff; }

.segmented {
  display:inline-flex; background:var(--bg-soft); border-radius:var(--r-pill);
  padding:3px; border:1px solid var(--line);
}
.segmented button {
  border:none; background:transparent; color:var(--text-muted);
  height:32px; padding:0 14px; border-radius:var(--r-pill);
  font-size:13px; font-weight:500; cursor:pointer;
  transition:all .18s var(--ease);
}
.segmented button.active { background:var(--bg-elev); color:var(--text); box-shadow:var(--sh-1); }

.dot { display:inline-block; width:8px; height:8px; border-radius:50%; flex-shrink:0; }
.dot-curso { background:var(--status-curso); }
.dot-prep  { background:var(--status-prep); }
.dot-prox  { background:var(--status-prox); }
.dot-pas   { background:var(--status-pas); }
.dot-todos { background:linear-gradient(135deg, var(--accent), var(--accent-2)); }

/* ========================================================================
   Tarjetas (genéricas)
   ====================================================================== */
.card {
  background:var(--bg-elev);
  border:1px solid var(--line);
  border-radius:var(--r-lg);
  box-shadow:var(--sh-1);
  transition:transform .18s var(--ease), box-shadow .18s var(--ease);
  overflow:hidden;
}
.card.interactive { cursor:pointer; }
.card.interactive:hover { transform:translateY(-2px); box-shadow:var(--sh-2); }
.card-body { padding:20px; }

/* ========================================================================
   Tarjeta de viaje
   ====================================================================== */
.trip-grid {
  display:grid; gap:24px;
  grid-template-columns:1fr;
}
@media (min-width:720px) {
  .trip-grid { grid-template-columns:1fr 1fr; gap:28px; }
}

.trip-card { position:relative; overflow:hidden; cursor:pointer; min-width:0; max-width:100%; }
.trip-card-cover {
  position:relative; height:210px;
  background:linear-gradient(135deg, var(--accent-bg), var(--bg-soft));
  display:flex; flex-direction:column; justify-content:flex-end;
  padding:18px;
}
.trip-card-cover img {
  position:absolute; inset:0; width:100%; height:100%; object-fit:cover;
}
.trip-card-cover::after {
  content:''; position:absolute; inset:0;
  /* Degradado oscuro inferior — más intenso para que el título (blanco) sea legible
     incluso sobre fotos claras o de cielo. Stop intermedio para una curva más natural
     y evitar el corte duro del tope. */
  background:linear-gradient(to top,
    rgba(0,0,0,.80) 0%,
    rgba(0,0,0,.55) 30%,
    rgba(0,0,0,.15) 65%,
    rgba(0,0,0,0)   100%);
  pointer-events:none;
}
.trip-card-cover > * { position:relative; z-index:1; }

.trip-card-status {
  position:absolute; top:14px; left:14px; z-index:2;
  display:inline-flex; align-items:center; gap:6px;
  background:rgba(255,255,255,.92); color:#0f172a;
  padding:6px 12px; border-radius:var(--r-pill);
  font-family:var(--font-ui);
  font-size:12px; font-weight:600; letter-spacing:-.005em;
  backdrop-filter:blur(6px);
}

.trip-card-name {
  color:#fff;
  font-family:var(--font-titulo); font-weight:800;
  font-size:22px; letter-spacing:-.02em; line-height:1.15;
  text-shadow:0 1px 3px rgba(0,0,0,.4);
  /* Partir nombres largos en lugar de empujar la card más allá del viewport.
     "Curaçao · Willemstad + lagunas" es legal partir donde haga falta. */
  word-break:break-word; overflow-wrap:break-word; hyphens:auto;
  max-width:100%;
}
.trip-card-meta {
  margin-top:6px;
  color:rgba(255,255,255,.95);
  font-family:var(--font-ui);
  font-feature-settings:"tnum","ss01";
  font-size:13.5px; font-weight:600; letter-spacing:-.01em;
  text-shadow:0 1px 2px rgba(0,0,0,.3);
  display:flex; align-items:center; gap:10px; flex-wrap:wrap;
  max-width:100%; min-width:0;
}
.trip-card-meta .sep { opacity:.55; }
.trip-card-foot {
  display:flex; align-items:center; justify-content:space-between;
  padding:14px 18px;
  border-top:1px solid var(--line-soft);
  background:var(--bg-elev);
  gap:12px;
}
.trip-card-foot .destino {
  color:var(--text-muted); font-size:13px;
  min-width:0; word-break:break-word; overflow-wrap:break-word;
}

/* Toggle "en preparación" */
.switch {
  position:relative; display:inline-flex; align-items:center; gap:8px;
  cursor:pointer; user-select:none;
  font-size:12px; color:var(--text-muted);
}
.switch input { position:absolute; opacity:0; pointer-events:none; }
.switch-track {
  width:34px; height:20px; background:var(--bg-soft); border:1px solid var(--line);
  border-radius:var(--r-pill); position:relative; transition:all .18s var(--ease);
}
.switch-track::after {
  content:''; position:absolute; top:1px; left:1px;
  width:16px; height:16px; border-radius:50%;
  background:#fff; box-shadow:var(--sh-1);
  transition:transform .18s var(--ease);
}
.switch input:checked + .switch-track { background:var(--accent); border-color:var(--accent); }
.switch input:checked + .switch-track::after { transform:translateX(14px); }

/* ========================================================================
   Empty state
   ====================================================================== */
.empty {
  text-align:center; padding:48px 24px;
  color:var(--text-muted);
}
.empty .icon {
  display:inline-flex; align-items:center; justify-content:center;
  width:64px; height:64px; border-radius:50%;
  background:var(--bg-soft); margin-bottom:16px;
}
.empty .icon svg { width:28px; height:28px; color:var(--text-muted); }
.empty h3 { color:var(--text); font-weight:600; margin:8px 0 4px; }
.empty p { margin:0; font-size:14px; max-width:300px; margin:0 auto; }

/* ========================================================================
   Formularios
   ====================================================================== */
.form-row { display:flex; flex-direction:column; gap:6px; margin-bottom:16px; }
.form-row label { font-size:13px; font-weight:500; color:var(--text-muted); }
.form-row input, .form-row select, .form-row textarea {
  border:1px solid var(--line); background:var(--bg-input); color:var(--text);
  border-radius:var(--r-md); padding:11px 14px;
  font-size:15px; font-family:var(--font-ui);
  transition:border .18s var(--ease), box-shadow .18s var(--ease);
}
.form-row input:focus, .form-row select:focus, .form-row textarea:focus {
  border-color:var(--accent); outline:none;
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 18%, transparent);
}
.form-row textarea { min-height:80px; resize:vertical; }
.form-row.num input { font-feature-settings:"tnum","ss01"; }
.form-grid-2 { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
.field-hint { font-size:12px; color:var(--text-muted); margin-top:4px; }

/* ========================================================================
   Modal sheet (sube desde abajo en móvil)
   ====================================================================== */
.sheet-back {
  position:fixed; inset:0; z-index:90;
  background:rgba(15,23,42,.42);
  opacity:0; pointer-events:none;
  transition:opacity .25s var(--ease);
}
.sheet-back.show { opacity:1; pointer-events:auto; }

.sheet {
  position:fixed; left:0; right:0; bottom:0; z-index:91;
  background:var(--bg-elev); color:var(--text);
  border-top-left-radius:24px; border-top-right-radius:24px;
  transform:translateY(100%);
  opacity:0; pointer-events:none;
  transition:transform .28s var(--ease), opacity .22s var(--ease);
  max-height:90dvh; display:flex; flex-direction:column;
  padding-bottom:env(safe-area-inset-bottom);
  box-shadow: 0 -10px 40px rgba(0,0,0,.18);
}
.sheet.show { transform:translateY(0); opacity:1; pointer-events:auto; }
.sheet-handle {
  width:42px; height:5px; border-radius:var(--r-pill);
  background:var(--line); margin:10px auto 4px;
}
.sheet-header {
  padding:8px 20px 16px;
  display:flex; align-items:center; gap:12px;
  border-bottom:1px solid var(--line-soft);
}
.sheet-title { font-family:var(--font-titulo); font-weight:600; letter-spacing:-.02em; font-size:20px; flex:1; }
.sheet-body { padding:20px; overflow-y:auto; }
.sheet-foot {
  padding:14px 20px;
  border-top:1px solid var(--line-soft);
  display:flex; gap:10px; justify-content:flex-end;
}
@media (min-width:720px) {
  .sheet {
    left:50%; right:auto; bottom:50%;
    /* opacity:0 ya lo oculta; el transform solo da la animación de entrada */
    transform:translate(-50%, calc(50% + 24px));
    width:min(560px, 92vw);
    border-radius:24px;
    max-height:84dvh;
  }
  .sheet.show { transform:translate(-50%, 50%); }
  .sheet-handle { display:none; }
}

/* ========================================================================
   Status pill (online / sync)
   ====================================================================== */
.status-pill {
  display:inline-flex; align-items:center; gap:6px;
  font-family:var(--font-ui);
  font-size:11px; font-weight:600;
  letter-spacing:.005em;
  color:var(--text-muted);
  padding:4px 11px; border-radius:var(--r-pill);
  background:var(--bg-soft); border:1px solid var(--line);
}
.status-pill .dot { width:6px; height:6px; }
.status-pill.online .dot { background:#10b981; }
.status-pill.offline .dot { background:#f59e0b; }
.status-pill.error .dot { background:#ef4444; }

/* ========================================================================
   Toolbar de orden / sort
   ====================================================================== */
.toolbar {
  display:flex; align-items:center; justify-content:space-between;
  gap:12px; margin-bottom:16px; flex-wrap:wrap;
}

/* Botón de perfil en topbar — muestra la inicial del perfil activo en lugar
   del icono de muñeco. Color por perfil (R/S/I). */
.profile-initial-btn { padding:0; }
.profile-initial {
  display:flex; align-items:center; justify-content:center;
  width:100%; height:100%;
  font-family:var(--font-titulo);
  font-weight:700; font-size:14px; letter-spacing:-.01em;
  color:#fff;
  background:linear-gradient(135deg, var(--accent), var(--accent-2));
  border-radius:inherit;
}
.profile-initial.profile-ruben    { background:linear-gradient(135deg,#3b82f6,#06b6d4); }
.profile-initial.profile-sergio   { background:linear-gradient(135deg,#a855f7,#ec4899); }
.profile-initial.profile-invitado { background:linear-gradient(135deg,#64748b,#94a3b8); }

/* Cabecera de vista — título a la izquierda, icon-btns a la derecha */
.view-header {
  display:flex; align-items:flex-end; justify-content:space-between;
  gap:12px; margin:0 0 8px;
  flex-wrap:wrap;
  max-width:100%;
}
.view-header .view-title {
  margin:0; flex:1; min-width:0;
  word-break:break-word; overflow-wrap:break-word;
}
.view-header-actions {
  display:flex; align-items:center; gap:8px; flex-shrink:0;
}
.view-header-actions .icon-btn { width:40px; height:40px; }
.view-header-actions .icon-btn.icon-btn-primary {
  background:linear-gradient(135deg, var(--accent), var(--accent-2));
  border-color:transparent; color:#fff;
}
.view-header-actions .icon-btn.icon-btn-primary svg { stroke:#fff; }
.view-header-actions .icon-btn.has-active {
  background:var(--accent-bg);
  border-color:color-mix(in srgb, var(--accent) 40%, var(--line));
  color:var(--accent);
}

.view-readonly-line { margin:0 0 16px; display:flex; align-items:center; gap:6px; font-size:13px; color:var(--text-muted); }
.view-readonly-extra { font-size:13px; }

/* Dropdown de filtros (sustituye al sheet) — bloque inline tipo card */
.filters-dropdown {
  margin:8px 0 16px; padding:16px;
  background:var(--bg-elev); border:1px solid var(--line);
  border-radius:var(--r-md);
  box-shadow: var(--sh-1);
  animation: filtersDropdownIn .14s var(--ease);
  transform-origin: top right;
}
@keyframes filtersDropdownIn {
  from { opacity:0; transform: translateY(-4px); }
  to   { opacity:1; transform: translateY(0); }
}

/* Mini-resumen del filtro activo bajo la toolbar */
.view-filter-summary {
  display:inline-flex; align-items:center; gap:8px;
  margin:0 0 14px;
  font-size:13px; color:var(--text-muted);
  font-weight:500;
}
.view-filter-summary .dot { width:8px; height:8px; }
.view-filter-summary .view-filter-name { color:var(--text); font-weight:600; }
.view-filter-summary .view-filter-count {
  font-feature-settings:"tnum","ss01";
}

/* Sheet de filtros */
.filters-body { display:flex; flex-direction:column; gap:18px; }
.filters-section { display:flex; flex-direction:column; gap:8px; }
.filters-section-title {
  font-size:12px; font-weight:600; text-transform:uppercase;
  letter-spacing:.06em; color:var(--text-muted);
}
.filters-segmented { width:100%; }
.filters-segmented button { flex:1; }
.filters-status-list { display:flex; flex-direction:column; gap:6px; }
.filters-status-btn {
  display:flex; align-items:center; gap:10px;
  padding:12px 14px; border-radius:var(--r-md);
  background:var(--bg-elev); border:1px solid var(--line);
  cursor:pointer; text-align:left;
  font:inherit; color:var(--text); font-size:14.5px;
  transition:background .12s var(--ease), border-color .12s var(--ease);
}
.filters-status-btn:hover { background:var(--bg-soft); }
.filters-status-btn.active {
  border-color:color-mix(in srgb, var(--accent) 50%, var(--line));
  background:var(--accent-bg);
  font-weight:600;
}
.filters-status-btn .dot { width:10px; height:10px; flex-shrink:0; }
.filters-status-label { flex:1; }
.filters-status-count {
  font-feature-settings:"tnum","ss01";
  font-size:13px; color:var(--text-muted);
  background:var(--bg-soft); padding:1px 8px; border-radius:var(--r-pill);
  min-width:24px; text-align:center;
}
.filters-status-btn.active .filters-status-count {
  background:color-mix(in srgb, var(--accent) 18%, var(--bg-elev));
  color:var(--accent);
}

/* ========================================================================
   Listas — items con divisores ligeros
   ====================================================================== */
.list { display:flex; flex-direction:column; gap:8px; }
.list-item {
  background:var(--bg-elev); border:1px solid var(--line);
  border-radius:var(--r-md); padding:10px 12px;
  display:flex; align-items:center; gap:10px;
  transition:transform .18s var(--ease), box-shadow .18s var(--ease);
  min-height:0;
}
.list-item:hover { box-shadow:var(--sh-1); }
.list-item .li-main { flex:1; min-width:0; }
.list-item .li-title { font-weight:500; color:var(--text); font-size:14.5px; letter-spacing:-.005em; }
.list-item .li-sub { font-size:12.5px; color:var(--text-muted); margin-top:1px; line-height:1.35; }
.list-item .li-actions { display:flex; gap:4px; }
/* Cards de planning específicamente — más compactas, sin sombra exagerada */
.timeline-item.list-item { padding:8px 10px; }
.timeline-item.list-item .item-emoji { width:36px; height:36px; font-size:18px; border-width:1.5px; }
.timeline-item.list-item .drag-handle { padding:2px; }
.timeline-item.list-item .icon-btn { width:30px; height:30px; }
.timeline-item.list-item .icon-btn svg { width:16px; height:16px; }
.timeline-item.list-item .li-actions .btn.btn-sm { height:28px; padding:0 9px; font-size:12px; }
/* Sub-texto en 1-2 líneas máximo con ellipsis para que no expanda la card */
.timeline-item.list-item .li-sub {
  overflow:hidden; text-overflow:ellipsis;
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;
}

/* Estados de los planning items con reserva (hotel, vuelo, transporte, coche, actividad).
   El fondo de color comunica el estado de un vistazo. Las visitas a lugares y comidas
   no usan estado y quedan con fondo blanco/elev. */
.list-item.status-por_iniciar,
.timeline-item.status-por_iniciar {
  border-color: color-mix(in srgb, #f59e0b 55%, var(--line));
  background: color-mix(in srgb, #fbbf24 18%, var(--bg-elev));
}
.list-item.status-en_consulta,
.timeline-item.status-en_consulta {
  border-color: color-mix(in srgb, #3b82f6 55%, var(--line));
  background: color-mix(in srgb, #60a5fa 15%, var(--bg-elev));
}
.list-item.status-confirmado,
.timeline-item.status-confirmado {
  border-color: color-mix(in srgb, #10b981 50%, var(--line));
  background: color-mix(in srgb, #34d399 12%, var(--bg-elev));
}
.list-item.status-cancelado,
.timeline-item.status-cancelado {
  border-color: color-mix(in srgb, #ef4444 55%, var(--line));
  background: color-mix(in srgb, #f87171 12%, var(--bg-elev));
}
.list-item.status-cancelado .li-title,
.timeline-item.status-cancelado .li-title { text-decoration:line-through; opacity:.75; }

/* Items virtuales (noches de hotel + check-out) — más sutiles para que se note
   que son derivados del item base. */
.timeline-item.virtual { opacity:.92; }
.timeline-item.virtual .li-title { font-weight:500; }

/* Color del dot del timeline (círculo a la izquierda) según estado */
.timeline-item.status-por_iniciar::before { border-color:#f59e0b !important; }
.timeline-item.status-en_consulta::before { border-color:#3b82f6 !important; }
.timeline-item.status-confirmado::before  { border-color:#10b981 !important; }
.timeline-item.status-cancelado::before   { border-color:#ef4444 !important; }

/* Badge del estado al lado del título */
.status-badge {
  display:inline-flex; align-items:center; gap:4px;
  font-family:var(--font-ui);
  font-size:10.5px; font-weight:600;
  letter-spacing:.012em;
  padding:3px 10px; border-radius:var(--r-pill);
  margin-left:8px; flex-shrink:0;
  line-height:1.3;
}
.status-badge.s-por_iniciar { background:color-mix(in srgb, #f59e0b 22%, var(--bg-elev)); color:#b45309; border:1px solid color-mix(in srgb, #f59e0b 50%, transparent); }
.status-badge.s-en_consulta { background:color-mix(in srgb, #3b82f6 22%, var(--bg-elev)); color:#1e40af; border:1px solid color-mix(in srgb, #3b82f6 50%, transparent); }
.status-badge.s-confirmado  { background:color-mix(in srgb, #10b981 22%, var(--bg-elev)); color:#047857; border:1px solid color-mix(in srgb, #10b981 50%, transparent); }
.status-badge.s-cancelado   { background:color-mix(in srgb, #ef4444 22%, var(--bg-elev)); color:#b91c1c; border:1px solid color-mix(in srgb, #ef4444 50%, transparent); }
:root[data-tema="oscuro"] .status-badge.s-por_iniciar { color:#fbbf24; }
:root[data-tema="oscuro"] .status-badge.s-en_consulta { color:#93c5fd; }
:root[data-tema="oscuro"] .status-badge.s-confirmado  { color:#6ee7b7; }
:root[data-tema="oscuro"] .status-badge.s-cancelado   { color:#fca5a5; }

/* Bloque de campos de "consulta" (URL, precio, fechas previstas) en el editor */
.consulta-fields {
  margin-top:14px; padding:14px;
  background:color-mix(in srgb, var(--accent) 6%, var(--bg-soft));
  border:1px solid color-mix(in srgb, var(--accent) 30%, var(--line));
  border-radius:var(--r-md);
}
.consulta-fields > h4 {
  margin:0 0 10px; font-size:13px; font-weight:600;
  color:var(--accent); letter-spacing:-.005em;
}

/* Selector de estado en el editor — pill segmentado vertical con color por opción */
.status-picker {
  display:grid; gap:8px;
  grid-template-columns:repeat(2, 1fr);
  margin-top:6px;
}
.status-picker .opt {
  display:flex; align-items:flex-start; gap:10px;
  padding:10px 12px; border:1.5px solid var(--line);
  background:var(--bg-elev); border-radius:var(--r-md);
  cursor:pointer; transition:all .15s var(--ease);
  text-align:left;
}
.status-picker .opt:hover { transform:translateY(-1px); }
.status-picker .opt .dot {
  width:10px; height:10px; border-radius:50%;
  margin-top:5px; flex-shrink:0;
}
.status-picker .opt .lbl { font-weight:600; font-size:14px; letter-spacing:-.005em; }
.status-picker .opt .h   { font-size:12px; color:var(--text-muted); margin-top:2px; }
.status-picker .opt.s-por_iniciar .dot { background:#f59e0b; }
.status-picker .opt.s-en_consulta .dot { background:#3b82f6; }
.status-picker .opt.s-confirmado  .dot { background:#10b981; }
.status-picker .opt.s-cancelado   .dot { background:#ef4444; }
.status-picker .opt.active { border-width:2px; padding:9px 11px; }
.status-picker .opt.s-por_iniciar.active { border-color:#f59e0b; background:color-mix(in srgb, #fbbf24 14%, var(--bg-elev)); }
.status-picker .opt.s-en_consulta.active { border-color:#3b82f6; background:color-mix(in srgb, #60a5fa 12%, var(--bg-elev)); }
.status-picker .opt.s-confirmado.active  { border-color:#10b981; background:color-mix(in srgb, #34d399 12%, var(--bg-elev)); }
.status-picker .opt.s-cancelado.active   { border-color:#ef4444; background:color-mix(in srgb, #f87171 12%, var(--bg-elev)); }

/* Inquiry confirmada — resaltada en verde */
.list-item.confirmed {
  border-color:color-mix(in srgb, var(--status-curso) 45%, var(--line));
  background:color-mix(in srgb, var(--status-curso) 8%, var(--bg-elev));
}
.list-item.confirmed .li-title { color:var(--text); }
.confirm-badge {
  display:inline-flex; align-items:center; gap:4px;
  font-family:var(--font-ui);
  font-size:10.5px; font-weight:600;
  letter-spacing:.012em;
  padding:3px 10px; border-radius:var(--r-pill);
  background:color-mix(in srgb, var(--status-curso) 18%, var(--bg-elev));
  color:var(--status-curso);
  border:1px solid color-mix(in srgb, var(--status-curso) 40%, transparent);
}
.confirm-badge svg { width:11px; height:11px; }

.inquiry-row .price { font-feature-settings:"tnum","ss01"; font-weight:600; letter-spacing:-.005em; }
.inquiry-row .price .cur { color:var(--text-muted); font-weight:400; font-size:.85em; margin-left:2px; }

/* checkbox */
.check {
  appearance:none; -webkit-appearance:none;
  width:22px; height:22px; border:1.5px solid var(--line);
  border-radius:6px; background:var(--bg-elev);
  cursor:pointer; flex-shrink:0;
  display:inline-flex; align-items:center; justify-content:center;
  transition:all .18s var(--ease);
}
.check:checked { background:var(--accent); border-color:var(--accent); }
.check:checked::after {
  content:''; width:6px; height:11px; border:solid #fff;
  border-width:0 2px 2px 0; transform:rotate(45deg) translateY(-1px);
}

/* ========================================================================
   Tabs (sub-navegación en detalle de viaje)
   ====================================================================== */
.subtabs {
  display:flex; gap:6px; overflow-x:auto;
  margin:0 -16px 24px; padding:0 16px 4px;
  scrollbar-width:none;
  border-bottom:1px solid var(--line-soft);
}
.subtabs::-webkit-scrollbar { display:none; }
.subtab {
  flex-shrink:0;
  border:none; background:transparent; color:var(--text-muted);
  padding:10px 14px;
  font-size:14px; font-weight:500;
  cursor:pointer;
  border-bottom:2px solid transparent;
  margin-bottom:-1px;
  transition:all .18s var(--ease);
}
.subtab:hover { color:var(--text); }
.subtab.active { color:var(--accent); border-bottom-color:var(--accent); }

/* ========================================================================
   Mapa
   ====================================================================== */
.map-container {
  width:100%; height:420px;
  border-radius:var(--r-lg);
  overflow:hidden;
  border:1px solid var(--line);
  box-shadow:var(--sh-1);
}
@media (max-width:719px) { .map-container { height:320px; } }
.leaflet-container { font-family:var(--font-ui) !important; }

/* ========================================================================
   Resumen — tiles métricas
   ====================================================================== */
.metric-grid {
  display:grid; gap:14px;
  grid-template-columns:repeat(2, 1fr);
  margin-bottom:24px;
}
@media (min-width:720px) { .metric-grid { grid-template-columns:repeat(4, 1fr); } }
.metric {
  background:var(--bg-elev); border:1px solid var(--line);
  border-radius:var(--r-md); padding:14px;
}
.metric .label { font-size:11px; color:var(--text-muted); text-transform:uppercase; letter-spacing:.06em; }
.metric .value { font-feature-settings:"tnum","ss01"; font-weight:700; font-size:22px; margin-top:4px; letter-spacing:-.02em; }
.metric .sub { font-size:12px; color:var(--text-muted); margin-top:2px; }

/* ========================================================================
   Day-group (planning)
   ====================================================================== */
.day-group { margin-bottom:24px; }
.day-head {
  display:flex; align-items:baseline; gap:10px; margin-bottom:10px;
  padding:0 4px;
}
.day-head .day-num {
  font-family:var(--font-ui);
  font-feature-settings:"tnum","ss01";
  font-weight:600; font-size:12px;
  color:var(--text-muted);
  letter-spacing:.01em;
  text-transform:uppercase;
}
.day-head .day-date {
  font-family:var(--font-titulo); font-weight:600;
  font-size:19px;
  letter-spacing:-.028em;
  color:var(--text);
}
.day-head .day-date::first-letter { text-transform:uppercase; }

/* Tipo de planning_item — punto de color */
.dot-type { width:8px; height:8px; border-radius:50%; }
.dot-type.lugar       { background:#0ea5e9; }
.dot-type.playa       { background:#fbbf24; }
.dot-type.hotel       { background:#a855f7; }
.dot-type.vuelo       { background:#3b82f6; }
.dot-type.transporte  { background:#a855f7; }
.dot-type.coche       { background:#ec4899; }
.dot-type.actividad   { background:#10b981; }
.dot-type.comida      { background:#f97316; }
.dot-type.otro        { background:#64748b; }

/* El círculo exterior con SVG queda oculto — ahora el icono va DENTRO de la card como emoji. */
.timeline-item { position:relative; align-items:center; }
.timeline-item .timeline-icon { display:none !important; }

/* Emoji dentro de un círculo, centrado exacto dentro de la card.
   Usamos text-align + line-height + padding-left:0 para que los emojis
   con anchos visuales irregulares (palmera, hombre andando, avión)
   no queden desplazados. */
.timeline-item .item-emoji {
  width:44px; height:44px; flex-shrink:0;
  border-radius:50%;
  background:var(--bg-soft);
  border:1.5px solid var(--line);
  display:grid; place-items:center;
  text-align:center;
  font-size:22px; line-height:1;
  font-family: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", "Twemoji Mozilla", sans-serif;
  -webkit-font-smoothing:antialiased;
  user-select:none;
  /* Anular cualquier indentación heredada y forzar centrado horizontal real */
  padding:0; margin:0;
}
/* Color del círculo por tipo — fallback cuando el item no tiene estado
   ni color de borde personalizado. */
.timeline-item.type-lugar      .item-emoji { background:#e0f2fe; border-color:#7dd3fc; }
.timeline-item.type-playa      .item-emoji { background:#fef3c7; border-color:#fcd34d; }
.timeline-item.type-hotel      .item-emoji { background:#f3e8ff; border-color:#d8b4fe; }
.timeline-item.type-vuelo      .item-emoji { background:#dbeafe; border-color:#93c5fd; }
.timeline-item.type-transporte .item-emoji { background:#f3e8ff; border-color:#d8b4fe; }
.timeline-item.type-coche      .item-emoji { background:#fce7f3; border-color:#f9a8d4; }
.timeline-item.type-actividad  .item-emoji { background:#d1fae5; border-color:#6ee7b7; }
.timeline-item.type-comida     .item-emoji { background:#ffedd5; border-color:#fdba74; }
.timeline-item.type-otro       .item-emoji { background:#e2e8f0; border-color:#cbd5e1; }
:root[data-tema="oscuro"] .timeline-item .item-emoji {
  background:color-mix(in srgb, var(--bg-elev) 70%, transparent);
  border-color:var(--line);
}

/* Si el item tiene estado, el círculo toma el color del estado (= color del borde de la card) */
.timeline-item.status-por_iniciar .item-emoji {
  border-color: color-mix(in srgb, #f59e0b 55%, var(--line));
  background: color-mix(in srgb, #fbbf24 22%, var(--bg-elev));
}
.timeline-item.status-en_consulta .item-emoji {
  border-color: color-mix(in srgb, #3b82f6 55%, var(--line));
  background: color-mix(in srgb, #60a5fa 18%, var(--bg-elev));
}
.timeline-item.status-confirmado .item-emoji {
  border-color: color-mix(in srgb, #10b981 50%, var(--line));
  background: color-mix(in srgb, #34d399 16%, var(--bg-elev));
}
.timeline-item.status-cancelado .item-emoji {
  border-color: color-mix(in srgb, #ef4444 55%, var(--line));
  background: color-mix(in srgb, #f87171 16%, var(--bg-elev));
}
.timeline-item.type-lugar      .timeline-icon { border-color:#0ea5e9; color:#0369a1; }
.timeline-item.type-playa      .timeline-icon { border-color:#fbbf24; color:#92400e; }
.timeline-item.type-hotel      .timeline-icon { border-color:#a855f7; color:#6b21a8; }
.timeline-item.type-vuelo      .timeline-icon { border-color:#3b82f6; color:#1e40af; }
.timeline-item.type-transporte .timeline-icon { border-color:#a855f7; color:#6b21a8; }
.timeline-item.type-coche      .timeline-icon { border-color:#ec4899; color:#9d174d; }
.timeline-item.type-actividad  .timeline-icon { border-color:#10b981; color:#047857; }
.timeline-item.type-comida     .timeline-icon { border-color:#f97316; color:#9a3412; }
.timeline-item.type-otro       .timeline-icon { border-color:#64748b; color:#334155; }
:root[data-tema="oscuro"] .timeline-item .timeline-icon { color:#e2e8f0; }
/* Si está en estado por_iniciar/en_consulta/etc, el color del borde lo gana el estado */
.timeline-item.status-por_iniciar .timeline-icon { border-color:#f59e0b; }
.timeline-item.status-en_consulta .timeline-icon { border-color:#3b82f6; }
.timeline-item.status-confirmado  .timeline-icon { border-color:#10b981; }
.timeline-item.status-cancelado   .timeline-icon { border-color:#ef4444; }

/* Quitar el círculo CSS antiguo (lo sustituye el icono) */
.timeline-item::before { display:none !important; }

/* Borde de color para items tipo lugar/playa.
   El fondo se mantiene (blanco/elev): solo cambia el borde y el icono del timeline. */
.timeline-item.border-verde,
.timeline-item.border-amarillo,
.timeline-item.border-rojo {
  border-width:2px;
  background:var(--bg-elev) !important;
}
.timeline-item.border-verde    { border-color:#10b981 !important; }
.timeline-item.border-amarillo { border-color:#f59e0b !important; }
.timeline-item.border-rojo     { border-color:#ef4444 !important; }
.timeline-item.border-verde    .timeline-icon { border-color:#10b981 !important; color:#047857; }
.timeline-item.border-amarillo .timeline-icon { border-color:#f59e0b !important; color:#92400e; }
.timeline-item.border-rojo     .timeline-icon { border-color:#ef4444 !important; color:#991b1b; }
:root[data-tema="oscuro"] .timeline-item.border-verde    .timeline-icon { color:#6ee7b7; }
:root[data-tema="oscuro"] .timeline-item.border-amarillo .timeline-icon { color:#fbbf24; }
:root[data-tema="oscuro"] .timeline-item.border-rojo     .timeline-icon { color:#fca5a5; }

/* El círculo del emoji también hereda el color de borde personalizado de lugar/playa */
.timeline-item.border-verde    .item-emoji { border-color:#10b981 !important; background: color-mix(in srgb, #10b981 15%, var(--bg-elev)) !important; }
.timeline-item.border-amarillo .item-emoji { border-color:#f59e0b !important; background: color-mix(in srgb, #f59e0b 16%, var(--bg-elev)) !important; }
.timeline-item.border-rojo     .item-emoji { border-color:#ef4444 !important; background: color-mix(in srgb, #ef4444 14%, var(--bg-elev)) !important; }

/* Estado "Visto" — la tarjeta entera queda en gris apagada.
   Gana en especificidad a status-* y border-* gracias a !important. */
.timeline-item.visited,
.list-item.visited {
  background: var(--bg-soft) !important;
  border-color: var(--line) !important;
  opacity: .78;
}
.timeline-item.visited .li-title,
.timeline-item.visited .li-sub {
  color: var(--text-muted) !important;
}
.timeline-item.visited .item-emoji {
  background: var(--bg-soft) !important;
  border-color: var(--line) !important;
  filter: grayscale(.85);
}
/* Botón "Visto" cuando ya está marcado */
.btn-visited-on {
  background: var(--status-curso) !important;
  color: #fff !important;
  border-color: transparent !important;
}
.btn-visited-on svg { stroke:#fff; }

/* Picker visual en el editor */
.border-color-grid {
  display:grid; grid-template-columns:repeat(4, 1fr); gap:8px;
  margin-top:6px;
}
.border-color-swatch {
  display:flex; flex-direction:column; align-items:center;
  padding:10px 8px; border:2px solid var(--line);
  background:var(--bg-elev); border-radius:var(--r-md);
  cursor:pointer; transition:all .12s var(--ease);
  font-family:var(--font-ui); font-size:11.5px; font-weight:600;
  letter-spacing:-.005em; color:var(--text);
  text-align:center;
}
.border-color-swatch:hover { transform:translateY(-1px); }
.border-color-swatch.active { transform:scale(1.04); }
.border-color-swatch .dot {
  width:14px; height:14px; border-radius:50%;
  margin-bottom:4px; border:2px solid currentColor;
  background:transparent;
}
.border-color-swatch.b-ninguno  { color:var(--text-muted); }
.border-color-swatch.b-verde    { color:#10b981; }
.border-color-swatch.b-amarillo { color:#f59e0b; }
.border-color-swatch.b-rojo     { color:#ef4444; }
.border-color-swatch.b-ninguno .dot  { border-style:dashed; }
.border-color-swatch.active.b-verde    { border-color:#10b981; background:color-mix(in srgb, #10b981 8%, var(--bg-elev)); }
.border-color-swatch.active.b-amarillo { border-color:#f59e0b; background:color-mix(in srgb, #f59e0b 8%, var(--bg-elev)); }
.border-color-swatch.active.b-rojo     { border-color:#ef4444; background:color-mix(in srgb, #ef4444 8%, var(--bg-elev)); }
.border-color-swatch.active.b-ninguno  { border-color:var(--text-muted); background:var(--bg-soft); }

/* ========================================================================
   Presupuesto — gráfica barras horizontales
   ====================================================================== */
.bar-row { display:flex; align-items:center; gap:12px; margin-bottom:10px; }
.bar-row .cat { width:110px; font-size:13px; color:var(--text-muted); flex-shrink:0; }
.bar-row .bar-wrap { flex:1; background:var(--bg-soft); height:8px; border-radius:var(--r-pill); overflow:hidden; }
.bar-row .bar-fill { height:100%; background:linear-gradient(90deg, var(--accent), var(--accent-2)); border-radius:var(--r-pill); }
.bar-row .amount { font-feature-settings:"tnum","ss01"; font-weight:600; font-size:13px; min-width:80px; text-align:right; }

/* Donut presupuesto */
.budget-split {
  display:grid; gap:24px; align-items:center;
  grid-template-columns:1fr;
}
@media (min-width:720px) { .budget-split { grid-template-columns:220px 1fr; } }
.donut { width:200px; height:200px; margin:0 auto; }
.donut-total { font-family:var(--font-ui); font-feature-settings:"tnum","ss01"; font-size:5px; font-weight:700; fill:var(--text); letter-spacing:-.02em; }
.budget-bars { width:100%; }

/* Progreso vs objetivo */
.budget-progress { display:flex; flex-direction:column; gap:8px; }
.budget-bar { background:var(--bg-soft); height:12px; border-radius:var(--r-pill); overflow:hidden; }
.budget-fill { height:100%; background:linear-gradient(90deg, var(--accent), var(--accent-2)); transition:width .3s var(--ease); }
.budget-fill.over { background:linear-gradient(90deg, #f97316, var(--danger)); }
.budget-legend { display:flex; justify-content:space-between; font-size:13px; }

/* Drag handle / drag state */
.drag-handle {
  color:var(--text-muted); cursor:grab;
  display:flex; align-items:center; padding:0 4px;
}
.drag-handle:active { cursor:grabbing; }
.list-item.dragging { opacity:.4; }
.list-item.drag-over-top { box-shadow: 0 -2px 0 var(--accent); }
.list-item.drag-over-bot { box-shadow: 0  2px 0 var(--accent); }

/* Durante un drag activo, todos los days son drop targets — se marcan ligeramente
   para que el usuario entienda que puede mover entre días. */
body.dragging-planning .day-group {
  transition: background .12s var(--ease), outline .12s var(--ease);
  border-radius: var(--r-md);
  outline: 1px dashed color-mix(in srgb, var(--accent) 30%, transparent);
  outline-offset: 4px;
}
.day-group.day-target {
  background: color-mix(in srgb, var(--accent) 8%, transparent);
  outline: 2px dashed var(--accent) !important;
}
body.dragging-planning .day-head { color: var(--accent); }

/* Timeline vertical en planning */
.day-group { position:relative; padding-left:0; }
.timeline-list { position:relative; }
/* La línea vertical del timeline ya no aplica — los items son cards independientes
   con su emoji y la "línea" creaba ruido visual con padding asimétrico. */
.timeline-item {
  position:relative;
  margin-bottom:8px;
  /* padding-left:38px se eliminó — el círculo del timeline ya no se renderiza
     (lo sustituye el emoji dentro de la card), así que ese padding solo creaba
     asimetría y empujaba contenido hacia la derecha en móviles estrechos. */
}
.timeline-item::before {
  content:''; position:absolute; left:8px; top:18px;
  width:14px; height:14px; border-radius:50%;
  background:var(--bg-elev); border:2px solid var(--accent);
  box-shadow:0 0 0 3px var(--bg);
  z-index:1;
}
.timeline-item .time-pill {
  display:inline-block;
  font-family:var(--font-ui);
  font-feature-settings:"tnum","ss01";
  font-size:11.5px;
  font-weight:600;
  letter-spacing:-.005em;
  background:var(--bg-soft); color:var(--text-muted);
  padding:3px 9px; border-radius:var(--r-pill); margin-right:6px;
}
.day-note-card {
  background:color-mix(in srgb, var(--accent-bg) 30%, var(--bg-elev));
  border:1px dashed color-mix(in srgb, var(--accent) 35%, var(--line));
  border-radius:var(--r-md); padding:10px 14px;
  margin:0 0 12px 38px; font-size:13.5px;
  white-space:pre-wrap;
}
.day-actions { display:flex; gap:6px; }

/* Pill del título del día */
.day-title-pill {
  display:inline-flex; align-items:center;
  font-family:var(--font-ui);
  font-size:12.5px; font-weight:600; letter-spacing:-.005em;
  padding:4px 12px; border-radius:var(--r-pill);
  margin-left:10px;
  background: color-mix(in srgb, var(--accent) 18%, var(--bg-elev));
  color: var(--accent);
  border: 1px solid color-mix(in srgb, var(--accent) 35%, transparent);
  white-space:nowrap;
}
.day-title-pill.color-azul    { background:color-mix(in srgb, #3b82f6 18%, var(--bg-elev)); color:#1e40af; border-color:color-mix(in srgb, #3b82f6 38%, transparent); }
.day-title-pill.color-verde   { background:color-mix(in srgb, #10b981 18%, var(--bg-elev)); color:#047857; border-color:color-mix(in srgb, #10b981 38%, transparent); }
.day-title-pill.color-naranja { background:color-mix(in srgb, #f97316 18%, var(--bg-elev)); color:#9a3412; border-color:color-mix(in srgb, #f97316 38%, transparent); }
.day-title-pill.color-rojo    { background:color-mix(in srgb, #ef4444 18%, var(--bg-elev)); color:#991b1b; border-color:color-mix(in srgb, #ef4444 38%, transparent); }
.day-title-pill.color-morado  { background:color-mix(in srgb, #a855f7 18%, var(--bg-elev)); color:#6b21a8; border-color:color-mix(in srgb, #a855f7 38%, transparent); }
.day-title-pill.color-rosa    { background:color-mix(in srgb, #ec4899 18%, var(--bg-elev)); color:#9d174d; border-color:color-mix(in srgb, #ec4899 38%, transparent); }
.day-title-pill.color-ambar   { background:color-mix(in srgb, #f59e0b 18%, var(--bg-elev)); color:#92400e; border-color:color-mix(in srgb, #f59e0b 38%, transparent); }
.day-title-pill.color-gris    { background:color-mix(in srgb, #64748b 18%, var(--bg-elev)); color:#334155; border-color:color-mix(in srgb, #64748b 38%, transparent); }
:root[data-tema="oscuro"] .day-title-pill.color-azul    { color:#93c5fd; }
:root[data-tema="oscuro"] .day-title-pill.color-verde   { color:#6ee7b7; }
:root[data-tema="oscuro"] .day-title-pill.color-naranja { color:#fdba74; }
:root[data-tema="oscuro"] .day-title-pill.color-rojo    { color:#fca5a5; }
:root[data-tema="oscuro"] .day-title-pill.color-morado  { color:#d8b4fe; }
:root[data-tema="oscuro"] .day-title-pill.color-rosa    { color:#fbcfe8; }
:root[data-tema="oscuro"] .day-title-pill.color-ambar   { color:#fcd34d; }
:root[data-tema="oscuro"] .day-title-pill.color-gris    { color:#cbd5e1; }

/* Color picker dentro del modal de editar día */
.color-grid {
  display:grid; grid-template-columns:repeat(4, 1fr); gap:8px;
  margin-top:6px;
}
.color-swatch {
  height:42px; border-radius:var(--r-md); cursor:pointer;
  border:2px solid transparent;
  display:flex; align-items:center; justify-content:center;
  font-size:12px; font-weight:600;
  transition: transform .12s var(--ease), border-color .12s var(--ease);
}
.color-swatch:hover { transform:translateY(-1px); }
.color-swatch.active { border-color:var(--text); transform:scale(1.05); }
.color-swatch[data-color="azul"]    { background:color-mix(in srgb, #3b82f6 22%, var(--bg-elev)); color:#1e40af; }
.color-swatch[data-color="verde"]   { background:color-mix(in srgb, #10b981 22%, var(--bg-elev)); color:#047857; }
.color-swatch[data-color="naranja"] { background:color-mix(in srgb, #f97316 22%, var(--bg-elev)); color:#9a3412; }
.color-swatch[data-color="rojo"]    { background:color-mix(in srgb, #ef4444 22%, var(--bg-elev)); color:#991b1b; }
.color-swatch[data-color="morado"]  { background:color-mix(in srgb, #a855f7 22%, var(--bg-elev)); color:#6b21a8; }
.color-swatch[data-color="rosa"]    { background:color-mix(in srgb, #ec4899 22%, var(--bg-elev)); color:#9d174d; }
.color-swatch[data-color="ambar"]   { background:color-mix(in srgb, #f59e0b 22%, var(--bg-elev)); color:#92400e; }
.color-swatch[data-color="gris"]    { background:color-mix(in srgb, #64748b 22%, var(--bg-elev)); color:#334155; }

/* Wishlist */
.wish-grid {
  display:grid; gap:14px;
  grid-template-columns:1fr;
}
@media (min-width:720px) { .wish-grid { grid-template-columns:1fr 1fr; } }
.wish-card {
  background:var(--bg-elev); border:1px solid var(--line);
  border-radius:var(--r-md); padding:14px 16px;
}
.wish-card.visited { opacity:.6; }
.wish-card .wish-head { display:flex; gap:10px; align-items:flex-start; }
.wish-card .wish-name { font-weight:600; flex:1; }
.wish-card.visited .wish-name { text-decoration:line-through; }
.wish-card .wish-cat {
  font-size:11px; font-weight:500; color:var(--text-muted);
  background:var(--bg-soft); padding:2px 8px; border-radius:var(--r-pill);
}
.wish-card .wish-actions { display:flex; gap:6px; margin-top:10px; }

/* Vista cronológica reservas */
.cron-divider {
  font-size:13px; color:var(--text-muted); font-weight:500;
  margin:18px 0 8px; padding-left:4px;
}

/* Badge "Modo lector" en topbar y vistas */
.readonly-badge {
  display:inline-flex; align-items:center; gap:6px;
  font-family:var(--font-ui);
  font-size:11.5px; font-weight:600;
  letter-spacing:.005em;
  padding:4px 11px; border-radius:var(--r-pill);
  background:color-mix(in srgb, var(--status-prep) 14%, var(--bg-elev));
  color:var(--status-prep);
  border:1px solid color-mix(in srgb, var(--status-prep) 35%, transparent);
}
.readonly-badge svg { width:12px; height:12px; }
.readonly-banner {
  display:flex; align-items:center; gap:10px;
  padding:10px 14px; margin-bottom:16px;
  border:1px solid color-mix(in srgb, var(--status-prep) 40%, var(--line));
  background:color-mix(in srgb, var(--status-prep) 8%, var(--bg-elev));
  border-radius:var(--r-md);
  font-size:13.5px;
}
.readonly-banner .ico { color:var(--status-prep); flex-shrink:0; }

/* Modo lector — oculta UI de modificación de un solo golpe */
body.readonly .btn-primary,
body.readonly .fab,
body.readonly [data-edit-only="true"] {
  display:none !important;
}
body.readonly .switch { pointer-events:none; opacity:.55; }
body.readonly .check { pointer-events:none; opacity:.55; }
/* Drag handles no tienen sentido si no puedes reordenar */
body.readonly .drag-handle { display:none !important; }
body.readonly .timeline-item { cursor:default; }

/* Bloque para mostrar un error de render visible al usuario */
.render-error {
  background:color-mix(in srgb, var(--danger) 8%, var(--bg-elev));
  border:1px solid color-mix(in srgb, var(--danger) 40%, var(--line));
  border-radius:var(--r-md); padding:16px 18px; margin:16px 0;
  color:var(--text); font-size:14px;
}
.render-error strong { display:block; color:var(--danger); margin-bottom:4px; }
.render-error code {
  display:block; white-space:pre-wrap; word-break:break-word;
  background:var(--bg-soft); padding:8px 10px; border-radius:8px; margin-top:8px;
  font-family:ui-monospace, 'SF Mono', Menlo, monospace; font-size:12px;
}

/* ========================================================================
   Banner de aviso (caducidad de docs)
   ====================================================================== */
.banner {
  display:flex; align-items:flex-start; gap:12px;
  padding:14px 16px;
  border:1px solid var(--line); border-radius:var(--r-md);
  background:var(--bg-elev); margin-bottom:16px;
}
.banner.warn { border-color:color-mix(in srgb, var(--status-prep) 50%, var(--line)); background:color-mix(in srgb, var(--status-prep) 8%, var(--bg-elev)); }
.banner.danger { border-color:color-mix(in srgb, var(--danger) 50%, var(--line)); background:color-mix(in srgb, var(--danger) 8%, var(--bg-elev)); }
.banner .ico { flex-shrink:0; color:var(--status-prep); }
.banner.danger .ico { color:var(--danger); }
.banner-body { font-size:14px; }
.banner-body strong { font-weight:600; }

/* ========================================================================
   Toast
   ====================================================================== */
.toast-box {
  position:fixed; left:50%; bottom:88px; transform:translateX(-50%);
  z-index:100; pointer-events:none;
  display:flex; flex-direction:column; gap:8px; align-items:center;
}
.toast {
  background:var(--text); color:var(--text-inv);
  padding:10px 16px; border-radius:var(--r-pill);
  font-size:14px; box-shadow:var(--sh-3);
  animation: toastIn .25s var(--ease);
}
@keyframes toastIn { from { transform:translateY(20px); opacity:0; } to { transform:none; opacity:1; } }

/* ========================================================================
   Profile picker (pantalla inicial)
   ====================================================================== */
.profile-screen {
  min-height:100dvh; display:flex; flex-direction:column;
  justify-content:center; align-items:center;
  padding:32px 24px; gap:48px;
}
.profile-hero {
  text-align:center; max-width:480px;
}
.profile-hero h1 {
  font-family:var(--font-titulo); font-weight:600; letter-spacing:-.03em;
  font-size:36px; margin:0 0 8px;
}
.profile-hero p { color:var(--text-muted); margin:0; font-size:15px; }
.profile-list { display:flex; flex-direction:column; gap:14px; width:100%; max-width:360px; }
.profile-btn {
  display:flex; align-items:center; gap:16px;
  width:100%; padding:18px 20px;
  background:var(--bg-elev); border:1px solid var(--line);
  border-radius:var(--r-lg); cursor:pointer; box-shadow:var(--sh-1);
  transition:transform .18s var(--ease), box-shadow .18s var(--ease);
  text-align:left; color:var(--text);
}
.profile-btn:hover { transform:translateY(-2px); box-shadow:var(--sh-2); }
.profile-avatar {
  width:48px; height:48px; border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  font-family:var(--font-titulo); font-weight:700; font-size:18px; color:#fff;
  flex-shrink:0;
}
.avatar-r { background:linear-gradient(135deg, #2563eb, #06b6d4); }
.avatar-s { background:linear-gradient(135deg, #f97316, #facc15); }
.avatar-i { background:linear-gradient(135deg, #64748b, #94a3b8); }
.profile-info { flex:1; }
.profile-name { font-weight:600; font-size:16px; }
.profile-sub { font-size:13px; color:var(--text-muted); }

/* ========================================================================
   Misc — dividers, etc.
   ====================================================================== */
.divider { height:1px; background:var(--line-soft); margin:24px 0; }
.kv { display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px solid var(--line-soft); }
.kv .k { color:var(--text-muted); font-size:14px; }
.kv .v { font-feature-settings:"tnum","ss01"; font-weight:500; font-size:14px; }
.kv:last-child { border-bottom:none; }

.row { display:flex; align-items:center; gap:8px; }
.gap { flex:1; }

.tag {
  display:inline-flex; align-items:center; gap:4px;
  padding:3px 8px; border-radius:var(--r-pill);
  font-size:11px; font-weight:500; color:var(--text-muted);
  background:var(--bg-soft); border:1px solid var(--line);
}
.amount-eur { font-feature-settings:"tnum","ss01"; font-weight:600; letter-spacing:-.005em; }

/* hide while routing */
[hidden] { display:none !important; }

.search-results {
  border:1px solid var(--line); border-radius:var(--r-md);
  background:var(--bg-elev); margin-top:4px;
  max-height:200px; overflow-y:auto;
}

/* Bloque verde de "lugar seleccionado" tras elegir un resultado de Nominatim */
.place-selected {
  display:flex; align-items:center; gap:10px;
  padding:10px 12px; margin-top:8px;
  background:color-mix(in srgb, var(--status-curso) 10%, var(--bg-soft));
  border:1px solid color-mix(in srgb, var(--status-curso) 38%, var(--line));
  border-radius:var(--r-md);
  font-size:13.5px;
}
.place-selected .icon {
  color:var(--status-curso);
  display:flex; align-items:center; justify-content:center;
  width:24px; height:24px; flex-shrink:0;
}
.place-selected .icon svg { width:18px; height:18px; }
.place-selected .name { flex:1; font-weight:600; min-width:0; word-break:break-word; }
.place-selected .coords {
  font-feature-settings:"tnum","ss01";
  font-size:11.5px; color:var(--text-muted); font-weight:500;
  white-space:nowrap;
}
.place-selected .clear {
  background:transparent; border:none; color:var(--text-muted);
  cursor:pointer; padding:4px; border-radius:6px;
  display:flex; align-items:center;
}
.place-selected .clear:hover { background:var(--bg-soft); color:var(--text); }
.search-result {
  padding:10px 12px; cursor:pointer; border-bottom:1px solid var(--line-soft); font-size:14px;
}
.search-result:last-child { border-bottom:none; }
.search-result:hover { background:var(--bg-soft); }

/* Calendario unificado */
.cal-grid {
  display:grid; grid-template-columns:repeat(7, 1fr); gap:4px;
}
.cal-head {
  font-size:11px; font-weight:600; color:var(--text-muted);
  text-transform:uppercase; letter-spacing:.05em;
  text-align:center; padding:6px 2px;
}
.cal-cell {
  min-height:80px; padding:6px; border-radius:8px;
  background:var(--bg-elev); border:1px solid var(--line);
  cursor:default;
  display:flex; flex-direction:column; gap:2px;
}
.cal-cell.empty { background:transparent; border:none; }
.cal-cell.today { border-color:var(--accent); border-width:2px; padding:5px; }
.cal-cell:has(.cal-evt) { cursor:pointer; }
.cal-cell:has(.cal-evt):hover { box-shadow:var(--sh-1); transform:translateY(-1px); }
.cal-day {
  font-family:var(--font-ui);
  font-feature-settings:"tnum","ss01";
  font-size:12.5px; font-weight:600; color:var(--text-muted);
  margin-bottom:2px;
}
.cal-cell.today .cal-day { color:var(--accent); }
.cal-evt {
  font-size:10.5px; padding:2px 5px; border-radius:4px;
  background:var(--bg-soft); color:var(--text);
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  border-left:2px solid var(--text-muted);
}
.cal-evt.evt-lugar       { border-left-color:#0ea5e9; }
.cal-evt.evt-hotel       { border-left-color:#a855f7; }
.cal-evt.evt-vuelo       { border-left-color:#3b82f6; }
.cal-evt.evt-transporte  { border-left-color:#a855f7; }
.cal-evt.evt-coche       { border-left-color:#ec4899; }
.cal-evt.evt-actividad   { border-left-color:#10b981; }
.cal-evt.evt-comida      { border-left-color:#f97316; }
.cal-more { font-size:10px; color:var(--text-muted); padding-left:4px; }

/* World map (visited countries) */
.world-map { width:100%; height:360px; border:1px solid var(--line); border-radius:var(--r-lg); overflow:hidden; }

/* leaflet popup tweak */
.leaflet-popup-content-wrapper { border-radius:12px !important; }
.leaflet-popup-content { font-family:var(--font-ui) !important; margin:12px 14px !important; }

</style>

// Orden cronológico estricto para items del mismo día:

// 3) Resto por hora ascendente.
// 4) Empate → order_index.
const planningCompare = (a, b) => {
  const aCo = a._virtual === 'checkout' ? -1 : 0;
  const bCo = b._virtual === 'checkout' ? -1 : 0;
  if (aCo !== bCo) return aCo - bCo;
  const aEnd = (typeDef(a.type).endOfDay && a._virtual !== 'checkout') ? 1 : 0;
  const bEnd = (typeDef(b.type).endOfDay && b._virtual !== 'checkout') ? 1 : 0;
  if (aEnd !== bEnd) return aEnd - bEnd;
  const aT = a.time || '99:99';
  const bT = b.time || '99:99';
  const tCmp = aT.localeCompare(bT);
  if (tCmp) return tCmp;
  return (a.order_index || 0) - (b.order_index || 0);
};

const $  = (sel, root=document) => root.querySelector(sel);
const $$ = (sel, root=document) => Array.from(root.querySelectorAll(sel));
const el = (tag, props={}, children=[]) => {
  const n = document.createElement(tag);
  for (const [k,v] of Object.entries(props||{})) {
    if (k === 'class') n.className = v;
    else if (k === 'html') n.innerHTML = v;
    else if (k === 'text') n.textContent = v;
    else if (k === 'style') Object.assign(n.style, v);
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
    else if (k === 'data') Object.entries(v).forEach(([dk,dv]) => n.dataset[dk] = dv);
    else if (v !== null && v !== undefined && v !== false) n.setAttribute(k, v === true ? '' : v);
  }
  (Array.isArray(children) ? children : [children]).forEach(c => {
    if (c == null || c === false) return;
    if (typeof c === 'string') n.appendChild(document.createTextNode(c));
    else n.appendChild(c);
  });
  return n;
};
const html = (strings, ...values) => {
  let out = '';
  strings.forEach((s,i) => {
    out += s;
    if (i < values.length) {
      const v = values[i];
      out += (v == null || v === false) ? '' : String(v);
    }
  });
  return out;
};
const escHtml = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uuid = () => (crypto.randomUUID ? crypto.randomUUID() :
  'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
    const r = Math.random()*16|0, v = c==='x'?r:(r&0x3|0x8); return v.toString(16);
  }));
const nowIso = () => new Date().toISOString();
const todayIso = () => { const d = new Date(); d.setHours(0,0,0,0); return d.toISOString().slice(0,10); };

// Fechas
const parseDate = (iso) => iso ? new Date(iso + 'T00:00:00') : null;
const fmtDate = (iso, opts={}) => {
  if (!iso) return '';
  const d = new Date(iso + 'T00:00:00');
  return d.toLocaleDateString('es-ES', opts);
};
const fmtDayLong = (iso) => fmtDate(iso, {weekday:'long', day:'numeric', month:'long'});
// Formato medio inequívoco: "vie 2 ago" (con día de la semana corto delante).
// Antes era solo "2 ago", que se confundía con "hace 2".
const fmtDateShort = (iso) => fmtDate(iso, {weekday:'short', day:'numeric', month:'short'});
const daysBetween = (a, b) => {
  if (!a || !b) return 0;
  const ms = parseDate(b) - parseDate(a);
  return Math.round(ms / (24*3600*1000));
};
const daysFromToday = (iso) => {
  if (!iso) return null;
  const today = parseDate(todayIso());
  return Math.round((parseDate(iso) - today) / (24*3600*1000));
};

// Money
const fmtMoney = (amount, currency='EUR') => {
  const n = Number(amount || 0);
  try {
    return new Intl.NumberFormat('es-ES', { style:'currency', currency }).format(n);
  } catch (e) {
    return n.toFixed(2) + ' ' + currency;
  }
};

// Status de un viaje según fechas + in_preparation
const tripStatus = (t) => {
  const today = todayIso();
  if (t.start_date && t.end_date && t.start_date <= today && t.end_date >= today) return 'curso';
  if (t.in_preparation) return 'prep';
  if (t.start_date && t.start_date > today) return 'prox';
  if (t.end_date && t.end_date < today) return 'pas';
  return 'prep';
};
const statusLabel = (s) => ({curso:'En curso', prep:'En preparación', prox:'Próximo', pas:'Pasado'}[s] || s);
const statusDays = (t) => {
  const s = tripStatus(t);
  if (s === 'curso') {
    const dia = daysBetween(t.start_date, todayIso()) + 1;
    const total = daysBetween(t.start_date, t.end_date) + 1;
    return `Día ${dia} de ${total}`;
  }
  if (s === 'prox') {
    const d = daysFromToday(t.start_date);
    if (d === 0) return 'Hoy mismo';
    if (d === 1) return 'Mañana';
    return `Faltan ${d} días`;
  }
  if (s === 'pas') return 'Finalizado';
  if (s === 'prep') {
    if (t.start_date) {
      const d = daysFromToday(t.start_date);
      if (d !== null && d > 0) return `En preparación · faltan ${d} d`;
    }
    return 'En preparación';
  }
  return '';
};
