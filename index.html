          el('button', { class: sort === 'abc' ? 'active' : '', title:'Orden alfabético', onclick: () => { TripDetail._packingSort = 'abc'; Router.render(); } }, 'A-Z'),
        ]),
        collapseAllBtn,
        canEdit() ? el('button', { class:'icon-btn icon-btn-primary', title:'Añadir elemento', 'aria-label':'Añadir elemento',
          onclick: () => TripDetail.openPackingEditor(t), html: svg('plus') }) : null,
        canEdit() ? el('button', { class:'icon-btn', title:'Nuevo grupo', 'aria-label':'Nuevo grupo',
          onclick: () => TripDetail._openNewPackingGroup(t), html: svg('folderplus') }) : null,
        // Restaurar lista (desmarcar todo): solo visible en modo edición.
        (canEdit() && editMode) ? el('button', { class:'icon-btn pack-reset', title:'Restaurar lista (desmarcar todo)', 'aria-label':'Restaurar lista',
          onclick: () => TripDetail._resetPackingList(t), html: svg('refresh') }) : null,
        // Toggle de modo edición: muestra reordenar/borrar/renombrar grupos.
        canEdit() ? el('button', { class:'icon-btn' + (editMode ? ' edit-on' : ''), title: editMode ? 'Listo' : 'Editar grupos',
          'aria-pressed': editMode ? 'true' : 'false', 'aria-label':'Editar',
          onclick: () => { TripDetail._packingEditMode = !TripDetail._packingEditMode; Router.render(); }, html: svg(editMode ? 'check' : 'edit') }) : null,
      ].filter(Boolean)),
    ]));
    refreshProgress();

    if (!items.length && !customCats.length) {
      root.appendChild(el('div', { class:'empty' }, [
        el('div', { class:'icon', html: svg('suit') }),
        el('h3', { text:'Maleta vacía' }),
        el('p', { text:'Añade cosas con el “+”, crea un grupo o aplica una plantilla.' }),
      ]));
      return;
    }

    // Agrupar por categoría y construir el orden de grupos (respetando el orden guardado).
    const { cats, byCat } = TripDetail._packingCats(t, items);

    // Progreso por grupo: total, marcados y "completado" (todos marcados).
    const catStats = (cid) => {
      const arr = byCat[cid] || [];
      const total = arr.length;
      const done = arr.filter(i => i.checked).length;
      return { total, done, complete: total > 0 && done === total };
    };
    // Color de la pill del título por tramos, con saltos claros entre niveles.
    // El verde se reserva al 100%; los parciales se reparten en cálidos (rojo→ámbar→amarillo→lima),
    // que es donde el ojo distingue mejor. Evita que todo lo "casi hecho" se vea igual de verde.
    // El verde (140) es EXCLUSIVO del 100%; todo lo parcial queda en cálidos (≤58),
    // con un salto grande hasta el verde para que "completado" se distinga a la vista.
    const pillHue = (pct) =>
      pct >= 1    ? 140 :   // verde — solo completo
      pct >= 0.8  ? 58  :   // amarillo
      pct >= 0.6  ? 45  :   // ámbar
      pct >= 0.4  ? 32  :   // naranja
      pct >= 0.2  ? 18  :   // rojo-naranja
                    4;      // rojo
    const applyPill = (node, s) => {
      const empty = s.total === 0;
      node.classList.toggle('pack-pill-empty', empty);
      if (!empty) node.style.setProperty('--pill-h', String(pillHue(s.done / s.total)));
      // Pista textual (accesibilidad / colorblind): "5 de 11 preparados".
      node.title = empty ? 'Grupo vacío' : `${s.done} de ${s.total} preparados`;
    };

    // Orden de grupos según el modo: "auto" hunde los completados al final;
    // "abc" alfabético; "custom" conserva el orden guardado (de _packingCats).
    if (sort === 'abc') {
      cats.sort((a, b) => (a.label || '').localeCompare(b.label || '', 'es'));
    } else if (sort === 'auto') {
      // Estable: dentro de "sin completar" y "completados" se respeta el orden base.
      cats.sort((a, b) => (catStats(a.id).complete ? 1 : 0) - (catStats(b.id).complete ? 1 : 0));
    }

    // Por defecto, todos los grupos plegados la primera vez que se abre la maleta de este viaje.
    if (!TripDetail._packingCollapseInit.has(t.id)) {
      cats.forEach(c => TripDetail._packingCollapsedCats.add(c.id));
      TripDetail._packingCollapseInit.add(t.id);
    }

    // Estado inicial del botón "plegar/desplegar todo".
    const allCollapsedInit = cats.length > 0 && cats.every(c => TripDetail._packingCollapsedCats.has(c.id));
    collapseAllBtn.classList.toggle('all-collapsed', allCollapsedInit);
    collapseAllBtn.title = allCollapsedInit ? 'Desplegar todo' : 'Plegar todo';

    // Orden dentro del grupo: marcados SIEMPRE al final; el resto por A-Z o por order_index.
    const sortItems = (arr) => arr.slice().sort((a, b) => {
      if (!!a.checked !== !!b.checked) return a.checked ? 1 : -1;
      if (sort === 'abc') return (a.name || '').localeCompare(b.name || '', 'es');
      return (a.order_index || 0) - (b.order_index || 0);
    });

    let draggedRow = null;
    const clearDnd = () => root.querySelectorAll('.drag-over-top,.drag-over-bot,.pack-cat-target')
      .forEach(n => n.classList.remove('drag-over-top', 'drag-over-bot', 'pack-cat-target'));

    for (const c of cats) {
      const collapsed = TripDetail._packingCollapsedCats.has(c.id);
      const grp = el('div', { class:'pack-group' + (collapsed ? ' collapsed' : ''), data:{ cat:c.id } });
      const isPill = !(editMode && canEdit());
      // En modo edición el título es editable (renombra el grupo); si no, es una pill de color.
      const titleEl = isPill
        ? el('span', { class:'pack-group-title pack-pill', text: c.label })
        : el('input', { class:'pack-group-title-input', value: c.label, 'aria-label':'Nombre del grupo',
            onkeydown: (e) => { if (e.key === 'Enter') { e.preventDefault(); e.target.blur(); } },
            onblur: (e) => TripDetail._renamePackingGroup(t, c.id, e.target.value) });
      if (isPill) applyPill(titleEl, catStats(c.id));
      const countEl = el('span', { class:'pack-group-count', text: `${catStats(c.id).done}/${catStats(c.id).total}` });
      // Refresca pill + contador en vivo al marcar/desmarcar (sin re-render completo).
      const updateHead = () => {
        const s = catStats(c.id);
        countEl.textContent = `${s.done}/${s.total}`;
        if (isPill) applyPill(titleEl, s);
        return s.complete;
      };
      const head = el('div', { class:'pack-group-head', onclick: (e) => {
        if (e.target.closest('.pack-group-act') || e.target.closest('.pack-group-title-input')) return;
        const willCollapse = !grp.classList.contains('collapsed');
        grp.classList.toggle('collapsed', willCollapse);
        if (willCollapse) TripDetail._packingCollapsedCats.add(c.id); else TripDetail._packingCollapsedCats.delete(c.id);
      } }, [
        el('span', { class:'pack-group-chevron', html: svg('chevron') }),
        titleEl,
        countEl,
        el('div', { class:'gap' }),
        // Reordenar/borrar grupos: solo en modo edición.
        (editMode && canEdit() && cats.length > 1) ? el('button', { class:'icon-btn pack-group-act', title:'Subir grupo', html: svg('arrup'),
          disabled: cats.indexOf(c) === 0 ? true : null,
          onclick: () => TripDetail._movePackingGroup(t, c.id, -1) }) : null,
        (editMode && canEdit() && cats.length > 1) ? el('button', { class:'icon-btn pack-group-act', title:'Bajar grupo', html: svg('arrdown'),
          disabled: cats.indexOf(c) === cats.length - 1 ? true : null,
          onclick: () => TripDetail._movePackingGroup(t, c.id, 1) }) : null,
        // "+" para añadir a este grupo: siempre.
        canEdit() ? el('button', { class:'icon-btn pack-group-act', title:'Añadir a este grupo', html: svg('plus'),
          onclick: () => TripDetail.openPackingEditor(t, null, c.id) }) : null,
        (editMode && canEdit() && c.custom) ? el('button', { class:'icon-btn pack-group-act', title:'Borrar grupo', html: svg('trash'),
          onclick: () => TripDetail._deletePackingGroup(t, c.id) }) : null,
      ].filter(Boolean));
      grp.appendChild(head);

      const ul = el('div', { class:'pack-list', data:{ cat:c.id } });
      const makeRow = (i) => {
        // Reordenar (arrastrar) y editar item: solo en modo edición.
        const draggable = editMode && sort === 'custom' && canEdit() && !i.checked;
        const row = el('div', { class:'pack-item' + (i.checked ? ' done' : ''), data:{ id:i.id, cat:c.id }, draggable: draggable ? 'true' : 'false' });
        let toggling = false;
        const toggle = async () => {
          if (row._justDragged) { row._justDragged = false; return; }  // venía de arrastrar
          if (!canEdit()) { UI.toast('Modo lector — no puedes modificar'); return; }
          if (toggling) return; toggling = true;
          const wasComplete = catStats(c.id).complete;
          i.checked = !i.checked;
          // Feedback inmediato: tic verde + apagado + breve destello verde.
          row.classList.toggle('done', i.checked);
          check.classList.toggle('on', i.checked);
          check.innerHTML = i.checked ? svg('check') : '';
          check.setAttribute('aria-pressed', i.checked ? 'true' : 'false');
          if (i.checked) { row.classList.add('just-checked'); }
          refreshProgress();
          updateHead();
          try { await DB.put('packing_items', i); } catch (e) { console.error(e); }
          // Tras unos ms (se ve el verde), reordena deslizando el elemento.
          setTimeout(() => { reorderWithFlip(); }, 300);
          // En modo "Auto", si el grupo pasó a (in)completo, recoloca los grupos al terminar
          // la animación — conservando el scroll para no saltar arriba del todo.
          if (sort === 'auto' && wasComplete !== catStats(c.id).complete) {
            setTimeout(() => Router.renderKeepScroll(), 700);
          }
        };
        const check = el('button', {
          class:'pack-check' + (i.checked ? ' on' : ''), 'aria-pressed': i.checked ? 'true' : 'false',
          title:'Marcar como preparado', html: i.checked ? svg('check') : '', onclick: toggle,
        });
        row.appendChild(check);
        // Tocar el texto también marca/desmarca.
        row.appendChild(el('div', { class:'pack-name', onclick: toggle }, i.name));
        if (editMode && canEdit()) row.appendChild(el('button', { class:'icon-btn pack-del', title:'Editar', html: svg('edit'),
          onclick: (e) => { e.stopPropagation(); TripDetail.openPackingEditor(t, i); } }));
        // Arrastrar SIN grip: en escritorio con drag nativo; en táctil, dejando pulsada
        // la pill (long-press) y moviéndola.
        if (draggable) {
          // Ratón (HTML5 drag) — se puede agarrar la pill entera.
          row.addEventListener('dragstart', (e) => { draggedRow = row; row.classList.add('dragging'); e.dataTransfer.effectAllowed = 'move'; try { e.dataTransfer.setData('text/plain', i.id); } catch (_) {} });
          row.addEventListener('dragend', () => { row.classList.remove('dragging'); clearDnd(); draggedRow = null; });
          row.addEventListener('dragover', (e) => { if (!draggedRow || draggedRow === row) return; e.preventDefault(); const r = row.getBoundingClientRect(); const before = (e.clientY - r.top) < r.height / 2; root.querySelectorAll('.drag-over-top,.drag-over-bot').forEach(n => { if (n !== row) n.classList.remove('drag-over-top', 'drag-over-bot'); }); row.classList.toggle('drag-over-top', before); row.classList.toggle('drag-over-bot', !before); });
          row.addEventListener('drop', async (e) => { if (!draggedRow || draggedRow === row) return; e.preventDefault(); e.stopPropagation(); const before = row.classList.contains('drag-over-top'); clearDnd(); await TripDetail._reorderPacking(t, draggedRow.dataset.id, row.dataset.id, before, row.dataset.cat); });
          // Táctil (long-press) — mantener pulsado ~320 ms y mover para reordenar.
          let lpTimer = null, lpDrag = false, lpStartY = 0;
          row.addEventListener('touchstart', (e) => {
            if (e.target.closest('button')) return;
            lpStartY = e.touches[0].clientY;
            lpTimer = setTimeout(() => {
              lpDrag = true; row.classList.add('dragging'); document.body.classList.add('pack-dragging');
              if (navigator.vibrate) { try { navigator.vibrate(12); } catch (_) {} }
            }, 320);
          }, { passive:true });
          row.addEventListener('touchmove', (e) => {
            if (!lpDrag) { if (lpTimer && Math.abs(e.touches[0].clientY - lpStartY) > 8) { clearTimeout(lpTimer); lpTimer = null; } return; }
            e.preventDefault();   // detener el scroll mientras se arrastra
            reorderTo(e.touches[0].clientY, row);
          }, { passive:false });
          const endTouch = () => {
            clearTimeout(lpTimer); lpTimer = null;
            if (lpDrag) { lpDrag = false; row.classList.remove('dragging'); document.body.classList.remove('pack-dragging'); row._justDragged = true; persistGroupOrder(); }
          };
          row.addEventListener('touchend', endTouch);
          row.addEventListener('touchcancel', endTouch);
        }
        return row;
      };
      const renderList = () => { ul.innerHTML = ''; sortItems(byCat[c.id] || []).forEach(i => ul.appendChild(makeRow(i))); };
      // Recoloca la fila arrastrada (táctil) según la posición vertical del dedo.
      const reorderTo = (y, dragRow) => {
        const sibs = [...ul.querySelectorAll('.pack-item:not(.dragging)')].filter(r => !r.classList.contains('done'));
        for (const sib of sibs) {
          const rect = sib.getBoundingClientRect();
          if (y < rect.top + rect.height / 2) { ul.insertBefore(dragRow, sib); return; }
        }
        const firstDone = ul.querySelector('.pack-item.done');
        if (firstDone) ul.insertBefore(dragRow, firstDone); else ul.appendChild(dragRow);
      };
      // Persiste el orden tras arrastrar (lee el orden actual del DOM).
      const persistGroupOrder = async () => {
        const order = [...ul.querySelectorAll('.pack-item')].map(r => r.dataset.id);
        let oi = 0;
        for (const id of order) {
          const it = (byCat[c.id] || []).find(x => x.id === id);
          if (!it) continue;
          if (it.order_index !== oi) { it.order_index = oi; try { await DB.put('packing_items', it); } catch (_) {} }
          oi++;
        }
      };
      // Reordena con animación FLIP: cada fila se desliza de su posición vieja a la nueva.
      const reorderWithFlip = () => {
        const old = {};
        ul.querySelectorAll('.pack-item').forEach(r => { old[r.dataset.id] = r.getBoundingClientRect().top; });
        renderList();
        ul.querySelectorAll('.pack-item').forEach(r => {
          const o = old[r.dataset.id]; if (o == null) return;
          const dy = o - r.getBoundingClientRect().top;
          if (!dy) return;
          r.style.transition = 'none';
          r.style.transform = `translateY(${dy}px)`;
          requestAnimationFrame(() => { r.style.transition = 'transform .3s var(--ease)'; r.style.transform = ''; });
        });
      };
      renderList();

      // Soltar en zona vacía del grupo → al final de ese grupo (cambia de grupo si aplica).
      if (sort === 'custom' && canEdit()) {
        grp.addEventListener('dragover', (e) => { if (!draggedRow) return; if (e.target.closest('.pack-item')) return; e.preventDefault(); grp.classList.add('pack-cat-target'); });
        grp.addEventListener('dragleave', (e) => { if (!grp.contains(e.relatedTarget)) grp.classList.remove('pack-cat-target'); });
        grp.addEventListener('drop', async (e) => { if (!draggedRow) return; if (e.target.closest('.pack-item')) return; e.preventDefault(); grp.classList.remove('pack-cat-target'); await TripDetail._reorderPacking(t, draggedRow.dataset.id, null, false, c.id); });
      }

      grp.appendChild(ul);
      root.appendChild(grp);
    }

    // Al final: acciones de plantilla (aplicar una / guardar la lista como plantilla).
    root.appendChild(el('div', { class:'pack-templates' }, [
      el('button', { class:'btn btn-sm', onclick: () => TripDetail.openTemplatePicker(t) },
        [ el('span', { html: svg('suit') }), 'Aplicar plantilla' ]),
      (canEdit() && items.length) ? el('button', { class:'btn btn-sm', onclick: () => TripDetail.openSaveTemplate(t, items) },
        [ el('span', { html: svg('download') }), 'Crear plantilla con esta lista' ]) : null,
    ].filter(Boolean)));
  },

  // Construye los grupos (categorías) de la maleta para una lista de items,
  // aplicando el orden de grupos guardado en el viaje (t.packing_group_order).
  _packingCats(t, items) {
    const byCat = {};
    items.forEach(i => { const k = i.category || 'otros'; (byCat[k] = byCat[k] || []).push(i); });
    const builtinIds = new Set(CATS_PACKING.map(c => c.id));
    // Overrides de etiqueta (para renombrar también los grupos fijos).
    const labelOf = {}; (t.packing_categories || []).forEach(c => { labelOf[c.id] = c.label; });
    const cats = []; const seen = new Set();
    CATS_PACKING.forEach(c => { if ((byCat[c.id] || []).length || labelOf[c.id]) { cats.push({ id:c.id, label: labelOf[c.id] || c.label, custom:false }); seen.add(c.id); } });
    (t.packing_categories || []).forEach(c => { if (!seen.has(c.id) && !builtinIds.has(c.id)) { cats.push({ id:c.id, label:c.label, custom:true }); seen.add(c.id); } });
    Object.keys(byCat).forEach(cid => { if (!seen.has(cid)) { cats.push({ id:cid, label: labelOf[cid] || cid, custom: !builtinIds.has(cid) }); seen.add(cid); } });
    // Aplicar orden guardado (estable: los no listados quedan al final en su orden actual).
    const order = Array.isArray(t.packing_group_order) ? t.packing_group_order : [];
    if (order.length) {
      cats.sort((a, b) => {
        const ia = order.indexOf(a.id), ib = order.indexOf(b.id);
        if (ia === -1 && ib === -1) return 0;
        if (ia === -1) return 1; if (ib === -1) return -1;
        return ia - ib;
      });
    }
    return { cats, byCat };
  },

  // Restaura la lista: desmarca todos los elementos (deja la maleta "a cero").
  async _resetPackingList(t) {
    if (!canEdit()) { UI.toast('Modo lector — no puedes modificar'); return; }
    const items = await DB.listByTrip('packing_items', t.id);
    const marked = items.filter(i => i.checked);
    if (!marked.length) { UI.toast('Ya está todo sin marcar'); return; }
    // Doble confirmación para evitar restaurar por error con un toque accidental.
    const ok1 = await UI.confirm(`¿Restaurar la lista? Se desmarcarán los ${marked.length} elementos preparados.`, 'Sí, restaurar');
    if (!ok1) return;
    const ok2 = await UI.confirm('Esto deja toda la maleta a cero y no se puede deshacer. ¿Confirmas?', 'Sí, dejar a cero');
    if (!ok2) return;
    for (const i of marked) { i.checked = false; try { await DB.put('packing_items', i); } catch (e) { console.error(e); } }
    UI.toast('Lista restaurada');
    Router.render();
  },

  // Renombra un grupo (fijo o personalizado) guardando un override de etiqueta.
  async _renamePackingGroup(t, catId, newLabel) {
    if (!canEdit()) return;
    newLabel = (newLabel || '').trim();
    if (!newLabel) return;
    const cats = Array.isArray(t.packing_categories) ? t.packing_categories : (t.packing_categories = []);
    const existing = cats.find(c => c.id === catId);
    const cur = existing ? existing.label : (CATS_PACKING.find(c => c.id === catId)?.label || catId);
    if (newLabel === cur) return;
    if (existing) existing.label = newLabel; else cats.push({ id: catId, label: newLabel });
    try { await DB.put('trips', t); } catch (e) { console.error(e); }
  },

  // Sube/baja un grupo en el orden (dir = -1 arriba, +1 abajo).
  async _movePackingGroup(t, catId, dir) {
    if (!canEdit()) return;
    const items = await DB.listByTrip('packing_items', t.id);
    const { cats } = TripDetail._packingCats(t, items);
    const ids = cats.map(c => c.id);
    const idx = ids.indexOf(catId);
    const swap = idx + dir;
    if (idx < 0 || swap < 0 || swap >= ids.length) return;
    [ids[idx], ids[swap]] = [ids[swap], ids[idx]];
    const prev = Array.isArray(t.packing_group_order) ? t.packing_group_order : [];
    const extra = prev.filter(id => !ids.includes(id));
    t.packing_group_order = [...ids, ...extra];
    await DB.put('trips', t);
    Router.render();
  },

  // Reordena un item de maleta (cambia order_index y, si aplica, de grupo).
  async _reorderPacking(t, draggedId, targetId, before, targetCat) {
    if (!canEdit()) return;
    const dragged = await DB.get('packing_items', draggedId);
    if (!dragged) return;
    if (targetCat && targetCat !== dragged.category) dragged.category = targetCat;
    const all = (await DB.listByTrip('packing_items', t.id))
      .filter(p => p.id !== draggedId && p.category === dragged.category && !p.checked);
    all.sort((a, b) => (a.order_index || 0) - (b.order_index || 0));
    let newIndex = all.length;
    if (targetId) { const idx = all.findIndex(p => p.id === targetId); if (idx >= 0) newIndex = before ? idx : idx + 1; }
    all.splice(newIndex, 0, dragged);
    for (let i = 0; i < all.length; i++) { if (all[i].order_index !== i || all[i].id === draggedId) { all[i].order_index = i; await DB.put('packing_items', all[i]); } }
    Router.render();
  },

  // Crear un grupo nuevo en la maleta (categoría personalizada, guardada en el viaje).
  _openNewPackingGroup(t) {
    if (!canEdit()) return;
    const body = el('div', {}, [
      el('div', { class:'form-row' }, [
        el('label', { text:'Nombre del grupo' }),
        el('input', { id:'pg-name', type:'text', placeholder:'Ej. Botiquín, Playa, Niños…' }),
      ]),
    ]);
    const save = el('button', { class:'btn btn-primary', onclick: async () => {
      const name = ($('#pg-name')?.value || '').trim();
      if (!name) { UI.toast('Pon un nombre'); return; }
      const id = 'cg_' + name.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') + '_' + uuid().slice(0, 4);
      t.packing_categories = Array.isArray(t.packing_categories) ? t.packing_categories : [];
      t.packing_categories.push({ id, label: name });
      await DB.put('trips', t);
      UI.toast('Grupo creado'); UI.closeSheet(); Router.render();
    }}, 'Crear');
    UI.openSheet({ title:'Nuevo grupo', body, footer:[el('button', { class:'btn btn-ghost', onclick: () => UI.closeSheet() }, 'Cancelar'), save] });
  },

  // Borra un grupo personalizado; sus items pasan a "Otros".
  async _deletePackingGroup(t, catId) {
    if (!canEdit()) return;
    const inCat = (await DB.listByTrip('packing_items', t.id)).filter(p => p.category === catId);
    const ok = await UI.confirm(inCat.length ? `¿Borrar el grupo? Sus ${inCat.length} elemento(s) pasarán a "Otros".` : '¿Borrar este grupo vacío?');
    if (!ok) return;
    for (const p of inCat) { p.category = 'otros'; await DB.put('packing_items', p); }
    t.packing_categories = (t.packing_categories || []).filter(c => c.id !== catId);
    await DB.put('trips', t);
    UI.toast('Grupo borrado'); Router.render();
  },

  openPackingEditor(t, existing=null, defaultCat=null) {

    if (!canEdit()) { UI.toast('Modo lector — no puedes modificar'); return; }
    const it = existing || { id: uuid(), trip_id: t.id, category: defaultCat || 'ropa', name:'', checked:false, person: TripDetail._packingPerson || 'ruben' };
    if (!it.person) it.person = TripDetail._packingPerson || 'ruben';
    // Categorías: las fijas + las personalizadas del viaje.
    const cats = [...CATS_PACKING, ...((t.packing_categories || []))];
    const body = el('div', {}, [
      el('div', { class:'form-row' }, [
        el('label', { text:'Cosa' }),
        el('input', { id:'f-name', type:'text', value: it.name || '' }),
      ]),
      el('div', { class:'form-row' }, [
        el('label', { text:'Grupo' }),
        el('select', { id:'f-cat' }, cats.map(c => el('option', { value:c.id, selected: it.category===c.id?true:null }, c.label))),
      ]),
    ]);
    const save = el('button', { class:'btn btn-primary', onclick: async () => {
      it.name = $('#f-name').value.trim();
      if (!it.name) { UI.toast('Pon un nombre'); return; }
      it.category = $('#f-cat').value;
      await DB.put('packing_items', it);
      UI.closeSheet(); Router.render();
    }}, 'Guardar');
    const delBtn = existing ? el('button', { class:'btn btn-danger', onclick: async () => {
      const ok = await UI.confirm(`¿Quitar "${it.name}"?`); if (!ok) return;
      await DB.remove('packing_items', it.id);
      UI.toast('Quitado'); UI.closeSheet(); Router.render();
    }}, 'Borrar') : null;
    UI.openSheet({
      title: existing ? 'Editar' : 'Añadir',
      body,
      footer:[delBtn, el('button', { class:'btn btn-ghost', onclick: () => UI.closeSheet() }, 'Cancelar'), save].filter(Boolean),
    });
  },

  async openTemplatePicker(t) {

    const userTpls = await DB.listByProfile('packing_templates', STATE.profile);
    const body = el('div', {});

  async applyTemplate(t, name, items) {

  openSaveTemplate(t, currentItems) {

    const body = el('div', {}, [
      el('p', { class:'muted', text: `Guardar los ${currentItems.length} items actuales como plantilla reutilizable para futuros viajes.` }),
      el('div', { class:'form-row' }, [
        el('label', { text:'Nombre de la plantilla' }),
        el('input', { id:'tpl-name', type:'text', value:'', placeholder:'Mi semana corta' }),

      title:'Guardar plantilla',

    });
  },

  /* ----- Reservas (con vista cronológica) ----- */
  _reservasView: 'tipo', // 'tipo' | 'cron'

  async tabReservas(root, t) {
    const items = await DB.listByTrip('bookings', t.id);

    const toolbar = el('div', { class:'toolbar' }, [
      el('button', { class:'btn btn-primary', onclick: () => TripDetail.openBookingEditor(t) }, [
        el('span', { html: svg('plus') }), 'Añadir reserva'
      ]),
      el('button', { class:'btn btn-sm', onclick: () => TripDetail.openImportBooking(t) }, [
        el('span', { html: svg('upload') }), 'Importar desde email'
      ]),
      el('div', { class:'gap' }),
      el('div', { class:'segmented' }, [
        el('button', {
          class: TripDetail._reservasView === 'tipo' ? 'active' : '',
          onclick: () => { TripDetail._reservasView = 'tipo'; Router.render(); }
        }, 'Por tipo'),
        el('button', {
          class: TripDetail._reservasView === 'cron' ? 'active' : '',
          onclick: () => { TripDetail._reservasView = 'cron'; Router.render(); }
        }, 'Cronológica'),
      ]),
    ]);
    root.appendChild(toolbar);

    if (!items.length) {
      root.appendChild(el('div', { class:'empty' }, [
        el('div', { class:'icon', html: svg('doc') }),
        el('h3', { text:'Sin reservas' }),
        el('p', { text:'Guarda aquí vuelos, hoteles, trenes, ferries, coches, actividades y seguros — funciona offline.' }),
      ]));
      return;
    }

    if (TripDetail._reservasView === 'cron') {
      // vista cronológica: todas las reservas con fecha, ordenadas
      const withDate = items.filter(b => b.ref_date || TripDetail._inferRefDate(b))
        .map(b => ({ ...b, _refDate: b.ref_date || TripDetail._inferRefDate(b), _refTime: b.ref_time || TripDetail._inferRefTime(b) }))
        .sort((a,b) => (a._refDate || '').localeCompare(b._refDate || '') || (a._refTime || '').localeCompare(b._refTime || ''));
      const withoutDate = items.filter(b => !b.ref_date && !TripDetail._inferRefDate(b));

      let lastDay = null;
      const ul = el('div', { class:'list' });
      withDate.forEach(b => {
        if (b._refDate !== lastDay) {
          ul.appendChild(el('div', { class:'cron-divider', text: fmtDayLong(b._refDate) }));
          lastDay = b._refDate;
        }
        ul.appendChild(this._bookingRow(b, t));
      });
      if (withoutDate.length) {
        ul.appendChild(el('div', { class:'cron-divider', text:'Sin fecha' }));
        withoutDate.forEach(b => ul.appendChild(this._bookingRow(b, t)));
      }
      root.appendChild(ul);
    } else {
      const groups = {};
      TYPES_BOOKING.forEach(tb => groups[tb.id] = []);
      items.forEach(i => { (groups[i.type] = groups[i.type] || []).push(i); });
      for (const tb of TYPES_BOOKING) {
        const list = groups[tb.id]; if (!list || !list.length) continue;
        root.appendChild(el('h2', { class:'section-title', text: tb.label }));
        const ul = el('div', { class:'list' });
        list.forEach(b => ul.appendChild(this._bookingRow(b, t)));
        root.appendChild(ul);
      }
    }
  },

  // Si el usuario no fijó ref_date al editar, intentar deducir del structured_data
  _inferRefDate(b) {
    const d = b.structured_data || {};
    return d.fecha_salida || d.checkin || d.recogida || d.fecha || d.vigencia_hasta || null;
  },
  _inferRefTime(b) {
    const d = b.structured_data || {};
    return d.hora_salida || d.hora || null;
  },

  // Campos de structured_data que son "documentales" (localizadores, números, referencias)
  // y se ocultan a Invitado para no exponer datos sensibles.
  _DOC_FIELDS: new Set(['localizador','poliza','matricula','numero','referencia']),
  // Campos con info económica (precio/importe).
  _MONEY_FIELDS: new Set(['precio','importe','coste','total','price']),

  _bookingRow(b, t) {
    const d = b.structured_data || {};
    const entries = Object.entries(d).filter(([k,v]) => {
      if (!v) return false;

      if (!canSeeMoney() && TripDetail._MONEY_FIELDS.has(k)) return false;
      return true;
    });
    const keys = entries.slice(0,4)
      .map(([k,v]) => `${k.replace(/_/g,' ')}: ${v}`).join(' · ');
    const tdef = TYPES_BOOKING.find(x => x.id === b.type);
    const ref = b.ref_date || TripDetail._inferRefDate(b);
    return el('div', { class:'list-item' }, [
      el('div', { html: svg(bookingIcon(b.type)) }),
      el('div', { class:'li-main', onclick: () => TripDetail.openBookingEditor(t, b) }, [
        el('div', { class:'li-title' }, [
          (tdef?.label || b.type),
          ref ? el('span', { class:'time-pill', style:{marginLeft:'8px'}, text: fmtDateShort(ref) }) : null,
        ].filter(Boolean)),
        el('div', { class:'li-sub', text: keys || 'Sin detalles' }),
        (b.doc_url && canSeeDocs()) ? el('div', { style:{marginTop:'6px'} }, el('a', { href: b.doc_url, target:'_blank', rel:'noopener', text: b.doc_name || 'Documento' })) : null,
      ].filter(Boolean)),
      el('button', { class:'icon-btn', onclick: () => TripDetail.openBookingEditor(t, b), html: svg('edit') }),
    ]);
  },

      el('div', { class:'form-row' }, [

      ]),

  _parseBookingText(text, type) {
    const out = {
      id: uuid(), trip_id: STATE.currentTripId, type,
      structured_data: {}, doc_name:'', doc_url:'', ref_date:null, ref_time:null,
    };
    const t = text || '';
    const sd = out.structured_data;

    // Localizador: 6 caracteres alfanuméricos en mayúsculas, posiblemente precedido de palabra clave.
    const loc = t.match(/(?:localizador|loc(?:ator)?|c[oó]digo de reserva|booking ref(?:erence)?|reservation code|PNR|reference|c[oó]digo|confirmation(?: code| number)?|n[uú]mero de confirmaci[oó]n)\s*[:\-#]?\s*([A-Z0-9]{5,8})\b/i)
            || t.match(/\b([A-Z0-9]{6})\b(?=.{0,80}(?:vuelo|booking|reserva|hotel))/);
    if (loc) sd.localizador = loc[1].toUpperCase();

    // Importe: cifra seguida de € / EUR / USD / $ o precedida de "Total/Importe"
    const amt = t.match(/(?:total|importe|amount|price|precio)[^\d]*([\d.,]+)\s*(?:€|EUR|usd|\$)/i)
              || t.match(/([\d]{1,3}(?:[.,]\d{3})*(?:[.,]\d{2}))\s*(€|EUR|USD|\$)/);
    if (amt) {
      sd.precio = amt[0].match(/[\d.,]+\s*[€EURUSD$]+/i)?.[0] || amt[0];
    }

    // Fechas (DD/MM/YYYY, DD-MM-YYYY, YYYY-MM-DD)
    const dates = [...t.matchAll(/\b(\d{1,2})[\/\-\.](\d{1,2})[\/\-\.](\d{2,4})\b/g)].map(m => {
      const d = m[1].padStart(2,'0'), mo = m[2].padStart(2,'0'), y = m[3].length === 2 ? '20'+m[3] : m[3];
      return `${y}-${mo}-${d}`;
    });
    const datesISO = [...t.matchAll(/\b(20\d{2})[\/\-](\d{1,2})[\/\-](\d{1,2})\b/g)].map(m => {
      return `${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`;
    });
    const allDates = [...new Set([...dates, ...datesISO])].filter(d => /^\d{4}-\d{2}-\d{2}$/.test(d)).sort();

    // Horas (HH:MM)
    const times = [...t.matchAll(/\b(\d{1,2}):(\d{2})\b/g)].map(m => `${m[1].padStart(2,'0')}:${m[2]}`);

    // Aeropuertos IATA: 3 letras mayúsculas a aisladas o precedidas de "to/from"
    const iataMatches = [...t.matchAll(/\b([A-Z]{3})\b(?=[^A-Z])/g)].map(m => m[1])
      .filter(c => !['EUR','USD','GBP','PNR','VAT','IVA','UTC','GMT','VIP','TUI'].includes(c));

    // Número de vuelo (2 letras + 1-4 dígitos)
    const flight = t.match(/\b([A-Z]{2,3})\s?(\d{1,4})\b/);

    if (type === 'vuelo') {
      if (flight) { sd.aerolinea = flight[1].toUpperCase(); sd.numero = flight[1].toUpperCase() + flight[2]; }
      if (iataMatches.length >= 2) {
        sd.origen = iataMatches[0]; sd.destino = iataMatches[1];
      }
      if (allDates.length) sd.fecha_salida = allDates[0];
      if (allDates.length > 1) sd.fecha_llegada = allDates[1];
      if (times.length) sd.hora_salida = times[0];
      if (times.length > 1) sd.hora_llegada = times[1];
      out.ref_date = sd.fecha_salida; out.ref_time = sd.hora_salida;
    } else if (type === 'hotel') {
      // Hotel: primera fecha = checkin, segunda = checkout
      if (allDates.length) sd.checkin = allDates[0];
      if (allDates.length > 1) sd.checkout = allDates[1];
      // Nombre: primera línea con "Hotel" o capitalized
      const hotelMatch = t.match(/(?:Hotel|Hostal|Hostel|Apartamento|Resort)\s+([^\n,]{2,40})/i);
      if (hotelMatch) sd.nombre = (hotelMatch[0]).trim();
      out.ref_date = sd.checkin;
    } else if (type === 'coche') {
      if (allDates.length) sd.recogida = allDates[0];
      if (allDates.length > 1) sd.devolucion = allDates[1];
      const company = t.match(/(?:Hertz|Avis|Sixt|Europcar|Enterprise|Budget|Goldcar|OK Mobility|Centauro|Alamo|National)/i);
      if (company) sd.compania = company[0];
      out.ref_date = sd.recogida;
    } else if (type === 'tren') {
      if (allDates.length) sd.fecha_salida = allDates[0];
      if (times.length) sd.hora_salida = times[0];
      if (times.length > 1) sd.hora_llegada = times[1];
      const renfe = t.match(/(?:RENFE|AVE|Iryo|Ouigo|SNCF|TGV|Trenitalia|JR|Eurostar)/i);
      if (renfe) sd.compania = renfe[0];
      out.ref_date = sd.fecha_salida;
    }
    return out;
  },

  openBookingEditor(t, existing=null) {

    if (!canEdit()) { UI.toast('Modo lector — no puedes modificar'); return; }
    const b = existing || { id: uuid(), trip_id: t.id, type:'vuelo', structured_data:{}, doc_name:'', doc_url:'', ref_date:null, ref_time:null };
    const FIELDS_BY_TYPE = {
      vuelo:     ['aerolinea','numero','origen','destino','fecha_salida','hora_salida','fecha_llegada','hora_llegada','terminal','localizador'],
      hotel:     ['nombre','direccion','checkin','checkout','localizador'],
      tren:      ['compania','numero','origen','destino','fecha_salida','hora_salida','hora_llegada','coche','asiento','localizador'],
      ferry:     ['compania','origen','destino','fecha_salida','hora_salida','hora_llegada','localizador'],
      coche:     ['compania','recogida','devolucion','matricula','localizador'],
      actividad: ['nombre','lugar','fecha','hora','duracion','localizador'],
      seguro:    ['compania','poliza','telefono','vigencia_hasta'],
      otro:      ['nombre','fecha','referencia'],
    };
    const buildFields = () => {
      const wrap = $('#booking-fields'); wrap.innerHTML = '';
      const type = $('#f-btype').value;
      const fields = FIELDS_BY_TYPE[type] || [];
      fields.forEach(f => {
        const isDate = /^fecha|^checkin|^checkout|^recogida|^devolucion|vigencia/.test(f);
        const isTime = /^hora/.test(f);
        wrap.appendChild(el('div', { class:'form-row' }, [
          el('label', { text: f.replace(/_/g,' ').replace(/^./, c => c.toUpperCase()) }),
          el('input', { id:`d-${f}`, type: isDate ? 'date' : isTime ? 'time' : 'text', value: b.structured_data?.[f] || '' }),
        ]));
      });
    };

    const body = el('div', {}, [
      el('div', { class:'form-row' }, [
        el('label', { text:'Tipo' }),
        el('select', { id:'f-btype', onchange: buildFields },
          TYPES_BOOKING.map(o => el('option', { value:o.id, selected: b.type===o.id?true:null }, o.label))),
      ]),
      el('div', { id:'booking-fields' }),
      el('div', { class:'form-grid-2' }, [
        el('div', { class:'form-row' }, [
          el('label', { text:'Nombre del documento' }),
          el('input', { id:'f-doc-name', type:'text', value: b.doc_name || '', placeholder:'Billete vuelo IB1234' }),
        ]),
        el('div', { class:'form-row' }, [
          el('label', { text:'Enlace al documento' }),
          el('input', { id:'f-doc-url', type:'url', value: b.doc_url || '', placeholder:'https://drive.google.com/…' }),
        ]),
      ]),
      el('div', { class:'field-hint', text:'El documento se abre desde Drive/Dropbox/web — el offline lo gestiona esa app.' }),
    ]);
    setTimeout(buildFields, 0);

    const save = el('button', { class:'btn btn-primary', onclick: async () => {
      try {
        b.type = $('#f-btype').value;
        b.structured_data = {};
        $$('#booking-fields input').forEach(i => {
          const k = i.id.replace('d-','');
          if (i.value) b.structured_data[k] = i.value;
        });
        // ref_date para vista cronológica (deducido del structured_data si no se editó manual)
        b.ref_date = TripDetail._inferRefDate(b) || null;
        b.ref_time = TripDetail._inferRefTime(b) || null;
        b.doc_name = $('#f-doc-name').value.trim() || null;
        b.doc_url = $('#f-doc-url').value.trim() || null;
        await DB.put('bookings', b);
      } catch (err) { console.error(err); UI.toast('Error al guardar'); }
      finally { UI.closeSheet(); Router.render(); }
    }}, 'Guardar');
    const delBtn = existing ? el('button', { class:'btn btn-danger', onclick: async () => {
      const ok = await UI.confirm('¿Borrar reserva?'); if (!ok) return;
      await DB.remove('bookings', b.id); UI.closeSheet(); Router.render();
    }}, 'Borrar') : null;

    UI.openSheet({
      title: existing ? 'Editar reserva' : 'Nueva reserva',
      body,
      footer:[delBtn, el('button', { class:'btn btn-ghost', onclick: () => UI.closeSheet() }, 'Cancelar'), save].filter(Boolean),
    });
  },

  /* ----- Mapa ----- */
  async tabMapa(root, t) {
    const planning = await DB.listByTrip('planning_items', t.id);
    const addresses = await DB.listByTrip('addresses', t.id);

    // Paradas del planning con coords, agrupadas por día → color + ruta por día.
    const planPts = planning.filter(p => p.lat != null && p.lng != null);
    const byDay = {};
    planPts.forEach(p => { const k = p.day_date || 'sin'; (byDay[k] = byDay[k] || []).push(p); });
    const dayKeys = Object.keys(byDay).filter(k => k !== 'sin').sort();
    const addrPts = addresses.filter(a => a.lat != null && a.lng != null);
    const hasAny = planPts.length || addrPts.length;

    const container = el('div', { class:'map-container', id:'mapa-container' });
    root.appendChild(container);
    if (!hasAny) {
      root.appendChild(el('p', { class:'muted', style:{marginTop:'12px'}, text:'Aún no hay puntos con coordenadas. Añade un lugar desde Planning buscando con el buscador online.' }));
    }
    // Leyenda de colores por día.
    if (dayKeys.length > 1) {
      const legend = el('div', { class:'map-legend' });
      dayKeys.forEach(k => {
        const dn = t.start_date ? (daysBetween(t.start_date, k) + 1) : null;
        legend.appendChild(el('span', { class:'map-legend-item' }, [
          el('span', { class:'map-legend-dot', style:{ background: dayColor(dn) } }),
          el('span', { text: dn ? ('Día ' + dn) : fmtDateShort(k) }),
        ]));
      });
      root.appendChild(legend);
    }

    setTimeout(() => {
      if (STATE.leaflet) { STATE.leaflet.remove(); STATE.leaflet = null; }
      const map = L.map('mapa-container');
      L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '© OpenStreetMap' }).addTo(map);
      const all = [];
      const pin = (color, n) => L.divIcon({ className:'map-day-pin', html:`<span style="background:${color}">${n}</span>`, iconSize:[24,24], iconAnchor:[12,12] });
      dayKeys.forEach(k => {
        const dn = t.start_date ? (daysBetween(t.start_date, k) + 1) : null;
        const color = dayColor(dn);
        const pts = byDay[k].slice().sort((a, b) => planningCompare(a, b));
        const lls = [];
        pts.forEach((p, i) => {
          const ll = [p.lat, p.lng]; lls.push(ll); all.push(ll);
          const gm = gmapsUrl(p.lat, p.lng);
          L.marker(ll, { icon: pin(color, i + 1) }).addTo(map)
            .bindPopup(`<b>${escHtml(p.place_name || p.title || '')}</b><br>${dn ? 'Día ' + dn : ''}${p.time ? ' · ' + escHtml(p.time) : ''}<br><a href="${gm}" target="_blank" rel="noopener">Google Maps</a>`);
        });
        if (lls.length > 1) L.polyline(lls, { color, weight: 3, opacity: .6 }).addTo(map);
      });
      addrPts.forEach(a => { const ll = [a.lat, a.lng]; all.push(ll); L.marker(ll).addTo(map).bindPopup(`<b>${escHtml(a.label || '')}</b><br>${escHtml(a.address || '')}`); });
      if (all.length) { try { map.fitBounds(L.latLngBounds(all).pad(0.2)); } catch (_) { map.setView(all[0], 13); } }
      else map.setView([20, 0], 2);
      STATE.leaflet = map;
    }, 50);
  },

  /* ----- Personas ----- */
  async tabPersonas(root, t) {
    const planning = await DB.listByTrip('planning_items', t.id);
    const withPeople = planning.filter(p => Array.isArray(p.people) && p.people.length);
    const byPerson = new Map();
    for (const p of withPeople) {
      for (const name of p.people) {
        if (!byPerson.has(name)) byPerson.set(name, []);
        byPerson.get(name).push(p);
      }
    }
    if (!byPerson.size) {
      root.appendChild(el('div', { class:'empty' }, [
        el('div', { class:'icon', html: svg('heart') }),
        el('h3', { text:'Aún no hay personas' }),
        el('p', { text:'Al crear o editar un evento del planning, añade con quién estuviste y aparecerán aquí.' }),
      ]));
      return;
    }
    // Recuento POR DÍA: si una persona aparece varias veces el mismo día (en eventos
    // distintos), cuenta como un solo día. "Encuentros" = suma de días por persona.
    const daysOf = (items) => new Set(items.map(it => it.day_date || 'sin-fecha')).size;
    const totalEnc = [...byPerson.values()].reduce((s, items) => s + daysOf(items), 0);
    root.appendChild(el('div', { class:'metric-grid', style:{gridTemplateColumns:'repeat(2,1fr)'} }, [
      el('div', { class:'metric' }, [ el('div',{class:'label',text:'Personas'}), el('div',{class:'value',text:String(byPerson.size)}) ]),
      el('div', { class:'metric' }, [ el('div',{class:'label',text:'Encuentros'}), el('div',{class:'value',text:String(totalEnc)}) ]),
    ]));
    const people = [...byPerson.entries()].sort((a,b) => daysOf(b[1]) - daysOf(a[1]) || a[0].localeCompare(b[0],'es'));
    for (const [name, items] of people) {
      const sorted = items.slice().sort((a,b) => (a.day_date||'').localeCompare(b.day_date||'') || (a.time||'').localeCompare(b.time||''));
      const list = el('div', { class:'list' });
      for (const it of sorted) {
        const td = typeDef(it.type);
        const place = it.place_name || it.title || td.label;
        const when = [ it.day_date ? fmtDateShort(it.day_date) : 'Sin fecha', it.time || '' ].filter(Boolean).join(' · ');
        list.appendChild(el('div', { class:'list-item interactive', onclick: () => TripDetail.openPlanningEditor(t, it) }, [
          el('div', { class:'item-emoji', text: planEmoji(it) }),
          el('div', { class:'li-main' }, [
            el('div', { class:'li-title', text: place }),
            el('div', { class:'li-sub', text: when }),
          ]),
        ]));
      }
      // Plegado por defecto: se ve el ranking (nombre + nº); al pulsar la cabecera
      // se despliega el detalle de lugares/días.
      root.appendChild(el('div', { class:'person-card collapsed' }, [
        el('div', { class:'person-card-head', onclick: (e) => e.currentTarget.parentElement.classList.toggle('collapsed') }, [
          el('div', { class:'person-avatar', text: (name[0] || '?').toUpperCase() }),
          el('div', { class:'person-name', text: name }),
          (() => { const d = daysOf(items); return el('div', { class:'person-count', text: `${d} ${d === 1 ? 'día' : 'días'}` }); })(),
          el('span', { class:'person-collapse', html: svg('chevron'), 'aria-hidden':'true' }),
        ]),
        list,
      ]));
    }
  },

  /* ----- Pendientes (checklist manual + eventos en consulta/por iniciar) ----- */
  async tabPendientes(root, t, fab) {
    // Migración del modelo: cada pendiente con id/grupo/orden.
    const manual = TripDetail._pendingItems(t);
    let changed = false;
    manual.forEach((m, i) => {
      if (!m.id) { m.id = uuid(); changed = true; }
      if (!m.group) { m.group = 'general'; changed = true; }
      if (typeof m.order_index !== 'number') { m.order_index = i; changed = true; }
    });
    if (changed) { try { await DB.put('trips', t); } catch (_) {} }

    const editMode = TripDetail._pendingEditMode;
    const sort = TripDetail._pendingSort || 'custom';
    const today = todayIso();
    const isOverdue = (m) => !m.done && m.date && m.date < today;
    const saveManual = async () => { await DB.put('trips', t); };

    // Eventos automáticos (en consulta / por iniciar) — solo lectura.
    const planning = await DB.listByTrip('planning_items', t.id);
    const auto = planning
      .filter(p => ['en_consulta','por_iniciar'].includes(itemStatus(p)))
      .map(p => ({ item:p, date: p.day_date || p.consultation_planned_d1 || '', time: p.time || p.consultation_planned_t1 || '' }))
      .sort((a,b) => (a.date||'').localeCompare(b.date||'') || (a.time||'').localeCompare(b.time||''));

    // Cabecera: progreso (izq) + controles (der).
    const fillEl = el('div', { class:'budget-fill' });
    const legendCount = el('span', { class:'mono' });
    const legendLabel = el('span', { class:'muted' });
    const refreshProgress = () => {
      const d = manual.filter(m => m.done).length;
      const p = manual.length ? (d / manual.length) * 100 : 0;
      fillEl.style.width = p.toFixed(1) + '%';
      legendCount.textContent = `${d} / ${manual.length}`;
      legendLabel.textContent = (manual.length && d === manual.length) ? '¡Todo hecho!' : 'completadas';
    };
    const collapseAllBtn = el('button', { class:'icon-btn pack-collapse-all', title:'Plegar / desplegar todo',
      'aria-label':'Plegar o desplegar todos los grupos', html: svg('chevron'),
      onclick: () => {
        const groups = Array.from(root.querySelectorAll('.pack-group[data-cat]'));
        if (!groups.length) return;
        const anyOpen = groups.some(g => !g.classList.contains('collapsed'));
        groups.forEach(g => { g.classList.toggle('collapsed', anyOpen); const cid = g.dataset.cat; if (anyOpen) TripDetail._pendingCollapsedCats.add(cid); else TripDetail._pendingCollapsedCats.delete(cid); });
        collapseAllBtn.classList.toggle('all-collapsed', anyOpen);
        collapseAllBtn.title = anyOpen ? 'Desplegar todo' : 'Plegar todo';
      } });
    root.appendChild(el('div', { class:'pack-header' }, [
      el('div', { class:'pack-progress' }, [ el('div', { class:'budget-bar' }, fillEl), el('div', { class:'budget-legend' }, [ legendCount, legendLabel ]) ]),
      el('div', { class:'pack-controls' }, [
        el('div', { class:'segmented packing-sort' }, [
          el('button', { class: sort === 'custom' ? 'active' : '', title:'Orden personalizado (arrastrar)', onclick: () => { TripDetail._pendingSort = 'custom'; Router.render(); } }, 'Manual'),
          el('button', { class: sort === 'abc' ? 'active' : '', title:'Orden alfabético', onclick: () => { TripDetail._pendingSort = 'abc'; Router.render(); } }, 'A-Z'),
        ]),
        collapseAllBtn,
        canEdit() ? el('button', { class:'icon-btn icon-btn-primary', title:'Añadir pendiente', 'aria-label':'Añadir pendiente',
          onclick: () => TripDetail._openPendingEditor(t, null), html: svg('plus') }) : null,
        canEdit() ? el('button', { class:'icon-btn', title:'Nuevo grupo', 'aria-label':'Nuevo grupo',
          onclick: () => TripDetail._openNewPendingGroup(t), html: svg('folderplus') }) : null,
        canEdit() ? el('button', { class:'icon-btn' + (editMode ? ' edit-on' : ''), title: editMode ? 'Listo' : 'Editar grupos',
          'aria-pressed': editMode ? 'true' : 'false', 'aria-label':'Editar',
          onclick: () => { TripDetail._pendingEditMode = !TripDetail._pendingEditMode; Router.render(); }, html: svg(editMode ? 'check' : 'edit') }) : null,
      ].filter(Boolean)),
    ]));
    refreshProgress();

    if (!manual.length && !auto.length) {
      root.appendChild(el('div', { class:'empty' }, [
        el('div', { class:'icon', html: svg('note') }),
        el('h3', { text:'Sin pendientes' }),
        el('p', { text:'Pulsa “+” para añadir una tarea o crea un grupo. Los eventos del planning en consulta o por iniciar aparecen aquí.' }),
      ]));
      return;
    }

    // --- Eventos del planning (en consulta / por iniciar) — solo lectura ---
    if (auto.length) {
      root.appendChild(el('div', { class:'pending-divider', text:'Del planning' }));
      const list = el('div', { class:'list pending-list pending-auto-list' });
      auto.forEach(a => {
        const it = a.item; const td = typeDef(it.type); const st = itemStatus(it); const stDef = STATUS_PLANNING.find(s => s.id === st);
        const overdue = a.date && a.date < today;
        list.appendChild(el('div', { class:'pending-item auto interactive', onclick: () => TripDetail.openPlanningEditor(t, it) }, [
          el('div', { class:'item-emoji', text: planEmoji(it) }),
          el('div', { class:'pending-main' }, [
            el('div', { class:'pending-text' }, [ overdue ? el('span', { class:'pending-warn', title:'Fecha pasada', text:'⚠️ ' }) : null, el('span', { text: it.place_name || it.title || td.label }) ].filter(Boolean)),
            el('div', { class:'pending-sub', text: [ a.date ? fmtDateShort(a.date) : 'Sin fecha', a.time || '' ].filter(Boolean).join(' · ') }),
          ]),
          stDef ? el('span', { class:`status-badge s-${st}`, text: stDef.label }) : null,
        ].filter(Boolean)));
      });
      root.appendChild(list);
    }

    // --- Pendientes manuales agrupados (solo los NO completados) ---
    const pending = manual.filter(m => !m.done);
    const { cats, byCat } = TripDetail._pendingCats(t, pending);
    const allCollapsedInit = cats.length > 0 && cats.every(c => TripDetail._pendingCollapsedCats.has(c.id));
    collapseAllBtn.classList.toggle('all-collapsed', allCollapsedInit);
    collapseAllBtn.title = allCollapsedInit ? 'Desplegar todo' : 'Plegar todo';

    let draggedRow = null;
    const clearDnd = () => root.querySelectorAll('.drag-over-top,.drag-over-bot,.pack-cat-target').forEach(n => n.classList.remove('drag-over-top','drag-over-bot','pack-cat-target'));

    // Completar con efecto: destello verde + deslizar y, tras unos ms, re-render.
    const completeWithAnim = async (m, row) => {
      m.done = true; m.done_at = Date.now();
      row.classList.add('just-checked');
      const ck = row.querySelector('.pack-check'); if (ck) { ck.classList.add('on'); ck.innerHTML = svg('check'); }
      await saveManual();
      refreshProgress();
      setTimeout(() => {
        row.classList.add('pending-removing');
        setTimeout(() => { const sy = window.scrollY; Router.render().then(() => window.scrollTo(0, sy)); }, 250);
      }, 300);
    };

    for (const c of cats) {
      const collapsed = TripDetail._pendingCollapsedCats.has(c.id);
      const grp = el('div', { class:'pack-group' + (collapsed ? ' collapsed' : ''), data:{ cat:c.id } });
      const grp_list = (byCat[c.id] || []).slice().sort((a,b) =>
        sort === 'abc' ? (a.text || '').localeCompare(b.text || '', 'es') : (a.order_index || 0) - (b.order_index || 0));
      const titleEl = (editMode && canEdit())
        ? el('input', { class:'pack-group-title-input', value: c.label, 'aria-label':'Nombre del grupo',
            onkeydown:(e)=>{ if (e.key==='Enter') { e.preventDefault(); e.target.blur(); } }, onblur:(e)=>TripDetail._renamePendingGroup(t, c.id, e.target.value) })
        : el('span', { class:'pack-group-title', text: c.label });
      const head = el('div', { class:'pack-group-head', onclick:(e)=>{ if (e.target.closest('.pack-group-act')||e.target.closest('.pack-group-title-input')) return; const willCollapse=!grp.classList.contains('collapsed'); grp.classList.toggle('collapsed', willCollapse); if (willCollapse) TripDetail._pendingCollapsedCats.add(c.id); else TripDetail._pendingCollapsedCats.delete(c.id); } }, [
        el('span', { class:'pack-group-chevron', html: svg('chevron') }),
        titleEl,
        el('span', { class:'pack-group-count', text: String(grp_list.length) }),
        el('div', { class:'gap' }),
        (editMode && canEdit() && cats.length > 1) ? el('button', { class:'icon-btn pack-group-act', title:'Subir grupo', html: svg('arrup'), disabled: cats.indexOf(c)===0?true:null, onclick:()=>TripDetail._movePendingGroup(t, c.id, -1) }) : null,
        (editMode && canEdit() && cats.length > 1) ? el('button', { class:'icon-btn pack-group-act', title:'Bajar grupo', html: svg('arrdown'), disabled: cats.indexOf(c)===cats.length-1?true:null, onclick:()=>TripDetail._movePendingGroup(t, c.id, 1) }) : null,
        canEdit() ? el('button', { class:'icon-btn pack-group-act', title:'Añadir a este grupo', html: svg('plus'), onclick:()=>TripDetail._openPendingEditor(t, null, c.id) }) : null,
        (editMode && canEdit() && c.custom) ? el('button', { class:'icon-btn pack-group-act', title:'Borrar grupo', html: svg('trash'), onclick:()=>TripDetail._deletePendingGroup(t, c.id) }) : null,
      ].filter(Boolean));
      grp.appendChild(head);

      const ul = el('div', { class:'pack-list', data:{ cat:c.id } });
      const reorderTo = (y, dragRow) => {
        const sibs = [...ul.querySelectorAll('.pack-item:not(.dragging)')];
        for (const sib of sibs) { const rect = sib.getBoundingClientRect(); if (y < rect.top + rect.height/2) { ul.insertBefore(dragRow, sib); return; } }
        ul.appendChild(dragRow);
      };
      const persistGroupOrder = async () => {
        const order = [...ul.querySelectorAll('.pack-item')].map(r => r.dataset.id);
        let oi = 0; for (const id of order) { const it = manual.find(x => x.id === id); if (!it) continue; it.order_index = oi; oi++; }
        await saveManual();
      };
      const makeRow = (m) => {
        const draggable = editMode && sort === 'custom' && canEdit();
        const row = el('div', { class:'pack-item pending-item' + (isOverdue(m) ? ' overdue' : ''), data:{ id:m.id, cat:c.id }, draggable: draggable ? 'true' : 'false' });
        // Marcar hecho: vale tanto la casilla como el texto de la pastilla.
        const doToggle = (e) => { if (e) e.stopPropagation(); if (row._justDragged) { row._justDragged = false; return; } if (!canEdit()) { UI.toast('Modo lector — no puedes modificar'); return; } completeWithAnim(m, row); };
        const check = el('button', { class:'pack-check', 'aria-pressed':'false', title:'Marcar hecho', html:'', onclick: doToggle });
        row.appendChild(check);
        if (isOverdue(m)) row.appendChild(el('span', { class:'pending-warn', title:'Fecha pasada', text:'⚠️' }));
        row.appendChild(el('div', { class:'pack-name', onclick: doToggle }, [
          el('div', { text: m.text || '(sin texto)' }),
          (m.date || m.time) ? el('div', { class:'pending-date-sub', text: [ m.date ? fmtDateShort(m.date) : '', m.time || '' ].filter(Boolean).join(' · ') }) : null,
        ].filter(Boolean)));
        if (editMode && canEdit()) row.appendChild(el('button', { class:'icon-btn pack-del', title:'Editar', html: svg('edit'), onclick:(e)=>{ e.stopPropagation(); TripDetail._openPendingEditor(t, m); } }));
        if (draggable) {
          row.addEventListener('dragstart', (e)=>{ draggedRow=row; row.classList.add('dragging'); e.dataTransfer.effectAllowed='move'; try{e.dataTransfer.setData('text/plain', m.id);}catch(_){} });
          row.addEventListener('dragend', ()=>{ row.classList.remove('dragging'); clearDnd(); draggedRow=null; });
          row.addEventListener('dragover', (e)=>{ if(!draggedRow||draggedRow===row) return; e.preventDefault(); const r=row.getBoundingClientRect(); const before=(e.clientY-r.top)<r.height/2; root.querySelectorAll('.drag-over-top,.drag-over-bot').forEach(n=>{ if(n!==row) n.classList.remove('drag-over-top','drag-over-bot'); }); row.classList.toggle('drag-over-top', before); row.classList.toggle('drag-over-bot', !before); });
          row.addEventListener('drop', async (e)=>{ if(!draggedRow||draggedRow===row) return; e.preventDefault(); e.stopPropagation(); const before=row.classList.contains('drag-over-top'); clearDnd(); await TripDetail._reorderPending(t, draggedRow.dataset.id, row.dataset.id, before, row.dataset.cat); });
          let lpTimer=null, lpDrag=false, lpStartY=0;
          row.addEventListener('touchstart', (e)=>{ if (e.target.closest('button')) return; lpStartY=e.touches[0].clientY; lpTimer=setTimeout(()=>{ lpDrag=true; row.classList.add('dragging'); document.body.classList.add('pack-dragging'); if (navigator.vibrate) { try{navigator.vibrate(12);}catch(_){} } }, 320); }, { passive:true });
          row.addEventListener('touchmove', (e)=>{ if (!lpDrag) { if (lpTimer && Math.abs(e.touches[0].clientY-lpStartY)>8) { clearTimeout(lpTimer); lpTimer=null; } return; } e.preventDefault(); reorderTo(e.touches[0].clientY, row); }, { passive:false });
          const endTouch=()=>{ clearTimeout(lpTimer); lpTimer=null; if (lpDrag) { lpDrag=false; row.classList.remove('dragging'); document.body.classList.remove('pack-dragging'); row._justDragged = true; persistGroupOrder(); } };
          row.addEventListener('touchend', endTouch);
          row.addEventListener('touchcancel', endTouch);
        }
        return row;
      };
      grp_list.forEach(m => ul.appendChild(makeRow(m)));

      if (canEdit()) {
        grp.addEventListener('dragover', (e)=>{ if(!draggedRow) return; if(e.target.closest('.pack-item')) return; e.preventDefault(); grp.classList.add('pack-cat-target'); });
        grp.addEventListener('dragleave', (e)=>{ if(!grp.contains(e.relatedTarget)) grp.classList.remove('pack-cat-target'); });
        grp.addEventListener('drop', async (e)=>{ if(!draggedRow) return; if(e.target.closest('.pack-item')) return; e.preventDefault(); grp.classList.remove('pack-cat-target'); await TripDetail._reorderPending(t, draggedRow.dataset.id, null, false, c.id); });
      }
      grp.appendChild(ul);
      root.appendChild(grp);
    }

    // --- Completados (ocultos; se abren con "Ver completados") ---
    const doneItems = manual.filter(m => m.done).sort((a,b) => (b.done_at||0)-(a.done_at||0));
    if (doneItems.length) {
      const open = TripDetail._pendingShowDone;
      const sec = el('div', { class:'pending-done-section' + (open ? ' open' : '') });
      sec.appendChild(el('button', { class:'pending-done-toggle', onclick:()=>{ TripDetail._pendingShowDone = !TripDetail._pendingShowDone; Router.render(); } }, [
        el('span', { class:'pack-group-chevron', html: svg('chevron') }),
        el('span', { text:'Ver completados' }),
        el('span', { class:'pack-group-count', text: String(doneItems.length) }),
      ]));
      if (open) {
        const list = el('div', { class:'pack-list' });
        doneItems.forEach(m => {
          const undo = () => { if (!canEdit()) return; m.done=false; m.done_at=null; saveManual().then(()=>{ const sy=window.scrollY; Router.render().then(()=>window.scrollTo(0,sy)); }); };
          list.appendChild(el('div', { class:'pack-item pending-item done' }, [
            el('button', { class:'pack-check on', title:'Marcar pendiente', html: svg('check'), onclick: undo }),
            el('div', { class:'pack-name', onclick: undo }, [
              el('div', { text: m.text || '(sin texto)' }),
              (m.date || m.time) ? el('div', { class:'pending-date-sub', text: [ m.date ? fmtDateShort(m.date) : '', m.time || '' ].filter(Boolean).join(' · ') }) : null,
            ].filter(Boolean)),
          ]));
        });
        sec.appendChild(list);
      }
      root.appendChild(sec);
    }
  },

  // --- Helpers de pendientes (modelo array en t.pending_items) ---
  _pendingItems(t) {
    if (!Array.isArray(t.pending_items)) t.pending_items = [];
    return t.pending_items;
  },
  _pendingCats(t, items) {
    const byCat = {};
    items.forEach(i => { const k = i.group || 'general'; (byCat[k] = byCat[k] || []).push(i); });
    const builtinIds = new Set(CATS_PENDING.map(c => c.id));
    const labelOf = {}; (t.pending_categories || []).forEach(c => { labelOf[c.id] = c.label; });
    const cats = []; const seen = new Set();
    CATS_PENDING.forEach(c => { if ((byCat[c.id] || []).length || labelOf[c.id]) { cats.push({ id:c.id, label: labelOf[c.id] || c.label, custom:false }); seen.add(c.id); } });
    (t.pending_categories || []).forEach(c => { if (!seen.has(c.id) && !builtinIds.has(c.id)) { cats.push({ id:c.id, label:c.label, custom:true }); seen.add(c.id); } });
    Object.keys(byCat).forEach(cid => { if (!seen.has(cid)) { cats.push({ id:cid, label: labelOf[cid] || cid, custom: !builtinIds.has(cid) }); seen.add(cid); } });
    if (!cats.length) cats.push({ id:'general', label:'Tareas', custom:false });
    const order = Array.isArray(t.pending_group_order) ? t.pending_group_order : [];
    if (order.length) cats.sort((a, b) => { const ia=order.indexOf(a.id), ib=order.indexOf(b.id); if (ia===-1&&ib===-1) return 0; if (ia===-1) return 1; if (ib===-1) return -1; return ia-ib; });
    return { cats, byCat };
  },
  async _renamePendingGroup(t, catId, newLabel) {
    if (!canEdit()) return;
    newLabel = (newLabel || '').trim(); if (!newLabel) return;
    const cats = Array.isArray(t.pending_categories) ? t.pending_categories : (t.pending_categories = []);
    const existing = cats.find(c => c.id === catId);
    const cur = existing ? existing.label : (CATS_PENDING.find(c => c.id === catId)?.label || catId);
    if (newLabel === cur) return;
    if (existing) existing.label = newLabel; else cats.push({ id: catId, label: newLabel });
    try { await DB.put('trips', t); } catch (e) { console.error(e); }
  },
  async _movePendingGroup(t, catId, dir) {
    if (!canEdit()) return;
    const { cats } = TripDetail._pendingCats(t, TripDetail._pendingItems(t).filter(m => !m.done));
    const ids = cats.map(c => c.id); const idx = ids.indexOf(catId); const swap = idx + dir;
    if (idx < 0 || swap < 0 || swap >= ids.length) return;
    [ids[idx], ids[swap]] = [ids[swap], ids[idx]];
    const prev = Array.isArray(t.pending_group_order) ? t.pending_group_order : [];
    const extra = prev.filter(id => !ids.includes(id));
    t.pending_group_order = [...ids, ...extra];
    await DB.put('trips', t); Router.render();
  },
  async _reorderPending(t, draggedId, targetId, before, targetCat) {
    if (!canEdit()) return;
    const arr = TripDetail._pendingItems(t);
    const dragged = arr.find(m => m.id === draggedId); if (!dragged) return;
    if (targetCat && targetCat !== (dragged.group || 'general')) dragged.group = targetCat;
    const group = arr.filter(m => m.id !== draggedId && (m.group || 'general') === (dragged.group || 'general') && !m.done)
      .sort((a, b) => (a.order_index || 0) - (b.order_index || 0));
    let newIndex = group.length;
    if (targetId) { const idx = group.findIndex(m => m.id === targetId); if (idx >= 0) newIndex = before ? idx : idx + 1; }
    group.splice(newIndex, 0, dragged);
    group.forEach((m, i) => { m.order_index = i; });
    await DB.put('trips', t); Router.render();
  },
  _openNewPendingGroup(t) {
    if (!canEdit()) return;
    const body = el('div', {}, [ el('div', { class:'form-row' }, [ el('label', { text:'Nombre del grupo' }), el('input', { id:'pg-name', type:'text', placeholder:'Ej. Antes de salir' }) ]) ]);
    const save = el('button', { class:'btn btn-primary', onclick: async () => {
      const label = ($('#pg-name')?.value || '').trim(); if (!label) { UI.toast('Pon un nombre'); return; }
      const id = 'pg-' + uuid().slice(0, 8);
      const cats = Array.isArray(t.pending_categories) ? t.pending_categories : (t.pending_categories = []);
      cats.push({ id, label });
      const order = Array.isArray(t.pending_group_order) ? t.pending_group_order : [];
      t.pending_group_order = [...order.filter(x => x !== id), id];
      await DB.put('trips', t); UI.closeSheet(); Router.render();
    } }, 'Crear');
    UI.openSheet({ title:'Nuevo grupo', body, footer:[ el('button', { class:'btn btn-ghost', onclick:()=>UI.closeSheet() }, 'Cancelar'), save ] });
  },
  async _deletePendingGroup(t, catId) {
    if (!canEdit()) return;
    const ok = await UI.confirm('¿Borrar este grupo? Sus tareas pasarán a "Tareas".');
    if (!ok) return;
    TripDetail._pendingItems(t).forEach(m => { if ((m.group || 'general') === catId) m.group = 'general'; });
    t.pending_categories = (t.pending_categories || []).filter(c => c.id !== catId);
    t.pending_group_order = (t.pending_group_order || []).filter(id => id !== catId);
    await DB.put('trips', t); Router.render();
  },

  // Editor de un pendiente manual: texto + grupo + fecha/hora opcionales.
  _openPendingEditor(t, existing, defaultGroup) {
    if (!canEdit()) { UI.toast('Modo lector — no puedes modificar'); return; }
    const arr = TripDetail._pendingItems(t);
    const m = existing || { id: uuid(), text:'', done:false, date:'', time:'', group: defaultGroup || 'general', order_index: arr.length };
    const { cats } = TripDetail._pendingCats(t, arr.filter(x => !x.done));
    const groupOpts = cats.length ? cats : [{ id:'general', label:'Tareas' }];
    // Asegura que el grupo actual aparezca aunque esté vacío.
    if (!groupOpts.some(c => c.id === (m.group || 'general'))) {
      const lbl = (t.pending_categories || []).find(c => c.id === m.group)?.label || (CATS_PENDING.find(c => c.id === m.group)?.label) || 'Tareas';
      groupOpts.unshift({ id: m.group || 'general', label: lbl });
    }
    const body = el('div', {}, [
      el('div', { class:'form-row' }, [
        el('label', { text:'Tarea pendiente' }),
        el('input', { id:'pe-text', type:'text', value: m.text || '', placeholder:'Ej. Reservar entradas del museo' }),
      ]),
      el('div', { class:'form-row' }, [
        el('label', { text:'Grupo' }),
        el('select', { id:'pe-group' }, groupOpts.map(c => el('option', { value:c.id, selected:(m.group||'general')===c.id?true:null }, c.label))),
      ]),
      el('div', { class:'form-grid-2' }, [
        el('div', { class:'form-row' }, [ el('label', { text:'Fecha (opcional)' }), el('input', { id:'pe-date', type:'date', value: m.date || '' }) ]),
        el('div', { class:'form-row' }, [ el('label', { text:'Hora (opcional)' }), el('input', { id:'pe-time', type:'time', value: m.time || '' }) ]),
      ]),
      el('div', { class:'field-hint', text:'Si pones fecha y ya ha pasado, saldrá un aviso ⚠️ mientras siga pendiente.' }),
    ]);
    const save = el('button', { class:'btn btn-primary', onclick: async () => {
      m.text = ($('#pe-text')?.value || '').trim();
      if (!m.text) { UI.toast('Escribe la tarea'); return; }
      m.group = $('#pe-group')?.value || 'general';
      m.date = $('#pe-date')?.value || '';
      m.time = $('#pe-time')?.value || '';
      if (typeof m.order_index !== 'number') m.order_index = arr.length;
      if (!existing) arr.push(m);
      await DB.put('trips', t);
      UI.toast('Guardado'); UI.closeSheet(); Router.render();
    }}, 'Guardar');
    const delBtn = existing ? el('button', { class:'btn btn-danger', onclick: async () => {
      const i = arr.indexOf(m); if (i>=0) arr.splice(i,1);
      await DB.put('trips', t); UI.closeSheet(); Router.render();
    }}, 'Borrar') : null;
    UI.openSheet({ title: existing ? 'Editar pendiente' : 'Nuevo pendiente', body,
      footer:[delBtn, el('button', { class:'btn btn-ghost', onclick: () => UI.closeSheet() }, 'Cancelar'), save].filter(Boolean) });
  },

  /* ----- Estadísticas — resumen del viaje ----- */
  async tabEstadisticas(root, t) {
    const planning = await DB.listByTrip('planning_items', t.id);
    const budget   = await DB.listByTrip('budget_items', t.id).catch(() => []);

    // Noches por alojamiento (nombre = place_name o título; p. ej. "Madrid").
    const nightsByPlace = new Map();
    let totalNights = 0;
    for (const p of planning) {
      if (p.type === 'hotel' && p.consultation_planned_d1 && p.consultation_planned_d2 && p.consultation_planned_d1 < p.consultation_planned_d2) {
        const n = daysBetween(p.consultation_planned_d1, p.consultation_planned_d2);
        if (n > 0) {
          const name = p.place_name || p.title || 'Alojamiento';
          nightsByPlace.set(name, (nightsByPlace.get(name) || 0) + n);
          totalNights += n;
        }
      }
    }
    const totalDays = (t.start_date && t.end_date) ? (daysBetween(t.start_date, t.end_date) + 1) : 0;
    const people = new Set(planning.flatMap(p => Array.isArray(p.people) ? p.people : []));
    const totalEur = budget.reduce((a, b) => a + (Number(b.amount_eur) || 0), 0);
    const byType = {};
    planning.forEach(p => { byType[p.type] = (byType[p.type] || 0) + 1; });

    // Métricas generales
    const cells = [
      el('div', { class:'metric' }, [ el('div',{class:'label',text:'Días'}), el('div',{class:'value',text:String(totalDays || '—')}) ]),
      el('div', { class:'metric' }, [ el('div',{class:'label',text:'Noches'}), el('div',{class:'value',text:String(totalNights)}) ]),
      el('div', { class:'metric' }, [ el('div',{class:'label',text:'Paradas'}), el('div',{class:'value',text:String(planning.length)}) ]),
      people.size ? el('div', { class:'metric' }, [ el('div',{class:'label',text:'Personas'}), el('div',{class:'value',text:String(people.size)}) ]) : null,
      canSeeMoney() ? el('div', { class:'metric' }, [ el('div',{class:'label',text:'Gasto'}), el('div',{class:'value',text:fmtMoney(totalEur,'EUR')}) ]) : null,
    ].filter(Boolean);

      el('button', { class:'btn btn-primary', onclick: () => TripDetail.openSharedEditor(t) }, [

        el('p', { text:'Añade quién pagó qué y cómo se reparte — calcularé los saldos.' }),
      ]));
      return;
    }

    // Balances
    const balances = {};
    items.forEach(i => {
      const total = Number(i.amount) || 0;
      balances[i.payer] = (balances[i.payer] || 0) + total;
      const split = i.split || {};

      if (Object.keys(split).length) {
        for (const [p, share] of Object.entries(split)) balances[p] = (balances[p] || 0) - Number(share);
      } else if (parts.length) {
        const per = total / parts.length;
        for (const p of parts) balances[p] = (balances[p] || 0) - per;
      }
    });

    root.appendChild(el('h2', { class:'section-title', text:'Saldos' }));
    const balList = el('div', { class:'list' });
    Object.entries(balances).forEach(([p,v]) => {

      balList.appendChild(el('div', { class:'list-item' }, [

          el('div', { class:'li-title', text: p }),

    const list = el('div', { class:'list' });

      list.appendChild(el('div', { class:'list-item', onclick: () => TripDetail.openSharedEditor(t, i) }, [

function simplifySettlement(balances) {
  const eps = 0.01;
  const debtors = [];
  const creditors = [];
  for (const [p,v] of Object.entries(balances)) {
    if (v > eps) creditors.push({ p, v });
    else if (v < -eps) debtors.push({ p, v: -v });
  }
  debtors.sort((a,b) => b.v - a.v); creditors.sort((a,b) => b.v - a.v);
  const out = [];
  let i = 0, j = 0;
  while (i < debtors.length && j < creditors.length) {
    const amt = Math.min(debtors[i].v, creditors[j].v);
    if (amt > eps) out.push({ from: debtors[i].p, to: creditors[j].p, amount: +amt.toFixed(2) });
    debtors[i].v -= amt; creditors[j].v -= amt;
    if (debtors[i].v <= eps) i++;
    if (creditors[j].v <= eps) j++;
  }
  return out;
}

/* ============================================================
   Exporter — PDF + JSON
   ============================================================ */
const Exporter = {
  async tripToPdf(t) {
    if (!window.jspdf) { UI.toast('PDF no disponible offline si no se cargó la lib'); return; }
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ unit:'pt', format:'a4' });
    const planning = await DB.listByTrip('planning_items', t.id);
    const budget = await DB.listByTrip('budget_items', t.id);
    const bookings = await DB.listByTrip('bookings', t.id);

    let y = 56;
    const left = 56, right = 540;
    const line = (text, opts={}) => {
      doc.setFont('helvetica', opts.bold ? 'bold' : 'normal');
      doc.setFontSize(opts.size || 11);
      const lines = doc.splitTextToSize(text, right-left);
      lines.forEach(l => {
        if (y > 780) { doc.addPage(); y = 56; }
        doc.text(l, left, y); y += (opts.size || 11) * 1.3;
      });
    };

    line(t.name, { bold:true, size:22 });
    y += 6;
    if (t.start_date && t.end_date) line(`${fmtDate(t.start_date, {day:'numeric',month:'long',year:'numeric'})} – ${fmtDate(t.end_date, {day:'numeric',month:'long',year:'numeric'})}`, { size:12 });
    if (t.city || t.country) line([t.city, t.country].filter(Boolean).join(', '), { size:12 });
    y += 12;

    // Reservas
    if (bookings.length) {
      line('Reservas', { bold:true, size:14 }); y += 4;
      bookings.forEach(b => {
        line(`• ${b.type.toUpperCase()}: ${Object.entries(b.structured_data||{}).map(([k,v]) => `${k} ${v}`).join(' · ')}`);
        if (b.doc_url) line(`  Documento: ${b.doc_name || b.doc_url}`);
      });
      y += 8;
    }

    // Planning
    if (planning.length) {
      line('Planning', { bold:true, size:14 }); y += 4;
      const byDay = {};
      planning.forEach(p => { (byDay[p.day_date || 'Sin fecha'] = byDay[p.day_date || 'Sin fecha'] || []).push(p); });
      Object.keys(byDay).sort().forEach(k => {
        line(k === 'Sin fecha' ? 'Sin fecha' : fmtDayLong(k), { bold:true, size:12 });
        byDay[k].sort((a,b) => (a.time||'').localeCompare(b.time||''));
        byDay[k].forEach(p => {
          line(`  ${p.time ? p.time+' · ' : ''}${p.title}${p.place_name && p.place_name !== p.title ? ' ('+p.place_name+')' : ''}`);
          if (p.address) line(`    ${p.address}`);
        });
        y += 4;
      });
    }

    // Presupuesto resumen
    if (budget.length) {
      line('Presupuesto', { bold:true, size:14 }); y += 4;
      const totalEur = budget.reduce((a,b) => a + (Number(b.amount_eur)||0), 0);
      const byCat = {};
      budget.forEach(b => { byCat[b.category] = (byCat[b.category] || 0) + (Number(b.amount_eur)||0); });
      line(`Total estimado: ${fmtMoney(totalEur,'EUR')}`, { bold:true });
      Object.entries(byCat).forEach(([cat,v]) => line(`  ${CATS_BUDGET.find(c=>c.id===cat)?.label || cat}: ${fmtMoney(v,'EUR')}`));
    }

    doc.save(`${t.name.replace(/\W+/g,'_')}.pdf`);
  },
