  async tabPablo(root, t) {
    TripDetail._wardrobeInjectStyles();
    const allItems = await DB.listByTrip('wardrobe_items', t.id);
    const accFaseIds = new Set(TripDetail._accFaseIds());
    const items = allItems.filter(i => !accFaseIds.has(i.talla));
    const cat = await TripDetail._wardrobeCatalog(t);
    const total = items.reduce((s, i) => s + (Number(i.qty) || 0), 0);
    const view = TripDetail._wardrobeView || 'inv';
    const sort = TripDetail._wardrobeSort || 'prenda';

    root.appendChild(el('div', { class:'wr-head' }, [
      el('div', { class:'wr-sum' }, [
        el('span', { class:'wr-sum-n mono', text: String(total) }),
        el('span', { class:'muted', text: total === 1 ? 'prenda' : 'prendas' }),
        items.length ? el('span', { class:'wr-dot', text:'·' }) : null,
        items.length ? el('span', { class:'muted', text: `${items.length} ${items.length === 1 ? 'entrada' : 'entradas'}` }) : null,
      ].filter(Boolean)),
      (canEdit() && view !== 'acc') ? el('button', { class:'icon-btn icon-btn-primary', title:'Añadir prenda', 'aria-label':'Añadir prenda',
        html: svg('plus'), onclick: () => TripDetail.openWardrobeFlow(t) }) : null,
    ].filter(Boolean)));

    // Selector de vista: Inventario / Plan / Accesorios
    root.appendChild(el('div', { class:'segmented wr-viewtoggle' }, [
      ['inv','Inventario'], ['plan','Plan'], ['acc','Accesorios'],
    ].map(([k, lbl]) => el('button', { class: view === k ? 'active' : '',
      onclick: () => { TripDetail._wardrobeView = k; Router.renderKeepScroll(); } }, lbl))));

    if (view === 'acc') { await TripDetail._accRenderView(root, t); return; }
    if (view === 'plan') { TripDetail._wardrobeRenderPlan(root, t, items, cat); return; }

    // ---- Vista inventario ----
    if (!items.length) {
      root.appendChild(el('div', { class:'empty' }, [
        el('div', { class:'icon', html: svg('suit') }),
        el('h3', { text:'Armario vacío' }),
        el('p', { text: canEdit() ? 'Añade la primera prenda del bebé con el “+”.' : 'Todavía no hay prendas registradas.' }),
      ]));
      return;
    }

    root.appendChild(el('div', { class:'segmented wr-sort' }, [
      ['prenda','A–Z'], ['qty','Cantidad'], ['talla','Talla'],
    ].map(([k, lbl]) => el('button', { class: sort === k ? 'active' : '',
      onclick: () => { TripDetail._wardrobeSort = k; Router.renderKeepScroll(); } }, lbl))));

    const tOrder = TripDetail.WARDROBE_DEFAULTS.tallas;
    const sorted = [...items];
    if (sort === 'prenda') sorted.sort((a, b) => a.prenda.localeCompare(b.prenda, 'es') || a.talla.localeCompare(b.talla, 'es'));
    else if (sort === 'qty') sorted.sort((a, b) => (b.qty - a.qty) || a.prenda.localeCompare(b.prenda, 'es'));
    else if (sort === 'talla') sorted.sort((a, b) => { const ai = tOrder.indexOf(a.talla), bi = tOrder.indexOf(b.talla); return (ai < 0 ? 99 : ai) - (bi < 0 ? 99 : bi) || a.prenda.localeCompare(b.prenda, 'es'); });

    const list = el('div', { class:'wr-list' });
    sorted.forEach(it => {
      list.appendChild(el('div', { class:'wr-item' }, [
        el('div', { class:'wr-qty mono', text: String(it.qty) }),
        el('button', { class:'wr-clickable', style:{ display:'flex', alignItems:'center', gap:'12px', flex:'1', minWidth:'0' },
          title:'Ver desglose por talla', onclick: () => TripDetail._wardrobeOpenPrendaBreakdown(t, it.prenda) }, [
          el('div', { class:'wr-ico', text: TripDetail._wardrobeIcon(it.prenda) }),
          el('div', { class:'wr-info' }, [
            el('div', { class:'wr-name', text: it.prenda }),
            el('div', { class:'wr-sub muted', text: `${it.tipo} · ${it.talla}` }),
          ]),
        ]),
        canEdit() ? el('button', { class:'icon-btn', title:'Editar', 'aria-label':'Editar prenda',
          html: svg('edit'), onclick: () => TripDetail.openWardrobeFlow(t, it) }) : null,
      ].filter(Boolean)));
    });
    root.appendChild(list);

    root.appendChild(el('div', { class:'wr-foot' }, [
      el('button', { class:'btn btn-ghost btn-sm', onclick: () => TripDetail._wardrobeExportCSV(sorted) }, [
        el('span', { html: svg('download') }), 'Exportar CSV',
      ]),
    ]));
  },

  // Vista "Plan": aviso de talla, progreso global, por talla, gráficos y acciones.
  _wardrobeRenderPlan(root, t, items, cat) {
    const st = TripDetail._wardrobePlan(items, cat);
    const bar = (covered, need) => {
      const p = need ? Math.min(100, Math.round(covered / need * 100)) : 0;
      return el('div', { class:'budget-bar' }, [ el('div', { class: 'budget-fill' + (p >= 100 ? ' wr-done' : ''), style:{ width: p + '%' } }) ]);
    };
    const pct = st.needTotal ? Math.round(st.coveredTotal / st.needTotal * 100) : 0;
    const faltan = Math.max(0, st.needTotal - st.coveredTotal);
    const human = (d) => d <= 0 ? 'ya' : (d <= 21 ? `${d} días` : (d < 75 ? `${Math.round(d/7)} semanas` : `${Math.round(d/30)} meses`));

    // 0) Aviso de talla vigente / próximo cambio (#2 y #3)
    const cur = TripDetail._wardrobeCurrentSize();
    let avisoTxt;
    if (cur.estado === 'antes') avisoTxt = `Aún no empieza. Primera talla: ${cur.size.talla} en ~${human(cur.dias)} (${fmtDateShort(cur.size.desde)}).`;
    else if (cur.estado === 'actual') avisoTxt = cur.nextSize
      ? `Talla actual: ${cur.size.talla}. Cambia a ${cur.nextSize.talla} en ~${human(cur.dias)}.`
      : `Talla actual: ${cur.size.talla} (última del plan).`;
    else avisoTxt = 'Plan completado. Toca preparar el siguiente verano 2027.';
    root.appendChild(el('div', { class:'wr-aviso' }, [ el('span', { class:'wr-aviso-ico', html: svg('cal') }), el('span', { text: avisoTxt }) ]));

    // 1) Progreso global (clic → checklist completa)
    root.appendChild(el('button', { class:'wr-plan-card wr-plan-global', onclick: () => TripDetail._wardrobeOpenChecklist(t, null) }, [
      el('div', { class:'wr-plan-top' }, [
        el('div', {}, [
          el('div', { class:'wr-plan-title', text: `Plan ${TripDetail.WARDROBE_PLAN.from} → ${TripDetail.WARDROBE_PLAN.to}` }),
          el('div', { class:'wr-plan-sub muted', text: TripDetail.WARDROBE_PLAN.note }),
        ]),
        el('div', { class:'wr-plan-pct', text: pct + '%' }),
      ]),
      bar(st.coveredTotal, st.needTotal),
      el('div', { class:'wr-plan-legend' }, [
        el('span', { class:'muted', html: `<span class="mono">${st.coveredTotal}</span> / <span class="mono">${st.needTotal}</span> prendas` }),
        el('span', { class: faltan ? 'wr-faltan' : 'wr-ok', text: faltan ? `faltan ${faltan}` : '¡completo! 🎉' }),
      ]),
      el('div', { class:'wr-plan-hint muted', text: 'Toca para ver y marcar la lista →' }),
    ]));

    // 1b) Filtro rápido: ropa de verano (manga corta, pantalón corto, pelele corto…)
    root.appendChild(el('div', { class:'wr-filter-row' }, [
      el('button', { class:'wr-verano-chip', onclick: () => TripDetail._wardrobeOpenChecklist(t, null, { verano:true }) },
        [ el('span', { text:'☀️' }), 'Ver ropa de verano' ]),
    ]));

    // 2) Por talla (con badge de talla actual y botón "guardar talla")
    const tw = el('div', { class:'wr-section' }, [ el('div', { class:'wr-section-h', text:'Por talla' }) ]);
    st.byTalla.forEach(g => {
      const p = g.need ? Math.round(g.covered / g.need * 100) : 0;
      const isCurrent = cur.size && cur.size.talla === g.talla;
      const badge = (isCurrent && cur.estado === 'actual') ? 'Talla actual' : (isCurrent && cur.estado === 'antes') ? 'Próxima' : null;
      const card = el('div', { class: 'wr-plan-card wr-talla-card' + (g.archived ? ' wr-arch' : '') + (isCurrent ? ' wr-cur' : ''),
        role:'button', tabindex:'0', onclick: () => TripDetail._wardrobeOpenChecklist(t, g.talla) }, [
        el('div', { class:'wr-plan-top' }, [
          el('div', {}, [
            el('div', { class:'wr-plan-title' }, [ g.talla, badge ? el('span', { class:'wr-badge', text: badge }) : null, g.verano ? el('span', { class:'wr-badge wr-badge-verano', text:'☀️ Verano' }) : null, g.archived ? el('span', { class:'wr-badge wr-badge-arch', text:'Guardada' }) : null ].filter(Boolean)),
            el('div', { class:'wr-plan-sub muted', text: g.meses }),
          ]),
          el('div', { class:'wr-plan-pct', text: p + '%' }),
        ]),
        bar(g.covered, g.need),
        el('div', { class:'wr-plan-legend' }, [
          el('span', { class:'muted', html: `<span class="mono">${g.covered}</span> / <span class="mono">${g.need}</span>` }),
          canEdit() ? el('button', { class:'wr-mini-link', onclick: async (e) => {
            e.stopPropagation();
            cat.prefs.archived[g.talla] = !cat.prefs.archived[g.talla];
            if (!cat.prefs.archived[g.talla]) delete cat.prefs.archived[g.talla];
            await TripDetail._wardrobeSaveCatalog(cat); Router.renderKeepScroll();
          } }, g.archived ? 'Reactivar' : 'Guardar talla') : null,
        ].filter(Boolean)),
      ]);
      tw.appendChild(card);
    });
    root.appendChild(tw);

    // 3) Gráfico de barras: inventario por prenda
    const cw = el('div', { class:'wr-section' }, [ el('div', { class:'wr-section-h', text:'Inventario por prenda' }) ]);
    const entries = Object.entries(st.haveByPrenda).sort((a, b) => b[1] - a[1]);
    if (!entries.length) {
      cw.appendChild(el('div', { class:'muted', style:{ fontSize:'.88rem' }, text:'Aún no has añadido prendas.' }));
    } else {
      const max = Math.max(1, ...entries.map(e => e[1]));
      entries.forEach(([p, n]) => cw.appendChild(el('button', { class:'wr-chart-row wr-clickable', title:'Ver desglose por talla',
        onclick: () => TripDetail._wardrobeOpenPrendaBreakdown(t, p) }, [
        el('div', { class:'wr-chart-label' }, [ el('span', { text: TripDetail._wardrobeIcon(p) }), el('span', { text: p }) ]),
        el('div', { class:'wr-chart-track' }, [ el('div', { class:'wr-chart-bar', style:{ width: Math.round(n / max * 100) + '%' } }) ]),
        el('div', { class:'wr-chart-n mono', text: String(n) }),
      ])));
    }
    root.appendChild(cw);

    // 4) Progreso por prenda (vs plan)
    const pw = el('div', { class:'wr-section' }, [ el('div', { class:'wr-section-h', text:'Progreso por prenda (vs plan)' }) ]);
    st.byPrenda.sort((a, b) => a.prenda.localeCompare(b.prenda, 'es')).forEach(g => {
      pw.appendChild(el('button', { class:'wr-pp-row wr-clickable', title:'Ver desglose por talla',
        onclick: () => TripDetail._wardrobeOpenPrendaBreakdown(t, g.prenda) }, [
        el('div', { class:'wr-pp-head' }, [
          el('span', { class:'wr-pp-label' }, [ el('span', { text: TripDetail._wardrobeIcon(g.prenda) }), ' ' + g.prenda ]),
          el('span', { class:'wr-pp-n muted mono', text: `${g.covered}/${g.need}` }),
        ]),
        bar(g.covered, g.need),
      ]));
    });
    root.appendChild(pw);

    // 5) Acciones
    root.appendChild(el('div', { class:'wr-foot wr-foot-grid' }, [
      el('button', { class:'btn btn-primary btn-sm', onclick: () => TripDetail._wardrobeOpenShopping(t) }, [ el('span', { html: svg('compass') }), 'Comprar en España' ]),
      el('button', { class:'btn btn-ghost btn-sm', onclick: () => TripDetail._wardrobeOpenChecklist(t, null) }, 'Ver lista'),
      canEdit() ? el('button', { class:'btn btn-ghost btn-sm', onclick: () => TripDetail._wardrobeEditPlan(t) }, [ el('span', { html: svg('edit') }), 'Editar plan' ]) : null,
      el('button', { class:'btn btn-ghost btn-sm', onclick: () => TripDetail._wardrobeShoppingCSV(items, cat) }, [ el('span', { html: svg('download') }), 'CSV' ]),
    ].filter(Boolean)));
  },

  // Suma/resta una unidad al inventario de (talla, prenda). + crea/incrementa; − decrementa/elimina.
  // Mantiene una única fuente de verdad: el propio inventario (wardrobe_items).
  async _wardrobeAdjust(t, talla, prenda, delta, cat) {
    const items = await DB.listByTrip('wardrobe_items', t.id);
    const matching = items.filter(x => x.talla === talla && x.prenda === prenda);
    if (delta > 0) {
      if (matching.length) { const it = matching[0]; it.qty = (Number(it.qty) || 0) + 1; await DB.put('wardrobe_items', it); }
      else {
        const tipo = (cat && cat.tipos[prenda] && cat.tipos[prenda][0]) || 'General';
        await DB.put('wardrobe_items', { id: uuid(), trip_id: t.id, prenda, tipo, talla, qty: 1 });
      }
    } else {
      const it = matching.find(x => (Number(x.qty) || 0) > 0);
      if (!it) return;
      const q = (Number(it.qty) || 0) - 1;
      if (q <= 0) await DB.remove('wardrobe_items', it.id);
      else { it.qty = q; await DB.put('wardrobe_items', it); }
    }
  },

  // Lista del plan (opcionalmente filtrada por talla). Cada línea tiene +/− que ajustan el inventario.
  async _wardrobeOpenChecklist(t, filterTalla, opts) {
    TripDetail._wardrobeInjectStyles();
    const cat = await TripDetail._wardrobeCatalog(t);
    const editable = canEdit();
    let veranoOnly = !!(opts && opts.verano);
    const body = el('div', { class:'wr-check' });
    const renderBody = async () => {
      const items = await DB.listByTrip('wardrobe_items', t.id);
      const haveFor = (talla, prenda) => TripDetail._wardrobeHaveFor(items, talla, prenda);
      const haveExactFor = (talla, prenda) => items.filter(x => x.talla === talla && x.prenda === prenda).reduce((s, x) => s + (Number(x.qty) || 0), 0);
      body.innerHTML = '';
      // Toggle "Solo verano" (manga corta, pantalón corto, pelele corto…).
      body.appendChild(el('div', { class:'wr-check-filter' }, [
        el('button', { class: 'wr-verano-chip' + (veranoOnly ? ' on' : ''), 'aria-pressed': String(veranoOnly),
          onclick: () => { veranoOnly = !veranoOnly; renderBody(); } }, [ el('span', { text:'☀️' }), 'Solo verano' ]),
      ]));
      const sizes = TripDetail.WARDROBE_PLAN.sizes.filter(s => !filterTalla || s.talla === filterTalla);
      let shown = 0;
      sizes.forEach(sz => {
        const visibles = sz.items.filter(it => !veranoOnly || it.verano);
        if (!visibles.length) return;
        const grp = el('div', { class:'wr-check-grp' }, [
          el('div', { class:'wr-check-h' }, [ el('span', { class:'wr-check-talla', text: sz.talla }), el('span', { class:'muted', text: sz.meses }), sz.verano ? el('span', { class:'wr-badge wr-badge-verano', text:'☀️ Verano' }) : null ].filter(Boolean) ),
        ]);
        visibles.forEach(it => {
          shown++;
          const need = TripDetail._wardrobeNeed(cat, sz.talla, it.prenda, it.need);
          const have = haveFor(sz.talla, it.prenda);
          const haveExact = haveExactFor(sz.talla, it.prenda);
          const done = have >= need;
          const adjust = async (d) => { await TripDetail._wardrobeAdjust(t, sz.talla, it.prenda, d, cat); await renderBody(); };
          const right = editable
            ? el('div', { class:'wr-check-step' }, [
                el('button', { class:'wr-step-btn', type:'button', 'aria-label':'Quitar', disabled: haveExact <= 0 ? true : null, onclick: () => adjust(-1) }, '−'),
                el('span', { class: 'wr-step-n mono' + (done ? ' ok' : ''), text: String(have) }),
                el('button', { class:'wr-step-btn', type:'button', 'aria-label':'Añadir', onclick: () => adjust(1) }, '+'),
                el('span', { class:'wr-step-need muted', text: '/ ' + need }),
              ])
            : el('div', { class: 'wr-check-q' + (done ? ' ok' : ''), text: `${have}/${need}` });
          grp.appendChild(el('div', { class: 'wr-check-row' + (done ? ' done' : '') }, [
            el('div', { class:'wr-check-info' }, [
              el('div', { class:'wr-check-name' }, [ el('span', { text: TripDetail._wardrobeIcon(it.prenda) }), ' ' + it.prenda, it.verano ? el('span', { class:'wr-tag-verano', title:'Ropa de verano', text:'☀️' }) : null ].filter(Boolean)),
              it.nota ? el('div', { class:'wr-check-sub muted', text: it.nota }) : null,
            ].filter(Boolean)),
            right,
          ]));
        });
        body.appendChild(grp);
      });
      if (!shown) body.appendChild(el('div', { class:'muted', style:{ padding:'18px 4px', textAlign:'center' }, text:'No hay prendas de verano en esta vista.' }));
    };
    await renderBody();
    UI.openSheet({
      title: filterTalla ? `Lista · ${filterTalla}` : (veranoOnly ? 'Ropa de verano' : 'Lista de ropa del plan'),
      body,
      footer: [ el('button', { class:'btn btn-primary', onclick: () => { UI.closeSheet(); Router.renderKeepScroll(); } }, 'Listo') ],
    });
  },

  // Exporta lo que FALTA para completar el plan (lista de compra para España).
  _wardrobeShoppingCSV(items, cat) {
    const have = (talla, prenda) => TripDetail._wardrobeHaveFor(items, talla, prenda);
    const rows = [['Talla', 'Prenda', 'Faltan', 'Nota']];
    for (const sz of TripDetail.WARDROBE_PLAN.sizes) {
      for (const it of sz.items) {
        const key = sz.talla + '|' + it.prenda;
        if (cat.checklist && cat.checklist[key]) continue;
        const faltan = Math.max(0, it.need - have(sz.talla, it.prenda));
        if (faltan > 0) rows.push([sz.talla, it.prenda, faltan, it.nota || '']);
      }
    }
    if (rows.length === 1) { UI.toast('¡No falta nada del plan! 🎉'); return; }
    const csv = rows.map(r => r.map(v => `"${String(v).replace(/"/g, '""')}"`).join(',')).join('\n');
    const a = el('a', { href: 'data:text/csv;charset=utf-8,' + encodeURIComponent('﻿' + csv), download: `compra-pablo-${nowIso().slice(0,10)}.csv` });
    document.body.appendChild(a); a.click(); a.remove();
    UI.toast('Lista de compra descargada');
  },

  // Editar el plan: ajustar cantidades objetivo por talla/prenda (se guarda en cat.prefs.need, sincronizado).
  async _wardrobeEditPlan(t) {
    if (!canEdit()) { UI.toast('Modo lector — no puedes modificar'); return; }
    TripDetail._wardrobeInjectStyles();
    const cat = await TripDetail._wardrobeCatalog(t);
    const body = el('div', { class:'wr-edit-plan' });
    body.appendChild(el('div', { class:'field-hint', style:{ margin:'0 0 6px' }, text:'Ajusta cuántas prendas necesitas de cada talla. Se guarda y sincroniza.' }));
    TripDetail.WARDROBE_PLAN.sizes.forEach(sz => {
      const grp = el('div', { class:'wr-ep-grp' }, [ el('div', { class:'wr-ep-h' }, [ el('span', { class:'wr-check-talla', text: sz.talla }), el('span', { class:'muted', text: sz.meses }) ]) ]);
      sz.items.forEach(it => {
        const cur = TripDetail._wardrobeNeed(cat, sz.talla, it.prenda, it.need);
        const val = el('span', { class:'wr-ep-val mono', text: String(cur) });
        const setVal = (n) => {
          n = Math.max(0, Math.min(99, n));
          val.textContent = String(n);
          if (n === it.need) delete cat.prefs.need[sz.talla + '|' + it.prenda];
          else cat.prefs.need[sz.talla + '|' + it.prenda] = n;
        };
        let n = cur;
        grp.appendChild(el('div', { class:'wr-ep-row' }, [
          el('span', { class:'wr-ep-name' }, [ el('span', { text: TripDetail._wardrobeIcon(it.prenda) }), ' ' + it.prenda ]),
          el('div', { class:'wr-ep-step' }, [
            el('button', { class:'icon-btn', type:'button', 'aria-label':'Restar', onclick: () => { n = Math.max(0, n - 1); setVal(n); } }, '−'),
            val,
            el('button', { class:'icon-btn', type:'button', 'aria-label':'Sumar', onclick: () => { n = Math.min(99, n + 1); setVal(n); } }, '+'),
          ]),
        ]));
      });
      body.appendChild(grp);
    });
    const save = el('button', { class:'btn btn-primary', onclick: async () => { await TripDetail._wardrobeSaveCatalog(cat); UI.closeSheet(); Router.renderKeepScroll(); UI.toast('Plan actualizado'); } }, 'Guardar plan');
    const reset = el('button', { class:'btn btn-ghost', onclick: async () => { if (!confirm('¿Restaurar las cantidades por defecto?')) return; cat.prefs.need = {}; await TripDetail._wardrobeSaveCatalog(cat); UI.closeSheet(); Router.renderKeepScroll(); UI.toast('Plan restaurado'); } }, 'Restaurar');
    UI.openSheet({ title:'Editar plan', body, footer:[ reset, save ] });
  },

  // Modo "Comprar en España": solo lo que falta, agrupado por talla. El "+" registra lo comprado
  // (suma al inventario) y la línea desaparece al completarse.
  async _wardrobeOpenShopping(t) {
    TripDetail._wardrobeInjectStyles();
    const cat = await TripDetail._wardrobeCatalog(t);
    const editable = canEdit();
    const body = el('div', { class:'wr-check' });
    const renderBody = async () => {
      const items = await DB.listByTrip('wardrobe_items', t.id);
      const haveFor = (talla, prenda) => TripDetail._wardrobeHaveFor(items, talla, prenda);
      const haveExactFor = (talla, prenda) => items.filter(x => x.talla === talla && x.prenda === prenda).reduce((s, x) => s + (Number(x.qty) || 0), 0);
      body.innerHTML = '';
      let totalFaltan = 0;
      const groups = [];
      TripDetail.WARDROBE_PLAN.sizes.forEach(sz => {
        if (cat.prefs.archived[sz.talla]) return;
        const rows = [];
        sz.items.forEach(it => {
          const need = TripDetail._wardrobeNeed(cat, sz.talla, it.prenda, it.need);
          const have = haveFor(sz.talla, it.prenda);
          const haveExact = haveExactFor(sz.talla, it.prenda);
          const faltan = Math.max(0, need - have);
          if (faltan <= 0) return;
          totalFaltan += faltan;
          const adjust = async (d) => { await TripDetail._wardrobeAdjust(t, sz.talla, it.prenda, d, cat); await renderBody(); };
          rows.push(el('div', { class:'wr-check-row' }, [
            el('div', { class:'wr-check-info' }, [
              el('div', { class:'wr-check-name' }, [ el('span', { text: TripDetail._wardrobeIcon(it.prenda) }), ' ' + it.prenda ]),
              el('div', { class:'wr-check-sub muted', text: (it.nota ? it.nota + ' · ' : '') + `tienes ${have}` }),
            ]),
            editable
              ? el('div', { class:'wr-check-step' }, [
                  el('button', { class:'wr-step-btn', type:'button', 'aria-label':'Quitar', disabled: haveExact <= 0 ? true : null, onclick: () => adjust(-1) }, '−'),
                  el('span', { class:'wr-shop-buy mono', text: `faltan ${faltan}` }),
                  el('button', { class:'wr-step-btn', type:'button', 'aria-label':'Comprado', onclick: () => adjust(1) }, '+'),
                ])
              : el('div', { class:'wr-shop-buy mono', text: `faltan ${faltan}` }),
          ]));
        });
        if (rows.length) groups.push(el('div', { class:'wr-check-grp' }, [ el('div', { class:'wr-check-h' }, [ el('span', { class:'wr-check-talla', text: sz.talla }), el('span', { class:'muted', text: sz.meses }) ]), ...rows ]));
      });
      body.appendChild(el('div', { class:'wr-shop-sum', text: totalFaltan ? `Faltan ${totalFaltan} prendas por comprar` : '¡Todo comprado! 🎉' }));
      groups.forEach(g => body.appendChild(g));
    };
    await renderBody();
    UI.openSheet({ title:'Comprar en España', body, footer:[ el('button', { class:'btn btn-primary', onclick: () => { UI.closeSheet(); Router.renderKeepScroll(); } }, 'Listo') ] });
  },

  // Asistente a pantalla completa: prenda → tipo → talla → confirmar (verde).
  // Cada paso es una pantalla con transición de deslizamiento y botón de volver/descartar.
  async openWardrobeFlow(t, existing = null) {
    if (!canEdit()) { UI.toast('Modo lector — no puedes modificar'); return; }
    TripDetail._wardrobeInjectStyles();
    const cat = await TripDetail._wardrobeCatalog(t);
    const sel = existing
      ? { prenda: existing.prenda, tipo: existing.tipo, talla: existing.talla }
      : { prenda: null, tipo: null, talla: null };
    let qty = existing ? (Number(existing.qty) || 1) : 1;
    const save = () => TripDetail._wardrobeSaveCatalog(cat);
    // Guardar el scroll de la pestaña ANTES de bloquear el body, para restaurarlo
    // al cerrar y evitar el salto al inicio de la pantalla del viaje.
    const returnScroll = (document.scrollingElement || document.documentElement).scrollTop || 0;

    const overlay = el('div', { class:'wrf-overlay', role:'dialog', 'aria-modal':'true', 'aria-label':'Añadir prenda' });
    document.body.appendChild(overlay);
    const prevOverflow = document.body.style.overflow;
    document.body.style.overflow = 'hidden';
    const close = () => { document.removeEventListener('keydown', onKey); document.body.style.overflow = prevOverflow; overlay.remove(); };
    // Cierra, re-renderiza la pestaña y restaura el scroll donde estaba.
    const finishAndClose = async () => {
      close();
      await Router.render();
      const s = document.scrollingElement || document.documentElement;
      if (s) { s.scrollTop = returnScroll; requestAnimationFrame(() => { s.scrollTop = returnScroll; }); }
    };
    const onKey = (e) => { if (e.key === 'Escape') back(); };
    document.addEventListener('keydown', onKey);

    let stack = existing ? ['prenda', 'tipo', 'talla', 'confirm'] : ['prenda'];
    const show = (name, dir) => {
      overlay.innerHTML = '';
      const scr = buildScreen(name);
      scr.classList.add(dir === 'back' ? 'in-left' : 'in-right');
      overlay.appendChild(scr);
    };
    const go = (name) => { stack.push(name); show(name, 'fwd'); };
    const back = () => { stack.pop(); if (!stack.length) { close(); return; } show(stack[stack.length - 1], 'back'); };

    const topBar = (stepIdx) => {
      const hasBack = stack.length > 1;
      const left = el('button', { class:'icon-btn', title: hasBack ? 'Volver' : 'Descartar',
        'aria-label': hasBack ? 'Volver' : 'Descartar', html: svg(hasBack ? 'back' : 'close'), onclick: back });
      const kids = [left, el('div', { class:'spacer' })];
      if (stepIdx < 3) {
        kids.push(el('div', { class:'wrf-prog' }, [0,1,2].map(i => el('span', { class:'wrf-pdot' + (i <= stepIdx ? ' on' : '') }))));
        kids.push(el('div', { class:'spacer' }));
      }
      // Descartar siempre accesible cuando hay historial (en el 1er paso, "volver" ya descarta).
      kids.push(hasBack ? el('button', { class:'icon-btn', title:'Descartar', 'aria-label':'Descartar', html: svg('close'), onclick: close }) : el('div', { class:'spacer' }));
      return el('div', { class:'wrf-top' }, kids);
    };

    const crumbs = (keys) => el('div', { class:'wrf-crumbs' }, keys.flatMap((k, i) => {
      const txt = k === 'prenda' ? `${TripDetail._wardrobeIcon(sel.prenda)} ${sel.prenda}` : (k === 'tipo' ? sel.tipo : sel.talla);
      const chip = el('span', { class:'wrf-crumb', text: txt });
      return i < keys.length - 1 ? [chip, el('span', { class:'wrf-crumb-sep', text:'›' })] : [chip];
    }));

    const addZone = (kind) => {
      const labels = { prenda:'Añadir prenda nueva', tipo:'Añadir tipo nuevo', talla:'Añadir talla nueva' };
      const wrap = el('div', { class:'wrf-add' });
      const btn = el('button', { class:'wrf-add-btn', text: '＋ ' + labels[kind] });
      btn.onclick = () => {
        const input = el('input', { type:'text', placeholder:'Nuevo…', maxlength:'30' });
        const commit = async () => {
          const v = input.value.trim(); if (!v) return;
          if (kind === 'prenda') {
            if (cat.prendas.includes(v)) { UI.toast('Esa prenda ya existe'); return; }
            cat.prendas.push(v); if (!cat.tipos[v]) cat.tipos[v] = []; await save();
            sel.prenda = v; sel.tipo = null; sel.talla = null; go('tipo');
          } else if (kind === 'tipo') {
            const l = cat.tipos[sel.prenda] || (cat.tipos[sel.prenda] = []);
            if (l.includes(v)) { UI.toast('Ese tipo ya existe'); return; }
            l.push(v); await save(); sel.tipo = v; sel.talla = null; go('talla');
          } else {
            if (cat.tallas.includes(v)) { UI.toast('Esa talla ya existe'); return; }
            cat.tallas.push(v); await save(); sel.talla = v; go('confirm');
          }
        };
        input.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); commit(); } });
        btn.replaceWith(el('div', { class:'wrf-add-form' }, [ input, el('button', { class:'btn btn-primary', onclick: commit }, 'Añadir') ]));
        setTimeout(() => input.focus(), 30);
      };
      wrap.appendChild(btn);
      return wrap;
    };

    function buildScreen(name) {
      if (name === 'prenda') {
        const body = el('div', { class:'wrf-body' }, [
          el('h2', { class:'wrf-q', text:'¿Qué prenda?' }),
          el('p', { class:'wrf-hint', text:'Elige una para registrarla' }),
        ]);
        const list = el('div', { class:'wrf-list' });
        cat.prendas.forEach(p => list.appendChild(el('button', { class:'wrf-row', onclick: () => {
          if (sel.prenda !== p) { sel.prenda = p; if (!(cat.tipos[p] || []).includes(sel.tipo)) sel.tipo = null; sel.talla = null; }
          go('tipo');
        } }, [
          el('span', { class:'wrf-row-ico', text: TripDetail._wardrobeIcon(p) }),
          el('span', { class:'wrf-row-label', text: p }),
          el('span', { class:'wrf-row-chev', text:'›' }),
        ])));
        body.appendChild(list);
        body.appendChild(addZone('prenda'));
        return el('section', { class:'wrf-screen' }, [ topBar(0), body ]);
      }
      if (name === 'tipo') {
        const body = el('div', { class:'wrf-body' }, [
          crumbs(['prenda']),
          el('h2', { class:'wrf-q', text:'¿Qué tipo?' }),
          el('p', { class:'wrf-hint', text:'Variante de la prenda' }),
        ]);
        const grid = el('div', { class:'wrf-grid' });
        (cat.tipos[sel.prenda] || []).forEach(ti => grid.appendChild(
          el('button', { class:'wrf-opt', onclick: () => { sel.tipo = ti; sel.talla = null; go('talla'); } }, ti)));
        body.appendChild(grid);
        body.appendChild(addZone('tipo'));
        return el('section', { class:'wrf-screen' }, [ topBar(1), body ]);
      }
      if (name === 'talla') {
        const body = el('div', { class:'wrf-body' }, [
          crumbs(['prenda','tipo']),
          el('h2', { class:'wrf-q', text:'¿Qué talla?' }),
          el('p', { class:'wrf-hint', text:'Tamaño según la edad del bebé' }),
        ]);
        const grid = el('div', { class:'wrf-grid' });
        cat.tallas.forEach(ta => grid.appendChild(
          el('button', { class:'wrf-opt mono', onclick: () => { sel.talla = ta; go('confirm'); } }, ta)));
        body.appendChild(grid);
        body.appendChild(addZone('talla'));
        return el('section', { class:'wrf-screen' }, [ topBar(2), body ]);
      }
      // confirm (verde)
      const qval = el('span', { class:'wrf-cqval', text: String(qty) });
      const body = el('div', { class:'wrf-body wrf-confirm' }, [
        el('div', { class:'wrf-c-ico', text: TripDetail._wardrobeIcon(sel.prenda) }),
        el('div', { class:'wrf-c-prenda', text: sel.prenda }),
        el('div', { class:'wrf-c-pills' }, [
          el('span', { class:'wrf-c-pill', text: sel.tipo }),
          el('span', { class:'wrf-c-pill mono', text: sel.talla }),
        ]),
        el('div', { class:'wrf-c-qlabel', text: existing ? 'Cantidad' : 'Cantidad a añadir' }),
        el('div', { class:'wrf-cstepper' }, [
          el('button', { class:'wrf-cstep', 'aria-label':'Restar', onclick: () => { qty = Math.max(1, qty - 1); qval.textContent = String(qty); } }, '−'),
          qval,
          el('button', { class:'wrf-cstep', 'aria-label':'Sumar', onclick: () => { qty = Math.min(99, qty + 1); qval.textContent = String(qty); } }, '+'),
        ]),
        el('button', { class:'wrf-confirm-btn', onclick: async () => {
          await TripDetail._wardrobeCommit(t, existing, sel, qty);
          await finishAndClose();
        } }, existing ? '✓ Guardar cambios' : '✓ Confirmar y añadir'),
        existing ? el('button', { class:'wrf-c-del', onclick: async () => {
          if (!confirm(`¿Eliminar ${existing.prenda} · ${existing.tipo} · ${existing.talla}?`)) return;
          await DB.remove('wardrobe_items', existing.id); await finishAndClose(); UI.toast('Prenda eliminada');
        } }, 'Eliminar prenda') : null,
      ].filter(Boolean));
      return el('section', { class:'wrf-screen confirm' }, [ topBar(3), body ]);
    }

    show(stack[stack.length - 1], 'fwd');
  },

  async _wardrobeCommit(t, existing, sel, qty) {
    const items = await DB.listByTrip('wardrobe_items', t.id);
    if (existing) {
      const dup = items.find(i => i.id !== existing.id && i.prenda === sel.prenda && i.tipo === sel.tipo && i.talla === sel.talla);
      if (dup) {
        dup.qty = (Number(dup.qty) || 0) + (Number(qty) || 1);
        await DB.put('wardrobe_items', dup);
        await DB.remove('wardrobe_items', existing.id);
        UI.toast(`Combinado (${dup.qty} uds.)`);
      } else {
        existing.prenda = sel.prenda; existing.tipo = sel.tipo; existing.talla = sel.talla; existing.qty = Number(qty) || 1;
        await DB.put('wardrobe_items', existing);
        UI.toast('Cambios guardados');
      }
    } else {
      const dup = items.find(i => i.prenda === sel.prenda && i.tipo === sel.tipo && i.talla === sel.talla);
      if (dup) { dup.qty = (Number(dup.qty) || 0) + (Number(qty) || 1); await DB.put('wardrobe_items', dup); }
      else { await DB.put('wardrobe_items', { id: uuid(), trip_id: t.id, prenda: sel.prenda, tipo: sel.tipo, talla: sel.talla, qty: Number(qty) || 1 }); }
      UI.toast(`${qty} · ${sel.prenda} añadido`);
    }
  },

  _wardrobeExportCSV(items) {
    if (!items.length) { UI.toast('El armario está vacío'); return; }
    const rows = [['Prenda','Tipo','Talla','Cantidad'], ...items.map(i => [i.prenda, i.tipo, i.talla, i.qty])];
    const csv = rows.map(r => r.map(v => `"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n');
    const a = el('a', { href: 'data:text/csv;charset=utf-8,' + encodeURIComponent('﻿' + csv), download: `armario-pablo-${nowIso().slice(0,10)}.csv` });
    document.body.appendChild(a); a.click(); a.remove();
    UI.toast('CSV descargado');
  },

  /* ----- Resumen ----- */
  async tabResumen(root, t) {
    clearInterval(TripDetail._neTimer);   // parar cuenta atrás de un render anterior
    if (STATE.dayLeaflet) { try { STATE.dayLeaflet.remove(); } catch (_) {} STATE.dayLeaflet = null; }
    const planning = await DB.listByTrip('planning_items', t.id);
    const budget   = await DB.listByTrip('budget_items', t.id);
    const packing  = await DB.listByTrip('packing_items', t.id);

    const totalEur  = budget.reduce((a,b) => a + (Number(b.amount_eur) || (Number(b.amount)||0) * (Number(b.rate_to_eur)||1)), 0);
    const paidEur   = budget.filter(b => b.status === 'pagado').reduce((a,b) => a + (Number(b.amount_eur) || 0), 0);
    const packDone  = packing.filter(p => p.checked).length;

    // Próximo evento (con hora) aún por venir. Se resalta su TARJETA en el "Planning del
    // día" (abajo); si esa tarjeta no está visible, se pinta una barra "Próximo".
    const nextEv = nextTimedEvent(planning);
    let nextShown = false;
    const canNotify = nextEv && ('Notification' in window) && Notification.permission !== 'granted' && canEdit();
    const _neBell = () => canNotify ? el('button', { class:'ne-bell', title:'Activar avisos', 'aria-label':'Activar avisos',
      onclick: async (e) => {
        e.stopPropagation();
        try { const p = await Notification.requestPermission(); if (p === 'granted') { Notifications.scheduleAll(); UI.toast('Avisos activados'); Router.render(); } else UI.toast('Permiso de notificaciones denegado'); }
        catch (_) { UI.toast('No se pudieron activar'); }
      } }, el('span', { html: svg('bell') })) : null;
    const _startNeTimer = () => {
      if (!nextEv || !nextEv._ts) return;   // evento sin hora → texto estático ("hoy"), sin cuenta atrás
      TripDetail._neTimer = setInterval(() => {
        const span = document.getElementById('ne-count');
        if (!span) { clearInterval(TripDetail._neTimer); return; }
        const rem = nextEv._ts - Date.now();
        span.textContent = fmtCountdown(rem);
        if (rem <= 0) { clearInterval(TripDetail._neTimer); setTimeout(() => { if (STATE.currentTab === 'resumen' && STATE.view === 'trip') Router.render(); }, 1500); }
      }, 1000);
    };

    // Pendientes: items manuales (t.pending_items) + eventos en consulta/por iniciar.
    const pendManual = Array.isArray(t.pending_items) ? t.pending_items : [];
    const pendAuto = planning.filter(p => ['en_consulta','por_iniciar'].includes(itemStatus(p)));
    const pendDone = pendManual.filter(p => p.done).length;
    const pendTotal = pendManual.length + pendAuto.length;
    // ¿Hay algún pendiente (manual o evento) con fecha ya pasada? → aviso ⚠️.
    const _todayP = todayIso();
    const pendOverdue =
      pendManual.some(p => !p.done && p.date && p.date < _todayP) ||
      pendAuto.some(p => { const d = p.day_date || p.consultation_planned_d1 || ''; return d && d < _todayP; });

    const goTab = (id) => () => { STATE.currentTab = id; Router.render(); };
    // Rejilla de métricas — ahora clicables. "Planning" pasa a "Pendientes".
    const metricCells = [
      el('button', { class:'metric metric-btn', onclick: goTab('planning') }, [
        el('div', { class:'label', text:'Días' }),
        el('div', { class:'value', text: t.start_date && t.end_date ? (daysBetween(t.start_date, t.end_date)+1) : '—' }),
        el('div', { class:'sub', text: statusDays(t) }),
      ]),
      el('button', { class:'metric metric-btn', onclick: goTab('pendientes') }, [
        el('div', { class:'label', text:'Pendientes' }),
        el('div', { class:'value' }, [ pendOverdue ? el('span', { title:'Hay pendientes con fecha pasada', text:'⚠️ ' }) : null, el('span', { text:`${pendDone}/${pendTotal}` }) ].filter(Boolean)),
        el('div', { class:'sub', text: pendOverdue ? 'con fecha pasada' : (pendTotal ? 'completadas' : 'sin pendientes') }),
      ]),
      canSeeMoney() ? el('button', { class:'metric metric-btn', onclick: goTab('presu') }, [
        el('div', { class:'label', text:'Presupuesto' }),
        el('div', { class:'value', text: fmtMoney(totalEur, 'EUR') }),
        el('div', { class:'sub', text:`Pagado ${fmtMoney(paidEur,'EUR')}` }),
      ]) : null,
      el('button', { class:'metric metric-btn', onclick: goTab('maleta') }, [
        el('div', { class:'label', text:'Maleta' }),
        el('div', { class:'value', text: `${packDone}/${packing.length}` }),
        el('div', { class:'sub', text: packing.length ? 'preparados' : 'sin lista' }),
      ]),
    ].filter(Boolean);
    const metricGridEl = el('div', { class:'metric-grid' }, metricCells);

    const today = todayIso();
    const inProgress = !!(t.start_date && t.end_date && t.start_date <= today && t.end_date >= today);

    // Cuando el viaje NO está en curso, las métricas van arriba (comportamiento normal).
    if (!inProgress) root.appendChild(metricGridEl);

    // Render de "Reservas de hoy" (definido aquí; se inserta DEBAJO del planning del día).
    const renderReservasHoy = () => {
      const todayResv = TripDetail._expandHotels(planning)
        .filter(i => (i.day_date || '') === today && ['vuelo','hotel','transporte','actividad'].includes(i.type))
        .sort(planningCompare);
      if (!todayResv.length) return;
      root.appendChild(el('h2', { class:'section-title', text:'Reservas de hoy' }));
      const grid = el('div', { class:'resv-grid' });
      todayResv.forEach(it => {
        const s = TripDetail._reservationSummary(it);
        if (!s) return;
        const status = itemStatus(it);
        const actions = [];
        if (s.resvUrl && canSeeLinks()) {
          actions.push(el('a', { class:'resv-btn', href: s.resvUrl, target:'_blank', rel:'noopener',
            title:'Abrir la reserva', onclick: (e) => e.stopPropagation() },
            [ el('span', { html: svg('link') }), 'Reserva' ]));
        }
        if (s.mapsUrl) {
          actions.push(el('a', { class:'resv-btn', href: s.mapsUrl, target:'_blank', rel:'noopener',
            title:'Cómo llegar a pie', onclick: (e) => e.stopPropagation() },
            [ el('span', { html: svg('map') }), 'Cómo llegar' ]));
        }
        grid.appendChild(el('div', {
          class:'metric resv-metric' + (status ? ` status-${status}` : ''),
          role:'button', tabindex:'0',
          onclick: () => TripDetail.openPlanningEditor(t, it),
        }, [
          el('div', { class:'label' }, [ el('span', { class:'resv-emoji', text: s.emoji }), s.label ]),
          el('div', { class:'value', text: s.value }),
          s.sub ? el('div', { class:'sub', text: s.sub }) : null,
          actions.length ? el('div', { class:'resv-actions' }, actions) : null,
        ].filter(Boolean)));
      });
      root.appendChild(grid);
    };

    // Planning de Hoy / Mañana — solo si el viaje está EN CURSO (hoy dentro del rango).
    if (inProgress) {
      const tomorrow = (() => { const d = parseDate(today); d.setDate(d.getDate() + 1); return isoLocal(d); })();
      const view = TripDetail._resumenDayView === 'manana' ? 'manana' : 'hoy';
      const targetDate = view === 'manana' ? tomorrow : today;

      const dayItems = TripDetail._expandHotels(planning)
        .filter(i => (i.day_date || '') === targetDate)
        .sort(planningCompare);

      // Mapa planning_item_id → budget, para mostrar importes en las paradas.
      this._budgetByPlanningId = {};
      for (const b of budget) { if (b.planning_item_id) this._budgetByPlanningId[b.planning_item_id] = b; }

      root.appendChild(el('div', { class:'resumen-day-head' }, [
        el('h2', { class:'section-title', style:{margin:'0'}, text:'Planning del día' }),
        el('div', { class:'segmented resumen-day-seg' }, [
          el('button', {
            class: view === 'hoy' ? 'active' : '',
            onclick: () => { TripDetail._resumenDayView = 'hoy'; Router.render(); },
          }, 'Hoy'),
          el('button', {
            class: view === 'manana' ? 'active' : '',
            onclick: () => { TripDetail._resumenDayView = 'manana'; Router.render(); },
          }, 'Mañana'),
        ]),
      ]));
      root.appendChild(el('div', { class:'resumen-day-date' }, [
        el('span', { text: fmtDayLong(targetDate) }),
        el('span', { class:'wx-chip', id:'wx-day-chip' }),
      ]));
      // Clima del día seleccionado, según dónde se duerme esa noche (hotel del día).
      const nightMap = nightCoordsMap(planning);
      const ownC = dayItems.find(i => i.lat != null && i.lng != null);
      const wxCoords = nightMap[targetDate] || (ownC ? { lat: ownC.lat, lng: ownC.lng } : null) || tripCoords(planning);
      if (wxCoords) {
        Weather.forCoords(wxCoords.lat, wxCoords.lng).then(daily => {
          const txt = Weather.chipText(daily[targetDate]);
          const span = document.getElementById('wx-day-chip');
          if (span && txt) span.textContent = txt;
        }).catch(() => {});
      }

      if (dayItems.length) {
        const list = el('div', { class:'list timeline-list' });
        dayItems.forEach(it => {
          const card = TripDetail._planningItem(it, t);
          // Resaltar en azul la tarjeta del PRÓXIMO evento (con cuenta atrás), en vez de una barra aparte.
          if (nextEv && !nextShown && !it._virtual && it.id === nextEv.id && (it.day_date || '') === (nextEv.day_date || '') && (it.time || '') === (nextEv.time || '')) {
            nextShown = true;
            card.classList.add('is-next');
            card.appendChild(el('div', { class:'card-next' }, [
              el('span', { class:'card-next-tag', text:'Próximo' }),
              el('span', { class:'ne-count', id:'ne-count', text: nextEventText(nextEv) }),
              _neBell(),
            ].filter(Boolean)));
          }
          list.appendChild(card);
        });
        if (nextShown) _startNeTimer();
        root.appendChild(list);
        // Mapa del día: paradas con coordenadas, numeradas en orden + ruta a pie.
        const mapPts = dayItems.filter(i => i.lat != null && i.lng != null);
        if (mapPts.length) {
          root.appendChild(el('div', { class:'day-map', id:'day-map-container' }));
          TripDetail._renderDayMap('day-map-container', dayItems);
        }
      } else {
        root.appendChild(el('div', { class:'resumen-day-empty', text: view === 'manana'
          ? 'No hay nada planificado para mañana.'
          : 'No hay nada planificado para hoy.' }));
      }
    }

    // Barra "Próximo" — solo si su tarjeta NO está ya resaltada en el planning de arriba
    // (evita el duplicado). Para viajes futuros o vista "Mañana".
    if (nextEv && !nextShown) {
      const _td = typeDef(nextEv.type);
      const _s = TripDetail._reservationSummary(nextEv) || { emoji: _td.emoji, label: _td.label, value: nextEv.title };
      root.appendChild(el('div', { class:'next-event', id:'next-event-bar', title:'Abrir esta parada', onclick: () => TripDetail.openPlanningEditor(t, nextEv) }, [
        el('span', { class:'ne-emoji', 'aria-hidden':'true', text: _s.emoji || '📌' }),
        el('div', { class:'ne-main' }, [ el('span', { class:'ne-tag', text:'Próximo' }), el('span', { class:'ne-title', text: `${_s.label}${_s.value ? ' · ' + _s.value : ''}` }) ]),
        el('span', { class:'ne-count', id:'ne-count', text: nextEventText(nextEv) }),
        _neBell(),
      ].filter(Boolean)));
      _startNeTimer();
    }

    // Reservas de hoy — debajo del planning del día.
    renderReservasHoy();

    // Viaje en curso: el resumen de métricas es menos necesario → va al final,
    // precedido de su propio título para separarlo de las reservas/planning del día.
    if (inProgress) {
      root.appendChild(el('h2', { class:'section-title', text:'Resumen del viaje' }));
      root.appendChild(metricGridEl);
    }

    // Notas
    if (t.notes) {
      root.appendChild(el('h2', { class:'section-title', text:'Notas' }));
      root.appendChild(el('div', { class:'card' }, el('div', { class:'card-body', text: t.notes, style:{whiteSpace:'pre-wrap'} })));
    }

  },

  // Expande hoteles con rango (check-in ≠ check-out) en noches + check-out virtuales.
  // Devuelve la lista de items lista para agrupar por day_date (sin ordenar).
  _expandHotels(rawItems) {
    const items = [];
    for (const it of rawItems) {
      const d1 = it.consultation_planned_d1;
      const d2 = it.consultation_planned_d2;
      if (it.type === 'hotel' && d1 && d2 && d1 < d2) {
        let d = parseDate(d1);
        const end = parseDate(d2);
        while (d < end) {
          const k = isoLocal(d);
          items.push({ ...it, _virtual:'night', _isFirstNight:(k === d1), day_date:k, time:null });
          d.setDate(d.getDate() + 1);
        }
        items.push({ ...it, _virtual:'checkout', day_date:d2, time: it.consultation_planned_t2 || null });
      } else if ((it.type === 'vuelo' || it.type === 'transporte') && d1 && d2 && d2 > d1) {
        // Vuelo/transporte que llega otro día: la salida queda en su día y añadimos
        // una "llegada" virtual el día de llegada con su hora.
        items.push(it);
        items.push({ ...it, _virtual:'arrival', day_date:d2, time: it.consultation_planned_t2 || null });
      } else if (isSpanType(it.type) && it.metadata && it.metadata.end_date && it.day_date && it.metadata.end_date > it.day_date) {
        // Evento de varios días: el día de inicio es el real (editable) y los días
        // siguientes hasta el fin son copias virtuales 'span' (el mismo evento repetido).
        const ds = it.day_date, de = it.metadata.end_date;
        items.push({ ...it, _spanStart: ds, _spanEnd: de });
        let d = parseDate(ds); d.setDate(d.getDate() + 1);
        const end = parseDate(de);
        while (d <= end) {
          const k = isoLocal(d);
          items.push({ ...it, _virtual:'span', day_date:k, time:null, _spanStart: ds, _spanEnd: de, _spanTime: it.time });
          d.setDate(d.getDate() + 1);
        }
      } else {
        items.push(it);
      }
    }
    return items;
  },

  // Resumen compacto de una reserva (vuelo/hotel/transporte) para las pills del resumen.
  // Devuelve { label, emoji, text } o null si el tipo no aplica.
  // Devuelve { label, emoji, value, sub } para la pill del resumen.
  //   label = tipo / franja de comida   ·   value = dato principal (ruta o nombre)
  //   sub   = detalles (hora · nº · asientos…)
  _reservationSummary(it) {
    const md = it.metadata || {};
    const code   = s => (s || '').split('·')[0].trim();              // "MAD · Madrid" → "MAD"
    const tzCity = tz => tz ? tz.split('/').pop().replace(/_/g, ' ') : '';
    const seats  = Array.isArray(md.asientos)
      ? md.asientos.map(s => s.asiento || s.nombre).filter(Boolean).join(' - ')
      : (md.asiento || '');
    const time = it.time ? it.time + 'h' : '';
    const ppl = (Array.isArray(it.people) && it.people.length) ? ('Con ' + fmtList(it.people)) : '';
    const resvUrl = (md.url || '').trim() || null;       // enlace de la reserva (si existe)
    const walkUrl = gmapsWalkUrl(it.lat, it.lng, it.address);  // null si no hay dirección/coords

    if (it.type === 'hotel') {
      const sub = [
        it.consultation_planned_t1 ? 'Check-in ' + it.consultation_planned_t1 : '',
        md.habitacion || '',
        md.localizador ? 'Loc. ' + md.localizador : '',
        ppl,
      ].filter(Boolean).join(' · ');
      return { label:'Alojamiento', emoji:'🏨', value: it.place_name || it.title || 'Hotel', sub, resvUrl, mapsUrl: walkUrl };
    }
    if (it.type === 'vuelo') {
      const ori  = code(md.origen)  || tzCity(it.origin_tz);
      const dest = code(md.destino) || tzCity(it.dest_tz);
      const route = (ori && dest) ? `${ori} - ${dest}` : (dest || ori || it.title || 'Vuelo');
      const sub = [ time, md.numero || '', md.aerolinea || '', seats ? 'Asientos ' + seats : '', ppl ]
        .filter(Boolean).join(' · ');
      return { label:'Vuelo', emoji:'✈️', value: route, sub, resvUrl, mapsUrl: null };
    }
    if (it.type === 'transporte') {
      const ori = code(md.origen), dest = code(md.destino);
      const route = (ori && dest) ? `${ori} - ${dest}` : (it.title || 'Transporte');
      const sub = [ time, md.numero || '', md.vagon ? 'Coche ' + md.vagon : '', seats ? 'Asientos ' + seats : '', ppl ]
        .filter(Boolean).join(' · ');
      return { label:'Transporte', emoji: planEmoji(it), value: route, sub, resvUrl, mapsUrl: null };
    }
    if (it.type === 'actividad') {
      const sub = [ time, md.organizador || '', md.duracion || '', ppl ].filter(Boolean).join(' · ');
      return { label:'Actividad', emoji:'🎫', value: it.place_name || it.title || 'Actividad', sub, resvUrl: null, mapsUrl: null };
    }
    if (it.type === 'comida') {
      let meal = mealLabel(it.time);
      if (meal === 'Restaurante') meal = 'Comida';   // sin hora → comida genérica, nunca "Restaurante"
      const name = it.place_name
        || (it.title && it.title.toLowerCase() !== 'comida' ? it.title : '')
        || 'Restaurante';
      return { label: meal, emoji:'🍽️', value: name, sub: [time, ppl].filter(Boolean).join(' · '), resvUrl: null, mapsUrl: walkUrl };
    }
    if (it.type === 'compras') {
      return { label:'Compras', emoji:'🛍️', value: it.place_name || it.title || 'Compras', sub: [time, ppl].filter(Boolean).join(' · '), resvUrl: null, mapsUrl: walkUrl };
    }
    return null;
  },

  // Mini-mapa del día: paradas con coordenadas, numeradas en orden + ruta (línea).
  // `items` ya viene ordenado cronológicamente.
  _renderDayMap(containerId, items) {
    const pts = items.filter(i => i.lat != null && i.lng != null);
    setTimeout(() => {
      if (STATE.dayLeaflet) { try { STATE.dayLeaflet.remove(); } catch (_) {} STATE.dayLeaflet = null; }
      const cont = document.getElementById(containerId);
      if (!cont || !pts.length || typeof L === 'undefined') return;
      const map = L.map(containerId, { scrollWheelZoom:false });
      L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom:19, attribution:'© OpenStreetMap' }).addTo(map);
      const latlngs = [];
      const markers = pts.map((p, i) => {
        const ll = [p.lat, p.lng];
        latlngs.push(ll);
        const icon = L.divIcon({ className:'day-map-pin', html:`<span>${i + 1}</span>`, iconSize:[26,26], iconAnchor:[13,13] });
        const m = L.marker(ll, { icon });
        const s = TripDetail._reservationSummary(p);
        const name = (s && s.value) || p.place_name || p.title || '';
        const gm = gmapsWalkUrl(p.lat, p.lng, p.address) || gmapsUrl(p.lat, p.lng);
        m.bindPopup(`<b>${i + 1}. ${escHtml(name)}</b>${p.time ? '<br>' + escHtml(p.time) : ''}${gm ? `<br><a href="${gm}" target="_blank" rel="noopener">Cómo llegar a pie</a>` : ''}`);
        return m;
      });
      const group = L.featureGroup(markers).addTo(map);
      if (latlngs.length > 1) {
        L.polyline(latlngs, { color:'#2563eb', weight:3, opacity:.65, dashArray:'6 7' }).addTo(map);
      }
      try { map.fitBounds(group.getBounds().pad(0.25)); } catch (_) { map.setView(latlngs[0], 14); }
      STATE.dayLeaflet = map;
    }, 60);
  },

  // Optimiza el orden de las paradas de un día por cercanía (vecino más cercano) y
  // reasigna sus horas en secuencia (visita 60 min + tiempo de viaje estimado).
  async _optimizeDay(t, dayKey, items) {
    if (!canEdit()) { UI.toast('Modo lector — no puedes modificar'); return; }
    const MOV = ['lugar','playa','comida','actividad','personas','compras','otro','gestion'];
    const movable = items.filter(i => i.lat != null && i.lng != null && !i._virtual && MOV.includes(i.type));
    if (movable.length < 3) { UI.toast('Necesitas al menos 3 paradas con ubicación'); return; }
    const dist = (arr) => { let d = 0; for (let i = 1; i < arr.length; i++) d += haversineKm(arr[i-1], arr[i]); return d; };
    const curKm = dist(movable);
    const pool = movable.slice(); const opt = [pool.shift()];
    while (pool.length) {
      const last = opt[opt.length - 1];
      let bi = 0, bd = Infinity;
      pool.forEach((p, i) => { const d = haversineKm(last, p); if (d < bd) { bd = d; bi = i; } });
      opt.push(pool.splice(bi, 1)[0]);
    }
    const optKm = dist(opt);
    if (opt.every((p, i) => p.id === movable[i].id) || optKm >= curKm - 0.05) { UI.toast('El orden ya es prácticamente óptimo'); return; }
    const ok = await UI.confirm(`Reordenar las ${movable.length} paradas del día por cercanía (de ${fmtKm(curKm)} a ${fmtKm(optKm)}) y reajustar sus horas en secuencia. ¿Continuar?`, 'Sí, optimizar');
    if (!ok) return;
    const times = movable.map(m => m.time).filter(Boolean).sort();
    let cur = times.length ? (parseInt(times[0].slice(0,2),10) * 60 + parseInt(times[0].slice(3,5),10)) : 9 * 60;
    const toHHMM = (m) => { m = (Math.round(m / 5) * 5) % 1440; return String(Math.floor(m/60)).padStart(2,'0') + ':' + String(m%60).padStart(2,'0'); };
    for (let i = 0; i < opt.length; i++) {
      const p = opt[i];
      p.time = toHHMM(cur); p.order_index = i;
      try { await DB.put('planning_items', p); } catch (_) {}
      if (i < opt.length - 1) cur += 60 + legBetween(p, opt[i+1]).min;
    }
    UI.toast('Día optimizado');
    Router.render();
  },

  // Controlador de la ruta de un día: agrupa sus tramos, pinta el resumen y el aviso
  // de "quizá no dé tiempo", y lanza el recálculo online en lote.
  _dayRoute(t, dayKey) {
    const legs = [];
    const summaryEl = el('span', { class:'day-route-summary' });
    let warnEl = null, dayArrRef = null, listRef = null, ready = false;
    const self = {
      addLeg(leg) { legs.push(leg); return leg; },
      recompute() {
        if (!ready) return;
        const travelMin = legs.reduce((s, l) => s + (l.val ? l.val.min : 0), 0);
        const travelKm  = legs.reduce((s, l) => s + (l.val ? l.val.km : 0), 0);
        const realStops = dayArrRef.filter(i => !i._virtual);
        // Resumen de ruta del día.
        if (legs.length) {
          summaryEl.style.display = '';
          summaryEl.textContent = `🚗 ${fmtDur(travelMin)} · ${fmtKm(travelKm)}`;
        } else { summaryEl.style.display = 'none'; }
        // ¿Cabe el día? Ventana = desde la primera hora asignada (o 9:00) hasta las 23:00.
        const times = realStops.map(i => i.time).filter(Boolean).map(s => parseInt(s.slice(0,2),10) * 60 + parseInt(s.slice(3,5),10));
        const startMin = times.length ? Math.min(...times) : 9 * 60;
        const available = 23 * 60 - startMin;
        const needed = realStops.reduce((s, i) => s + visitMinutes(i), 0) + travelMin;
        const sig = daySig(dayArrRef);
        const ackd = (tripSettings(t).day_fit_ok || {})[dayKey] === sig;
        const shouldWarn = legs.length > 0 && (needed - available) > 45 && !ackd;
        const msg = `Quizá no dé tiempo: ~${fmtDur(needed)} entre visitas y trayectos para una jornada de ~${fmtDur(available)}.`;
        if (shouldWarn && !warnEl) {
          warnEl = el('div', { class:'day-fit-warn' }, [
            el('span', { class:'dfw-ico', text:'⚠️' }),
            el('div', { class:'dfw-body' }, [
              el('div', { class:'dfw-msg', text: msg }),
              canEdit() ? el('button', { class:'btn btn-sm btn-ghost dfw-ok', onclick: () => {
                const s = tripSettingsMut(t); (s.day_fit_ok = s.day_fit_ok || {})[dayKey] = daySig(dayArrRef);
                try { DB.put('trips', t); } catch (_) {}
                if (warnEl) { warnEl.remove(); warnEl = null; }
              } }, [ el('span', { html: svg('check') }), el('span', { text:'Es correcto' }) ]) : null,
            ].filter(Boolean)),
          ]);
          listRef.parentNode.insertBefore(warnEl, listRef);
        } else if (!shouldWarn && warnEl) {
          warnEl.remove(); warnEl = null;
        } else if (shouldWarn && warnEl) {
          warnEl.querySelector('.dfw-msg').textContent = msg;
        }
      },
      finalize(dayArr, list, waypoints, token) {
        ready = true; dayArrRef = dayArr; listRef = list;
        // Mete el resumen de ruta en la fila meta del día (misma línea que clima/hotel)
        // para no crear otra fila. Si no hay (sin-fecha), va al principio de la lista.
        const _metaRow = list.closest('.day-group')?.querySelector('.day-meta-row');
        if (_metaRow) _metaRow.appendChild(summaryEl); else list.insertBefore(summaryEl, list.firstChild);
        self.recompute();
        if (waypoints.length >= 2 && legs.some(l => !l.online)) {
          legs.forEach(l => { if (!l.online) l.setPending(true); });
          enqueueDayRoute({ pts: waypoints, token, done: () => {
            legs.forEach(l => { l.setPending(false); l.applyFromCache(); });
            self.recompute();
          } });
        }
      },
    };
    return self;
  },

  // Chip de tiempo/distancia entre dos paradas. Muestra primero la estimación
  // offline (punto naranja) y, cuando hay caché o se recalcula online, la
  // distancia/tiempo REAL por carretera (punto verde, persistente). Los tramos
  // largos se muestran como "Trayecto" (informativo, sin alarma).
  _legChip(a, b, route, opts) {
    opts = opts || {};
    const hotelSide = opts.hotel || null;               // 'from' | 'to' | null
    const forceMode = (opts.forceMode && opts.forceMode !== 'auto') ? opts.forceMode : null;
    const isHotel = !!hotelSide;
    const off = legBetween(a, b);
    const key = routeKey(a, b);
    // Compatibilidad con caché antigua ({km,min,mode}); ahora guardamos {km,drivingMin}.
    const drivingOf = (c) => c.drivingMin != null ? c.drivingMin : (c.mode === 'car' ? c.min : Math.round((c.km || 0) / carSpeedKmh(c.km || 0) * 60));
    const info = el('span', { class:'leg-info' });
    const dot = el('span', { class:'leg-src' });
    const chip = el('a', { class:'leg-chip' + (isHotel ? ' leg-hotel' : ''), target:'_blank', rel:'noopener', title: isHotel ? 'Alojamiento' : 'Cómo llegar', onclick: (e) => e.stopPropagation() }, [ info, dot ]);
    const travel = (m) => m === 'walk' ? 'walking' : (m === 'bike' ? 'bicycling' : (m === 'transit' ? 'transit' : 'driving'));
    const leg = { key, val: null, online: false, _last: null };
    // Pide la ruta peatonal real si el tramo se muestra a pie y aún no la tenemos.
    const maybeFetchFoot = () => {
      if (!leg.val || leg.val.mode !== 'walk') return;
      const c = _routeCache[key];
      if (c && c.walkKm != null) return;
      leg.setPending(true);
      enqueueFoot({ a, b, key, apply: () => { if (leg._last) render(leg._last.km, leg._last.drivingMin); if (route) route.recompute(); } });
    };
    const render = (km, drivingMin) => {
      leg._last = { km, drivingMin };
      const c = _routeCache[key];
      const walk = (c && c.walkKm != null) ? { km: c.walkKm, min: c.walkMin } : null;
      // "auto" decide a pie/coche por la distancia EN LÍNEA RECTA (off), no por el
      // rodeo en coche (que infla trayectos urbanos cortos donde sí se va andando).
      const mode0 = forceMode || off.mode;
      // A pie: distancia/tiempo de la ruta peatonal real (o estimación por línea recta).
      // Resto: distancia por carretera. Se calcula sobre la km adecuada en cada caso.
      const v = (mode0 === 'walk') ? legView(off.km, drivingMin, 'walk', walk) : legView(km, drivingMin, mode0);
      const mode = v.mode, min = v.min, dispKm = v.km;
      // "Real" (verde) según el modo: a pie ⇒ ruta de pie; resto ⇒ ruta de coche.
      const online = (mode === 'walk') ? !!walk : !!(c && c.km != null);
      const long = dispKm >= 30 || min >= 50;
      chip.classList.toggle('leg-long', long);
      let txt = (long ? `${MODE_EMOJI[mode] || MODE_EMOJI.car} Trayecto · ~${fmtDur(min)} · ${fmtKm(dispKm)}` : `${MODE_EMOJI[mode] || MODE_EMOJI.car} ~${fmtDur(min)} · ${fmtKm(dispKm)}`);
      if (hotelSide === 'from') txt = '🏨 ' + txt;
      else if (hotelSide === 'to') txt = txt + ' 🏨';
      info.textContent = txt;
      dot.className = 'leg-src ' + (online ? 'online' : 'offline');
      dot.title = online ? (mode === 'walk' ? 'Ruta a pie real (en línea)' : 'Distancia real por carretera (en línea)') : 'Estimación aproximada';
      chip.href = `https://www.google.com/maps/dir/?api=1&origin=${a.lat},${a.lng}&destination=${b.lat},${b.lng}&travelmode=${travel(mode)}`;
      leg.val = { km: dispKm, min, mode }; leg.online = online;
    };
    leg.setPending = (on) => dot.classList.toggle('pending', on && !leg.online);
    leg.applyFromCache = () => { const c = _routeCache[key]; if (c && c.km != null) render(c.km, drivingOf(c)); maybeFetchFoot(); };
    const cached = _routeCache[key];
    if (cached && cached.km != null) render(cached.km, drivingOf(cached));
    else render(off.km, off.drivingMin);
    maybeFetchFoot();
    if (route) route.addLeg(leg);
    return chip;
  },

  _bookingSub(b) {
    const d = b.structured_data || {};
    if (b.type==='vuelo') return [d.aerolinea, d.numero, d.hora_salida].filter(Boolean).join(' · ');
    if (b.type==='hotel') return [d.checkin && `Check-in ${fmtDateShort(d.checkin)}`, d.checkout && `Check-out ${fmtDateShort(d.checkout)}`].filter(Boolean).join(' · ');
    if (b.type==='coche') return [d.recogida, d.devolucion].filter(Boolean).join(' → ');
    if (b.type==='seguro')return [d.compania, d.poliza].filter(Boolean).join(' · ');
    return '';
  },
