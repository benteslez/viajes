    // Sección "Papelera" para viajes existentes
    if (existing) {
      body.appendChild(el('div', { class:'divider' }));
      body.appendChild(el('div', { style:{display:'flex', gap:'8px', alignItems:'center', flexWrap:'wrap'} }, [
        el('div', { style:{flex:'1', minWidth:'150px'} }, [
          el('div', { style:{fontWeight:600, fontSize:'14px'}, text:'Papelera del viaje' }),
          el('div', { class:'muted', style:{fontSize:'13px'}, text:'Elementos eliminados que puedes recuperar o descartar.' }),
        ]),
        el('button', { class:'btn btn-sm', type:'button', onclick: (e) => { e.preventDefault(); Trips.openTrash(t); } }, [
          el('span', { html: svg('trash') }), 'Abrir papelera'
        ]),
      ]));
    }

    const delBtn = existing ? el('button', { class:'btn btn-danger', onclick: async () => {
      const ok = await UI.confirm('Esto borrará el viaje y todo su contenido (planning, presupuesto, etc.).');
      if (!ok) return;
      await Trips.deleteCascade(t.id);
      UI.toast('Viaje borrado');
      Router.go('trips');
    }}, 'Borrar') : null;

    const cancel = el('button', { class:'btn btn-ghost', onclick: () => UI.closeSheet() }, 'Cancelar');
    UI.openSheet({ title: existing ? 'Editar viaje' : 'Nuevo viaje', body, footer:[delBtn, cancel, save].filter(Boolean) });
  },

  // === Papelera ===
  // Lista todos los items soft-eliminados del viaje (deleted_at != null)
  // y permite restaurarlos o purgarlos definitivamente.
  async openTrash(t) {
    if (!canEdit()) { UI.toast('Modo lector'); return; }
    const TRASH_TABLES = [
      { key:'planning_items', label:'Paradas del planning' },
      { key:'budget_items',   label:'Gastos' },
      { key:'bookings',       label:'Reservas' },
      { key:'packing_items',  label:'Items de maleta' },
      { key:'day_notes',      label:'Notas del día' },
      { key:'shared_expenses',label:'Gastos compartidos' },
      { key:'diary',          label:'Entradas del diario' },
      { key:'emergency_contacts', label:'Contactos' },
      { key:'phrases',        label:'Frases' },
    ];
    const buckets = {};
    let total = 0;
    for (const tdef of TRASH_TABLES) {
      // getAllFromIndex(by_trip, tripId) NO devuelve los deleted_at-soft (por DB.listByTrip filter).
      // Aquí los queremos TODOS para mostrar la papelera.
      const all = await DB.db.getAllFromIndex(tdef.key, 'by_trip', t.id);
      const deleted = all.filter(r => r.deleted_at);
      if (deleted.length) {
        buckets[tdef.key] = { label: tdef.label, items: deleted };
        total += deleted.length;
      }
    }

    if (!total) {
      const body = el('div', { class:'empty', style:{padding:'24px'} }, [
        el('div', { class:'icon', html: svg('trash') }),
        el('h3', { text:'Papelera vacía' }),
        el('p', { text:'Aquí aparecerán los elementos que borres del viaje. Podrás recuperarlos durante 30 días o descartarlos para siempre.' }),
      ]);
      UI.openSheet({
        title:'Papelera del viaje', body,
        footer:[el('button', { class:'btn btn-ghost', onclick: () => Trips.openTripEditor(t) }, 'Volver')]
      });
      return;
    }

    const body = el('div', {});
    body.appendChild(el('p', { class:'muted', style:{marginTop:0}, text:`${total} elemento${total>1?'s':''} en la papelera. Restaura los que necesites o descártalos definitivamente.` }));

    for (const [key, b] of Object.entries(buckets)) {
      body.appendChild(el('h3', { class:'section-title', style:{fontSize:'15px', margin:'18px 0 8px'}, text: b.label }));
      const list = el('div', { class:'list' });
      for (const r of b.items) {
        const sub = r.deleted_at ? `Eliminado ${fmtDateShort(r.deleted_at.slice(0,10))}` : '';
        list.appendChild(el('div', { class:'list-item' }, [
          el('div', { class:'li-main' }, [
            el('div', { class:'li-title', text: Trips._labelForTrashItem(key, r) }),
            el('div', { class:'li-sub', text: sub }),
          ]),
          el('div', { class:'li-actions' }, [
            el('button', { class:'btn btn-sm', onclick: async () => {
              delete r.deleted_at;
              r.updated_at = nowIso();
              await DB.put(key, r);
              UI.toast('Recuperado');
              Trips.openTrash(t);
            }}, [ el('span', { html: svg('refresh') }), 'Recuperar' ]),
            el('button', { class:'icon-btn', title:'Descartar definitivamente', onclick: async () => {
              const ok = await UI.confirm('¿Descartar este elemento definitivamente? Esta acción es irreversible.');
              if (!ok) return;
              await DB.db.delete(key, r.id);
              UI.toast('Descartado');
              Trips.openTrash(t);
            }, html: svg('trash') }),
          ]),
        ]));
      }
      body.appendChild(list);
    }

    UI.openSheet({
      title:'Papelera del viaje',
      body,
      footer:[
        el('button', { class:'btn btn-ghost', onclick: () => Trips.openTripEditor(t) }, 'Volver'),
        el('button', { class:'btn btn-danger', onclick: async () => {
          const ok = await UI.confirm(`¿Vaciar la papelera entera (${total} elementos)? Irreversible.`);
          if (!ok) return;
          for (const [key, b] of Object.entries(buckets)) {
            for (const r of b.items) await DB.db.delete(key, r.id);
          }
          UI.toast('Papelera vaciada');
          Trips.openTripEditor(t);
        }}, 'Vaciar papelera'),
      ]
    });
  },

  _labelForTrashItem(key, r) {
    if (key === 'planning_items') return r.title || '(sin título)';
    if (key === 'budget_items')   return `${r.concept || '?'} · ${fmtMoney(r.amount, r.currency || 'EUR')}`;
    if (key === 'bookings')       return `${r.type} · ${r.structured_data?.nombre || r.structured_data?.aerolinea || '?'}`;
    if (key === 'packing_items')  return r.name || '?';
    if (key === 'day_notes')      return `Nota ${r.date || ''}`;
    if (key === 'shared_expenses')return `${r.concept || '?'} · ${fmtMoney(r.amount, r.currency || 'EUR')}`;
    if (key === 'diary')          return `Diario ${r.date || ''}`;
    if (key === 'emergency_contacts') return r.name || '?';
    if (key === 'phrases')        return r.phrase_local || '?';
    return r.id;
  },

  async deleteCascade(tripId) {
    const tables = ['trip_legs','planning_items','budget_items','bookings','inquiries','wishlist_items','day_notes','packing_items','addresses','destination_info','emergency_contacts','phrases','shared_expenses','diary'];
    for (const t of tables) {
      const rows = await DB.db.getAllFromIndex(t, 'by_trip', tripId);
      for (const r of rows) await DB.remove(t, r.id);
    }
    await DB.remove('trips', tripId);
  },
};

/* ============================================================
   VIEW — Trip detail
   ============================================================ */
const TripDetail = {
  // Menú "..." de acciones del viaje (Editar, PDF, Compartir, etc.).
  // Se abre desde el botón hamburguesa del topbar.
  _openActionsMenu(t) {
    const items = [];
    if (canEdit()) {
      items.push({
        icon: svg('edit'), label: 'Editar viaje',
        onclick: () => { UI.closeSheet(); Trips.openTripEditor(t); }
      });
    }
    if (canSeeDocs()) {
      items.push({
        icon: svg('pdf'), label: 'Exportar PDF',
        onclick: () => { UI.closeSheet(); Exporter.tripToPdf(t); }
      });
    }
    if (canEdit()) {
      items.push({
        icon: svg('external'), label: 'Compartir viaje',
        onclick: () => { UI.closeSheet(); Exporter.openShareSheet(t); }
      });
    }
    const list = el('div', { class:'action-menu' });
    items.forEach(item => {
      list.appendChild(el('button', { class:'action-menu-item', onclick: item.onclick }, [
        el('span', { class:'action-menu-icon', html: item.icon }),
        el('span', { class:'action-menu-label', text: item.label }),
      ]));
    });
    UI.openSheet({
      title: t.name,
      body: list,
      footer: [el('button', { class:'btn btn-ghost', onclick: () => UI.closeSheet() }, 'Cerrar')],
    });
  },

  async render(root, title, fab) {
    const t = await DB.get('trips', STATE.currentTripId);
    if (!t) { Router.go('trips'); return; }

    title.textContent = t.name;
    root.innerHTML = '';

    // Topbar: un único botón de menú hamburguesa con todas las acciones del viaje.
    // Más limpio que 3 iconos sueltos en móvil.
    const extras = document.getElementById('topbar-extras');
    if (extras) {
      extras.innerHTML = '';
      extras.appendChild(el('button', {
        class:'icon-btn', title:'Más opciones', 'aria-label':'Más opciones de este viaje',
        onclick: () => TripDetail._openActionsMenu(t),
        html: svg('menu'),
      }));
    }

    // Portada (foto del viaje) — visible solo en desktop, oculta en móvil por CSS.
    if (t.cover_blob_id || t.cover_photo_url) {
      const coverWrap = el('div', { class:'trip-detail-cover-wrap', style:{ overflow:'hidden' } });
      const cover = el('div', { class:'trip-card-cover trip-detail-cover-inner' });
      if (t.cover_blob_id) {
        const img = el('img', { src:'', alt:'', loading:'lazy', decoding:'async',
          onerror: function(){ this.remove(); } });
        MediaCache.urlFor(t.cover_blob_id).then(url => { if (url) img.src = url; else img.remove(); });
        cover.appendChild(img);
      } else if (t.cover_photo_url) {
        cover.appendChild(el('img', { src: t.cover_photo_url, alt:'', loading:'lazy', decoding:'async',
          onerror: function(){ this.remove(); } }));
      }
      coverWrap.appendChild(cover);
      root.appendChild(coverWrap);
    }

    // Título grande estilo Apple (como las recetas) + subtítulo con fechas + faltan X días.
    // Sin destino (ya estaba duplicado con el nombre del viaje en muchos casos).
    root.appendChild(el('h1', { class:'trip-detail-title', text: t.name }));
    const subDates = (t.start_date && t.end_date)
      ? `${fmtDateShort(t.start_date)} – ${fmtDateShort(t.end_date)}` : 'Sin fechas';
    root.appendChild(el('div', { class:'trip-detail-sub' }, [
      el('span', { text: subDates }),
      el('span', { class:'sep', text:' · ' }),
      el('span', { text: statusDays(t) }),
    ]));

    // Banner modo lector
    if (isReadonly()) {
      root.appendChild(el('div', { class:'readonly-banner', style:{marginTop:'12px'} }, [
        el('div', { class:'ico', html: svg('lock') }),
        el('div', { text:'Modo lector — solo puedes consultar este viaje, no editarlo.' }),
      ]));
    }

    // Banner aviso de documentos
    const docs = await DB.listByProfile('travel_docs', STATE.profile);
    if (t.start_date && docs.length) {
      const tripStart = parseDate(t.start_date);
      const sixMonthsAfter = new Date(tripStart); sixMonthsAfter.setMonth(sixMonthsAfter.getMonth() + 6);
      const expiring = docs.filter(d => d.expiry_date && parseDate(d.expiry_date) <= sixMonthsAfter);
      if (expiring.length) {
        const banner = el('div', { class:'banner warn', style:{marginTop:'16px'} }, [
          el('div', { class:'ico', html: svg('warn') }),
          el('div', { class:'banner-body' }, [
            el('strong', { text:'Aviso de documentación: ' }),
            `Tu ${expiring.map(d => `${d.type} (caduca ${fmtDateShort(d.expiry_date)})`).join(', ')} podría no cubrir todo el viaje. Verifica los requisitos de entrada.`,
          ]),
        ]);
        root.appendChild(banner);
      }
    }

    // Sub-tabs — Invitado no ve pestañas financieras
    const tabs = [
      { id:'resumen',   label:'Resumen' },
      { id:'planning',  label:'Planning' },
      canSeeMoney() ? { id:'presu',    label:'Presupuesto' } : null,
      { id:'maleta',    label:'Maleta' },
      { id:'reservas',  label:'Reservas' },
      { id:'mapa',      label:'Mapa' },
      { id:'destino',   label:'Ficha destino' },
    ].filter(Boolean);
    if (t.is_shared && canSeeMoney()) tabs.push({ id:'gastos', label:'Compartir gastos' });
    tabs.push({ id:'diario', label:'Diario' });

    // Si Invitado intenta entrar a una pestaña no permitida, redirige a resumen
    if (!tabs.some(tb => tb.id === STATE.currentTab)) STATE.currentTab = 'resumen';

    const subtabs = el('div', { class:'subtabs', role:'tablist', 'aria-label':'Secciones del viaje', style:{marginTop:'24px'} });
    tabs.forEach((tb, idx) => {
      const isActive = STATE.currentTab === tb.id;
      const btn = el('button', {
        class: 'subtab' + (isActive ? ' active' : ''),
        role: 'tab',
        id: 'tab-' + tb.id,
        'aria-selected': isActive ? 'true' : 'false',
        'aria-controls': 'tab-panel',
        tabindex: isActive ? '0' : '-1',
        onclick: () => { STATE.currentTab = tb.id; Router.render(); },
        onkeydown: (e) => {
          if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
          e.preventDefault();
          const dir = e.key === 'ArrowRight' ? 1 : -1;
          const newIdx = (idx + dir + tabs.length) % tabs.length;
          STATE.currentTab = tabs[newIdx].id;
          Router.render();
        }
      }, tb.label);
      subtabs.appendChild(btn);
    });
    root.appendChild(subtabs);

    // Panel
    const panel = el('div', {
      id:'tab-panel',
      role:'tabpanel',
      'aria-labelledby': 'tab-' + STATE.currentTab,
      tabindex: '0',
    });
    root.appendChild(panel);

    const tab = STATE.currentTab;
    if (tab === 'resumen')      await TripDetail.tabResumen(panel, t);
    else if (tab === 'planning')await TripDetail.tabPlanning(panel, t, fab);
    else if (tab === 'presu')   await TripDetail.tabPresupuesto(panel, t, fab);
    else if (tab === 'maleta')  await TripDetail.tabMaleta(panel, t, fab);
    else if (tab === 'reservas')await TripDetail.tabReservas(panel, t, fab);
    else if (tab === 'mapa')    await TripDetail.tabMapa(panel, t);
    else if (tab === 'destino') await TripDetail.tabDestino(panel, t);
    else if (tab === 'gastos')  await TripDetail.tabGastos(panel, t, fab);
    else if (tab === 'diario')  await TripDetail.tabDiario(panel, t, fab);
  },

  /* ----- Resumen ----- */
  async tabResumen(root, t) {
    const planning = await DB.listByTrip('planning_items', t.id);
    const budget   = await DB.listByTrip('budget_items', t.id);
    const packing  = await DB.listByTrip('packing_items', t.id);
    const bookings = await DB.listByTrip('bookings', t.id);

    const totalEur  = budget.reduce((a,b) => a + (Number(b.amount_eur) || (Number(b.amount)||0) * (Number(b.rate_to_eur)||1)), 0);
    const paidEur   = budget.filter(b => b.status === 'pagado').reduce((a,b) => a + (Number(b.amount_eur) || 0), 0);
    const packDone  = packing.filter(p => p.checked).length;

    const metricCells = [
      el('div', { class:'metric' }, [
        el('div', { class:'label', text:'Días' }),
        el('div', { class:'value', text: t.start_date && t.end_date ? (daysBetween(t.start_date, t.end_date)+1) : '—' }),
        el('div', { class:'sub', text: statusDays(t) }),
      ]),
      el('div', { class:'metric' }, [
        el('div', { class:'label', text:'Planning' }),
        el('div', { class:'value', text: String(planning.length) }),
        el('div', { class:'sub', text:'paradas' }),
      ]),
      canSeeMoney() ? el('div', { class:'metric' }, [
        el('div', { class:'label', text:'Presupuesto' }),
        el('div', { class:'value', text: fmtMoney(totalEur, 'EUR') }),
        el('div', { class:'sub', text:`Pagado ${fmtMoney(paidEur,'EUR')}` }),
      ]) : null,
      el('div', { class:'metric' }, [
        el('div', { class:'label', text:'Maleta' }),
        el('div', { class:'value', text: `${packDone}/${packing.length}` }),
        el('div', { class:'sub', text: packing.length ? 'preparados' : 'sin lista' }),
      ]),
    ].filter(Boolean);
    root.appendChild(el('div', { class:'metric-grid' }, metricCells));

    // Notas
    if (t.notes) {
      root.appendChild(el('h2', { class:'section-title', text:'Notas' }));
      root.appendChild(el('div', { class:'card' }, el('div', { class:'card-body', text: t.notes, style:{whiteSpace:'pre-wrap'} })));
    }

    // Resumen reservas
    if (bookings.length) {
      root.appendChild(el('h2', { class:'section-title', text:'Reservas clave' }));
      const list = el('div', { class:'list' });
      for (const b of bookings.slice(0, 4)) {
        const sub = TripDetail._bookingSub(b);
        list.appendChild(el('div', { class:'list-item' }, [
          el('div', { html: svg(bookingIcon(b.type)) }),
          el('div', { class:'li-main' }, [
            el('div', { class:'li-title', text: b.type[0].toUpperCase()+b.type.slice(1) + (b.structured_data?.nombre? ' · '+b.structured_data.nombre : '') }),
            el('div', { class:'li-sub', text: sub }),
          ]),
        ]));
      }
      root.appendChild(list);
    }
  },

  _bookingSub(b) {
    const d = b.structured_data || {};
    if (b.type==='vuelo') return [d.aerolinea, d.numero, d.hora_salida].filter(Boolean).join(' · ');
    if (b.type==='hotel') return [d.checkin && `Check-in ${fmtDateShort(d.checkin)}`, d.checkout && `Check-out ${fmtDateShort(d.checkout)}`].filter(Boolean).join(' · ');
    if (b.type==='coche') return [d.recogida, d.devolucion].filter(Boolean).join(' → ');
    if (b.type==='seguro')return [d.compania, d.poliza].filter(Boolean).join(' · ');
    return '';
  },

  /* ----- Planning (con timeline vertical, notas por día y D&D) ----- */
  _planningFilter: 'todo', // 'todo' | 'consulta' | 'direcciones'

  async tabPlanning(root, t, fab) {
    const rawItems = await DB.listByTrip('planning_items', t.id);
    const dayNotes = await DB.listByTrip('day_notes', t.id);
    const noteMap = {};
    dayNotes.forEach(n => noteMap[n.date] = n);
    // Mapa planning_item_id → budget vinculado, para mostrar el importe en la card.
    try {
      const budgets = await DB.listByTrip('budget_items', t.id);
      this._budgetByPlanningId = {};
      for (const b of budgets) {
        if (b.planning_item_id) this._budgetByPlanningId[b.planning_item_id] = b;
      }
    } catch (_) { this._budgetByPlanningId = {}; }

    // === Expansión de hoteles con rango ===
    // Un hotel con check-in y check-out distintos genera:
    //   - una "noche" al final de cada día del rango (sin la fecha de check-out)
    //   - un "check-out" al inicio del día de check-out con la hora
    // El item original se sustituye por estos virtuales. Si solo hay una de las
    // dos fechas, o son el mismo día, el item se muestra normal.
    const items = [];
    for (const it of rawItems) {
      const d1 = it.consultation_planned_d1;
      const d2 = it.consultation_planned_d2;
      if (it.type === 'hotel' && d1 && d2 && d1 < d2) {
        let d = parseDate(d1);
        const end = parseDate(d2);
        while (d < end) {
          const k = d.toISOString().slice(0,10);
          items.push({
            ...it, _virtual: 'night', _isFirstNight: (k === d1),
            day_date: k, time: null,
          });
          d.setDate(d.getDate() + 1);
        }
        items.push({
          ...it, _virtual: 'checkout',
          day_date: d2, time: it.consultation_planned_t2 || null,
        });
      } else {
        items.push(it);
      }
    }

    // Orden global: por día asc, luego virtuales/hoteles según planningCompare.
    items.sort((a,b) => (a.day_date || '').localeCompare(b.day_date || '') || planningCompare(a, b));

    // FAB flotante "+" en la esquina inferior derecha en lugar de un botón inline.
    // Más limpio en móvil y permite ver el listado completo sin que reste altura.
    if (canEdit() && fab) {
      fab.hidden = false;
      fab.title = 'Añadir parada';
      fab.setAttribute('aria-label', 'Añadir parada');
      fab.onclick = () => TripDetail.openPlanningEditor(t);
    }

    // Chips de filtro
    const countConsulta = items.filter(i => itemStatus(i) === 'en_consulta').length;
    const countDir = items.filter(i => i.address || (i.lat != null && i.lng != null)).length;
    const chipDef = [
      { id:'todo',        label:'Todo',        count: items.length },
      { id:'consulta',    label:'En consulta', count: countConsulta },
      { id:'direcciones', label:'Direcciones', count: countDir },
    ];
    const chips = el('div', { class:'chip-row', role:'group', 'aria-label':'Filtros de planning' });
    chipDef.forEach(c => {
      const isActive = TripDetail._planningFilter === c.id;
      chips.appendChild(el('button', {
        class: 'chip' + (isActive ? ' active' : ''),
        'aria-pressed': isActive ? 'true' : 'false',
        onclick: () => { TripDetail._planningFilter = c.id; Router.render(); }
      }, [
        c.label,
        el('span', { class:'badge', 'aria-label':`${c.count} items`, text: String(c.count) }),
      ]));
    });
    root.appendChild(chips);

    // === Vista DIRECCIONES (lista plana con botón "Ir") ===
    if (TripDetail._planningFilter === 'direcciones') {
      const dirItems = items.filter(i => i.address || (i.lat != null && i.lng != null) || i.place_name);
      if (!dirItems.length) {
        root.appendChild(el('div', { class:'empty' }, [
          el('div', { class:'icon', html: svg('pin') }),
          el('h3', { text:'Sin direcciones' }),
          el('p', { text:'Añade paradas con dirección o coordenadas para verlas aquí.' }),
        ]));
        return;
      }
      const list = el('div', { class:'list' });
      dirItems.forEach(i => list.appendChild(TripDetail._planningAddressRow(i, t)));
      root.appendChild(list);
      return;
    }

    // === Vista TODO o EN CONSULTA agrupada por día ===
    const filtered = TripDetail._planningFilter === 'consulta'
      ? items.filter(i => itemStatus(i) === 'en_consulta')
      : items;

    const byDay = {};
    for (const it of filtered) {
      const k = it.day_date || 'sin-fecha';
      (byDay[k] = byDay[k] || []).push(it);
    }
    if (TripDetail._planningFilter === 'todo') {
      Object.keys(noteMap).forEach(k => { if (!byDay[k]) byDay[k] = []; });
      if (t.start_date && t.end_date) {
        let d = parseDate(t.start_date);
        const end = parseDate(t.end_date);
        while (d <= end) {
          const k = d.toISOString().slice(0,10);
          if (!byDay[k]) byDay[k] = [];
          d.setDate(d.getDate() + 1);
        }
      }
    }

    if (!filtered.length && !dayNotes.length && !Object.keys(byDay).length) {
      root.appendChild(el('div', { class:'empty' }, [
        el('div', { class:'icon', html: svg('pin') }),
        el('h3', { text: TripDetail._planningFilter === 'consulta' ? 'Nada en consulta' : 'Sin paradas todavía' }),
        el('p', { text: TripDetail._planningFilter === 'consulta'
          ? 'Al añadir una parada activa el toggle "En consulta" para anotarla como opción pendiente.'
          : 'Añade lugares, transportes, comidas, actividades. Mantén pulsado un item para arrastrarlo.' }),
      ]));
      return;
    }

    const keys = Object.keys(byDay).sort();
    for (const k of keys) {
      const g = el('div', { class:'day-group', data:{ day:k } });
      const dayNum = (t.start_date && k !== 'sin-fecha') ? (daysBetween(t.start_date, k) + 1) : null;
      const dayMeta = noteMap[k];
      const head = el('div', { class:'day-head' }, [
        dayNum ? el('span', { class:'day-num', text:`Día ${dayNum}` }) : null,
        el('span', { class:'day-date', text: k === 'sin-fecha' ? 'Sin fecha' : fmtDayLong(k) }),
        // Pill del título del día — solo si está rellenado
        (dayMeta && dayMeta.title) ? el('span', {
          class: 'day-title-pill' + (dayMeta.color ? ' color-' + dayMeta.color : ''),
          text: dayMeta.title,
        }) : null,
        el('div', { class:'gap' }),
        el('div', { class:'day-actions' }, [
          el('button', {
            class:'icon-btn', title:'Editar título/color del día',
            onclick: () => TripDetail.openDayEditor(t, k, dayMeta),
            html: svg('edit'),
            'aria-label':'Editar título del día',
          }),
          el('button', {
            class:'icon-btn', title: dayMeta && dayMeta.text ? 'Editar nota del día' : 'Añadir nota del día',
            onclick: () => TripDetail.openDayNoteEditor(t, k, dayMeta),
            html: svg('note'),
            'aria-label':'Editar nota del día',
          }),
        ]),
      ].filter(Boolean));
      g.appendChild(head);

      if (noteMap[k] && noteMap[k].text && TripDetail._planningFilter !== 'consulta') {
        g.appendChild(el('div', { class:'day-note-card', text: noteMap[k].text }));
      }

      const list = el('div', { class:'list timeline-list', data:{ day:k } });
      for (const it of byDay[k]) {
        list.appendChild(this._planningItem(it, t));
      }
      g.appendChild(list);
      root.appendChild(g);
    }

    setTimeout(() => TripDetail._wirePlanningDnD(root, t), 0);
  },

  _planningItem(it, t) {
    const td = typeDef(it.type);
    const status = itemStatus(it);                  // null para lugar/comida/otro
    const statusDef = STATUS_PLANNING.find(s => s.id === status);
    const isVirtual = !!it._virtual;
    const isCheckout = it._virtual === 'checkout';
    const isNight = it._virtual === 'night';

    // Título según virtual
    let displayTitle = it.title;
    if (isCheckout) displayTitle = `${it.title} — Check-out`;
    else if (isNight) displayTitle = it.title; // simple, sin sufijo

    // Subtítulo
    const subParts = [];
    if (it.place_name && it.place_name !== it.title) subParts.push(it.place_name);
    if (it.address) subParts.push(it.address);
    if (isNight) {
      subParts.push(it._isFirstNight ? `Check-in${it.consultation_planned_t1 ? ' ' + it.consultation_planned_t1 : ''}` : 'Noche en el hotel');
    } else if (isCheckout) {
      // sub claro y corto
    } else if (it.type === 'hotel' && (it.consultation_planned_d1 || it.consultation_planned_d2)) {
      const ci = it.consultation_planned_d1 ? `Check-in ${fmtDateShort(it.consultation_planned_d1)}${it.consultation_planned_t1 ? ' ' + it.consultation_planned_t1 : ''}` : null;
      const co = it.consultation_planned_d2 ? `Check-out ${fmtDateShort(it.consultation_planned_d2)}${it.consultation_planned_t2 ? ' ' + it.consultation_planned_t2 : ''}` : null;
      [ci, co].filter(Boolean).forEach(p => subParts.push(p));
    }
    // Datos de metadata según tipo (resumen útil para la fila)
    const md = it.metadata || {};
    if (it.type === 'vuelo') {
      const oriDest = (md.origen && md.destino) ? `${md.origen} - ${md.destino}` :
                      (it.origin_tz && it.dest_tz) ? `${it.origin_tz.split('/').pop().replace(/_/g,' ')} - ${it.dest_tz.split('/').pop().replace(/_/g,' ')}` : null;
      if (oriDest && !it.title.includes(oriDest)) subParts.push(oriDest);
      if (md.aerolinea && !it.title.includes(md.aerolinea)) subParts.push(md.aerolinea);
      if (md.terminal || md.puerta) {
        const tps = [];
        if (md.terminal) tps.push('T' + md.terminal);
        if (md.puerta)   tps.push('Puerta ' + md.puerta);
        subParts.push(tps.join(' · '));
      }
      // Asientos: array o string legacy
      const seatsStr = Array.isArray(md.asientos)
        ? md.asientos.map(s => [s.nombre, s.asiento].filter(Boolean).join(' ')).filter(Boolean).join(' · ')
        : (md.asiento || '');
      if (seatsStr) subParts.push(seatsStr);
    } else if (it.type === 'coche') {
      if (md.compania && !it.title.includes(md.compania)) subParts.push(md.compania);
      if (md.modelo && !it.title.includes(md.modelo)) subParts.push(md.modelo);
      if (md.matricula) subParts.push(md.matricula);
    } else if (it.type === 'transporte') {
      if (md.origen && md.destino && !it.title.includes(`${md.origen} - ${md.destino}`)) subParts.push(`${md.origen} - ${md.destino}`);
      if (md.vagon) subParts.push('Coche ' + md.vagon);
      const seatsStr = Array.isArray(md.asientos)
        ? md.asientos.map(s => [s.nombre, s.asiento].filter(Boolean).join(' ')).filter(Boolean).join(' · ')
        : (md.asiento || '');
      if (seatsStr) subParts.push(seatsStr);
    } else if (it.type === 'hotel' && md.habitacion) {
      subParts.push(md.habitacion);
    } else if (it.type === 'actividad') {
      if (md.duracion) subParts.push(md.duracion);
      if (md.organizador) subParts.push(md.organizador);
    }
    if (status === 'en_consulta' && it.consultation_price != null && canSeeMoney()) {
      const cur = it.consultation_currency || 'EUR';
      let priceStr = fmtMoney(it.consultation_price, cur);
      // Si la moneda no es EUR y tenemos tasa, añadir conversión: "¥35.000 (~ 215 €)"
      if (cur !== 'EUR') {
        const rate = FX.rateToEur(cur);
        if (rate) {
          const eur = +(it.consultation_price * rate).toFixed(2);
          priceStr += ` (~ ${fmtMoney(eur, 'EUR')})`;
        }
      }
      subParts.push(priceStr);
    }
    // Importe asociado (budget_item vinculado por planning_item_id) — para tipos sin status
    // (lugar/playa/comida) y también como fallback cuando hay budget pero no estado en_consulta.
    const linkedBudget = this._budgetByPlanningId?.[it.id];
    if (linkedBudget && status !== 'en_consulta' && canSeeMoney() && !isVirtual) {
      const cur = linkedBudget.currency || 'EUR';
      let priceStr = fmtMoney(linkedBudget.amount, cur);
      if (cur !== 'EUR' && linkedBudget.amount_eur) {
        priceStr += ` (~ ${fmtMoney(linkedBudget.amount_eur, 'EUR')})`;
      }
      subParts.push(priceStr);
    }
    const gm = gmapsUrl(it.lat, it.lng, it.place_name);

    // Mostrar hora SOLO si:
    //  - el tipo no la oculta (hotel la oculta normalmente) Y hay hora
    //  - O es el check-out virtual (sí mostramos hora ahí)
    const showTime = (isCheckout && it.time) || (!td.hideTime && it.time);
    // Para lugar/playa permitimos rango "10:00 – 14:00" si end_time está informado.
    // Si solo hay start_time, mostramos esa. Si solo hay end_time (raro), no mostramos pill.
    const timeRangeText = (() => {
      if (!showTime) return null;
      const start = it.time;
      const end   = (it.type === 'lugar' || it.type === 'playa') ? it.end_time : null;
      return end ? `${start} – ${end}` : start;
    })();
    const borderCls = (it.border_color && (it.type === 'lugar' || it.type === 'playa')) ? ` border-${it.border_color}` : '';
    const visitedCls = (it.visited && !isVirtual) ? ' visited' : '';
    const cls = 'list-item timeline-item' + (status ? ` status-${status}` : '') + ` type-${it.type}` + borderCls + visitedCls + (isVirtual ? ' virtual' : '');

    const node = el('div', {
      class: cls,
      draggable: isVirtual ? 'false' : 'true',
      data:{ id:it.id, day: it.day_date || 'sin-fecha' }
    }, [
      // Los virtuales no se pueden arrastrar (lo controlan las fechas del hotel)
      isVirtual ? null : el('div', { class:'drag-handle', html: svg('grip'), title:'Arrastra para reordenar' }),
      // Emoji del tipo, centrado en alto y ancho dentro de la card
      el('div', { class:'item-emoji', 'aria-hidden':'true', text: td.emoji || '📌' }),
      el('div', { class:'li-main', onclick: () => TripDetail.openPlanningEditor(t, it) }, [
        el('div', { class:'li-title', style:{display:'flex', alignItems:'center', flexWrap:'wrap', gap:'4px'} }, [
          timeRangeText ? el('span', { class:'time-pill', text: timeRangeText }) : null,
          el('span', { text: displayTitle }),
          (statusDef && !isVirtual) ? el('span', { class:`status-badge s-${status}`, text: statusDef.label }) : null,
        ].filter(Boolean)),
        el('div', { class:'li-sub', text: subParts.join(' · ') || td.label }),
        (status === 'en_consulta' && it.consultation_url && canSeeLinks() && !isVirtual) ? el('div', { style:{marginTop:'4px', fontSize:'13px'} },
          el('a', { href: it.consultation_url, target:'_blank', rel:'noopener',
            onclick: (e) => e.stopPropagation(), text: TripDetail._shortUrl(it.consultation_url) })
        ) : null,
      ].filter(Boolean)),
      el('div', { class:'li-actions', style:{alignItems:'center'} }, [
        ((status === 'en_consulta' || status === 'por_iniciar') && canEdit() && !isVirtual) ? el('button', {
          class:'btn btn-sm', style:{background:'var(--status-curso)', color:'#fff', borderColor:'transparent'},
          onclick: (e) => { e.stopPropagation(); TripDetail.openConfirmPlanning(t, it); }
        }, [ el('span', { html: svg('check') }), 'Confirmar' ]) : null,
        // Toggle "Visto": marca/desmarca el item como visitado. Pinta la card en gris.
        (canEdit() && !isVirtual) ? el('button', {
          class: 'icon-btn' + (it.visited ? ' btn-visited-on' : ''),
          title: it.visited ? 'Marcar como no visto' : 'Marcar como visto',
          'aria-pressed': it.visited ? 'true' : 'false',
          html: svg('check'),
          onclick: (e) => { e.stopPropagation(); TripDetail.toggleVisited(it); }
        }) : null,
        gm ? el('a', { class:'icon-btn', href: gm, target:'_blank', title:'Abrir en Google Maps', html: svg('map'),
          onclick: (e) => e.stopPropagation() }) : null,
        el('button', { class:'icon-btn', onclick: () => TripDetail.openPlanningEditor(t, it), html: svg('edit'),
          title: isVirtual ? 'Editar el hotel' : 'Editar' }),
      ].filter(Boolean))
    ].filter(Boolean));
    return node;
  },

  // Fila para la vista "Direcciones" — incluye botón "Ir" (Google Maps directions)
  _planningAddressRow(i, t) {
    const sub = [i.address, i.place_name && i.place_name !== i.title ? i.place_name : null]
      .filter(Boolean).join(' · ');
    const navUrl = (i.lat != null && i.lng != null)
      ? `https://www.google.com/maps/dir/?api=1&destination=${i.lat},${i.lng}`
      : i.address
        ? `https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(i.address)}`
        : `https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(i.place_name || i.title)}`;
    return el('div', { class:'list-item' + (i.in_consultation ? ' in-consultation' : '') }, [
      el('div', { html: svg('pin') }),
      el('div', { class:'li-main', onclick: () => TripDetail.openPlanningEditor(t, i) }, [
        el('div', { class:'li-title', text: i.title }),
        sub ? el('div', { class:'li-sub', text: sub }) : null,
      ].filter(Boolean)),
      el('a', { class:'btn btn-sm', href: navUrl, target:'_blank', rel:'noopener',
        onclick: (e) => e.stopPropagation()
      }, [ el('span', { html: svg('map') }), 'Ir' ]),
    ]);
  },

  _shortUrl(u) {
    try {
      const url = new URL(u);
      return url.hostname.replace(/^www\./,'') + (url.pathname.length > 1 ? '…' : '');
    } catch (_) { return u.length > 40 ? u.slice(0,40)+'…' : u; }
  },

  // Genera un título por defecto inteligente cuando el usuario no lo rellena.
  // Lee los campos visibles del editor (place_name, TZ, ciudades del trip)
  // y compone algo como "Vuelo Madrid - Tokyo" / "Hotel Tokio" / "Coche Tokio".
  _defaultTitle(type, t) {
    const tCity = (t.city || '').trim();
    const tCountry = (t.country || '').trim();
    const place = ($('#f-place')?.value || '').trim();
    const tzCity = (tz) => tz ? tz.split('/').pop().replace(/_/g, ' ') : '';
    const meta = (id) => ($(`#meta-${id}`)?.value || '').trim();
    switch (type) {
      case 'vuelo': {
        const num = meta('numero');
        const ori = meta('origen') || tzCity($('#f-origin-tz')?.value);
        const dest = meta('destino') || tzCity($('#f-dest-tz')?.value);
        const aero = meta('aerolinea');
        if (ori && dest) return num ? `Vuelo ${num} ${ori} - ${dest}` : `Vuelo ${ori} - ${dest}`;
        if (aero && dest) return `${aero} a ${dest}`;
        if (dest) return `Vuelo a ${dest}`;
        if (tCity) return `Vuelo a ${tCity}`;
        if (tCountry) return `Vuelo a ${tCountry}`;
        return 'Vuelo';
      }
      case 'hotel': {
        const nombre = meta('nombre');
        if (nombre) return nombre;
        if (place) return place;
        if (tCity) return `Hotel ${tCity}`;
        if (tCountry) return `Hotel ${tCountry}`;
        return 'Hotel';
      }
      case 'coche': {
        const comp = meta('compania');
        const mod = meta('modelo');
        if (comp && mod) return `${comp} · ${mod}`;
        if (comp) return `Coche ${comp}`;
        if (mod) return `Coche ${mod}`;
        if (tCity) return `Coche ${tCity}`;
        return 'Coche de alquiler';
      }
      case 'transporte': {
        const num = meta('numero');
        const ori = meta('origen');
        const dest = meta('destino');
        const comp = meta('compania');
        if (ori && dest) return num ? `${num} ${ori} - ${dest}` : `${comp || 'Transporte'} ${ori} - ${dest}`;
        if (comp) return `Transporte ${comp}`;
        if (tCity) return `Transporte a ${tCity}`;
        return 'Transporte';
      }
      case 'actividad': {
        const org = meta('organizador');
        if (place && org) return `${place} (${org})`;
        if (place) return place;
        return tCity ? `Actividad en ${tCity}` : 'Actividad';
      }
      case 'comida': {
        if (place) return place;
        return tCity ? `Comida en ${tCity}` : 'Comida';
      }
      case 'lugar': {
        return place || (tCity ? `Visita en ${tCity}` : 'Visita');
      }
      case 'otro':
      default: {
        return place || 'Parada';
      }
    }
  },

  _wirePlanningDnD(root, t) {
    let dragged = null;
    const clearTargets = () => {
      root.querySelectorAll('.drag-over-top,.drag-over-bot').forEach(n => n.classList.remove('drag-over-top','drag-over-bot'));
      root.querySelectorAll('.day-target').forEach(n => n.classList.remove('day-target'));
    };

    root.querySelectorAll('.timeline-item:not(.virtual)').forEach(item => {
      item.addEventListener('dragstart', (e) => {
        dragged = item;
        item.classList.add('dragging');
        document.body.classList.add('dragging-planning');
        e.dataTransfer.effectAllowed = 'move';
        try { e.dataTransfer.setData('text/plain', item.dataset.id); } catch (_) {}
      });
      item.addEventListener('dragend', () => {
        item.classList.remove('dragging');
        document.body.classList.remove('dragging-planning');
        clearTargets();
        dragged = null;
      });
      item.addEventListener('dragover', (e) => {
        if (!dragged || dragged === item) return;
        e.preventDefault();
        e.dataTransfer.dropEffect = 'move';
        // Limpiar otros targets antes de marcar este
        root.querySelectorAll('.drag-over-top,.drag-over-bot').forEach(n => {
          if (n !== item) n.classList.remove('drag-over-top','drag-over-bot');
        });
        const rect = item.getBoundingClientRect();
        const before = (e.clientY - rect.top) < rect.height / 2;
        item.classList.toggle('drag-over-top', before);
        item.classList.toggle('drag-over-bot', !before);
      });
      item.addEventListener('dragleave', (e) => {
        // Solo limpiar si el cursor realmente salió de este item
        const r = item.getBoundingClientRect();
        if (e.clientX < r.left || e.clientX > r.right || e.clientY < r.top || e.clientY > r.bottom) {
          item.classList.remove('drag-over-top','drag-over-bot');
        }
      });
      item.addEventListener('drop', async (e) => {
        if (!dragged || dragged === item) return;
        e.preventDefault();
        e.stopPropagation();
        const before = item.classList.contains('drag-over-top');
        const targetDay = item.dataset.day;
        const draggedDay = dragged.dataset.day;
        clearTargets();
        document.body.classList.remove('dragging-planning');
        await TripDetail._reorderPlanning(t, dragged.dataset.id, item.dataset.id, before, targetDay);
        if (targetDay !== draggedDay) UI.toast(`Movido al ${targetDay === 'sin-fecha' ? 'día sin fecha' : fmtDateShort(targetDay)}`);
      });
    });

    // Drop sobre el contenedor del día (espacio vacío del día → mover al final del día)
    root.querySelectorAll('.day-group').forEach(grp => {
      grp.addEventListener('dragover', (e) => {
        if (!dragged) return;
        // si está sobre un item específico, deja que ese maneje
        if (e.target.closest('.timeline-item')) return;
        e.preventDefault();
        e.dataTransfer.dropEffect = 'move';
        // Limpiar otros day-targets para mostrar solo este
        root.querySelectorAll('.day-target').forEach(n => { if (n !== grp) n.classList.remove('day-target'); });
        grp.classList.add('day-target');
      });
      grp.addEventListener('dragleave', (e) => {
        if (!grp.contains(e.relatedTarget)) grp.classList.remove('day-target');
      });
      grp.addEventListener('drop', async (e) => {
        if (!dragged) return;
        if (e.target.closest('.timeline-item')) return;
        e.preventDefault();
        const day = grp.dataset.day;
        const draggedDay = dragged.dataset.day;
        clearTargets();
        document.body.classList.remove('dragging-planning');
        await TripDetail._reorderPlanning(t, dragged.dataset.id, null, false, day);
        if (day !== draggedDay) UI.toast(`Movido al ${day === 'sin-fecha' ? 'día sin fecha' : fmtDateShort(day)}`);
      });
    });
  },

  async _reorderPlanning(t, draggedId, targetId, before, targetDay) {
    if (!canEdit()) return;
    const dragged = await DB.get('planning_items', draggedId);
    if (!dragged) return;
    // calcular nueva day_date y order_index
    if (targetDay && targetDay !== 'sin-fecha') dragged.day_date = targetDay;
    else if (targetDay === 'sin-fecha') dragged.day_date = null;

    // listar items del día destino (excluyendo el arrastrado), ordenarlos y recolocar
    const all = (await DB.listByTrip('planning_items', t.id)).filter(p => p.id !== draggedId);
    const sameDay = all.filter(p => (p.day_date || 'sin-fecha') === (dragged.day_date || 'sin-fecha'));
    sameDay.sort((a,b) => (a.time||'').localeCompare(b.time||'') || (a.order_index||0)-(b.order_index||0));

    let newIndex;
    if (!targetId) {
      // soltado en el contenedor del día → al final
      newIndex = sameDay.length;
    } else {
      const idx = sameDay.findIndex(p => p.id === targetId);
      newIndex = before ? idx : idx + 1;
    }
    sameDay.splice(newIndex, 0, dragged);
    // recalcular order_index secuencial
    for (let i = 0; i < sameDay.length; i++) {
      const p = sameDay[i];
      if (p.order_index !== i || p.id === draggedId) {
        p.order_index = i;
        await DB.put('planning_items', p);
      }
    }
    UI.toast('Reordenado');
    Router.render();
  },
