        // Día y Hora de inicio, uno al lado del otro (2 columnas).
        const dayInput = el('input', { id:'f-day', type:'date', value: it.day_date || '' });
        datesBlock.appendChild(el('div', { class:'form-grid-2' }, [
          cell('Día', dayInput),
          cell(showEnd ? 'Hora inicio' : 'Hora', timeInput('f-time', it.time)),
        ]));
        // "Día fin" + "Hora fin" (solo lugar/playa): por si el evento acaba otro día.
        if (showEnd) {
          const endDayInput = el('input', { id:'f-end-day', type:'date',
            value: (it.metadata && it.metadata.end_date) || it.day_date || '', min: it.day_date || '' });
          datesBlock.appendChild(el('div', { class:'form-grid-2' }, [
            cell('Día fin', endDayInput),
            cell('Hora fin', timeInput('f-end-time', it.end_time)),
          ]));
          // Al fijar el día de inicio, el día de fin se rellena con esa misma fecha (mínimo).
          // La hora de fin se deja vacía: el evento puede ser "a las 11:00" sin fin definido.
          dayInput.addEventListener('change', () => {
            endDayInput.min = dayInput.value || '';
            if (dayInput.value && (!endDayInput.value || endDayInput.value < dayInput.value)) endDayInput.value = dayInput.value;
          });
        }
      }
    };
    // Alias: el resto del editor (onchange, applyParsed, init, openConfirmPlanning) llama a
    // estos nombres antiguos. Todo lo absorbe el bloque unificado.
    const renderTransportDates = renderDatesBlock;
    const renderConsultationDates = renderDatesBlock;
    const refreshHotelDatesVisibility = () => {};
    const refreshTimeVisibility = () => {};
    const refreshStandaloneTime = () => {};

    const consultaBlock = el('div', { class:'consulta-fields', id:'consulta-block' }, [
      el('h4', { text:'Datos de la consulta (opcional)' }),
      el('p', { class:'muted', style:{fontSize:'12.5px', margin:'0 0 10px'},
        text:'Si has anotado precio y enlace mientras comparas opciones, va aquí. Las fechas y resto de datos están arriba en el bloque del vuelo/hotel/coche.' }),
      el('div', { class:'form-grid-2' }, [
        el('div', { class:'form-row' }, [
          el('label', { text:'Enlace' }),
          el('input', { id:'cq-url', type:'url', value: it.consultation_url || '', placeholder:'https://…' }),
        ]),
        el('div', { class:'form-row' }, [
          el('label', { text:'Fecha de consulta' }),
          el('input', { id:'cq-date', type:'date', value: it.consultation_query_date || todayIso() }),
        ]),
      ]),
      el('div', { class:'form-grid-2' }, [
        el('div', { class:'form-row num' }, [
          el('label', { text:'Precio' }),
          el('input', { id:'cq-price', type:'number', step:'0.01', value: it.consultation_price ?? '', placeholder:'0,00' }),
        ]),
        el('div', { class:'form-row' }, [
          el('label', { text:'Moneda' }),
          el('input', { id:'cq-cur', type:'text', value: it.consultation_currency || t.default_currency || 'EUR' }),
        ]),
      ]),
    ]);

    // Selector de estado (4 opciones) — solo visible si el tipo requiere reserva
    const statusPicker = el('div', { class:'status-picker', id:'status-picker' });
    const statusRow = el('div', { class:'form-row', id:'status-row' }, [
      el('label', { text:'Estado' }),
      statusPicker,
    ]);
    const renderStatusPicker = () => {
      const td = typeDef($('#f-type')?.value || it.type);
      const hasStatus = td.requiresBooking || td.supportsStatus;
      statusRow.style.display = hasStatus ? '' : 'none';
      // El bloque de consulta/reserva (URL, precio, fechas) solo para reservas reales.
      consultaBlock.style.display = td.requiresBooking ? '' : 'none';
      if (!hasStatus) return;
      statusPicker.innerHTML = '';
      // Cualquier tipo con estado puede quedar "Sin estado" (tarjeta blanca),
      // incluidas las reservas (se guarda el centinela 'ninguno').
      const opts = [{ id:'ninguno', label:'Sin estado', hint:'Color del tipo, sin pill' }, ...STATUS_PLANNING];
      // Por defecto: reservas → "por iniciar"; el resto → "sin estado".
      const defaultId = (td.requiresBooking && td.id !== 'actividad') ? 'por_iniciar' : 'ninguno';
      const activeId = currentStatus || defaultId;
      opts.forEach(s => {
        const isActive = activeId === s.id;
        const opt = el('button', {
          type:'button',
          class: `opt s-${s.id || 'sin'}` + (isActive ? ' active' : ''),
          onclick: () => {
            currentStatus = s.id;
            renderStatusPicker();
          }
        }, [
          el('div', { class:'dot' }),
          el('div', {}, [
            el('div', { class:'lbl', text: s.label }),
            el('div', { class:'h', text: s.hint }),
          ]),
        ]);
        statusPicker.appendChild(opt);
      });
    };

    // ---- Color de la tarjeta (override libre) — antes era un botón siempre visible
    //      en la card; ahora se edita aquí, dentro del diálogo. ----
    let currentCardColor = (typeof it.custom_color === 'string' && /^#[0-9a-f]{6}$/i.test(it.custom_color)) ? it.custom_color.toLowerCase() : null;
    const colorPresets = [
      { hex:'#3b82f6', label:'Azul' }, { hex:'#1e40af', label:'Azul noche' },
      { hex:'#a855f7', label:'Morado' }, { hex:'#15803d', label:'Verde' },
      { hex:'#0ea5e9', label:'Cian' }, { hex:'#14b8a6', label:'Turquesa' },
      { hex:'#f97316', label:'Coral' }, { hex:'#eab308', label:'Amarillo' },
      { hex:'#ec4899', label:'Rosa' }, { hex:'#ef4444', label:'Rojo' },
      { hex:'#64748b', label:'Gris' },
    ];
    const colorGrid = el('div', { class:'ccp-grid' });
    const colorFree = el('input', { type:'color', id:'f-card-color', value: currentCardColor || '#3b82f6',
      onchange: (e) => { currentCardColor = e.target.value.toLowerCase(); renderColorSwatches(); } });
    const renderColorSwatches = () => {
      colorGrid.innerHTML = '';
      const none = el('button', { type:'button', class:'ccp-swatch ccp-none' + (!currentCardColor ? ' active' : ''),
        title:'Sin color (según tipo/estado)', onclick: () => { currentCardColor = null; renderColorSwatches(); } },
        [ el('div', { class:'ccp-chip' }), el('span', { text:'Sin color' }) ]);
      colorGrid.appendChild(none);
      colorPresets.forEach(p => {
        const active = currentCardColor === p.hex.toLowerCase();
        const sw = el('button', { type:'button', class:'ccp-swatch' + (active ? ' active' : ''), title:p.label,
          onclick: () => { currentCardColor = p.hex.toLowerCase(); renderColorSwatches(); } },
          [ el('div', { class:'ccp-chip' }), el('span', { text:p.label }) ]);
        sw.style.setProperty('--ccp-color', p.hex);
        colorGrid.appendChild(sw);
      });
    };
    renderColorSwatches();
    const colorRow = el('div', { class:'form-row', id:'color-row' }, [
      el('label', { text:'Color de la tarjeta' }),
      el('div', { class:'card-color-popover ccp-inline' }, [
        colorGrid,
        el('div', { class:'ccp-row' }, [
          el('label', { for:'f-card-color', text:'Color libre' }),
          colorFree,
        ]),
      ]),
    ]);

    // Si abre por primera vez y el tipo requiere reserva pero no tiene status, asigna por_iniciar
    if (!currentStatus && typeDef(it.type).requiresBooking && it.type !== 'actividad') currentStatus = 'por_iniciar';

    // (La hora puntual y "hora fin" ahora viven en el bloque unificado de fechas, arriba.)

    // Bloque de zonas horarias — solo para vuelo / transporte intercontinental
    const tzBlock = el('div', { id:'tz-block', class:'form-row' }, [
      el('label', { text:'Zonas horarias (vuelos internacionales)' }),
      el('div', { class:'form-grid-2' }, [
        el('div', { class:'form-row' }, [
          el('label', { class:'muted', style:{fontSize:'12px'}, text:'Origen' }),
          el('input', { id:'f-origin-tz', type:'text', list:'tz-list', value: it.origin_tz || '', placeholder:'Europe/Madrid' }),
        ]),
        el('div', { class:'form-row' }, [
          el('label', { class:'muted', style:{fontSize:'12px'}, text:'Destino' }),
          el('input', { id:'f-dest-tz', type:'text', list:'tz-list', value: it.dest_tz || '', placeholder:'Asia/Tokyo' }),
        ]),
      ]),
      el('datalist', { id:'tz-list' }, COMMON_TIMEZONES.map(tz => el('option', { value: tz }))),
      el('div', { class:'field-hint', text:'IANA TZ. Útil para vuelos transoceánicos: muestra la hora local de cada extremo en el planning.' }),
    ]);
    const refreshTzVisibility = () => {
      const type = $('#f-type')?.value || it.type;
      tzBlock.style.display = (type === 'vuelo' || type === 'transporte') ? '' : 'none';
    };

    // Bloque de metadata específica por tipo (aerolínea, asiento, modelo coche…)
    const metadataBlock = el('div', { id:'metadata-block', class:'form-row' });
    const renderMetadata = () => {
      const type = $('#f-type')?.value || it.type;
      const def = PLANNING_METADATA[type];
      metadataBlock.innerHTML = '';
      if (!def) { metadataBlock.style.display = 'none'; return; }
      metadataBlock.style.display = '';
      metadataBlock.appendChild(el('label', { text: def.label }));
      const grid = el('div', { class:'form-grid-2' });
      const single = el('div');
      const meta = it.metadata || {};
      def.fields.forEach(f => {
        let node;
        if (f.type === 'seats') {
          node = renderSeatsField(f, Array.isArray(meta.asientos) ? meta.asientos : []);
        } else if (f.type === 'select') {
          node = el('div', { class:'form-row' }, [
            el('label', { class:'muted', style:{fontSize:'12px'}, text: f.label }),
            el('select', { id:`meta-${f.id}` }, (f.options || []).map(o =>
              el('option', { value:o.value, selected: (meta[f.id] || '') === o.value ? true : null }, o.label))),
          ]);
        } else {
          node = el('div', { class:'form-row' }, [
            el('label', { class:'muted', style:{fontSize:'12px'}, text: f.label }),
            el('input', { id:`meta-${f.id}`, type: f.type || 'text', value: meta[f.id] || '', placeholder: f.placeholder || '' }),
          ]);
        }
        if (f.full) single.appendChild(node);
        else grid.appendChild(node);
      });
      if (grid.children.length) metadataBlock.appendChild(grid);
      if (single.children.length) metadataBlock.appendChild(single);
    };

    // Componente repetidor de asientos: cada fila [nombre] [asiento] [×]
    // y un botón "+ Añadir pasajero" debajo.
    const renderSeatsField = (f, initial) => {
      const wrap = el('div', { class:'form-row', id:'meta-seats-wrap' });
      wrap.appendChild(el('label', { class:'muted', style:{fontSize:'12px'}, text: f.label + ' (uno por pasajero)' }));
      const list = el('div', { class:'seats-list', style:{display:'flex', flexDirection:'column', gap:'8px'} });
      wrap.appendChild(list);

      const addRow = (nombre = '', asiento = '') => {
        const row = el('div', { class:'seats-row', style:{display:'grid', gridTemplateColumns:'1fr 100px 36px', gap:'8px', alignItems:'center'} }, [
          el('input', { class:'seat-name',    type:'text', value: nombre,  placeholder:'Nombre del pasajero' }),
          el('input', { class:'seat-seat',    type:'text', value: asiento, placeholder:'25K' }),
          el('button', { type:'button', class:'icon-btn', 'aria-label':'Eliminar fila',
            onclick: () => row.remove(), html: svg('trash') }),
        ]);
        list.appendChild(row);
      };
      (initial.length ? initial : [{nombre:'', asiento:''}]).forEach(s => addRow(s.nombre || '', s.asiento || ''));

      wrap.appendChild(el('button', { type:'button', class:'btn btn-sm', style:{marginTop:'8px'},
        onclick: () => addRow('', '') }, [ el('span',{html:svg('plus')}), 'Añadir pasajero' ]));
      return wrap;
    };

    // Bloque "Lugar + dirección + buscador" — útil solo para tipos con localización física
    // (lugar, comida, hotel, actividad). Vuelo/coche/transporte usan sus propios campos.
    const TYPES_WITH_PLACE = ['lugar', 'personas', 'playa', 'comida', 'compras', 'hotel', 'actividad', 'otro', 'gestion'];

    // Confirmación visual del lugar seleccionado — se refresca cuando el usuario
    // pulsa un resultado de Nominatim o cuando reabre un item con coords.
    const selectedPlaceBlock = el('div', { id:'selected-place-block' });
    const refreshSelectedPlace = () => {
      selectedPlaceBlock.innerHTML = '';
      if (it.lat == null || it.lng == null) return;
      selectedPlaceBlock.appendChild(el('div', { class:'place-selected' }, [
        el('span', { class:'icon', html: svg('check') }),
        el('div', { class:'name', text: it.place_name || it.address || 'Lugar seleccionado' }),
        el('div', { class:'coords', text: `${Number(it.lat).toFixed(4)}, ${Number(it.lng).toFixed(4)}` }),
        el('button', { type:'button', class:'clear', title:'Quitar coordenadas',
          'aria-label':'Quitar lugar seleccionado',
          html: svg('close'),
          onclick: () => { it.lat = null; it.lng = null; it.gmaps_url = ''; refreshSelectedPlace(); }
        }),
      ]));
    };

    const placeBlock = el('div', { id:'place-block' }, [
      el('div', { class:'form-row' }, [
        el('label', { text:'Buscar lugar (online)' }),
        el('input', { id:'f-search', type:'text', placeholder:'Ej. Museo del Prado Madrid',
          oninput: (e) => { clearTimeout(searchTimer); searchTimer = setTimeout(() => doSearch(e.target.value), 800); } }),
        el('div', { id:'plan-search-results', class:'search-results', style:{display:'block'} }),
        selectedPlaceBlock,
        el('div', { class:'field-hint', text:'Si no encuentras, escribe los campos manualmente abajo.' }),
      ]),
      el('div', { class:'form-row' }, [
        el('label', { text:'Lugar' }),
        el('input', { id:'f-place', type:'text', value: it.place_name || '' }),
      ]),
      el('div', { class:'form-row' }, [
        el('label', { text:'Dirección' }),
        el('input', { id:'f-address', type:'text', value: it.address || '' }),
      ]),
      el('div', { class:'form-row' }, [
        el('label', { text:'Zona / población (para agrupar gastos)' }),
        el('input', { id:'f-zona', type:'text', value: it.zona || '', placeholder:'Ej. Benidorm, Villalba…' }),
        el('div', { class:'field-hint', text:'Opcional. Agrupa en el presupuesto los gastos de este evento por esta zona (si está vacío, se usa el Lugar).' }),
      ]),
    ]);
    const refreshPlaceVisibility = () => {
      const type = $('#f-type')?.value || it.type;
      placeBlock.style.display = TYPES_WITH_PLACE.includes(type) ? '' : 'none';
    };

    // Bloque "visita": duración estimada (ajusta el aviso de "no da tiempo") y modo
    // de transporte para llegar a esta parada (afecta al tiempo del tramo previo).
    const VISIT_TYPES_LOCAL = ['lugar', 'personas', 'playa', 'comida', 'compras', 'actividad', 'otro', 'gestion'];
    const arriveSel = el('select', { id:'f-arrive-mode' }, [
      el('option', { value:'auto',    text:'Automático' }),
      el('option', { value:'walk',    text:'🚶 A pie' }),
      el('option', { value:'car',     text:'🚗 Coche' }),
      el('option', { value:'transit', text:'🚇 Transporte público' }),
      el('option', { value:'bike',    text:'🚴 Bici' }),
    ]);
    arriveSel.value = (it.metadata && it.metadata.arrive_mode) || 'auto';
    const travelBlock = el('div', { id:'travel-block' }, [
      el('div', { class:'form-grid-2' }, [
        el('div', { class:'form-row' }, [
          el('label', { text:'Duración de la visita (min)' }),
          el('input', { id:'f-duration', type:'number', min:'0', step:'5', inputmode:'numeric',
            value: (it.metadata && it.metadata.duration_min != null ? it.metadata.duration_min : ''),
            placeholder: String(VISIT_MIN[it.type] != null ? VISIT_MIN[it.type] : 60) }),
        ]),
        el('div', { class:'form-row' }, [
          el('label', { text:'Cómo llegas aquí' }),
          arriveSel,
        ]),
      ]),
      el('div', { class:'field-hint', text:'La duración ajusta el aviso de “quizá no dé tiempo”. El modo se usa para el tiempo del trayecto hasta esta parada.' }),
    ]);
    const refreshTravelVisibility = () => {
      const type = $('#f-type')?.value || it.type;
      travelBlock.style.display = VISIT_TYPES_LOCAL.includes(type) ? '' : 'none';
    };

    // Selector de color del borde (solo lugar/playa) — verde/amarillo/rojo o sin color.
    // Marca cuánta certeza tienes sobre incluir esa parada (sin tocar el fondo de la card).
    let currentBorder = it.border_color || null;
    const borderBlock = el('div', { class:'form-row', id:'border-block' });
    const renderBorderPicker = () => {
      const type = $('#f-type')?.value || it.type;
      const visible = (type === 'lugar' || type === 'playa');
      borderBlock.style.display = visible ? '' : 'none';
      if (!visible) return;
      borderBlock.innerHTML = '';
      borderBlock.appendChild(el('label', { text:'Color del borde (opcional)' }));
      const grid = el('div', { class:'border-color-grid' });
      // Opción "ninguno"
      const noneActive = !currentBorder;
      grid.appendChild(el('button', {
        type:'button',
        class:'border-color-swatch b-ninguno' + (noneActive ? ' active' : ''),
        'aria-pressed': noneActive ? 'true' : 'false',
        onclick: () => { currentBorder = null; renderBorderPicker(); }
      }, [
        el('div', { class:'dot' }),
        el('span', { text:'Sin marcar' }),
      ]));
      BORDER_COLORS.forEach(c => {
        const active = currentBorder === c.id;
        grid.appendChild(el('button', {
          type:'button',
          class:`border-color-swatch b-${c.id}` + (active ? ' active' : ''),
          'aria-pressed': active ? 'true' : 'false',
          title: c.hint,
          onclick: () => { currentBorder = c.id; renderBorderPicker(); }
        }, [
          el('div', { class:'dot' }),
          el('span', { text: c.label }),
        ]));
      });
      borderBlock.appendChild(grid);
      borderBlock.appendChild(el('div', { class:'field-hint', text:'Verde = sitio seguro; amarillo = dudoso/a mover; rojo = quitar o no visto. Solo se colorea el borde.' }));
    };

    // --- Personas (con quién): chips toggleables + añadir nueva ---
    let currentPeople = Array.isArray(it.people) ? [...it.people] : [];
    // Recordatorio de gasto pendiente (⚠️ en la pill + listado en Presupuesto).
    let currentExpenseReminder = !!it.expense_reminder;
    const refreshExpenseReminderUI = () => {
      const btn = document.getElementById('f-expense-remind');
      if (btn) {
        btn.classList.toggle('on', currentExpenseReminder);
        btn.setAttribute('aria-pressed', currentExpenseReminder ? 'true' : 'false');
      }
    };
    const peopleBlock = el('div', { class:'form-row', id:'people-block' });
    const addPerson = () => {
      const inp = document.getElementById('person-new');
      const name = (inp?.value || '').trim();
      if (!name) return;
      if (!currentPeople.includes(name)) currentPeople.push(name);
      if (!tripPeople.includes(name)) tripPeople.push(name);
      if (inp) inp.value = '';
      renderPeople();
    };
    const personChip = (name) => {
      const active = currentPeople.includes(name);
      return el('button', { type:'button', class:'person-chip' + (active ? ' active' : ''),
        onclick: (e) => { e.preventDefault(); currentPeople = active ? currentPeople.filter(n => n !== name) : [...currentPeople, name]; renderPeople(); } },
        [ el('span', { class:'tic', html: active ? svg('check') : '' }), el('span', { text: name }) ]);
    };
    const peopleAddRow = (placeholder) => el('div', { class:'people-add' }, [
      el('input', { id:'person-new', type:'text', placeholder,
        onkeydown: (e) => { if (e.key === 'Enter') { e.preventDefault(); addPerson(); } } }),
      el('button', { type:'button', class:'btn btn-sm', onclick: addPerson }, [ el('span', { html: svg('plus') }), 'Añadir' ]),
    ]);
    const renderPeople = () => {
      peopleBlock.innerHTML = '';
      const type = $('#f-type')?.value || it.type;
      const names = [...new Set([...tripPeople, ...currentPeople])].sort((a,b) => a.localeCompare(b,'es'));

      // ---- Tipo "Personas": pills de las 4 más comunes + desplegable multi-selección ----
      if (type === 'personas') {
        peopleBlock.appendChild(el('label', { text:'Personas' }));
        const quick = topPeople.length ? topPeople : names.slice(0, 4);
        if (quick.length) {
          peopleBlock.appendChild(el('div', { class:'people-chips' }, quick.map(personChip)));
        }
        const n = currentPeople.length;
        const details = el('details', { class:'people-dropdown', open: personasDropdownOpen ? '' : null,
          ontoggle: (e) => { personasDropdownOpen = e.target.open; } }, [
          el('summary', {}, n ? `${n} persona${n > 1 ? 's' : ''} seleccionada${n > 1 ? 's' : ''}` : 'Seleccionar personas'),
          names.length
            ? el('div', { class:'people-chips', style:{marginTop:'10px'} }, names.map(personChip))
            : el('div', { class:'field-hint', style:{marginTop:'8px'}, text:'Aún no hay personas en el viaje. Añade una abajo.' }),
        ]);
        peopleBlock.appendChild(details);
        peopleBlock.appendChild(peopleAddRow('Añadir persona nueva…'));
        return;
      }

      // ---- Resto de tipos: "con quién" tal cual (sin cambios) ----
      peopleBlock.appendChild(el('label', { text:'Personas (con quién)' }));
      if (names.length) {
        peopleBlock.appendChild(el('div', { class:'people-chips' }, names.map(personChip)));
      }
      peopleBlock.appendChild(peopleAddRow('Añadir persona…'));
    };

    // --- Importador local: pegar el texto de una confirmación y autocompletar ---
    const applyParsed = () => {
      const txt = document.getElementById('paste-import-text')?.value || '';
      const parsed = ReservationParser.parse(txt);
      if (!parsed || !parsed.type) { UI.toast('No reconocí los datos. Rellena a mano.'); return; }
      const fType = document.getElementById('f-type');
      if (fType) fType.value = parsed.type;
      it.type = parsed.type;
      it.metadata = Object.assign({}, it.metadata, parsed.metadata || {});
      if (parsed.day_date) it.day_date = parsed.day_date;
      if (parsed.checkin)  { it.consultation_planned_d1 = parsed.checkin;  if (parsed.checkinTime)  it.consultation_planned_t1 = parsed.checkinTime; }
      if (parsed.checkout) { it.consultation_planned_d2 = parsed.checkout; if (parsed.checkoutTime) it.consultation_planned_t2 = parsed.checkoutTime; }
      if (parsed.type === 'vuelo' || parsed.type === 'transporte') { if (parsed.day_date) it.consultation_planned_d1 = it.consultation_planned_d1 || parsed.day_date; if (parsed.time) it.consultation_planned_t1 = it.consultation_planned_t1 || parsed.time; }
      // Re-render de todo lo dependiente del tipo (recrea inputs leyendo de `it`).
      renderConsultationDates(); renderStatusPicker(); refreshTimeVisibility();
      refreshHotelDatesVisibility(); refreshTzVisibility(); renderMetadata();
      refreshPlaceVisibility(); refreshTravelVisibility(); refreshStandaloneTime(); renderBorderPicker();
      const setV = (id, v) => { const e = document.getElementById(id); if (e && v != null && v !== '') e.value = v; };
      if (parsed.title)      setV('f-title', parsed.title);
      if (parsed.day_date)   setV('f-day', parsed.day_date);
      if (parsed.time)       { setV('f-time', parsed.time); setV('f-time-alt', parsed.time); }
      if (parsed.place_name) setV('f-place', parsed.place_name);
      UI.toast(`Detectado: ${parsed.label || typeDef(parsed.type).label}`);
    };

    // --- Vuelo de vuelta: clona invirtiendo origen/destino, conserva pasajeros, compañía
    //     y localizador, y abre un cuadro nuevo para el resto. ---
    const buildReturnFlight = () => {
      collect();
      const md = it.metadata || {};
      const ret = {
        id: uuid(), trip_id: t.id, type:'vuelo',
        day_date:null, time:'', title:'',
        place_name:'', lat:null, lng:null, gmaps_url:'', address:'', notes:'', order_index:0,
        status:'por_iniciar', in_consultation:false,
        consultation_url:'', consultation_price:null, consultation_currency: it.consultation_currency || t.default_currency || 'EUR',
        consultation_query_date: todayIso(),
        consultation_planned_d1:null, consultation_planned_t1:null, consultation_planned_d2:null, consultation_planned_t2:null,
        origin_tz: it.dest_tz || null, dest_tz: it.origin_tz || null,
        people: Array.isArray(currentPeople) ? [...currentPeople] : [],
        metadata: {
          aerolinea: md.aerolinea || '',
          localizador: md.localizador || '',
          url: md.url || '',
          origen: md.destino || '',
          destino: md.origen || '',
          asientos: Array.isArray(md.asientos) ? md.asientos.map(s => ({ nombre: s.nombre || '', asiento:'' })).filter(s => s.nombre) : undefined,
        },
      };
      UI.closeSheet();
      setTimeout(() => TripDetail.openPlanningEditor(t, ret), 280);
    };

    // --- Duplicar: copia exacta (nuevo id) y abre un cuadro nuevo para modificar
    //     lo que se quiera (p. ej. cambiar el día). ---
    const duplicatePlan = () => {
      collect();
      const copy = JSON.parse(JSON.stringify(it));
      copy.id = uuid();
      copy.visited = false; copy.visited_at = null;
      delete copy.created_at; delete copy.updated_at;
      UI.closeSheet();
      setTimeout(() => TripDetail.openPlanningEditor(t, copy), 280);
    };

    const returnFlightWrap = el('div', { class:'form-row', id:'return-flight-wrap', style:{display:'none'} }, [
      el('button', { type:'button', class:'btn btn-sm', onclick: buildReturnFlight }, [ el('span', { html: svg('plane') }), 'Añadir vuelo de vuelta' ]),
      el('div', { class:'field-hint', text:'Crea un vuelo nuevo con origen/destino invertidos y los mismos pasajeros, compañía y localizador. Rellenas fechas, nº y asientos en el cuadro nuevo.' }),
    ]);

    // Importador de reservas: solo tiene sentido en tipos con reserva
    // (vuelo, alojamiento, transporte, coche, actividad). Oculto en el resto.
    const importBlock = el('details', { class:'paste-import', id:'import-block' }, [
      el('summary', {}, [ el('span', { html: svg('download') }), ' Pegar una reserva y autocompletar' ]),
      el('p', { class:'field-hint', style:{margin:'8px 0'}, text:'Pega el texto de un email/confirmación de vuelo, hotel o tren. Detecto tipo, ruta, nº, fechas, hora, asientos y localizador (lo que encuentre). Revisa siempre antes de guardar.' }),
      el('textarea', { id:'paste-import-text', rows:'4', placeholder:'Ej: Vuelo AV9899 BOG-MAD 11/06/2026 20:35h · Localizador ABC123 · Asientos 25J, 25K' }),
      el('div', { style:{marginTop:'8px'} }, [
        el('button', { type:'button', class:'btn btn-sm btn-primary', onclick: applyParsed }, [ el('span', { html: svg('check') }), 'Analizar y autocompletar' ]),
      ]),
    ]);
    const refreshImportVisibility = () => {
      const td = typeDef($('#f-type')?.value || it.type);
      importBlock.style.display = td.requiresBooking ? '' : 'none';
    };

    // Selector de tipo — al cambiar, se reconstruye todo lo dependiente.
    const typeRow = el('div', { class:'form-row' }, [
      el('label', { text:'Tipo' }),
      el('select', { id:'f-type', onchange: () => {
        const td = typeDef($('#f-type').value);
        // Actividad arranca sin estado (color morado de tipo); si traía el "por iniciar"
        // por defecto de otra reserva, lo limpiamos.
        if (td.id === 'actividad' && currentStatus === 'por_iniciar') currentStatus = null;
        if (td.requiresBooking && td.id !== 'actividad' && !currentStatus) currentStatus = 'por_iniciar';
        if (!td.requiresBooking) currentStatus = null;
        renderDatesBlock();
        renderStatusPicker();
        refreshTzVisibility();
        renderMetadata();
        refreshPlaceVisibility();
        refreshTravelVisibility();
        refreshImportVisibility();
        renderBorderPicker();
        renderPeople();
      }},
        TYPES_PLANNING.map(o => el('option', { value:o.id, selected: it.type===o.id?true:null }, o.label))
      ),
    ]);

    const body = el('div', {}, [
      // 1) Tipo — arriba del todo (define qué campos aplican).
      typeRow,
      // 2) Título.
      el('div', { class:'form-row' }, [
        el('label', { text:'Título (auto si lo dejas vacío)' }),
        el('input', { id:'f-title', type:'text', value: it.title || '' }),
      ]),
      // 3) Fecha y hora (Día + Hora uno al lado del otro).
      datesBlock,
      // 4) Lugar + búsqueda + dirección.
      placeBlock,
      // 4b) Duración de visita + cómo llegas.
      travelBlock,
      // 5) Personas (con quién).
      peopleBlock,
      // ---- resto de campos ----
      // Importador de reservas (solo tipos con reserva).
      importBlock,
      // Estado
      statusRow,
      // Datos específicos del tipo (aerolínea, asientos, habitación…)
      metadataBlock,
      // Acción "vuelo de vuelta" (solo vuelos)
      returnFlightWrap,
      // Zonas horarias (vuelo/transporte)
      tzBlock,
      // Color de la tarjeta (override libre)
      colorRow,
      // Notas
      el('div', { class:'form-row' }, [
        el('label', { text:'Notas' }),
        el('textarea', { id:'f-notes' }, it.notes || ''),
      ]),
      consultaBlock,
      el('div', { class:'form-row', id:'f-amount-row' }, [
        el('div', { style:{display:'flex', alignItems:'center', gap:'10px', flexWrap:'wrap'} }, [
          el('label', { text:'Importe asociado (crea gasto)', style:{margin:0} }),
          el('div', { class:'gap' }),
          // Toggle manual del recordatorio — por si descartaste sin querer.
          el('button', { type:'button', id:'f-expense-remind', class:'expense-remind-btn',
            title:'Recordarme añadir el gasto', 'aria-pressed': currentExpenseReminder ? 'true':'false',
            onclick: () => { currentExpenseReminder = !currentExpenseReminder; refreshExpenseReminderUI(); } },
            [ el('span', { text:'⚠️' }), el('span', { text:'Recordar gasto' }) ]),
        ]),
        // Concepto opcional — por defecto el título de la parada al guardar si lo dejas vacío
        el('input', { id:'f-concept', type:'text', placeholder:'Concepto (por defecto: título)',
          value: linkedBudget?.concept || '', style:{marginTop:'8px'} }),
        el('div', { class:'form-grid-2', style:{marginTop:'8px'} }, [
          el('input', { id:'f-amount', type:'number', step:'0.01', placeholder:'0,00',
            value: linkedBudget ? String(linkedBudget.amount) : '' }),
          el('input', { id:'f-cur', type:'text', placeholder:t.default_currency || 'EUR',
            value: linkedBudget ? (linkedBudget.currency || t.default_currency || 'EUR') : (t.default_currency || 'EUR') }),
        ]),
        el('div', { class:'field-hint', text:'Opcional. Si pones importe se crea un gasto vinculado en estado "planeado". Vacíalo a 0 para eliminarlo.' }),
        // Banner de advertencia (oculto) — aparece al guardar sin gasto en un evento nuevo.
        el('div', { id:'f-expense-warn', class:'expense-warn', style:{display:'none'} }, [
          el('div', { class:'expense-warn-msg' }, [ el('span', { text:'⚠️' }), el('span', { text:'No has añadido ningún gasto a este evento.' }) ]),
          el('div', { class:'expense-warn-actions' }, [
            el('button', { type:'button', class:'btn btn-sm btn-primary', id:'ew-add' }, 'Añadir gasto'),
            el('button', { type:'button', class:'btn btn-sm', id:'ew-remind' }, [ el('span',{text:'⚠️'}), 'Recordar más tarde' ]),
            el('button', { type:'button', class:'btn btn-sm btn-ghost', id:'ew-discard' }, 'Descartar' ),
          ]),
        ]),
      ]),
    ]);
    setTimeout(refreshExpenseReminderUI, 0);
    setTimeout(() => {
      renderConsultationDates(); renderStatusPicker();
      refreshTimeVisibility(); refreshHotelDatesVisibility(); refreshTzVisibility();
      renderMetadata(); refreshPlaceVisibility(); refreshTravelVisibility(); refreshStandaloneTime();
      renderBorderPicker(); refreshSelectedPlace(); renderPeople();
      refreshImportVisibility();
    }, 0);

    const collect = () => {
      const type = $('#f-type').value;
      let title = ($('#f-title').value || '').trim();
      // Si no hay título, generar uno por defecto según el tipo y los datos disponibles
      if (!title) {
        if (type === 'personas') {
          title = currentPeople.length ? fmtList(currentPeople) : 'Personas';
        } else {
          title = TripDetail._defaultTitle(type, t);
          if (!title) { UI.toast('Pon un título'); return false; }
        }
      }
      it.title = title;
      it.type = type;
      const td = typeDef(it.type);
      const isRange = ['hotel','vuelo','transporte','coche'].includes(it.type);
      if (isRange) {
        // Bloque unificado Desde/Hasta (tr-*). El día base = salida/entrada; la hora del
        // item = hora de salida (para vuelo/transporte). Hotel oculta la hora del item.
        const d1 = $('#tr-d1')?.value || null;
        const t1 = $('#tr-t1')?.value || null;
        const d2 = $('#tr-d2')?.value || null;
        const t2 = $('#tr-t2')?.value || null;
        it.consultation_planned_d1 = d1;
        it.consultation_planned_t1 = t1;
        it.consultation_planned_d2 = d2;
        it.consultation_planned_t2 = t2;
        it.day_date = d1 || it.day_date || null;
        it.time = td.hideTime ? null : (t1 || null);
        it.end_time = null;
      } else {
        it.day_date = $('#f-day')?.value || null;
        it.time = td.hideTime ? null : ($('#f-time')?.value || null);
        it.end_time = isSpanType(it.type) ? (($('#f-end-time')?.value || '').trim() || null) : null;
      }
      // place_name / address: solo si el tipo los expone
      const TYPES_WITH_PLACE_LOCAL = ['lugar', 'personas', 'playa', 'comida', 'compras', 'hotel', 'actividad', 'otro', 'gestion'];
      if (TYPES_WITH_PLACE_LOCAL.includes(it.type)) {
        it.place_name = $('#f-place')?.value.trim() || null;
        it.address = $('#f-address')?.value.trim() || null;
        it.zona = $('#f-zona')?.value.trim() || null;
      } else {
        // Para vuelo/coche/transporte mantenemos los valores anteriores si los había
        // (no hay UI para editarlos directamente). Pueden venir del buscador Nominatim.
      }
      it.notes = $('#f-notes').value;
      it.people = currentPeople.filter(Boolean);
      if (it.lat != null) it.gmaps_url = gmapsUrl(it.lat, it.lng);

      // Metadata específica del tipo
      const metaDef = PLANNING_METADATA[it.type];
      if (metaDef) {
        const meta = {};
        metaDef.fields.forEach(f => {
          if (f.type === 'seats') {
            // Repetidor: recolectar filas (nombre, asiento)
            const rows = Array.from(document.querySelectorAll('#meta-seats-wrap .seats-row'));
            const seats = rows.map(r => ({
              nombre:  (r.querySelector('.seat-name')?.value  || '').trim(),
              asiento: (r.querySelector('.seat-seat')?.value  || '').trim(),
            })).filter(s => s.nombre || s.asiento);
            if (seats.length) meta.asientos = seats;
          } else {
            const v = ($(`#meta-${f.id}`)?.value || '').trim();
            if (v) meta[f.id] = v;
          }
        });
        it.metadata = meta;
      } else {
        it.metadata = {};
      }
      // Duración de visita + modo de llegada (se guardan en metadata jsonb, que sí
      // sincroniza). Solo para tipos que son "visitas".
      const VISIT_TYPES_SAVE = ['lugar', 'personas', 'playa', 'comida', 'compras', 'actividad', 'otro', 'gestion'];
      if (VISIT_TYPES_SAVE.includes(it.type)) {
        const durRaw = ($('#f-duration')?.value || '').trim();
        const dur = durRaw === '' ? null : Math.max(0, parseInt(durRaw, 10));
        if (dur != null && !isNaN(dur)) it.metadata.duration_min = dur; else delete it.metadata.duration_min;
        const am = $('#f-arrive-mode')?.value || 'auto';
        if (am && am !== 'auto') it.metadata.arrive_mode = am; else delete it.metadata.arrive_mode;
      }
      // Día de fin (cualquier tipo puntual): por si el evento dura varios días. En metadata jsonb.
      if (isSpanType(it.type)) {
        const ed = ($('#f-end-day')?.value || '').trim();
        if (ed && ed > it.day_date) it.metadata.end_date = ed; else delete it.metadata.end_date;
      }
      // Zonas horarias (vuelos / transporte intercontinental)
      if (it.type === 'vuelo' || it.type === 'transporte') {
        it.origin_tz = ($('#f-origin-tz')?.value || '').trim() || null;
        it.dest_tz = ($('#f-dest-tz')?.value || '').trim() || null;
      } else {
        it.origin_tz = null; it.dest_tz = null;
      }
      // Status — guardamos el valor elegido tal cual (incluido 'ninguno' = Sin estado).
      it.status = (td.requiresBooking || td.supportsStatus) ? (currentStatus || 'ninguno') : null;
      it.in_consultation = (it.status === 'en_consulta'); // legacy compat
      // Color personalizado de la tarjeta (override libre; null = según tipo/estado).
      it.custom_color = currentCardColor || null;
      // [DEPRECATED] `border_color` (legacy) ya no se escribe desde el editor.
      // El override de color se gestiona desde la card vía paleta (custom_color).
      it.border_color = null;
      // Datos de consulta/reserva (precio/enlace) — solo precio/url aquí; las fechas
      // (consultation_planned_*) ya se han recogido arriba desde el bloque unificado.
      if (td.requiresBooking) {
        it.consultation_url = ($('#cq-url')?.value || '').trim() || null;
        it.consultation_query_date = $('#cq-date')?.value || null;
        const priceRaw = $('#cq-price')?.value;
        it.consultation_price = (priceRaw === '' || priceRaw == null) ? null : (parseFloat(priceRaw) || 0);
        it.consultation_currency = ($('#cq-cur')?.value || 'EUR').toUpperCase();
        if (!it.day_date && it.consultation_planned_d1) it.day_date = it.consultation_planned_d1;
      }
      return true;
    };

    // Persiste el item + gasto vinculado, cierra el editor y MANTIENE la posición de
    // scroll (no salta arriba; te deja en el día donde estabas).
    const persistAndClose = async () => {
      try {
        // Si hay importe, el gasto está puesto → no queda recordatorio pendiente.
        const amtRaw0 = ($('#f-amount')?.value || '').trim();
        const amt0 = parseFloat(amtRaw0);
        if (!isNaN(amt0) && amt0 > 0) currentExpenseReminder = false;
        it.expense_reminder = currentExpenseReminder;
        await DB.put('planning_items', it);
        if (!it.in_consultation) {
          const amtRaw = amtRaw0;
          const amt = parseFloat(amtRaw);
          const cur = (($('#f-cur').value || '').trim() || 'EUR').toUpperCase();
          const concept = ($('#f-concept')?.value || '').trim() || it.title;
          if (linkedBudget) {
            if (amtRaw === '' || isNaN(amt) || amt <= 0) {
              await DB.remove('budget_items', linkedBudget.id);
            } else {
              const rate = FX.rateToEur(cur) ?? 1;
              linkedBudget.amount = amt; linkedBudget.currency = cur; linkedBudget.rate_to_eur = rate;
              linkedBudget.amount_eur = +(amt * rate).toFixed(2); linkedBudget.concept = concept; linkedBudget.date = it.day_date;
              await DB.put('budget_items', linkedBudget);
            }
          } else if (!isNaN(amt) && amt > 0) {
            const rate = FX.rateToEur(cur) ?? 1;
            await DB.put('budget_items', {
              id: uuid(), trip_id: t.id, planning_item_id: it.id,
              category: budgetCategoryForType(it.type),
              concept, amount: amt, currency: cur,
              rate_to_eur: rate, amount_eur: +(amt * rate).toFixed(2),
              status: 'planeado', date: it.day_date,
            });
          }
        }
        UI.toast('Guardado');
        try { Notifications.scheduleAll(); } catch (_) {}
      } catch (err) { console.error(err); UI.toast('Error al guardar'); }
      finally {
        const sy = window.scrollY;
        UI.closeSheet();
        await Router.render();
        requestAnimationFrame(() => window.scrollTo(0, sy));
        setTimeout(() => window.scrollTo(0, sy), 90);
        // Permite a quien abrió el editor (p. ej. la vista tarjetas) refrescarse.
        if (opts && typeof opts.onSaved === 'function') { try { opts.onSaved(); } catch (_) {} }
      }
    };

    const save = el('button', { class:'btn btn-primary', onclick: async () => {
      if (!collect()) return;
      const amtRaw = ($('#f-amount')?.value || '').trim();
      const hasAmount = amtRaw !== '' && !isNaN(parseFloat(amtRaw)) && parseFloat(amtRaw) > 0;
      // Con importe, ya marcado "recordar", o editando un evento existente → guardar directo.
      if (hasAmount || currentExpenseReminder || existing) return persistAndClose();
      // Evento NUEVO sin gasto → avisar con 3 opciones.
      const warn = document.getElementById('f-expense-warn');
      if (!warn) return persistAndClose();
      warn.style.display = 'block';
      warn.scrollIntoView({ behavior:'smooth', block:'center' });
      document.getElementById('ew-add').onclick = () => {
        warn.style.display = 'none';
        const a = document.getElementById('f-amount'); a?.scrollIntoView({ behavior:'smooth', block:'center' }); a?.focus();
      };
      document.getElementById('ew-remind').onclick = () => { currentExpenseReminder = true; persistAndClose(); };
      document.getElementById('ew-discard').onclick = () => { currentExpenseReminder = false; persistAndClose(); };
    }}, 'Guardar');

    // El botón Confirmar aparece si existe y su estado es por_iniciar o en_consulta
    const confirmBtn = (existing && typeDef(it.type).requiresBooking && (currentStatus === 'en_consulta' || currentStatus === 'por_iniciar')) ? el('button', {
      class:'btn', style:{background:'var(--status-curso)', color:'#fff', borderColor:'transparent'},
      onclick: async () => {
        try { if (!collect()) return; await DB.put('planning_items', it); }
        catch (err) { console.error(err); }
        UI.closeSheet();
        setTimeout(() => TripDetail.openConfirmPlanning(t, it), 280);
      }
    }, [ el('span', { html: svg('check') }), 'Confirmar' ]) : null;

    const delBtn = existing ? el('button', { class:'btn btn-danger', onclick: async () => {
      const ok = await UI.confirm('¿Borrar esta parada? Irá a la papelera; podrás recuperarla desde "Editar viaje".');
      if (!ok) return;
      await DB.remove('planning_items', it.id);
      UI.closeSheet(); UI.toast('A papelera'); Router.render();
    }}, 'Borrar') : null;

    // Duplicar — disponible al editar un evento existente.
    const dupBtn = existing ? el('button', { class:'btn btn-ghost', onclick: duplicatePlan },
      [ el('span', { html: svg('copy') }), 'Duplicar' ]) : null;

    UI.openSheet({
      title: existing ? 'Editar parada' : 'Nueva parada',
      body,
      footer:[delBtn, dupBtn, el('button', { class:'btn btn-ghost', onclick: () => UI.closeSheet() }, 'Cancelar'), confirmBtn, save].filter(Boolean),
    });
  },

  // Marca/desmarca un item del planning como "visto". Persistencia + actualización
  // visual local sin re-render — así no se pierde la posición de scroll.
  // === Migración silenciosa `border_color` (legacy) → `custom_color` (HEX) ===
  // El campo antiguo `border_color` solo aceptaba 3 valores ('verde'|'amarillo'|'rojo')
  // y solo afectaba a items de tipo lugar/playa. El nuevo `custom_color` es un
  // HEX libre aplicable a cualquier tipo. Esta pasada copia los legacy y limpia
  // el campo `border_color`, todo sin hacer ruido. Se ejecuta al cargar el
  // planning del trip. Si ya hay `custom_color`, no se pisa.
  _migrationCount: 0,
  async _migrateBorderColorToCustom(rawItems) {
    const map = { verde:'#10b981', amarillo:'#f59e0b', rojo:'#ef4444' };
    let n = 0;
    for (const r of rawItems) {
      if (!r) continue;
      const legacy = r.border_color;
      if (legacy && !r.custom_color && map[legacy]) {
        r.custom_color = map[legacy];
        r.border_color = null;
        try { await DB.put('planning_items', r); n++; } catch(_) {}
      } else if (legacy && r.custom_color) {
        // Ya tenía custom_color: solo limpiamos el legacy para no acumular ruido.
        r.border_color = null;
        try { await DB.put('planning_items', r); } catch(_) {}
      }
    }
    TripDetail._migrationCount += n;
    if (n > 0) console.info(`[planning] migrados ${n} border_color → custom_color`);
  },

  // === Override de color de la tarjeta (paleta) ============================
  // Abre un sheet con swatches predefinidos (paleta `--tipo-*`) + selector de
  // color libre + botón "Quitar override". Guarda en `planning_items.custom_color`.
  openCardColorPicker(t, it) {
    if (!canEdit()) { UI.toast('Modo lector — no puedes modificar'); return; }
    // Paleta de presets — los mismos colores base de los tipos. El usuario puede
    // pintar cualquier tarjeta con cualquier color (no obliga a respetar el tipo).
    const presets = [
      { hex:'#3b82f6', label:'Azul'      },
      { hex:'#a855f7', label:'Morado'    },
      { hex:'#15803d', label:'Verde'     },
      { hex:'#0ea5e9', label:'Cian'      },
      { hex:'#14b8a6', label:'Turquesa'  },
      { hex:'#f97316', label:'Coral'     },
      { hex:'#eab308', label:'Amarillo'  },
      { hex:'#ec4899', label:'Rosa'      },
      { hex:'#ef4444', label:'Rojo'      },
      { hex:'#64748b', label:'Gris'      },
    ];
    let current = (typeof it.custom_color === 'string' && /^#[0-9a-f]{6}$/i.test(it.custom_color)) ? it.custom_color.toLowerCase() : null;

    const wrap = el('div', { class:'card-color-popover' });
    const grid = el('div', { class:'ccp-grid' });
    const renderSwatches = () => {
      grid.innerHTML = '';
      presets.forEach(p => {
        const active = current && current === p.hex.toLowerCase();
        const sw = el('button', {
          type:'button',
          class:'ccp-swatch' + (active ? ' active' : ''),
          'aria-pressed': active ? 'true' : 'false',
          title: p.label,
          onclick: () => { current = p.hex.toLowerCase(); renderSwatches(); },
        }, [
          el('div', { class:'ccp-chip' }),
          el('span', { text: p.label }),
        ]);
        sw.style.setProperty('--ccp-color', p.hex);
        grid.appendChild(sw);
      });
    };
    renderSwatches();
    wrap.appendChild(grid);

    // Selector libre + botón "Quitar override"
    const colorInput = el('input', {
      type:'color',
      value: current || '#3b82f6',
      onchange: (e) => { current = e.target.value.toLowerCase(); renderSwatches(); }
    });
    const row = el('div', { class:'ccp-row' }, [
      el('label', { for:'ccp-free', text:'Color libre' }),
      colorInput,
      el('span', { style:{flex:'1'} }),
      el('button', {
        type:'button', class:'btn btn-ghost',
        onclick: () => { current = null; colorInput.value = '#3b82f6'; renderSwatches(); }
      }, 'Quitar override'),
    ]);
    colorInput.id = 'ccp-free';
    wrap.appendChild(row);

    const save = el('button', { class:'btn btn-primary', onclick: async () => {
      const next = current; // null → quita override; HEX → fija
      it.custom_color = next;
      try {
        await DB.put('planning_items', it);
        UI.toast(next ? 'Color guardado' : 'Color por defecto restaurado');
        UI.closeSheet();
        // Refrescar la card en sitio sin re-renderizar todo el planning.
        const card = document.querySelector(`.timeline-item[data-id="${CSS.escape(it.id)}"]`);
        if (card) {
          card.classList.toggle('has-custom-color', !!next);
          if (next) card.style.setProperty('--card-color', next);
          else card.style.removeProperty('--card-color');
          const btn = card.querySelector('.color-btn');
          if (btn) {
            btn.classList.toggle('has-color', !!next);
            btn.title = next ? 'Cambiar color de la tarjeta' : 'Personalizar color de la tarjeta';
            if (next) btn.style.setProperty('--card-color', next);
            else btn.style.removeProperty('--card-color');
          }
        }
      } catch (e) {
        console.warn('openCardColorPicker save', e);
        UI.toast('No se pudo guardar el color');
      }
    } }, 'Guardar');
    const cancel = el('button', { class:'btn btn-ghost', onclick: () => UI.closeSheet() }, 'Cancelar');

    UI.openSheet({
      title:'Color de la tarjeta',
      body: wrap,
      footer:[cancel, save],
    });
  },

  async toggleVisited(it) {
    if (!canEdit()) { UI.toast('Modo lector — no puedes modificar'); return; }
    it.visited = !it.visited;
    it.visited_at = it.visited ? new Date().toISOString() : null;
    try {
      await DB.put('planning_items', it);
      // Buscar la card en el DOM por su data-id y togglear las clases / botón.
      const card = document.querySelector(`.timeline-item[data-id="${CSS.escape(it.id)}"]`);
      if (card) {
        card.classList.toggle('visited', !!it.visited);
        const btn = card.querySelector('.li-actions button[aria-pressed]');
        if (btn) {
          btn.classList.toggle('btn-visited-on', !!it.visited);
          btn.setAttribute('aria-pressed', it.visited ? 'true' : 'false');
          btn.setAttribute('title', it.visited ? 'Marcar como no visto' : 'Marcar como visto');
        }
      }
      UI.toast(it.visited ? 'Marcado como visto' : 'Sin marcar');
    } catch (e) {
      console.warn('toggleVisited', e);
      it.visited = !it.visited; // revert estado en memoria
      UI.toast('No se pudo guardar');
    }
  },

  openConfirmPlanning(t, it) {
    if (!canEdit()) return;
    const tdef = it.type;
    const d1 = it.consultation_planned_d1 || it.day_date || todayIso();
    const d2 = it.consultation_planned_d2 || '';
    const t1 = it.consultation_planned_t1 || it.time || '';
    const t2 = it.consultation_planned_t2 || '';

    let dateFields;
    if (tdef === 'hotel') {
      dateFields = el('div', { class:'form-grid-2' }, [
        el('div', { class:'form-row' }, [ el('label',{text:'Check-in'}),  el('input',{id:'cf-d1', type:'date', value: d1 }) ]),
        el('div', { class:'form-row' }, [ el('label',{text:'Check-out'}), el('input',{id:'cf-d2', type:'date', value: d2 }) ]),
      ]);
    } else if (tdef === 'vuelo' || tdef === 'transporte') {
      dateFields = el('div', {}, [
        el('div', { class:'form-grid-2' }, [
          el('div', { class:'form-row' }, [ el('label',{text:'Salida'}),  el('input',{id:'cf-d1', type:'date', value: d1 }) ]),
          el('div', { class:'form-row' }, [ el('label',{text:'Hora salida'}), el('input',{id:'cf-t1', type:'time', value: t1 }) ]),
        ]),
        el('div', { class:'form-grid-2' }, [
          el('div', { class:'form-row' }, [ el('label',{text:'Llegada'}), el('input',{id:'cf-d2', type:'date', value: d2 || d1 }) ]),
          el('div', { class:'form-row' }, [ el('label',{text:'Hora llegada'}), el('input',{id:'cf-t2', type:'time', value: t2 }) ]),
        ]),
      ]);
    } else if (tdef === 'coche') {
      dateFields = el('div', { class:'form-grid-2' }, [
        el('div', { class:'form-row' }, [ el('label',{text:'Recogida'}),    el('input',{id:'cf-d1', type:'date', value: d1 }) ]),
        el('div', { class:'form-row' }, [ el('label',{text:'Devolución'}), el('input',{id:'cf-d2', type:'date', value: d2 }) ]),
      ]);
    } else {
      dateFields = el('div', { class:'form-grid-2' }, [
        el('div', { class:'form-row' }, [ el('label',{text:'Día'}),  el('input',{id:'cf-d1', type:'date', value: d1 }) ]),
        el('div', { class:'form-row' }, [ el('label',{text:'Hora'}), el('input',{id:'cf-t1', type:'time', value: t1 }) ]),
      ]);
    }

    const body = el('div', {}, [
      el('p', { class:'muted', style:{marginTop:0}, text:`Confirmando: ${it.title}` }),
      dateFields,
      el('div', { class:'form-grid-2' }, [
        el('div', { class:'form-row num' }, [
          el('label', { text:'Importe final' }),
          el('input', { id:'cf-amount', type:'number', step:'0.01', value: it.consultation_price ?? '' }),
        ]),
        el('div', { class:'form-row' }, [
          el('label', { text:'Moneda' }),
          el('input', { id:'cf-cur', type:'text', value: it.consultation_currency || t.default_currency || 'EUR' }),
        ]),
      ]),
      el('div', { class:'form-row' }, [
        el('label', { text:'Localizador / referencia (opcional)' }),
        el('input', { id:'cf-loc', type:'text', placeholder:'Ej. XB7H9K' }),
      ]),
      el('div', { class:'field-hint', text:'Al confirmar se quita el resaltado amarillo y se crea un gasto en el presupuesto (estado "reservado").' }),
    ]);

    const confirm = el('button', {
      class:'btn btn-primary',
      onclick: async () => {
        try {
          // Importe opcional: si no se pone (o es inválido/negativo), se queda a 0.
          let amount = parseFloat($('#cf-amount').value);
          if (isNaN(amount) || amount < 0) amount = 0;
          const currency = ($('#cf-cur').value || 'EUR').toUpperCase();
          const newD1 = $('#cf-d1')?.value || it.day_date;
          const newD2 = $('#cf-d2')?.value || null;
          const newT1 = $('#cf-t1')?.value || it.time;
          const newT2 = $('#cf-t2')?.value || null;
          const locator = $('#cf-loc')?.value?.trim() || null;

          it.status = 'confirmado';
          it.in_consultation = false;
          it.day_date = newD1;
          // Si el tipo oculta hora (hotel) no la usamos aunque cf-t1 venga rellenado
          it.time = typeDef(it.type).hideTime ? null : newT1;
          if (locator) it.notes = (it.notes ? it.notes + '\n' : '') + `Localizador: ${locator}`;
          await DB.put('planning_items', it);

          const rate = FX.rateToEur(currency) ?? 1;
          const budgetItem = {
            id: uuid(), trip_id: t.id, planning_item_id: it.id,
            category: budgetCategoryForType(it.type),
            concept: it.title, amount, currency,
            rate_to_eur: rate, amount_eur: +(amount * rate).toFixed(2),
            status: 'reservado', date: newD1,
          };
          await DB.put('budget_items', budgetItem);

          if (['vuelo','hotel','coche'].includes(it.type)) {
            const sd = { nombre: it.title };
            if (it.type === 'hotel') { if (newD1) sd.checkin = newD1; if (newD2) sd.checkout = newD2; }
            if (it.type === 'vuelo') { if (newD1) sd.fecha_salida = newD1; if (newT1) sd.hora_salida = newT1; if (newD2) sd.fecha_llegada = newD2; if (newT2) sd.hora_llegada = newT2; }
            if (it.type === 'coche') { if (newD1) sd.recogida = newD1; if (newD2) sd.devolucion = newD2; }
            if (locator) sd.localizador = locator;
            await DB.put('bookings', {
              id: uuid(), trip_id: t.id, type: it.type,
              structured_data: sd, ref_date: newD1, ref_time: newT1,
              doc_name: it.consultation_url ? `Enlace consulta` : null,
              doc_url: it.consultation_url || null,
            });
          }

          if (newD2 && newD2 !== newD1 && ['hotel','coche','vuelo'].includes(it.type)) {
            const t2title = it.type === 'hotel' ? `Hotel ${it.title}: Check-out`
              : it.type === 'coche' ? `Coche ${it.title}: Devolución`
              : `Vuelo ${it.title}: Llegada`;
            await DB.put('planning_items', {
              id: uuid(), trip_id: t.id, leg_id: null,
              day_date: newD2, time: typeDef(it.type).hideTime ? null : (newT2 || null),
              type: it.type, title: t2title, place_name: it.place_name,
              lat:null, lng:null, gmaps_url:null, address: it.address,
              notes: locator ? `Localizador: ${locator}` : '',
              order_index: 0, in_consultation: false, status: 'confirmado',
            });
          }

          UI.toast('Confirmado');
          UI.closeSheet();

          const others = (await DB.listByTrip('planning_items', t.id))
            .filter(p => p.id !== it.id && p.type === it.type
                     && (itemStatus(p) === 'en_consulta' || itemStatus(p) === 'por_iniciar')
                     && (p.day_date === newD1 || p.consultation_planned_d1 === newD1));
          if (others.length) {
            setTimeout(() => TripDetail._askDiscardOthers(t, it, others), 350);
          } else {
            Router.render();
          }
        } catch (err) {
          console.error('confirm planning', err);
          UI.toast('Error al confirmar');
          UI.closeSheet(); Router.render();
        }
      }
    }, [ el('span', { html: svg('check') }), 'Confirmar definitivamente' ]);

    UI.openSheet({
      title:'Confirmar reserva',
      body,
      footer:[el('button', { class:'btn btn-ghost', onclick: () => UI.closeSheet() }, 'Atrás'), confirm],
    });
  },

  _askDiscardOthers(t, confirmed, others) {
    const tdef = TYPES_PLANNING.find(p => p.id === confirmed.type)?.label || confirmed.type;
    const body = el('div', {}, [
      el('p', { text: `Tenías ${others.length} consulta${others.length>1?'s':''} más de tipo "${tdef}" para el mismo día. ¿Quieres moverlas a la papelera?` }),
      el('div', { class:'list', style:{marginTop:'12px'} },
        others.map(o => el('div', { class:'list-item' }, [
          el('div', { class:`dot-type ${o.type}`, style:{display:'inline-block'} }),
          el('div', { class:'li-main' }, [
            el('div', { class:'li-title', text: o.title }),
            el('div', { class:'li-sub', text: o.consultation_price != null && canSeeMoney()
              ? fmtMoney(o.consultation_price, o.consultation_currency || 'EUR') : 'Sin precio' }),
          ]),
        ]))
      ),
      el('div', { class:'field-hint', text:'Podrás recuperarlas desde "Editar viaje" → "Papelera".' }),
    ]);
    const yes = el('button', { class:'btn btn-danger', onclick: async () => {
      for (const o of others) await DB.remove('planning_items', o.id);
      UI.toast(`${others.length} consulta${others.length>1?'s':''} a papelera`);
      UI.closeSheet(); Router.render();
    }}, 'Sí, a papelera');
    const no = el('button', { class:'btn btn-ghost', onclick: () => { UI.closeSheet(); Router.render(); } }, 'Mantener');
    UI.openSheet({ title:'¿Eliminar las otras consultas?', body, footer:[no, yes] });
  },

  /* ----- Presupuesto ----- */
  async tabPresupuesto(root, t) {
    const items = (await DB.listByTrip('budget_items', t.id))
      .sort((a, b) => (b.date || '').localeCompare(a.date || ''));

    if (canEdit()) {
      root.appendChild(el('div', { class:'toolbar' }, [
        el('button', { class:'btn btn-primary', onclick: () => TripDetail.openBudgetEditor(t) }, [
          el('span', { html: svg('plus') }), 'Añadir gasto'
        ]),
        el('button', { class:'btn btn-sm', onclick: async () => {
          await FX.load(); UI.toast('Tasas actualizadas'); Router.render();
        }}, [ el('span', { html: svg('refresh') }), 'Actualizar tasas' ]),
      ]));
    }

    // Métricas
    const total = items.reduce((a, b) => a + (Number(b.amount_eur) || 0), 0);
    const paid  = items.filter(b => b.status === 'pagado').reduce((a, b) => a + (Number(b.amount_eur) || 0), 0);
    const reservado = items.filter(b => b.status === 'reservado').reduce((a, b) => a + (Number(b.amount_eur) || 0), 0);
    const pendiente = items.filter(b => b.status === 'planeado').reduce((a, b) => a + (Number(b.amount_eur) || 0), 0);
    const target = Number(t.budget_target) || 0;

    root.appendChild(el('div', { class:'metric-grid' }, [
      el('div', { class:'metric' }, [ el('div',{class:'label',text:'Total previsto'}), el('div',{class:'value',text:fmtMoney(total,'EUR')}) ]),
      el('div', { class:'metric' }, [ el('div',{class:'label',text:'Pagado'}), el('div',{class:'value',text:fmtMoney(paid,'EUR')}) ]),
      el('div', { class:'metric' }, [ el('div',{class:'label',text:'Reservado'}), el('div',{class:'value',text:fmtMoney(reservado,'EUR')}) ]),
      el('div', { class:'metric' }, [ el('div',{class:'label',text:'Por reservar'}), el('div',{class:'value',text:fmtMoney(pendiente,'EUR')}) ]),
    ]));

    // Eventos marcados "recordar añadir gasto" (⚠️). Clicables → abren el evento.
    const planning = await DB.listByTrip('planning_items', t.id).catch(() => []);
    const pendingExpense = planning.filter(p => p.expense_reminder);
    if (pendingExpense.length) {
      root.appendChild(el('h2', { class:'section-title', text:'Pendientes de añadir gasto' }));
      const list = el('div', { class:'list' });
      pendingExpense
        .sort((a,b) => (a.day_date||'').localeCompare(b.day_date||''))
        .forEach(p => {
          const td = typeDef(p.type);
          list.appendChild(el('div', { class:'list-item interactive', onclick: () => TripDetail.openPlanningEditor(t, p) }, [
            el('div', { class:'item-emoji', text: planEmoji(p) }),
            el('div', { class:'li-main' }, [
              el('div', { class:'li-title' }, [ el('span', { text:'⚠️ ' }), el('span', { text: p.place_name || p.title || td.label }) ]),
              el('div', { class:'li-sub', text: [ p.day_date ? fmtDateShort(p.day_date) : 'Sin fecha', p.time || '' ].filter(Boolean).join(' · ') }),
            ]),
            el('span', { class:'btn btn-sm', style:{pointerEvents:'none'}, text:'Añadir gasto' }),
          ]));
        });
      root.appendChild(list);
    }

    // Barra de progreso respecto al objetivo
    if (target > 0) {
      const pct = Math.min(100, (total / target) * 100);
      const over = total > target;
      root.appendChild(el('h2', { class:'section-title', text:'Progreso vs. objetivo' }));
      root.appendChild(el('div', { class:'card' }, el('div', { class:'card-body' }, [
        el('div', { class:'budget-progress' }, [
          el('div', { class:'budget-bar' }, el('div', {
            class:'budget-fill' + (over ? ' over' : ''),
            style:{ width: pct.toFixed(1) + '%' }
          })),
          el('div', { class:'budget-legend' }, [
            el('span', { class:'mono', text: fmtMoney(total, 'EUR') }),
            el('span', { class:'muted', text: ' / ' + fmtMoney(target, 'EUR') + (over ? ' (te has pasado)' : '') }),
          ]),
        ]),
      ])));
    }

    if (!items.length) {
      root.appendChild(el('div', { class:'empty' }, [
        el('div', { class:'icon', html: svg('money') }),
        el('h3', { text:'Sin gastos todavía' }),
        el('p', { text:'Añade los gastos a medida que los planifiques o ya los hayas pagado. Verás aquí el desglose por categoría.' }),
      ]));
      return;
    }

    // Donut + barras por categoría
    // Mismos colores que los tipos de planning (var --tipo-*) para que un gasto y su
    // evento compartan color: transporte azul oscuro, alojamiento verde, actividades morado…
    const CAT_COLORS = { transporte:'#1e40af', alojamiento:'#15803d', comida:'#f97316', actividades:'#a855f7', compras:'#ec4899', otros:'#64748b' };
    const byCat = {};
    items.forEach(i => { byCat[i.category] = (byCat[i.category] || 0) + (Number(i.amount_eur) || 0); });
    const maxVal = Math.max(1, ...Object.values(byCat));
    const totalByCat = Object.values(byCat).reduce((a, b) => a + b, 0) || 1;

    // Mapa evento→datos (para subdesglose de transporte y agrupado por lugar/zona).
    const planById = {};
    planning.forEach(p => { planById[p.id] = p; });
    // Subdesglose de "Transporte" por tipo del evento vinculado (vuelo/transporte/coche).
    const TR_LABEL = { vuelo:'Vuelo', transporte:'Transporte', coche:'Coche', otro:'Otro transporte' };
    const transBySub = {};
    items.filter(i => i.category === 'transporte').forEach(i => {
      const ev = planById[i.planning_item_id];
      const sub = (ev && ['vuelo', 'transporte', 'coche'].includes(ev.type)) ? ev.type : 'otro';
      transBySub[sub] = (transBySub[sub] || 0) + (Number(i.amount_eur) || 0);
    });

    const donutWrap = el('div', { class:'budget-split' });
    const NS = 'http://www.w3.org/2000/svg';
    const donut = document.createElementNS(NS, 'svg');
    donut.setAttribute('viewBox', '0 0 36 36'); donut.setAttribute('class', 'donut');
    const ring = document.createElementNS(NS, 'circle');
    ring.setAttribute('cx','18'); ring.setAttribute('cy','18'); ring.setAttribute('r','15.915');
    ring.setAttribute('fill','none'); ring.setAttribute('stroke','var(--bg-soft)'); ring.setAttribute('stroke-width','4');
    donut.appendChild(ring);
    let acc = 0;
    CATS_BUDGET.forEach(c => {
      const v = byCat[c.id] || 0; if (!v) return;
      const pct = (v / totalByCat) * 100;
      const arc = document.createElementNS(NS, 'circle');
      arc.setAttribute('cx','18'); arc.setAttribute('cy','18'); arc.setAttribute('r','15.915');
      arc.setAttribute('fill','none'); arc.setAttribute('stroke', CAT_COLORS[c.id] || '#94a3b8');
      arc.setAttribute('stroke-width','4');
      arc.setAttribute('stroke-dasharray', `${pct.toFixed(2)} ${(100 - pct).toFixed(2)}`);
      arc.setAttribute('stroke-dashoffset', (100 - acc).toFixed(2));
      arc.setAttribute('transform','rotate(-90 18 18)');
      donut.appendChild(arc);
      acc += pct;
    });
    const txt = document.createElementNS(NS, 'text');
    txt.setAttribute('x','18'); txt.setAttribute('y','19.5'); txt.setAttribute('text-anchor','middle');
    txt.setAttribute('class','donut-total');
    txt.textContent = fmtMoney(total, 'EUR');
    donut.appendChild(txt);
    donutWrap.appendChild(donut);

    const cont = el('div', { class:'budget-bars' });
    CATS_BUDGET.forEach(c => {
      const v = byCat[c.id] || 0; if (!v) return;
      const col = CAT_COLORS[c.id] || '#94a3b8';
      // "Transporte" se puede desplegar para ver el reparto por tipo (vuelo/tren/coche).
      const subEntries = (c.id === 'transporte')
        ? Object.entries(transBySub).filter(([, x]) => x > 0).sort((a, b) => b[1] - a[1])
        : [];
      const canExpand = subEntries.length > 1;

      const row = el('div', { class:'bar-row' + (canExpand ? ' bar-row-clickable' : '') }, [
        el('div', { class:'cat' }, [
          el('span', { style:{display:'inline-block', width:'8px', height:'8px', borderRadius:'50%', background: col, marginRight:'6px' } }),
          c.label,
          canExpand ? el('span', { class:'cat-caret', html: svg('chevron') }) : null,
        ].filter(Boolean)),
        el('div', { class:'bar-wrap' }, el('div', { class:'bar-fill', style:{ width: (v / maxVal * 100).toFixed(1) + '%', background: col } })),
        el('div', { class:'amount mono', text: fmtMoney(v, 'EUR') }),
      ]);

      if (!canExpand) { cont.appendChild(row); return; }

      const sub = el('div', { class:'bar-sub', style:{display:'none'} },
        subEntries.map(([k, x]) => el('div', { class:'bar-sub-row' }, [
          el('span', { class:'bar-sub-label', text: TR_LABEL[k] || k }),
          el('span', { class:'bar-sub-amount mono', text: fmtMoney(x, 'EUR') }),
        ]))
      );
      row.onclick = () => {
        const open = sub.style.display === 'none';
        sub.style.display = open ? '' : 'none';
        row.classList.toggle('open', open);
      };
      cont.appendChild(el('div', { class:'bar-group' }, [ row, sub ]));
    });
    donutWrap.appendChild(cont);
    root.appendChild(el('h2', { class:'section-title', text:'Por categoría' }));
    root.appendChild(donutWrap);

    // Por lugar — agrupa los gastos cuyo evento vinculado tiene un lugar/zona indicado
    // (p. ej. Villalba, Benidorm). Solo aparece si hay al menos un gasto con lugar.
    const placeOf = (i) => {
      const p = planById[i.planning_item_id];
      if (!p) return null;
      // La "Zona" del evento manda; si no hay, se usa el Lugar.
      const z = (p.zona ? String(p.zona).trim() : '');
      const nm = (p.place_name ? String(p.place_name).trim() : '');
      return z || nm || null;
    };
    const byPlace = {};
    items.forEach(i => { const pl = placeOf(i); if (pl) byPlace[pl] = (byPlace[pl] || 0) + (Number(i.amount_eur) || 0); });
    const placeEntries = Object.entries(byPlace).filter(([, v]) => v > 0).sort((a, b) => b[1] - a[1]);
    if (placeEntries.length) {
      const maxPlace = Math.max(1, ...placeEntries.map(e => e[1]));
      const PLACE_COLORS = ['#0ea5e9', '#a855f7', '#f97316', '#10b981', '#ec4899', '#14b8a6', '#f59e0b', '#6366f1'];
      root.appendChild(el('h2', { class:'section-title', text:'Por lugar' }));
      const placeCont = el('div', { class:'budget-bars' });
      placeEntries.forEach(([name, v], idx) => {
        const col = PLACE_COLORS[idx % PLACE_COLORS.length];
        placeCont.appendChild(el('div', { class:'bar-row' }, [
          el('div', { class:'cat' }, [
            el('span', { style:{display:'inline-block', width:'8px', height:'8px', borderRadius:'50%', background: col, marginRight:'6px'} }),
            name,
          ]),
          el('div', { class:'bar-wrap' }, el('div', { class:'bar-fill', style:{ width:(v / maxPlace * 100).toFixed(1) + '%', background: col } })),
          el('div', { class:'amount mono', text: fmtMoney(v, 'EUR') }),
        ]));
      });
      root.appendChild(placeCont);
    }

    // Lista de gastos — solo los que tienen importe distinto de 0 (los de 0 €,
    // p. ej. reservas confirmadas sin precio, no ensucian la lista).
    root.appendChild(el('h2', { class:'section-title', text:'Gastos' }));
    const list = el('div', { class:'list' });
    items.filter(i => (Number(i.amount) || 0) !== 0).forEach(i => {
      const catLabel = CATS_BUDGET.find(c => c.id === i.category)?.label || i.category;
      const statusLabel = STATUS_BUDGET.find(s => s.id === i.status)?.label || i.status;
      list.appendChild(el('div', { class:'list-item' }, [
        el('div', { class:'li-main', onclick: () => TripDetail.openBudgetEditor(t, i) }, [
          el('div', { class:'li-title', text: i.concept }),
          el('div', { class:'li-sub', text: [
            placeOf(i) ? '📍 ' + placeOf(i) : null,
            catLabel,
            statusLabel,
            i.date ? fmtDateShort(i.date) : null,
            i.notes ? i.notes.slice(0, 40) : null,
          ].filter(Boolean).join(' · ') }),
        ]),
        el('div', { class:'amount-eur', style:{textAlign:'right', minWidth:'80px'}, text: fmtMoney(i.amount_eur, 'EUR') }),
      ]));
    });
    root.appendChild(list);
  },

  async openBudgetEditor(t, existing = null) {
    if (!canEdit()) { UI.toast('Modo lector — no puedes modificar'); return; }
    const b = existing || {
      id: uuid(), trip_id: t.id, planning_item_id: null,
      category: 'comida', concept: '', amount: 0,
      currency: t.default_currency || 'EUR',
      rate_to_eur: 1, amount_eur: 0,
      status: 'planeado', date: todayIso(), notes: '',
    };
    // El "modo" de transporte NO se guarda en el gasto (su tabla no tiene esa columna y
    // quedaría local-only). Se lee/escribe en el EVENTO enlazado, que sincroniza por su
    // metadata jsonb. Aquí solo lo precargamos desde ese evento si existe.
    let initModo = '';
    if (b.planning_item_id) { try { const lev = await DB.get('planning_items', b.planning_item_id); initModo = (lev && lev.metadata && lev.metadata.modo) || ''; } catch (_) {} }
    const TRANS_MODES = (((PLANNING_METADATA.transporte || {}).fields || []).find(f => f.id === 'modo') || {}).options || [];
    const refreshModoVis = () => { const r = $('#fb-modo-row'); if (r) r.style.display = ($('#fb-cat')?.value === 'transporte') ? '' : 'none'; };
    const body = el('div', {}, [
      el('div', { class:'form-row' }, [
        el('label', { text:'Concepto' }),
        el('input', { id:'fb-concept', type:'text', value: b.concept || '', placeholder:'Cena, vuelo, taxi…' }),
      ]),
      el('div', { class:'form-grid-2' }, [
        el('div', { class:'form-row' }, [
          el('label', { text:'Categoría' }),
          el('select', { id:'fb-cat', onchange: () => refreshModoVis() }, CATS_BUDGET.map(c => el('option', { value:c.id, selected: b.category === c.id ? true : null }, c.label))),
        ]),
        el('div', { class:'form-row' }, [
          el('label', { text:'Estado' }),
          el('select', { id:'fb-status' }, STATUS_BUDGET.map(s => el('option', { value:s.id, selected: b.status === s.id ? true : null }, s.label))),
        ]),
      ]),
      // Subtipo de transporte (mismas opciones que un evento de transporte). Solo visible
      // cuando la categoría es "transporte".
      el('div', { class:'form-row', id:'fb-modo-row', style: (b.category === 'transporte' ? {} : { display:'none' }) }, [
        el('label', { text:'Tipo de transporte' }),
        el('select', { id:'fb-modo' }, TRANS_MODES.map(o => el('option', { value:o.value, selected: initModo === o.value ? true : null }, o.label))),
      ]),
      el('div', { class:'form-grid-2' }, [
        el('div', { class:'form-row num' }, [
          el('label', { text:'Importe' }),
          el('input', { id:'fb-amount', type:'number', step:'0.01', value: b.amount ?? '' }),
        ]),
        el('div', { class:'form-row' }, [
          el('label', { text:'Moneda' }),
          el('input', { id:'fb-cur', type:'text', value: b.currency || 'EUR' }),
        ]),
      ]),
      el('div', { class:'form-row' }, [
        el('label', { text:'Fecha' }),
        el('input', { id:'fb-date', type:'date', value: b.date || '' }),
      ]),
      el('div', { class:'form-row' }, [
        el('label', { text:'Notas' }),
        el('textarea', { id:'fb-notes' }, b.notes || ''),
      ]),
      // Opcional: crear también un evento en el planning asociado a este gasto.
      (!b.planning_item_id) ? el('label', { class:'fb-makeevt' }, [
        el('input', { id:'fb-makeevt', type:'checkbox' }),
        el('span', { text:'Crear también un evento en el planning con este gasto' }),
      ]) : null,
    ].filter(Boolean));

    const save = el('button', { class:'btn btn-primary', onclick: async () => {
      try {
        const concept = ($('#fb-concept')?.value || '').trim();
        if (!concept) { UI.toast('Pon un concepto'); return; }
        b.concept = concept;
        b.category = $('#fb-cat').value;
        b.status = $('#fb-status').value;
        b.amount = parseFloat($('#fb-amount').value) || 0;
        b.currency = ($('#fb-cur').value || 'EUR').toUpperCase().trim();
        b.rate_to_eur = FX.rateToEur(b.currency) ?? 1;
        b.amount_eur = +(b.amount * b.rate_to_eur).toFixed(2);
        b.date = $('#fb-date').value || null;
        b.notes = $('#fb-notes').value;
        const modo = (b.category === 'transporte') ? ($('#fb-modo')?.value || '') : '';
        // Crear evento en el planning asociado (opcional; solo si se marca y no hay ya uno).
        let createdEvent = false;
        if ($('#fb-makeevt')?.checked && !b.planning_item_id) {
          const evType = ({ transporte:'transporte', alojamiento:'hotel', comida:'comida', actividades:'actividad', compras:'compras', otros:'gestion' })[b.category] || 'gestion';
          const ev = {
            id: uuid(), trip_id: t.id, leg_id: null, type: evType, title: concept,
            day_date: b.date || null, time: null, end_time: null,
            place_name: null, lat: null, lng: null, gmaps_url: '', address: null, zona: null,
            notes: '', people: [], status: 'ninguno', in_consultation: false,
            metadata: (evType === 'transporte' && modo) ? { modo } : {},
            order_index: 0, updated_at: nowIso(),
          };
          await DB.put('planning_items', ev);
          b.planning_item_id = ev.id;
          createdEvent = true;
        } else if (b.planning_item_id && b.category === 'transporte') {
          // Si ya hay evento enlazado, guardamos el modo en SU metadata (sincroniza).
          try {
            const lev = await DB.get('planning_items', b.planning_item_id);
            if (lev) {
              lev.metadata = Object.assign({}, lev.metadata);
              if (modo) lev.metadata.modo = modo; else delete lev.metadata.modo;
              lev.updated_at = nowIso();
              await DB.put('planning_items', lev);
            }
          } catch (_) {}
        }
        await DB.put('budget_items', b);
        UI.toast(createdEvent ? 'Gasto y evento creados' : 'Gasto guardado');
      } catch (err) { console.error(err); UI.toast('Error al guardar'); }
      finally { UI.closeSheet(); Router.render(); }
    }}, 'Guardar');

    const delBtn = existing ? el('button', { class:'btn btn-danger', onclick: async () => {
      const ok = await UI.confirm('¿Borrar este gasto? Irá a la papelera del viaje.');
      if (!ok) return;
      await DB.remove('budget_items', b.id);
      UI.closeSheet(); Router.render();
    }}, 'Borrar') : null;

    UI.openSheet({
      title: existing ? 'Editar gasto' : 'Nuevo gasto',
      body,
      footer: [delBtn, el('button', { class:'btn btn-ghost', onclick: () => UI.closeSheet() }, 'Cancelar'), save].filter(Boolean),
    });
  },

  /* ----- Maleta ----- */
  async tabMaleta(root, t) {
    const items = await DB.listByTrip('packing_items', t.id);
    const sort = TripDetail._packingSort || 'auto';
    const editMode = TripDetail._packingEditMode;
    const customCats = Array.isArray(t.packing_categories) ? t.packing_categories : [];

    // Progreso en vivo (izquierda).
    const fillEl = el('div', { class:'budget-fill' });
    const legendCount = el('span', { class:'mono' });
    const legendLabel = el('span', { class:'muted' });
    const refreshProgress = () => {
      const d = items.filter(i => i.checked).length;
      const p = items.length ? (d / items.length) * 100 : 0;
      fillEl.style.width = p.toFixed(1) + '%';
      legendCount.textContent = `${d} / ${items.length}`;
      legendLabel.textContent = p === 100 ? '¡Todo listo!' : 'preparados';
    };

    // Botón global: plegar / desplegar todos los grupos (sin re-render, conserva scroll).
    const collapseAllBtn = el('button', { class:'icon-btn pack-collapse-all', title:'Plegar / desplegar todo',
      'aria-label':'Plegar o desplegar todos los grupos', html: svg('chevron'),
      onclick: () => {
        const groups = Array.from(root.querySelectorAll('.pack-group'));
        if (!groups.length) return;
        const anyOpen = groups.some(g => !g.classList.contains('collapsed'));
        groups.forEach(g => {
          g.classList.toggle('collapsed', anyOpen);
          const cid = g.dataset.cat;
          if (anyOpen) TripDetail._packingCollapsedCats.add(cid); else TripDetail._packingCollapsedCats.delete(cid);
        });
        collapseAllBtn.classList.toggle('all-collapsed', anyOpen);
        collapseAllBtn.title = anyOpen ? 'Desplegar todo' : 'Plegar todo';
      } });

    // Cabecera compacta: progreso a la izquierda, orden + añadir a la derecha.
    root.appendChild(el('div', { class:'pack-header' }, [
      el('div', { class:'pack-progress' }, [
        el('div', { class:'budget-bar' }, fillEl),
        el('div', { class:'budget-legend' }, [ legendCount, legendLabel ]),
      ]),
      el('div', { class:'pack-controls' }, [
        el('div', { class:'segmented packing-sort' }, [
          el('button', { class: sort === 'auto' ? 'active' : '', title:'Auto: grupos sin completar primero, completados al final', onclick: () => { TripDetail._packingSort = 'auto'; Router.render(); } }, 'Auto'),
          el('button', { class: sort === 'custom' ? 'active' : '', title:'Orden personalizado (arrastrar)', onclick: () => { TripDetail._packingSort = 'custom'; Router.render(); } }, 'Manual'),
