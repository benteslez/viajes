  async tabPlanning(root, t, fab) {
    clearInterval(TripDetail._neTimer);   // parar cuenta atrás de un render anterior
    const rawItems = await DB.listByTrip('planning_items', t.id);
    // Migración silenciosa: el antiguo `border_color` (verde/amarillo/rojo) de
    // lugar/playa se traduce a `custom_color` (HEX libre) y se limpia. Una
    // sola pasada por trip; los items ya migrados (sin border_color) no entran.
    await TripDetail._migrateBorderColorToCustom(rawItems);
    const dayNotes = await DB.listByTrip('day_notes', t.id);
    const noteMap = {};
    dayNotes.forEach(n => noteMap[n.date] = n);
    // Mapa planning_item_id → budget vinculado, para mostrar el importe en la card.
    try {
      const budgets = await DB.listByTrip('budget_items', t.id);
      this._budgetByPlanningId = {};
      for (const b of budgets) {
        if (b.planning_item_id) this._budgetByPlanningId[b.planning_item_id] = b;
      }
    } catch (_) { this._budgetByPlanningId = {}; }

    // === Expansión de hoteles con rango ===
    // Un hotel con check-in y check-out distintos genera:
    //   - una "noche" al final de cada día del rango (sin la fecha de check-out)
    //   - un "check-out" al inicio del día de check-out con la hora
    // El item original se sustituye por estos virtuales. Si solo hay una de las
    // dos fechas, o son el mismo día, el item se muestra normal.
    const items = this._expandHotels(rawItems);
    // Próximo evento con hora (para resaltar su tarjeta en azul, como en el Resumen).
    const nextEv = nextTimedEvent(rawItems);

    // Orden global: por día asc, luego virtuales/hoteles según planningCompare.
    items.sort((a,b) => (a.day_date || '').localeCompare(b.day_date || '') || planningCompare(a, b));

    // FAB flotante "+" en la esquina inferior derecha en lugar de un botón inline.
    // Más limpio en móvil y permite ver el listado completo sin que reste altura.
    if (canEdit() && fab) {
      fab.hidden = false;
      fab.title = 'Añadir parada';
      fab.setAttribute('aria-label', 'Añadir parada');
      fab.onclick = () => TripDetail.openPlanningEditor(t);
    }

    // Chips de filtro
    const countConsulta = items.filter(i => itemStatus(i) === 'en_consulta').length;
    const countDir = items.filter(i => i.address || (i.lat != null && i.lng != null)).length;
    const chipDef = [
      { id:'todo',        label:'Todo',        count: items.length },
      { id:'consulta',    label:'En consulta', count: countConsulta },
      { id:'direcciones', label:'Direcciones', count: countDir },
    ];
    const chips = el('div', { class:'chip-row', role:'group', 'aria-label':'Filtros de planning' });
    chipDef.forEach(c => {
      const isActive = TripDetail._planningFilter === c.id;
      chips.appendChild(el('button', {
        class: 'chip' + (isActive ? ' active' : ''),
        'aria-pressed': isActive ? 'true' : 'false',
        onclick: () => { TripDetail._planningFilter = c.id; Router.render(); }
      }, [
        c.label,
        el('span', { class:'badge', 'aria-label':`${c.count} items`, text: String(c.count) }),
      ]));
    });
    root.appendChild(chips);

    // === Vista DIRECCIONES (lista plana con botón "Ir") ===
    if (TripDetail._planningFilter === 'direcciones') {
      const dirItems = items.filter(i => i.address || (i.lat != null && i.lng != null) || i.place_name);
      if (!dirItems.length) {
        root.appendChild(el('div', { class:'empty' }, [
          el('div', { class:'icon', html: svg('pin') }),
          el('h3', { text:'Sin direcciones' }),
          el('p', { text:'Añade paradas con dirección o coordenadas para verlas aquí.' }),
        ]));
        return;
      }
      const list = el('div', { class:'list' });
      dirItems.forEach(i => list.appendChild(TripDetail._planningAddressRow(i, t)));
      root.appendChild(list);
      return;
    }

    // === Vista TODO o EN CONSULTA agrupada por día ===
    const filtered = TripDetail._planningFilter === 'consulta'
      ? items.filter(i => itemStatus(i) === 'en_consulta')
      : items;

    const byDay = {};
    for (const it of filtered) {
      const k = it.day_date || 'sin-fecha';
      (byDay[k] = byDay[k] || []).push(it);
    }
    if (TripDetail._planningFilter === 'todo') {
      Object.keys(noteMap).forEach(k => { if (!byDay[k]) byDay[k] = []; });
      if (t.start_date && t.end_date) {
        let d = parseDate(t.start_date);
        const end = parseDate(t.end_date);
        while (d <= end) {
          const k = isoLocal(d);
          if (!byDay[k]) byDay[k] = [];
          d.setDate(d.getDate() + 1);
        }
      }
    }

    if (!filtered.length && !dayNotes.length && !Object.keys(byDay).length) {
      root.appendChild(el('div', { class:'empty' }, [
        el('div', { class:'icon', html: svg('pin') }),
        el('h3', { text: TripDetail._planningFilter === 'consulta' ? 'Nada en consulta' : 'Sin paradas todavía' }),
        el('p', { text: TripDetail._planningFilter === 'consulta'
          ? 'Al añadir una parada activa el toggle "En consulta" para anotarla como opción pendiente.'
          : 'Añade lugares, transportes, comidas, actividades. Mantén pulsado un item para arrastrarlo.' }),
      ]));
      return;
    }

    const keys = Object.keys(byDay).sort();

    // Plegar/desplegar un día concreto (sin re-render, conserva scroll).
    const toggleDayGroup = (g, k, force) => {
      const collapse = force !== undefined ? force : !g.classList.contains('collapsed');
      g.classList.toggle('collapsed', collapse);
      if (collapse) TripDetail._collapsedDays.add(k); else TripDetail._collapsedDays.delete(k);
    };

    // Botón global: plegar todo / desplegar todo. La etiqueta refleja el estado actual.
    const realDays = keys.filter(k => k !== 'sin-fecha');
    const allCollapsedNow = realDays.length > 0 && realDays.every(k => TripDetail._collapsedDays.has(k));
    const collapseAllBtn = el('button', { class:'btn btn-sm', onclick: () => {
      const groups = Array.from(root.querySelectorAll('.day-group'));
      const anyOpen = groups.some(g => !g.classList.contains('collapsed'));
      groups.forEach(g => toggleDayGroup(g, g.dataset.day, anyOpen));
      collapseAllBtn.lastChild.textContent = anyOpen ? 'Desplegar todo' : 'Plegar todo';
    } }, [ el('span', { html: svg('chevron') }), el('span', { text: allCollapsedNow ? 'Desplegar todo' : 'Plegar todo' }) ]);
    // Botón "vista tarjetas": pantalla completa, un día por tarjeta, deslizable.
    const flashBtn = el('button', { class:'btn btn-sm', title:'Vista en tarjetas (un día por pantalla)',
      onclick: () => TripDetail.openPlanningFlashcards(t) }, [ el('span', { html: svg('copy') }), el('span', { text:'Tarjetas' }) ]);
    const calBtn = el('button', { class:'btn btn-sm', title:'Vista de calendario (mes)',
      onclick: () => TripDetail.openPlanningCalendar(t) }, [ el('span', { html: svg('cal') }), el('span', { text:'Calendario' }) ]);
    if (keys.length) root.appendChild(el('div', { class:'plan-collapse-bar' }, [ calBtn, flashBtn, collapseAllBtn ]));

    // Viaje EN CURSO: ocultamos los días ya pasados y dejamos un botón para verlos.
    const todayStr = todayIso();
    const isEnCurso = tripStatus(t) === 'curso';
    const pastKeys = isEnCurso ? keys.filter(k => k !== 'sin-fecha' && k < todayStr) : [];
    if (pastKeys.length) {
      const pastBtn = el('button', { class:'btn btn-sm btn-ghost show-past-btn', onclick: () => {
        const showing = root.classList.toggle('show-past');
        pastBtn.lastChild.textContent = showing
          ? 'Ocultar días anteriores'
          : `Ver días anteriores (${pastKeys.length})`;
      } }, [ el('span', { html: svg('clock'), 'aria-hidden':'true' }),
             el('span', { text:`Ver días anteriores (${pastKeys.length})` }) ]);
      root.appendChild(el('div', { class:'past-days-bar' }, [ pastBtn ]));
    }

    // Token de render: invalida los recálculos de rutas en vuelo de renders anteriores.
    const renderToken = (TripDetail._planRenderToken = {});
    // Coordenadas del alojamiento de cada mañana = donde se durmió la noche anterior
    // (o, si no hay, el hotel de esa misma noche). Para el tramo "desde el hotel".
    const nightMap = nightCoordsMap(rawItems);
    const morningHotel = (k) => {
      if (k === 'sin-fecha') return null;
      const d = parseDate(k); d.setDate(d.getDate() - 1);
      const prev = isoLocal(d);
      return nightMap[prev] || nightMap[k] || null;
    };
    for (const k of keys) {
      const collapsed = TripDetail._collapsedDays.has(k);
      const isPast = pastKeys.includes(k);
      const g = el('div', { class:'day-group' + (collapsed ? ' collapsed' : '') + (isPast ? ' day-past' : '') + (k === todayStr ? ' day-today' : ''), data:{ day:k } });
      const dayNum = (t.start_date && k !== 'sin-fecha') ? (daysBetween(t.start_date, k) + 1) : null;
      const dayMeta = noteMap[k];
      // Resumen del día: nº de paradas y alojamiento de continuación (noche sin check-in/out).
      const _stops = byDay[k].filter(x => !x._virtual).length;
      const _contNight = byDay[k].find(x => x._virtual === 'night' && !x._isFirstNight);
      const _hotelDir = (it) => !it ? null
        : (it.lat != null && it.lng != null) ? `https://www.google.com/maps/dir/?api=1&destination=${it.lat},${it.lng}`
        : it.address ? `https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(it.address)}`
        : it.place_name ? `https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(it.place_name)}` : null;
      // Pill de etiqueta del día (p. ej. "Día libre") + clima: van en la CABECERA, a la
      // derecha del día (misma línea si caben; si no, saltan abajo). Visibles al plegar.
      const _dayPill = (dayMeta && dayMeta.title)
        ? el('span', { class: 'day-title-pill day-meta-pill' + (dayMeta.color ? ' color-' + dayMeta.color : ''), text: dayMeta.title })
        : null;
      const _headWx = el('div', { class:'day-head-wx' }, [
        (k !== 'sin-fecha') ? el('span', { class:'wx-chip', id:`wx-${k}` }) : null,
        _dayPill,
      ].filter(Boolean));
      // Zona clicable (chevron + número + fecha + clima + pill): clic → pliega/despliega;
      // pulsación larga (o clic derecho) → editor del día (título/color/nota unificados).
      const headMain = el('div', { class:'day-head-main', title:'Mantén pulsado para editar el día', onclick: () => toggleDayGroup(g, k) }, [
        el('span', { class:'day-collapse', html: svg('chevron'), 'aria-hidden':'true' }),
        dayNum ? el('span', { class:'day-num', text:`Día ${dayNum}` }) : null,
        (k === 'sin-fecha')
          ? el('span', { class:'day-date', text:'Sin fecha' })
          : el('span', { class:'day-date' }, [
              el('span', { class:'day-wd', text: fmtDate(k, { weekday:'short' }).replace(/\.$/, '') }),
              ' ',
              el('span', { class:'day-dm', text: `${fmtDate(k, { day:'numeric' })} ${fmtDate(k, { month:'short' }).replace(/\.$/, '')}` }),
            ]),
        (k === todayStr) ? el('span', { class:'day-today-badge', text:'Hoy' }) : null,
        _headWx.children.length ? _headWx : null,
      ].filter(Boolean));
      if (canEdit() && k !== 'sin-fecha') TripDetail._attachLongPress(headMain, () => TripDetail.openDayEditor(t, k, dayMeta));
      const head = el('div', { class:'day-head' }, [
        headMain,
        el('div', { class:'day-actions' }, [
          // Optimizar el orden de las paradas del día por cercanía (si hay ≥3 con coords).
          (canEdit() && k !== 'sin-fecha' && byDay[k].filter(i => i.lat != null && i.lng != null && !i._virtual).length >= 3) ? el('button', {
            class:'icon-btn', title:'Optimizar orden del día (por cercanía)',
            onclick: () => TripDetail._optimizeDay(t, k, byDay[k]),
            html: svg('compass'),
            'aria-label':'Optimizar orden del día',
          }) : null,
          canEdit() ? el('button', {
            class:'icon-btn', title:'Añadir evento a este día',
            onclick: () => TripDetail.openPlanningEditor(t, null, { day: k !== 'sin-fecha' ? k : null }),
            html: svg('plus'),
            'aria-label':'Añadir evento a este día',
          }) : null,
        ].filter(Boolean)),
      ].filter(Boolean));
      g.appendChild(head);
      // Fila meta (bajo la cabecera): nº de paradas · alojamiento (noche de continuación,
      // clicable → Maps) · resumen de ruta. El clima y la pill van ARRIBA, en la cabecera.
      if (k !== 'sin-fecha') {
        const metaKids = [];
        if (_stops > 0) metaKids.push(el('span', { class:'day-meta-stops', text: `${_stops} ${_stops === 1 ? 'parada' : 'paradas'}` }));
        // El chip de alojamiento (hotel) solo se ve con el día desplegado (CSS lo oculta al plegar).
        if (_contNight) {
          const hName = _contNight.place_name || _contNight.title || 'Alojamiento';
          const hDir = _hotelDir(_contNight);
          metaKids.push(hDir
            ? el('a', { class:'day-hotel-chip', href: hDir, target:'_blank', rel:'noopener', title:'Cómo llegar al alojamiento', onclick: (e) => e.stopPropagation() }, [ '🛏 ', hName ])
            : el('span', { class:'day-hotel-chip', text: `🛏 ${hName}` }));
        }
        g.appendChild(el('div', { class:'day-meta-row' }, metaKids));
      }

      if (noteMap[k] && noteMap[k].text && TripDetail._planningFilter !== 'consulta') {
        g.appendChild(el('div', { class:'day-note-card', text: noteMap[k].text }));
      }

      const list = el('div', { class:'list timeline-list', data:{ day:k } });
      const dayArr = byDay[k];
      const route = this._dayRoute(t, k);
      const waypoints = [];          // paradas con coords (sin "noches"), en orden
      let firstStopCard = null, firstStopCoords = null, firstStopItem = null;
      let lastStopCoords = null, nightCard = null;
      // Franjas (Mañana/Tarde/Noche) e hilo de timeline: solo en días donde TODAS las
      // paradas tienen hora (si no, lista limpia). "Ahora" y huecos solo si hay horas.
      const _nonVirt = dayArr.filter(x => !x._virtual);
      const _timed = _nonVirt.filter(x => x.time);
      const _partOf = (hhmm) => { const h = parseInt(String(hhmm).slice(0, 2), 10) || 0; return h < 12 ? 'Mañana' : (h < 20 ? 'Tarde' : 'Noche'); };
      const _useParts = _timed.length >= 2 && _nonVirt.length === _timed.length && new Set(_timed.map(x => _partOf(x.time))).size >= 2;
      const _useThread = _timed.length >= 2 && _nonVirt.length === _timed.length;
      const _timeMin = (s) => { const m = String(s).match(/^(\d{1,2}):(\d{2})/); return m ? (+m[1] * 60 + +m[2]) : null; };
      const _isToday = (k === todayStr);
      const _nowM = _isToday ? (() => { const d = new Date(); return d.getHours() * 60 + d.getMinutes(); })() : null;
      const _nowLine = () => { const d = new Date(); const hh = String(d.getHours()).padStart(2, '0'), mm = String(d.getMinutes()).padStart(2, '0'); return el('div', { class:'now-line' }, [ el('span', { class:'now-dot' }), el('span', { class:'now-label', text:`ahora ${hh}:${mm}` }) ]); };
      let _lastPart = null, _threadSeen = 0, _nowInserted = false, _prevTimed = null;
      for (let di = 0; di < dayArr.length; di++) {
        const it = dayArr[di];
        // Noche de continuación → va en la cabecera (chip de alojamiento), no como card.
        if (it._virtual === 'night' && !it._isFirstNight) continue;
        if (_useParts && !it._virtual && it.time) {
          const p = _partOf(it.time);
          if (p !== _lastPart) { _lastPart = p; list.appendChild(el('div', { class:'plan-part', text: p })); }
        }
        // Marcador "ahora" (hoy): antes de la primera parada con hora ≥ ahora.
        if (_isToday && !_nowInserted && !it._virtual && it.time && _timeMin(it.time) != null && _timeMin(it.time) >= _nowM) {
          list.appendChild(_nowLine()); _nowInserted = true;
        }
        // Hueco libre entre paradas con hora (≥120 min y sin tramo de ruta entre ellas).
        if (!it._virtual && it.time && _prevTimed) {
          const gap = _timeMin(it.time) - _timeMin(_prevTimed.time);
          const hasLeg = (_prevTimed.lat != null && _prevTimed.lng != null && it.lat != null && it.lng != null);
          if (gap >= 120 && !hasLeg) {
            const h = Math.floor(gap / 60), m = gap % 60;
            list.appendChild(el('div', { class:'gap-chip', text: `libre ${h}h${m ? ` ${m}m` : ''}` }));
          }
        }
        const card = this._planningItem(it, t);
        if (_useThread && !it._virtual && it.time) {
          card.classList.add('li-thread'); _threadSeen++;
          if (_threadSeen === 1) card.classList.add('thread-first');
          if (_threadSeen === _timed.length) card.classList.add('thread-last');
        }
        TripDetail._wireNextCard(card, it, nextEv);
        list.appendChild(card);
        if (!it._virtual && it.time) _prevTimed = it;
        if (it._virtual === 'night' && !nightCard) nightCard = card;
        // Las "noches" de hotel y las copias 'span' no cuentan como parada para rutas.
        const skipLeg = (x) => x._virtual === 'night' || x._virtual === 'span';
        if (it.lat != null && it.lng != null && !skipLeg(it)) {
          waypoints.push({ lat: it.lat, lng: it.lng });
          lastStopCoords = { lat: it.lat, lng: it.lng };
          if (!firstStopCard) { firstStopCard = card; firstStopCoords = lastStopCoords; firstStopItem = it; }
        }
        const nx = dayArr[di + 1];
        if (nx && it.lat != null && it.lng != null && nx.lat != null && nx.lng != null
            && !skipLeg(it) && !skipLeg(nx)) {
          const a = { lat: it.lat, lng: it.lng }, b = { lat: nx.lat, lng: nx.lng };
          if (legBetween(a, b).km > 0.03) list.appendChild(this._legChip(a, b, route, { forceMode: arriveMode(nx) }));
        }
      }
      // "Ahora" al final si todas las paradas de hoy ya pasaron.
      if (_isToday && _timed.length && !_nowInserted) list.appendChild(_nowLine());
      // Tramo "desde el alojamiento" hasta la primera parada del día (si hay hotel).
      const hotelC = morningHotel(k);
      if (hotelC && firstStopCoords && firstStopCard && legBetween(hotelC, firstStopCoords).km > 0.03) {
        list.insertBefore(this._legChip(hotelC, firstStopCoords, route, { hotel:'from', forceMode: arriveMode(firstStopItem) }), firstStopCard);
        waypoints.unshift(hotelC);
      }
      // Tramo "de vuelta al alojamiento" desde la última parada (hotel donde se duerme).
      const nightC = nightMap[k];
      if (nightC && lastStopCoords && legBetween(lastStopCoords, nightC).km > 0.03) {
        const back = this._legChip(lastStopCoords, nightC, route, { hotel:'to' });
        if (nightCard) list.insertBefore(back, nightCard); else list.appendChild(back);
        waypoints.push(nightC);
      }
      // Día sin actividades (solo alojamiento o vacío): estado "Día libre" + añadir.
      if (TripDetail._planningFilter === 'todo' && k !== 'sin-fecha' && !dayArr.some(x => !x._virtual)) {
        list.insertBefore(el('div', { class:'dia-libre', style:{ display:'flex', alignItems:'center', justifyContent:'space-between', gap:'10px', padding:'12px 14px', border:'1px dashed var(--line)', borderRadius:'14px', color:'var(--text-muted)', fontSize:'13px' } }, [
          el('span', { text:'Día libre' }),
          canEdit() ? el('button', { class:'btn btn-sm btn-ghost', style:{ padding:'4px 10px' }, onclick: () => TripDetail.openPlanningEditor(t, null, { day:k }) }, [ el('span', { html: svg('plus') }), 'Añadir plan' ]) : null,
        ].filter(Boolean)), list.firstChild);
      }
      g.appendChild(list);
      root.appendChild(g);
      route.finalize(dayArr, list, waypoints, renderToken);
    }

    setTimeout(() => TripDetail._wirePlanningDnD(root, t), 0);

    // Clima por día (async): cada día usa las coords de DONDE SE DUERME esa noche
    // (hotel cuyo rango cubre la noche); si no hay, la primera parada del día con
    // coords; y por último, las del viaje. Agrupamos por coords para minimizar fetches.
    // (nightMap ya está calculado arriba.)
    const tripC = tripCoords(rawItems);
    const wxGroups = {};
    for (const k of keys) {
      if (k === 'sin-fecha') continue;
      const own = (byDay[k] || []).find(i => i.lat != null && i.lng != null);
      const c = nightMap[k] || (own ? { lat: own.lat, lng: own.lng } : null) || tripC;
      if (!c) continue;
      const ck = `${(+c.lat).toFixed(2)},${(+c.lng).toFixed(2)}`;
      (wxGroups[ck] = wxGroups[ck] || { c, days: [] }).days.push(k);
    }
    Object.values(wxGroups).forEach(({ c, days }) => {
      Weather.forCoords(c.lat, c.lng).then(daily => {
        days.forEach(k => {
          const w = daily[k];
          const txt = Weather.chipText(w);
          const span = document.getElementById(`wx-${k}`);
          if (span && txt) {
            const r = Weather.ropaHint(w);
            span.innerHTML = '';
            span.appendChild(el('span', { class:'wx-temp', text: txt }));
            // La sugerencia de ropa ("fresco", "abrigo"…) solo se ve al desplegar el día.
            if (r) span.appendChild(el('span', { class:'wx-ropa', text: ' · ' + r }));
          }
        });
      }).catch(() => {});
    });

    // Aviso de horario (OSM): en segundo plano, marca con ⚠️ las paradas cuya hora
    // cae fuera del horario de apertura. Cacheado y limitado para no saturar Overpass.
    const _byId = {}; items.forEach(i => { if (!i._virtual) _byId[i.id] = i; });
    TripDetail._checkVisibleOpeningHours(root, _byId);

    // Rellena coordenadas que falten (paradas Y alojamientos con dirección pero sin
    // lat/lng), para que aparezcan distancias, mapa y clima. Usa rawItems (incluye el
    // hotel real, que en `items` solo aparece como noches virtuales).
    TripDetail._backfillCoords(t, rawItems);
  },

  // Geocodifica en segundo plano las paradas/alojamientos con dirección pero sin
  // coordenadas y guarda el lat/lng. Throttled (1/seg, vía geocodeText) y abortable.
  async _backfillCoords(t, rawItems) {
    if (!canEdit() || !navigator.onLine) return;
    const token = {}; TripDetail._geoToken = token;
    const GEO_TYPES = ['lugar', 'personas', 'playa', 'comida', 'compras', 'hotel', 'actividad', 'otro', 'gestion'];
    const targets = rawItems.filter(i => !i._virtual && GEO_TYPES.includes(i.type) && (i.lat == null || i.lng == null) && (i.address || i.place_name));
    if (!targets.length) return;
    let changed = 0;
    for (const it of targets) {
      if (TripDetail._geoToken !== token) return;          // re-render: abortar
      const c = await geocodeText(it.address || it.place_name);
      if (TripDetail._geoToken !== token) return;
      if (c) {
        const fresh = await DB.get('planning_items', it.id); // por si cambió mientras tanto
        if (fresh && (fresh.lat == null || fresh.lng == null)) {
          fresh.lat = c.lat; fresh.lng = c.lng;
          if (!fresh.gmaps_url) fresh.gmaps_url = gmapsUrl(c.lat, c.lng, fresh.place_name);
          try { await DB.put('planning_items', fresh); changed++; } catch (_) {}
          if (changed === 1) UI.toast('Añadiendo ubicaciones que faltaban…');
        }
      }
      // Re-pintar por lotes para que las distancias vayan apareciendo progresivamente.
      if (changed > 0 && changed % 6 === 0 && TripDetail._geoToken === token) { Router.render(); return; }
    }
    if (changed && TripDetail._geoToken === token) Router.render();
  },

  // Comprueba horarios de apertura de las paradas visibles (con coords + hora) y
  // añade ⚠️ si probablemente estén cerradas. Throttled; se aborta al re-renderizar.
  async _checkVisibleOpeningHours(root, byId) {
    const token = {}; TripDetail._ohToken = token;
    const cards = [...root.querySelectorAll('.day-group:not(.collapsed) .timeline-item[data-id]')];
    let n = 0;
    for (const card of cards) {
      if (TripDetail._ohToken !== token) return;
      if (n >= 14) break;
      const it = byId[card.dataset.id];
      if (!it || it.lat == null || it.lng == null || !it.time || !it.day_date) continue;
      if (card.querySelector('.oh-warn')) continue;
      n++;
      const oh = await fetchOpeningHours(it.lat, it.lng);
      if (TripDetail._ohToken !== token) return;
      if (ohIsOpen(oh, it.day_date, it.time) === false) {
        const sub = card.querySelector('.li-subrow');
        if (sub && !sub.querySelector('.oh-warn')) sub.appendChild(el('span', { class:'oh-warn', title:'Puede estar cerrado a esa hora (según OpenStreetMap)', text:'⚠️' }));
      }
      await new Promise(r => setTimeout(r, 250));
    }
  },

  // Si `it` es el PRÓXIMO evento, resalta su tarjeta en azul con cuenta atrás + campana
  // (mismo sistema que el Resumen). Devuelve true si la marcó. Reutilizable en listas.
  _wireNextCard(card, it, nextEv) {
    if (!nextEv || it._virtual || it.id !== nextEv.id || (it.day_date || '') !== (nextEv.day_date || '') || (it.time || '') !== (nextEv.time || '')) return false;
    card.classList.add('is-next');
    const canNotify = ('Notification' in window) && Notification.permission !== 'granted' && canEdit();
    const bell = canNotify ? el('button', { class:'ne-bell', title:'Activar avisos', 'aria-label':'Activar avisos',
      onclick: async (e) => {
        e.stopPropagation();
        try { const p = await Notification.requestPermission(); if (p === 'granted') { Notifications.scheduleAll(); UI.toast('Avisos activados'); Router.render(); } else UI.toast('Permiso de notificaciones denegado'); }
        catch (_) { UI.toast('No se pudieron activar'); }
      } }, el('span', { html: svg('bell') })) : null;
    card.appendChild(el('div', { class:'card-next' }, [
      el('span', { class:'card-next-tag', text:'Próximo' }),
      el('span', { class:'ne-count', id:'ne-count', text: nextEventText(nextEv) }),
      bell,
    ].filter(Boolean)));
    clearInterval(TripDetail._neTimer);
    // Cuenta atrás en vivo solo si el evento tiene hora; si no (evento de hoy sin hora),
    // el texto es estático ("hoy").
    if (nextEv._ts) {
      TripDetail._neTimer = setInterval(() => {
        const span = document.getElementById('ne-count');
        if (!span) { clearInterval(TripDetail._neTimer); return; }
        const rem = nextEv._ts - Date.now();
        span.textContent = fmtCountdown(rem);
        if (rem <= 0) { clearInterval(TripDetail._neTimer); setTimeout(() => { if (STATE.view === 'trip') Router.render(); }, 1500); }
      }, 1000);
    }
    return true;
  },

  _planningItem(it, t) {
    const td = typeDef(it.type);
    const status = itemStatus(it);                  // null para lugar/comida/otro
    const statusDef = STATUS_PLANNING.find(s => s.id === status);
    const isVirtual = !!it._virtual;
    const isCheckout = it._virtual === 'checkout';
    const isNight = it._virtual === 'night';
    const isArrival = it._virtual === 'arrival';

    // Título según virtual
    let displayTitle = it.title;
    if (isCheckout) displayTitle = `${it.title} — Check-out`;
    else if (isNight) displayTitle = it.title; // simple, sin sufijo
    else if (isArrival) {
      const dest = (it.metadata?.destino) || (it.dest_tz ? it.dest_tz.split('/').pop().replace(/_/g,' ') : '');
      displayTitle = `Llegada${dest ? ' · ' + dest : ''}`;
    }
    // Tipo "personas": el título lista a TODAS las personas seleccionadas
    // (p. ej. "Noelia y María" o "Noelia, María y Belén").
    else if (it.type === 'personas' && Array.isArray(it.people) && it.people.length) {
      displayTitle = fmtList(it.people);
    }

    // Subtítulo
    const subParts = [];
    if (it.place_name && it.place_name !== it.title) subParts.push(it.place_name);
    if (it.address) subParts.push(it.address);
    // Evento de varios días (lugar/playa con día de fin): en el día de inicio mostramos
    // "Hasta DD/MM"; en las copias de continuación, "Continúa · día N de M".
    if (isSpanType(it.type) && it.metadata && it.metadata.end_date) {
      const sStart = it._spanStart || it.day_date;
      if (it.metadata.end_date > sStart) {
        if (it._virtual === 'span') {
          const total = daysBetween(it._spanStart, it._spanEnd) + 1;
          const nth = daysBetween(it._spanStart, it.day_date) + 1;
          subParts.push(`Continúa · día ${nth} de ${total}`);
        } else {
          subParts.push(`Hasta ${fmtDate(it.metadata.end_date, { weekday:'short', day:'numeric', month:'short' })}`);
        }
      }
    }
    if (isNight) {
      // Noches: empezamos limpio y solo añadimos algo si hay datos del alojamiento.
      subParts.length = 0;
      const hotelName = it.place_name || (it.metadata && it.metadata.nombre) || '';
      if (it._isFirstNight && it.consultation_planned_t1) {
        subParts.push(`Check-in ${it.consultation_planned_t1}`);
      } else if (hotelName) {
        subParts.push(`Noche en ${hotelName}`);
      }
      // Sin nombre ni hora → sin subtítulo (solo el título, p. ej. "Madrid").
    } else if (isCheckout) {
      // sub claro y corto
    } else if (it.type === 'hotel' && (it.consultation_planned_d1 || it.consultation_planned_d2)) {
      const ci = it.consultation_planned_d1 ? `Check-in ${fmtDateShort(it.consultation_planned_d1)}${it.consultation_planned_t1 ? ' ' + it.consultation_planned_t1 : ''}` : null;
      const co = it.consultation_planned_d2 ? `Check-out ${fmtDateShort(it.consultation_planned_d2)}${it.consultation_planned_t2 ? ' ' + it.consultation_planned_t2 : ''}` : null;
      [ci, co].filter(Boolean).forEach(p => subParts.push(p));
    }
    // Datos de metadata según tipo (resumen útil para la fila)
    const md = it.metadata || {};
    if (it.type === 'vuelo') {
      const oriDest = (md.origen && md.destino) ? `${md.origen} - ${md.destino}` :
                      (it.origin_tz && it.dest_tz) ? `${it.origin_tz.split('/').pop().replace(/_/g,' ')} - ${it.dest_tz.split('/').pop().replace(/_/g,' ')}` : null;
      if (oriDest && !it.title.includes(oriDest)) subParts.push(oriDest);
      if (md.aerolinea && !it.title.includes(md.aerolinea)) subParts.push(md.aerolinea);
      if (md.terminal || md.puerta) {
        const tps = [];
        if (md.terminal) tps.push('T' + md.terminal);
        if (md.puerta)   tps.push('Puerta ' + md.puerta);
        subParts.push(tps.join(' · '));
      }
      // Asientos: array o string legacy
      const seatsStr = Array.isArray(md.asientos)
        ? md.asientos.map(s => [s.nombre, s.asiento].filter(Boolean).join(' ')).filter(Boolean).join(' · ')
        : (md.asiento || '');
      if (seatsStr) subParts.push(seatsStr);
    } else if (it.type === 'coche') {
      if (md.compania && !it.title.includes(md.compania)) subParts.push(md.compania);
      if (md.modelo && !it.title.includes(md.modelo)) subParts.push(md.modelo);
      if (md.matricula) subParts.push(md.matricula);
    } else if (it.type === 'transporte') {
      if (md.origen && md.destino && !it.title.includes(`${md.origen} - ${md.destino}`)) subParts.push(`${md.origen} - ${md.destino}`);
      if (md.vagon) subParts.push('Coche ' + md.vagon);
      const seatsStr = Array.isArray(md.asientos)
        ? md.asientos.map(s => [s.nombre, s.asiento].filter(Boolean).join(' ')).filter(Boolean).join(' · ')
        : (md.asiento || '');
      if (seatsStr) subParts.push(seatsStr);
    } else if (it.type === 'hotel' && md.habitacion) {
      subParts.push(md.habitacion);
    } else if (it.type === 'actividad') {
      if (md.duracion) subParts.push(md.duracion);
      if (md.organizador) subParts.push(md.organizador);
    }
    if (status === 'en_consulta' && it.consultation_price != null && canSeeMoney()) {
      const cur = it.consultation_currency || 'EUR';
      let priceStr = fmtMoney(it.consultation_price, cur);
      // Si la moneda no es EUR y tenemos tasa, añadir conversión: "¥35.000 (~ 215 €)"
      if (cur !== 'EUR') {
        const rate = FX.rateToEur(cur);
        if (rate) {
          const eur = +(it.consultation_price * rate).toFixed(2);
          priceStr += ` (~ ${fmtMoney(eur, 'EUR')})`;
        }
      }
      subParts.push(priceStr);
    }
    // Importe asociado (budget_item vinculado por planning_item_id) — para tipos sin status
    // (lugar/playa/comida) y también como fallback cuando hay budget pero no estado en_consulta.
    const linkedBudget = this._budgetByPlanningId?.[it.id];
    if (linkedBudget && status !== 'en_consulta' && canSeeMoney() && !isVirtual) {
      const cur = linkedBudget.currency || 'EUR';
      let priceStr = fmtMoney(linkedBudget.amount, cur);
      if (cur !== 'EUR' && linkedBudget.amount_eur) {
        priceStr += ` (~ ${fmtMoney(linkedBudget.amount_eur, 'EUR')})`;
      }
      subParts.push(priceStr);
    }
    // Personas (con quién) — "Con Pepe", "Con Pepe y Juan".
    // En "personas" los nombres ya van listados en el título (arriba), no se repiten aquí.
    // En el resto de tipos, las personas acompañan: "Con Noelia y María".
    if (Array.isArray(it.people) && it.people.length && it.type !== 'personas') {
      subParts.push('Con ' + fmtList(it.people));
    }
    const gm = gmapsUrl(it.lat, it.lng, it.place_name);

    // Mostrar hora SOLO si:
    //  - el tipo no la oculta (hotel la oculta normalmente) Y hay hora
    //  - O es el check-out virtual (sí mostramos hora ahí)
    const showTime = (isCheckout && it.time) || (!td.hideTime && it.time);
    // Para lugar/playa permitimos rango "10:00 – 14:00" si end_time está informado.
    // Si solo hay start_time, mostramos esa. Si solo hay end_time (raro), no mostramos pill.
    const timeRangeText = (() => {
      if (!showTime) return null;
      const start = it.time;
      let end = isSpanType(it.type) ? it.end_time : null;
      // Transporte/vuelo: si hay hora de llegada el mismo día, mostramos
      // "salida – llegada" en la misma pill (la llegada no es obligatoria).
      if (!end && !isVirtual && (it.type === 'transporte' || it.type === 'vuelo')) {
        const t2 = it.consultation_planned_t2;
        const d1 = it.consultation_planned_d1 || it.day_date;
        const sameDay = !it.consultation_planned_d2 || it.consultation_planned_d2 === d1;
        if (t2 && t2 !== start && sameDay) end = t2;
      }
      return end ? `${start} – ${end}` : start;
    })();
    const visitedCls = (it.visited && !isVirtual) ? ' visited' : '';
    // Color override del usuario (HEX libre). Si está, se aplica como variable
    // inline `--card-color`; la regla `.has-custom-color` lo usa para fondo + emoji.
    const customColor = (typeof it.custom_color === 'string' && /^#[0-9a-f]{6}$/i.test(it.custom_color)) ? it.custom_color : null;
    const customCls = customColor ? ' has-custom-color' : '';

    // URL "Cómo llegar" (Google Maps directions). null si no hay dato suficiente.
    const dirUrl = (it.lat != null && it.lng != null)
      ? `https://www.google.com/maps/dir/?api=1&destination=${it.lat},${it.lng}`
      : it.address
        ? `https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(it.address)}`
        : (it.place_name ? `https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(it.place_name)}` : null);

    // -------- Variante COMPACTA: noche de hotel que NO es la primera --------
    // Solo: nombre del hotel + botón "Cómo llegar". Sin pill, sin hora, sin
    // botones de edición. El click sigue abriendo el editor del hotel original.
    if (isNight && !it._isFirstNight) {
      const ncCls = 'list-item timeline-item virtual night-cont type-hotel' + customCls;
      const ncNode = el('div', {
        class: ncCls,
        draggable:'false',
        data:{ id:it.id, day: it.day_date || 'sin-fecha' }
      }, [
        el('div', { class:'item-emoji', 'aria-hidden':'true', text: '🛏️' }),
        el('div', { class:'li-main', onclick: () => TripDetail.openPlanningEditor(t, it) }, [
          el('div', { class:'li-title', text: it.title }),
        ]),
        el('div', { class:'gap' }),
        dirUrl ? el('a', {
          class:'night-cont-go', href: dirUrl, target:'_blank', rel:'noopener',
          title:'Cómo llegar', onclick: (e) => e.stopPropagation()
        }, [ el('span', { html: svg('map') }), 'Cómo llegar' ]) : null,
      ].filter(Boolean));
      if (customColor) ncNode.style.setProperty('--card-color', customColor);
      return ncNode;
    }

    const cls = 'list-item timeline-item' + (status ? ` status-${status}` : '') + ` type-${it.type}` + visitedCls + customCls + (isVirtual ? ' virtual' : '');

    const node = el('div', {
      class: cls,
      draggable: isVirtual ? 'false' : 'true',
      data:{ id:it.id, day: it.day_date || 'sin-fecha' }
    }, [
      // Hora en columna a la izquierda (más clara que la pill). Vacía si no hay hora.
      timeRangeText ? (() => { const _p = String(timeRangeText).split(' – '); return el('div', { class:'li-time' }, [ el('span', { class:'li-time-a', text: _p[0] }), _p[1] ? el('span', { class:'li-time-b', text: _p[1] }) : null ].filter(Boolean)); })() : null,
      // Los virtuales no se pueden arrastrar (lo controlan las fechas del hotel)
      isVirtual ? null : el('div', { class:'drag-handle', html: svg('grip'), title:'Arrastra para reordenar' }),
      // Emoji del tipo (varía con el modo en transporte), centrado en la card
      el('div', { class:'item-emoji', 'aria-hidden':'true', text: planEmoji(it) }),
      el('div', { class:'li-main', onclick: () => TripDetail.openPlanningEditor(t, it) }, [
        el('div', { class:'li-title', style:{display:'flex', alignItems:'center', flexWrap:'nowrap', gap:'6px'} }, [
          el('span', { class:'li-title-text', text: displayTitle }),
          (it.expense_reminder && !isVirtual) ? el('span', { class:'expense-warn-flag', title:'Pendiente de añadir gasto', text:'⚠️' }) : null,
        ].filter(Boolean)),
        // 2ª fila: hora (a la izquierda) + datos. En transporte/vuelo/coche NO se pone
        // el label genérico ("Transporte"): solo datos reales (compañía, asiento,
        // localizador, ruta…). Si no hay nada, la fila queda vacía pero reserva alto.
        (() => {
          const isTransportType = ['vuelo', 'transporte', 'coche'].includes(it.type);
          const subText = subParts.join(' · ') || ((isVirtual || isTransportType) ? '' : td.label);
          return el('div', { class:'li-subrow' }, [
            subText ? el('span', { class:'li-sub-text', text: subText }) : null,
          ].filter(Boolean));
        })(),
        (status === 'en_consulta' && it.consultation_url && canSeeLinks() && !isVirtual) ? el('div', { style:{marginTop:'4px', fontSize:'13px'} },
          el('a', { href: it.consultation_url, target:'_blank', rel:'noopener',
            onclick: (e) => e.stopPropagation(), text: TripDetail._shortUrl(it.consultation_url) })
        ) : null,
        (() => {
          const cornerKids = [
            ((status === 'en_consulta' || status === 'por_iniciar') && canEdit() && !isVirtual) ? el('button', {
              class:'btn btn-sm li-confirm-btn', style:{ background:'var(--status-curso)', color:'#fff', borderColor:'transparent' },
              onclick: (e) => { e.stopPropagation(); TripDetail.openConfirmPlanning(t, it); }
            }, [ el('span', { html: svg('check') }), 'Confirmar' ]) : null,
            (statusDef && !isVirtual) ? el('span', { class:`status-badge s-${status}`, text: statusDef.label }) : null,
          ].filter(Boolean);
          return cornerKids.length ? el('div', { class:'li-corner' }, cornerKids) : null;
        })(),
      ].filter(Boolean)),
      el('div', { class:'li-actions', style:{alignItems:'center'} }, [
        // (El color personalizado de la tarjeta ahora se edita dentro del diálogo
        //  de edición, no como botón siempre visible en la card.)
        // Toggle "Visto": marca/desmarca el item como visitado. Pinta la card en gris.
        (canEdit() && !isVirtual) ? el('button', {
          class: 'icon-btn' + (it.visited ? ' btn-visited-on' : ''),
          title: it.visited ? 'Marcar como no visto' : 'Marcar como visto',
          'aria-pressed': it.visited ? 'true' : 'false',
          html: svg('check'),
          onclick: (e) => { e.stopPropagation(); TripDetail.toggleVisited(it); }
        }) : null,
        gm ? el('a', { class:'icon-btn', href: gm, target:'_blank', title:'Abrir en Google Maps', html: svg('map'),
          onclick: (e) => e.stopPropagation() }) : null,
        el('button', { class:'icon-btn', onclick: () => TripDetail.openPlanningEditor(t, it), html: svg('edit'),
          title: isVirtual ? 'Editar el hotel' : 'Editar' }),
      ].filter(Boolean)),
    ].filter(Boolean));
    if (customColor) node.style.setProperty('--card-color', customColor);
    return node;
  },

  // Vista "tarjetas": pantalla completa, un día por tarjeta, deslizable de lado a lado.
  // Solo lectura/navegación (no aprueba ni rechaza); reutiliza las cards del planning.
  async openPlanningFlashcards(t, focusDay, opts) {
    opts = opts || {};
    let keys = [];
    const track = el('div', { class:'flash-track' });
    const counter = el('div', { class:'flash-counter' });

    const setCounter = () => {
      const w = track.clientWidth || 1;
      const i = Math.round(track.scrollLeft / w);
      counter.textContent = keys.length ? `${Math.min(i + 1, keys.length)} / ${keys.length}` : '';
    };
    const currentDayKey = () => {
      const w = track.clientWidth || 1;
      const i = Math.max(0, Math.min(keys.length - 1, Math.round(track.scrollLeft / w)));
      return keys[i];
    };

    // Carga datos y (re)construye las tarjetas; reenfoca el día indicado.
    const renderCards = async (focusDay) => {
      const rawItems = await DB.listByTrip('planning_items', t.id);
      try {
        const budgets = await DB.listByTrip('budget_items', t.id);
        this._budgetByPlanningId = {};
        for (const b of budgets) if (b.planning_item_id) this._budgetByPlanningId[b.planning_item_id] = b;
      } catch (_) { this._budgetByPlanningId = {}; }
      const noteMap = {};
      (await DB.listByTrip('day_notes', t.id).catch(() => [])).forEach(n => noteMap[n.date] = n);

      const items = this._expandHotels(rawItems);
      items.sort((a, b) => (a.day_date || '').localeCompare(b.day_date || '') || planningCompare(a, b));
      const byDay = {};
      for (const it of items) { const k = it.day_date || 'sin-fecha'; (byDay[k] = byDay[k] || []).push(it); }
      Object.keys(noteMap).forEach(k => { if (!byDay[k]) byDay[k] = []; });
      if (t.start_date && t.end_date) {
        let d = parseDate(t.start_date); const end = parseDate(t.end_date);
        while (d <= end) { const k = isoLocal(d); if (!byDay[k]) byDay[k] = []; d.setDate(d.getDate() + 1); }
      }
      keys = Object.keys(byDay).filter(k => k !== 'sin-fecha').sort();
      if (byDay['sin-fecha'] && byDay['sin-fecha'].length) keys.push('sin-fecha');

      track.innerHTML = '';
      keys.forEach(k => {
        const evs = byDay[k];
        const dayNum = (t.start_date && k !== 'sin-fecha') ? (daysBetween(t.start_date, k) + 1) : null;
        const meta = noteMap[k];
        track.appendChild(el('div', { class:'flash-card', data:{ day:k } }, [
          el('div', { class:'flash-date' }, [
            dayNum ? el('div', { class:'flash-daynum', text:`Día ${dayNum}` }) : null,
            (k === 'sin-fecha')
              ? el('div', { class:'flash-date-main', text:'Sin fecha' })
              : el('div', { class:'flash-date-main' }, [
                  el('span', { class:'flash-wd', text: fmtDate(k, { weekday:'long' }) }),
                  el('span', { class:'flash-dm', text: fmtDate(k, { day:'numeric', month:'long' }) }),
                ]),
            k !== 'sin-fecha' ? el('div', { class:'flash-wx', id: `fwx-${k}` }) : null,
            (meta && meta.title) ? el('div', { class:'flash-note-title', text: meta.title }) : null,
          ].filter(Boolean)),
          el('div', { class:'flash-body' }, evs.length
            ? evs.map(it => this._planningItem(it, t))
            : [ el('div', { class:'flash-empty' }, [ el('div', { class:'flash-empty-emoji', text:'🗓️' }), el('div', { text:'Día libre — sin planes' }) ]) ]),
        ]));
      });
      // Clima + ropa por día (async), igual que en la lista.
      const _tripC = tripCoords(rawItems);
      const _nightMap = nightCoordsMap(rawItems);
      const _wxGroups = {};
      for (const k of keys) {
        if (k === 'sin-fecha') continue;
        const own = (byDay[k] || []).find(i => i.lat != null && i.lng != null);
        const c = _nightMap[k] || (own ? { lat: own.lat, lng: own.lng } : null) || _tripC;
        if (!c) continue;
        const ck = `${(+c.lat).toFixed(2)},${(+c.lng).toFixed(2)}`;
        (_wxGroups[ck] = _wxGroups[ck] || { c, days: [] }).days.push(k);
      }
      Object.values(_wxGroups).forEach(({ c, days }) => {
        Weather.forCoords(c.lat, c.lng).then(daily => {
          days.forEach(k => {
            const w = daily[k]; const txt = Weather.chipText(w);
            const span = document.getElementById(`fwx-${k}`);
            if (span && txt) { const r = Weather.ropaHint(w); span.textContent = txt + (r ? ' · ' + r : ''); }
          });
        }).catch(() => {});
      });

      // Reenfocar el día (tras añadir/editar o al abrir).
      const idx = Math.max(0, keys.indexOf(focusDay));
      track.scrollLeft = idx * track.clientWidth;
      setCounter();
    };

    let raf = 0;
    track.addEventListener('scroll', () => { if (raf) return; raf = requestAnimationFrame(() => { raf = 0; setCounter(); }); }, { passive:true });

    const teardown = () => { document.removeEventListener('keydown', onKey); overlay.remove(); };
    const doClose = () => { teardown(); if (opts.onClose) opts.onClose(); };
    const doBack = () => { teardown(); if (opts.onBack) opts.onBack(); };
    const close = opts.onBack ? doBack : doClose;   // Escape/✕ vuelven al origen si lo hay
    const onKey = (e) => {
      if (e.key === 'Escape') close();
      else if (e.key === 'ArrowRight') track.scrollBy({ left: track.clientWidth, behavior:'smooth' });
      else if (e.key === 'ArrowLeft') track.scrollBy({ left: -track.clientWidth, behavior:'smooth' });
    };

    // FAB para añadir un evento en el día que se está viendo (refresca al guardar).
    const addBtn = canEdit() ? el('button', { class:'flash-fab', 'aria-label':'Añadir evento', title:'Añadir evento',
      onclick: () => {
        const day = currentDayKey();
        TripDetail.openPlanningEditor(t, null, { day: (day && day !== 'sin-fecha') ? day : null, onSaved: () => renderCards(day) });
      }, html: svg('plus') }) : null;

    const overlay = el('div', { class:'flashview' }, [
      el('div', { class:'flash-top' }, [
        opts.onBack ? el('button', { class:'flash-close', 'aria-label':'Volver al calendario', title:'Volver al calendario', onclick: doBack, html: svg('back') }) : null,
        el('div', { class:'flash-title', text: t.name || 'Planning' }),
        counter,
        el('button', { class:'flash-close', 'aria-label':'Cerrar', onclick: doClose, html: svg('close') }),
      ].filter(Boolean)),
      track,
      addBtn,
    ].filter(Boolean));
    document.body.appendChild(overlay);
    document.addEventListener('keydown', onKey);
    await renderCards(focusDay || todayIso());
    if (!keys.length) { doClose(); UI.toast('No hay días que mostrar'); }
  },

  // Vista de CALENDARIO mensual: cada día es un círculo (fondo verde si hay
  // alojamiento) con un anillo conic-gradient repartido por categorías activas.
  // Tocar un día abre la vista de tarjeta de ese día.
  async openPlanningCalendar(t) {
    const CAL_ORDER = ['transporte','lugar','actividad','restaurante','personas','compras','gestion'];
    const CAL_COLOR = { transporte:'#2196F3', lugar:'#F4B400', actividad:'#9B59B6', restaurante:'#E67E22', personas:'#E91E8C', compras:'#CE93D8', gestion:'#8D6E63' };
    const CAL_LABEL = { transporte:'Transporte', lugar:'Lugar', actividad:'Actividad', restaurante:'Restaurante', personas:'Personas', compras:'Compras', gestion:'Gestión' };
    // Color de FONDO del círculo según el estado del alojamiento de esa noche.
    const ACCOM_BG = { confirmado:'#D4EDDA', por_iniciar:'#FCE7C8', en_consulta:'#DBEAFE', cancelado:'#FBD5D5' };
    const ACCOM_STATUS_LABEL = { confirmado:'Confirmado', por_iniciar:'Por iniciar', en_consulta:'En consulta', cancelado:'Cancelado' };
    const catOfType = (ty) =>
      (ty === 'vuelo' || ty === 'transporte' || ty === 'coche') ? 'transporte'
      : (ty === 'lugar') ? 'lugar'
      : (ty === 'actividad' || ty === 'playa') ? 'actividad'
      : (ty === 'comida') ? 'restaurante'
      : (ty === 'personas') ? 'personas'
      : (ty === 'compras') ? 'compras'
      : (ty === 'gestion' || ty === 'otro') ? 'gestion'
      : null; // hotel → null (solo fondo)

    // Datos por día: alojamiento (fondo) y categorías (anillo). Recargable, para
    // reflejar cambios al volver de la tarjeta (añadir/editar un lugar, etc.).
    // spanStartDays/spanEndDays: días que son inicio/fin de un evento multi-día (para
    // colocar el transporte a la izquierda el día de inicio y a la derecha el de fin).
    let accom = {}, catsByDay = {}, spanStartDays = new Set(), spanEndDays = new Set(), spanCatsByDay = {}, tripStart = t.start_date, tripEnd = t.end_date;
    const loadData = async () => {
      const rawItems = await DB.listByTrip('planning_items', t.id);
      const items = this._expandHotels(rawItems);
      accom = {}; catsByDay = {}; spanStartDays = new Set(); spanEndDays = new Set(); spanCatsByDay = {};
      for (const it of items) {
        const k = it.day_date; if (!k) continue;
        if (it.type === 'hotel') {
          // Guarda el ESTADO de la noche (no solo "hay alojamiento") para teñir el fondo.
          if (it._virtual === 'night' || !it._virtual) accom[k] = itemStatus(it) || 'confirmado';
          continue;
        }
        const c = catOfType(it.type);
        if (c) (catsByDay[k] = catsByDay[k] || new Set()).add(c);
        // Categorías que provienen de un evento multi-día (para saber qué es "cuerpo" y
        // qué es evento puntual del día en los días de inicio/fin).
        if (it._spanStart && c) (spanCatsByDay[k] = spanCatsByDay[k] || new Set()).add(c);
        // El evento real multi-día marca su día de inicio y su día de fin.
        if (it._spanStart && it._spanEnd && !it._virtual) { spanStartDays.add(it._spanStart); spanEndDays.add(it._spanEnd); }
      }
      // Rango del viaje (para qué días son "navegables"); si no hay fechas, usa los eventos.
      tripStart = t.start_date; tripEnd = t.end_date;
      if (!tripStart || !tripEnd) {
        const ds = Object.keys({ ...accom, ...catsByDay }).sort();
        if (ds.length) { tripStart = tripStart || ds[0]; tripEnd = tripEnd || ds[ds.length - 1]; }
      }
    };
    await loadData();

    const fmtKey = (dt) => `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`;
    // Construye el anillo a partir de una lista YA ORDENADA de categorías. El conic-gradient
    // empieza arriba (0°) y va en sentido horario: el 1er color ocupa la mitad DERECHA y el
    // último la mitad IZQUIERDA (con 2 categorías). Por eso el orden controla izquierda/derecha.
    // Color de una categoría. En días PASADOS se aclara mezclándolo con blanco
    // (pastel): conserva el matiz pero queda claramente más pálido que cualquier
    // color de categoría "activo" (incluidos los ya de por sí claros como compras).
    // Además, el número del día pasado va en gris (CSS), lo que hace inequívoco el
    // estado "pasado" aunque un pastel se acercara a otro color.
    const catColor = (c, past) => past ? `color-mix(in srgb, ${CAL_COLOR[c]} 38%, #fff)` : CAL_COLOR[c];
    const ringFromCats = (cats, bg, past) => {
      if (!cats.length) return bg;
      if (cats.length === 1) return catColor(cats[0], past);
      const seg = 360 / cats.length;
      return `conic-gradient(${cats.map((c,i)=>`${catColor(c, past)} ${(i*seg).toFixed(2)}deg ${((i+1)*seg).toFixed(2)}deg`).join(', ')})`;
    };
    // Orden de categorías de un día. Por defecto CAL_ORDER. Pero si el día es inicio/fin de
    // un evento multi-día, el color del evento que abarca varios días se queda en el lado
    // INTERIOR (hacia el bloque) y los eventos puntuales de ese día se van al lado del BORDE:
    // a la izquierda el día de inicio ("abre") y a la derecha el de fin ("cierra").
    // (1er color del conic-gradient = mitad derecha; último = mitad izquierda.)
    const orderedCats = (set, key) => {
      const cats = CAL_ORDER.filter(c => set && set.has(c) && !hidden.has(c));
      if (cats.length <= 1) return cats;
      const isStart = spanStartDays.has(key), isEnd = spanEndDays.has(key);
      if (!isStart && !isEnd) return cats;
      const spanSet = spanCatsByDay[key] || new Set();
      const body = cats.filter(c => spanSet.has(c));     // cuerpo (multi-día) → interior
      const edge = cats.filter(c => !spanSet.has(c));    // puntuales del día → borde
      if (!body.length || !edge.length) return cats;
      // inicio: cuerpo a la derecha (interior) y puntuales a la izquierda (abre).
      // fin:    puntuales a la derecha (cierra) y cuerpo a la izquierda (interior).
      return isStart ? [...body, ...edge] : [...edge, ...body];
    };

    const today = todayIso();
    // Colores ocultos (persistidos en settings → sincroniza entre dispositivos).
    const hidden = new Set(Array.isArray(tripSettings(t).cal_hidden) ? tripSettings(t).cal_hidden : []);
    const persistHidden = async () => { try { tripSettingsMut(t).cal_hidden = [...hidden]; await DB.put('trips', t); } catch (_) {} };

    const close = () => { document.removeEventListener('keydown', onKey); document.body.classList.remove('sheet-open'); overlay.remove(); };
    const onKey = (e) => { if (e.key === 'Escape') close(); else if (e.key === 'ArrowLeft') step(-1); else if (e.key === 'ArrowRight') step(1); };

    // Mes inicial: el de hoy si cae en el viaje; si no, el del inicio del viaje.
    const startRef = (tripStart && tripEnd && today >= tripStart && today <= tripEnd) ? parseDate(today)
      : tripStart ? parseDate(tripStart) : parseDate(today);
    let view = new Date(startRef.getFullYear(), startRef.getMonth(), 1);

    const monthEl = el('div', { class:'tcal-month' });
    const grid = el('div', { class:'tcal-grid' });
    const WD = ['L','M','X','J','V','S','D'];

    const renderMonth = () => {
      const y = view.getFullYear(), m = view.getMonth();
      const ml = view.toLocaleDateString('es-ES', { month:'long' });
      monthEl.textContent = `${ml.charAt(0).toUpperCase() + ml.slice(1)} ${y}`;
      grid.innerHTML = '';
      const first = new Date(y, m, 1);
      const offset = (first.getDay() + 6) % 7;          // semana empieza en lunes
      const daysInMonth = new Date(y, m + 1, 0).getDate();
      const weeks = Math.ceil((offset + daysInMonth) / 7);
      const start = new Date(y, m, 1 - offset);
      const showAccom = !hidden.has('alojamiento');
      for (let i = 0; i < weeks * 7; i++) {
        const dt = new Date(start.getFullYear(), start.getMonth(), start.getDate() + i);
        const key = fmtKey(dt);
        const inMonth = dt.getMonth() === m;
        const inTrip = tripStart && tripEnd && key >= tripStart && key <= tripEnd;
        const isToday = key === today;
        const isPast = key < today;
        if (inTrip) {
          const set = catsByDay[key];
          const ordered = orderedCats(set, key);   // respeta izquierda/derecha del transporte
          const hasRing = ordered.length > 0;
          // Relleno del círculo: en días pasados es blanco (el pasado se marca con el
          // anillo en pastel + el número en gris, ver catColor y el CSS .tcal-cell.past;
          // ignora el alojamiento). Presente y futuro tiñen el fondo según el alojamiento.
          const bg = isPast ? '#fff'
            : (accom[key] && showAccom) ? (ACCOM_BG[accom[key]] || '#D4EDDA') : '#fff';
          const ring = el('span', { class:'tcal-ring' }, [
            el('span', { class:'tcal-num', text: String(dt.getDate()) }),
          ]);
          // Custom properties: hay que usar setProperty (Object.assign no las aplica).
          ring.style.setProperty('--ring', ringFromCats(ordered, bg, isPast));
          ring.style.setProperty('--cell-bg', bg);
          grid.appendChild(el('button', {
            class:'tcal-cell clickable' + (hasRing ? ' has-ring' : '') + (isToday ? ' today' : '') + (isPast ? ' past' : '') + (inMonth ? '' : ' out'),
            onclick: () => {
              document.removeEventListener('keydown', onKey);
              overlay.style.display = 'none';
              TripDetail.openPlanningFlashcards(t, key, {
                // Al volver, recargamos datos por si se añadió/editó algo (que el círculo
                // del color aparezca al momento).
                onBack: async () => { overlay.style.display = 'flex'; document.addEventListener('keydown', onKey); await loadData(); renderMonth(); },
                onClose: () => overlay.remove(),
              });
            },
          }, [ ring, isToday ? el('span', { class:'tcal-today-dot' }) : null ].filter(Boolean)));
        } else {
          grid.appendChild(el('div', {
            class:'tcal-cell' + (isToday ? ' today' : '') + (inMonth ? '' : ' out'),
          }, [ el('span', { class:'tcal-num-plain', text: String(dt.getDate()) }), isToday ? el('span', { class:'tcal-today-dot' }) : null ].filter(Boolean)));
        }
      }
    };
    const step = (n) => { view = new Date(view.getFullYear(), view.getMonth() + n, 1); renderMonth(); };

    // Deslizar el dedo sobre el calendario para cambiar de mes (izq → avanza, der → retrocede).
    let _tx = 0, _ty = 0;
    grid.addEventListener('touchstart', (e) => { const tch = e.changedTouches[0]; _tx = tch.clientX; _ty = tch.clientY; }, { passive:true });
    grid.addEventListener('touchend', (e) => {
      const tch = e.changedTouches[0]; const dx = tch.clientX - _tx, dy = tch.clientY - _ty;
      if (Math.abs(dx) > 45 && Math.abs(dx) > Math.abs(dy) * 1.4) step(dx < 0 ? 1 : -1);
    }, { passive:true });

    // Leyenda clicable: cada item activa/desactiva su color (se guarda en settings).
    const legend = el('div', { class:'tcal-legend' });
    const addLegend = (id, dotEl, label) => {
      const btn = el('button', { class:'tcal-legend-item' + (hidden.has(id) ? ' off' : ''),
        onclick: () => {
          if (hidden.has(id)) hidden.delete(id); else hidden.add(id);
          btn.classList.toggle('off', hidden.has(id));
          renderMonth(); persistHidden();
        } }, [ dotEl, el('span', { text: label }) ]);
      legend.appendChild(btn);
    };
    CAL_ORDER.forEach(c => { const dot = el('span', { class:'tcal-legend-dot' }); dot.style.background = CAL_COLOR[c]; addLegend(c, dot, CAL_LABEL[c]); });
    addLegend('alojamiento', el('span', { class:'tcal-legend-accom' }), 'Alojamiento');

    // Sub-leyenda: el FONDO del círculo = estado del alojamiento de esa noche.
    const accomLegend = el('div', { class:'tcal-accom-legend' }, [
      el('span', { class:'tcal-accom-legend-label', text:'Fondo = alojamiento:' }),
      ...['confirmado','por_iniciar','en_consulta','cancelado'].map(s => el('span', { class:'tcal-accom-legend-item' }, [
        (() => { const sw = el('span', { class:'tcal-accom-sw' }); sw.style.background = ACCOM_BG[s]; return sw; })(),
        el('span', { text: ACCOM_STATUS_LABEL[s] }),
      ])),
    ]);

    // Leyenda plegada bajo un desplegable (no aparece siempre).
    const legendWrap = el('div', { class:'tcal-legend-wrap' }, [ legend, accomLegend ]);
    legendWrap.style.display = 'none';
    const legendToggle = el('button', { class:'tcal-legend-toggle', onclick: () => {
      const open = legendWrap.style.display === 'none';
      legendWrap.style.display = open ? '' : 'none';
      legendToggle.classList.toggle('open', open);
    } }, [ el('span', { text:'Leyenda' }), el('span', { class:'tcal-legend-chev', html: svg('chevron') }) ]);
    const legendBox = el('div', { class:'tcal-legend-box' }, [ legendToggle, legendWrap ]);

    const overlay = el('div', { class:'calview' }, [
      el('div', { class:'flash-top' }, [
        el('div', { class:'flash-title', text: t.name || 'Calendario' }),
        el('button', { class:'flash-close', 'aria-label':'Cerrar', onclick: close, html: svg('close') }),
      ]),
      el('div', { class:'tcal-scroll' }, [
        el('div', { class:'tcal-inner' }, [
          el('div', { class:'tcal-monthbar' }, [
            el('button', { class:'tcal-nav', 'aria-label':'Mes anterior', onclick: () => step(-1), html: svg('back') }),
            monthEl,
            el('button', { class:'tcal-nav next', 'aria-label':'Mes siguiente', onclick: () => step(1), html: svg('back') }),
          ]),
          el('div', { class:'tcal-weekdays' }, WD.map(w => el('div', { class:'tcal-wd', text: w }))),
          grid,
          legendBox,
          el('div', { class:'tcal-hint', text:'Toca un día para ver su tarjeta · toca un color para ocultarlo.' }),
        ]),
      ]),
    ]);
    document.body.appendChild(overlay);
    document.addEventListener('keydown', onKey);
    renderMonth();
  },

  _shortUrl(u) {
    try {
      const url = new URL(u);
      return url.hostname.replace(/^www\./,'') + (url.pathname.length > 1 ? '…' : '');
    } catch (_) { return u.length > 40 ? u.slice(0,40)+'…' : u; }
  },

  // Genera un título por defecto inteligente cuando el usuario no lo rellena.
  // Lee los campos visibles del editor (place_name, TZ, ciudades del trip)
  // y compone algo como "Vuelo Madrid - Tokyo" / "Hotel Tokio" / "Coche Tokio".
  _defaultTitle(type, t) {
    const tCity = (t.city || '').trim();
    const tCountry = (t.country || '').trim();
    const place = ($('#f-place')?.value || '').trim();
    const tzCity = (tz) => tz ? tz.split('/').pop().replace(/_/g, ' ') : '';
    const meta = (id) => ($(`#meta-${id}`)?.value || '').trim();
    switch (type) {
      case 'vuelo': {
        const num = meta('numero');
        const ori = meta('origen') || tzCity($('#f-origin-tz')?.value);
        const dest = meta('destino') || tzCity($('#f-dest-tz')?.value);
        const aero = meta('aerolinea');
        if (ori && dest) return num ? `Vuelo ${num} ${ori} - ${dest}` : `Vuelo ${ori} - ${dest}`;
        if (aero && dest) return `${aero} a ${dest}`;
        if (dest) return `Vuelo a ${dest}`;
        if (tCity) return `Vuelo a ${tCity}`;
        if (tCountry) return `Vuelo a ${tCountry}`;
        return 'Vuelo';
      }
      case 'hotel': {
        const nombre = meta('nombre');
        if (nombre) return nombre;
        if (place) return place;
        if (tCity) return `Hotel ${tCity}`;
        if (tCountry) return `Hotel ${tCountry}`;
        return 'Hotel';
      }
      case 'coche': {
        const comp = meta('compania');
        const mod = meta('modelo');
        if (comp && mod) return `${comp} · ${mod}`;
        if (comp) return `Coche ${comp}`;
        if (mod) return `Coche ${mod}`;
        if (tCity) return `Coche ${tCity}`;
        return 'Coche de alquiler';
      }
      case 'transporte': {
        const num = meta('numero');
        const ori = meta('origen');
        const dest = meta('destino');
        const comp = meta('compania');
        if (ori && dest) return num ? `${num} ${ori} - ${dest}` : `${comp || 'Transporte'} ${ori} - ${dest}`;
        if (comp) return `Transporte ${comp}`;
        if (tCity) return `Transporte a ${tCity}`;
        return 'Transporte';
      }
      case 'actividad': {
        const org = meta('organizador');
        if (place && org) return `${place} (${org})`;
        if (place) return place;
        return tCity ? `Actividad en ${tCity}` : 'Actividad';
      }
      case 'comida': {
        if (place) return place;
        return tCity ? `Comida en ${tCity}` : 'Comida';
      }
      case 'lugar': {
        return place || (tCity ? `Visita en ${tCity}` : 'Visita');
      }
      case 'personas': {
        // El título real (nombres) se resuelve en collect() con las personas elegidas.
        return place || 'Personas';
      }
      case 'otro':
      default: {
        return place || 'Parada';
      }
    }
  },

  _wirePlanningDnD(root, t) {
    let dragged = null;
    const clearTargets = () => {
      root.querySelectorAll('.drag-over-top,.drag-over-bot').forEach(n => n.classList.remove('drag-over-top','drag-over-bot'));
      root.querySelectorAll('.day-target').forEach(n => n.classList.remove('day-target'));
    };

    root.querySelectorAll('.timeline-item:not(.virtual)').forEach(item => {
      item.addEventListener('dragstart', (e) => {
        dragged = item;
        item.classList.add('dragging');
        document.body.classList.add('dragging-planning');
        e.dataTransfer.effectAllowed = 'move';
        try { e.dataTransfer.setData('text/plain', item.dataset.id); } catch (_) {}
      });
      item.addEventListener('dragend', () => {
        item.classList.remove('dragging');
        document.body.classList.remove('dragging-planning');
        clearTargets();
        dragged = null;
      });
      item.addEventListener('dragover', (e) => {
        if (!dragged || dragged === item) return;
        e.preventDefault();
        e.dataTransfer.dropEffect = 'move';
        // Limpiar otros targets antes de marcar este
        root.querySelectorAll('.drag-over-top,.drag-over-bot').forEach(n => {
          if (n !== item) n.classList.remove('drag-over-top','drag-over-bot');
        });
        const rect = item.getBoundingClientRect();
        const before = (e.clientY - rect.top) < rect.height / 2;
        item.classList.toggle('drag-over-top', before);
        item.classList.toggle('drag-over-bot', !before);
      });
      item.addEventListener('dragleave', (e) => {
        // Solo limpiar si el cursor realmente salió de este item
        const r = item.getBoundingClientRect();
        if (e.clientX < r.left || e.clientX > r.right || e.clientY < r.top || e.clientY > r.bottom) {
          item.classList.remove('drag-over-top','drag-over-bot');
        }
      });
      item.addEventListener('drop', async (e) => {
        if (!dragged || dragged === item) return;
        e.preventDefault();
        e.stopPropagation();
        const before = item.classList.contains('drag-over-top');
        const targetDay = item.dataset.day;
        const draggedDay = dragged.dataset.day;
        clearTargets();
        document.body.classList.remove('dragging-planning');
        await TripDetail._reorderPlanning(t, dragged.dataset.id, item.dataset.id, before, targetDay);
        if (targetDay !== draggedDay) UI.toast(`Movido al ${targetDay === 'sin-fecha' ? 'día sin fecha' : fmtDateShort(targetDay)}`);
      });
    });

    // Drop sobre el contenedor del día (espacio vacío del día → mover al final del día)
    root.querySelectorAll('.day-group').forEach(grp => {
      grp.addEventListener('dragover', (e) => {
        if (!dragged) return;
        // si está sobre un item específico, deja que ese maneje
        if (e.target.closest('.timeline-item')) return;
        e.preventDefault();
        e.dataTransfer.dropEffect = 'move';
        // Limpiar otros day-targets para mostrar solo este
        root.querySelectorAll('.day-target').forEach(n => { if (n !== grp) n.classList.remove('day-target'); });
        grp.classList.add('day-target');
      });
      grp.addEventListener('dragleave', (e) => {
        if (!grp.contains(e.relatedTarget)) grp.classList.remove('day-target');
      });
      grp.addEventListener('drop', async (e) => {
        if (!dragged) return;
        if (e.target.closest('.timeline-item')) return;
        e.preventDefault();
        const day = grp.dataset.day;
        const draggedDay = dragged.dataset.day;
        clearTargets();
        document.body.classList.remove('dragging-planning');
        await TripDetail._reorderPlanning(t, dragged.dataset.id, null, false, day);
        if (day !== draggedDay) UI.toast(`Movido al ${day === 'sin-fecha' ? 'día sin fecha' : fmtDateShort(day)}`);
      });
    });
  },

  async _reorderPlanning(t, draggedId, targetId, before, targetDay) {
    if (!canEdit()) return;
    const dragged = await DB.get('planning_items', draggedId);
    if (!dragged) return;
    // calcular nueva day_date y order_index
    if (targetDay && targetDay !== 'sin-fecha') dragged.day_date = targetDay;
    else if (targetDay === 'sin-fecha') dragged.day_date = null;

    // listar items del día destino (excluyendo el arrastrado), ordenarlos y recolocar
    const all = (await DB.listByTrip('planning_items', t.id)).filter(p => p.id !== draggedId);
    const sameDay = all.filter(p => (p.day_date || 'sin-fecha') === (dragged.day_date || 'sin-fecha'));
    sameDay.sort((a,b) => (a.time||'').localeCompare(b.time||'') || (a.order_index||0)-(b.order_index||0));

    let newIndex;
    if (!targetId) {
      // soltado en el contenedor del día → al final
      newIndex = sameDay.length;
    } else {
      const idx = sameDay.findIndex(p => p.id === targetId);
      newIndex = before ? idx : idx + 1;
    }
    sameDay.splice(newIndex, 0, dragged);
    // recalcular order_index secuencial
    for (let i = 0; i < sameDay.length; i++) {
      const p = sameDay[i];
      if (p.order_index !== i || p.id === draggedId) {
        p.order_index = i;
        await DB.put('planning_items', p);
      }
    }
    UI.toast('Reordenado');
    Router.render();
  },

  // Editor del título y color del día (pill encima del listado).
  // Comparte el mismo registro day_notes que la nota libre.
  // Pulsación larga (≈500 ms) o clic derecho sobre `node` → ejecuta onLong, y suprime
  // el click posterior para que no se dispare la acción normal (p. ej. plegar el día).
  _attachLongPress(node, onLong) {
    let timer = null, fired = false, sx = 0, sy = 0;
    const clear = () => { if (timer) { clearTimeout(timer); timer = null; } };
    node.addEventListener('pointerdown', (e) => {
      if (e.pointerType === 'mouse' && e.button !== 0) return;
      fired = false; sx = e.clientX; sy = e.clientY; clear();
      timer = setTimeout(() => { fired = true; clear(); onLong(); }, 500);
    });
    node.addEventListener('pointermove', (e) => { if (timer && (Math.abs(e.clientX - sx) > 8 || Math.abs(e.clientY - sy) > 8)) clear(); });
    node.addEventListener('pointerup', clear);
    node.addEventListener('pointercancel', clear);
    node.addEventListener('pointerleave', clear);
    node.addEventListener('click', (e) => { if (fired) { e.preventDefault(); e.stopPropagation(); fired = false; } }, true);
    node.addEventListener('contextmenu', (e) => { e.preventDefault(); onLong(); });
  },

  async openPlanningEditor(t, existing=null, opts=null) {
    if (!canEdit()) { UI.toast('Modo lector — no puedes modificar'); return; }
    // Si llega un item VIRTUAL (noche/check-out/llegada/span) o una copia de día de un
    // evento multi-día, editamos el item BASE: restauramos día/hora de inicio y quitamos
    // los marcadores para no persistirlos.
    if (existing && (existing._virtual || existing._spanStart)) {
      const v = existing._virtual;
      existing = { ...existing };
      delete existing._virtual; delete existing._isFirstNight;
      if (v === 'span') {
        existing.day_date = existing._spanStart || existing.day_date;
        existing.time = existing._spanTime || '';
      } else if (v) {
        existing.day_date = existing.consultation_planned_d1 || existing.day_date;
        existing.time = typeDef(existing.type).hideTime ? null : (existing.consultation_planned_t1 || existing.time || '');
      }
      delete existing._spanStart; delete existing._spanEnd; delete existing._spanTime;
    }
    // Busca un budget_item vinculado a este planning_item (lo hubo o no).
    // Sirve para precargar el importe en el editor y para no duplicar al guardar.
    let linkedBudget = null;
    if (existing?.id) {
      try {
        const all = await DB.listByTrip('budget_items', t.id);
        linkedBudget = all.find(b => b.planning_item_id === existing.id) || null;
      } catch (_) {}
    }
    // Personas ya usadas en el viaje (para ofrecerlas como chips toggleables).
    const _planForPeople = await DB.listByTrip('planning_items', t.id).catch(() => []);
    const tripPeople = [...new Set(_planForPeople.flatMap(p => Array.isArray(p.people) ? p.people : []))];
    // Frecuencia de cada persona en el viaje → las 4 más comunes salen como pills rápidas.
    const _peopleFreq = {};
    _planForPeople.forEach(p => { (Array.isArray(p.people) ? p.people : []).forEach(n => { _peopleFreq[n] = (_peopleFreq[n] || 0) + 1; }); });
    const topPeople = Object.entries(_peopleFreq)
      .sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0], 'es'))
      .slice(0, 4).map(e => e[0]);
    let personasDropdownOpen = false;
    const it = existing || {
      id: uuid(), trip_id: t.id, type:'lugar',
      day_date: (opts && opts.day) || t.start_date || todayIso(), time:'', title:'',
      place_name:'', lat:null, lng:null, gmaps_url:'', address:'', notes:'', order_index:0,
      status: null,                       // se setea según el tipo al renderizar
      in_consultation: false,             // legacy, derivado de status
      consultation_url:'', consultation_price:null, consultation_currency: t.default_currency || 'EUR',
      consultation_query_date: todayIso(),
      consultation_planned_d1:null, consultation_planned_t1:null,
      consultation_planned_d2:null, consultation_planned_t2:null,
      metadata: {},
    };
    if (!it.metadata) it.metadata = {};
    // Estado inicial: el valor crudo manda (incluido el centinela 'ninguno' = Sin estado);
    // si no hay nada, derivamos el efectivo (reservas legacy → por_iniciar).
    let currentStatus = it.status || itemStatus(it);

    let searchTimer = null;
    const doSearch = async (q) => {
      const box = $('#plan-search-results');
      box.innerHTML = '';
      if (!q || q.length < 3) return;
      if (!navigator.onLine) {
        box.innerHTML = '<div class="search-result muted">Sin conexión: introduce manualmente.</div>';
        return;
      }
      box.innerHTML = '<div class="search-result muted">Buscando…</div>';
      try {
        // Prioriza resultados cerca de la parada (si ya tiene coords) para afinar negocios.
        const bias = (it.lat != null && it.lng != null) ? { lat: it.lat, lng: it.lng } : null;
        const results = await placeSearch(q, bias);
        box.innerHTML = '';
        if (!results.length) { box.innerHTML = '<div class="search-result muted">Sin resultados. Escribe los campos manualmente abajo.</div>'; return; }
        results.forEach(res => {
          const node = el('div', { class:'search-result', onclick: () => {
            it.place_name = res.name || res.address;
            it.address = res.address;
            it.lat = res.lat; it.lng = res.lng;
            it.gmaps_url = gmapsUrl(it.lat, it.lng);
            // Solo autocompletar el título desde el lugar si el campo está vacío;
            // si el usuario ya escribió algo, respetarlo (no pisarlo con el valor previo).
            const fTitle = $('#f-title'); if (fTitle && !fTitle.value.trim()) fTitle.value = it.place_name;
            const fPlace = $('#f-place'); if (fPlace) fPlace.value = it.place_name;
            const fAddr  = $('#f-address'); if (fAddr) fAddr.value = it.address;
            // Limpiamos el input de búsqueda para que se vea que "ha registrado" la selección
            const fSearch = $('#f-search'); if (fSearch) fSearch.value = '';
            box.innerHTML = '';
            // Refrescar la confirmación visual del lugar elegido
            refreshSelectedPlace();
          }}, [
            el('div', { class:'sr-name', text: res.name || res.address }),
            (res.address && res.address !== res.name) ? el('div', { class:'sr-addr', text: res.address }) : null,
          ].filter(Boolean));
          box.appendChild(node);
        });
      } catch (e) { console.warn(e); box.innerHTML = '<div class="search-result muted">Error de búsqueda. Inténtalo de nuevo.</div>'; }
    };

    // === Bloque UNIFICADO de fechas/horas, arriba del editor ===
    // - Tipos rango (alojamiento/vuelo/transporte/coche): "Desde/Hasta" (o Salida/Llegada,
    //   Recogida/Devolución) con fecha + hora. Se guardan en consultation_planned_d1/t1/d2/t2.
    // - Tipos puntuales (lugar/playa/comida/compras/actividad/otro): "Día" + "Hora"
    //   (+ "Hora fin" para lugar/playa).
    const RANGE_LABELS = {
      hotel:      { d1:'Desde',    d2:'Hasta',      withTime:true,  hint:'El alojamiento aparece como noche al final de cada día del rango; la salida (check-out), al inicio del último día.' },
      vuelo:      { d1:'Salida',   d2:'Llegada',    withTime:true,  hint:'Si la llegada es en otro día, también se mostrará ese día en el planning.' },
      transporte: { d1:'Salida',   d2:'Llegada',    withTime:true,  hint:'Si la llegada es en otro día, también se mostrará ese día en el planning.' },
      coche:      { d1:'Recogida', d2:'Devolución', withTime:false, hint:'' },
    };
    const datesBlock = el('div', { id:'dates-block', class:'form-row' });
    // Input de hora con botón ✕ para vaciarlo (en iOS el time nativo no se puede
    // dejar en blanco una vez tiene valor; este botón lo borra por JS).
    const timeInput = (id, value) => {
      const inp = el('input', { id, type:'time', value: value || '' });
      const clr = el('button', { type:'button', class:'time-clear', title:'Quitar hora', 'aria-label':'Quitar hora',
        onclick: () => { inp.value = ''; inp.dispatchEvent(new Event('change')); } }, '✕');
      return el('div', { class:'time-with-clear' }, [ inp, clr ]);
    };
    const renderDatesBlock = () => {
      const type = $('#f-type')?.value || it.type;
      datesBlock.innerHTML = '';
      const R = RANGE_LABELS[type];
      // Botón "vuelo de vuelta" solo para vuelos
      const rf = document.getElementById('return-flight-wrap'); if (rf) rf.style.display = (type === 'vuelo') ? '' : 'none';
      if (R) {
        const d1 = it.consultation_planned_d1 || it.day_date || '';
        const t1 = it.consultation_planned_t1 || '';
        const d2 = it.consultation_planned_d2 || '';
        const t2 = it.consultation_planned_t2 || '';
        const inD1 = el('input', { id:'tr-d1', type:'date', value:d1 });
        const inD2 = el('input', { id:'tr-d2', type:'date', value:d2 });
        if (d1) inD2.min = d1;
        const cell = (lbl, inp) => el('div', { class:'form-row' }, [ el('label', { class:'sub-lbl', text:lbl }), inp ]);
        const row1 = R.withTime
          ? el('div', { class:'form-grid-2' }, [ cell(R.d1, inD1), cell('Hora', timeInput('tr-t1', t1)) ])
          : cell(R.d1, inD1);
        const row2 = R.withTime
          ? el('div', { class:'form-grid-2' }, [ cell(R.d2, inD2), cell('Hora', timeInput('tr-t2', t2)) ])
          : cell(R.d2, inD2);
        datesBlock.appendChild(el('label', { text:'Fechas' }));
        datesBlock.appendChild(row1);
        datesBlock.appendChild(row2);
        // "Hasta" no puede ser anterior a "Desde", y al fijar "Desde" arranca ahí.
        inD1.addEventListener('change', () => {
          inD2.min = inD1.value || '';
          if (inD1.value && (!inD2.value || inD2.value < inD1.value)) inD2.value = inD1.value;
        });
        if (R.hint) datesBlock.appendChild(el('div', { class:'field-hint', text:R.hint }));
      } else {
        const showEnd = true;   // todos los tipos puntuales admiten día y hora de fin
        const cell = (lbl, inp) => el('div', { class:'form-row' }, [ el('label', { class:'sub-lbl', text:lbl }), inp ]);
        datesBlock.appendChild(el('label', { text:'Fecha y hora' }));
