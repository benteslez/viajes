.status-picker .opt.s-dudoso   .dot { background:#f59e0b; }
.status-picker .opt.s-aplazado .dot { background:#a855f7; }
.status-picker .opt.s-sin_fecha .dot { background:#e879f9; }
.status-picker .opt.s-sin      .dot { background:var(--text-muted); }
.status-picker .opt.s-dudoso.active   { border-color:#f59e0b; background:color-mix(in srgb, #fbbf24 14%, var(--bg-elev)); }
.status-picker .opt.s-aplazado.active { border-color:#a855f7; background:color-mix(in srgb, #c084fc 14%, var(--bg-elev)); }
.status-picker .opt.s-sin_fecha.active { border-color:#e879f9; background:color-mix(in srgb, #e879f9 14%, var(--bg-elev)); }
.status-picker .opt.s-sin.active      { border-color:var(--text-muted); background:var(--bg-soft); }

/* Inquiry confirmada — resaltada en verde */
.list-item.confirmed {
  border-color:color-mix(in srgb, var(--status-curso) 45%, var(--line));
  background:color-mix(in srgb, var(--status-curso) 8%, var(--bg-elev));
}
.list-item.confirmed .li-title { color:var(--text); }
.confirm-badge {
  display:inline-flex; align-items:center; gap:4px;
  font-family:var(--font-ui);
  font-size:10.5px; font-weight:600;
  letter-spacing:.012em;
  padding:3px 10px; border-radius:var(--r-pill);
  background:color-mix(in srgb, var(--status-curso) 18%, var(--bg-elev));
  color:var(--status-curso);
  border:1px solid color-mix(in srgb, var(--status-curso) 40%, transparent);
}
.confirm-badge svg { width:11px; height:11px; }

.inquiry-row .price { font-feature-settings:"tnum","ss01"; font-weight:600; letter-spacing:-.005em; }
.inquiry-row .price .cur { color:var(--text-muted); font-weight:400; font-size:.85em; margin-left:2px; }

/* checkbox */
.check {
  appearance:none; -webkit-appearance:none;
  width:22px; height:22px; border:1.5px solid var(--line);
  border-radius:6px; background:var(--bg-elev);
  cursor:pointer; flex-shrink:0;
  display:inline-flex; align-items:center; justify-content:center;
  transition:all .18s var(--ease);
}
.check:checked { background:var(--accent); border-color:var(--accent); }
.check:checked::after {
  content:''; width:6px; height:11px; border:solid #fff;
  border-width:0 2px 2px 0; transform:rotate(45deg) translateY(-1px);
}

/* ========================================================================
   Tabs (sub-navegación en detalle de viaje)
   ====================================================================== */
.subtabs {
  display:flex; gap:6px; overflow-x:auto;
  margin:0 -16px 24px; padding:0 16px 4px;
  scrollbar-width:none;
  border-bottom:1px solid var(--line-soft);
}
.subtabs::-webkit-scrollbar { display:none; }
.subtab {
  flex-shrink:0;
  border:none; background:transparent; color:var(--text-muted);
  padding:10px 14px;
  font-size:14px; font-weight:500;
  cursor:pointer;
  border-bottom:2px solid transparent;
  margin-bottom:-1px;
  transition:all .18s var(--ease);
}
.subtab:hover { color:var(--text); }
.subtab.active { color:var(--accent); border-bottom-color:var(--accent); }

/* ========================================================================
   Mapa
   ====================================================================== */
.map-container {
  width:100%; height:420px;
  border-radius:var(--r-lg);
  overflow:hidden;
  border:1px solid var(--line);
  box-shadow:var(--sh-1);
}
@media (max-width:719px) { .map-container { height:320px; } }

/* Mini-mapa del día (Resumen) — paradas numeradas + ruta */
.day-map {
  width:100%; height:260px; margin-top:14px;
  border-radius:var(--r-md); overflow:hidden;
  border:1px solid var(--line); box-shadow:var(--sh-1);
}
.day-map-pin { background:transparent; border:none; }
.day-map-pin span {
  display:flex; align-items:center; justify-content:center;
  width:26px; height:26px; border-radius:50%;
  background:#2563eb; color:#fff; font-weight:700; font-size:13px;
  border:2px solid #fff; box-shadow:0 1px 4px rgba(0,0,0,.45);
  font-family:var(--font-ui);
}
.leaflet-container { font-family:var(--font-ui) !important; }
/* Con una hoja/editor abierto, oculta los mapas que quedan detrás (el #sheet va
   aparte del #view-root, así que su propio mapa no se ve afectado). Evita que las
   teselas de Leaflet se cuelen por encima del overlay en iOS. */
body.sheet-open #view-root .leaflet-container,
body:has(.calview) #view-root .leaflet-container,
body:has(.wrf-overlay) #view-root .leaflet-container { visibility: hidden !important; }
/* Pin del mapa coloreado por día + leyenda. */
.map-day-pin { background:transparent; border:none; }
.map-day-pin span {
  display:flex; align-items:center; justify-content:center;
  width:24px; height:24px; border-radius:50%;
  color:#fff; font-weight:700; font-size:12px;
  border:2px solid #fff; box-shadow:0 1px 4px rgba(0,0,0,.4);
  font-family:var(--font-ui);
}
.map-legend { display:flex; flex-wrap:wrap; gap:8px 14px; margin:10px 2px 2px; }
.map-legend-item { display:inline-flex; align-items:center; gap:6px; font-size:12.5px; color:var(--text-muted); font-weight:600; }
.map-legend-dot { width:11px; height:11px; border-radius:50%; flex-shrink:0; }

/* Conector tiempo/distancia entre paradas del planning. */
.timeline-list .leg-chip {
  align-self:flex-start; margin:-2px 0 -2px 20px; padding:2px 0;
  display:inline-flex; align-items:center; text-decoration:none;
}
.timeline-list .leg-chip .leg-info {
  font-size:11.5px; font-weight:600; color:var(--text-muted);
  background:var(--bg-soft); border:1px solid var(--line-soft);
  padding:2px 9px; border-radius:var(--r-pill); white-space:nowrap;
  font-feature-settings:"tnum","ss01";
}
.timeline-list .leg-chip:active .leg-info { background:var(--line-soft); }
.timeline-list .leg-chip .leg-src { width:6px; height:6px; border-radius:50%; margin-left:6px; flex-shrink:0; }
.timeline-list .leg-chip .leg-src.offline { background:#f59e0b; }
.timeline-list .leg-chip .leg-src.online  { background:#10b981; }
/* Punto parpadeante mientras se recalcula la ruta real en segundo plano. */
.timeline-list .leg-chip .leg-src.pending { animation:legPulse 1s ease-in-out infinite; }
@keyframes legPulse { 0%,100% { opacity:1; transform:scale(1); } 50% { opacity:.35; transform:scale(.7); } }
/* Tramo largo = "trayecto" entre ciudades: informativo, no alarmante. */
.timeline-list .leg-chip.leg-long .leg-info {
  color:var(--accent); background:color-mix(in srgb, var(--accent) 9%, var(--bg-soft));
  border-color:color-mix(in srgb, var(--accent) 22%, var(--line-soft));
}
/* Tramo "desde el alojamiento" hasta la primera parada del día. */
.timeline-list .leg-chip.leg-hotel .leg-info {
  color:var(--accent-2); background:color-mix(in srgb, var(--accent-2) 10%, var(--bg-soft));
  border-color:color-mix(in srgb, var(--accent-2) 24%, var(--line-soft));
}
/* Resumen de ruta del día. */
.day-route-summary {
  font-size:13px; font-weight:500; color:var(--text-muted);
  display:inline-flex; align-items:center; gap:5px; font-feature-settings:"tnum","ss01";
}
.day-group.collapsed .day-route-summary { display:none; }
/* Aviso "quizá no dé tiempo" a nivel de día, con botón "Es correcto". */
.day-fit-warn {
  display:flex; gap:10px; align-items:flex-start;
  margin:0 0 10px; padding:10px 12px; border-radius:var(--r-md);
  background:color-mix(in srgb, #f59e0b 11%, var(--bg-elev));
  border:1px solid color-mix(in srgb, #f59e0b 38%, var(--line));
}
.day-group.collapsed .day-fit-warn { display:none; }
.day-fit-warn .dfw-ico { font-size:15px; line-height:1.3; flex-shrink:0; }
.day-fit-warn .dfw-body { display:flex; flex-direction:column; gap:7px; min-width:0; }
.day-fit-warn .dfw-msg { font-size:12.5px; color:var(--text); line-height:1.4; }
.day-fit-warn .dfw-ok { align-self:flex-start; }
/* Aviso de horario (posible cierre). */
.oh-warn { flex-shrink:0; font-size:12px; }

/* ========================================================================
   Resumen — tiles métricas
   ====================================================================== */
.metric-grid {
  display:grid; gap:14px;
  grid-template-columns:repeat(2, 1fr);
  margin-bottom:24px;
}
@media (min-width:720px) { .metric-grid { grid-template-columns:repeat(4, 1fr); } }
.metric {
  background:var(--bg-elev); border:1px solid var(--line);
  border-radius:var(--r-md); padding:14px;
}
.metric .label { font-size:11px; color:var(--text-muted); text-transform:uppercase; letter-spacing:.06em; }
.metric .value { font-feature-settings:"tnum","ss01"; font-weight:700; font-size:22px; margin-top:4px; letter-spacing:-.02em; }
.metric .sub { font-size:12px; color:var(--text-muted); margin-top:2px; }
/* Métricas clicables — botón con el mismo aspecto que la tarjeta métrica. */
.metric-btn {
  font-family:inherit; text-align:left; cursor:pointer; width:100%;
  color:var(--text); transition:transform .15s var(--ease), box-shadow .15s var(--ease);
}
.metric-btn:hover { transform:translateY(-1px); box-shadow:var(--sh-1); }

/* Barra "Próximo evento" con cuenta atrás — arriba del Resumen, pegajosa al hacer scroll. */
.next-event {
  position:sticky; top:8px; z-index:6;
  display:flex; align-items:center; gap:12px;
  padding:12px 14px; margin-bottom:18px;
  border-radius:var(--r-md); cursor:pointer;
  background:linear-gradient(135deg,
    color-mix(in srgb, var(--accent) 16%, var(--bg-elev)),
    color-mix(in srgb, var(--accent-2, var(--accent)) 10%, var(--bg-elev)));
  border:1px solid color-mix(in srgb, var(--accent) 35%, var(--line));
  box-shadow:var(--sh-1);
  transition:transform .15s var(--ease), box-shadow .15s var(--ease);
}
.next-event:hover { transform:translateY(-1px); box-shadow:var(--sh-2, var(--sh-1)); }
.next-event .ne-emoji { font-size:22px; flex-shrink:0; line-height:1; }
.next-event .ne-main { display:flex; flex-direction:column; min-width:0; flex:1; gap:1px; }
.next-event .ne-tag {
  font-size:10px; text-transform:uppercase; letter-spacing:.07em; font-weight:700;
  color:var(--accent);
}
.next-event .ne-title {
  font-weight:700; font-size:14.5px; letter-spacing:-.01em; color:var(--text);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.next-event .ne-count {
  flex-shrink:0; font-weight:700; font-size:13.5px;
  font-feature-settings:"tnum"; white-space:nowrap; color:var(--text);
  background:color-mix(in srgb, var(--accent) 14%, var(--bg-elev));
  border:1px solid color-mix(in srgb, var(--accent) 30%, transparent);
  padding:4px 10px; border-radius:var(--r-pill);
}
.next-event .ne-bell {
  flex-shrink:0; display:inline-flex; align-items:center; justify-content:center;
  width:34px; height:34px; border-radius:50%;
  background:var(--bg-elev); border:1px solid var(--line); color:var(--accent);
  cursor:pointer; transition:background .15s var(--ease);
}
.next-event .ne-bell:hover { background:var(--bg-soft); }
.next-event .ne-bell svg { width:17px; height:17px; }

/* Pills de reservas de hoy — mismo aspecto que las métricas (.metric) pero con
   fondo coloreado según el estado del planning. Clicables. */
.resv-grid {
  display:grid; gap:14px;
  grid-template-columns:repeat(1, 1fr);
  grid-auto-rows:1fr;          /* todas las filas igualan a la más alta */
  margin-bottom:24px;
}
@media (min-width:560px) { .resv-grid { grid-template-columns:repeat(2, 1fr); } }
.resv-metric {
  cursor:pointer; text-align:left; font-family:inherit; color:var(--text);
  transition:transform .15s var(--ease), box-shadow .15s var(--ease);
  display:flex; flex-direction:column; min-height:92px;
}
/* El value ocupa el espacio sobrante para que sub/acciones queden abajo y
   todas las pills se vean del mismo alto. */
.resv-metric .value { flex:1 0 auto; }
.resv-metric:hover { transform:translateY(-1px); box-shadow:var(--sh-1); }
.resv-metric .label { display:flex; align-items:center; gap:6px; font-weight:700; }
.resv-metric .resv-emoji { font-size:13px; }
.resv-metric .value {
  font-size:18px; line-height:1.2; word-break:break-word; overflow-wrap:break-word;
}
.resv-metric .sub { font-feature-settings:"tnum","ss01"; }
.resv-actions { display:flex; flex-wrap:wrap; gap:8px; margin-top:11px; }
.resv-btn {
  display:inline-flex; align-items:center; gap:5px;
  padding:6px 11px; border-radius:var(--r-pill);
  background:var(--bg-elev); border:1px solid var(--line);
  color:var(--text); font-size:12px; font-weight:600;
  text-decoration:none; cursor:pointer; line-height:1;
  transition:background .15s var(--ease), border-color .15s var(--ease);
}
.resv-btn:hover { background:var(--bg-soft); border-color:var(--text-muted); }
.resv-btn svg { width:14px; height:14px; }
.resv-metric.status-confirmado  { border-color:color-mix(in srgb, #10b981 50%, var(--line)); background:color-mix(in srgb, #34d399 12%, var(--bg-elev)); }
.resv-metric.status-en_consulta { border-color:color-mix(in srgb, #3b82f6 55%, var(--line)); background:color-mix(in srgb, #60a5fa 15%, var(--bg-elev)); }
.resv-metric.status-por_iniciar { border-color:color-mix(in srgb, #f59e0b 55%, var(--line)); background:color-mix(in srgb, #fbbf24 18%, var(--bg-elev)); }
.resv-metric.status-cancelado   { border-color:color-mix(in srgb, #ef4444 55%, var(--line)); background:color-mix(in srgb, #f87171 12%, var(--bg-elev)); }
.resv-metric.status-confirmado  .label { color:#047857; }
.resv-metric.status-en_consulta .label { color:#1e40af; }
.resv-metric.status-por_iniciar .label { color:#b45309; }
.resv-metric.status-cancelado   .label { color:#b91c1c; }
.resv-metric.status-cancelado   .value { text-decoration:line-through; opacity:.75; }
:root[data-tema="oscuro"] .resv-metric.status-confirmado  .label { color:#6ee7b7; }
:root[data-tema="oscuro"] .resv-metric.status-en_consulta .label { color:#93c5fd; }
:root[data-tema="oscuro"] .resv-metric.status-por_iniciar .label { color:#fbbf24; }
:root[data-tema="oscuro"] .resv-metric.status-cancelado   .label { color:#fca5a5; }

/* ========================================================================
   Day-group (planning)
   ====================================================================== */
.day-group { margin-bottom:24px; }
.day-head {
  display:flex; align-items:flex-start; gap:10px; margin-bottom:10px;
  /* Mismo inset horizontal que el contenido de las tarjetas (padding 10 + borde 1)
     para que los iconos de acción queden alineados en columna con los de los eventos. */
  padding:0 11px;
}
/* La pill del título del día va en su propia fila a ancho completo, bajo la cabecera,
   para no competir con los botones de acción ni recortarse. Se ve también plegado. */
.day-title-row { padding:0 12px; margin:-2px 0 10px; }
.day-group.collapsed .day-title-row { margin-bottom:0; }
.day-head .day-num {
  font-family:var(--font-ui);
  font-feature-settings:"tnum","ss01";
  font-weight:600; font-size:12px;
  color:var(--text-muted);
  letter-spacing:.01em;
  text-transform:uppercase;
}
.day-head .day-date {
  font-family:var(--font-titulo); font-weight:600;
  font-size:19px;
  letter-spacing:-.028em;
  color:var(--text);
}
.day-head .day-date::first-letter { text-transform:uppercase; }
/* Cada parte (día de la semana / "26 de junio") no se parte: el salto, si hace
   falta, ocurre entre ellas. */
.day-head .day-wd, .day-head .day-dm { white-space:nowrap; }

/* ===== Refinado "Apple" del día a día (solo estética) ===== */
.day-group { margin-bottom:28px; }
.day-head { gap:11px; }
.day-head .day-date { font-size:21px; font-weight:700; letter-spacing:-.022em; }
.day-head .day-num { font-weight:700; opacity:.85; }
/* Botones de acción del día y de las tarjetas: sin borde, gris suave (estilo SF). */
.day-actions .icon-btn,
.timeline-item .li-actions .icon-btn {
  border:none; background:transparent; color:var(--text-muted);
  box-shadow:none;
}
.day-actions .icon-btn:hover,
.day-actions .icon-btn:active,
.timeline-item .li-actions .icon-btn:hover,
.timeline-item .li-actions .icon-btn:active { background:var(--bg-soft); color:var(--text); }
/* Título del evento un punto más marcado, jerarquía más clara. */
.timeline-item .li-title { font-size:15px; font-weight:600; letter-spacing:-.01em; }
/* Título en 1 línea (elipsis si es largo); la hora y los datos van en la 2ª fila,
   así todas las tarjetas tienen el mismo alto. */
.timeline-item .li-title .li-title-text { flex:1 1 auto; min-width:0; white-space:normal; overflow-wrap:anywhere; }
.timeline-item .li-subrow {
  display:flex; align-items:center; gap:6px; min-height:23px; margin-top:1px;
}
.timeline-item .li-subrow .time-pill { flex-shrink:0; }
.timeline-item .li-sub-text {
  min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  font-size:12.5px; color:var(--text-muted); line-height:1.35;
}
.timeline-item .li-sub { font-size:12.5px; }
/* Hora con números tabulares, más sobria. */
.timeline-item .time-pill { background:var(--bg-soft); color:var(--text-muted); font-weight:600; }

/* Tipo de planning_item — punto de color */
.dot-type { width:8px; height:8px; border-radius:50%; }
.dot-type.lugar       { background:var(--tipo-lugar); }
.dot-type.personas    { background:var(--tipo-personas); }
.dot-type.playa       { background:var(--tipo-playa); }
.dot-type.hotel       { background:var(--tipo-hotel); }
.dot-type.vuelo       { background:var(--tipo-vuelo); }
.dot-type.transporte  { background:var(--tipo-transporte); }
.dot-type.coche       { background:var(--tipo-coche); }
.dot-type.actividad   { background:var(--tipo-actividad); }
.dot-type.comida      { background:var(--tipo-comida); }
.dot-type.compras     { background:var(--tipo-compras); }
.dot-type.otro        { background:var(--tipo-otro); }

/* El círculo exterior con SVG queda oculto — ahora el icono va DENTRO de la card como emoji. */
.timeline-item { position:relative; align-items:center; }
.timeline-item .timeline-icon { display:none !important; }

/* Emoji dentro de un círculo, centrado exacto dentro de la card.
   Usamos text-align + line-height + padding-left:0 para que los emojis
   con anchos visuales irregulares (palmera, hombre andando, avión)
   no queden desplazados. */
.timeline-item .item-emoji {
  width:44px; height:44px; flex-shrink:0;
  border-radius:50%;
  background:var(--bg-soft);
  border:1.5px solid var(--line);
  display:grid; place-items:center;
  text-align:center;
  font-size:22px; line-height:1;
  font-family: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", "Twemoji Mozilla", sans-serif;
  -webkit-font-smoothing:antialiased;
  user-select:none;
  /* Anular cualquier indentación heredada y forzar centrado horizontal real */
  padding:0; margin:0;
}
/* Color del círculo del emoji por tipo — coincide con la paleta `--tipo-*`. */
.timeline-item.type-vuelo      .item-emoji,
.timeline-item.type-coche      .item-emoji { background: color-mix(in srgb, var(--tipo-vuelo)     20%, var(--bg-elev)); border-color: color-mix(in srgb, var(--tipo-vuelo)     55%, var(--line)); }
.timeline-item.type-transporte .item-emoji { background: color-mix(in srgb, var(--tipo-transporte) 20%, var(--bg-elev)); border-color: color-mix(in srgb, var(--tipo-transporte) 55%, var(--line)); }
.timeline-item.type-comida     .item-emoji { background: color-mix(in srgb, var(--tipo-comida)    20%, var(--bg-elev)); border-color: color-mix(in srgb, var(--tipo-comida)    55%, var(--line)); }
.timeline-item.type-actividad  .item-emoji { background: color-mix(in srgb, var(--tipo-actividad) 20%, var(--bg-elev)); border-color: color-mix(in srgb, var(--tipo-actividad) 55%, var(--line)); }
.timeline-item.type-hotel      .item-emoji { background: color-mix(in srgb, var(--tipo-hotel)     20%, var(--bg-elev)); border-color: color-mix(in srgb, var(--tipo-hotel)     55%, var(--line)); }
.timeline-item.type-lugar      .item-emoji { background: color-mix(in srgb, var(--tipo-lugar)     20%, var(--bg-elev)); border-color: color-mix(in srgb, var(--tipo-lugar)     55%, var(--line)); }
.timeline-item.type-personas   .item-emoji { background: color-mix(in srgb, var(--tipo-personas) 20%, var(--bg-elev)); border-color: color-mix(in srgb, var(--tipo-personas) 55%, var(--line)); }
.timeline-item.type-playa      .item-emoji { background: color-mix(in srgb, var(--tipo-playa)     20%, var(--bg-elev)); border-color: color-mix(in srgb, var(--tipo-playa)     55%, var(--line)); }
.timeline-item.type-compras    .item-emoji { background: color-mix(in srgb, var(--tipo-compras)   20%, var(--bg-elev)); border-color: color-mix(in srgb, var(--tipo-compras)   55%, var(--line)); }
.timeline-item.type-otro       .item-emoji { background: color-mix(in srgb, var(--tipo-otro)      20%, var(--bg-elev)); border-color: color-mix(in srgb, var(--tipo-otro)      55%, var(--line)); }

/* El emoji conserva el color de su TIPO también en tarjetas con fondo de estado,
   para que el icono destaque sobre el color (confirmado es la excepción: verde). */
.timeline-item.type-lugar      .timeline-icon { border-color:var(--tipo-lugar);      color:#0369a1; }
.timeline-item.type-personas   .timeline-icon { border-color:var(--tipo-personas);   color:#0369a1; }
.timeline-item.type-playa      .timeline-icon { border-color:var(--tipo-playa);      color:#0f766e; }
.timeline-item.type-hotel      .timeline-icon { border-color:var(--tipo-hotel);      color:#166534; }
.timeline-item.type-vuelo      .timeline-icon { border-color:var(--tipo-vuelo);      color:#1e3a8a; }
.timeline-item.type-transporte .timeline-icon { border-color:var(--tipo-transporte); color:#1e3a8a; }
.timeline-item.type-coche      .timeline-icon { border-color:var(--tipo-coche);      color:#1e3a8a; }
.timeline-item.type-actividad  .timeline-icon { border-color:var(--tipo-actividad);  color:#6b21a8; }
.timeline-item.type-comida     .timeline-icon { border-color:var(--tipo-comida);     color:#9a3412; }
.timeline-item.type-compras    .timeline-icon { border-color:var(--tipo-compras);    color:#9d174d; }
.timeline-item.type-otro       .timeline-icon { border-color:var(--tipo-otro);       color:#334155; }
:root[data-tema="oscuro"] .timeline-item .timeline-icon { color:#e2e8f0; }
/* Si está en estado por_iniciar/en_consulta/etc, el color del borde lo gana el estado */
.timeline-item.status-por_iniciar .timeline-icon { border-color:#f59e0b; }
.timeline-item.status-en_consulta .timeline-icon { border-color:#3b82f6; }
.timeline-item.status-confirmado  .timeline-icon { border-color:#10b981; }
.timeline-item.status-cancelado   .timeline-icon { border-color:#ef4444; }

/* Quitar el círculo CSS antiguo (lo sustituye el icono) */
.timeline-item::before { display:none !important; }

/* [DEPRECATED] El antiguo `border_color` (verde/amarillo/rojo) de lugar/playa se
   migra silenciosamente a `custom_color` (HEX libre) al cargar el planning.
   Se mantienen estas reglas vacías como nota: la lógica ya no las usa. */

/* El círculo del emoji hereda el override de color libre del usuario. */
.timeline-item.has-custom-color .item-emoji {
  border-color: var(--card-color) !important;
  background: color-mix(in srgb, var(--card-color) 18%, var(--bg-elev)) !important;
}

/* Estado "Visto" — la tarjeta entera queda en gris apagada.
   Gana en especificidad a status-* y border-* gracias a !important. */
.timeline-item.visited,
.list-item.visited {
  background: var(--bg-soft) !important;
  border-color: var(--line) !important;
  opacity: .78;
}
.timeline-item.visited .li-title,
.timeline-item.visited .li-sub {
  color: var(--text-muted) !important;
}
.timeline-item.visited .item-emoji {
  background: var(--bg-soft) !important;
  border-color: var(--line) !important;
  filter: grayscale(.85);
}
/* Botón "Visto" cuando ya está marcado */
.btn-visited-on {
  background: var(--status-curso) !important;
  color: #fff !important;
  border-color: transparent !important;
}
.btn-visited-on svg { stroke:#fff; }

/* ===========================================================================
   Tarjeta de NOCHE-CONTINUACIÓN del mismo hotel
   ----------------------------------------------------------------------------
   Cuando una tarjeta `_virtual:'night'` NO es la primera noche del hotel,
   se renderiza en variante compacta: solo nombre del hotel + botón "Cómo llegar".
   La detección viene de la bandera `_isFirstNight` puesta por `_expandHotels`.
   =========================================================================== */
.timeline-item.night-cont {
  padding: 6px 12px;
  min-height: 36px;
  gap: 10px;
}
.timeline-item.night-cont .item-emoji {
  width: 26px; height: 26px;
  font-size: 14px;
  border-width: 1px;
}
.timeline-item.night-cont .li-main {
  display:flex; align-items:center; gap:8px;
  flex:1; min-width:0;
}
.timeline-item.night-cont .li-title {
  font-size: 13.5px; font-weight: 600;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.timeline-item.night-cont .li-sub { display:none; }
.timeline-item.night-cont .night-cont-meta {
  font-size: 11.5px; color: var(--text-muted); font-weight:500;
}
.timeline-item.night-cont .night-cont-go {
  display:inline-flex; align-items:center; gap:5px;
  flex-shrink:0;
  padding: 4px 10px; border-radius: var(--r-pill);
  font-size: 12px; font-weight: 600;
  background: var(--bg-elev); border: 1px solid var(--line);
  color: var(--text); text-decoration: none;
}
.timeline-item.night-cont .night-cont-go svg { width:13px; height:13px; }
.timeline-item.night-cont .night-cont-go:hover {
  background: color-mix(in srgb, var(--tipo-hotel) 14%, var(--bg-elev));
  border-color: color-mix(in srgb, var(--tipo-hotel) 50%, var(--line));
  text-decoration: none;
}

/* ===========================================================================
   Botón "paleta" en la card + popover para override de color manual
   =========================================================================== */
.icon-btn.color-btn { color: var(--text-muted); }
.icon-btn.color-btn.has-color { color: var(--card-color, var(--accent)); }
.icon-btn.color-btn .color-dot {
  display:inline-block; width:10px; height:10px; border-radius:50%;
  background: var(--card-color, transparent);
  border: 1.5px solid currentColor;
  margin-left:-2px;
}

.card-color-popover {
  display:grid; gap:14px;
}
.card-color-popover .ccp-grid {
  display:grid; grid-template-columns: repeat(5, 1fr); gap:10px;
}
.card-color-popover .ccp-swatch {
  position:relative;
  display:flex; flex-direction:column; align-items:center; gap:4px;
  padding:10px 6px; border:2px solid var(--line); border-radius:var(--r-md);
  background:var(--bg-elev); cursor:pointer;
  font-size:11px; font-weight:600; color:var(--text);
  font-family:var(--font-ui); letter-spacing:-.005em;
  transition: transform .12s var(--ease), border-color .12s var(--ease);
}
.card-color-popover .ccp-swatch:hover { transform: translateY(-1px); }
.card-color-popover .ccp-swatch.active { transform: scale(1.04); border-color: var(--ccp-color, var(--accent)); }
.card-color-popover .ccp-swatch .ccp-chip {
  width:24px; height:24px; border-radius:50%;
  background: var(--ccp-color);
  border:1.5px solid color-mix(in srgb, var(--ccp-color) 60%, var(--text));
}
.card-color-popover .ccp-row {
  display:flex; align-items:center; gap:12px;
  padding-top:10px; border-top:1px solid var(--line-soft);
}
.card-color-popover .ccp-row label {
  font-size:13px; font-weight:600; color:var(--text);
}
.card-color-popover .ccp-row input[type="color"] {
  width:48px; height:32px; padding:0;
  border:1px solid var(--line); border-radius:var(--r-sm);
  background:var(--bg-elev); cursor:pointer;
}
/* Variante embebida dentro del formulario del editor (sin recuadro propio). */
.card-color-popover.ccp-inline { gap:10px; }
.card-color-popover.ccp-inline .ccp-grid { grid-template-columns: repeat(4, 1fr); gap:8px; }
.card-color-popover.ccp-inline .ccp-swatch { padding:8px 4px; font-size:10.5px; }
.card-color-popover.ccp-inline .ccp-swatch .ccp-chip { width:20px; height:20px; }
/* Opción "Sin color" → vuelve al color del tipo/estado. */
.card-color-popover .ccp-none .ccp-chip {
  background:var(--bg-soft);
  border:1.5px dashed var(--line);
}
.card-color-popover .ccp-none.active { border-color:var(--text-muted); }

/* Picker visual en el editor */
.border-color-grid {
  display:grid; grid-template-columns:repeat(4, 1fr); gap:8px;
  margin-top:6px;
}
.border-color-swatch {
  display:flex; flex-direction:column; align-items:center;
  padding:10px 8px; border:2px solid var(--line);
  background:var(--bg-elev); border-radius:var(--r-md);
  cursor:pointer; transition:all .12s var(--ease);
  font-family:var(--font-ui); font-size:11.5px; font-weight:600;
  letter-spacing:-.005em; color:var(--text);
  text-align:center;
}
.border-color-swatch:hover { transform:translateY(-1px); }
.border-color-swatch.active { transform:scale(1.04); }
.border-color-swatch .dot {
  width:14px; height:14px; border-radius:50%;
  margin-bottom:4px; border:2px solid currentColor;
  background:transparent;
}
.border-color-swatch.b-ninguno  { color:var(--text-muted); }
.border-color-swatch.b-verde    { color:#10b981; }
.border-color-swatch.b-amarillo { color:#f59e0b; }
.border-color-swatch.b-rojo     { color:#ef4444; }
.border-color-swatch.b-ninguno .dot  { border-style:dashed; }
.border-color-swatch.active.b-verde    { border-color:#10b981; background:color-mix(in srgb, #10b981 8%, var(--bg-elev)); }
.border-color-swatch.active.b-amarillo { border-color:#f59e0b; background:color-mix(in srgb, #f59e0b 8%, var(--bg-elev)); }
.border-color-swatch.active.b-rojo     { border-color:#ef4444; background:color-mix(in srgb, #ef4444 8%, var(--bg-elev)); }
.border-color-swatch.active.b-ninguno  { border-color:var(--text-muted); background:var(--bg-soft); }

/* ========================================================================
   Presupuesto — gráfica barras horizontales
   ====================================================================== */
.bar-row { display:flex; align-items:center; gap:12px; margin-bottom:10px; }
.bar-row .cat { width:110px; font-size:13px; color:var(--text-muted); flex-shrink:0; }
.bar-row .bar-wrap { flex:1; background:var(--bg-soft); height:8px; border-radius:var(--r-pill); overflow:hidden; }
.bar-row .bar-fill { height:100%; background:linear-gradient(90deg, var(--accent), var(--accent-2)); border-radius:var(--r-pill); }
.bar-row .amount { font-feature-settings:"tnum","ss01"; font-weight:600; font-size:13px; min-width:80px; text-align:right; }
/* Categoría desplegable (Transporte → reparto por tipo) */
.bar-group { margin-bottom:10px; }
.bar-group .bar-row { margin-bottom:0; }
.bar-row-clickable { cursor:pointer; }
.bar-row-clickable .cat { display:inline-flex; align-items:center; }
.cat-caret { display:inline-flex; align-items:center; margin-left:5px; color:var(--text-muted); transition:transform .2s var(--ease); }
.cat-caret svg { width:13px; height:13px; }
.bar-row.open .cat-caret { transform:rotate(90deg); }
.bar-sub { margin:8px 0 2px; padding-left:18px; display:flex; flex-direction:column; gap:6px; }
.bar-sub-row { display:flex; justify-content:space-between; align-items:center; gap:10px; }
.bar-sub-label { font-size:13px; color:var(--text-muted); }
.bar-sub-amount { font-size:13px; font-weight:600; color:var(--text); }

/* Donut presupuesto */
.budget-split {
  display:grid; gap:24px; align-items:center;
  grid-template-columns:1fr;
}
@media (min-width:720px) { .budget-split { grid-template-columns:220px 1fr; } }
.donut { width:200px; height:200px; margin:0 auto; }
.donut-total { font-family:var(--font-ui); font-feature-settings:"tnum","ss01"; font-size:5px; font-weight:700; fill:var(--text); letter-spacing:-.02em; }
.budget-bars { width:100%; }

/* Progreso vs objetivo */
.budget-progress { display:flex; flex-direction:column; gap:8px; }
.budget-bar { background:var(--bg-soft); height:12px; border-radius:var(--r-pill); overflow:hidden; }
.budget-fill { height:100%; background:linear-gradient(90deg, var(--accent), var(--accent-2)); transition:width .3s var(--ease); }
.budget-fill.over { background:linear-gradient(90deg, #f97316, var(--danger)); }
.budget-legend { display:flex; justify-content:space-between; font-size:13px; }

/* Drag handle / drag state */
.drag-handle {
  color:var(--text-muted); cursor:grab;
  display:flex; align-items:center; padding:0 4px;
}
.drag-handle:active { cursor:grabbing; }
.list-item.dragging { opacity:.4; }
.list-item.drag-over-top { box-shadow: 0 -2px 0 var(--accent); }
.list-item.drag-over-bot { box-shadow: 0  2px 0 var(--accent); }

/* Durante un drag activo, todos los days son drop targets — se marcan ligeramente
   para que el usuario entienda que puede mover entre días. */
body.dragging-planning .day-group {
  transition: background .12s var(--ease), outline .12s var(--ease);
  border-radius: var(--r-md);
  outline: 1px dashed color-mix(in srgb, var(--accent) 30%, transparent);
  outline-offset: 4px;
}
.day-group.day-target {
  background: color-mix(in srgb, var(--accent) 8%, transparent);
  outline: 2px dashed var(--accent) !important;
}
body.dragging-planning .day-head { color: var(--accent); }

/* Timeline vertical en planning */
.day-group { position:relative; padding-left:0; }
.timeline-list { position:relative; }
/* La línea vertical del timeline ya no aplica — los items son cards independientes
   con su emoji y la "línea" creaba ruido visual con padding asimétrico. */
.timeline-item {
  position:relative;
  margin-bottom:8px;
  /* padding-left:38px se eliminó — el círculo del timeline ya no se renderiza
     (lo sustituye el emoji dentro de la card), así que ese padding solo creaba
     asimetría y empujaba contenido hacia la derecha en móviles estrechos. */
}
.timeline-item::before {
  content:''; position:absolute; left:8px; top:18px;
  width:14px; height:14px; border-radius:50%;
  background:var(--bg-elev); border:2px solid var(--accent);
  box-shadow:0 0 0 3px var(--bg);
  z-index:1;
}
.timeline-item .time-pill {
  display:inline-block;
  font-family:var(--font-ui);
  font-feature-settings:"tnum","ss01";
  font-size:11.5px;
  font-weight:600;
  letter-spacing:-.005em;
  background:var(--bg-soft); color:var(--text-muted);
  padding:3px 9px; border-radius:var(--r-pill); margin-right:6px;
}
.day-note-card {
  background:color-mix(in srgb, var(--accent-bg) 30%, var(--bg-elev));
  border:1px dashed color-mix(in srgb, var(--accent) 35%, var(--line));
  border-radius:var(--r-md); padding:10px 14px;
  margin:0 0 12px 38px; font-size:13.5px;
  white-space:pre-wrap;
}
.day-actions { display:flex; gap:4px; flex-shrink:0; }
/* Iconos del día del mismo tamaño que los de las tarjetas → columna alineada. */
.day-actions .icon-btn { width:30px; height:30px; }
.day-actions .icon-btn svg { width:16px; height:16px; }

/* Pill del título del día */
.day-title-pill {
  display:inline-block; vertical-align:middle; max-width:100%;
  font-family:var(--font-ui);
  font-size:12.5px; font-weight:600; letter-spacing:-.005em;
  padding:4px 12px; border-radius:var(--r-pill);
  background: color-mix(in srgb, var(--accent) 18%, var(--bg-elev));
  color: var(--accent);
  border: 1px solid color-mix(in srgb, var(--accent) 35%, transparent);
  /* Va en su propia fila a ancho completo: cabe casi siempre; recorta con elipsis
     solo si es larguísima. */
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.day-title-pill.color-azul    { background:color-mix(in srgb, #3b82f6 18%, var(--bg-elev)); color:#1e40af; border-color:color-mix(in srgb, #3b82f6 38%, transparent); }
.day-title-pill.color-verde   { background:color-mix(in srgb, #10b981 18%, var(--bg-elev)); color:#047857; border-color:color-mix(in srgb, #10b981 38%, transparent); }
.day-title-pill.color-naranja { background:color-mix(in srgb, #f97316 18%, var(--bg-elev)); color:#9a3412; border-color:color-mix(in srgb, #f97316 38%, transparent); }
.day-title-pill.color-rojo    { background:color-mix(in srgb, #ef4444 18%, var(--bg-elev)); color:#991b1b; border-color:color-mix(in srgb, #ef4444 38%, transparent); }
.day-title-pill.color-morado  { background:color-mix(in srgb, #a855f7 18%, var(--bg-elev)); color:#6b21a8; border-color:color-mix(in srgb, #a855f7 38%, transparent); }
.day-title-pill.color-rosa    { background:color-mix(in srgb, #ec4899 18%, var(--bg-elev)); color:#9d174d; border-color:color-mix(in srgb, #ec4899 38%, transparent); }
.day-title-pill.color-ambar   { background:color-mix(in srgb, #f59e0b 18%, var(--bg-elev)); color:#92400e; border-color:color-mix(in srgb, #f59e0b 38%, transparent); }
.day-title-pill.color-gris    { background:color-mix(in srgb, #64748b 18%, var(--bg-elev)); color:#334155; border-color:color-mix(in srgb, #64748b 38%, transparent); }
:root[data-tema="oscuro"] .day-title-pill.color-azul    { color:#93c5fd; }
:root[data-tema="oscuro"] .day-title-pill.color-verde   { color:#6ee7b7; }
:root[data-tema="oscuro"] .day-title-pill.color-naranja { color:#fdba74; }
:root[data-tema="oscuro"] .day-title-pill.color-rojo    { color:#fca5a5; }
:root[data-tema="oscuro"] .day-title-pill.color-morado  { color:#d8b4fe; }
:root[data-tema="oscuro"] .day-title-pill.color-rosa    { color:#fbcfe8; }
:root[data-tema="oscuro"] .day-title-pill.color-ambar   { color:#fcd34d; }
:root[data-tema="oscuro"] .day-title-pill.color-gris    { color:#cbd5e1; }

/* Color picker dentro del modal de editar día */
.color-grid {
  display:grid; grid-template-columns:repeat(4, 1fr); gap:8px;
  margin-top:6px;
}
.color-swatch {
  height:42px; border-radius:var(--r-md); cursor:pointer;
  border:2px solid transparent;
  display:flex; align-items:center; justify-content:center;
  font-size:12px; font-weight:600;
  transition: transform .12s var(--ease), border-color .12s var(--ease);
}
.color-swatch:hover { transform:translateY(-1px); }
.color-swatch.active { border-color:var(--text); transform:scale(1.05); }
.color-swatch[data-color="azul"]    { background:color-mix(in srgb, #3b82f6 22%, var(--bg-elev)); color:#1e40af; }
.color-swatch[data-color="verde"]   { background:color-mix(in srgb, #10b981 22%, var(--bg-elev)); color:#047857; }
.color-swatch[data-color="naranja"] { background:color-mix(in srgb, #f97316 22%, var(--bg-elev)); color:#9a3412; }
.color-swatch[data-color="rojo"]    { background:color-mix(in srgb, #ef4444 22%, var(--bg-elev)); color:#991b1b; }
.color-swatch[data-color="morado"]  { background:color-mix(in srgb, #a855f7 22%, var(--bg-elev)); color:#6b21a8; }
.color-swatch[data-color="rosa"]    { background:color-mix(in srgb, #ec4899 22%, var(--bg-elev)); color:#9d174d; }
.color-swatch[data-color="ambar"]   { background:color-mix(in srgb, #f59e0b 22%, var(--bg-elev)); color:#92400e; }
.color-swatch[data-color="gris"]    { background:color-mix(in srgb, #64748b 22%, var(--bg-elev)); color:#334155; }

/* Wishlist */
.wish-grid {
  display:grid; gap:14px;
  grid-template-columns:1fr;
}
@media (min-width:720px) { .wish-grid { grid-template-columns:1fr 1fr; } }
.wish-card {
  background:var(--bg-elev); border:1px solid var(--line);
  border-radius:var(--r-md); padding:14px 16px;
}
.wish-card.visited { opacity:.6; }
.wish-card .wish-head { display:flex; gap:10px; align-items:flex-start; }
.wish-card .wish-name { font-weight:600; flex:1; }
.wish-card.visited .wish-name { text-decoration:line-through; }
.wish-card .wish-cat {
  font-size:11px; font-weight:500; color:var(--text-muted);
  background:var(--bg-soft); padding:2px 8px; border-radius:var(--r-pill);
}
.wish-card .wish-actions { display:flex; gap:6px; margin-top:10px; }

/* Vista cronológica reservas */
.cron-divider {
  font-size:13px; color:var(--text-muted); font-weight:500;
  margin:18px 0 8px; padding-left:4px;
}

/* Badge "Modo lector" en topbar y vistas */
.readonly-badge {
  display:inline-flex; align-items:center; gap:6px;
  font-family:var(--font-ui);
  font-size:11.5px; font-weight:600;
  letter-spacing:.005em;
  padding:4px 11px; border-radius:var(--r-pill);
  background:color-mix(in srgb, var(--status-prep) 14%, var(--bg-elev));
  color:var(--status-prep);
  border:1px solid color-mix(in srgb, var(--status-prep) 35%, transparent);
}
.readonly-badge svg { width:12px; height:12px; }
.readonly-banner {
  display:flex; align-items:center; gap:10px;
  padding:10px 14px; margin-bottom:16px;
  border:1px solid color-mix(in srgb, var(--status-prep) 40%, var(--line));
  background:color-mix(in srgb, var(--status-prep) 8%, var(--bg-elev));
  border-radius:var(--r-md);
  font-size:13.5px;
}
.readonly-banner .ico { color:var(--status-prep); flex-shrink:0; }

/* Modo lector — oculta UI de modificación de un solo golpe */
body.readonly .btn-primary,
body.readonly .fab,
body.readonly [data-edit-only="true"] {
  display:none !important;
}
body.readonly .switch { pointer-events:none; opacity:.55; }
body.readonly .check { pointer-events:none; opacity:.55; }
/* Drag handles no tienen sentido si no puedes reordenar */
body.readonly .drag-handle { display:none !important; }
body.readonly .timeline-item { cursor:default; }

/* Bloque para mostrar un error de render visible al usuario */
.render-error {
  background:color-mix(in srgb, var(--danger) 8%, var(--bg-elev));
  border:1px solid color-mix(in srgb, var(--danger) 40%, var(--line));
  border-radius:var(--r-md); padding:16px 18px; margin:16px 0;
  color:var(--text); font-size:14px;
}
.render-error strong { display:block; color:var(--danger); margin-bottom:4px; }
.render-error code {
  display:block; white-space:pre-wrap; word-break:break-word;
  background:var(--bg-soft); padding:8px 10px; border-radius:8px; margin-top:8px;
  font-family:ui-monospace, 'SF Mono', Menlo, monospace; font-size:12px;
}

/* ========================================================================
   Banner de aviso (caducidad de docs)
   ====================================================================== */
.banner {
  display:flex; align-items:flex-start; gap:12px;
  padding:14px 16px;
  border:1px solid var(--line); border-radius:var(--r-md);
  background:var(--bg-elev); margin-bottom:16px;
}
.banner.warn { border-color:color-mix(in srgb, var(--status-prep) 50%, var(--line)); background:color-mix(in srgb, var(--status-prep) 8%, var(--bg-elev)); }
.banner.danger { border-color:color-mix(in srgb, var(--danger) 50%, var(--line)); background:color-mix(in srgb, var(--danger) 8%, var(--bg-elev)); }
.banner .ico { flex-shrink:0; color:var(--status-prep); }
.banner.danger .ico { color:var(--danger); }
.banner-body { font-size:14px; }
.banner-body strong { font-weight:600; }

/* ========================================================================
   Toast
   ====================================================================== */
.toast-box {
  position:fixed; left:50%; bottom:88px; transform:translateX(-50%);
  z-index:100; pointer-events:none;
  display:flex; flex-direction:column; gap:8px; align-items:center;
}
.toast {
  background:var(--text); color:var(--text-inv);
  padding:10px 16px; border-radius:var(--r-pill);
  font-size:14px; box-shadow:var(--sh-3);
  animation: toastIn .25s var(--ease);
}
@keyframes toastIn { from { transform:translateY(20px); opacity:0; } to { transform:none; opacity:1; } }

/* ========================================================================
   Profile picker (pantalla inicial)
   ====================================================================== */
.profile-screen {
  min-height:100dvh; display:flex; flex-direction:column;
  justify-content:center; align-items:center;
  padding:32px 24px; gap:48px;
}
.profile-hero {
  text-align:center; max-width:480px;
}
.profile-hero h1 {
  font-family:var(--font-titulo); font-weight:600; letter-spacing:-.03em;
  font-size:36px; margin:0 0 8px;
}
.profile-hero p { color:var(--text-muted); margin:0; font-size:15px; }
.profile-list { display:flex; flex-direction:column; gap:14px; width:100%; max-width:360px; }
.profile-btn {
  display:flex; align-items:center; gap:16px;
  width:100%; padding:18px 20px;
  background:var(--bg-elev); border:1px solid var(--line);
  border-radius:var(--r-lg); cursor:pointer; box-shadow:var(--sh-1);
  transition:transform .18s var(--ease), box-shadow .18s var(--ease);
  text-align:left; color:var(--text);
}
.profile-btn:hover { transform:translateY(-2px); box-shadow:var(--sh-2); }
.profile-avatar {
  width:48px; height:48px; border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  font-family:var(--font-titulo); font-weight:700; font-size:18px; color:#fff;
  flex-shrink:0;
}
.avatar-r { background:linear-gradient(135deg, #2563eb, #06b6d4); }
.avatar-s { background:linear-gradient(135deg, #f97316, #facc15); }
.avatar-i { background:linear-gradient(135deg, #64748b, #94a3b8); }
.profile-info { flex:1; }
.profile-name { font-weight:600; font-size:16px; }
.profile-sub { font-size:13px; color:var(--text-muted); }

/* ========================================================================
   Misc — dividers, etc.
   ====================================================================== */
.divider { height:1px; background:var(--line-soft); margin:24px 0; }
.kv { display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px solid var(--line-soft); }
.kv .k { color:var(--text-muted); font-size:14px; }
.kv .v { font-feature-settings:"tnum","ss01"; font-weight:500; font-size:14px; }
.kv:last-child { border-bottom:none; }

.row { display:flex; align-items:center; gap:8px; }
.gap { flex:1; }

.tag {
  display:inline-flex; align-items:center; gap:4px;
  padding:3px 8px; border-radius:var(--r-pill);
  font-size:11px; font-weight:500; color:var(--text-muted);
  background:var(--bg-soft); border:1px solid var(--line);
}
.amount-eur { font-feature-settings:"tnum","ss01"; font-weight:600; letter-spacing:-.005em; }

/* hide while routing */
[hidden] { display:none !important; }

.search-results {
  border:1px solid var(--line); border-radius:var(--r-md);
  background:var(--bg-elev); margin-top:4px;
  max-height:200px; overflow-y:auto;
}

/* Bloque verde de "lugar seleccionado" tras elegir un resultado de Nominatim */
.place-selected {
  display:flex; align-items:center; gap:10px;
  padding:10px 12px; margin-top:8px;
  background:color-mix(in srgb, var(--status-curso) 10%, var(--bg-soft));
  border:1px solid color-mix(in srgb, var(--status-curso) 38%, var(--line));
  border-radius:var(--r-md);
  font-size:13.5px;
}
.place-selected .icon {
  color:var(--status-curso);
  display:flex; align-items:center; justify-content:center;
  width:24px; height:24px; flex-shrink:0;
}
.place-selected .icon svg { width:18px; height:18px; }
.place-selected .name { flex:1; font-weight:600; min-width:0; word-break:break-word; }
.place-selected .coords {
  font-feature-settings:"tnum","ss01";
  font-size:11.5px; color:var(--text-muted); font-weight:500;
  white-space:nowrap;
}
.place-selected .clear {
  background:transparent; border:none; color:var(--text-muted);
  cursor:pointer; padding:4px; border-radius:6px;
  display:flex; align-items:center;
}
.place-selected .clear:hover { background:var(--bg-soft); color:var(--text); }
.search-result {
  padding:10px 12px; cursor:pointer; border-bottom:1px solid var(--line-soft); font-size:14px;
}
.search-result:last-child { border-bottom:none; }
.search-result:hover { background:var(--bg-soft); }
.search-result .sr-name { font-weight:600; }
.search-result .sr-addr { font-size:12px; color:var(--text-muted); margin-top:1px; }

/* Calendario unificado */
.cal-grid {
  display:grid; grid-template-columns:repeat(7, 1fr); gap:4px;
}
.cal-head {
  font-size:11px; font-weight:600; color:var(--text-muted);
  text-transform:uppercase; letter-spacing:.05em;
  text-align:center; padding:6px 2px;
}
.cal-cell {
  min-height:80px; padding:6px; border-radius:8px;
  background:var(--bg-elev); border:1px solid var(--line);
  cursor:default;
  display:flex; flex-direction:column; gap:2px;
}
.cal-cell.empty { background:transparent; border:none; }
.cal-cell.today { border-color:var(--accent); border-width:2px; padding:5px; }
.cal-cell:has(.cal-evt) { cursor:pointer; }
.cal-cell:has(.cal-evt):hover { box-shadow:var(--sh-1); transform:translateY(-1px); }
.cal-day {
  font-family:var(--font-ui);
  font-feature-settings:"tnum","ss01";
  font-size:12.5px; font-weight:600; color:var(--text-muted);
  margin-bottom:2px;
}
.cal-cell.today .cal-day { color:var(--accent); }
.cal-evt {
  font-size:10.5px; padding:2px 5px; border-radius:4px;
  background:var(--bg-soft); color:var(--text);
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  border-left:2px solid var(--text-muted);
}
.cal-evt.evt-lugar       { border-left-color:var(--tipo-lugar); }
.cal-evt.evt-personas    { border-left-color:var(--tipo-personas); }
.cal-evt.evt-playa       { border-left-color:var(--tipo-playa); }
.cal-evt.evt-hotel       { border-left-color:var(--tipo-hotel); }
.cal-evt.evt-vuelo       { border-left-color:var(--tipo-vuelo); }
.cal-evt.evt-transporte  { border-left-color:var(--tipo-transporte); }
.cal-evt.evt-coche       { border-left-color:var(--tipo-coche); }
.cal-evt.evt-actividad   { border-left-color:var(--tipo-actividad); }
.cal-evt.evt-comida      { border-left-color:var(--tipo-comida); }
.cal-evt.evt-compras     { border-left-color:var(--tipo-compras); }
.cal-evt.evt-otro        { border-left-color:var(--tipo-otro); }
.cal-more { font-size:10px; color:var(--text-muted); padding-left:4px; }
/* Días ya pasados: el indicador de color del evento pasa a gris (sin tocar el
   texto), para verse "apagado" sin confundir unas categorías con otras. */
.cal-cell.past .cal-evt { border-left-color:var(--text-muted); color:var(--text-muted); }
.cal-cell.past .cal-day { opacity:.55; }

/* World map (visited countries) */
.world-map { width:100%; height:360px; border:1px solid var(--line); border-radius:var(--r-lg); overflow:hidden; }

/* leaflet popup tweak */
.leaflet-popup-content-wrapper { border-radius:12px !important; }
.leaflet-popup-content { font-family:var(--font-ui) !important; margin:12px 14px !important; }

<script>
/* ============================================================
   APP — Viajes (vanilla JS)
   Estructura:
     CFG       — config y constantes
     UTIL      — helpers (fechas, dinero, dom)
     DB        — IndexedDB
     SYNC      — Supabase + cola pendiente
     STATE     — estado global
     ROUTER    — dispatcher de vistas
     UI        — sheet, toast, iconos
     VIEW.*    — vistas
     BOOT      — arranque
   ============================================================ */
'use strict';
window.App = window.App || {};

/* ============================================================
   CFG
   ============================================================ */
const CFG = {
  // Rellena estos dos valores para activar la sync con Supabase.
  // Si quedan vacíos, la app funciona local-only sin errores.
  supabaseUrl: 'https://nfdudwdqhgczmsaubyhp.supabase.co',
  supabaseAnonKey: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5mZHVkd2RxaGdjem1zYXVieWhwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA5NjY5OTYsImV4cCI6MjA5NjU0Mjk5Nn0.ojLYEVbEN9DE5bJb0V2And-ozAQg_SqmWzEEYzUJXTA',

  externalPlannerUrl: '', // HTML externo "Explorar opciones" (opcional)

  appName: 'ViajesApp/1.0 (personal)', // user-agent style id para Nominatim
};

const PROFILES = [
  // id ASCII puro — viaja como cabecera HTTP x-app-profile en Supabase, no puede llevar tildes.
  // El nombre visible "Rubén" se muestra desde el campo .name, no desde el id.
  { id: 'ruben',    name: 'Rubén',    cls: 'avatar-r', initial: 'R', tag: 'Personal', readonly: false },
  { id: 'sergio',   name: 'Sergio',   cls: 'avatar-s', initial: 'S', tag: 'Solo lectura',         readonly: true },
  { id: 'invitado', name: 'Invitado', cls: 'avatar-i', initial: 'I', tag: 'Solo lectura',         readonly: true },
];
// Helper global: ¿puede el perfil activo modificar datos?
const canEdit = () => {
  const p = PROFILES.find(p => p.id === STATE.profile);
  return !!(p && !p.readonly);
};
const isReadonly = () => !canEdit();

// SOLO Sergio consulta los datos del PERFIL OWNER (Rubén) en modo lector.
// Invitado NO accede a viajes de otros perfiles (ni en modo lector): solo ve los
// suyos propios (normalmente, ninguno).
// Los datos personales (travel_docs, packing_templates, visited_countries)
// siguen siendo por perfil — no se comparten.
const OWNER_PROFILE = 'ruben';
const dataProfile = () => {
  const me = STATE.profile;
  return (me === 'sergio') ? OWNER_PROFILE : me;
};

// Restricciones de Invitado: no ve precios, ni enlaces, ni documentos.
// Sergio sí ve todo, pero en read-only.
const canSeeMoney = () => STATE.profile !== 'invitado';
const canSeeLinks = () => STATE.profile !== 'invitado';
const canSeeDocs  = () => STATE.profile !== 'invitado';

// Campos específicos del editor según el tipo de evento.
// Se persisten en planning_items.metadata (JSON) y se renderizan dinámicamente.
// Cada campo: { id, label, placeholder?, type?, full? (ocupa fila entera) }
const PLANNING_METADATA = {
  vuelo: {
    label:'Datos del vuelo',
    fields: [
      { id:'aerolinea',  label:'Aerolínea',       placeholder:'Iberia, Lufthansa…' },
      { id:'numero',     label:'Número de vuelo', placeholder:'IB6253' },
      { id:'origen',     label:'Origen',          placeholder:'MAD · Madrid' },
      { id:'destino',    label:'Destino',         placeholder:'NRT · Tokio' },
      { id:'terminal',   label:'Terminal',        placeholder:'4S' },
      { id:'puerta',     label:'Puerta',          placeholder:'M27' },
      { id:'localizador',label:'Localizador',     placeholder:'ABC123' },
      { id:'asientos',   label:'Asientos',        type:'seats', full:true },
      { id:'url',        label:'Enlace de la reserva', placeholder:'https://… (web aerolínea, pasabordos, Drive…)', type:'url', full:true },
    ],
  },
  hotel: {
    label:'Datos del alojamiento',
    fields: [
      { id:'nombre',     label:'Nombre del alojamiento', placeholder:'Hotel Sakura', full:true },
      { id:'habitacion', label:'Habitación',       placeholder:'Doble con vistas' },
      { id:'localizador',label:'Localizador',      placeholder:'ABC123' },
      { id:'url',        label:'Enlace de la reserva', placeholder:'https://… (web del hotel, Drive…)', type:'url', full:true },
    ],
  },
  coche: {
    label:'Datos del coche',
    fields: [
      { id:'compania',   label:'Compañía',         placeholder:'Hertz, Sixt, Goldcar…' },
      { id:'modelo',     label:'Modelo',           placeholder:'Toyota Aygo' },
      { id:'matricula',  label:'Matrícula',        placeholder:'1234 ABC' },
      { id:'localizador',label:'Localizador',      placeholder:'ABC123' },
      { id:'lugar_recogida',   label:'Lugar de recogida',   placeholder:'Aeropuerto MAD', full:true },
      { id:'lugar_devolucion', label:'Lugar de devolución', placeholder:'Aeropuerto MAD', full:true },
    ],
  },
  transporte: {
    label:'Datos del transporte',
    fields: [
      { id:'modo',       label:'Tipo de transporte', type:'select', options:[
        { value:'', label:'Tren / general' },
        { value:'tren',  label:'Tren' },
        { value:'bus',   label:'Autobús' },
        { value:'coche', label:'Coche' },
        { value:'ferry', label:'Ferry' },
        { value:'metro', label:'Metro' },
        { value:'taxi',  label:'Taxi' },
        { value:'barco', label:'Barco' },
      ] },
      { id:'compania',   label:'Compañía',         placeholder:'Renfe, JR, Eurostar…' },
      { id:'numero',     label:'Línea o número',   placeholder:'AVE 02701 · Línea 5' },
      { id:'origen',     label:'Origen',           placeholder:'Madrid Atocha' },
      { id:'destino',    label:'Destino',          placeholder:'Sevilla Sta. Justa' },
      { id:'vagon',      label:'Coche / Vagón',    placeholder:'7' },
      { id:'localizador',label:'Localizador',      placeholder:'ABC123' },
      { id:'asientos',   label:'Asientos',         type:'seats', full:true },
      { id:'url',        label:'Enlace de la reserva', placeholder:'https://… (web compañía, billetes, Drive…)', type:'url', full:true },
    ],
  },
  actividad: {
    label:'Datos de la actividad',
    fields: [
      { id:'duracion',   label:'Duración',         placeholder:'2 h' },
      { id:'organizador',label:'Organizador',      placeholder:'GetYourGuide, Civitatis…' },
      { id:'localizador',label:'Referencia',       placeholder:'XYZ123' },
    ],
  },
  // lugar / comida / otro no tienen metadata específica — usan los campos comunes
};

// Colores de borde para items tipo lugar/playa.
// El borde se resalta pero el fondo de la tarjeta NO cambia (queda blanco).
const BORDER_COLORS = [
  { id:'verde',    label:'Seguro',  hint:'Sitio que sí o sí quiero ver',  hex:'#10b981' },
  { id:'amarillo', label:'Dudoso',  hint:'Tal vez · pendiente de decidir', hex:'#f59e0b' },
  { id:'rojo',     label:'Descartar', hint:'No visto · quitar de la lista', hex:'#ef4444' },
];

// Colores predefinidos para títulos de día (pill de color seleccionable en el editor).
const DAY_COLORS = [
  { id:'azul',    label:'Azul' },
  { id:'verde',   label:'Verde' },
  { id:'naranja', label:'Naranja' },
  { id:'rojo',    label:'Rojo' },
  { id:'morado',  label:'Morado' },
  { id:'rosa',    label:'Rosa' },
  { id:'ambar',   label:'Ámbar' },
  { id:'gris',    label:'Gris' },
];

// Zonas horarias IANA más comunes para vuelos. El usuario puede escribir cualquier
// otra (es un datalist, no un select cerrado).
const COMMON_TIMEZONES = [
  'Europe/Madrid','Europe/London','Europe/Paris','Europe/Berlin','Europe/Rome',
  'Europe/Lisbon','Europe/Amsterdam','Europe/Zurich','Europe/Athens','Europe/Istanbul',
  'America/New_York','America/Chicago','America/Denver','America/Los_Angeles',
  'America/Mexico_City','America/Bogota','America/Buenos_Aires','America/Sao_Paulo',
  'Asia/Tokyo','Asia/Seoul','Asia/Shanghai','Asia/Hong_Kong','Asia/Singapore',
  'Asia/Bangkok','Asia/Jakarta','Asia/Dubai','Asia/Kolkata',
  'Africa/Cairo','Africa/Johannesburg',
  'Australia/Sydney','Pacific/Auckland', 'UTC',
];

const TYPES_PLANNING = [
  { id:'lugar',      label:'Lugar',                       requiresBooking:false, icon:'walk',   emoji:'📍' },
  { id:'personas',   label:'Personas',                    requiresBooking:false, icon:'pin',    emoji:'👥' },
  { id:'playa',      label:'Playa',                       requiresBooking:false, icon:'palm',   emoji:'🌴' },
  { id:'hotel',      label:'Alojamiento',                 requiresBooking:true,  hideTime:true, endOfDay:true, icon:'hotel', emoji:'🏨' },
  { id:'vuelo',      label:'Vuelo',                       requiresBooking:true,  icon:'plane',  emoji:'✈️' },
  { id:'transporte', label:'Transporte',                   requiresBooking:true,  icon:'train',  emoji:'🚆' },
  { id:'coche',      label:'Coche',                       requiresBooking:true,  icon:'car',    emoji:'🚗' },
  { id:'actividad',  label:'Actividad',                   requiresBooking:true,  icon:'ticket', emoji:'🎫' },
  { id:'comida',     label:'Comida',                      requiresBooking:false, supportsStatus:true, icon:'food', emoji:'🍽️' },
  { id:'compras',    label:'Compras',                     requiresBooking:false, supportsStatus:true, icon:'pin',  emoji:'🛍️' },
  { id:'gestion',    label:'Gestión',                     requiresBooking:false, supportsStatus:true, icon:'doc',  emoji:'📋' },
  { id:'otro',       label:'Otro',                        requiresBooking:false, icon:'pin',    emoji:'📌' },
];
const typeDef = (id) => TYPES_PLANNING.find(t => t.id === id) || TYPES_PLANNING[0];

// Tipos "rango" (con fechas inicio/fin propias vía consultation_*). El resto son
// "puntuales" y admiten día de inicio + día de fin (evento de varios días).
const RANGE_TYPES = ['hotel', 'vuelo', 'transporte', 'coche'];
const isSpanType = (ty) => !RANGE_TYPES.includes(ty);

// Categoría de presupuesto a partir del tipo de evento (fuente única de verdad
// para que un gasto vinculado siempre caiga en la categoría correcta).
const budgetCategoryForType = (type) => (
  { hotel:'alojamiento', vuelo:'transporte', coche:'transporte', transporte:'transporte',
    comida:'comida', compras:'compras', gestion:'otros' }[type] || 'actividades'
);

// Preferencias de interfaz por viaje, guardadas TODAS en una sola columna `settings`
// (jsonb). Así un ajuste de UI nuevo no necesita una columna propia en Supabase.
// `tripSettings` lee sin mutar; `tripSettingsMut` garantiza el objeto para escribir.
const tripSettings = (t) => (t && t.settings && typeof t.settings === 'object' && !Array.isArray(t.settings)) ? t.settings : {};
const tripSettingsMut = (t) => { if (!t.settings || typeof t.settings !== 'object' || Array.isArray(t.settings)) t.settings = {}; return t.settings; };

// Modos de transporte → emoji. El icono del evento cambia según metadata.modo.
const TRANSPORT_EMOJI = { tren:'🚆', bus:'🚌', coche:'🚗', ferry:'⛴️', metro:'🚇', taxi:'🚕', barco:'🚢' };
// Emoji efectivo de un planning item (transporte varía con su modo).
const planEmoji = (it) => {
  if (it && it.type === 'transporte') {
    const e = TRANSPORT_EMOJI[it.metadata && it.metadata.modo];
    if (e) return e;
  }
  return typeDef(it ? it.type : '').emoji || '📌';
};

// Estado efectivo de un planning_item, con migración suave del antiguo `in_consultation`.
// Devuelve null si el tipo no requiere reserva (lugar/comida/otro) → fondo blanco.
const itemStatus = (it) => {
  const td = typeDef(it.type);
  // "ninguno" = el usuario eligió explícitamente Sin estado → tarjeta blanca,
  // incluso en reservas (que por defecto serían "por iniciar").
  if (it.status === 'ninguno') return null;
  // Estado explícito siempre manda (vale para reservas y para comida/compras).
  if (it.status) return it.status;
  // Tipos que sólo "soportan" estado (comida/compras) sin estado fijado → null (blanco).
  if (!td.requiresBooking) return null;
  // Reservas sin status: migración inline desde el modelo antiguo.
  if (it.in_consultation) return 'en_consulta';
  // Si tiene datos de consulta o booking implícito, asumimos confirmado
  if (it.consultation_planned_d1 || it.consultation_price != null) return 'confirmado';
  // Actividad: por defecto SIN estado → muestra su color de tipo (morado). Las demás
  // reservas (vuelo/hotel/transporte/coche) sí arrancan en "por iniciar".
  return td.id === 'actividad' ? null : 'por_iniciar';
};

// Orden cronológico estricto para items del mismo día:
// 1) Check-out de hotel (virtual) SIEMPRE primero del día.
// 2) Hoteles (noche / hotel base) SIEMPRE al final del día.
// 3) Resto por hora ascendente.
// 4) Empate → order_index.
const planningCompare = (a, b) => {
  const aCo = a._virtual === 'checkout' ? -1 : 0;
  const bCo = b._virtual === 'checkout' ? -1 : 0;
  if (aCo !== bCo) return aCo - bCo;
  const aEnd = (typeDef(a.type).endOfDay && a._virtual !== 'checkout') ? 1 : 0;
  const bEnd = (typeDef(b.type).endOfDay && b._virtual !== 'checkout') ? 1 : 0;
  if (aEnd !== bEnd) return aEnd - bEnd;
  const aT = a.time || '99:99';
  const bT = b.time || '99:99';
  const tCmp = aT.localeCompare(bT);
  if (tCmp) return tCmp;
  return (a.order_index || 0) - (b.order_index || 0);
};

const el = (tag, props={}, children=[]) => {
  const n = document.createElement(tag);
  for (const [k,v] of Object.entries(props||{})) {
    if (k === 'class') n.className = v;
    else if (k === 'html') n.innerHTML = v;
    else if (k === 'text') n.textContent = v;
    else if (k === 'style') Object.assign(n.style, v);
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
    else if (k === 'data') Object.entries(v).forEach(([dk,dv]) => n.dataset[dk] = dv);
    else if (v !== null && v !== undefined && v !== false) n.setAttribute(k, v === true ? '' : v);
  }
  (Array.isArray(children) ? children : [children]).forEach(c => {
    if (c == null || c === false) return;
    if (typeof c === 'string') n.appendChild(document.createTextNode(c));
    else n.appendChild(c);
  });
  return n;
};
const html = (strings, ...values) => {

// Fechas
const parseDate = (iso) => iso ? new Date(iso + 'T00:00:00') : null;
// Fecha local → 'YYYY-MM-DD' SIN pasar por UTC. Usar SIEMPRE esto en lugar de
// `date.toISOString().slice(0,10)`: en zonas con offset positivo (España UTC+1/+2)
// la medianoche local cae el día ANTERIOR en UTC, lo que desplazaba los días un día atrás.
const isoLocal = (d) => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const fmtDate = (iso, opts={}) => {
  if (!iso) return '';
  const d = new Date(iso + 'T00:00:00');
  return d.toLocaleDateString('es-ES', opts);
};
const fmtDayLong = (iso) => fmtDate(iso, {weekday:'long', day:'numeric', month:'long'});
// Lista legible: ["A"]→"A", ["A","B"]→"A y B", ["A","B","C"]→"A, B y C".
const fmtList = (arr) => {
  const a = (arr || []).filter(Boolean);
  if (!a.length) return '';
  if (a.length === 1) return a[0];
  return a.slice(0, -1).join(', ') + ' y ' + a[a.length - 1];
};
// Etiqueta de comida según la hora (HH:MM): desayuno / comida / merienda / cena.
// Fuera de rango o sin hora → "Restaurante".
const mealLabel = (time) => {
  const m = /^(\d{1,2}):(\d{2})/.exec(time || '');
  if (!m) return 'Restaurante';
  const mins = (+m[1]) * 60 + (+m[2]);
  if (mins >= 420  && mins < 720)  return 'Desayuno';  // 07:00–11:59
  if (mins >= 720  && mins < 960)  return 'Comida';    // 12:00–15:59
  if (mins >= 960  && mins < 1110) return 'Merienda';  // 16:00–18:29
  if (mins >= 1110 && mins <= 1380) return 'Cena';     // 18:30–23:00
  return 'Restaurante';
};

// Momento principal de un planning item como Date, o null si no tiene hora precisa.
// Hotel → check-in (consultation_planned_d1 + t1, por defecto 15:00).
const itemDateTime = (it) => {
  let d = it.day_date, tm = it.time;
  if (it.type === 'hotel') { d = it.consultation_planned_d1 || it.day_date; tm = it.consultation_planned_t1 || '15:00'; }
  if (!d) return null;
  const hhmm = (tm && /^\d{1,2}:\d{2}/.test(tm)) ? tm.slice(0,5) : null;
  if (!hhmm) return null;            // sin hora no hay cuenta atrás precisa
  const dt = new Date(`${d}T${hhmm}:00`);
  return isNaN(dt.getTime()) ? null : dt;
};
// Próximo evento a partir de fromTs. Prioriza los de HOY (aunque NO tengan hora) y, si
// hoy ya no queda nada, el siguiente de días futuros. Adjunta ._ts (ms) o null si el
// evento no tiene hora (entonces se muestra "hoy"/fecha en lugar de cuenta atrás).
const nextTimedEvent = (items, fromTs = Date.now()) => {
  const today = isoLocal(new Date(fromTs));
  const cands = items.filter(it => {
    if (it._virtual) return false;
    const d = it.day_date;
    if (!d || d < today) return false;
    const dt = itemDateTime(it);
    if (dt) return dt.getTime() >= fromTs;   // con hora: aún no ha pasado
    return true;                             // sin hora: cuenta si es hoy o futuro
  });
  if (!cands.length) return null;
  cands.sort((a, b) => (a.day_date || '').localeCompare(b.day_date || '') || planningCompare(a, b));
  const best = cands[0];
  const dt = itemDateTime(best);
  best._ts = dt ? dt.getTime() : null;
  return best;
};
// Cuenta atrás (ms) → "en 2 d 3 h", "en 3 h 5 min", "en 12 min", "ahora".
const fmtCountdown = (ms) => {
  if (ms <= 0) return 'ahora';
  const totalMin = Math.floor(ms / 60000);
  const d = Math.floor(totalMin / 1440);
  const h = Math.floor((totalMin % 1440) / 60);
  const m = totalMin % 60;
  if (d >= 1) return `en ${d} d${h ? ' ' + h + ' h' : ''}`;
  if (h >= 1) return `en ${h} h${m ? ' ' + m + ' min' : ''}`;
  if (m >= 1) return `en ${m} min`;
  return 'en menos de 1 min';
};
// Texto del "Próximo": cuenta atrás si tiene hora; si no, "hoy" o la fecha del evento.
const nextEventText = (ev) => {
  if (!ev) return '';
  if (ev._ts) return fmtCountdown(ev._ts - Date.now());
  if ((ev.day_date || '') === todayIso()) return 'hoy';
  return ev.day_date ? fmtDate(ev.day_date, { weekday:'short', day:'numeric', month:'short' }) : '';
};

const weatherEmoji = (code) => WMO_EMOJI[code] ?? '🌡️';
const Weather = {
  _mem: {},
  // Devuelve { 'YYYY-MM-DD': {code,max,min,rain} } para unas coords. Cachea en memoria
  // (3 h) y en IndexedDB (offline-first: si no hay red, usa el último guardado).
  async forCoords(lat, lng) {
    if (lat == null || lng == null) return {};
    const key = `${(+lat).toFixed(2)},${(+lng).toFixed(2)}`;
    if (this._mem[key] && Date.now() - this._mem[key].ts < 3 * 3600 * 1000) return this._mem[key].daily;
    let entry = null;
    if (navigator.onLine) {
      try {
        const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lng}`
          + `&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max`
          + `&timezone=auto&past_days=1&forecast_days=16`;
        const j = await (await fetch(url, { signal: AbortSignal.timeout(6000) })).json();
        const daily = {};
        (j?.daily?.time || []).forEach((d, i) => {
          daily[d] = {
            code: j.daily.weather_code[i],
            max: Math.round(j.daily.temperature_2m_max[i]),
            min: Math.round(j.daily.temperature_2m_min[i]),
            rain: j.daily.precipitation_probability_max?.[i] ?? null,
          };
        });
        entry = { ts: Date.now(), daily };
        this._mem[key] = entry;
        try { await DB.meta('wx_' + key, entry); } catch (_) {}
      } catch (_) {}
    }
    if (!entry) { try { const c = await DB.meta('wx_' + key); if (c) { this._mem[key] = c; entry = c; } } catch (_) {} }
    return entry?.daily || {};
  },
  // Texto compacto para un día: "⛅ 24°/14° · 💧40%"
  chipText(w) {
    if (!w) return null;
    const rain = (w.rain != null && w.rain >= 30) ? ` · 💧${w.rain}%` : '';
    return `${weatherEmoji(w.code)} ${w.max}°/${w.min}°${rain}`;
  },
  // Sugerencia breve de ropa según min/max del día. null si nada destacable.
  ropaHint(w) {
    if (!w || w.min == null) return null;
    if (w.min <= 8)  return '🧥 abrigo';
    if (w.max >= 30) return '👕 fresco';
    if (w.min <= 14) return '🧶 capas';

  },
};

const tripCoords = (planningItems) => {
  const p = (planningItems || []).find(i => i.lat != null && i.lng != null);
  return p ? { lat: p.lat, lng: p.lng } : null;
