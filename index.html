<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="format-detection" content="telephone=no, date=no, address=no, email=no" />
<title>Viajes</title>

<meta name="description" content="Planificación y gestión de viajes personales — local-first, offline" />
<meta name="theme-color" content="#fb7185" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#0b1220" media="(prefers-color-scheme: dark)" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" type="image/svg+xml" href="icons/icon.svg" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />

<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Viajes" />

<!-- Aplicar tema antes del primer paint para evitar flash (FOUC) -->
<script>
(function(){
  try {
    var t = localStorage.getItem('viajes_theme');
    if (t === 'claro' || t === 'oscuro') document.documentElement.setAttribute('data-tema', t);
  } catch (e) {}
})();
</script>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&display=swap" />
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

<style>
/* ========================================================================
   Sistema de diseño — paleta slate/azul, tipografía Manrope única
   (sin mono: los números usan números tabulares de Manrope)
   ====================================================================== */
:root {
  --r-sm:8px; --r-md:14px; --r-lg:20px; --r-pill:999px;
  --sh-1:0 1px 2px rgba(0,0,0,.04),0 1px 1px rgba(0,0,0,.03);
  --sh-2:0 2px 10px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04);
  --sh-3:0 12px 28px rgba(0,0,0,.10);
  --gap-1:4px; --gap-2:8px; --gap-3:12px; --gap-4:16px;
  --gap-5:24px; --gap-6:32px; --gap-7:48px;
  --font-ui:'Manrope', system-ui, -apple-system, sans-serif;
  --font-titulo:'Manrope', system-ui, -apple-system, sans-serif;
  /* --font-num: alias a Manrope con números tabulares. Mantiene compatibilidad
     con el código que aún referencia esta variable. */
  --font-num:'Manrope', system-ui, -apple-system, sans-serif;
  --ease: cubic-bezier(.2,.8,.2,1);
}
:root, :root[data-tema="claro"] {
  --bg:#f8fafc; --bg-elev:#fff; --bg-soft:#f1f5f9; --bg-input:#fff;
  --text:#0f172a; --text-muted:#64748b; --text-inv:#fff;
  --line:#e2e8f0; --line-soft:#f1f5f9;
  --accent:#2563eb; --accent-2:#06b6d4; --accent-bg:#dbeafe;
  --focus:#2563eb; --danger:#dc2626;
  --status-curso:#059669; --status-prep:#d97706; --status-prox:#2563eb; --status-pas:#64748b;
}
:root[data-tema="oscuro"] {
  --bg:#0b1220; --bg-elev:#111a2e; --bg-soft:#1e293b; --bg-input:#111a2e;
  --text:#f1f5f9; --text-muted:#94a3b8; --text-inv:#0b1220;
  --line:#334155; --line-soft:#1e293b;
  --accent:#60a5fa; --accent-2:#22d3ee; --accent-bg:#1e3a5f;
  --focus:#93c5fd; --danger:#f87171;
  --status-curso:#34d399; --status-prep:#fbbf24; --status-prox:#60a5fa; --status-pas:#94a3b8;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-tema]) {
    --bg:#0b1220; --bg-elev:#111a2e; --bg-soft:#1e293b; --bg-input:#111a2e;
    --text:#f1f5f9; --text-muted:#94a3b8; --text-inv:#0b1220;
    --line:#334155; --line-soft:#1e293b;
    --accent:#60a5fa; --accent-2:#22d3ee; --accent-bg:#1e3a5f;
    --focus:#93c5fd; --danger:#f87171;
  }
}

* { box-sizing:border-box; }
html, body { margin:0; padding:0; }
html { -webkit-text-size-adjust:100%; }
body {
  font-family:var(--font-ui);
  background:var(--bg); color:var(--text);
  font-size:16px; line-height:1.5; font-weight:400;
  -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale;
  padding-bottom:env(safe-area-inset-bottom);
  overflow-x:hidden;
}
button, input, select, textarea { font:inherit; color:inherit; }
a { color:var(--accent); text-decoration:none; }
a:hover { text-decoration:underline; }
:focus-visible { outline:2px solid var(--focus); outline-offset:2px; border-radius:6px; }

/* .mono: ya no cambia la fuente; solo activa números tabulares para alinear
   columnas de cifras en listas de gastos, fechas, etc. */
.mono { font-family:var(--font-ui); font-feature-settings:"tnum","ss01"; }
.muted { color:var(--text-muted); }

/* Skip link — invisible hasta foco con teclado */
.skip-link {
  position:absolute; left:8px; top:-44px; z-index:200;
  background:var(--accent); color:#fff;
  padding:10px 16px; border-radius:var(--r-md);
  text-decoration:none; font-weight:600;
  transition:top .15s var(--ease);
}
.skip-link:focus { top:8px; outline:2px solid #fff; outline-offset:2px; }

/* Respetar preferencia de movimiento reducido */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration:.01ms !important;
    animation-iteration-count:1 !important;
    transition-duration:.01ms !important;
    scroll-behavior:auto !important;
  }
}

/* ========================================================================
   Layout
   ====================================================================== */
.app-shell { min-height:100dvh; display:flex; flex-direction:column; }

header.topbar {
  position:sticky; top:0; z-index:40;
  background:color-mix(in srgb, var(--bg) 80%, transparent);
  backdrop-filter: saturate(180%) blur(14px);
  -webkit-backdrop-filter: saturate(180%) blur(14px);
  border-bottom:1px solid var(--line-soft);
  padding:14px 16px;
  padding-top:calc(14px + env(safe-area-inset-top));
}
.topbar-inner {
  max-width:1100px; margin:0 auto;
  display:flex; align-items:center; gap:12px;
}
.topbar-title {
  font-family:var(--font-titulo); font-weight:700; letter-spacing:-.02em;
  font-size:18px;
}
.topbar-spacer { flex:1; }

/* Slot de acciones específicas de la vista actual (Editar/PDF en detalle de viaje). */
.topbar-extras { display:flex; align-items:center; gap:6px; }
.topbar-extras:empty { display:none; }

/* En el detalle de viaje el título grande estilo Apple va en el cuerpo de la vista,
   no en el topbar — para no duplicarlo. Ocultamos el topbar-title en todas las
   resoluciones cuando estamos dentro de un viaje. La sync-pill se oculta solo en móvil. */
body.view-trip .topbar-title { display:none; }
@media (max-width: 720px) {
  body.view-trip .status-pill { display:none; }
}

/* Título grande "Apple-style" para el detalle de viaje — copiado del estilo
   de las recetas: degradado de color, peso 700, letter-spacing negativo. */
.trip-detail-title {
  font-family:var(--font-titulo);
  font-size:40px; font-weight:700;
  letter-spacing:-.03em; line-height:1.12;
  margin:14px 0 6px; padding-bottom:.08em;
  word-break:break-word; overflow-wrap:break-word;
  hyphens:auto;
  max-width:100%;
  background-image:linear-gradient(135deg,
    var(--accent) 0%,
    color-mix(in srgb, var(--accent) 72%, #000 28%) 100%);
  -webkit-background-clip:text; background-clip:text;
  color:transparent; -webkit-text-fill-color:transparent;
}
@media (min-width:720px) {
  .trip-detail-title { font-size:56px; letter-spacing:-.035em; }
}
:root[data-tema="oscuro"] .trip-detail-title {
  background-image:linear-gradient(135deg,
    color-mix(in srgb, var(--accent) 85%, #fff 15%) 0%,
    var(--accent) 100%);
}

/* Subtítulo: fechas + faltan X días. Sin destino. */
.trip-detail-sub {
  margin:0 0 18px;
  font-size:14px; color:var(--text-muted);
  font-feature-settings:"tnum","ss01";
}
.trip-detail-sub .sep { opacity:.55; margin:0 2px; }

/* Portada con foto del viaje — visible solo en escritorio (≥720px).
   En móvil la ocultamos por completo para más limpieza visual. */
.trip-detail-cover-wrap {
  display:none;
  margin:0 0 14px;
}
.trip-detail-cover-inner {
  position:relative; overflow:hidden;
  border-radius:var(--r-lg); border:1px solid var(--line);
  height:240px;
}
.trip-detail-cover-inner img {
  position:absolute; inset:0;
  width:100%; height:100%; object-fit:cover;
  display:block;
}
@media (min-width:720px) {
  .trip-detail-cover-wrap { display:block; }
}

/* Panel de detalle de sincronización (sheet desde el sync-pill) */
.sync-detail { display:flex; flex-direction:column; gap:10px; }
.sync-row {
  display:flex; justify-content:space-between; align-items:center;
  padding:10px 12px; border:1px solid var(--line); border-radius:var(--r-md);
  background:var(--bg-elev);
}
.sync-label { font-size:13px; color:var(--text-muted); }
.sync-val   { font-size:13px; font-weight:600; color:var(--text);
  font-feature-settings:"tnum","ss01"; }
.sync-error-box {
  padding:12px 14px; border-radius:var(--r-md);
  background:color-mix(in srgb, var(--danger) 10%, var(--bg-elev));
  border:1px solid color-mix(in srgb, var(--danger) 35%, var(--line));
}
.sync-error-title {
  font-size:12px; font-weight:700; text-transform:uppercase;
  letter-spacing:.05em; color:var(--danger); margin-bottom:6px;
}
.sync-error-msg {
  font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  font-size:11.5px; line-height:1.4;
  margin:0; white-space:pre-wrap; word-break:break-word;
  color:var(--text);
}

/* Menú de acciones del viaje (sheet desde el hamburguesa) */
.action-menu { display:flex; flex-direction:column; gap:4px; }
.action-menu-item {
  display:flex; align-items:center; gap:14px;
  padding:14px 12px; border-radius:var(--r-md);
  background:transparent; border:1px solid transparent;
  cursor:pointer; text-align:left;
  font:inherit; color:var(--text); font-size:15px; font-weight:500;
  transition:background .12s var(--ease);
}
.action-menu-item:hover { background:var(--bg-soft); }
.action-menu-icon {
  display:flex; align-items:center; justify-content:center;
  width:36px; height:36px; border-radius:50%;
  background:var(--bg-soft); border:1px solid var(--line);
  color:var(--accent); flex-shrink:0;
}
.action-menu-icon svg { width:18px; height:18px; }
.action-menu-label { flex:1; }

.icon-btn {
  border:1px solid var(--line); background:var(--bg-elev); color:var(--text);
  width:38px; height:38px; border-radius:var(--r-md);
  display:inline-flex; align-items:center; justify-content:center;
  cursor:pointer; transition:transform .18s var(--ease), box-shadow .18s var(--ease), background .18s var(--ease);
}
.icon-btn:hover { transform:translateY(-1px); box-shadow:var(--sh-2); }
.icon-btn svg { width:18px; height:18px; }

main {
  max-width:1100px; margin:0 auto;
  padding:16px 16px 48px;
  flex:1; width:100%;
  /* `clip` evita scroll horizontal accidental por elementos que sobresalen
     (títulos con gradiente, cards con contenido ancho, tablists). Sin él,
     algunas pantallas iOS Safari hacen scroll lateral y "descentran". */
  overflow-x: clip;
  animation: fadeIn .18s var(--ease);
}
/* Defensa global: el body nunca debe permitir scroll horizontal. */
html, body { overflow-x: clip; }
@keyframes fadeIn { from { opacity:0; transform:translateY(4px); } to { opacity:1; transform:none; } }

/* ========================================================================
   Tipografía de vista
   ====================================================================== */
h1.view-title {
  font-family:var(--font-titulo); font-weight:600; letter-spacing:-.03em;
  font-size:28px; margin:8px 0 4px;
}
@media (min-width:720px) { h1.view-title { font-size:34px; } }
.view-sub { color:var(--text-muted); font-size:14px; margin:0 0 24px; }

h2.section-title {
  font-family:var(--font-titulo); font-weight:600; letter-spacing:-.02em;
  font-size:20px; margin:32px 0 12px;
}

/* ========================================================================
   Componentes — botones
   ====================================================================== */
.btn {
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  height:44px; padding:0 18px;
  border:1px solid var(--line); background:var(--bg-elev); color:var(--text);
  border-radius:var(--r-pill);
  font-weight:600; font-size:14px; letter-spacing:-.01em;
  cursor:pointer; transition:transform .18s var(--ease), box-shadow .18s var(--ease), background .18s var(--ease);
}
.btn:hover { transform:translateY(-1px); box-shadow:var(--sh-2); }
.btn:disabled { opacity:.5; cursor:not-allowed; transform:none; box-shadow:none; }
.btn svg { width:16px; height:16px; }

.btn-primary {
  background:linear-gradient(135deg, var(--accent), var(--accent-2));
  color:#fff; border:none;
  box-shadow: 0 6px 18px color-mix(in srgb, var(--accent) 28%, transparent);
}
.btn-primary:hover {
  box-shadow: 0 10px 24px color-mix(in srgb, var(--accent) 36%, transparent);
}
.btn-ghost { background:transparent; border-color:transparent; }
.btn-danger { color:var(--danger); border-color:color-mix(in srgb, var(--danger) 40%, var(--line)); }
.btn-sm { height:32px; padding:0 12px; font-size:13px; }

/* FAB principal */
.fab {
  position:fixed; right:20px; bottom:20px; z-index:30;
  width:60px; height:60px; border-radius:50%;
  background:linear-gradient(135deg, var(--accent), var(--accent-2)); color:#fff;
  border:none; cursor:pointer;
  box-shadow: 0 12px 28px color-mix(in srgb, var(--accent) 36%, transparent);
  display:flex; align-items:center; justify-content:center;
  transition:transform .18s var(--ease), box-shadow .18s var(--ease);
}
.fab:hover { transform:translateY(-2px); box-shadow: 0 16px 36px color-mix(in srgb, var(--accent) 48%, transparent); }
.fab svg { width:24px; height:24px; }

/* ========================================================================
   Componentes — chips, segmented, dot
   ====================================================================== */
.chip-row { display:flex; gap:8px; overflow-x:auto; padding:2px; margin:0 -2px 24px; -webkit-overflow-scrolling:touch; scrollbar-width:none; }
.chip-row::-webkit-scrollbar { display:none; }
.chip {
  flex-shrink:0;
  display:inline-flex; align-items:center; gap:7px;
  height:36px; padding:0 15px;
  background:var(--bg-elev); border:1px solid var(--line); color:var(--text-muted);
  border-radius:var(--r-pill);
  font-family:var(--font-ui);
  font-size:13px; font-weight:600;
  letter-spacing:-.005em;
  cursor:pointer; transition:all .18s var(--ease);
}
.chip:hover { color:var(--text); }
.chip.active {
  background:var(--accent); border-color:var(--accent); color:#fff;
  box-shadow: 0 4px 12px color-mix(in srgb, var(--accent) 22%, transparent);
}
.chip .badge {
  font-family:var(--font-ui);
  font-feature-settings:"tnum";
  font-size:11px; font-weight:600;
  background:color-mix(in srgb, var(--text) 8%, transparent);
  padding:2px 7px; border-radius:var(--r-pill);
  line-height:1.2;
}
.chip.active .badge { background:rgba(255,255,255,.22); color:#fff; }

.segmented {
  display:inline-flex; background:var(--bg-soft); border-radius:var(--r-pill);
  padding:3px; border:1px solid var(--line);
}
.segmented button {
  border:none; background:transparent; color:var(--text-muted);
  height:32px; padding:0 14px; border-radius:var(--r-pill);
  font-size:13px; font-weight:500; cursor:pointer;
  transition:all .18s var(--ease);
}
.segmented button.active { background:var(--bg-elev); color:var(--text); box-shadow:var(--sh-1); }

/* Resumen — toggle Hoy/Mañana del planning del día */
.resumen-day-head {
  display:flex; align-items:center; justify-content:space-between;
  gap:12px; flex-wrap:wrap; margin:26px 0 4px;
}
.resumen-day-date {
  color:var(--text-muted); font-size:13px; font-weight:500;
  text-transform:capitalize; margin-bottom:10px;
  display:flex; align-items:center; gap:10px; flex-wrap:wrap;
}
/* Chip de clima (clima por día) — junto a la fecha y en cabeceras del planning. */
.wx-chip {
  font-size:12px; font-weight:600; color:var(--text);
  font-feature-settings:"tnum"; white-space:nowrap;
  text-transform:none; letter-spacing:0;
}
.wx-chip:empty { display:none; }
.day-head .wx-chip {
  background:var(--bg-soft); border:1px solid var(--line);
  padding:2px 8px; border-radius:var(--r-pill);
}
.resumen-day-empty {
  color:var(--text-muted); font-size:14px;
  padding:18px; text-align:center;
  background:var(--bg-soft); border:1px dashed var(--line);
  border-radius:var(--r-md);
}

.dot { display:inline-block; width:8px; height:8px; border-radius:50%; flex-shrink:0; }
.dot-curso { background:var(--status-curso); }
.dot-prep  { background:var(--status-prep); }
.dot-prox  { background:var(--status-prox); }
.dot-pas   { background:var(--status-pas); }
.dot-todos { background:linear-gradient(135deg, var(--accent), var(--accent-2)); }

/* ========================================================================
   Tarjetas (genéricas)
   ====================================================================== */
.card {
  background:var(--bg-elev);
  border:1px solid var(--line);
  border-radius:var(--r-lg);
  box-shadow:var(--sh-1);
  transition:transform .18s var(--ease), box-shadow .18s var(--ease);
  overflow:hidden;
}
.card.interactive { cursor:pointer; }
.card.interactive:hover { transform:translateY(-2px); box-shadow:var(--sh-2); }
.card-body { padding:20px; }

/* ========================================================================
   Tarjeta de viaje
   ====================================================================== */
.trip-grid {
  display:grid; gap:24px;
  grid-template-columns: minmax(0, 1fr);
  /* minmax(0, 1fr) en lugar de 1fr evita que el grid item se "estire" al ancho
     intrínseco del contenido (imgs grandes, títulos largos), que es la causa
     habitual del desbordamiento horizontal en móvil. */
}
.trip-grid > * { min-width:0; max-width:100%; }
@media (min-width:720px) {
  .trip-grid { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap:28px; }
}

.trip-card { position:relative; overflow:hidden; cursor:pointer; min-width:0; max-width:100%; }
.trip-card-cover {
  position:relative; height:210px;
  background:linear-gradient(135deg, var(--accent-bg), var(--bg-soft));
  display:flex; flex-direction:column; justify-content:flex-end;
  padding:18px;
}
.trip-card-cover img {
  position:absolute; inset:0; width:100%; height:100%; object-fit:cover;
  z-index:0;
}
.trip-card-cover::after {
  content:''; position:absolute; inset:0;
  /* Degradado oscuro inferior — más intenso para que el título (blanco) sea legible
     incluso sobre fotos claras o de cielo. Stop intermedio para una curva más natural
     y evitar el corte duro del tope. */
  background:linear-gradient(to top,
    rgba(0,0,0,.75) 0%,
    rgba(0,0,0,.60) 25%,
    rgba(0,0,0,.30) 55%,
    rgba(0,0,0,.08) 80%,
    rgba(0,0,0,0)   100%);
  pointer-events:none;
  z-index:1; /* el degradado va POR ENCIMA de la imagen, no detrás */
}
/* El texto y el badge de estado van encima del degradado (z-index:2). Explícitos
   por componente para no depender de la generalización con :not(img), que en algunos
   contextos no se aplicaba bien por orden de selectores. */
.trip-card-cover .trip-card-name,
.trip-card-cover .trip-card-meta { position:relative; z-index:2; }
.trip-card-cover .trip-card-status { z-index:2; }

.trip-card-status {
  position:absolute; top:14px; left:14px; z-index:2;
  display:inline-flex; align-items:center; gap:6px;
  background:rgba(255,255,255,.92); color:#0f172a;
  padding:6px 12px; border-radius:var(--r-pill);
  font-family:var(--font-ui);
  font-size:12px; font-weight:600; letter-spacing:-.005em;
  backdrop-filter:blur(6px);
}

.trip-card-name {
  color:#fff;
  font-family:var(--font-titulo); font-weight:800;
  font-size:22px; letter-spacing:-.02em; line-height:1.15;
  text-shadow:0 1px 3px rgba(0,0,0,.4);
  /* Partir nombres largos en lugar de empujar la card más allá del viewport.
     "Curaçao · Willemstad + lagunas" es legal partir donde haga falta. */
  word-break:break-word; overflow-wrap:break-word; hyphens:auto;
  max-width:100%;
}
.trip-card-meta {
  margin-top:6px;
  color:rgba(255,255,255,.95);
  font-family:var(--font-ui);
  font-feature-settings:"tnum","ss01";
  font-size:13.5px; font-weight:600; letter-spacing:-.01em;
  text-shadow:0 1px 2px rgba(0,0,0,.3);
  display:flex; align-items:center; gap:10px; flex-wrap:wrap;
  max-width:100%; min-width:0;
}
.trip-card-meta .sep { opacity:.55; }
.trip-card-foot {
  display:flex; align-items:center; justify-content:space-between;
  padding:14px 18px;
  border-top:1px solid var(--line-soft);
  background:var(--bg-elev);
  gap:12px;
}
.trip-card-foot .destino {
  color:var(--text-muted); font-size:13px;
  min-width:0; word-break:break-word; overflow-wrap:break-word;
}

/* Confirmación del viaje — tiñe la franja inferior (foot) de la tarjeta.
   null → blanco/elev (sin clase). confirmado → verde, dudoso → naranja,
   cancelado → rojo. Mismo lenguaje de color que los estados de planning. */
.trip-card.conf-confirmado .trip-card-foot {
  background:color-mix(in srgb, #34d399 16%, var(--bg-elev));
  border-top-color:color-mix(in srgb, #10b981 45%, var(--line-soft));
}
.trip-card.conf-dudoso .trip-card-foot {
  background:color-mix(in srgb, #fbbf24 18%, var(--bg-elev));
  border-top-color:color-mix(in srgb, #f59e0b 50%, var(--line-soft));
}
.trip-card.conf-aplazado .trip-card-foot {
  background:color-mix(in srgb, #c084fc 16%, var(--bg-elev));
  border-top-color:color-mix(in srgb, #a855f7 48%, var(--line-soft));
}
.trip-card.conf-cancelado .trip-card-foot {
  background:color-mix(in srgb, #f87171 16%, var(--bg-elev));
  border-top-color:color-mix(in srgb, #ef4444 50%, var(--line-soft));
}
.trip-card.conf-cancelado .trip-card-name { text-decoration:line-through; }
.trip-card.conf-sin_fecha .trip-card-foot {
  background:color-mix(in srgb, #e879f9 16%, var(--bg-elev));
  border-top-color:color-mix(in srgb, #e879f9 48%, var(--line-soft));
}

/* Motivo (solo cancelado/aplazado) — franja de texto bajo el foot, mismo tinte. */
.trip-card-reason {
  padding:11px 18px 13px;
  font-family:var(--font-ui);
  font-size:12.5px; line-height:1.4;
  display:flex; gap:6px; flex-wrap:wrap;
  border-top:1px solid var(--line-soft);
}
.trip-card-reason-label { font-weight:700; flex-shrink:0; }
.trip-card-reason-text { color:var(--text); opacity:.85; word-break:break-word; overflow-wrap:break-word; min-width:0; }
.trip-card.conf-aplazado .trip-card-reason {
  background:color-mix(in srgb, #c084fc 16%, var(--bg-elev));
  border-top-color:color-mix(in srgb, #a855f7 28%, var(--line-soft));
}
.trip-card.conf-aplazado .trip-card-reason-label { color:#7e22ce; }
.trip-card.conf-cancelado .trip-card-reason {
  background:color-mix(in srgb, #f87171 16%, var(--bg-elev));
  border-top-color:color-mix(in srgb, #ef4444 28%, var(--line-soft));
}
.trip-card.conf-cancelado .trip-card-reason-label { color:#b91c1c; }
.trip-card.conf-sin_fecha .trip-card-reason {
  background:color-mix(in srgb, #e879f9 16%, var(--bg-elev));
  border-top-color:color-mix(in srgb, #e879f9 28%, var(--line-soft));
}
.trip-card.conf-sin_fecha .trip-card-reason-label { color:#a21caf; }
:root[data-tema="oscuro"] .trip-card.conf-aplazado .trip-card-reason-label { color:#d8b4fe; }
:root[data-tema="oscuro"] .trip-card.conf-cancelado .trip-card-reason-label { color:#fca5a5; }
:root[data-tema="oscuro"] .trip-card.conf-sin_fecha .trip-card-reason-label { color:#f5b8fb; }

/* Dots de los chips de filtro Aplazados / Cancelados */
.dot-aplazado { background:#a855f7; }
.dot-cancelado { background:#ef4444; }

/* Toggle "en preparación" */
.switch {
  position:relative; display:inline-flex; align-items:center; gap:8px;
  cursor:pointer; user-select:none;
  font-size:12px; color:var(--text-muted);
}
.switch input { position:absolute; opacity:0; pointer-events:none; }
.switch-track {
  width:34px; height:20px; background:var(--bg-soft); border:1px solid var(--line);
  border-radius:var(--r-pill); position:relative; transition:all .18s var(--ease);
}
.switch-track::after {
  content:''; position:absolute; top:1px; left:1px;
  width:16px; height:16px; border-radius:50%;
  background:#fff; box-shadow:var(--sh-1);
  transition:transform .18s var(--ease);
}
.switch input:checked + .switch-track { background:var(--accent); border-color:var(--accent); }
.switch input:checked + .switch-track::after { transform:translateX(14px); }

/* ========================================================================
   Empty state
   ====================================================================== */
.empty {
  text-align:center; padding:48px 24px;
  color:var(--text-muted);
}
.empty .icon {
  display:inline-flex; align-items:center; justify-content:center;
  width:64px; height:64px; border-radius:50%;
  background:var(--bg-soft); margin-bottom:16px;
}
.empty .icon svg { width:28px; height:28px; color:var(--text-muted); }
.empty h3 { color:var(--text); font-weight:600; margin:8px 0 4px; }
.empty p { margin:0; font-size:14px; max-width:300px; margin:0 auto; }

/* ========================================================================
   Formularios
   ====================================================================== */
.form-row { display:flex; flex-direction:column; gap:6px; margin-bottom:16px; }
.form-row label { font-size:13px; font-weight:500; color:var(--text-muted); }
.form-row input, .form-row select, .form-row textarea {
  border:1px solid var(--line); background:var(--bg-input); color:var(--text);
  border-radius:var(--r-md); padding:11px 14px;
  /* width:100% + min-width:0 + border-box → no fuerzan su ancho intrínseco
     (evita que el grid de 2 columnas se desborde por los lados en móvil). */
  width:100%; min-width:0; box-sizing:border-box;
  /* 16px evita el auto-zoom de iOS al enfocar un campo. */
  font-size:16px; font-family:var(--font-ui);
  transition:border .18s var(--ease), box-shadow .18s var(--ease);
}
.form-row input:focus, .form-row select:focus, .form-row textarea:focus {
  border-color:var(--accent); outline:none;
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 18%, transparent);
}
.form-row textarea { min-height:80px; resize:vertical; }
.form-row.num input { font-feature-settings:"tnum","ss01"; }
.form-grid-2 { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
/* Las celdas del grid pueden encoger por debajo del contenido (si no, los inputs
   fuerzan el ancho y la rejilla se sale por los lados). */
.form-grid-2 > * { min-width:0; }
/* Hora con botón ✕ para vaciarla (necesario en iOS, donde el time nativo no se
   puede dejar en blanco una vez puesto). */
.time-with-clear { display:flex; align-items:center; gap:6px; }
.time-with-clear input { flex:1; min-width:0; }
.time-clear {
  flex-shrink:0; width:34px; height:34px; border-radius:var(--r-sm);
  border:1px solid var(--line); background:var(--bg-soft); color:var(--text-muted);
  cursor:pointer; font-size:14px; line-height:1;
  display:inline-flex; align-items:center; justify-content:center;
}
.time-clear:active { background:var(--line); color:var(--text); }
.field-hint { font-size:12px; color:var(--text-muted); margin-top:4px; }

/* ========================================================================
   Modal sheet (sube desde abajo en móvil)
   ====================================================================== */
.sheet-back {
  position:fixed; inset:0; z-index:90;
  background:rgba(15,23,42,.42);
  opacity:0; pointer-events:none;
  transition:opacity .25s var(--ease);
}
.sheet-back.show { opacity:1; pointer-events:auto; }

.sheet {
  position:fixed; left:0; right:0; bottom:0; z-index:91;
  background:var(--bg-elev); color:var(--text);
  border-top-left-radius:24px; border-top-right-radius:24px;
  transform:translateY(100%);
  opacity:0; pointer-events:none;
  transition:transform .28s var(--ease), opacity .22s var(--ease);
  max-height:90dvh; display:flex; flex-direction:column;
  padding-bottom:env(safe-area-inset-bottom);
  box-shadow: 0 -10px 40px rgba(0,0,0,.18);
}
.sheet.show { transform:translateY(0); opacity:1; pointer-events:auto; }
.sheet-handle {
  width:42px; height:5px; border-radius:var(--r-pill);
  background:var(--line); margin:10px auto 4px;
}
.sheet-header {
  padding:8px 20px 16px;
  display:flex; align-items:center; gap:12px;
  border-bottom:1px solid var(--line-soft);
}
.sheet-title { font-family:var(--font-titulo); font-weight:600; letter-spacing:-.02em; font-size:20px; flex:1; }
.sheet-body { padding:20px; overflow-y:auto; }
.sheet-foot {
  padding:14px 20px;
  border-top:1px solid var(--line-soft);
  display:flex; gap:10px; justify-content:flex-end;
}
@media (min-width:720px) {
  .sheet {
    left:50%; right:auto; bottom:50%;
    /* opacity:0 ya lo oculta; el transform solo da la animación de entrada */
    transform:translate(-50%, calc(50% + 24px));
    width:min(560px, 92vw);
    border-radius:24px;
    max-height:84dvh;
  }
  .sheet.show { transform:translate(-50%, 50%); }
  .sheet-handle { display:none; }
}

/* ========================================================================
   Status pill (online / sync)
   ====================================================================== */
.status-pill {
  display:inline-flex; align-items:center; gap:6px;
  font-family:var(--font-ui);
  font-size:11px; font-weight:600;
  letter-spacing:.005em;
  color:var(--text-muted);
  padding:4px 11px; border-radius:var(--r-pill);
  background:var(--bg-soft); border:1px solid var(--line);
}
.status-pill .dot { width:6px; height:6px; }
.status-pill.online .dot { background:#10b981; }
.status-pill.offline .dot { background:#f59e0b; }
.status-pill.error .dot { background:#ef4444; }

/* ========================================================================
   Toolbar de orden / sort
   ====================================================================== */
.toolbar {
  display:flex; align-items:center; justify-content:space-between;
  gap:12px; margin-bottom:16px; flex-wrap:wrap;
}

/* Botón de perfil en topbar — muestra la inicial del perfil activo en lugar
   del icono de muñeco. Color por perfil (R/S/I). */
.profile-initial-btn { padding:0; }
.profile-initial {
  display:flex; align-items:center; justify-content:center;
  width:100%; height:100%;
  font-family:var(--font-titulo);
  font-weight:700; font-size:14px; letter-spacing:-.01em;
  color:#fff;
  background:linear-gradient(135deg, var(--accent), var(--accent-2));
  border-radius:inherit;
}
.profile-initial.profile-ruben    { background:linear-gradient(135deg,#3b82f6,#06b6d4); }
.profile-initial.profile-sergio   { background:linear-gradient(135deg,#a855f7,#ec4899); }
.profile-initial.profile-invitado { background:linear-gradient(135deg,#64748b,#94a3b8); }

/* Cabecera de vista — título a la izquierda, icon-btns a la derecha */
.view-header {
  display:flex; align-items:flex-end; justify-content:space-between;
  gap:12px; margin:0 0 8px;
  flex-wrap:wrap;
  max-width:100%;
}
.view-header .view-title {
  margin:0; flex:1; min-width:0;
  word-break:break-word; overflow-wrap:break-word;
}
.view-header-actions {
  display:flex; align-items:center; gap:8px; flex-shrink:0;
}
.view-header-actions .icon-btn { width:40px; height:40px; }
.view-header-actions .icon-btn.icon-btn-primary {
  background:linear-gradient(135deg, var(--accent), var(--accent-2));
  border-color:transparent; color:#fff;
}
.view-header-actions .icon-btn.icon-btn-primary svg { stroke:#fff; }
.view-header-actions .icon-btn.has-active {
  background:var(--accent-bg);
  border-color:color-mix(in srgb, var(--accent) 40%, var(--line));
  color:var(--accent);
}

.view-readonly-line { margin:0 0 16px; display:flex; align-items:center; gap:6px; font-size:13px; color:var(--text-muted); }
.view-readonly-extra { font-size:13px; }

/* Dropdown de filtros (sustituye al sheet) — bloque inline tipo card */
.filters-dropdown {
  margin:8px 0 16px; padding:16px;
  background:var(--bg-elev); border:1px solid var(--line);
  border-radius:var(--r-md);
  box-shadow: var(--sh-1);
  animation: filtersDropdownIn .14s var(--ease);
  transform-origin: top right;
}
@keyframes filtersDropdownIn {
  from { opacity:0; transform: translateY(-4px); }
  to   { opacity:1; transform: translateY(0); }
}

/* Mini-resumen del filtro activo bajo la toolbar */
.view-filter-summary {
  display:inline-flex; align-items:center; gap:8px;
  margin:0 0 14px;
  font-size:13px; color:var(--text-muted);
  font-weight:500;
}
.view-filter-summary .dot { width:8px; height:8px; }
.view-filter-summary .view-filter-name { color:var(--text); font-weight:600; }
.view-filter-summary .view-filter-count {
  font-feature-settings:"tnum","ss01";
}

/* Sheet de filtros */
.filters-body { display:flex; flex-direction:column; gap:18px; }
.filters-section { display:flex; flex-direction:column; gap:8px; }
.filters-section-title {
  font-size:12px; font-weight:600; text-transform:uppercase;
  letter-spacing:.06em; color:var(--text-muted);
}
.filters-segmented { width:100%; }
.filters-segmented button { flex:1; }
.filters-status-list { display:flex; flex-direction:column; gap:6px; }
.filters-status-btn {
  display:flex; align-items:center; gap:10px;
  padding:12px 14px; border-radius:var(--r-md);
  background:var(--bg-elev); border:1px solid var(--line);
  cursor:pointer; text-align:left;
  font:inherit; color:var(--text); font-size:14.5px;
  transition:background .12s var(--ease), border-color .12s var(--ease);
}
.filters-status-btn:hover { background:var(--bg-soft); }
.filters-status-btn.active {
  border-color:color-mix(in srgb, var(--accent) 50%, var(--line));
  background:var(--accent-bg);
  font-weight:600;
}
.filters-status-btn .dot { width:10px; height:10px; flex-shrink:0; }
.filters-status-label { flex:1; }
.filters-status-count {
  font-feature-settings:"tnum","ss01";
  font-size:13px; color:var(--text-muted);
  background:var(--bg-soft); padding:1px 8px; border-radius:var(--r-pill);
  min-width:24px; text-align:center;
}
.filters-status-btn.active .filters-status-count {
  background:color-mix(in srgb, var(--accent) 18%, var(--bg-elev));
  color:var(--accent);
}

/* ========================================================================
   Listas — items con divisores ligeros
   ====================================================================== */
.list { display:flex; flex-direction:column; gap:8px; }
.list-item {
  background:var(--bg-elev); border:1px solid var(--line);
  border-radius:var(--r-md); padding:10px 12px;
  display:flex; align-items:center; gap:10px;
  transition:transform .18s var(--ease), box-shadow .18s var(--ease);
  min-height:0;
}
.list-item:hover { box-shadow:var(--sh-1); }
.list-item .li-main { flex:1; min-width:0; }
.list-item .li-title { font-weight:500; color:var(--text); font-size:14.5px; letter-spacing:-.005em; }
.list-item .li-sub { font-size:12.5px; color:var(--text-muted); margin-top:1px; line-height:1.35; }
.list-item .li-actions { display:flex; gap:4px; }
/* Cards de planning — estilo más "Apple": hairline tenue, esquinas más redondas,
   sombra suave y emoji en "squircle" sin borde duro. */
.timeline-item.list-item {
  padding:12px 13px 32px; gap:12px;
  min-height:84px; box-sizing:border-box;
  border:1px solid var(--line-soft);
  border-radius:18px;
  box-shadow:var(--sh-1);
}
.timeline-item.list-item:active { transform:scale(.99); }
.timeline-item.list-item .item-emoji { width:40px; height:40px; font-size:20px; border:none; border-radius:12px; box-shadow:0 1px 2px rgba(0,0,0,.05); }
.timeline-item.list-item .drag-handle { padding:2px; }
.timeline-item.list-item .icon-btn { width:28px; height:28px; }
.timeline-item.list-item .icon-btn svg { width:16px; height:16px; }
.timeline-item.list-item .li-actions .btn.btn-sm { height:28px; padding:0 9px; font-size:12px; }
/* Sub-texto en 1-2 líneas máximo con ellipsis para que no expanda la card */
.timeline-item.list-item .li-sub {
  overflow:hidden; text-overflow:ellipsis;
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;
}

/* ===========================================================================
   COLOR DE TARJETA POR TIPO (no por estado)
   ----------------------------------------------------------------------------
   Cada `planning_item` tiene un `type` y opcionalmente un `custom_color` HEX.
   El fondo de la tarjeta SIEMPRE refleja el tipo (o el override del usuario):
   el estado solo afecta al BORDE y la PILL.

   - Variables `--tipo-*` definen el HEX base por tipo.
   - El fondo de la card se calcula al ~12 % sobre `--bg-elev` (contraste WCAG).
   - Override manual: `it.custom_color` → `style.--card-color="#hex"` +
     clase `.has-custom-color`. Persistido en planning_items.custom_color.
   =========================================================================== */
:root {
  /* Todos los transportes (vuelo, transporte, coche) comparten el mismo azul oscuro. */
  --tipo-vuelo:      #1e40af;
  --tipo-transporte: #1e40af;
  --tipo-coche:      #1e40af;
  --tipo-comida:     #f97316;
  --tipo-actividad:  #a855f7;
  --tipo-hotel:      #15803d;
  --tipo-lugar:      #0ea5e9;
  --tipo-personas:   #0ea5e9; /* mismo cian que Lugar */
  --tipo-playa:      #2dd4bf; /* turquesa aqua vivo — distinto del cian de lugar */
  --tipo-compras:    #ec4899;
  --tipo-otro:       #64748b;
}

/* Fondo por tipo (se aplica a list-item / timeline-item). El ~12 % mezclado con
   bg-elev produce un tinte muy suave que mantiene contraste de texto. */
.list-item.type-vuelo,
.timeline-item.type-vuelo      { background: color-mix(in srgb, var(--tipo-vuelo)      12%, var(--bg-elev)); }
.list-item.type-transporte,
.timeline-item.type-transporte { background: color-mix(in srgb, var(--tipo-transporte) 12%, var(--bg-elev)); }
.list-item.type-coche,
.timeline-item.type-coche      { background: color-mix(in srgb, var(--tipo-coche)      12%, var(--bg-elev)); }
.list-item.type-comida,
.timeline-item.type-comida     { background: color-mix(in srgb, var(--tipo-comida)     10%, var(--bg-elev)); } /* un pelín menos para no acercarse al naranja del borde por_iniciar */
.list-item.type-actividad,
.timeline-item.type-actividad  { background: color-mix(in srgb, var(--tipo-actividad)  12%, var(--bg-elev)); }
.list-item.type-hotel,
.timeline-item.type-hotel      { background: color-mix(in srgb, var(--tipo-hotel)      12%, var(--bg-elev)); }
.list-item.type-lugar,
.timeline-item.type-lugar      { background: color-mix(in srgb, var(--tipo-lugar)      12%, var(--bg-elev)); }
.list-item.type-personas,
.timeline-item.type-personas   { background: color-mix(in srgb, var(--tipo-personas)   12%, var(--bg-elev)); }
.list-item.type-playa,
.timeline-item.type-playa      { background: color-mix(in srgb, var(--tipo-playa)      12%, var(--bg-elev)); }
.list-item.type-compras,
.timeline-item.type-compras    { background: color-mix(in srgb, var(--tipo-compras)    12%, var(--bg-elev)); }
.list-item.type-otro,
.timeline-item.type-otro       { background: color-mix(in srgb, var(--tipo-otro)       12%, var(--bg-elev)); }

/* El FONDO de la tarjeta refleja el TIPO (regla de arriba: lugar cian, alojamiento
   verde bosque, etc.). Si hay ESTADO real (por iniciar, en consulta, confirmado,
   cancelado) el color del estado tiñe por encima. `position:relative` para la
   esquina con la pill. */
.timeline-item.list-item { position:relative; }

/* Override manual: HEX libre del usuario. Inline style fija `--card-color`. */
.list-item.has-custom-color,
.timeline-item.has-custom-color {
  background: var(--bg-elev) !important;
}
.timeline-item.has-custom-color .item-emoji {
  background: color-mix(in srgb, var(--card-color) 24%, var(--bg-elev)) !important;
}

/* El ESTADO tiñe el fondo de la tarjeta:
   - por_iniciar y cancelado → fondo de color pleno.
   - en_consulta → tinte medio.
   - confirmado → tinte verde muy suave (la pill verde en la esquina basta).
   - sin estado → blanco (regla de arriba). */
.list-item.status-por_iniciar,
.timeline-item.status-por_iniciar {
  border-color: color-mix(in srgb, #f59e0b 45%, var(--line));
  background: color-mix(in srgb, #f59e0b 22%, var(--bg-elev));
  box-shadow: var(--sh-1);
}
.list-item.status-en_consulta,
.timeline-item.status-en_consulta {
  border-color: color-mix(in srgb, #3b82f6 45%, var(--line));
  background: color-mix(in srgb, #3b82f6 11%, var(--bg-elev));
  box-shadow: var(--sh-1);
}
.list-item.status-confirmado,
.timeline-item.status-confirmado {
  border-color: color-mix(in srgb, #10b981 35%, var(--line));
  background: color-mix(in srgb, #10b981 9%, var(--bg-elev));
  box-shadow: var(--sh-1);
}
.list-item.status-cancelado,
.timeline-item.status-cancelado {
  border-color: color-mix(in srgb, #ef4444 45%, var(--line));
  background: color-mix(in srgb, #ef4444 20%, var(--bg-elev));
  box-shadow: var(--sh-1);
}

.list-item.status-cancelado .li-title,
.timeline-item.status-cancelado .li-title { text-decoration:line-through; opacity:.75; }

/* Esquina inferior derecha: botón "Confirmar" (si aplica) + pill de estado.
   La reserva inferior (32px) ya está en TODAS las tarjetas (.list-item) para que
   tengan el mismo alto con o sin pill. */
.timeline-item .li-corner {
  position:absolute; right:13px; bottom:8px;
  display:flex; align-items:center; gap:8px;
}
.timeline-item .li-corner .status-badge { margin:0; }
.timeline-item .li-corner .li-confirm-btn { height:25px; padding:0 10px; font-size:12px; }

/* Confirmado: emoji en verde (la pill ya es verde). */
.timeline-item.status-confirmado .item-emoji {
  background: color-mix(in srgb, #10b981 24%, var(--bg-elev)) !important;
}
/* Transportes confirmados (vuelo, transporte, coche): la TARJETA conserva su
   color azul oscuro; el emoji y la pill van en verde para marcar la confirmación. */
.timeline-item.status-confirmado.type-transporte,
.timeline-item.status-confirmado.type-vuelo,
.timeline-item.status-confirmado.type-coche {
  background: color-mix(in srgb, var(--tipo-transporte) 12%, var(--bg-elev));
  border-color: color-mix(in srgb, var(--tipo-transporte) 35%, var(--line));
}
/* Alojamiento confirmado (incl. noches): la TARJETA conserva su verde bosque de tipo;
   el emoji y la pill van en verde de confirmación (como transportes y actividad). */
.timeline-item.status-confirmado.type-hotel {
  background: color-mix(in srgb, var(--tipo-hotel) 12%, var(--bg-elev));
  border-color: color-mix(in srgb, var(--tipo-hotel) 35%, var(--line));
}
/* Actividad confirmada: la TARJETA conserva su morado de tipo; el emoji y la pill
   van en verde para marcar la confirmación (como los transportes). */
.timeline-item.status-confirmado.type-actividad {
  background: color-mix(in srgb, var(--tipo-actividad) 12%, var(--bg-elev));
  border-color: color-mix(in srgb, var(--tipo-actividad) 35%, var(--line));
}

/* Items virtuales (noches de hotel + check-out) — más sutiles para que se note
   que son derivados del item base. */
.timeline-item.virtual { opacity:.92; }
.timeline-item.virtual .li-title { font-weight:500; }

/* Color del dot del timeline (círculo a la izquierda) según estado */
.timeline-item.status-por_iniciar::before { border-color:#f59e0b !important; }
.timeline-item.status-en_consulta::before { border-color:#3b82f6 !important; }
.timeline-item.status-confirmado::before  { border-color:#10b981 !important; }
.timeline-item.status-cancelado::before   { border-color:#ef4444 !important; }

/* ===== Rediseño planning: tarjeta neutra · color de TIPO en el chip · ESTADO en barra lateral ===== */
.timeline-item.list-item { background: var(--bg-elev); border-color: var(--line-soft); }
.timeline-item.type-vuelo .item-emoji,
.timeline-item.type-transporte .item-emoji,
.timeline-item.type-coche .item-emoji     { background: color-mix(in srgb, var(--tipo-transporte) 22%, var(--bg-elev)); }
.timeline-item.type-comida .item-emoji    { background: color-mix(in srgb, var(--tipo-comida) 22%, var(--bg-elev)); }
.timeline-item.type-actividad .item-emoji { background: color-mix(in srgb, var(--tipo-actividad) 22%, var(--bg-elev)); }
.timeline-item.type-hotel .item-emoji     { background: color-mix(in srgb, var(--tipo-hotel) 22%, var(--bg-elev)); }
.timeline-item.type-lugar .item-emoji,
.timeline-item.type-personas .item-emoji  { background: color-mix(in srgb, var(--tipo-lugar) 22%, var(--bg-elev)); }
.timeline-item.type-playa .item-emoji     { background: color-mix(in srgb, var(--tipo-playa) 24%, var(--bg-elev)); }
.timeline-item.type-compras .item-emoji   { background: color-mix(in srgb, var(--tipo-compras) 22%, var(--bg-elev)); }
.timeline-item.type-otro .item-emoji      { background: color-mix(in srgb, var(--tipo-otro) 20%, var(--bg-elev)); }
.timeline-item.status-por_iniciar { box-shadow: inset 3px 0 0 #f59e0b, var(--sh-1); }
.timeline-item.status-en_consulta { box-shadow: inset 3px 0 0 #3b82f6, var(--sh-1); }
.timeline-item.status-confirmado  { box-shadow: inset 3px 0 0 #10b981, var(--sh-1); }
.timeline-item.status-cancelado   { box-shadow: inset 3px 0 0 #ef4444, var(--sh-1); opacity:.78; }
.timeline-item.has-custom-color   { box-shadow: inset 4px 0 0 var(--card-color), var(--sh-1); }
.timeline-item.is-next { flex-wrap:wrap; background: var(--accent-bg) !important; box-shadow: inset 4px 0 0 var(--accent), var(--sh-1) !important; border-color: color-mix(in srgb, var(--accent) 35%, var(--line)); }
.timeline-item.is-next .item-emoji { background: color-mix(in srgb, var(--accent) 20%, var(--bg-elev)) !important; }
.card-next { flex-basis:100%; width:100%; display:flex; align-items:center; gap:10px; margin-top:8px; padding-top:8px; border-top:1px solid color-mix(in srgb, var(--accent) 22%, transparent); }
.card-next-tag { font-size:11px; font-weight:800; text-transform:uppercase; letter-spacing:.06em; color:var(--accent); }
.card-next .ne-count { font-size:13px; font-weight:700; color:var(--accent); background:var(--bg-elev); border:1px solid color-mix(in srgb,var(--accent) 30%,transparent); border-radius:999px; padding:2px 10px; white-space:nowrap; font-feature-settings:"tnum","ss01"; }
.card-next .ne-bell { margin-left:auto; }
.card-next .ne-bell { width:30px; height:30px; flex-shrink:0; border:1px solid var(--line); border-radius:50%; background:var(--bg-elev); display:flex; align-items:center; justify-content:center; cursor:pointer; }
.card-next .ne-bell svg { width:16px; height:16px; }
.timeline-item.status-confirmado.type-transporte,
.timeline-item.status-confirmado.type-vuelo,
.timeline-item.status-confirmado.type-coche,
.timeline-item.status-confirmado.type-hotel,
.timeline-item.status-confirmado.type-actividad { background: var(--bg-elev); border-color: var(--line-soft); }
.timeline-item.list-item .li-title { font-size:15px; }
.timeline-item.list-item .li-sub-text { color: var(--text-muted); }
.plan-part { font-size:11.5px; font-weight:700; text-transform:uppercase; letter-spacing:.08em; color:var(--text-muted); margin:10px 0 2px 4px; }
/* Tarjeta más compacta + hora en columna a la izquierda */
.timeline-item.list-item { padding:10px 12px; min-height:0; gap:10px; }
.timeline-item .drag-handle { display:none; }
.timeline-item .li-corner { position:static; right:auto; bottom:auto; margin-top:6px; }
.timeline-item .li-time { flex-shrink:0; min-width:40px; display:flex; flex-direction:column; align-items:flex-end; justify-content:center; line-height:1.12; }
.timeline-item .li-time-a { font-family:var(--font-ui); font-feature-settings:"tnum","ss01"; font-size:13px; font-weight:600; color:var(--text); }
.timeline-item .li-time-b { font-family:var(--font-ui); font-feature-settings:"tnum"; font-size:11px; color:var(--text-muted); }
/* Meta del día (paradas · clima/ropa · alojamiento) + "Hoy" + acento del día actual */
.day-meta-row { display:flex; flex-wrap:wrap; align-items:center; gap:8px; margin:2px 0 10px; font-size:13px; }
.day-meta-stops { color:var(--text-muted); font-weight:500; }
.day-meta-row .wx-chip { display:inline-block; background:var(--bg-soft); border:1px solid var(--line); padding:3px 10px; border-radius:var(--r-pill); }
.day-meta-row .day-title-pill { font-size:12px; padding:3px 10px; max-width:60%; }
/* Al plegar el día: la sugerencia de ropa ("fresco") y el chip de hotel se ocultan;
   quedan solo paradas · temperatura · pill del día. Vuelven al desplegar. */
.day-group.collapsed .wx-ropa { display:none; }
.day-group.collapsed .day-hotel-chip { display:none; }
.day-hotel-chip { display:inline-flex; align-items:center; gap:4px; background:color-mix(in srgb, var(--tipo-hotel) 14%, var(--bg-elev)); color:var(--text); border:1px solid color-mix(in srgb, var(--tipo-hotel) 30%, var(--line)); padding:3px 10px; border-radius:var(--r-pill); text-decoration:none; font-weight:500; }
a.day-hotel-chip:hover { border-color: var(--tipo-hotel); }
.day-today-badge { font-size:11px; font-weight:700; color:var(--text-inv); background:var(--accent); border-radius:var(--r-pill); padding:2px 9px; letter-spacing:.02em; }
.day-group.day-today .day-date, .day-group.day-today .day-num { color:var(--accent); }
/* (Se retiró el "hilo" vertical con puntos azules entre eventos: confundía y se
   solapaba con la hora. La secuencia ya se ve por las horas y los tramos de ruta.) */
/* Marcador "ahora" (día de hoy) */
.now-line { display:flex; align-items:center; gap:8px; margin:3px 0; }
.now-line::after { content:''; flex:1; height:2px; background:var(--danger); border-radius:2px; opacity:.5; }
.now-dot { width:8px; height:8px; border-radius:50%; background:var(--danger); flex-shrink:0; }
.now-label { font-size:11.5px; font-weight:700; color:var(--danger); font-feature-settings:"tnum"; text-transform:uppercase; letter-spacing:.04em; }
/* Hueco libre entre paradas */
.gap-chip { font-size:12px; color:var(--text-muted); font-style:italic; margin:1px 0 1px 52px; }

/* Badge del estado al lado del título */
.status-badge {
  display:inline-flex; align-items:center; gap:4px;
  font-family:var(--font-ui);
  font-size:10.5px; font-weight:600;
  letter-spacing:.012em;
  padding:3px 10px; border-radius:var(--r-pill);
  margin-left:8px; flex-shrink:0;
  line-height:1.3;
}
.status-badge.s-por_iniciar { background:color-mix(in srgb, #f59e0b 22%, var(--bg-elev)); color:#b45309; border:1px solid color-mix(in srgb, #f59e0b 50%, transparent); }
.status-badge.s-en_consulta { background:color-mix(in srgb, #3b82f6 22%, var(--bg-elev)); color:#1e40af; border:1px solid color-mix(in srgb, #3b82f6 50%, transparent); }
.status-badge.s-confirmado  { background:color-mix(in srgb, #10b981 28%, var(--bg-elev)); color:#065f46; border:1px solid #059669; font-weight:700; }
.status-badge.s-cancelado   { background:color-mix(in srgb, #ef4444 22%, var(--bg-elev)); color:#b91c1c; border:1px solid color-mix(in srgb, #ef4444 50%, transparent); }
:root[data-tema="oscuro"] .status-badge.s-por_iniciar { color:#fbbf24; }
:root[data-tema="oscuro"] .status-badge.s-en_consulta { color:#93c5fd; }
:root[data-tema="oscuro"] .status-badge.s-confirmado  { color:#6ee7b7; }
:root[data-tema="oscuro"] .status-badge.s-cancelado   { color:#fca5a5; }

/* Bloque de campos de "consulta" (URL, precio, fechas previstas) en el editor */
.consulta-fields {
  margin-top:14px; padding:14px;
  background:color-mix(in srgb, var(--accent) 6%, var(--bg-soft));
  border:1px solid color-mix(in srgb, var(--accent) 30%, var(--line));
  border-radius:var(--r-md);
}
.consulta-fields > h4 {
  margin:0 0 10px; font-size:13px; font-weight:600;
  color:var(--accent); letter-spacing:-.005em;
}

/* Importador local: bloque plegable para pegar una reserva y autocompletar */
.paste-import {
  border:1px solid var(--line); border-radius:var(--r-md);
  background:var(--bg-soft); padding:10px 12px; margin-bottom:16px;
}
.paste-import > summary {
  cursor:pointer; font-weight:600; font-size:13.5px; color:var(--accent);
  display:flex; align-items:center; gap:7px; list-style:none;
}
.paste-import > summary::-webkit-details-marker { display:none; }
.paste-import > summary svg { width:16px; height:16px; }
.paste-import textarea { width:100%; min-height:90px; resize:vertical; margin-top:4px; }

/* Sub-etiquetas pequeñas (celdas internas de fecha/hora del editor) */
.sub-lbl { font-size:12px; color:var(--text-muted); font-weight:500; }
#dates-block > label { display:block; margin-bottom:6px; }
#dates-block .form-grid-2 + .form-grid-2,
#dates-block .form-grid-2 + .form-row,
#dates-block .form-row + .form-row { margin-top:8px; }
/* Alinear fecha/hora (Salida–Hora, Llegada–Hora) por la base del input. */
#dates-block .form-grid-2 { align-items:end; }
#dates-block .form-grid-2 .form-row { margin:0; }

/* Personas: chips toggleables en el editor + tarjetas en la pestaña Personas */
.people-chips { display:flex; flex-wrap:wrap; gap:8px; margin:8px 0; }
.person-chip {
  display:inline-flex; align-items:center; gap:6px; cursor:pointer;
  padding:6px 12px; border-radius:var(--r-pill);
  border:1.5px solid var(--line); background:var(--bg-elev);
  font-size:13px; font-weight:600; color:var(--text); font-family:inherit;
  transition:all .15s var(--ease);
}
.person-chip .tic { display:inline-flex; width:0; overflow:hidden; transition:width .15s var(--ease); }
.person-chip .tic svg { width:14px; height:14px; }
.person-chip.active { border-color:var(--accent); background:color-mix(in srgb, var(--accent) 12%, var(--bg-elev)); color:var(--accent); }
.person-chip.active .tic { width:14px; }
.people-add { display:flex; gap:8px; align-items:center; }
.people-add input { flex:1; }
/* Desplegable de selección múltiple de personas (tipo "Personas") */
.people-dropdown { margin:8px 0; border:1px solid var(--line); border-radius:var(--r-md); background:var(--bg-elev); }
.people-dropdown > summary {
  list-style:none; cursor:pointer; padding:11px 13px;
  font-size:14px; font-weight:600; color:var(--text);
  display:flex; align-items:center; justify-content:space-between;
}
.people-dropdown > summary::-webkit-details-marker { display:none; }
.people-dropdown > summary::after {
  content:''; width:8px; height:8px; border-right:2px solid var(--text-muted);
  border-bottom:2px solid var(--text-muted); transform:rotate(45deg);
  transition:transform .2s var(--ease); margin-left:8px;
}
.people-dropdown[open] > summary::after { transform:rotate(-135deg); }
.people-dropdown > div { padding:0 13px 12px; }
.people-dropdown .people-chips { margin:0; }

.person-card { background:var(--bg-elev); border:1px solid var(--line); border-radius:var(--r-md); padding:14px; margin-bottom:14px; }
.person-card-head { display:flex; align-items:center; gap:10px; margin-bottom:10px; }
.person-avatar {
  width:34px; height:34px; border-radius:50%; flex-shrink:0;
  display:flex; align-items:center; justify-content:center;
  background:linear-gradient(135deg, var(--accent), var(--accent-2, var(--accent)));
  color:#fff; font-weight:700; font-size:15px;
}
.person-name { font-weight:700; font-size:15px; flex:1; min-width:0; }
.person-count {
  font-size:12px; font-weight:600; color:var(--accent); flex-shrink:0;
  background:color-mix(in srgb, var(--accent) 12%, var(--bg-elev));
  padding:3px 10px; border-radius:var(--r-pill);
}

/* Pendientes */
.pending-list { gap:8px; }
.pending-item {
  display:flex; align-items:center; gap:10px;
  background:var(--bg-elev); border:1px solid var(--line);
  border-radius:var(--r-md); padding:10px 12px;
}
.pending-item.auto { cursor:pointer; }
.pending-item.done .pending-text { text-decoration:line-through; color:var(--text-muted); }
.pending-check {
  flex-shrink:0; width:24px; height:24px; border-radius:7px; cursor:pointer;
  border:2px solid var(--line); background:var(--bg-elev);
  display:inline-flex; align-items:center; justify-content:center; color:#fff;
}
.pending-check.on { background:var(--status-curso); border-color:var(--status-curso); }
.pending-check svg { width:14px; height:14px; }
.pending-main { flex:1; min-width:0; }
.pending-text { font-weight:600; font-size:14px; word-break:break-word; }
.pending-sub { font-size:12px; color:var(--text-muted); margin-top:2px; }
.pending-divider { font-size:12px; font-weight:600; color:var(--text-muted); text-transform:uppercase; letter-spacing:.05em; margin:18px 0 8px; }
.pending-auto-list { margin-bottom:26px; }
/* Texto un poco más grande en las pastillas de pendientes (manual y del planning). */
.pack-item.pending-item .pack-name { font-size:16px; }
.pending-item .pending-text { font-size:15px; }
/* Pendientes — modo checklist (reutiliza estilos .pack-*) */
.pending-warn { flex-shrink:0; font-size:15px; line-height:1; }
.pending-date-sub { font-size:12px; color:var(--text-muted); margin-top:2px; }
.pack-item.overdue { border-color: color-mix(in srgb, #f59e0b 50%, var(--line)); background: color-mix(in srgb, #f59e0b 6%, var(--bg-elev)); }
.pack-item.pending-removing { animation: pendOut .26s var(--ease) forwards; pointer-events:none; }
@keyframes pendOut { to { opacity:0; transform:translateX(44px) scale(.95); } }
.pending-done-section { margin-top:20px; border-top:1px solid var(--line-soft); padding-top:8px; }
.pending-done-toggle {
  display:flex; align-items:center; gap:8px; width:100%; cursor:pointer;
  background:none; border:none; padding:8px 2px; color:var(--text-muted);
  font-weight:600; font-size:14px; font-family:var(--font-ui); text-align:left;
}
.pending-done-toggle .pack-group-chevron { transform:rotate(-90deg); transition:transform .2s var(--ease); }
.pending-done-section.open .pending-done-toggle .pack-group-chevron { transform:rotate(0); }
.pending-done-section .pack-list { margin-top:8px; gap:6px; }

/* Estadísticas — valor a la derecha de cada fila */
.stat-val { flex-shrink:0; font-weight:700; font-size:14px; color:var(--accent); font-feature-settings:"tnum"; white-space:nowrap; }

/* Recordatorio de gasto pendiente */
.expense-remind-btn {
  display:inline-flex; align-items:center; gap:5px; cursor:pointer;
  padding:5px 10px; border-radius:var(--r-pill); font-size:12px; font-weight:600;
  border:1.5px solid var(--line); background:var(--bg-elev); color:var(--text-muted); font-family:inherit;
  transition:all .15s var(--ease);
}
.expense-remind-btn.on { border-color:#f59e0b; background:color-mix(in srgb, #f59e0b 14%, var(--bg-elev)); color:#b45309; }
.expense-warn {
  margin-top:12px; padding:12px 14px; border-radius:var(--r-md);
  background:color-mix(in srgb, #f59e0b 12%, var(--bg-elev));
  border:1px solid color-mix(in srgb, #f59e0b 45%, var(--line));
}
.expense-warn-msg { display:flex; align-items:center; gap:8px; font-weight:600; font-size:13.5px; margin-bottom:10px; }
.expense-warn-actions { display:flex; flex-wrap:wrap; gap:8px; }
.expense-warn-flag { font-size:13px; line-height:1; }

/* Días plegables en el planning */
.day-head { align-items:flex-start; }
.plan-collapse-bar { display:flex; justify-content:flex-end; gap:8px; margin-bottom:12px; }

/* ===== Vista "tarjetas" del planning: pantalla completa, un día por tarjeta ===== */
.flashview {
  position:fixed; inset:0; z-index:80; background:var(--bg);
  display:flex; flex-direction:column;
  animation:flash-in .2s var(--ease);
}
@keyframes flash-in { from { opacity:0; } to { opacity:1; } }
.flash-top {
  flex-shrink:0; display:flex; align-items:center; gap:12px;
  padding:14px 16px; padding-top:max(14px, env(safe-area-inset-top));
  border-bottom:1px solid var(--line-soft);
}
.flash-title { font-weight:700; font-size:15px; letter-spacing:-.01em; color:var(--text); flex:1; min-width:0;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.flash-counter { font-weight:700; font-size:14px; color:var(--text-muted); font-feature-settings:"tnum","ss01"; }
.flash-close {
  flex-shrink:0; width:38px; height:38px; border-radius:50%;
  border:1px solid var(--line); background:var(--bg-elev); color:var(--text);
  display:inline-flex; align-items:center; justify-content:center; cursor:pointer;
}
.flash-close svg { width:18px; height:18px; }
.flash-track {
  flex:1; display:flex; overflow-x:auto; overflow-y:hidden;
  scroll-snap-type:x mandatory; -webkit-overflow-scrolling:touch; scrollbar-width:none;
}
.flash-track::-webkit-scrollbar { display:none; }
.flash-card {
  flex:0 0 100%; width:100%; box-sizing:border-box;
  scroll-snap-align:center; scroll-snap-stop:always;
  display:flex; flex-direction:column; align-items:center; overflow:hidden; padding:0 16px;
}
/* La columna de contenido se centra y no se estira en pantallas anchas (escritorio). */
.flash-date, .flash-body { width:100%; max-width:620px; }
.flash-date { flex-shrink:0; padding:14px 4px 18px; }
.flash-daynum { font-size:12px; font-weight:700; color:var(--text-muted); text-transform:uppercase; letter-spacing:.04em; margin-bottom:2px; }
.flash-wx { margin-top:10px; font-size:14px; color:var(--text-muted); font-weight:500; }
.flash-wx:empty { display:none; }
.flash-date-main { font-family:var(--font-titulo); font-weight:700; font-size:30px; line-height:1.06; letter-spacing:-.03em; color:var(--text); }
.flash-date-main .flash-wd { display:block; }
.flash-date-main .flash-wd::first-letter { text-transform:uppercase; }
.flash-date-main .flash-dm::first-letter { text-transform:uppercase; }
.flash-note-title { margin-top:8px; font-size:14px; font-weight:600; color:var(--accent); }
.flash-body { flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; display:flex; flex-direction:column; gap:8px; padding-bottom:28px; }
.flash-body .drag-handle { display:none; }
.flash-empty { margin:auto; text-align:center; color:var(--text-muted); display:flex; flex-direction:column; align-items:center; gap:10px; }
.flash-empty-emoji { font-size:40px; opacity:.7; }
.flash-fab {
  position:absolute; right:20px; bottom:calc(20px + env(safe-area-inset-bottom));
  width:56px; height:56px; border-radius:50%; border:none; cursor:pointer;
  background:linear-gradient(135deg, var(--accent), var(--accent-2)); color:#fff;
  box-shadow:var(--sh-3); display:inline-flex; align-items:center; justify-content:center;
}
.flash-fab svg { width:26px; height:26px; }
.flash-fab:active { transform:scale(.95); }

/* ===== Vista Calendario (clases con prefijo tcal- para no chocar con el datepicker) ===== */
.calview { position:fixed; inset:0; z-index:80; background:var(--bg); display:flex; flex-direction:column; animation:flash-in .2s var(--ease); }
.tcal-scroll { flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:0 14px calc(28px + env(safe-area-inset-bottom)); }
.tcal-inner { max-width:560px; margin:0 auto; }
.tcal-monthbar { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:16px 2px 12px; }
.tcal-month { font-family:var(--font-titulo); font-weight:700; font-size:22px; letter-spacing:-.02em; color:var(--text); }
.tcal-nav { width:38px; height:38px; border-radius:50%; border:1px solid var(--line); background:var(--bg-elev); color:var(--text); display:inline-flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0; }
.tcal-nav:active { background:var(--bg-soft); }
.tcal-nav svg { width:17px; height:17px; }
.tcal-nav.next svg { transform:scaleX(-1); }
.tcal-weekdays { display:grid; grid-template-columns:repeat(7,1fr); gap:4px; margin-bottom:6px; }
.tcal-wd { text-align:center; font-size:11px; font-weight:700; color:var(--text-muted); text-transform:uppercase; letter-spacing:.03em; padding:4px 0; }
.tcal-grid { display:grid; grid-template-columns:repeat(7, minmax(0, 1fr)); gap:5px; }
.tcal-cell { min-width:0; min-height:54px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; background:none; border:none; padding:0 0 8px; position:relative; font-family:inherit; }
.tcal-cell.clickable { cursor:pointer; }
.tcal-cell.clickable:active .tcal-ring { transform:scale(.92); }
.tcal-num-plain { font-size:13px; font-weight:600; line-height:1; color:var(--text); font-feature-settings:"tnum"; }
.tcal-cell.out .tcal-num-plain { opacity:.32; }
/* Anillo con conic-gradient: capa exterior (gradiente) + círculo interior encima. */
.tcal-ring {
  position:relative; box-sizing:border-box;
  width:min(44px, 100%); aspect-ratio:1; border-radius:50%;
  display:grid; place-items:center; background:var(--ring, #fff);
  transition:transform .12s var(--ease);
}
.tcal-cell:not(.has-ring) .tcal-ring { border:1px solid var(--line); }
.tcal-ring::before {
  content:''; position:absolute; inset:var(--ring-w, 4.5px); border-radius:50%;
  background:var(--cell-bg, #fff);
}
.tcal-num { position:relative; z-index:1; font-size:13px; font-weight:600; line-height:1; color:#1f2937; font-feature-settings:"tnum"; }
/* Día de hoy: punto sutil, posicionado absoluto al pie de la celda para NO descentrar
   el anillo (todos los anillos quedan centrados igual, haya o no punto). */
.tcal-today-dot { position:absolute; left:50%; bottom:1px; transform:translateX(-50%); width:5px; height:5px; border-radius:50%; background:var(--accent); }
/* Días ya pasados: anillo en pastel (fijado en JS) y número en gris — el gris del
   número no lo tiene ningún día activo, así el estado "pasado" es inequívoco. */
.tcal-cell.past .tcal-num { color:#94a3b8; }
/* Leyenda (clicable: activa/desactiva colores). */
.tcal-legend { display:flex; flex-wrap:wrap; gap:6px; margin-top:18px; padding:8px; border:1px solid var(--line-soft); border-radius:var(--r-lg); background:var(--bg-elev); }
.tcal-legend-item { display:inline-flex; align-items:center; gap:7px; font-size:12.5px; color:var(--text);
  background:none; border:none; padding:6px 10px; border-radius:var(--r-pill); cursor:pointer; transition:opacity .15s var(--ease), background .15s var(--ease); font-family:inherit; }
.tcal-legend-item:active { background:var(--bg-soft); }
.tcal-legend-item.off { opacity:.4; }
.tcal-legend-item.off .tcal-legend-dot, .tcal-legend-item.off .tcal-legend-accom { filter:grayscale(1); }
.tcal-legend-item.off span:last-child { text-decoration:line-through; }
.tcal-legend-dot { width:13px; height:13px; border-radius:50%; flex-shrink:0; }
.tcal-legend-accom { width:15px; height:15px; border-radius:50%; background:#D4EDDA; border:1px solid color-mix(in srgb,#1e7e34 35%, transparent); flex-shrink:0; }
/* Sub-leyenda del fondo (estado del alojamiento) */
.tcal-accom-legend { display:flex; flex-wrap:wrap; align-items:center; gap:6px 12px; margin-top:10px; padding:0 4px; font-size:11.5px; color:var(--text-muted); }
.tcal-accom-legend-label { font-weight:700; }
.tcal-accom-legend-item { display:inline-flex; align-items:center; gap:5px; }
.tcal-accom-sw { width:13px; height:13px; border-radius:50%; flex-shrink:0; border:1px solid rgba(0,0,0,.14); }
:root[data-tema="oscuro"] .tcal-accom-sw { border-color:rgba(255,255,255,.22); }
/* Desplegable de la leyenda (plegada por defecto) */
.tcal-legend-box { margin-top:18px; }
.tcal-legend-toggle { display:inline-flex; align-items:center; gap:7px; padding:8px 14px; border:1px solid var(--line);
  border-radius:var(--r-pill); background:var(--bg-elev); color:var(--text); font-size:13px; font-weight:600; cursor:pointer; font-family:inherit; }
.tcal-legend-toggle:active { background:var(--bg-soft); }
.tcal-legend-chev { display:inline-flex; transition:transform .2s var(--ease); }
.tcal-legend-chev svg { width:16px; height:16px; }
.tcal-legend-toggle.open .tcal-legend-chev { transform:rotate(180deg); }
.tcal-legend-wrap { margin-top:10px; }
.tcal-legend-wrap .tcal-legend { margin-top:0; }
/* ===== Calendario global de todos los viajes ===== */
.gcal-grid { gap:4px; }
.gcal-cell { min-width:0; min-height:46px; display:flex; align-items:center; justify-content:center; position:relative;
  background:none; border:none; padding:0; font-family:inherit; border-radius:var(--r-md); }
.gcal-cell.has-trip { cursor:pointer; background:color-mix(in srgb, var(--trip-col) 20%, var(--bg-elev)); }
.gcal-cell.has-trip:active { background:color-mix(in srgb, var(--trip-col) 34%, var(--bg-elev)); }
.gcal-cell.has-trip .gcal-num { color:color-mix(in srgb, var(--trip-col) 72%, var(--text)); font-weight:700; }
.gcal-cell.has-trip::after { content:''; position:absolute; left:7px; right:7px; bottom:5px; height:3px; border-radius:2px; background:var(--trip-col); }
.gcal-cell.multi::before { content:''; position:absolute; top:5px; left:6px; width:5px; height:5px; border-radius:50%; background:var(--trip-col); box-shadow:0 0 0 1.5px var(--bg-elev); }
.gcal-num { font-size:13px; font-weight:600; line-height:1; color:var(--text); font-feature-settings:"tnum"; }
.gcal-cell.out .gcal-num { opacity:.3; }
.gcal-cell.today { outline:2px solid color-mix(in srgb, var(--accent) 60%, transparent); outline-offset:-2px; }
/* Puntito de estado (confirmación) del viaje */
.gcal-status-dot { width:7px; height:7px; border-radius:50%; flex-shrink:0; box-sizing:border-box; background:var(--text-muted); }
.gcal-status-dot.prep { background:transparent; border:1.5px solid color-mix(in srgb, var(--text-muted) 85%, transparent); }
.gcal-cell .gcal-status-dot { position:absolute; top:4px; right:5px; width:6px; height:6px; box-shadow:0 0 0 1.5px var(--bg-elev); }
.gcal-cell .gcal-status-dot.prep { box-shadow:none; }
/* Leyenda de viajes */
.gcal-legend { display:flex; flex-direction:column; gap:2px; margin-top:10px; }
.gcal-legend-item { display:flex; align-items:center; gap:9px; width:100%; text-align:left; background:none; border:none;
  padding:9px 8px; border-radius:var(--r-md); cursor:pointer; font-family:inherit; color:var(--text); }
.gcal-legend-item:active { background:var(--bg-soft); }
.gcal-legend-dot { width:13px; height:13px; border-radius:50%; flex-shrink:0; }
.gcal-legend-main { flex:1; min-width:0; display:flex; flex-direction:column; gap:2px; }
.gcal-legend-name { font-size:13.5px; font-weight:600; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.gcal-legend-state { display:inline-flex; align-items:center; gap:5px; font-size:11.5px; color:var(--text-muted); }
.gcal-legend-dates { font-size:12px; color:var(--text-muted); flex-shrink:0; font-feature-settings:"tnum"; align-self:flex-start; }
.tcal-hint { margin-top:12px; text-align:center; font-size:12px; color:var(--text-muted); }
/* Opción "crear evento" en el editor de gasto */
.fb-makeevt { display:flex; align-items:center; gap:10px; margin-top:8px; padding:11px 13px;
  border:1px solid var(--line-soft); border-radius:var(--r-md); background:var(--bg-soft); cursor:pointer; font-size:13.5px; color:var(--text); }
.fb-makeevt input { width:18px; height:18px; flex-shrink:0; accent-color:var(--accent); }

/* Indicador del gesto "volver" (deslizar desde el borde izquierdo). */
#edge-back-ind {
  position:fixed; left:8px; top:50%; transform:translateY(-50%);
  width:42px; height:42px; border-radius:50%;
  background:var(--bg-elev); box-shadow:var(--sh-2); color:var(--accent);
  display:flex; align-items:center; justify-content:center;
  opacity:0; pointer-events:none; z-index:120; transition:opacity .12s var(--ease);
}
#edge-back-ind svg { width:22px; height:22px; }

/* Configurar pestañas del menú del viaje (mostrar/ocultar + reordenar). */
.tabs-config { display:flex; flex-direction:column; gap:6px; }
.tab-config-row { display:flex; align-items:center; gap:6px; padding:5px 8px; border:1px solid var(--line); border-radius:var(--r-md); background:var(--bg-elev); }
.tab-config-row.off { opacity:.5; }
.tab-config-label { flex:1; min-width:0; font-weight:600; font-size:14.5px; }
.tab-config-row .tab-vis { color:var(--text-muted); }
.tab-config-row .tab-vis.on { color:var(--accent); }
.day-head-main { display:flex; flex-wrap:wrap; align-items:center; gap:10px; flex:1; min-width:0; cursor:pointer; user-select:none; -webkit-user-select:none; -webkit-touch-callout:none; }
/* Clima + pill del día: a la derecha de la fecha (misma línea si cabe; si no, saltan). */
.day-head-wx { display:flex; flex-wrap:wrap; align-items:center; gap:8px; margin-left:auto; }
.day-head-wx .day-title-pill { font-size:12px; padding:3px 10px; max-width:100%; }
.day-meta-row:empty { display:none; }
.day-group.collapsed .day-meta-row:not(:has(.day-meta-stops)) { display:none; }
.day-collapse { display:inline-flex; flex-shrink:0; color:var(--text-muted); transition:transform .2s var(--ease); }
.day-collapse svg { width:18px; height:18px; }
.day-group.collapsed .day-collapse { transform:rotate(-90deg); }
.day-group.collapsed .timeline-list,
.day-group.collapsed .day-note-card { display:none; }

/* Viaje en curso: días pasados ocultos hasta pulsar "Ver días anteriores". */
.day-group.day-past { display:none; }
.show-past .day-group.day-past { display:block; }
.past-days-bar { display:flex; justify-content:center; margin:0 0 18px; }
.past-days-bar .show-past-btn { color:var(--text-muted); }
.past-days-bar .show-past-btn svg { width:15px; height:15px; }

/* Maleta — sub-pestañas de persona + lista compacta */
/* Cabecera de la maleta: progreso a la izquierda, controles a la derecha */
.pack-header {
  display:flex; align-items:center; gap:14px; flex-wrap:wrap; margin-bottom:18px;
}
.pack-progress { flex:1 1 150px; min-width:140px; display:flex; flex-direction:column; gap:6px; }
.pack-progress .budget-legend { font-size:12px; }
.pack-controls { display:flex; align-items:center; gap:8px; margin-left:auto; flex-shrink:0; }
.pack-collapse-all svg { transition:transform .2s var(--ease); }
.pack-collapse-all.all-collapsed svg { transform:rotate(-90deg); }
.pack-templates { display:flex; flex-wrap:wrap; gap:10px; margin-top:24px; }

.pack-list { display:flex; flex-direction:column; gap:6px; margin-bottom:8px; }
.pack-item {
  display:flex; align-items:center; gap:10px;
  background:var(--bg-elev); border:1px solid var(--line);
  border-radius:var(--r-sm); padding:7px 11px;
  transition:opacity .15s var(--ease);
}
.pack-item.done { opacity:.5; }
.pack-item.done .pack-name { text-decoration:line-through; color:var(--text-muted); }
/* Destello verde al marcar (se ve un instante antes de deslizar). */
.pack-item.just-checked { animation: packFlash .5s var(--ease); }
@keyframes packFlash {
  0%   { background: color-mix(in srgb, var(--status-curso) 38%, var(--bg-elev)); opacity:1; }
  55%  { background: color-mix(in srgb, var(--status-curso) 22%, var(--bg-elev)); opacity:1; }
  100% { background: var(--bg-elev); opacity:.5; }
}
.pack-check {
  flex-shrink:0; width:22px; height:22px; border-radius:6px; cursor:pointer; padding:0;
  border:2px solid var(--line); background:var(--bg-elev); color:#fff;
  display:inline-flex; align-items:center; justify-content:center;
  transition:background .12s var(--ease), border-color .12s var(--ease);
}
.pack-check.on { background:var(--status-curso); border-color:var(--status-curso); }
.pack-check svg { width:14px; height:14px; }
.pack-name { flex:1; min-width:0; font-size:15px; cursor:pointer; word-break:break-word; }
.pack-del { width:28px; height:28px; flex-shrink:0; }
.pack-del svg { width:15px; height:15px; }
/* Arrastrar (long-press en táctil): la pill se "levanta". */
.pack-item.dragging {
  opacity:.95; transform:scale(1.03); position:relative; z-index:5;
  box-shadow:0 8px 22px rgba(0,0,0,.18); border-color:var(--accent);
}
body.pack-dragging { user-select:none; -webkit-user-select:none; }
.pack-item.drag-over-top { box-shadow:inset 0 2px 0 var(--accent); }
.pack-item.drag-over-bot { box-shadow:inset 0 -2px 0 var(--accent); }

/* Selector de orden (Manual / A-Z) en la maleta */
.packing-sort button { padding:0 12px; font-size:12.5px; }

/* Grupos plegables de la maleta */
.pack-group { margin-bottom:14px; border-radius:var(--r-md); }
.pack-group.pack-cat-target { outline:2px dashed color-mix(in srgb, var(--accent) 60%, transparent); outline-offset:3px; }
.pack-group-head {
  display:flex; align-items:center; gap:8px; cursor:pointer;
  padding:6px 4px; margin-bottom:6px;
}
.pack-group-chevron { display:inline-flex; flex-shrink:0; color:var(--text-muted); transition:transform .2s var(--ease); }
.pack-group-chevron svg { width:18px; height:18px; }
.pack-group.collapsed .pack-group-chevron { transform:rotate(-90deg); }
.pack-group.collapsed .pack-list { display:none; }
.pack-group-title { font-weight:700; font-size:15px; letter-spacing:-.01em; }
/* Pill de color en el título: degradado continuo rojo→ámbar→verde según el % completado.
   El tono (--pill-h) lo fija JS (0 = rojo … 120 = verde); el CSS adapta la luminosidad al tema. */
.pack-pill {
  --pill-s:80%; --pill-l:40%;   /* tema claro */
  --pill-c:hsl(var(--pill-h, 0) var(--pill-s) var(--pill-l));
  display:inline-flex; align-items:center; padding:3px 12px;
  border-radius:var(--r-pill);
  background:color-mix(in srgb, var(--pill-c) 15%, var(--bg-elev));
  color:var(--pill-c);
  border:1px solid color-mix(in srgb, var(--pill-c) 40%, transparent);
  transition:background .25s var(--ease), color .25s var(--ease), border-color .25s var(--ease);
}
/* Grupo vacío (sin elementos): neutro. */
.pack-pill-empty { --pill-c:var(--text-muted); background:var(--bg-soft); border-color:var(--line); }
:root[data-tema="oscuro"] .pack-pill { --pill-s:78%; --pill-l:62%; }
@media (prefers-color-scheme: dark) { :root:not([data-tema]) .pack-pill { --pill-s:78%; --pill-l:62%; } }
.pack-group-count {
  font-size:12px; font-weight:600; color:var(--text-muted);
  background:var(--bg-soft); border:1px solid var(--line);
  padding:1px 8px; border-radius:var(--r-pill);
}
.pack-group-act { width:28px; height:28px; }
.pack-group-act svg { width:15px; height:15px; }
.pack-group-act:disabled { opacity:.3; cursor:default; pointer-events:none; }
/* Toggle de modo edición activo */
.icon-btn.edit-on { background:var(--accent); border-color:var(--accent); color:#fff; }
.icon-btn.edit-on svg { color:#fff; }
/* Input para renombrar el grupo en modo edición */
.pack-group-title-input {
  /* 16px evita el auto-zoom de iOS al enfocar el campo. */
  flex:1; min-width:0; font-weight:700; font-size:16px; letter-spacing:-.01em;
  color:var(--text); background:var(--bg-input); border:1px solid var(--line);
  border-radius:var(--r-sm); padding:5px 9px; font-family:inherit;
}
.pack-group-title-input:focus { outline:none; border-color:var(--accent); box-shadow:0 0 0 3px color-mix(in srgb, var(--accent) 18%, transparent); }

/* Personas plegables — por defecto se ve solo el ranking */
.person-card-head { cursor:pointer; }
.person-collapse { flex-shrink:0; color:var(--text-muted); transition:transform .2s var(--ease); display:inline-flex; }
.person-collapse svg { width:18px; height:18px; }
.person-card.collapsed .person-collapse { transform:rotate(-90deg); }
.person-card.collapsed > .list { display:none; }
.person-card.collapsed .person-card-head { margin-bottom:0; }

/* Selector de estado en el editor — pill segmentado vertical con color por opción */
.status-picker {
  display:grid; gap:8px;
  grid-template-columns:repeat(2, 1fr);
  margin-top:6px;
}
.status-picker .opt {
  display:flex; align-items:flex-start; gap:10px;
  padding:10px 12px; border:1.5px solid var(--line);
  background:var(--bg-elev); border-radius:var(--r-md);
  cursor:pointer; transition:all .15s var(--ease);
  text-align:left;
}
.status-picker .opt:hover { transform:translateY(-1px); }
.status-picker .opt .dot {
  width:10px; height:10px; border-radius:50%;
  margin-top:5px; flex-shrink:0;
}
.status-picker .opt .lbl { font-weight:600; font-size:14px; letter-spacing:-.005em; }
.status-picker .opt .h   { font-size:12px; color:var(--text-muted); margin-top:2px; }
.status-picker .opt.s-por_iniciar .dot { background:#f59e0b; }
.status-picker .opt.s-en_consulta .dot { background:#3b82f6; }
.status-picker .opt.s-confirmado  .dot { background:#10b981; }
.status-picker .opt.s-cancelado   .dot { background:#ef4444; }
.status-picker .opt.active { border-width:2px; padding:9px 11px; }
.status-picker .opt.s-por_iniciar.active { border-color:#f59e0b; background:color-mix(in srgb, #fbbf24 14%, var(--bg-elev)); }
.status-picker .opt.s-en_consulta.active { border-color:#3b82f6; background:color-mix(in srgb, #60a5fa 12%, var(--bg-elev)); }
.status-picker .opt.s-confirmado.active  { border-color:#10b981; background:color-mix(in srgb, #34d399 12%, var(--bg-elev)); }
.status-picker .opt.s-cancelado.active   { border-color:#ef4444; background:color-mix(in srgb, #f87171 12%, var(--bg-elev)); }
