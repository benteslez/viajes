  async _gatherTrip(t) {
    const tripId = t.id;
    const planning = await DB.listByTrip('planning_items', tripId);
    const bookings = await DB.listByTrip('bookings', tripId);
    const addresses = await DB.listByTrip('addresses', tripId);
    const destination_info = (await DB.listByTrip('destination_info', tripId))[0] || null;
    const emergency_contacts = await DB.listByTrip('emergency_contacts', tripId);
    const phrases = await DB.listByTrip('phrases', tripId);
    const day_notes = await DB.listByTrip('day_notes', tripId);
    return { trip: t, planning, bookings, addresses, destination_info, emergency_contacts, phrases, day_notes };
  },

  _buildShareHtml(t, data, opts) {
    // Filtrar datos según opts antes de embeber
    const safe = JSON.parse(JSON.stringify(data));

    // Limpiar planning notes de URLs si !includeLinks
    if (!opts.includeLinks) {
      safe.planning.forEach(p => {
        p.gmaps_url = null;
        if (p.notes) p.notes = p.notes.replace(/https?:\/\/\S+/g, '[enlace omitido]');
      });
    }

    // Bookings: limpiar doc_url/doc_name si !includeDocs; campos $/loc si corresponde
    const DOC_FIELDS = new Set(['localizador','poliza','matricula','numero','referencia']);
    const MONEY_FIELDS = new Set(['precio','importe','coste','total','price']);
    safe.bookings.forEach(b => {
      if (!opts.includeDocs)  { b.doc_url = null; b.doc_name = null; }
      const d = b.structured_data || {};
      Object.keys(d).forEach(k => {
        if (!opts.includeDocs  && DOC_FIELDS.has(k))   delete d[k];
        if (!opts.includeMoney && MONEY_FIELDS.has(k)) delete d[k];
      });
    });

    if (!opts.includeNotes) {
      safe.trip.notes = null;
      safe.day_notes = [];
      safe.phrases = [];
    }

    if (!opts.includeMap) {
      safe.planning.forEach(p => { p.lat = null; p.lng = null; });
      safe.addresses.forEach(a => { a.lat = null; a.lng = null; });
    }

    // Quitar datos completamente irrelevantes / sensibles que nunca compartimos
    safe.trip.budget_target = null;
    delete safe.trip.profile;
    delete safe.trip.is_shared;
    delete safe.trip.cover_photo_url; // opcional: el receptor puede no tener acceso a la URL
    safe.trip.cover_photo_url = data.trip.cover_photo_url; // mantenerla; es solo decorativa

    const payload = JSON.stringify(safe).replace(/<\/script>/g, '<\\/script>');
    const titleEsc = escHtml(t.name);
    const subtitle = [t.city, t.country].filter(Boolean).join(', ');
    const dates = (t.start_date && t.end_date)
      ? `${fmtDateShort(t.start_date)} – ${fmtDateShort(t.end_date)}`
      : 'Sin fechas';

    // El script embebido se construye reemplazando placeholders en una plantilla
    // (los ${...} dentro de ese script son del VIEWER, no del main).
    const viewerScript = Exporter._viewerScript(payload, JSON.stringify(opts));

    return `<!DOCTYPE html>
<html lang="es" data-tema="claro">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>${titleEsc} — Viaje compartido</title>
<meta name="theme-color" content="#fb7185" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" />
${opts.includeMap ? '<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />' : ''}
<style>
:root {
  --r-sm:8px; --r-md:14px; --r-lg:20px; --r-pill:999px;
  --sh-1:0 1px 2px rgba(0,0,0,.04),0 1px 1px rgba(0,0,0,.03);
  --sh-2:0 2px 10px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04);
  --gap-4:16px; --gap-5:24px;
  --bg:#f8fafc; --bg-elev:#fff; --bg-soft:#f1f5f9;
  --text:#0f172a; --text-muted:#64748b;
  --line:#e2e8f0; --line-soft:#f1f5f9;
  --accent:#2563eb; --accent-2:#06b6d4; --accent-bg:#dbeafe;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg:#0b1220; --bg-elev:#111a2e; --bg-soft:#1e293b;
    --text:#f1f5f9; --text-muted:#94a3b8;
    --line:#334155; --line-soft:#1e293b;
    --accent:#60a5fa; --accent-2:#22d3ee; --accent-bg:#1e3a5f;
  }
}
* { box-sizing:border-box; }
body { margin:0; font-family:'Manrope',system-ui,-apple-system,sans-serif; background:var(--bg); color:var(--text); -webkit-font-smoothing:antialiased; line-height:1.5; }
main { max-width:900px; margin:0 auto; padding:24px 18px 60px; }
.cover {
  position:relative; height:240px; border-radius:var(--r-lg); overflow:hidden;
  background:linear-gradient(135deg, var(--accent-bg), var(--bg-soft));
  display:flex; flex-direction:column; justify-content:flex-end; padding:22px;
}
.cover img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
.cover::after { content:''; position:absolute; inset:0; background:linear-gradient(to top, rgba(0,0,0,.55), transparent 60%); }
.cover > * { position:relative; z-index:1; }
.cover h1 { color:#fff; font-weight:800; letter-spacing:-.02em; font-size:28px; margin:0; text-shadow:0 1px 3px rgba(0,0,0,.4); }
.cover .meta { color:rgba(255,255,255,.92); margin-top:6px; font-weight:500; text-shadow:0 1px 2px rgba(0,0,0,.3); }
.share-banner {
  display:flex; align-items:center; gap:10px;
  background:var(--accent-bg); color:var(--text);
  border-radius:var(--r-md); padding:10px 14px; margin:14px 0 0;
  font-size:13px;
}
.share-banner svg { width:16px; height:16px; stroke:var(--accent); }
h2.section { font-weight:600; letter-spacing:-.02em; font-size:22px; margin:36px 0 12px; }
h3.day { font-weight:600; letter-spacing:-.01em; font-size:17px; margin:16px 0 8px; }
.day-num { font-family:'Manrope',system-ui,sans-serif; font-feature-settings:"tnum","ss01"; font-size:12px; color:var(--text-muted); margin-right:8px; }
.timeline { position:relative; margin-left:8px; padding-left:30px; border-left:2px solid var(--line-soft); }
.tl-item { position:relative; padding:10px 14px; background:var(--bg-elev); border:1px solid var(--line); border-radius:var(--r-md); margin-bottom:10px; box-shadow:var(--sh-1); }
.tl-item::before { content:''; position:absolute; left:-37px; top:14px; width:14px; height:14px; border-radius:50%; background:var(--bg-elev); border:2px solid var(--accent); box-shadow:0 0 0 3px var(--bg); }
.tl-time { display:inline-block; font-family:'Manrope',system-ui,sans-serif; font-feature-settings:"tnum","ss01"; font-size:11px; background:var(--bg-soft); color:var(--text-muted); padding:2px 8px; border-radius:var(--r-pill); margin-right:6px; }
.tl-title { font-weight:600; }
.tl-sub { color:var(--text-muted); font-size:13.5px; margin-top:4px; }
.tl-link { display:inline-block; margin-top:6px; font-size:13px; }
.day-note {
  background:color-mix(in srgb, var(--accent-bg) 30%, var(--bg-elev));
  border:1px dashed color-mix(in srgb, var(--accent) 35%, var(--line));
  border-radius:var(--r-md); padding:10px 14px; margin-bottom:10px;
  font-size:13.5px; white-space:pre-wrap;
}
.card { background:var(--bg-elev); border:1px solid var(--line); border-radius:var(--r-md); padding:14px 16px; margin-bottom:10px; box-shadow:var(--sh-1); }
.card .ti { font-weight:600; display:flex; align-items:center; gap:8px; }
.card .sub { color:var(--text-muted); font-size:13.5px; margin-top:4px; }
.card .ref { font-family:'Manrope',system-ui,sans-serif; font-feature-settings:"tnum","ss01"; font-size:11px; background:var(--bg-soft); color:var(--text-muted); padding:2px 8px; border-radius:var(--r-pill); }
.card a { color:var(--accent); }
.kv { display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px solid var(--line-soft); font-size:14px; }
.kv:last-child { border-bottom:none; }
.kv .k { color:var(--text-muted); }
.kv .v { font-family:'Manrope',system-ui,sans-serif; font-feature-settings:"tnum","ss01"; }
.muted { color:var(--text-muted); }
#map { height:380px; border-radius:var(--r-lg); border:1px solid var(--line); overflow:hidden; }
footer.foot { margin-top:48px; padding-top:24px; border-top:1px solid var(--line-soft); color:var(--text-muted); font-size:12px; text-align:center; }
a { color:var(--accent); text-decoration:none; }
a:hover { text-decoration:underline; }
.notes-card { background:var(--bg-elev); border:1px solid var(--line); border-radius:var(--r-md); padding:14px 16px; white-space:pre-wrap; font-size:14px; }
</style>
</head>
<body>
<main>
  <div class="cover">
    ${safe.trip.cover_photo_url ? `<img src="${escHtml(safe.trip.cover_photo_url)}" alt="" onerror="this.remove()">` : ''}
    <h1>${titleEsc}</h1>
    <div class="meta">${escHtml(dates)}${subtitle ? ' · ' + escHtml(subtitle) : ''}</div>
  </div>
  <div class="share-banner">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
    Solo lectura · viaje compartido por Rubén
  </div>
  <div id="content"></div>
  <footer class="foot">Generado desde la app Viajes</footer>
</main>
${opts.includeMap ? '<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></scr'+'ipt>' : ''}
<script>
${viewerScript}
</scr${''}ipt>
</body>
</html>`;
  },

  // Script JS del viewer standalone. Se devuelve como string concatenado para
  // que los ${...} y backticks de DENTRO no los interprete el template literal
  // del main script (problema clásico de templates anidados).
  _viewerScript(dataJSON, optsJSON) {
    const lines = [];
    lines.push('const DATA = ' + dataJSON + ';');
    lines.push('const OPTS = ' + optsJSON + ';');
    lines.push("function escHtml(s){return String(s==null?'':s).replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c]));}");
    lines.push("function fmtDayLong(iso){if(!iso)return'';return new Date(iso+'T00:00:00').toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'long'});}");
    lines.push("function fmtDateShort(iso){if(!iso)return'';return new Date(iso+'T00:00:00').toLocaleDateString('es-ES',{day:'numeric',month:'short'});}");
    lines.push("function daysBetween(a,b){if(!a||!b)return 0;return Math.round((new Date(b+'T00:00:00')-new Date(a+'T00:00:00'))/(24*3600*1000));}");
    lines.push("function gmapsUrl(lat,lng,q){if(lat!=null&&lng!=null)return 'https://www.google.com/maps/search/?api=1&query='+lat+','+lng;if(q)return 'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(q);return null;}");
    lines.push("function el(tag, attrs, children) {");
    lines.push("  const n = document.createElement(tag);");
    lines.push("  if (attrs) for (const k in attrs) { if (k==='class') n.className = attrs[k]; else if (k==='text') n.textContent = attrs[k]; else if (k==='html') n.innerHTML = attrs[k]; else if (k.startsWith('on')) n.addEventListener(k.slice(2), attrs[k]); else if (k==='style') Object.assign(n.style, attrs[k]); else n.setAttribute(k, attrs[k]); }");
    lines.push("  if (children) (Array.isArray(children)?children:[children]).forEach(c => { if (c==null||c===false) return; if (typeof c === 'string') n.appendChild(document.createTextNode(c)); else n.appendChild(c); });");
    lines.push("  return n;");
    lines.push("}");
    lines.push("");
    lines.push("const root = document.getElementById('content');");
    lines.push("const trip = DATA.trip;");
    lines.push("");
    lines.push("// === Itinerario ===");
    lines.push("if (DATA.planning.length || DATA.day_notes.length || (trip.start_date && trip.end_date)) {");
    lines.push("  root.appendChild(el('h2', {class:'section', text:'Itinerario'}));");
    lines.push("  const byDay = {};");
    lines.push("  DATA.planning.forEach(p => { const k = p.day_date || 'sin-fecha'; (byDay[k]=byDay[k]||[]).push(p); });");
    lines.push("  const noteMap = {}; DATA.day_notes.forEach(n => noteMap[n.date]=n);");
    lines.push("  Object.keys(noteMap).forEach(k => { if (!byDay[k]) byDay[k] = []; });");
    lines.push("  if (trip.start_date && trip.end_date) {");
    lines.push("    let d = new Date(trip.start_date+'T00:00:00'); const end = new Date(trip.end_date+'T00:00:00');");
    lines.push("    while (d <= end) { const k = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); if (!byDay[k]) byDay[k]=[]; d.setDate(d.getDate()+1); }");
    lines.push("  }");
    lines.push("  Object.keys(byDay).sort().forEach(k => {");
    lines.push("    const items = byDay[k];");
    lines.push("    items.sort((a,b) => (a.time||'').localeCompare(b.time||'') || (a.order_index||0)-(b.order_index||0));");
    lines.push("    const dayNum = (trip.start_date && k!=='sin-fecha') ? daysBetween(trip.start_date, k)+1 : null;");
    lines.push("    const dayH = el('h3', {class:'day'});");
    lines.push("    if (dayNum) dayH.appendChild(el('span', {class:'day-num', text:'Día '+dayNum+' '}));");
    lines.push("    dayH.appendChild(document.createTextNode(k==='sin-fecha' ? 'Sin fecha' : fmtDayLong(k)));");
    lines.push("    root.appendChild(dayH);");
    lines.push("    if (noteMap[k] && noteMap[k].text) {");
    lines.push("      root.appendChild(el('div', {class:'day-note', text: noteMap[k].text}));");
    lines.push("    }");
    lines.push("    if (items.length) {");
    lines.push("      const tl = el('div', {class:'timeline'}); root.appendChild(tl);");
    lines.push("      items.forEach(it => {");
    lines.push("        const tlItem = el('div', {class:'tl-item'});");
    lines.push("        const titleDiv = el('div', {class:'tl-title'});");
    lines.push("        if (it.time) titleDiv.appendChild(el('span', {class:'tl-time', text: it.time}));");
    lines.push("        titleDiv.appendChild(document.createTextNode(it.title));");
    lines.push("        tlItem.appendChild(titleDiv);");
    lines.push("        if (it.place_name && it.place_name !== it.title) tlItem.appendChild(el('div', {class:'tl-sub', text: it.place_name}));");
    lines.push("        if (it.address) tlItem.appendChild(el('div', {class:'tl-sub', text: it.address}));");
    lines.push("        if (it.notes) tlItem.appendChild(el('div', {class:'tl-sub', style:{whiteSpace:'pre-wrap'}, text: it.notes}));");
    lines.push("        const gm = OPTS.includeLinks ? gmapsUrl(it.lat, it.lng, it.place_name) : null;");
    lines.push("        if (gm) tlItem.appendChild(el('a', {class:'tl-link', href: gm, target:'_blank', rel:'noopener', text:'Abrir en Google Maps'}));");
    lines.push("        tl.appendChild(tlItem);");
    lines.push("      });");
    lines.push("    }");
    lines.push("  });");
    lines.push("}");
    lines.push("");
    lines.push("// === Reservas ===");
    lines.push("if (DATA.bookings.length) {");
    lines.push("  root.appendChild(el('h2', {class:'section', text:'Reservas'}));");
    lines.push("  const TYPE_LABELS = {vuelo:'Vuelo',hotel:'Hotel',tren:'Tren',ferry:'Ferry',coche:'Coche',actividad:'Actividad',seguro:'Seguro',otro:'Otro'};");
    lines.push("  DATA.bookings.forEach(b => {");
    lines.push("    const c = el('div', {class:'card'});");
    lines.push("    const d = b.structured_data || {};");
    lines.push("    const ti = el('div', {class:'ti'});");
    lines.push("    ti.appendChild(document.createTextNode(TYPE_LABELS[b.type]||b.type));");
    lines.push("    if (b.ref_date) ti.appendChild(el('span', {class:'ref', style:{marginLeft:'8px'}, text: fmtDateShort(b.ref_date)}));");
    lines.push("    c.appendChild(ti);");
    lines.push("    Object.entries(d).filter(([k,v])=>v).forEach(([k,v]) => {");
    lines.push("      const kv = el('div', {class:'kv'});");
    lines.push("      kv.appendChild(el('span', {class:'k', text: k.replace(/_/g,' ')}));");
    lines.push("      kv.appendChild(el('span', {class:'v', text: String(v)}));");
    lines.push("      c.appendChild(kv);");
    lines.push("    });");
    lines.push("    if (b.doc_url && OPTS.includeDocs) {");
    lines.push("      const dwrap = el('div', {style:{marginTop:'8px'}});");
    lines.push("      dwrap.appendChild(el('a', {href: b.doc_url, target:'_blank', rel:'noopener', text: b.doc_name || 'Documento'}));");
    lines.push("      c.appendChild(dwrap);");
    lines.push("    }");
    lines.push("    root.appendChild(c);");
    lines.push("  });");
    lines.push("}");
    lines.push("");
    lines.push("// === Direcciones ===");
    lines.push("if (DATA.addresses.length) {");
    lines.push("  root.appendChild(el('h2', {class:'section', text:'Direcciones'}));");
    lines.push("  DATA.addresses.forEach(a => {");
    lines.push("    const c = el('div', {class:'card'});");
    lines.push("    c.appendChild(el('div', {class:'ti', text: a.label}));");
    lines.push("    if (a.address) c.appendChild(el('div', {class:'sub', text: a.address}));");
    lines.push("    if (a.notes) c.appendChild(el('div', {class:'sub', text: a.notes}));");
    lines.push("    const gm = OPTS.includeLinks ? gmapsUrl(a.lat, a.lng, a.address) : null;");
    lines.push("    if (gm) { const w = el('div', {style:{marginTop:'8px'}}); w.appendChild(el('a', {href: gm, target:'_blank', rel:'noopener', text:'Abrir en Google Maps'})); c.appendChild(w); }");
    lines.push("    root.appendChild(c);");
    lines.push("  });");
    lines.push("}");
    lines.push("");
    lines.push("// === Ficha destino ===");
    lines.push("if (DATA.destination_info || DATA.emergency_contacts.length || (DATA.phrases.length && OPTS.includeNotes)) {");
    lines.push("  root.appendChild(el('h2', {class:'section', text:'Ficha del destino'}));");
    lines.push("  if (DATA.destination_info) {");
    lines.push("    const i = DATA.destination_info;");
    lines.push("    const c = el('div', {class:'card'});");
    lines.push("    const rows = [['Zona horaria',i.timezone],['Dif. con origen',i.tz_diff_origin],['Voltaje',i.voltage],['Enchufe',i.plug_type],['Moneda local',i.local_currency],['Propinas',i.tipping_notes],['Tel. emergencia',i.emergency_number]];");
    lines.push("    rows.filter(r => r[1]).forEach(r => {");
    lines.push("      const kv = el('div', {class:'kv'});");
    lines.push("      kv.appendChild(el('span', {class:'k', text: r[0]}));");
    lines.push("      kv.appendChild(el('span', {class:'v', text: r[1]}));");
    lines.push("      c.appendChild(kv);");
    lines.push("    });");
    lines.push("    if (i.embassy_info) { const w = el('div', {style:{marginTop:'10px'}}); w.appendChild(el('div', {class:'k muted', text:'Embajada de España'})); w.appendChild(el('div', {class:'sub', style:{whiteSpace:'pre-wrap'}, text: i.embassy_info})); c.appendChild(w); }");
    lines.push("    if (c.children.length) root.appendChild(c);");
    lines.push("  }");
    lines.push("  if (DATA.emergency_contacts.length) {");
    lines.push("    root.appendChild(el('h3', {class:'day', text:'Contactos de emergencia'}));");
    lines.push("    DATA.emergency_contacts.forEach(c => {");
    lines.push("      const d = el('div', {class:'card'});");
    lines.push("      d.appendChild(el('div', {class:'ti', text: c.name}));");
    lines.push("      d.appendChild(el('div', {class:'sub', text: [c.relation, c.phone].filter(Boolean).join(' · ')}));");
    lines.push("      root.appendChild(d);");
    lines.push("    });");
    lines.push("  }");
    lines.push("  if (DATA.phrases.length && OPTS.includeNotes) {");
    lines.push("    root.appendChild(el('h3', {class:'day', text:'Frases útiles'}));");
    lines.push("    DATA.phrases.forEach(p => {");
    lines.push("      const d = el('div', {class:'card'});");
    lines.push("      d.appendChild(el('div', {class:'ti', text: p.phrase_local}));");
    lines.push("      d.appendChild(el('div', {class:'sub', text: [p.translation, p.lang].filter(Boolean).join(' · ')}));");
    lines.push("      root.appendChild(d);");
    lines.push("    });");
    lines.push("  }");
    lines.push("}");
    lines.push("");
    lines.push("// === Notas generales ===");
    lines.push("if (OPTS.includeNotes && trip.notes) {");
    lines.push("  root.appendChild(el('h2', {class:'section', text:'Notas'}));");
    lines.push("  root.appendChild(el('div', {class:'notes-card', text: trip.notes}));");
    lines.push("}");
    lines.push("");
    lines.push("// === Mapa ===");
    lines.push("if (OPTS.includeMap) {");
    lines.push("  const pins = [];");
    lines.push("  DATA.planning.forEach(p => { if (p.lat!=null && p.lng!=null) pins.push({lat:p.lat,lng:p.lng,name:p.title,sub:p.place_name||p.address||''}); });");
    lines.push("  DATA.addresses.forEach(a => { if (a.lat!=null && a.lng!=null) pins.push({lat:a.lat,lng:a.lng,name:a.label,sub:a.address||''}); });");
    lines.push("  if (pins.length && typeof L !== 'undefined') {");
    lines.push("    root.appendChild(el('h2', {class:'section', text:'Mapa'}));");
    lines.push("    const map = el('div', {id:'map'}); root.appendChild(map);");
    lines.push("    setTimeout(() => {");
    lines.push("      const m = L.map('map');");
    lines.push("      L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {maxZoom:19, attribution:'© OpenStreetMap'}).addTo(m);");
    lines.push("      const g = L.featureGroup(pins.map(p => { const mk = L.marker([p.lat,p.lng]); mk.bindPopup('<b>'+escHtml(p.name)+'</b><br>'+escHtml(p.sub)); return mk; })).addTo(m);");
    lines.push("      m.fitBounds(g.getBounds().pad(0.2));");
    lines.push("    }, 60);");
    lines.push("  }");
    lines.push("}");
    return lines.join('\n');
  },

  async json(profile) {
    const data = await DB.exportProfile(profile);
    const blob = new Blob([JSON.stringify(data, null, 2)], { type:'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `viajes_${profile}_${todayIso()}.json`;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  },

  importJsonPick() {
    const input = document.createElement('input');
    input.type = 'file'; input.accept = 'application/json';
    input.onchange = async () => {
      const file = input.files[0]; if (!file) return;
      const text = await file.text();
      try {
        const data = JSON.parse(text);
        const ok = await UI.confirm('Esto importará los datos del archivo sobre los existentes (mismo id se sobreescribe).');
        if (!ok) return;
        await DB.importProfile(data);
        UI.toast('Importado'); Router.render();
      } catch (e) {
        console.error(e); UI.toast('Archivo inválido');
      }
    };
    input.click();
  },
};

/* ============================================================
   PendingImport — recoge un plan guardado por explorar.html
   ============================================================ */
const PendingImport = {
  KEY: 'viajes_pending_import',

  async checkAndProcess() {
    const raw = localStorage.getItem(this.KEY);
    if (!raw) return false;
    localStorage.removeItem(this.KEY);
    if (!DB.db || !STATE.profile || !canEdit()) {
      console.warn('Import pending: BD/perfil no listos o sin permiso.');
      return false;
    }
    try {
      const data = JSON.parse(raw);
      await this._createTrip(data);
      return true;
    } catch (e) {
      console.error('Import pending', e);
      UI.toast('No se pudo importar el plan: ' + (e?.message || ''));
      return false;
    }
  },

  async _createTrip(data) {
    const trip = {
      id: uuid(),
      profile: STATE.profile,
      name: (data.name || 'Plan importado').slice(0, 80),
      city: data.city || '',
      country: data.country || '',
      cover_photo_url: data.cover_photo_url || null,
      cover_blob_id: null,
      start_date: data.start_date || null,
      end_date: data.end_date || null,
      in_preparation: true,
      default_currency: data.default_currency || 'EUR',
      is_shared: false, is_multi_destino: false,
      budget_target: null,
      notes: data.notes || '',
    };
    await DB.put('trips', trip);

    // Parsear itinerario en paradas básicas tipo 'lugar'
    if (data.itinerary && trip.start_date) {
      const stops = this._parseItinerary(data.itinerary, trip.start_date);
      for (const stop of stops) {
        await DB.put('planning_items', {
          id: uuid(), trip_id: trip.id, leg_id: null,
          day_date: stop.day_date, time: null, type: 'lugar',
          title: stop.title, place_name: null,
          lat: null, lng: null, gmaps_url: null,
          address: null, notes: null, order_index: stop.order_index,
          in_consultation: false, status: null,
          consultation_url: null, consultation_price: null, consultation_currency: 'EUR',
          consultation_planned_d1: null, consultation_planned_t1: null,
          consultation_planned_d2: null, consultation_planned_t2: null,

  },

  // Convierte un string "Día 1: X. Día 2: Y. Día 3 (tarde): Z" en paradas.
  // Estrategia: split por ". " antes de un "Día N" — más robusto que un solo regex.
  _parseItinerary(itString, startDateStr) {
    if (!itString) return [];
    const items = [];
    const start = parseDate(startDateStr);
    // Trozos separados por ". " seguido de "Día N" (sin consumir el "Día N" gracias al lookahead)
    const chunks = itString.split(/\.\s+(?=D[íi]as?\s+\d)/);
    let order = 0;
    chunks.forEach(chunk => {
      const m = chunk.match(/^D[íi]as?\s+(\d+)(?:\s*[–\-]\s*(\d+))?(?:\s*\([^)]*\))?\s*:\s*(.+?)\.?\s*$/is);
      if (!m) return;
      const dayStart = parseInt(m[1], 10);
      const dayEnd = m[2] ? parseInt(m[2], 10) : dayStart;
      const desc = m[3].trim().replace(/\s+/g, ' ');
      for (let d = dayStart; d <= dayEnd; d++) {
        const date = new Date(start);
        date.setDate(date.getDate() + d - 1);
        items.push({
          day_date: date.getFullYear()+'-'+String(date.getMonth()+1).padStart(2,'0')+'-'+String(date.getDate()).padStart(2,'0'),
          title: dayStart === dayEnd ? desc : `${desc} (día ${d - dayStart + 1}/${dayEnd - dayStart + 1})`,
          order_index: order++,
        });
      }
    });
    return items;
  },
};

/* ============================================================
   Helpers geo + stats
   ============================================================ */
function haversineKm(a, b) {
  if (!a || !b || a.lat == null || b.lat == null) return 0;
  const R = 6371;
  const toRad = (x) => x * Math.PI / 180;
  const dLat = toRad(b.lat - a.lat);
  const dLng = toRad(b.lng - a.lng);
  const h = Math.sin(dLat/2)**2 + Math.cos(toRad(a.lat)) * Math.cos(toRad(b.lat)) * Math.sin(dLng/2)**2;
  return 2 * R * Math.asin(Math.min(1, Math.sqrt(h)));
}

// Estimación de un tramo entre dos puntos SIN red: distancia por carretera ≈ línea
// recta × 1.35; modo (a pie/coche) y tiempo según la distancia.
const MODE_EMOJI = { walk:'🚶', car:'🚗', bike:'🚴', transit:'🚇' };
// Velocidad de coche por tramos para que la estimación offline sea creíble (evita
// avisos falsos en traslados largos): ciudad < nacional < autovía.
function carSpeedKmh(km) { return km < 25 ? 32 : km < 120 ? 70 : 95; }

  const km = haversineKm(a, b) * 1.35;

  const mode = km < 1.6 ? 'walk' : 'car';
  const min = mode === 'walk' ? Math.max(1, Math.round(km / 4.8 * 60)) : drivingMin;
  return { km, drivingMin, min, mode };
}
// Dado km (distancia por carretera) + drivingMin (tiempo en coche), el modo elegido y,
// opcionalmente, la ruta peatonal real (walk={km,min}), calcula el modo a mostrar, su
// tiempo y su distancia. 'auto' decide a pie/coche por la distancia.
function legView(km, drivingMin, mode, walk) {
  const m = (mode && mode !== 'auto') ? mode : (km < 1.6 ? 'walk' : 'car');
  if (m === 'walk') {
    if (walk && walk.km != null) return { mode:'walk', km: walk.km, min: Math.max(1, walk.min) };
    return { mode:'walk', km, min: Math.max(1, Math.round(km / 4.8 * 60)) };  // estimación
  }
  if (m === 'bike')    return { mode:'bike',    km, min: Math.max(1, Math.round(km / 15 * 60)) };
  if (m === 'transit') return { mode:'transit', km, min: Math.max(1, Math.round(km / 17 * 60) + 5) }; // +5 espera

}

// Color estable por número de día (día 1, 2, 3…) para el mapa por días.
const MAP_DAY_COLORS = ['#2563eb','#16a34a','#f97316','#a855f7','#ec4899','#0891b2','#ca8a04','#dc2626','#0d9488','#7c3aed'];

// ---- Horarios de apertura (OpenStreetMap / Overpass) ----
const _ohCache = new Map(); // "lat,lng" -> opening_hours | null
async function fetchOpeningHours(lat, lng) {
  const key = (+lat).toFixed(5) + ',' + (+lng).toFixed(5);
  if (_ohCache.has(key)) return _ohCache.get(key);
  _ohCache.set(key, null); // marca en vuelo (evita duplicar)
  try {
    const q = `[out:json][timeout:8];(node(around:50,${lat},${lng})["opening_hours"];way(around:50,${lat},${lng})["opening_hours"];);out tags 1;`;
    const res = await fetch('https://overpass-api.de/api/interpreter', { method:'POST', headers:{'Content-Type':'text/plain'}, body:q });
    if (!res.ok) return null;
    const data = await res.json();

    _ohCache.set(key, oh);

  } catch (_) { _ohCache.set(key, null); return null; }
}
// Evaluador SIMPLIFICADO de opening_hours: true/false/null(desconocido). Cubre los
// casos comunes (24/7, "Mo-Fr 09:00-18:00", listas y varios tramos). Ante la duda → null.
function ohCap(s) { return s.charAt(0).toUpperCase() + s.slice(1, 2).toLowerCase(); }
function ohIsOpen(oh, dateStr, hhmm) {
  if (!oh || !dateStr || !hhmm) return null;
  let s = String(oh).trim();
  if (/^24\s*\/\s*7$/i.test(s)) return true;
  const DAYS = ['Su','Mo','Tu','We','Th','Fr','Sa'];
  const dow = new Date(dateStr + 'T12:00:00').getDay();
  const today = DAYS[dow];
  const cur = parseInt(hhmm.slice(0,2),10) * 60 + parseInt(hhmm.slice(3,5),10);
  const di = (d) => DAYS.indexOf(d);
  s = s.replace(/"[^"]*"/g, '').replace(/\bPH\b|\bSH\b/g, '');
  let sawToday = false, openNow = false;
  for (let rule of s.split(';')) {
    rule = rule.trim(); if (!rule) continue;
    const times = rule.match(/\d{1,2}:\d{2}\s*-\s*\d{1,2}:\d{2}/g);
    const isOff = /\b(off|closed)\b/i.test(rule);
    let dayPart = rule;
    if (times) { const idx = rule.search(/\d{1,2}:\d{2}/); dayPart = rule.slice(0, idx); }
    dayPart = dayPart.trim();
    let applies = false;
    if (!dayPart || /^(Mo-Su|Mo-Sun|daily)$/i.test(dayPart)) applies = true;
    else for (const tokRaw of dayPart.split(',')) {
      const tok = tokRaw.trim();
      const rng = tok.match(/^([A-Za-z]{2})\s*-\s*([A-Za-z]{2})$/);
      if (rng) { const a = di(ohCap(rng[1])), b = di(ohCap(rng[2])); if (a >= 0 && b >= 0) { for (let d = a;; d = (d + 1) % 7) { if (d === dow) applies = true; if (d === b) break; } } }
      else { const one = tok.match(/^([A-Za-z]{2})$/); if (one && ohCap(one[1]) === today) applies = true; }
    }
    if (!applies) continue;
    sawToday = true;
    if (isOff) return false;
    if (times) for (const tm of times) {
      const [a, b] = tm.split('-').map(x => { const p = x.trim().split(':'); return parseInt(p[0],10) * 60 + parseInt(p[1],10); });
      let end = b; if (end <= a) end += 1440;
      if (cur >= a && cur <= end) openNow = true;
    }
  }
  return sawToday ? openNow : null;
}

// Pide el día ENTERO en una sola llamada (varios waypoints) → menos peticiones y

    const res = await fetch(url, { signal: ctrl.signal }); clearTimeout(to);

    const missing = job.pts.some((p, i) => { if (i >= job.pts.length - 1) return false; const c = _routeCache[routeKey(job.pts[i], job.pts[i + 1])]; return !(c && c.km != null); });

/* ============================================================
   Notificaciones — solo mientras la app está abierta (sin backend).
   Programa setTimeout para los siguientes umbrales: 30 / 7 / 1 días.
   ============================================================ */
const Notifications = {
  _timers: [],
  _clearAll() {
    this._timers.forEach(id => clearTimeout(id));
    this._timers = [];
  },
  async scheduleAll() {
    if (!('Notification' in window)) return;
    if (Notification.permission !== 'granted') return;
    this._clearAll();
    const profile = dataProfile();
    if (!profile) return;
    const now = Date.now();
    const MAX_MS = 2_147_000_000; // ~24 días — máximo razonable de setTimeout

    // Viajes que empiezan en el futuro
    const trips = await DB.listByProfile('trips', profile);
    for (const t of trips) {
      if (!t.start_date) continue;
      const start = new Date(t.start_date + 'T08:00:00').getTime();
      for (const d of [30, 7, 1]) {
        const when = start - d * 24 * 3600 * 1000;
        const delay = when - now;
        if (delay > 0 && delay < MAX_MS) {
          this._timers.push(setTimeout(() => {
            try { new Notification('Viajes', { body:`Faltan ${d} día${d>1?'s':''} para ${t.name}.`, icon:'icons/icon-192.png', tag:`trip-${t.id}-${d}` }); } catch (_) {}
          }, delay));
        }
      }
    }

    // Documentos próximos a caducar (pasaporte/visado)
    const docs = await DB.listByProfile('travel_docs', STATE.profile);
    for (const doc of docs) {
      if (!doc.expiry_date) continue;
      const exp = new Date(doc.expiry_date + 'T08:00:00').getTime();
      for (const d of [30, 7, 1]) {
        const when = exp - d * 24 * 3600 * 1000;
        const delay = when - now;
        if (delay > 0 && delay < MAX_MS) {
          this._timers.push(setTimeout(() => {
            try { new Notification('Viajes — caducidad', { body:`Tu ${doc.type} caduca en ${d} día${d>1?'s':''}.`, icon:'icons/icon-192.png', tag:`doc-${doc.id}-${d}` }); } catch (_) {}
          }, delay));
        }
      }
    }

    // Eventos del planning (vuelos, hoteles, comidas, actividades…) próximos.
    // Minutos de antelación por tipo. Solo se programan si la app sigue abierta.
    const REMIND_MIN = {
      vuelo:[1440,180,60], transporte:[1440,180,60], coche:[180,60],
      hotel:[180,60], actividad:[120,30], comida:[60,15], compras:[60],
    };
    for (const t of trips) {
      let items = [];
      try { items = await DB.listByTrip('planning_items', t.id); } catch (_) {}
      for (const it of items) {
        if (itemStatus(it) === 'cancelado') continue;     // no avisar de algo cancelado
        const dt = itemDateTime(it); if (!dt) continue;
        const mins = REMIND_MIN[it.type]; if (!mins) continue;
        const ts = dt.getTime();
        const s = TripDetail._reservationSummary(it);
        const emoji = (s && s.emoji) || typeDef(it.type).emoji || '📌';
        const label = s ? `${s.label}${s.value ? ' · ' + s.value : ''}` : (it.title || typeDef(it.type).label);
        for (const m of mins) {
          const delay = (ts - m * 60000) - now;
          if (delay > 0 && delay < MAX_MS) {
            this._timers.push(setTimeout(() => {
              try { new Notification('Viajes', { body:`${emoji} ${label} · ${fmtCountdown(m * 60000)}`, icon:'icons/icon-192.png', tag:`pi-${it.id}-${m}` }); } catch (_) {}
            }, delay));
          }
        }
      }
    }
    console.log(`Notificaciones: ${this._timers.length} programadas.`);
  },
};

/* ============================================================

const CalendarView = {

    const first = new Date(y, m - 1, 1);
    const last  = new Date(y, m, 0);
    const startMonthIso = `${y}-${String(m).padStart(2,'0')}-01`;
    const endMonthIso   = `${y}-${String(m).padStart(2,'0')}-${String(last.getDate()).padStart(2,'0')}`;
    const monthLabel = first.toLocaleDateString('es-ES', { month:'long', year:'numeric' });

    // Recolectar items de todos los viajes del perfil
    const trips = await DB.listByProfile('trips', dataProfile());
    const byDate = {};
    for (const t of trips) {
      const plan = await DB.listByTrip('planning_items', t.id);
      plan.forEach(p => {
        if (!p.day_date) return;
        if (p.day_date < startMonthIso || p.day_date > endMonthIso) return;
        (byDate[p.day_date] = byDate[p.day_date] || []).push({ p, t });
      });
    }

    // Construir grid de 7 columnas (Lun-Dom) + padding inicial
    const prevPad = (first.getDay() + 6) % 7;
    const wrap = el('div', {}, [
      el('div', { style:{display:'flex', alignItems:'center', gap:'10px', marginBottom:'14px', flexWrap:'wrap'} }, [
        el('button', { class:'icon-btn', 'aria-label':'Mes anterior', onclick: () => { const d = new Date(y, m - 2, 1); CalendarView._month = d.toISOString().slice(0,7); CalendarView._render(); }, html: svg('back') }),
        el('div', { style:{flex:'1', fontFamily:'var(--font-titulo)', fontWeight:'600', fontSize:'19px', letterSpacing:'-.025em', textTransform:'capitalize'}, text: monthLabel }),
        el('button', { class:'icon-btn', 'aria-label':'Mes siguiente', onclick: () => { const d = new Date(y, m, 1); CalendarView._month = d.toISOString().slice(0,7); CalendarView._render(); }, html: svg('back'), style:{transform:'rotate(180deg)'} }),
        el('button', { class:'btn btn-sm', onclick: () => { CalendarView._month = new Date().toISOString().slice(0,7); CalendarView._render(); } }, 'Hoy'),
      ]),
      el('div', { class:'cal-grid' }, [
        ...['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'].map(d => el('div', { class:'cal-head', text: d })),
        ...Array.from({length: prevPad}, () => el('div', { class:'cal-cell empty' })),
        ...Array.from({length: last.getDate()}, (_, i) => {
          const day = i + 1;
          const iso = `${y}-${String(m).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
          const items = byDate[iso] || [];
          return el('div', { class:'cal-cell' + (iso === todayIso() ? ' today' : '') + (iso < todayIso() ? ' past' : ''),
            onclick: items.length ? (() => {
              const first = items[0];
              Router.go('trip', { tripId: first.t.id, tab:'planning' });
              UI.closeSheet();
            }) : null
          }, [
            el('div', { class:'cal-day', text:String(day) }),
            ...items.slice(0,3).map(({p, t}) => el('div', {
              class: `cal-evt evt-${p.type}`,
              title: `${t.name}: ${p.title}`,
              text: p.title.slice(0, 22),
            })),
            items.length > 3 ? el('div', { class:'cal-more', text:`+${items.length - 3}` }) : null,
          ].filter(Boolean));
        }),
      ]),
    ]);
    UI.openSheet({
      title:'Calendario',
      body: wrap,
      footer:[el('button', { class:'btn btn-ghost', onclick: () => UI.closeSheet() }, 'Cerrar')],
    });
  },
};

/* ============================================================
   BOOT — defensivo: el selector de perfil se renderiza SIEMPRE
   antes de tocar IndexedDB / red. Si algo falla, se muestra un
   mensaje claro pero la pantalla nunca queda bloqueada.
   ============================================================ */
function showFatalError(msg) {
  console.error('Fatal:', msg);
  // Si es un error de BD, mostrar bloque con botones de recuperación
  ProfilePicker._showDbError({ message: msg });
}

let _booted = false;
async function boot() {
  if (_booted) return;
  _booted = true;
  // 1) Tema y listeners del header — instantáneos, no dependen de nada.
  try {
    STATE.theme = localStorage.getItem('viajes_theme') || 'auto';
    Theme.apply();
  } catch (e) { console.warn('theme', e); }
  document.getElementById('btn-theme')?.addEventListener('click', () => Theme.cycle());
  document.getElementById('btn-search')?.addEventListener('click', () => {
    if (STATE.view !== 'profile') GlobalSearch.open();
  });
  document.getElementById('btn-profile-menu')?.addEventListener('click', () => {
    if (STATE.view === 'profile') return;
    Router.go('perfil');
  });

  // 2) RENDER del selector de perfil ANTES de tocar IDB.
  //    Así, aunque la BD falle, el usuario ve los botones y no queda colgado.
  try { ProfilePicker.mount(); }
  catch (e) { console.error('ProfilePicker.mount', e); showFatalError('Error pintando perfiles'); }

  // 3) Abrir IndexedDB. Si falla, lo decimos en el pill pero seguimos.
  let dbOk = false;
  try { await DB.open(); dbOk = true; }
  catch (e) {
    console.error('DB.open', e);
    showFatalError('Error de base de datos: ' + (e?.message || 'desconocido'));
  }

  // 4) FX — opcional, nunca debe bloquear.
  if (dbOk) { try { await FX.load(); } catch (e) { console.warn('FX', e); } }

  // 5) Auto-login con el perfil guardado, si lo hay y la BD está OK.
  if (dbOk) {
    try {
      const saved = localStorage.getItem('viajes_profile');
      if (saved && PROFILES.some(p => p.id === saved)) {
        await ProfilePicker.choose(saved);
      } else {
        STATE.view = 'profile';
        Router.render();
      }
    } catch (e) { console.error('auto-login', e); }

    // Programar notificaciones si el usuario ya ha concedido permiso
    try {
      if ('Notification' in window && Notification.permission === 'granted') {
        Notifications.scheduleAll();
      }
    } catch (_) {}

    // Si veníamos de explorar.html con "Añadir como viaje", procesarlo ahora
    try { await PendingImport.checkAndProcess(); } catch (e) { console.warn(e); }
  }

  // 6) Service worker — registro + auto-update silencioso.
  if ('serviceWorker' in navigator) {
    try {
      const reg = await navigator.serviceWorker.register('service-worker.js');
      App._swReg = reg;   // accesible desde el botón "Buscar actualizaciones"
      // Si hay update, recarga automática (la app es de un solo usuario).
      let refreshing = false;
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (refreshing) return;
        refreshing = true;
        window.location.reload();
      });
      reg.addEventListener('updatefound', () => {
        const nw = reg.installing;
        nw && nw.addEventListener('statechange', () => {
          if (nw.state === 'installed' && navigator.serviceWorker.controller) {
            // Hay una nueva versión esperando — activa y recarga.
            nw.postMessage('SKIP_WAITING');
          }
        });
      });
      // Comprueba si hay una versión nueva: al volver online y, sobre todo, al volver
      // el foco / hacerse visible la app (así una PWA abierta mucho tiempo se actualiza
      // sola). Como el HTML es network-first, al recargar siempre carga la última versión.
      let _lastSwCheck = 0;
      const checkUpdate = () => {
        if (document.visibilityState === 'hidden') return;
        const now = Date.now();
        if (now - _lastSwCheck < 60000) return;   // como mucho 1 vez/minuto
        _lastSwCheck = now;
        reg.update().catch(() => {});
      };
      window.addEventListener('online', checkUpdate);
      window.addEventListener('focus', checkUpdate);
      document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') checkUpdate(); });
    } catch (e) { console.warn('SW register', e); }
  }

  // 7) Sync periódico (si Supabase está configurado)
  setInterval(() => { if (navigator.onLine && SYNC.enabled) SYNC.scheduleFlush(); }, 30000);
}

document.addEventListener('DOMContentLoaded', boot);
// Si DOMContentLoaded ya pasó (navegador rápido), arranca inmediatamente.
if (document.readyState === 'interactive' || document.readyState === 'complete') {
  setTimeout(boot, 0);
}
</script>
