          el('div', { class:'profile-sub', text: p.tag }),
        ]),
      ]);
      list.appendChild(btn);
    });
    const stat = $('#profile-status');
    const t = stat.querySelector('.t');
    const d = stat.querySelector('.dot');
    if (CFG.supabaseUrl) { t.textContent = 'Supabase configurado'; d.style.background = '#10b981'; }
    else { t.textContent = 'Modo local'; d.style.background = '#f59e0b'; }
  },

  async choose(profileId) {
    // Defensa contra clicks rápidos antes de que IDB esté inicializado.
    if (!DB.db) {
      const stat = document.getElementById('profile-status');
      if (stat) { stat.querySelector('.t').textContent = 'Abriendo base de datos…'; }
      try { await DB.open(); }
      catch (e) {
        console.error('DB open desde choose', e);
        ProfilePicker._showDbError(e);
        return;
      }
    }
    STATE.profile = profileId;
    localStorage.setItem('viajes_profile', profileId);
    SYNC.init();
    // Pull en background — no bloquea la entrada a la app.
    // Cuando termine, llama a Router.render() para que aparezcan los datos remotos.
    if (SYNC.enabled) {
      SYNC.pullAll()
        .then(() => { try { Router.render(); } catch (_) {} })
        .catch(e => console.warn('pull inicial', e));
    }
    await Router.go('trips');
  },

  _showDbError(err) {
    const screen = document.getElementById('profile-screen');
    if (!screen) return;
    // Quitar bloque existente si lo hay
    document.getElementById('db-error-block')?.remove();
    const block = el('div', { id:'db-error-block', class:'render-error', style:{maxWidth:'420px', width:'100%'} }, [
      el('strong', { text:'No se pudo abrir la base de datos' }),
      el('div', { text: err?.message || 'Error desconocido' }),
      el('div', { style:{marginTop:'12px', display:'flex', gap:'8px', flexWrap:'wrap'} }, [
        el('button', { class:'btn btn-sm', onclick: () => window.location.reload() }, 'Recargar'),
        el('button', { class:'btn btn-sm btn-danger', onclick: async () => {
          if (!confirm('Esto BORRA todos tus viajes locales y reinicia la app. ¿Continuar?')) return;
          try {
            if ('caches' in window) for (const k of await caches.keys()) await caches.delete(k);
            if (navigator.serviceWorker) {
              const regs = await navigator.serviceWorker.getRegistrations();
              for (const r of regs) await r.unregister();
            }
            if (DB.db) { try { DB.db.close(); } catch(_) {} DB.db = null; }
            await new Promise(res => { const r = indexedDB.deleteDatabase('viajes'); r.onsuccess=res; r.onerror=res; r.onblocked=res; });
            localStorage.clear();
          } catch (e) { console.warn(e); }
          window.location.reload(true);
        }}, 'Reset total (borra todo)'),
      ]),
    ]);
    screen.appendChild(block);
    const stat = document.getElementById('profile-status');
    if (stat) {
      stat.classList.add('error');
      stat.querySelector('.dot').style.background = '#ef4444';
      stat.querySelector('.t').textContent = 'Error: ' + (err?.message || 'BD no disponible').slice(0, 60);
    }
  },
};

/* ============================================================
   FX / divisas
   ============================================================ */
const FX = {
  async load() {
    // cache simple
    const cached = await DB.meta('fx_cache');
    if (cached && (Date.now() - cached.ts) < 6*3600*1000) {
      STATE.rates = cached;
      return;
    }
    if (!navigator.onLine) {
      if (cached) STATE.rates = cached;
      return;
    }
    try {
      // exchangerate.host puede pedir token; intentamos open.er-api.com como fallback gratis
      let data = null;
      try {
        const r = await fetch('https://open.er-api.com/v6/latest/EUR');
        const j = await r.json();
        if (j && j.rates) data = { base:'EUR', rates:j.rates };
      } catch (_) {}
      if (data) {
        data.ts = Date.now();
        STATE.rates = data;
        await DB.meta('fx_cache', data);
      }
    } catch (e) {
      console.warn('FX load', e);
    }
  },

  // 1 unidad de `cur` -> EUR
  rateToEur(cur) {
    if (!cur || cur === 'EUR') return 1;
    const r = STATE.rates?.rates?.[cur];
    if (!r || !isFinite(r) || r === 0) return null;
    return 1 / r; // rates están en "1 EUR = r CUR" → invertimos
  },
};

/* ============================================================
   VIEW — Trips (lista)
   ============================================================ */
const Trips = {
  async render(root, title, fab) {
    title.textContent = 'Viajes';
    const all = await DB.listByProfile('trips', dataProfile());

    // contadores por filtro
    const groups = { todos:[], curso:[], prep:[], prox:[], pas:[], aplazado:[], cancelado:[] };
    const today = todayIso();
    for (const t of all) {
      groups.todos.push(t);
      // Cancelados y aplazados viven en su propia pestaña y se sacan de las temporales.
      if (t.confirmation === 'cancelado') { groups.cancelado.push(t); continue; }
      if (t.confirmation === 'aplazado')  { groups.aplazado.push(t); continue; }
      const s = tripStatus(t);
      groups[s].push(t);
      // Si está "En preparación" pero la fecha es futura, también aparece en "Próximos"
      if (s === 'prep' && t.start_date && t.start_date > today) {
        groups.prox.push(t);
      }
    }

    // pestaña por defecto si no hay STATE.filter
    let defaultFilter = STATE.filter;
    if (!defaultFilter || !groups[defaultFilter] || (defaultFilter === 'curso' && groups.curso.length === 0)) {
      if (groups.curso.length) defaultFilter = 'curso';
      else if (groups.prep.length) defaultFilter = 'prep';
      else defaultFilter = 'prox';
    }
    STATE.filter = defaultFilter;

    // construcción de chips: 'En curso' solo si hay alguno; 'Todos' siempre
    const chips = [];
    if (groups.curso.length) chips.push({id:'curso', label:'En curso', n:groups.curso.length});
    chips.push({id:'prep', label:'En preparación', n:groups.prep.length});
    chips.push({id:'prox', label:'Próximos', n:groups.prox.length});
    chips.push({id:'pas',  label:'Pasados', n:groups.pas.length});
    if (groups.aplazado.length)  chips.push({id:'aplazado',  label:'Aplazados',  n:groups.aplazado.length});
    if (groups.cancelado.length) chips.push({id:'cancelado', label:'Cancelados', n:groups.cancelado.length});
    chips.push({id:'todos',label:'Todos', n:groups.todos.length});

    let filtered = groups[STATE.filter] || [];
    // sort
    if (STATE.sort === 'abc') filtered.sort((a,b) => a.name.localeCompare(b.name, 'es'));
    else {
      filtered.sort((a,b) => {
        const da = daysFromToday(a.start_date) ?? 99999;
        const db = daysFromToday(b.start_date) ?? 99999;
        return da - db;
      });
    }

    root.innerHTML = '';

    // Cabecera: título grande a la izquierda, 3 icon-btns a la derecha.
    // El filtro abre un dropdown inline (no sheet) justo debajo de los botones.
    const filterActive = (STATE.sort && STATE.sort !== 'fecha') ||
                         (STATE.groupBy && STATE.groupBy !== 'ninguno');
    const filterBtn = el('button', {
      class:'icon-btn' + (filterActive ? ' has-active' : ''),
      title:'Filtros y orden', 'aria-label':'Filtros y orden',
      'aria-haspopup':'menu', 'aria-expanded':'false', id:'btn-filter-toggle',
      onclick: (e) => { e.stopPropagation(); Trips._toggleFiltersDropdown(chips); },
      html: svg('filter'),
    });
    const calBtn = el('button', {
      class:'icon-btn', title:'Calendario de todos los viajes', 'aria-label':'Calendario de todos los viajes',
      onclick: () => Trips.openCalendar(),
      html: svg('cal'),
    });
    const headerRight = el('div', { class:'view-header-actions' }, [calBtn, filterBtn]);
    if (canEdit()) {
      headerRight.appendChild(el('button', {
        class:'icon-btn icon-btn-primary',
        title:'Nuevo viaje', 'aria-label':'Nuevo viaje',
        onclick: () => Trips.openTripEditor(),
        html: svg('plus'),
      }));
    }
    const externalUrl = (localStorage.getItem('viajes_planner_url') || CFG.externalPlannerUrl || './explorar.html').trim();
    if (externalUrl && canEdit()) {
      headerRight.appendChild(el('button', {
        class:'icon-btn',
        title:'Explorar opciones', 'aria-label':'Explorar opciones',
        onclick: () => { window.location.href = externalUrl; },
        html: svg('compass'),
      }));
    }
    root.appendChild(el('div', { class:'view-header view-header-trips' }, [
      el('h1', { class:'view-title', text: canEdit() ? 'Tus viajes' : 'Viajes' }),
      headerRight,
    ]));

    // Banner modo lector — solo si aplica, ya no en la subtitle.
    const viewingOther = isReadonly() && dataProfile() !== STATE.profile;
    if (isReadonly() || viewingOther) {
      const ownerName = PROFILES.find(p=>p.id===OWNER_PROFILE)?.name || OWNER_PROFILE;
      root.appendChild(el('div', { class:'view-readonly-line' }, [
        el('span', { class:'readonly-badge' }, [
          el('span', { html: svg('lock') }),
          STATE.profile === 'invitado' ? 'Invitado' : 'Modo lector',
        ]),
        viewingOther ? el('span', { class:'view-readonly-extra', text: ` · viendo datos de ${ownerName}` }) : null,
      ].filter(Boolean)));
    }

    // Contenedor donde se monta el dropdown de filtros (vacío salvo cuando está abierto).
    root.appendChild(el('div', { id:'filters-dropdown-host' }));

    // Mini-resumen del filtro activo — chip horizontal del estado seleccionado.
    const activeChip = chips.find(c => c.id === STATE.filter);
    if (activeChip) {
      root.appendChild(el('div', { class:'view-filter-summary' }, [
        el('span', { class:`dot dot-${activeChip.id}`, 'aria-hidden':'true' }),
        el('span', { class:'view-filter-name', text: activeChip.label }),
        el('span', { class:'view-filter-count', text: ` (${activeChip.n})` }),
      ]));
    }

    if (!filtered.length) {
      root.appendChild(el('div', { class:'empty' }, [
        el('div', { class:'icon', html: svg('plane') }),
        el('h3', { text:'Aún no hay viajes aquí' }),
        el('p', { text:'Crea uno con el botón "Nuevo viaje" o conviértelo desde tus opciones.' }),
      ]));
      return;
    }

    if (STATE.groupBy === 'ninguno') {
      const grid = el('div', { class:'trip-grid' });
      filtered.forEach(t => grid.appendChild(Trips.card(t)));
      root.appendChild(grid);
    } else {
      // Agrupar por año (de start_date) o por país
      const groups = new Map();
      filtered.forEach(t => {
        let key;
        if (STATE.groupBy === 'año') {
          key = t.start_date ? t.start_date.slice(0,4) : 'Sin fecha';
        } else {
          key = (t.country || '').trim() || 'Sin país';
        }
        if (!groups.has(key)) groups.set(key, []);
        groups.get(key).push(t);
      });
      // Orden de grupos: años desc, países alfabéticos
      const sortedKeys = Array.from(groups.keys()).sort((a, b) => {
        if (STATE.groupBy === 'año') return b.localeCompare(a);
        return a.localeCompare(b, 'es');
      });
      sortedKeys.forEach(key => {
        root.appendChild(el('h2', { class:'section-title', style:{margin:'24px 0 12px'} }, [
          key,
          el('span', { class:'muted', style:{marginLeft:'10px', fontSize:'14px', fontWeight:'400'},
            text:`· ${groups.get(key).length} ${groups.get(key).length === 1 ? 'viaje' : 'viajes'}` }),
        ]));
        const grid = el('div', { class:'trip-grid' });
        groups.get(key).forEach(t => grid.appendChild(Trips.card(t)));
        root.appendChild(grid);
      });
    }
  },

  // Calendario GLOBAL: un mes navegable con TODOS los viajes (cada uno con su color),
  // para ver de un vistazo dónde caen los viajes y los puentes. Tocar un día abre su viaje.
  async openCalendar() {
    const PALETTE = ['#2563eb','#16a34a','#f97316','#a855f7','#ec4899','#0891b2','#ca8a04','#dc2626','#0d9488','#7c3aed','#db2777','#0ea5e9'];
    const trips = (await DB.listByProfile('trips', dataProfile()))
      .filter(t => t.start_date && t.end_date && t.confirmation !== 'cancelado')
      .sort((a, b) => (a.start_date || '').localeCompare(b.start_date || ''));
    const tripColor = {}; trips.forEach((t, i) => { tripColor[t.id] = PALETTE[i % PALETTE.length]; });
    // Confirmación del viaje (para el puntito de estado): confirmado/dudoso/aplazado/
    // sin fecha tienen color; "sin definir" = en preparación (punto hueco).
    const confOf = (t) => TRIP_CONFIRMATIONS.find(c => c.id === (t.confirmation || '')) || TRIP_CONFIRMATIONS[0];
    const fmtKey = (dt) => `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`;
    const tripByDay = {};
    for (const t of trips) {
      let d = parseDate(t.start_date); const end = parseDate(t.end_date); let guard = 0;
      while (d <= end && guard++ < 1200) { (tripByDay[fmtKey(d)] = tripByDay[fmtKey(d)] || []).push(t); d.setDate(d.getDate() + 1); }
    }
    const today = todayIso();
    const openTrip = (id) => { close(); Router.go('trip', { tripId: id, tab: 'resumen' }); };

    const close = () => { document.removeEventListener('keydown', onKey); document.body.classList.remove('sheet-open'); overlay.remove(); };
    const onKey = (e) => { if (e.key === 'Escape') close(); else if (e.key === 'ArrowLeft') step(-1); else if (e.key === 'ArrowRight') step(1); };

    const ref = parseDate(today);
    let view = new Date(ref.getFullYear(), ref.getMonth(), 1);
    const monthEl = el('div', { class:'tcal-month' });
    const grid = el('div', { class:'tcal-grid gcal-grid' });
    const WD = ['L','M','X','J','V','S','D'];

    const renderMonth = () => {
      const y = view.getFullYear(), m = view.getMonth();
      const ml = view.toLocaleDateString('es-ES', { month:'long' });
      monthEl.textContent = `${ml.charAt(0).toUpperCase() + ml.slice(1)} ${y}`;
      grid.innerHTML = '';
      const offset = (new Date(y, m, 1).getDay() + 6) % 7;
      const daysInMonth = new Date(y, m + 1, 0).getDate();
      const weeks = Math.ceil((offset + daysInMonth) / 7);
      const start = new Date(y, m, 1 - offset);
      for (let i = 0; i < weeks * 7; i++) {
        const dt = new Date(start.getFullYear(), start.getMonth(), start.getDate() + i);
        const key = fmtKey(dt);
        const inMonth = dt.getMonth() === m;
        const isToday = key === today;
        const dts = tripByDay[key] || [];
        if (dts.length) {
          const cell = el('button', {
            class:'gcal-cell has-trip' + (isToday ? ' today' : '') + (inMonth ? '' : ' out') + (dts.length > 1 ? ' multi' : ''),
            title: dts.map(t => t.name).join(' · '),
            onclick: () => openTrip(dts[0].id),
          }, [ el('span', { class:'gcal-num', text: String(dt.getDate()) }) ]);
          cell.style.setProperty('--trip-col', tripColor[dts[0].id]);
          // Puntito de estado (confirmación) del viaje.
          const cf = confOf(dts[0]);
          const sdot = el('span', { class:'gcal-status-dot' + (cf.hex ? '' : ' prep') });
          if (cf.hex) sdot.style.background = cf.hex;
          cell.appendChild(sdot);
          grid.appendChild(cell);
        } else {
          grid.appendChild(el('div', { class:'gcal-cell' + (isToday ? ' today' : '') + (inMonth ? '' : ' out') }, [ el('span', { class:'gcal-num', text: String(dt.getDate()) }) ]));
        }
      }
    };
    const step = (n) => { view = new Date(view.getFullYear(), view.getMonth() + n, 1); renderMonth(); };

    // Deslizar para cambiar de mes.
    let _tx = 0, _ty = 0;
    grid.addEventListener('touchstart', (e) => { const c = e.changedTouches[0]; _tx = c.clientX; _ty = c.clientY; }, { passive:true });
    grid.addEventListener('touchend', (e) => { const c = e.changedTouches[0]; const dx = c.clientX - _tx, dy = c.clientY - _ty; if (Math.abs(dx) > 45 && Math.abs(dx) > Math.abs(dy) * 1.4) step(dx < 0 ? 1 : -1); }, { passive:true });

    // Leyenda de viajes (plegable): color + nombre + fechas; tocar abre el viaje.
    const legendInner = trips.length ? trips.map(t => {
      const dot = el('span', { class:'gcal-legend-dot' }); dot.style.background = tripColor[t.id];
      const cf = confOf(t);
      const status = (() => {
        const sd = el('span', { class:'gcal-status-dot' + (cf.hex ? '' : ' prep') });
        if (cf.hex) sd.style.background = cf.hex;
        return el('span', { class:'gcal-legend-state' }, [ sd, el('span', { text: cf.hex ? cf.label : 'En preparación' }) ]);
      })();
      return el('button', { class:'gcal-legend-item', onclick: () => openTrip(t.id) }, [
        dot,
        el('div', { class:'gcal-legend-main' }, [
          el('span', { class:'gcal-legend-name', text: t.name }),
          status,
        ]),
        el('span', { class:'gcal-legend-dates', text: `${fmtDateShort(t.start_date)} – ${fmtDateShort(t.end_date)}` }),
      ]);
    }) : [ el('div', { class:'tcal-hint', style:{ margin:'0', textAlign:'left' }, text:'No hay viajes con fechas todavía.' }) ];
    const legendWrap = el('div', { class:'gcal-legend' }, legendInner);
    legendWrap.style.display = 'none';
    const legendToggle = el('button', { class:'tcal-legend-toggle', onclick: () => {
      const open = legendWrap.style.display === 'none';
      legendWrap.style.display = open ? '' : 'none';
      legendToggle.classList.toggle('open', open);
    } }, [ el('span', { text:`Viajes (${trips.length})` }), el('span', { class:'tcal-legend-chev', html: svg('chevron') }) ]);

    const overlay = el('div', { class:'calview' }, [
      el('div', { class:'flash-top' }, [
        el('div', { class:'flash-title', text:'Calendario · todos los viajes' }),
        el('button', { class:'flash-close', 'aria-label':'Cerrar', onclick: close, html: svg('close') }),
      ]),
      el('div', { class:'tcal-scroll' }, [
        el('div', { class:'tcal-inner' }, [
          el('div', { class:'tcal-monthbar' }, [
            el('button', { class:'tcal-nav', 'aria-label':'Mes anterior', onclick: () => step(-1), html: svg('back') }),
            monthEl,
            el('button', { class:'tcal-nav next', 'aria-label':'Mes siguiente', onclick: () => step(1), html: svg('back') }),
          ]),
          el('div', { class:'tcal-weekdays' }, WD.map(w => el('div', { class:'tcal-wd', text: w }))),
          grid,
          el('div', { class:'tcal-legend-box' }, [ legendToggle, legendWrap ]),
          el('div', { class:'tcal-hint', text:'Toca un día con viaje para abrirlo · desliza para cambiar de mes.' }),
        ]),
      ]),
    ]);
    document.body.appendChild(overlay);
    document.addEventListener('keydown', onKey);
    renderMonth();
  },

  card(t) {
    const status = tripStatus(t);
    // Multi-país: si hay varios separados por comas, muéstralos como flag chips
    const countries = (t.country || '').split(',').map(s => s.trim()).filter(Boolean);
    const cities = (t.city || '').split(',').map(s => s.trim()).filter(Boolean);
    const dest = cities.concat(countries).join(' · ');
    const cover = el('div', { class:'trip-card-cover' });
    // Prioridad: foto local (cover_blob_id) > URL externa (cover_photo_url) > gradient
    // Si el blob_id quedó huérfano (registro sin blob real), caemos en URL.
    if (t.cover_blob_id) {
      // No usamos atributos HTML width/height en imgs absolutas — pueden hacer que
      // el grid item considere la anchura intrínseca (1100) como mínimo y desborde
      // el viewport en móvil. El img usa width:100% via CSS sobre position:absolute.
      const img = el('img', {
        src: '', alt:'',
        loading:'lazy', decoding:'async',
        onerror: function(){ this.remove(); }
      });
      MediaCache.urlFor(t.cover_blob_id).then(url => {
        if (url) { img.src = url; }
        else {
          // Blob huérfano: limpiar la referencia y mostrar URL si existe
          img.remove();
          if (t.cover_photo_url) {
            cover.appendChild(el('img', { src: t.cover_photo_url, alt:'',
              loading:'lazy', decoding:'async',
              onerror: function(){ this.remove(); } }));
          }
          // Auto-limpieza
          t.cover_blob_id = null;
          DB.put('trips', t).catch(()=>{});
        }
      });
      cover.appendChild(img);
    } else if (t.cover_photo_url) {
      cover.appendChild(el('img', {
        src: t.cover_photo_url, alt:'',
        loading:'lazy', decoding:'async',
        onerror: function(){ this.remove(); }
      }));
    }
    cover.appendChild(el('div', { class:'trip-card-status' }, [ el('span', { class:`dot dot-${status}` }), statusLabel(status) ]));
    cover.appendChild(el('div', { class:'trip-card-name', text: t.name }));
    // Sin fecha concreta: la portada no muestra un rango definitivo, solo la etiqueta.
    const metaChildren = (t.confirmation === 'sin_fecha')
      ? [ el('span', { text:'Fechas probables' }) ]
      : [ fmtTripDateRange(t.start_date, t.end_date), el('span', { class:'sep', text:'•' }), statusDays(t) ];
    cover.appendChild(el('div', { class:'trip-card-meta' }, metaChildren));

    const foot = el('div', { class:'trip-card-foot' });
    foot.appendChild(el('div', { class:'destino', text: dest || '—' }));
    if (canEdit()) {
      const sw = el('label', { class:'switch' }, [
        el('input', {
          type:'checkbox',
          checked: t.in_preparation ? true : null,
          onchange: async (e) => {
            e.stopPropagation();
            t.in_preparation = e.target.checked;
            await DB.put('trips', t);
            Router.render();
          }
        }),
        el('span', { class:'switch-track' }),
        el('span', { text:'Preparando' }),
      ]);
      sw.addEventListener('click', e => e.stopPropagation());
      foot.appendChild(sw);
    } else {
      foot.appendChild(el('span', { class:'readonly-badge' }, [
        el('span', { html: svg('eye') }), 'Solo lectura'
      ]));
    }

    // Franja inferior extra: fechas probables (sin_fecha) o motivo (cancelado/aplazado).
    let reasonEl = null;
    if (t.confirmation === 'sin_fecha') {
      const range = (t.start_date || t.end_date) ? fmtTripDateRange(t.start_date, t.end_date) : 'por definir';
      reasonEl = el('div', { class:'trip-card-reason' }, [
        el('span', { class:'trip-card-reason-label', text:'Fechas probables:' }),
        el('span', { class:'trip-card-reason-text', text: range }),
      ]);
    } else if (CONF_NEEDS_REASON.includes(t.confirmation) && (t.confirmation_reason || '').trim()) {
      const cLabel = TRIP_CONFIRMATIONS.find(c => c.id === t.confirmation)?.label || '';
      reasonEl = el('div', { class:'trip-card-reason' }, [
        el('span', { class:'trip-card-reason-label', text: cLabel + ':' }),
        el('span', { class:'trip-card-reason-text', text: t.confirmation_reason.trim() }),
      ]);
    }
    const confClass = t.confirmation ? ` conf-${t.confirmation}` : '';
    return el('div', {
      class:`card trip-card interactive${confClass}`,
      onclick: () => Router.go('trip', { tripId: t.id, tab:'resumen' })
    }, [ cover, foot, reasonEl ].filter(Boolean));
  },

  // Dropdown inline con todos los controles de orden + agrupación + estado.
  // Se monta debajo del header — sin sheet. Recibe los chips ya calculados por render().
  _toggleFiltersDropdown(chips) {
    const host = document.getElementById('filters-dropdown-host');
    const btn  = document.getElementById('btn-filter-toggle');
    if (!host) return;
    // Si ya está abierto, cerrar.
    if (host.querySelector('.filters-dropdown')) {
      host.innerHTML = '';
      btn?.setAttribute('aria-expanded', 'false');
      return;
    }

    const renderDropdown = () => {
      host.innerHTML = '';
      const body = el('div', { class:'filters-body filters-dropdown',
        role:'menu', 'aria-label':'Filtros y orden',
        onclick: (e) => e.stopPropagation() });

      // ESTADO
      body.appendChild(el('div', { class:'filters-section' }, [
        el('div', { class:'filters-section-title', text:'Mostrar' }),
        (() => {
          const wrap = el('div', { class:'filters-status-list' });
          chips.forEach(c => {
            const isActive = c.id === STATE.filter;
            wrap.appendChild(el('button', {
              class: 'filters-status-btn' + (isActive ? ' active' : ''),
              onclick: () => { STATE.filter = c.id; Router.render(); renderDropdown(); }
            }, [
              el('span', { class:`dot dot-${c.id}`, 'aria-hidden':'true' }),
              el('span', { class:'filters-status-label', text: c.label }),
              el('span', { class:'filters-status-count', text: String(c.n) }),
            ]));
          });
          return wrap;
        })(),
      ]));

      // ORDENAR
      body.appendChild(el('div', { class:'filters-section' }, [
        el('div', { class:'filters-section-title', text:'Ordenar por' }),
        (() => {
          const seg = el('div', { class:'segmented filters-segmented' });
          [['fecha','Por fecha'],['abc','A–Z']].forEach(([id,lbl]) => {
            seg.appendChild(el('button', {
              class: STATE.sort === id ? 'active' : '',
              onclick: () => { STATE.sort = id; Router.render(); renderDropdown(); }
            }, lbl));
          });
          return seg;
        })(),
      ]));

      // AGRUPAR
      body.appendChild(el('div', { class:'filters-section' }, [
        el('div', { class:'filters-section-title', text:'Agrupar' }),
        (() => {
          const seg = el('div', { class:'segmented filters-segmented' });
          [['ninguno','Sin agrupar'],['año','Por año'],['país','Por país']].forEach(([id,lbl]) => {
            seg.appendChild(el('button', {
              class: STATE.groupBy === id ? 'active' : '',
              onclick: () => { STATE.groupBy = id; Router.render(); renderDropdown(); }
            }, lbl));
          });
          return seg;
        })(),
      ]));

      host.appendChild(body);
    };
    renderDropdown();
    btn?.setAttribute('aria-expanded', 'true');
    // Cierre al clicar fuera del dropdown
    const closeOnOutside = (e) => {
      if (e.target.closest('.filters-dropdown') || e.target.closest('#btn-filter-toggle')) return;
      host.innerHTML = '';
      btn?.setAttribute('aria-expanded', 'false');
      document.removeEventListener('click', closeOnOutside, true);
    };
    setTimeout(() => document.addEventListener('click', closeOnOutside, true), 0);
  },

  // Configurar las pestañas del menú del viaje: mostrar/ocultar y reordenar.
  openTabsConfig(t) {
    if (!canEdit()) { UI.toast('Modo lector — no puedes modificar'); return; }
    const ALL = [
      { id:'resumen', label:'Resumen', lock:true },
      { id:'planning', label:'Planning' },
      { id:'presu', label:'Presupuesto' },
      { id:'maleta', label:'Maleta' },
      { id:'reservas', label:'Reservas' },
      { id:'mapa', label:'Mapa' },
      { id:'personas', label:'Personas' },
      { id:'destino', label:'Ficha destino' },
      { id:'gastos', label:'Compartir gastos' },
      { id:'diario', label:'Diario' },
      { id:'estadisticas', label:'Estadísticas' },
      ...((/espa[ñn]a/i.test(t.country||'') || /espa[ñn]a/i.test(t.name||'')) ? [{ id:'pablo', label:'Pablo' }] : []),
    ];
    const body = el('div', { class:'tabs-config' });
    const render = () => {
      body.innerHTML = '';
      const s = tripSettings(t);
      const hidden = new Set(Array.isArray(s.tabs_hidden) ? s.tabs_hidden : (Array.isArray(t.tabs_hidden) ? t.tabs_hidden : []));
      const order = Array.isArray(s.tabs_order) ? s.tabs_order : (Array.isArray(t.tabs_order) ? t.tabs_order : []);
      const ordered = ALL.slice().sort((a, b) => { const ia = order.indexOf(a.id), ib = order.indexOf(b.id); if (ia === -1 && ib === -1) return 0; if (ia === -1) return 1; if (ib === -1) return -1; return ia - ib; });
      body.appendChild(el('div', { class:'field-hint', style:{margin:'0 0 10px'}, text:'Activa o desactiva pestañas y reordénalas con las flechas. "Resumen" no se puede ocultar.' }));
      ordered.forEach((tb, idx) => {
        const isHidden = hidden.has(tb.id);
        const setOrder = async (dir) => {
          const ids = ordered.map(x => x.id); const j = idx + dir;
          if (j < 0 || j >= ids.length) return;
          [ids[idx], ids[j]] = [ids[j], ids[idx]];
          tripSettingsMut(t).tabs_order = ids; await DB.put('trips', t); render();
        };
        body.appendChild(el('div', { class:'tab-config-row' + (isHidden ? ' off' : '') }, [
          el('button', { class:'icon-btn', title:'Subir', html: svg('arrup'), disabled: idx === 0 ? true : null, onclick: () => setOrder(-1) }),
          el('button', { class:'icon-btn', title:'Bajar', html: svg('arrdown'), disabled: idx === ordered.length - 1 ? true : null, onclick: () => setOrder(1) }),
          el('span', { class:'tab-config-label', text: tb.label }),
          el('button', { class:'icon-btn tab-vis' + (isHidden ? '' : ' on'), title: tb.lock ? 'Siempre visible' : (isHidden ? 'Mostrar' : 'Ocultar'),
            disabled: tb.lock ? true : null, html: svg('eye'),
            onclick: async () => { if (tb.lock) return; const h = new Set(hidden); h.has(tb.id) ? h.delete(tb.id) : h.add(tb.id); tripSettingsMut(t).tabs_hidden = [...h]; await DB.put('trips', t); render(); } }),
        ]));
      });
    };
    render();
    UI.openSheet({ title:'Pestañas del menú', body,
      footer:[ el('button', { class:'btn btn-primary', onclick: () => { UI.closeSheet(); Router.render(); } }, 'Listo') ] });
  },

  openTripEditor(existing=null) {
    if (!canEdit()) { UI.toast('Modo lector: no puedes modificar viajes'); return; }
    const t = existing || {

  // === Papelera ===
  // Lista todos los items soft-eliminados del viaje (deleted_at != null)
  // y permite restaurarlos o purgarlos definitivamente.
  async openTrash(t) {
    if (!canEdit()) { UI.toast('Modo lector'); return; }
    const TRASH_TABLES = [
      { key:'planning_items', label:'Paradas del planning' },
      { key:'budget_items',   label:'Gastos' },
      { key:'bookings',       label:'Reservas' },
      { key:'packing_items',  label:'Items de maleta' },
      { key:'day_notes',      label:'Notas del día' },
      { key:'shared_expenses',label:'Gastos compartidos' },
      { key:'diary',          label:'Entradas del diario' },
      { key:'emergency_contacts', label:'Contactos' },
      { key:'phrases',        label:'Frases' },
    ];
    const buckets = {};
    let total = 0;
    for (const tdef of TRASH_TABLES) {
      // getAllFromIndex(by_trip, tripId) NO devuelve los deleted_at-soft (por DB.listByTrip filter).
      // Aquí los queremos TODOS para mostrar la papelera.
      const all = await DB.db.getAllFromIndex(tdef.key, 'by_trip', t.id);
      const deleted = all.filter(r => r.deleted_at);
      if (deleted.length) {
        buckets[tdef.key] = { label: tdef.label, items: deleted };
        total += deleted.length;
      }
    }

    if (!total) {
      const body = el('div', { class:'empty', style:{padding:'24px'} }, [
        el('div', { class:'icon', html: svg('trash') }),
        el('h3', { text:'Papelera vacía' }),
        el('p', { text:'Aquí aparecerán los elementos que borres del viaje. Podrás recuperarlos durante 30 días o descartarlos para siempre.' }),
      ]);
      UI.openSheet({
        title:'Papelera del viaje', body,
        footer:[el('button', { class:'btn btn-ghost', onclick: () => Trips.openTripEditor(t) }, 'Volver')]
      });
      return;
    }

    const body = el('div', {});
    body.appendChild(el('p', { class:'muted', style:{marginTop:0}, text:`${total} elemento${total>1?'s':''} en la papelera. Restaura los que necesites o descártalos definitivamente.` }));

    for (const [key, b] of Object.entries(buckets)) {
      body.appendChild(el('h3', { class:'section-title', style:{fontSize:'15px', margin:'18px 0 8px'}, text: b.label }));
      const list = el('div', { class:'list' });
      for (const r of b.items) {
        const sub = r.deleted_at ? `Eliminado ${fmtDateShort(r.deleted_at.slice(0,10))}` : '';
        list.appendChild(el('div', { class:'list-item' }, [
          el('div', { class:'li-main' }, [
            el('div', { class:'li-title', text: Trips._labelForTrashItem(key, r) }),
            el('div', { class:'li-sub', text: sub }),
          ]),
          el('div', { class:'li-actions' }, [
            el('button', { class:'btn btn-sm', onclick: async () => {
              delete r.deleted_at;
              r.updated_at = nowIso();
              await DB.put(key, r);
              UI.toast('Recuperado');
              Trips.openTrash(t);
            }}, [ el('span', { html: svg('refresh') }), 'Recuperar' ]),
            el('button', { class:'icon-btn', title:'Descartar definitivamente', onclick: async () => {
              const ok = await UI.confirm('¿Descartar este elemento definitivamente? Esta acción es irreversible.');
              if (!ok) return;
              await DB.db.delete(key, r.id);
              UI.toast('Descartado');
              Trips.openTrash(t);
            }, html: svg('trash') }),
          ]),
        ]));
      }
      body.appendChild(list);
    }

    UI.openSheet({
      title:'Papelera del viaje',
      body,
      footer:[
        el('button', { class:'btn btn-ghost', onclick: () => Trips.openTripEditor(t) }, 'Volver'),
        el('button', { class:'btn btn-danger', onclick: async () => {
          const ok = await UI.confirm(`¿Vaciar la papelera entera (${total} elementos)? Irreversible.`);
          if (!ok) return;
          for (const [key, b] of Object.entries(buckets)) {
            for (const r of b.items) await DB.db.delete(key, r.id);
          }
          UI.toast('Papelera vaciada');
          Trips.openTripEditor(t);
        }}, 'Vaciar papelera'),
      ]
    });
  },

  _labelForTrashItem(key, r) {
    if (key === 'planning_items') return r.title || '(sin título)';
    if (key === 'budget_items')   return `${r.concept || '?'} · ${fmtMoney(r.amount, r.currency || 'EUR')}`;
    if (key === 'bookings')       return `${r.type} · ${r.structured_data?.nombre || r.structured_data?.aerolinea || '?'}`;
    if (key === 'packing_items')  return r.name || '?';
    if (key === 'day_notes')      return `Nota ${r.date || ''}`;
    if (key === 'shared_expenses')return `${r.concept || '?'} · ${fmtMoney(r.amount, r.currency || 'EUR')}`;
    if (key === 'diary')          return `Diario ${r.date || ''}`;
    if (key === 'emergency_contacts') return r.name || '?';
    if (key === 'phrases')        return r.phrase_local || '?';
    return r.id;
  },

  async deleteCascade(tripId) {
    const tables = ['trip_legs','planning_items','budget_items','bookings','inquiries','wishlist_items','day_notes','packing_items','addresses','destination_info','emergency_contacts','phrases','shared_expenses','diary'];
    for (const t of tables) {
      const rows = await DB.db.getAllFromIndex(t, 'by_trip', tripId);
      for (const r of rows) await DB.remove(t, r.id);
    }
    await DB.remove('trips', tripId);
  },
};

const TripDetail = {

  // Duplica el viaje completo: clona el registro del viaje y todos sus hijos
  // (planning, presupuesto, maleta, etc.) con ids nuevos, remapeando las referencias
  // internas (leg_id, planning_item_id). La copia es independiente del original.
  async _duplicateTrip(t) {
    if (!canEdit()) { UI.toast('Modo lector: no puedes duplicar'); return; }
    const childTables = ['trip_legs','planning_items','budget_items','bookings','inquiries',
      'wishlist_items','day_notes','packing_items','addresses','destination_info',
      'emergency_contacts','phrases','shared_expenses','diary'];
    try {
      UI.toast('Duplicando viaje…');
      // 1) Cargar todos los hijos (sin papelera) y mapear ids viejos → nuevos.
      const childData = {};
      const idMap = {};
      for (const tbl of childTables) {
        const rows = await DB.listByTrip(tbl, t.id).catch(() => []);
        childData[tbl] = rows;
        rows.forEach(r => { idMap[r.id] = uuid(); });
      }
      // 2) Nuevo viaje (copia no compartida; portada como blob independiente).
      const newTrip = { ...t, id: uuid(), name: `${t.name} Copia`, is_shared: false };
      delete newTrip.updated_at; delete newTrip.deleted_at;
      // La copia arranca "a cero": se conserva la plantilla de pendientes pero todo sin marcar.
      // (map crea un array nuevo: no muta los pendientes del viaje original.)
      if (Array.isArray(newTrip.pending_items)) {
        newTrip.pending_items = newTrip.pending_items.map(p => ({ ...p, done: false }));
      }
      if (t.cover_blob_id) {
        try {
          const media = await DB.getMedia(t.cover_blob_id);
          if (media && media.blob) newTrip.cover_blob_id = await DB.saveMedia(media.blob, media.mime);
        } catch (_) {}
      }
      await DB.put('trips', newTrip);
      // 3) Clonar los hijos con ids remapeados y referencias internas reapuntadas.
      let n = 0;
      for (const tbl of childTables) {
        for (const r of childData[tbl]) {
          const clone = { ...r, id: idMap[r.id], trip_id: newTrip.id };
          delete clone.updated_at; delete clone.deleted_at;
          if (clone.leg_id && idMap[clone.leg_id]) clone.leg_id = idMap[clone.leg_id];
          if (clone.planning_item_id && idMap[clone.planning_item_id]) clone.planning_item_id = idMap[clone.planning_item_id];
          // La maleta se copia entera pero "a cero": todo sin marcar.
          if (tbl === 'packing_items') clone.checked = false;
          await DB.put(tbl, clone);
          n++;
        }
      }
      UI.toast(`Viaje duplicado (${n} elemento${n === 1 ? '' : 's'})`);
      Router.go('trip', { tripId: newTrip.id, tab: 'resumen' });
    } catch (e) {
      console.error(e);
      UI.toast('No se pudo duplicar el viaje');
    }
  },

  async render(root, title, fab) {
    const t = await DB.get('trips', STATE.currentTripId);
    if (!t) { Router.go('trips'); return; }

    title.textContent = t.name;
    root.innerHTML = '';

    // Topbar: un único botón de menú hamburguesa con todas las acciones del viaje.
    // Más limpio que 3 iconos sueltos en móvil.
    const extras = document.getElementById('topbar-extras');
    if (extras) {
      extras.innerHTML = '';
      // Enlace directo al calendario del viaje (disponible en todas las pestañas).
      extras.appendChild(el('button', {
        class:'icon-btn', title:'Calendario del viaje', 'aria-label':'Calendario del viaje',
        onclick: () => TripDetail.openPlanningCalendar(t),
        html: svg('cal'),
      }));
      extras.appendChild(el('button', {
        class:'icon-btn', title:'Más opciones', 'aria-label':'Más opciones de este viaje',
        onclick: () => TripDetail._openActionsMenu(t),
        html: svg('menu'),
      }));
    }

    // Portada (foto del viaje) — visible solo en desktop, oculta en móvil por CSS.
    if (t.cover_blob_id || t.cover_photo_url) {
      const coverWrap = el('div', { class:'trip-detail-cover-wrap', style:{ overflow:'hidden' } });
      const cover = el('div', { class:'trip-card-cover trip-detail-cover-inner' });
      if (t.cover_blob_id) {
        const img = el('img', { src:'', alt:'', loading:'lazy', decoding:'async',
          onerror: function(){ this.remove(); } });
        MediaCache.urlFor(t.cover_blob_id).then(url => { if (url) img.src = url; else img.remove(); });
        cover.appendChild(img);
      } else if (t.cover_photo_url) {
        cover.appendChild(el('img', { src: t.cover_photo_url, alt:'', loading:'lazy', decoding:'async',
          onerror: function(){ this.remove(); } }));
      }
      coverWrap.appendChild(cover);
      root.appendChild(coverWrap);
    }

    // Título grande estilo Apple (como las recetas) + subtítulo con fechas + faltan X días.
    // Sin destino (ya estaba duplicado con el nombre del viaje en muchos casos).
    root.appendChild(el('h1', { class:'trip-detail-title', text: t.name }));
    const subDates = (t.start_date && t.end_date)
      ? `${fmtDateShort(t.start_date)} – ${fmtDateShort(t.end_date)}` : 'Sin fechas';
    root.appendChild(el('div', { class:'trip-detail-sub' }, [
      el('span', { text: subDates }),
      el('span', { class:'sep', text:' · ' }),
      el('span', { text: statusDays(t) }),
    ]));

    // Banner modo lector
    if (isReadonly()) {
      root.appendChild(el('div', { class:'readonly-banner', style:{marginTop:'12px'} }, [
        el('div', { class:'ico', html: svg('lock') }),
        el('div', { text:'Modo lector — solo puedes consultar este viaje, no editarlo.' }),
      ]));
    }

    // Banner aviso de documentos
    const docs = await DB.listByProfile('travel_docs', STATE.profile);
    if (t.start_date && docs.length) {
      const tripStart = parseDate(t.start_date);
      const sixMonthsAfter = new Date(tripStart); sixMonthsAfter.setMonth(sixMonthsAfter.getMonth() + 6);
      const expiring = docs.filter(d => d.expiry_date && parseDate(d.expiry_date) <= sixMonthsAfter);
      if (expiring.length) {
        const banner = el('div', { class:'banner warn', style:{marginTop:'16px'} }, [
          el('div', { class:'ico', html: svg('warn') }),
          el('div', { class:'banner-body' }, [
            el('strong', { text:'Aviso de documentación: ' }),
            `Tu ${expiring.map(d => `${d.type} (caduca ${fmtDateShort(d.expiry_date)})`).join(', ')} podría no cubrir todo el viaje. Verifica los requisitos de entrada.`,
          ]),
        ]);
        root.appendChild(banner);
      }
    }

    // ¿El viaje tiene encuentros con personas? Solo entonces aparece la pestaña Personas.
    const _planAll = await DB.listByTrip('planning_items', t.id).catch(() => []);
    const _hasPeople = _planAll.some(p => Array.isArray(p.people) && p.people.length);

    // Sub-tabs — Invitado no ve pestañas financieras.
    // Candidatas disponibles (según condiciones); luego se aplican ocultas/orden
    // configurados en el viaje (Editar viaje → Pestañas del menú).
    const tabCandidates = [
      { id:'resumen',   label:'Resumen' },
      { id:'planning',  label:'Planning' },
      canSeeMoney() ? { id:'presu',    label:'Presupuesto' } : null,
      { id:'maleta',    label:'Maleta' },
      { id:'reservas',  label:'Reservas' },
      { id:'mapa',      label:'Mapa' },
      _hasPeople ? { id:'personas', label:'Personas' } : null,
      { id:'destino',   label:'Ficha destino' },
      (t.is_shared && canSeeMoney()) ? { id:'gastos', label:'Compartir gastos' } : null,
      { id:'diario', label:'Diario' },
      { id:'estadisticas', label:'Estadísticas' },
      // Pestaña exclusiva del viaje "España": armario del bebé (app embebida).
      (/espa[ñn]a/i.test(t.country||'') || /espa[ñn]a/i.test(t.name||'')) ? { id:'pablo', label:'Pablo' } : null,
    ].filter(Boolean);
    // Aplicar ocultas (nunca se oculta 'resumen') y el orden personalizado.
    const _ts = tripSettings(t);
    const _hiddenRaw = Array.isArray(_ts.tabs_hidden) ? _ts.tabs_hidden : (Array.isArray(t.tabs_hidden) ? t.tabs_hidden : []);
    const tabsHidden = new Set(_hiddenRaw.filter(id => id !== 'resumen'));
    const tabsOrder = Array.isArray(_ts.tabs_order) ? _ts.tabs_order : (Array.isArray(t.tabs_order) ? t.tabs_order : []);
    let tabs = tabCandidates.filter(tb => !tabsHidden.has(tb.id));
    if (tabsOrder.length) tabs.sort((a, b) => { const ia = tabsOrder.indexOf(a.id), ib = tabsOrder.indexOf(b.id); if (ia === -1 && ib === -1) return 0; if (ia === -1) return 1; if (ib === -1) return -1; return ia - ib; });
    if (!tabs.length) tabs = [{ id:'resumen', label:'Resumen' }];

    // 'pendientes' es enrutable (se abre desde la pill del resumen) aunque no esté en la barra.
    // Si la pestaña actual no existe (oculta o no permitida), redirige a la primera.
    if (STATE.currentTab !== 'pendientes' && !tabs.some(tb => tb.id === STATE.currentTab)) STATE.currentTab = tabs[0].id;

    const subtabs = el('div', { class:'subtabs', role:'tablist', 'aria-label':'Secciones del viaje', style:{marginTop:'24px'} });
    tabs.forEach((tb, idx) => {
      const isActive = STATE.currentTab === tb.id;
      const btn = el('button', {
        class: 'subtab' + (isActive ? ' active' : ''),
        role: 'tab',
        id: 'tab-' + tb.id,
        'aria-selected': isActive ? 'true' : 'false',
        'aria-controls': 'tab-panel',
        tabindex: isActive ? '0' : '-1',
        onclick: () => { STATE.currentTab = tb.id; Router.render(); },
        onkeydown: (e) => {
          if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
          e.preventDefault();
          const dir = e.key === 'ArrowRight' ? 1 : -1;
          const newIdx = (idx + dir + tabs.length) % tabs.length;
          STATE.currentTab = tabs[newIdx].id;
          Router.render();
        }
      }, tb.label);
      subtabs.appendChild(btn);
    });
    root.appendChild(subtabs);

    // Panel
    const panel = el('div', {
      id:'tab-panel',
      role:'tabpanel',
      'aria-labelledby': 'tab-' + STATE.currentTab,
      tabindex: '0',
    });
    root.appendChild(panel);

    const tab = STATE.currentTab;
    if (tab === 'resumen')      await TripDetail.tabResumen(panel, t);
    else if (tab === 'planning')await TripDetail.tabPlanning(panel, t, fab);
    else if (tab === 'presu')   await TripDetail.tabPresupuesto(panel, t, fab);
    else if (tab === 'maleta')  await TripDetail.tabMaleta(panel, t, fab);
    else if (tab === 'reservas')await TripDetail.tabReservas(panel, t, fab);
    else if (tab === 'mapa')    await TripDetail.tabMapa(panel, t);
    else if (tab === 'personas')await TripDetail.tabPersonas(panel, t);
    else if (tab === 'pendientes') await TripDetail.tabPendientes(panel, t);
    else if (tab === 'estadisticas') await TripDetail.tabEstadisticas(panel, t);
    else if (tab === 'destino') await TripDetail.tabDestino(panel, t);
    else if (tab === 'gastos')  await TripDetail.tabGastos(panel, t, fab);
    else if (tab === 'diario')  await TripDetail.tabDiario(panel, t, fab);
    else if (tab === 'pablo')   await TripDetail.tabPablo(panel, t);
  },

    'Protector solar mineral pediátrico SPF50':'🧴', 'Aspirador nasal tipo NoseFrida':'👃',
    'Termómetro digital':'🌡️', 'Cepillos/pastas dentales infantiles sin flúor':'🪥',
  },
  _accIcon(p) { return TripDetail.ACCESORIOS_ICONS[p] || '🧸'; },
  _accFaseIds() { return TripDetail.ACCESORIOS_PLAN.fases.map(f => f.id); },

  // Cobertura del plan de accesorios (misma mecánica que _wardrobePlan, sin solapes de talla).
  _accPlan(items, cat) {
    const lines = [];
    let needTotal = 0, coveredTotal = 0;
    const byFase = {};
    for (const fa of TripDetail.ACCESORIOS_PLAN.fases) {
      for (const it of fa.items) {
        const key = fa.id + '|' + it.producto;
        const need = TripDetail._wardrobeNeed(cat, fa.id, it.producto, it.need);
        const haveQ = items.filter(x => x.talla === fa.id && x.prenda === it.producto).reduce((s, x) => s + (Number(x.qty) || 0), 0);
        const covered = Math.min(haveQ, need);
        lines.push({ fase: fa.id, producto: it.producto, nota: it.nota, need, have: haveQ, covered, done: covered >= need, key });
        needTotal += need; coveredTotal += covered;
        (byFase[fa.id] = byFase[fa.id] || { id: fa.id, titulo: fa.titulo, meses: fa.meses, need: 0, covered: 0 });
        byFase[fa.id].need += need; byFase[fa.id].covered += covered;
      }
    }
    return { lines, needTotal, coveredTotal, byFase: Object.values(byFase) };
  },

  // Vista "Accesorios": prioridad de maleta, progreso global, por fase, y nota sobre ropa.

        el('ol', { style:{ margin:'0', paddingLeft:'18px', fontSize:'.85rem', lineHeight:'1.55' } },

        ]),

      ]),

      el('div', { class:'wr-plan-legend' }, [

            fa && fa.desc ? el('div', { class:'wr-plan-sub muted', style:{ marginTop:'2px', fontStyle:'italic' }, text: fa.desc }) : null,
          ].filter(Boolean)),
          el('div', { class:'wr-plan-pct', text: p + '%' }),
        ]),
        bar(g.covered, g.need),
        el('div', { class:'wr-plan-legend' }, [
          el('span', { class:'muted', html:`<span class="mono">${g.covered}</span> / <span class="mono">${g.need}</span>` }),

      el('button', { class:'btn btn-ghost btn-sm', onclick: () => TripDetail._accShoppingCSV(items, cat) }, [ el('span', { html: svg('download') }), 'CSV' ]),
    ]));

  // Exporta lo que falta del plan de accesorios.
  _accShoppingCSV(items, cat) {
    const have = (fa, producto) => items.filter(x => x.talla === fa && x.prenda === producto).reduce((s, x) => s + (Number(x.qty) || 0), 0);
    const rows = [['Fase', 'Accesorio', 'Faltan', 'Nota']];
    TripDetail.ACCESORIOS_PLAN.fases.forEach(fa => {
      fa.items.forEach(it => {
        const need = TripDetail._wardrobeNeed(cat, fa.id, it.producto, it.need);
        const faltan = Math.max(0, need - have(fa.id, it.producto));
        if (faltan > 0) rows.push([fa.titulo, it.producto, faltan, it.nota || '']);
      });
    });
    if (rows.length === 1) { UI.toast('¡No falta nada de accesorios! 🎉'); return; }
    const csv = rows.map(r => r.map(v => `"${String(v).replace(/"/g, '""')}"`).join(',')).join('\n');
    const a = el('a', { href: 'data:text/csv;charset=utf-8,' + encodeURIComponent('﻿' + csv), download: `accesorios-pablo-${nowIso().slice(0,10)}.csv` });
    document.body.appendChild(a); a.click(); a.remove();
    UI.toast('Lista de compra descargada');
  },

  // Checklist de accesorios (opcionalmente filtrado por fase). Cada línea tiene +/− que
  // ajustan el inventario, reutilizando _wardrobeAdjust (genérico: no depende de tallas de ropa).
  async _accOpenChecklist(t, filterFaseId) {
    TripDetail._wardrobeInjectStyles();
    const cat = await TripDetail._wardrobeCatalog(t);
    const editable = canEdit();
    const body = el('div', { class:'wr-check' });
    const renderBody = async () => {
      const allItems = await DB.listByTrip('wardrobe_items', t.id);
      const ids = new Set(TripDetail._accFaseIds());
      const items = allItems.filter(x => ids.has(x.talla));
      const haveFor = (fa, producto) => items.filter(x => x.talla === fa && x.prenda === producto).reduce((s, x) => s + (Number(x.qty) || 0), 0);
      body.innerHTML = '';
      const fases = TripDetail.ACCESORIOS_PLAN.fases.filter(f => !filterFaseId || f.id === filterFaseId);
      fases.forEach(fa => {
        const grp = el('div', { class:'wr-check-grp' }, [
          el('div', { class:'wr-check-h' }, [ el('span', { class:'wr-check-talla', text: fa.titulo }), el('span', { class:'muted', text: fa.meses }) ]),
        ]);
        fa.items.forEach(it => {
          const need = TripDetail._wardrobeNeed(cat, fa.id, it.producto, it.need);
          const have = haveFor(fa.id, it.producto);
          const done = have >= need;
          const adjust = async (d) => { await TripDetail._wardrobeAdjust(t, fa.id, it.producto, d, cat); await renderBody(); };
          const right = editable
            ? el('div', { class:'wr-check-step' }, [
                el('button', { class:'wr-step-btn', type:'button', 'aria-label':'Quitar', disabled: have <= 0 ? true : null, onclick: () => adjust(-1) }, '−'),
                el('span', { class: 'wr-step-n mono' + (done ? ' ok' : ''), text: String(have) }),
                el('button', { class:'wr-step-btn', type:'button', 'aria-label':'Añadir', onclick: () => adjust(1) }, '+'),
                el('span', { class:'wr-step-need muted', text: '/ ' + need }),
              ])
            : el('div', { class: 'wr-check-q' + (done ? ' ok' : ''), text: `${have}/${need}` });
          grp.appendChild(el('div', { class: 'wr-check-row' + (done ? ' done' : '') }, [
            el('div', { class:'wr-check-info' }, [
              el('div', { class:'wr-check-name' }, [ el('span', { text: TripDetail._accIcon(it.producto) }), ' ' + it.producto ]),
              it.nota ? el('div', { class:'wr-check-sub muted', text: it.nota }) : null,
            ].filter(Boolean)),
            right,
          ]));
        });
        body.appendChild(grp);
      });
    };
    await renderBody();
    const faseObj = filterFaseId ? TripDetail.ACCESORIOS_PLAN.fases.find(f => f.id === filterFaseId) : null;
    UI.openSheet({
      title: faseObj ? faseObj.titulo : 'Lista de accesorios',
      body,
      footer: [ el('button', { class:'btn btn-primary', onclick: () => { UI.closeSheet(); Router.renderKeepScroll(); } }, 'Listo') ],
    });
  },

  async _wardrobeCatalog(t) {
    const d = TripDetail.WARDROBE_DEFAULTS;
    let row = null;
    try { row = await DB.get('wardrobe_catalog', t.id); } catch (_) {}
    const okObj = (o) => (o && typeof o === 'object' && !Array.isArray(o)) ? o : {};
    if (!row || row.deleted_at) {
      return { trip_id: t.id, prendas: [...d.prendas], tipos: JSON.parse(JSON.stringify(d.tipos)), tallas: [...d.tallas], checklist: {}, prefs: { need:{}, archived:{} } };
    }
    const prefs = okObj(row.prefs);
    return {
      trip_id: t.id,
      prendas: Array.isArray(row.prendas) && row.prendas.length ? row.prendas : [...d.prendas],
      tipos:   okObj(row.tipos) && Object.keys(okObj(row.tipos)).length ? row.tipos : JSON.parse(JSON.stringify(d.tipos)),
      tallas:  Array.isArray(row.tallas) && row.tallas.length ? row.tallas : [...d.tallas],
      checklist: okObj(row.checklist),
      prefs: { need: okObj(prefs.need), archived: okObj(prefs.archived) },
    };
  },
  async _wardrobeSaveCatalog(cat) {
    await DB.put('wardrobe_catalog', { id: cat.trip_id, trip_id: cat.trip_id, prendas: cat.prendas, tipos: cat.tipos, tallas: cat.tallas, checklist: cat.checklist || {}, prefs: cat.prefs || { need:{}, archived:{} } });
  },

  // Cantidad objetivo de una línea (con override editable del usuario).
  _wardrobeNeed(cat, talla, prenda, def) {
    const ov = cat && cat.prefs && cat.prefs.need ? cat.prefs.need[talla + '|' + prenda] : undefined;
    return (ov === 0 || (typeof ov === 'number' && ov > 0)) ? ov : def;
  },

  // Convierte "6-9m" / "6-12" en [6,9). Devuelve null si el texto no tiene ese formato
  // (packs con rango amplio como calcetines "6-12" o "12-24" siguen siendo válidos).
  _wardrobeParseTallaRange(s) {
    const m = /^(\d+)\s*-\s*(\d+)\s*m?$/.exec(String(s || '').trim());
    return m ? [Number(m[1]), Number(m[2])] : null;
  },
  // Dos tallas "coinciden" si son el mismo texto, o si sus rangos de meses se solapan
  // (así un pack "6-12" cuenta tanto para la talla 6-9m como para la 9-12m del plan).
  _wardrobeTallaOverlaps(a, b) {
    if (a === b) return true;
    const ra = TripDetail._wardrobeParseTallaRange(a), rb = TripDetail._wardrobeParseTallaRange(b);
    if (!ra || !rb) return false;
    return ra[0] < rb[1] && rb[0] < ra[1];
  },
  // Suma el inventario de una prenda que aplica a una talla del plan, incluyendo packs
  // de rango amplio (p. ej. calcetines "6-12") que se solapan con esa talla.
  _wardrobeHaveFor(items, talla, prenda) {
    return items.filter(x => x.prenda === prenda && TripDetail._wardrobeTallaOverlaps(x.talla, talla))
      .reduce((s, x) => s + (Number(x.qty) || 0), 0);
  },

  // Talla vigente según la fecha de hoy: { idx, size, estado:'antes'|'actual'|'despues', nextSize, dias }.
  _wardrobeCurrentSize() {
    const today = todayIso();
    const sizes = TripDetail.WARDROBE_PLAN.sizes;
    const daysTo = (iso) => Math.round((parseDate(iso) - parseDate(today)) / 86400000);
    for (let i = 0; i < sizes.length; i++) {
      const s = sizes[i];
      if (today < s.desde) return { idx:i, size:s, estado:'antes', nextSize:s, dias: daysTo(s.desde) };
      if (today <= s.hasta) {
        const next = sizes[i+1] || null;
        return { idx:i, size:s, estado:'actual', nextSize:next, dias: daysTo(s.hasta) + 1 };
      }
    }
    return { idx: sizes.length, size:null, estado:'despues', nextSize:null, dias:0 };
  },

  // Cobertura del plan. covered = (archivada||manual) ? need : min(have, need).
  _wardrobePlan(items, cat) {
    const checks = (cat && cat.checklist) || {};
    const archived = (cat && cat.prefs && cat.prefs.archived) || {};
    const lines = [];
    let needTotal = 0, coveredTotal = 0;
    const byTalla = {}, byPrenda = {};
    for (const sz of TripDetail.WARDROBE_PLAN.sizes) {
      const isArch = !!archived[sz.talla];
      for (const it of sz.items) {
        const key = sz.talla + '|' + it.prenda;
        const need = TripDetail._wardrobeNeed(cat, sz.talla, it.prenda, it.need);
        const haveQ = TripDetail._wardrobeHaveFor(items, sz.talla, it.prenda);
        const manual = !!checks[key] || isArch;
        const covered = manual ? need : Math.min(haveQ, need);
        const line = { talla: sz.talla, meses: sz.meses, prenda: it.prenda, nota: it.nota, verano: !!it.verano, need, have: haveQ, manual, covered, done: covered >= need, key };
        lines.push(line);
        needTotal += need; coveredTotal += covered;
        (byTalla[sz.talla] = byTalla[sz.talla] || { talla: sz.talla, meses: sz.meses, desde: sz.desde, hasta: sz.hasta, need: 0, covered: 0, archived: isArch, verano: !!sz.verano });
        byTalla[sz.talla].need += need; byTalla[sz.talla].covered += covered;
        (byPrenda[it.prenda] = byPrenda[it.prenda] || { prenda: it.prenda, need: 0, covered: 0, have: 0 });
        byPrenda[it.prenda].need += need; byPrenda[it.prenda].covered += covered;
      }
    }
    const haveByPrenda = {};
    for (const it of items) haveByPrenda[it.prenda] = (haveByPrenda[it.prenda] || 0) + (Number(it.qty) || 0);
    Object.keys(byPrenda).forEach(p => { byPrenda[p].have = haveByPrenda[p] || 0; });
    return { lines, needTotal, coveredTotal, byTalla: Object.values(byTalla), byPrenda: Object.values(byPrenda), haveByPrenda };
  },

  // Desglose de una prenda por talla: cuántas tenemos (y de qué tipo) en cada talla del
  // plan, incluyendo lo que aportan packs de rango amplio (p. ej. calcetines "6-12" cuenta
  // para 6-9m y 9-12m). Las tallas que no encajan en ningún tramo del plan se listan aparte.
  async _wardrobeOpenPrendaBreakdown(t, prenda) {
    TripDetail._wardrobeInjectStyles();
    const items = await DB.listByTrip('wardrobe_items', t.id);
    const cat = await TripDetail._wardrobeCatalog(t);
    const mine = items.filter(i => i.prenda === prenda);
    const total = mine.reduce((s, i) => s + (Number(i.qty) || 0), 0);

    const planSizes = TripDetail.WARDROBE_PLAN.sizes.filter(sz => sz.items.some(x => x.prenda === prenda));
    const planTallas = planSizes.map(sz => sz.talla);
    const rows = [];

    planSizes.forEach(sz => {
      const it = sz.items.find(x => x.prenda === prenda);
      const need = TripDetail._wardrobeNeed(cat, sz.talla, prenda, it.need);
      const have = TripDetail._wardrobeHaveFor(items, sz.talla, prenda);
      const parts = [];
      const ownTipos = {};
      mine.filter(i => i.talla === sz.talla).forEach(i => { ownTipos[i.tipo] = (ownTipos[i.tipo] || 0) + (Number(i.qty) || 0); });
      Object.entries(ownTipos).forEach(([k, v]) => parts.push(`${v} ${k}`));
      const extraTipos = {};
      mine.filter(i => i.talla !== sz.talla && TripDetail._wardrobeTallaOverlaps(i.talla, sz.talla))
        .forEach(i => { const key = i.talla + '|' + i.tipo; extraTipos[key] = (extraTipos[key] || 0) + (Number(i.qty) || 0); });
      Object.entries(extraTipos).forEach(([key, v]) => { const [ta, tipo] = key.split('|'); parts.push(`${v} ${tipo} (${ta})`); });
      rows.push({ talla: sz.talla, have, need, sub: parts.join(' · ') || 'sin unidades' });
    });

    const tOrder = TripDetail.WARDROBE_DEFAULTS.tallas;
    const orphanTallas = Array.from(new Set(mine.map(i => i.talla)))
      .filter(ta => !planTallas.some(pt => TripDetail._wardrobeTallaOverlaps(ta, pt)));
    orphanTallas.sort((a, b) => {
      const ai = tOrder.indexOf(a), bi = tOrder.indexOf(b);
      if (ai >= 0 || bi >= 0) return (ai < 0 ? 99 : ai) - (bi < 0 ? 99 : bi);
      const ra = TripDetail._wardrobeParseTallaRange(a), rb = TripDetail._wardrobeParseTallaRange(b);
      if (ra && rb) return ra[0] - rb[0];
      return a.localeCompare(b, 'es');
    });
    orphanTallas.forEach(ta => {
      const own = mine.filter(i => i.talla === ta);
      const have = own.reduce((s, i) => s + (Number(i.qty) || 0), 0);
      const tipos = {};
      own.forEach(i => { tipos[i.tipo] = (tipos[i.tipo] || 0) + (Number(i.qty) || 0); });
      const sub = Object.entries(tipos).map(([k, v]) => `${v} ${k}`).join(' · ') + (planTallas.length ? ' · fuera del plan' : '');
      rows.push({ talla: ta, have, need: null, sub });
    });

    const body = el('div', { class:'wr-bd' });
    if (!rows.length) {
      body.appendChild(el('div', { class:'muted', style:{ padding:'12px 4px' }, text:'Todavía no hay ninguna registrada.' }));
    }
    rows.forEach(r => {
      body.appendChild(el('div', { class:'wr-bd-row' }, [
        el('div', { class:'wr-bd-talla mono', text: r.talla }),
        el('div', { class:'wr-bd-info' }, [
          el('div', { class:'wr-bd-have', text: r.need != null ? `${r.have} / ${r.need}` : String(r.have) }),
          el('div', { class:'wr-bd-sub muted', text: r.sub }),
        ]),
      ]));
    });
    UI.openSheet({
      title: `${TripDetail._wardrobeIcon(prenda)} ${prenda} · ${total} en total`,
      body,
      footer: [ el('button', { class:'btn btn-primary', onclick: () => UI.closeSheet() }, 'Cerrar') ],
    });
  },
