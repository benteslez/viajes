<style>
:root {
  --r-sm:8px; --r-md:14px; --r-lg:20px; --r-pill:999px;
  --sh-1:0 1px 2px rgba(0,0,0,.04),0 1px 1px rgba(0,0,0,.03);
  --sh-2:0 2px 10px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04);
  --gap-4:16px; --gap-5:24px;
  --bg:#f8fafc; --bg-elev:#fff; --bg-soft:#f1f5f9;
  --text:#0f172a; --text-muted:#64748b;
  --line:#e2e8f0; --line-soft:#f1f5f9;
  --accent:#2563eb; --accent-2:#06b6d4; --accent-bg:#dbeafe;
  --c-hotel:#0f766e;  --c-hotel-bg:#ccfbf1;
  --c-flight:#6d28d9; --c-flight-bg:#ede9fe;
  --c-car:#b45309;    --c-car-bg:#fef3c7;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg:#0b1220; --bg-elev:#111a2e; --bg-soft:#1e293b;
    --text:#f1f5f9; --text-muted:#94a3b8;
    --line:#334155; --line-soft:#1e293b;
    --accent:#60a5fa; --accent-2:#22d3ee; --accent-bg:#1e3a5f;
    --c-hotel:#5eead4;  --c-hotel-bg:#134e4a;
    --c-flight:#c4b5fd; --c-flight-bg:#3b2f63;
    --c-car:#fcd34d;    --c-car-bg:#4a3410;
  }
}
* { box-sizing:border-box; }
body { margin:0; font-family:'Manrope',system-ui,-apple-system,sans-serif; background:var(--bg); color:var(--text); -webkit-font-smoothing:antialiased; line-height:1.5; }
main { max-width:900px; margin:0 auto; padding:24px 18px 60px; }
.cover {
  position:relative; height:240px; border-radius:var(--r-lg); overflow:hidden;
  background:linear-gradient(135deg, var(--accent-bg), var(--bg-soft));
  display:flex; flex-direction:column; justify-content:flex-end; padding:22px;
}
.cover img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
.cover::after { content:''; position:absolute; inset:0; background:linear-gradient(to top, rgba(0,0,0,.55), transparent 60%); }
.cover > * { position:relative; z-index:1; }
.cover h1 { color:#fff; font-weight:800; letter-spacing:-.02em; font-size:28px; margin:0; text-shadow:0 1px 3px rgba(0,0,0,.4); }
.cover .meta { color:rgba(255,255,255,.92); margin-top:6px; font-weight:500; text-shadow:0 1px 2px rgba(0,0,0,.3); }
.share-banner {
  display:flex; align-items:center; gap:10px;
  background:var(--accent-bg); color:var(--text);
  border-radius:var(--r-md); padding:10px 14px; margin:14px 0 0;
  font-size:13px;
}
.share-banner svg { width:16px; height:16px; stroke:var(--accent); }
h2.section { font-weight:600; letter-spacing:-.02em; font-size:22px; margin:36px 0 12px; }
h3.day { font-weight:600; letter-spacing:-.01em; font-size:17px; margin:16px 0 8px; }
.day-num { font-family:'Manrope',system-ui,sans-serif; font-feature-settings:"tnum","ss01"; font-size:12px; color:var(--text-muted); margin-right:8px; }
.timeline { position:relative; margin-left:8px; padding-left:30px; border-left:2px solid var(--line-soft); }
.tl-item { position:relative; padding:10px 14px; background:var(--bg-elev); border:1px solid var(--line); border-radius:var(--r-md); margin-bottom:10px; box-shadow:var(--sh-1); }
.tl-item::before { content:''; position:absolute; left:-37px; top:14px; width:14px; height:14px; border-radius:50%; background:var(--bg-elev); border:2px solid var(--accent); box-shadow:0 0 0 3px var(--bg); }
.tl-time { display:inline-block; font-family:'Manrope',system-ui,sans-serif; font-feature-settings:"tnum","ss01"; font-size:11px; background:var(--bg-soft); color:var(--text-muted); padding:2px 8px; border-radius:var(--r-pill); margin-right:6px; }
.tl-title { font-weight:600; }
.tl-sub { color:var(--text-muted); font-size:13.5px; margin-top:4px; overflow-wrap:anywhere; }
.tl-title, .day-note, .card p, main { overflow-wrap:anywhere; }
.tl-link { display:inline-block; margin-top:6px; font-size:13px; }
.day-note {
  background:color-mix(in srgb, var(--accent-bg) 30%, var(--bg-elev));
  border:1px dashed color-mix(in srgb, var(--accent) 35%, var(--line));
  border-radius:var(--r-md); padding:10px 14px; margin-bottom:10px;
  font-size:13.5px; white-space:pre-wrap;
}
.card { background:var(--bg-elev); border:1px solid var(--line); border-radius:var(--r-md); padding:14px 16px; margin-bottom:10px; box-shadow:var(--sh-1); }
.card .ti { font-weight:600; display:flex; align-items:center; gap:8px; }
.card .sub { color:var(--text-muted); font-size:13.5px; margin-top:4px; }
.card .ref { font-family:'Manrope',system-ui,sans-serif; font-feature-settings:"tnum","ss01"; font-size:11px; background:var(--bg-soft); color:var(--text-muted); padding:2px 8px; border-radius:var(--r-pill); }
.card a { color:var(--accent); }
.kv { display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px solid var(--line-soft); font-size:14px; }
.kv:last-child { border-bottom:none; }
.kv .k { color:var(--text-muted); }
.kv .v { font-family:'Manrope',system-ui,sans-serif; font-feature-settings:"tnum","ss01"; }
.muted { color:var(--text-muted); }
#map { height:380px; border-radius:var(--r-lg); border:1px solid var(--line); overflow:hidden; }
/* --- Itinerario plegable --- */
.itin-tools { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin:0 0 14px; }
.btn-mini {
  font:inherit; font-size:13px; font-weight:600; cursor:pointer;
  background:var(--bg-elev); color:var(--text); border:1px solid var(--line);
  border-radius:var(--r-pill); padding:6px 14px;
}
.btn-mini:hover { background:var(--bg-soft); }
.itin-count { color:var(--text-muted); font-size:13px; }
details.day-block {
  background:var(--bg-elev); border:1px solid var(--line); border-radius:var(--r-md);
  margin-bottom:10px; box-shadow:var(--sh-1); overflow:hidden;
}
details.day-block[open] { box-shadow:var(--sh-2); border-color:color-mix(in srgb, var(--accent) 30%, var(--line)); }
summary.day-head { list-style:none; cursor:pointer; padding:12px 14px; display:flex; gap:12px; align-items:flex-start; }
summary.day-head::-webkit-details-marker { display:none; }
summary.day-head:hover { background:var(--bg-soft); }
.dh-caret { flex:none; width:16px; height:16px; margin-top:3px; color:var(--text-muted); transition:transform .18s ease; }
details[open] .dh-caret { transform:rotate(90deg); }
.dh-main { flex:1; min-width:0; }
.dh-top { display:flex; align-items:baseline; gap:8px; flex-wrap:wrap; }
.dh-num { font-feature-settings:"tnum","ss01"; font-size:11.5px; font-weight:700; color:var(--text-muted); text-transform:uppercase; letter-spacing:.04em; }
.dh-date { font-weight:600; font-size:15.5px; letter-spacing:-.01em; }
.dh-chips { display:flex; flex-wrap:wrap; gap:6px; margin-top:7px; }
.chip {
  display:inline-flex; align-items:center; gap:5px; white-space:nowrap;
  font-size:11.5px; font-weight:600; padding:3px 10px; border-radius:var(--r-pill);
  border:1px solid transparent;
}
.chip-place  { background:var(--accent-bg); color:var(--accent); border-color:color-mix(in srgb, var(--accent) 25%, transparent); }
.chip-hotel  { background:var(--c-hotel-bg);  color:var(--c-hotel);  border-color:color-mix(in srgb, var(--c-hotel) 25%, transparent); }
.chip-flight { background:var(--c-flight-bg); color:var(--c-flight); border-color:color-mix(in srgb, var(--c-flight) 25%, transparent); }
.chip-car    { background:var(--c-car-bg);    color:var(--c-car);    border-color:color-mix(in srgb, var(--c-car) 25%, transparent); }
.chip-count  { background:var(--bg-soft); color:var(--text-muted); font-weight:500; }
.day-body { padding:2px 14px 14px; }
.day-empty { color:var(--text-muted); font-size:13.5px; padding:0 14px 16px; }
.map-hint { color:var(--text-muted); font-size:13px; margin:0 0 10px; }
.map-pop b { display:block; margin-bottom:2px; }
.map-pop a { font-size:12.5px; }
footer.foot { margin-top:48px; padding-top:24px; border-top:1px solid var(--line-soft); color:var(--text-muted); font-size:12px; text-align:center; }
a { color:var(--accent); text-decoration:none; }
a:hover { text-decoration:underline; }
.notes-card { background:var(--bg-elev); border:1px solid var(--line); border-radius:var(--r-md); padding:14px 16px; white-space:pre-wrap; font-size:14px; }
</style>

entina","arrival_date":"2024-12-18","departure_date":"2024-12-22","order_index":2,"updated_at":"2026-09-07T00:00:00.000Z","deleted_at":null}]};
const OPTS = {"includeMoney":false,"includeDocs":false,"includeLinks":true,"includeMap":true,"includeNotes":true};
function escHtml(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function fmtDayLong(iso){if(!iso)return'';return new Date(iso+'T00:00:00').toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'long'});}
function fmtDateShort(iso){if(!iso)return'';return new Date(iso+'T00:00:00').toLocaleDateString('es-ES',{day:'numeric',month:'short'});}
function daysBetween(a,b){if(!a||!b)return 0;return Math.round((new Date(b+'T00:00:00')-new Date(a+'T00:00:00'))/(24*3600*1000));}
function gmapsUrl(lat,lng,q){if(lat!=null&&lng!=null)return 'https://www.google.com/maps/search/?api=1&query='+lat+','+lng;if(q)return 'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(q);return null;}
function el(tag, attrs, children) {
  const n = document.createElement(tag);
  if (attrs) for (const k in attrs) { if (k==='class') n.className = attrs[k]; else if (k==='text') n.textContent = attrs[k]; else if (k==='html') n.innerHTML = attrs[k]; else if (k.startsWith('on')) n.addEventListener(k.slice(2), attrs[k]); else if (k==='style') Object.assign(n.style, attrs[k]); else n.setAttribute(k, attrs[k]); }
  if (children) (Array.isArray(children)?children:[children]).forEach(c => { if (c==null||c===false) return; if (typeof c === 'string') n.appendChild(document.createTextNode(c)); else n.appendChild(c); });
  return n;
}

const root = document.getElementById('content');
const trip = DATA.trip;

// === Itinerario (acordeón por días) ===
// Helpers de fechas y de etiquetado del día.
const isoOf = (d) => d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const LEGS = DATA.trip_legs || [];
// Ciudad a partir de una dirección postal: el segundo segmento, sin el código
// postal de delante ('11000 Montevideo' -> 'Montevideo', 'V9410AVG Ushuaia' -> 'Ushuaia').
// Es una heurística: si no cuadra, simplemente no se muestra la pastilla.
function cityFromAddress(addr) {
  if (!addr) return null;
  const parts = String(addr).split(',').map(x => x.trim()).filter(Boolean);
  if (parts.length < 2) return null;
  const c = parts[1].replace(/^[A-Za-z]{0,2}\d[\w-]*\s+/, '').trim();
  return c && !/^\d+$/.test(c) ? c : null;
}
// Rango [entrada, salida) de un alojamiento. Los tipos 'rango' guardan las
// fechas en consultation_planned_d1/d2; si faltan, se usa el día del evento.
function stayRange(p) {
  const d1 = p.consultation_planned_d1 || p.day_date;
  const d2 = p.consultation_planned_d2 || (p.metadata && p.metadata.end_date) || null;
  return d1 ? { d1, d2 } : null;
}
const STAYS = DATA.planning.filter(p => p.type === 'hotel').map(p => ({ p, r: stayRange(p) })).filter(x => x.r);
function stayOn(iso) {
  // La noche del día: entrada <= día < salida. El día del check-out ya no cuenta.
  const hit = STAYS.find(x => x.r.d1 <= iso && (!x.r.d2 || iso < x.r.d2));
  return hit ? hit.p : null;
}
function legOn(iso) {
  const l = LEGS.find(x => (x.arrival_date || '') <= iso && (!x.departure_date || iso <= x.departure_date));
  return l && l.city ? l.city : null;
}
// Nombre del lugar del día, en cascada: título del día -> tramo -> ciudad del
// alojamiento de esa noche. Si nada cuadra, el día va sin pastilla de lugar.
function placeOf(iso, note) {
  if (note && note.title) return note.title;
  const leg = legOn(iso); if (leg) return leg;
  const st = stayOn(iso);
  if (st) return cityFromAddress(st.address) || st.place_name || st.title;
  return null;
}
// 'MVD · Montevideo' -> 'MVD'. Sin metadata, se cae al título del evento.
const iata = (v) => String(v || '').split('·')[0].trim();
function flightLabel(p) {
  const m = p.metadata || {};
  if (m.origen && m.destino) return iata(m.origen) + ' → ' + iata(m.destino);
  return p.title;
}

const byDay = {};
DATA.planning.forEach(p => { const k = p.day_date || 'sin-fecha'; (byDay[k]=byDay[k]||[]).push(p); });
const noteMap = {}; DATA.day_notes.forEach(n => noteMap[n.date]=n);
Object.keys(noteMap).forEach(k => { if (!byDay[k]) byDay[k] = []; });
if (trip.start_date && trip.end_date) {
  let d = new Date(trip.start_date+'T00:00:00'); const end = new Date(trip.end_date+'T00:00:00');
  while (d <= end) { const k = isoOf(d); if (!byDay[k]) byDay[k]=[]; d.setDate(d.getDate()+1); }
}
const dayKeys = Object.keys(byDay).sort();
const blocks = [];

if (dayKeys.length) {
  root.appendChild(el('h2', {class:'section', text:'Itinerario'}));
  const tools = el('div', {class:'itin-tools'});
  const btnAll = el('button', {class:'btn-mini', type:'button'}, 'Desplegar todo');
  btnAll.addEventListener('click', () => {
    const abrir = blocks.some(b => !b.open);
    blocks.forEach(b => { b.open = abrir; });
    btnAll.textContent = abrir ? 'Plegar todo' : 'Desplegar todo';
  });
  tools.appendChild(btnAll);
  tools.appendChild(el('span', {class:'itin-count', text: dayKeys.length + (dayKeys.length===1?' día':' días') + ' · toca uno para ver el detalle'}));
  root.appendChild(tools);

  dayKeys.forEach(k => {
    const items = byDay[k];
    items.sort((a,b) => (a.time||'').localeCompare(b.time||'') || (a.order_index||0)-(b.order_index||0));
    const note = noteMap[k];
    const dayNum = (trip.start_date && k!=='sin-fecha') ? daysBetween(trip.start_date, k)+1 : null;

    const det = el('details', {class:'day-block'});
    det.id = 'dia-' + k;
    const head = el('summary', {class:'day-head'});
    head.appendChild(el('span', {class:'dh-caret', html:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>'}));
    const main = el('div', {class:'dh-main'});
    const top = el('div', {class:'dh-top'});
    if (dayNum) top.appendChild(el('span', {class:'dh-num', text:'Día '+dayNum}));
    top.appendChild(el('span', {class:'dh-date', text: k==='sin-fecha' ? 'Sin fecha' : fmtDayLong(k)}));
    main.appendChild(top);

    const chips = el('div', {class:'dh-chips'});
    const lugar = placeOf(k, note);
    if (lugar) chips.appendChild(el('span', {class:'chip chip-place', text:'📍 ' + lugar}));
    const stay = stayOn(k);
    if (stay) chips.appendChild(el('span', {class:'chip chip-hotel', text:'🏨 ' + (stay.place_name || stay.title)}));
    items.filter(p => p.type === 'vuelo').forEach(p => {
      chips.appendChild(el('span', {class:'chip chip-flight', text:'✈️ ' + flightLabel(p)}));
    });
    items.filter(p => p.type === 'coche').forEach(p => {
      chips.appendChild(el('span', {class:'chip chip-car', text:'🚗 ' + (p.place_name || p.title)}));
    });
    const paradas = items.filter(p => !['hotel','vuelo','coche'].includes(p.type)).length;
    if (paradas) chips.appendChild(el('span', {class:'chip chip-count', text: paradas + (paradas===1?' parada':' paradas')}));
    if (chips.children.length) main.appendChild(chips);
    head.appendChild(main);
    det.appendChild(head);

    const bodyDiv = el('div', {class:'day-body'});
    if (note && note.text) bodyDiv.appendChild(el('div', {class:'day-note', text: note.text}));
    if (items.length) {
      const tl = el('div', {class:'timeline'});
      items.forEach(it => {
        const tlItem = el('div', {class:'tl-item'});
        const titleDiv = el('div', {class:'tl-title'});
        if (it.time) titleDiv.appendChild(el('span', {class:'tl-time', text: it.time}));
        titleDiv.appendChild(document.createTextNode(it.title));
        tlItem.appendChild(titleDiv);
        if (it.place_name && it.place_name !== it.title) tlItem.appendChild(el('div', {class:'tl-sub', text: it.place_name}));
        if (it.address) tlItem.appendChild(el('div', {class:'tl-sub', text: it.address}));
        if (it.notes) tlItem.appendChild(el('div', {class:'tl-sub', style:{whiteSpace:'pre-wrap'}, text: it.notes}));
        const gm = OPTS.includeLinks ? gmapsUrl(it.lat, it.lng, it.place_name) : null;
        if (gm) tlItem.appendChild(el('a', {class:'tl-link', href: gm, target:'_blank', rel:'noopener', text:'Abrir en Google Maps'}));
        tl.appendChild(tlItem);
      });
      bodyDiv.appendChild(tl);
    } else if (!note || !note.text) {
      bodyDiv.appendChild(el('div', {class:'day-empty', text:'Día libre'}));
    }
    det.appendChild(bodyDiv);
    root.appendChild(det);
    blocks.push(det);
  });
}

// Abre un día y lo trae a la vista (lo usan los popups del mapa).
function abrirDia(iso) {
  const d = document.getElementById('dia-' + iso);
  if (!d) return;
  d.open = true;
  d.scrollIntoView({ behavior:'smooth', block:'start' });
}
window.abrirDia = abrirDia;

// === Mapa de la ruta ===
// Puntos en orden cronológico: una línea por día con su color, y un tramo
// discontinuo entre el último punto de un día y el primero del siguiente.
if (OPTS.includeMap && typeof L !== 'undefined') {
  const porDia = [];
  dayKeys.forEach(k => {
    const pts = (byDay[k] || [])
      .filter(p => p.lat != null && p.lng != null)
      .map(p => ({ lat:p.lat, lng:p.lng, name:p.title, sub:p.place_name || p.address || '', iso:k, type:p.type }));
    if (pts.length) porDia.push({ iso:k, pts });
  });
  const sueltos = DATA.addresses.filter(a => a.lat != null && a.lng != null)
    .map(a => ({ lat:a.lat, lng:a.lng, name:a.label, sub:a.address || '', iso:null, type:'otro' }));
  const total = porDia.reduce((n,d) => n + d.pts.length, 0) + sueltos.length;

  if (total) {
    root.appendChild(el('h2', {class:'section', text:'Mapa de la ruta'}));
    root.appendChild(el('p', {class:'map-hint', text: total + ' puntos · el color avanza con los días. Toca un punto para ir a su día.'}));
    const mapEl = el('div', {id:'map'}); root.appendChild(mapEl);
    setTimeout(() => {
      const m = L.map('map', { scrollWheelZoom:false });
      L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {maxZoom:19, attribution:'© OpenStreetMap'}).addTo(m);
      const capa = L.featureGroup().addTo(m);
      // Tono azul -> magenta según avanza el viaje: se ve la progresión.
      const colorDia = (i) => 'hsl(' + Math.round(212 + (porDia.length > 1 ? i*130/(porDia.length-1) : 0)) + ',72%,48%)';
      const num = (iso) => trip.start_date ? daysBetween(trip.start_date, iso)+1 : null;
      // Dos pasadas: primero TODAS las líneas y después los puntos. Si se
      // mezclan, la línea de un día tapa los marcadores de los días anteriores
      // que caen en la misma zona y el clic nunca llega al punto. Además las
      // líneas van con interactive:false para no robar el clic.
      porDia.forEach((d, i) => {
        const col = colorDia(i);
        if (d.pts.length > 1) {
          L.polyline(d.pts.map(x => [x.lat, x.lng]), { color:col, weight:3, opacity:.75, interactive:false }).addTo(capa);
        }
        if (i > 0) {
          const prev = porDia[i-1].pts[porDia[i-1].pts.length-1];
          L.polyline([[prev.lat, prev.lng], [d.pts[0].lat, d.pts[0].lng]],
            { color:'#94a3b8', weight:2, opacity:.6, dashArray:'5,7', interactive:false }).addTo(capa);
        }
      });
      porDia.forEach((d, i) => {
        const col = colorDia(i);
        d.pts.forEach(x => {
          const dn = num(x.iso);
          const mk = L.circleMarker([x.lat, x.lng], {
            radius: x.type === 'hotel' ? 8 : 6, color:'#fff', weight:2,
            fillColor: col, fillOpacity:1,
          }).addTo(capa);
          const cab = (dn ? 'Día ' + dn + ' · ' : '') + fmtDateShort(x.iso);
          mk.bindPopup('<div class="map-pop"><b>' + escHtml(x.name) + '</b>' +
            (x.sub ? escHtml(x.sub) + '<br>' : '') +
            '<span class="muted">' + escHtml(cab) + '</span><br>' +
            '<a href="#" onclick="abrirDia(\'' + x.iso + '\');return false;">Ver este día</a></div>');
        });
      });
      sueltos.forEach(x => {
        const mk = L.circleMarker([x.lat, x.lng], { radius:6, color:'#fff', weight:2, fillColor:'#64748b', fillOpacity:1 }).addTo(capa);
        mk.bindPopup('<div class="map-pop"><b>' + escHtml(x.name) + '</b>' + escHtml(x.sub) + '</div>');
      });
      const b = capa.getBounds();
      if (b.isValid()) m.fitBounds(b.pad(0.15));
    }, 60);
  }
}

// === Reservas ===
if (DATA.bookings.length) {
  root.appendChild(el('h2', {class:'section', text:'Reservas'}));
  const TYPE_LABELS = {vuelo:'Vuelo',hotel:'Hotel',tren:'Tren',ferry:'Ferry',coche:'Coche',actividad:'Actividad',seguro:'Seguro',otro:'Otro'};
  DATA.bookings.forEach(b => {
    const c = el('div', {class:'card'});
    const d = b.structured_data || {};
    const ti = el('div', {class:'ti'});
    ti.appendChild(document.createTextNode(TYPE_LABELS[b.type]||b.type));
    if (b.ref_date) ti.appendChild(el('span', {class:'ref', style:{marginLeft:'8px'}, text: fmtDateShort(b.ref_date)}));
    c.appendChild(ti);
    Object.entries(d).filter(([k,v])=>v).forEach(([k,v]) => {
      const kv = el('div', {class:'kv'});
      kv.appendChild(el('span', {class:'k', text: k.replace(/_/g,' ')}));
      kv.appendChild(el('span', {class:'v', text: String(v)}));
      c.appendChild(kv);
    });
    if (b.doc_url && OPTS.includeDocs) {
      const dwrap = el('div', {style:{marginTop:'8px'}});
      dwrap.appendChild(el('a', {href: b.doc_url, target:'_blank', rel:'noopener', text: b.doc_name || 'Documento'}));
      c.appendChild(dwrap);
    }
    root.appendChild(c);
  });
}

// === Direcciones ===
if (DATA.addresses.length) {
  root.appendChild(el('h2', {class:'section', text:'Direcciones'}));
  DATA.addresses.forEach(a => {
    const c = el('div', {class:'card'});
    c.appendChild(el('div', {class:'ti', text: a.label}));
    if (a.address) c.appendChild(el('div', {class:'sub', text: a.address}));
    if (a.notes) c.appendChild(el('div', {class:'sub', text: a.notes}));
    const gm = OPTS.includeLinks ? gmapsUrl(a.lat, a.lng, a.address) : null;
    if (gm) { const w = el('div', {style:{marginTop:'8px'}}); w.appendChild(el('a', {href: gm, target:'_blank', rel:'noopener', text:'Abrir en Google Maps'})); c.appendChild(w); }
    root.appendChild(c);
  });
}

// === Ficha destino ===
if (DATA.destination_info || DATA.emergency_contacts.length || (DATA.phrases.length && OPTS.includeNotes)) {
  root.appendChild(el('h2', {class:'section', text:'Ficha del destino'}));
  if (DATA.destination_info) {
    const i = DATA.destination_info;
    const c = el('div', {class:'card'});
    const rows = [['Zona horaria',i.timezone],['Dif. con origen',i.tz_diff_origin],['Voltaje',i.voltage],['Enchufe',i.plug_type],['Moneda local',i.local_currency],['Propinas',i.tipping_notes],['Tel. emergencia',i.emergency_number]];
    rows.filter(r => r[1]).forEach(r => {
      const kv = el('div', {class:'kv'});
      kv.appendChild(el('span', {class:'k', text: r[0]}));
      kv.appendChild(el('span', {class:'v', text: r[1]}));
      c.appendChild(kv);
    });
    if (i.embassy_info) { const w = el('div', {style:{marginTop:'10px'}}); w.appendChild(el('div', {class:'k muted', text:'Embajada de España'})); w.appendChild(el('div', {class:'sub', style:{whiteSpace:'pre-wrap'}, text: i.embassy_info})); c.appendChild(w); }
    if (c.children.length) root.appendChild(c);
  }
  if (DATA.emergency_contacts.length) {
    root.appendChild(el('h3', {class:'day', text:'Contactos de emergencia'}));
    DATA.emergency_contacts.forEach(c => {
      const d = el('div', {class:'card'});
      d.appendChild(el('div', {class:'ti', text: c.name}));
      d.appendChild(el('div', {class:'sub', text: [c.relation, c.phone].filter(Boolean).join(' · ')}));
      root.appendChild(d);
    });
  }
  if (DATA.phrases.length && OPTS.includeNotes) {
    root.appendChild(el('h3', {class:'day', text:'Frases útiles'}));
    DATA.phrases.forEach(p => {
      const d = el('div', {class:'card'});
      d.appendChild(el('div', {class:'ti', text: p.phrase_local}));
      d.appendChild(el('div', {class:'sub', text: [p.translation, p.lang].filter(Boolean).join(' · ')}));
      root.appendChild(d);
    });
  }
}

// === Notas generales ===
if (OPTS.includeNotes && trip.notes) {
  root.appendChild(el('h2', {class:'section', text:'Notas'}));
  root.appendChild(el('div', {class:'notes-card', text: trip.notes}));
}

</script>
</body>
</html>
