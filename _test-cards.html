<!DOCTYPE html><html><head><meta charset="utf-8"><title>Test tarjetas</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style id="extracted"></style>
<style>
body{background:#f8fafc;padding:24px;font-family:Manrope,system-ui,sans-serif;color:#0f172a;}
h2{font-size:14px;margin:18px 0 8px;color:#475569;text-transform:uppercase;letter-spacing:.05em;}
.list{display:flex;flex-direction:column;gap:8px;}
section{margin-bottom:24px;border:1px dashed #cbd5e1;padding:16px;border-radius:12px;background:#fff;}
section + section { margin-top:0; }
</style>
</head><body>
<h1>Test visual de tarjetas (combinaciones tipo × estado)</h1>
<div id="root"></div>
<script>
// Cargo el CSS de index.html
fetch('/index.html').then(r=>r.text()).then(html=>{
  // Extrae el primer <style>…</style> (la app inline-css)
  const m = html.match(/<style[^>]*>([\s\S]*?)<\/style>/);
  if (m) document.getElementById('extracted').textContent = m[1];
  build();
});

const TYPES = [
  ['vuelo','✈️','Vuelo Madrid - Tokio'],
  ['transporte','🚆','Tren Tokio - Kioto'],
  ['coche','🚗','Coche de alquiler'],
  ['comida','🍽️','Sushi Saito'],
  ['actividad','🎫','Tour gastronómico'],
  ['hotel','🏨','Hotel Park Hyatt'],
  ['lugar','🚶','Templo Senso-ji'],
  ['playa','🌴','Playa de Shirahama'],
  ['compras','🛍️','Compras Ginza'],
  ['otro','📌','Otro evento'],
];
const STATES = ['por_iniciar','en_consulta','confirmado','cancelado',null];

function card({type,emoji,title,status,custom,nightCont,visited}){
  const div = document.createElement('div');
  const cls = ['list-item','timeline-item','type-'+type];
  if (status) cls.push('status-'+status);
  if (custom) cls.push('has-custom-color');
  if (nightCont) cls.push('virtual','night-cont');
  if (visited) cls.push('visited');
  div.className = cls.join(' ');
  if (custom) div.style.setProperty('--card-color', custom);
  if (nightCont) {
    div.innerHTML = `
      <div class="item-emoji" aria-hidden="true">🛏️</div>
      <div class="li-main"><div class="li-title">${title}</div></div>
      <span class="night-cont-meta">Continuación</span>
      <a class="night-cont-go" href="#" onclick="event.preventDefault();">
        <span><svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.7" fill="none" stroke-linecap="round" stroke-linejoin="round"><polygon points="1 6 8 3 16 6 23 3 23 18 16 21 8 18 1 21 1 6"/></svg></span>
        Cómo llegar
      </a>`;
    return div;
  }
  const statusLabel = {por_iniciar:'Por iniciar', en_consulta:'En consulta', confirmado:'Confirmado', cancelado:'Cancelado'};
  div.innerHTML = `
    <div class="drag-handle" title="Arrastra"><svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.7" fill="none" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="6" r="1.4"/><circle cx="9" cy="12" r="1.4"/><circle cx="9" cy="18" r="1.4"/><circle cx="15" cy="6" r="1.4"/><circle cx="15" cy="12" r="1.4"/><circle cx="15" cy="18" r="1.4"/></svg></div>
    <div class="item-emoji" aria-hidden="true">${emoji}</div>
    <div class="li-main">
      <div class="li-title" style="display:flex;align-items:center;flex-wrap:wrap;gap:4px;">
        <span class="time-pill">10:30</span>
        <span>${title}</span>
        ${status ? `<span class="status-badge s-${status}">${statusLabel[status]}</span>` : ''}
      </div>
      <div class="li-sub">Subtítulo de prueba</div>
    </div>
    <div class="li-actions" style="align-items:center;">
      <button class="icon-btn color-btn ${custom?'has-color':''}" title="Color"><svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.7" fill="none" stroke-linecap="round" stroke-linejoin="round"><circle cx="13.5" cy="6.5" r="1.4"/><circle cx="17.5" cy="10.5" r="1.4"/><circle cx="8.5" cy="7.5" r="1.4"/><circle cx="6.5" cy="12.5" r="1.4"/></svg></button>
      <button class="icon-btn" title="Editar"><svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.7" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 1 1 3 3L7 19l-4 1 1-4 12.5-12.5z"/></svg></button>
    </div>`;
  return div;
}

function build(){
  const root = document.getElementById('root');
  STATES.forEach(state => {
    const sec = document.createElement('section');
    sec.innerHTML = `<h2>Estado: ${state || '(ninguno)'}</h2>`;
    const list = document.createElement('div'); list.className='list';
    TYPES.forEach(([type,emoji,title]) => {
      list.appendChild(card({type,emoji,title,status:state}));
    });
    sec.appendChild(list);
    root.appendChild(sec);
  });
  // Override custom_color
  const sec1 = document.createElement('section');
  sec1.innerHTML = '<h2>Override custom_color (cualquier color libre)</h2>';
  const list1 = document.createElement('div'); list1.className='list';
  ['#fcd34d','#8b5cf6','#22d3ee','#fb7185','#22c55e'].forEach((hex,i) => {
    list1.appendChild(card({type:'lugar',emoji:'📍',title:`Override #${i+1} – ${hex}`,status:'por_iniciar',custom:hex}));
  });
  sec1.appendChild(list1); root.appendChild(sec1);
  // Night cont
  const sec2 = document.createElement('section');
  sec2.innerHTML = '<h2>Variante compacta noche continuación (hotel)</h2>';
  const list2 = document.createElement('div'); list2.className='list';
  list2.appendChild(card({type:'hotel',emoji:'🏨',title:'Park Hyatt — primera noche',status:'confirmado'}));
  list2.appendChild(card({type:'hotel',emoji:'🛏️',title:'Park Hyatt Tokyo',status:'confirmado',nightCont:true}));
  list2.appendChild(card({type:'hotel',emoji:'🛏️',title:'Park Hyatt Tokyo',status:'confirmado',nightCont:true}));
  sec2.appendChild(list2); root.appendChild(sec2);
}
</script>
</body></html>
