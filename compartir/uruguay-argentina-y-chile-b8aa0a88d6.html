<style>
:root {

  --sh-1:0 1px 2px rgba(15,23,42,.04);
  --sh-2:0 4px 16px rgba(15,23,42,.06), 0 1px 3px rgba(15,23,42,.04);
  --sh-3:0 12px 40px rgba(15,23,42,.10);
  --bg:#fbfcfe; --bg-elev:#fff; --bg-soft:#f4f6fa;
  --text:#0b1220; --text-muted:#68738a;
  --line:#e8ecf3; --line-soft:#f1f4f9;
  --accent:#2563eb; --accent-2:#06b6d4; --accent-bg:#eaf1ff;
  --c-hotel:#0d9488;  --c-hotel-bg:#e6fbf7;
  --c-flight:#7c3aed; --c-flight-bg:#f2ecff;
  --c-car:#c2760a;    --c-car-bg:#fff5e0;
}
@media (prefers-color-scheme: dark) {
  :root {
    --sh-1:0 1px 2px rgba(0,0,0,.3);
    --sh-2:0 4px 18px rgba(0,0,0,.35);
    --sh-3:0 12px 40px rgba(0,0,0,.5);
    --bg:#0a0f1a; --bg-elev:#131b2b; --bg-soft:#1a2436;
    --text:#f2f5fa; --text-muted:#95a1b8;
    --line:#26324a; --line-soft:#1a2436;
    --accent:#7aa7ff; --accent-2:#3ddbf0; --accent-bg:#17263f;
    --c-hotel:#5eead4;  --c-hotel-bg:#10352f;
    --c-flight:#c9b6ff; --c-flight-bg:#291f45;
    --c-car:#fbc858;    --c-car-bg:#3a2a0c;
  }
}
* { box-sizing:border-box; }
html { -webkit-text-size-adjust:100%; }
body {
  margin:0; background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','SF Pro Display',
              'Inter',system-ui,'Segoe UI',Roboto,sans-serif;
  font-size:16px; line-height:1.47; letter-spacing:-.01em;
  font-optical-sizing:auto;
  -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale;
}
.dh-badge b, .stat b, .tl-time, .kv .v, .card .ref { font-variant-numeric:tabular-nums; }
main { max-width:760px; margin:0 auto; padding:0 16px 72px; }
/* Barra superior: aparece cuando la portada deja de verse, como en iOS. */
.topbar {
  position:fixed; inset:0 0 auto; z-index:20; padding:10px 16px;
  background:color-mix(in srgb, var(--bg) 82%, transparent);
  backdrop-filter:saturate(180%) blur(18px); -webkit-backdrop-filter:saturate(180%) blur(18px);
  border-bottom:1px solid transparent;
  opacity:0; transform:translateY(-100%); transition:opacity .25s ease, transform .25s ease;
  pointer-events:none;
}
.topbar.show { opacity:1; transform:none; border-bottom-color:var(--line); }
.topbar .tb-in { max-width:760px; margin:0 auto; }
.topbar .tb-t { font-weight:590; font-size:16px; letter-spacing:-.02em; display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.cover {
  position:relative; margin-top:16px; min-height:212px; border-radius:26px; overflow:hidden;
  background:
    radial-gradient(120% 120% at 12% 8%, color-mix(in srgb, var(--accent) 92%, #fff) 0%, transparent 58%),
    radial-gradient(120% 120% at 92% 96%, var(--accent-2) 0%, transparent 62%),
    linear-gradient(150deg, var(--accent), color-mix(in srgb, var(--accent-2) 70%, var(--accent)));
  display:flex; flex-direction:column; justify-content:flex-end; padding:24px;
  box-shadow:var(--sh-3);
}
.cover img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
.cover.has-photo::after { content:''; position:absolute; inset:0; background:linear-gradient(to top, rgba(0,0,0,.62), transparent 62%); }
.cover > * { position:relative; z-index:1; }
.cover .eyebrow { color:rgba(255,255,255,.7); font-size:11px; font-weight:600; letter-spacing:.16em; text-transform:uppercase; margin-bottom:10px; }
.cover h1 { color:#fff; font-weight:700; letter-spacing:-.035em; font-size:clamp(30px,7.4vw,42px); line-height:1.08; margin:0; }
.cover .meta { color:rgba(255,255,255,.95); margin-top:10px; font-weight:590; font-size:15px; letter-spacing:-.012em; }
.cover .meta-2 { color:rgba(255,255,255,.72); margin-top:5px; font-weight:450; font-size:13.5px; letter-spacing:-.005em; }
.stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(76px,1fr)); gap:8px; margin-top:12px; }
.stat { background:var(--bg-elev); border:1px solid var(--line); border-radius:var(--r-md); padding:12px 10px; text-align:center; box-shadow:var(--sh-1); }
.stat b { display:block; font-size:23px; font-weight:640; letter-spacing:-.028em; line-height:1.1; }
.stat span { display:block; margin-top:3px; font-size:11.5px; font-weight:500; color:var(--text-muted); letter-spacing:0; }
.share-banner {
  display:flex; align-items:center; gap:9px; margin:12px 0 0;
  background:var(--accent-bg); color:var(--accent);
  border-radius:var(--r-md); padding:11px 14px; font-size:13px; font-weight:600;
}
.share-banner svg { width:15px; height:15px; flex:none; }
h2.section { font-weight:700; letter-spacing:-.032em; font-size:25px; line-height:1.2; margin:46px 0 16px; }
h3.day { font-weight:700; letter-spacing:-.02em; font-size:16px; margin:18px 0 8px; }
.itin-tools { display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin:0 0 14px; }
.btn-mini {
  font:inherit; font-size:13.5px; font-weight:700; cursor:pointer; letter-spacing:-.01em;
  background:var(--bg-elev); color:var(--accent); border:1px solid var(--line);
  border-radius:var(--r-pill); padding:8px 16px; box-shadow:var(--sh-1);
  transition:background .15s ease, transform .12s ease; -webkit-tap-highlight-color:transparent;
}
.btn-mini:hover { background:var(--accent-bg); }
.btn-mini:active { transform:scale(.96); }
.itin-count { color:var(--text-muted); font-size:13px; }
details.day-block {
  background:var(--bg-elev); border:1px solid var(--line); border-radius:20px;
  margin-bottom:10px; box-shadow:var(--sh-1); overflow:hidden;
  transition:box-shadow .2s ease, border-color .2s ease;
}
details.day-block[open] { box-shadow:var(--sh-2); border-color:color-mix(in srgb, var(--accent) 22%, var(--line)); }
summary.day-head {
  list-style:none; cursor:pointer; padding:14px; display:flex; gap:13px; align-items:center;
  -webkit-tap-highlight-color:transparent; transition:background .15s ease;
}
summary.day-head::-webkit-details-marker { display:none; }
summary.day-head:hover, summary.day-head:active { background:var(--bg-soft); }
/* Abierto, cabecera y contenido eran los dos blancos y se fundían en un bloque
   sin lectura. La cabecera pasa a fondo suave con una línea debajo. */
details[open] > summary.day-head {
  background:var(--bg-soft);
  border-bottom:1px solid var(--line);
}
.dh-badge {
  flex:none; width:38px; height:38px; border-radius:13px; background:var(--accent-bg); color:var(--accent);
  display:flex; flex-direction:column; align-items:center; justify-content:center; line-height:1;
}
.dh-badge span { font-size:8.5px; font-weight:700; letter-spacing:.09em; text-transform:uppercase; opacity:.7; margin-bottom:2px; }
.dh-badge b { font-size:17px; font-weight:640; letter-spacing:-.03em; }
.dh-main { flex:1; min-width:0; }
.dh-date { font-weight:590; font-size:17px; letter-spacing:-.022em; }
.dh-chips { display:flex; flex-wrap:wrap; gap:6px; margin-top:7px; }
.dh-caret { flex:none; width:16px; height:16px; color:var(--text-muted); opacity:.5; transition:transform .22s cubic-bezier(.4,0,.2,1); }
details[open] .dh-caret { transform:rotate(90deg); }
.chip {
  display:inline-flex; align-items:center; gap:5px; white-space:nowrap; max-width:100%;
  font-size:12.5px; font-weight:590; letter-spacing:-.006em; padding:4.5px 11px 4.5px 8px;
  border-radius:var(--r-pill); border:none; overflow:hidden; text-overflow:ellipsis;
}
.chip-ico { display:inline-flex; flex:none; }
.chip-ico svg { width:13px; height:13px; opacity:.9; }
.chip-place  { background:var(--accent-bg); color:var(--accent); }
.chip-hotel  { background:var(--c-hotel-bg);  color:var(--c-hotel); }
.chip-flight { background:var(--c-flight-bg); color:var(--c-flight); }
.chip-car    { background:var(--c-car-bg);    color:var(--c-car); }
.chip-count  { background:var(--bg-soft); color:var(--text-muted); font-weight:600; padding:4px 11px; }
/* --- Movimiento ---------------------------------------------------------
   Al abrir un día, sus entradas entran escalonadas de derecha a izquierda. El
   escalonado se corta a los 12 elementos: con 20 paradas, esperar el último
   sería lo contrario de ágil. */
@keyframes entra-item {
  from { opacity:0; transform:translateX(18px); }
  to   { opacity:1; transform:none; }
}
@keyframes entra-suave {
  from { opacity:0; transform:translateY(10px); }
  to   { opacity:1; transform:none; }
}
details[open] .day-note,
details[open] .timeline .tl-item { animation:entra-item .34s cubic-bezier(.22,.8,.3,1) both; }
details[open] .timeline .tl-item { animation-delay:calc(var(--i, 0) * 42ms); }
details[open] /* Notas largas: se recortan a dos líneas y se despliegan a petición. El botón
   solo aparece si el texto realmente se corta, y eso hay que medirlo cuando el
   día está abierto: dentro de un <details> cerrado todo mide 0. */
.nota-txt { white-space:pre-wrap; }
.nota-txt.clamp { display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
.nota-mas {
  display:none; margin-top:6px; padding:0; border:none; background:none; cursor:pointer;
  font:inherit; font-size:12.5px; font-weight:700; color:var(--accent);
  -webkit-tap-highlight-color:transparent;
}
.nota-mas.on { display:inline-block; }
.nota-mas:hover { text-decoration:underline; }
.day-note { animation-delay:0ms; }
/* Los bloques de día aparecen al alcanzarlos en el scroll. */
.day-block.reveal { opacity:0; transform:translateY(12px); }
.day-block.reveal.in { animation:entra-suave .42s cubic-bezier(.22,.8,.3,1) both; }
.stat { animation:entra-suave .4s cubic-bezier(.22,.8,.3,1) both; animation-delay:calc(var(--i, 0) * 55ms); }
.cover { animation:entra-suave .5s cubic-bezier(.22,.8,.3,1) both; }
.day-body { padding:16px 16px 18px; }
.day-empty { color:var(--text-muted); font-size:13.5px; padding:0 16px 18px; }
.timeline { position:relative; margin-left:5px; padding-left:22px; border-left:1.5px solid var(--line); }
.tl-item { position:relative; padding:12px 14px; background:var(--bg-soft); border-radius:15px; margin-bottom:8px; }
.tl-item::before {
  content:''; position:absolute; left:-27px; top:18px; width:8px; height:8px; border-radius:50%;
  background:var(--accent); opacity:.5; box-shadow:0 0 0 4px var(--bg-elev);
}
.tl-time {
  display:inline-block; font-size:11.5px; font-weight:700;
  background:var(--bg-elev); color:var(--accent); padding:2px 8px; border-radius:var(--r-pill); margin-right:7px;
}
.tl-title { font-weight:590; letter-spacing:-.017em; font-size:16px; line-height:1.32; }
.tl-sub { color:var(--text-muted); font-size:14.5px; line-height:1.42; margin-top:6px; letter-spacing:-.006em; overflow-wrap:anywhere; }
.tl-title, .day-note, .card p, main { overflow-wrap:anywhere; }
.tl-link { display:inline-block; margin-top:8px; font-size:12.5px; font-weight:700; }
.day-note {
  background:var(--accent-bg); border:none; border-left:3px solid color-mix(in srgb, var(--accent) 45%, transparent);
  border-radius:12px; padding:12px 14px; margin-bottom:10px; font-size:14.5px; line-height:1.42;
}
.card { background:var(--bg-elev); border:1px solid var(--line); border-radius:18px; padding:15px 16px; margin-bottom:10px; box-shadow:var(--sh-1); }
.card .ti { font-weight:700; letter-spacing:-.02em; display:flex; align-items:center; gap:8px; }
.card .sub { color:var(--text-muted); font-size:13.5px; margin-top:4px; }
.card .ref { font-size:11px; font-weight:700; background:var(--bg-soft); color:var(--text-muted); padding:3px 9px; border-radius:var(--r-pill); }
.card a { color:var(--accent); font-weight:600; }
.kv { display:flex; justify-content:space-between; gap:16px; padding:9px 0; border-bottom:1px solid var(--line-soft); font-size:14px; }
.kv:last-child { border-bottom:none; }
.kv .k { color:var(--text-muted); }
.kv .v { font-weight:600; text-align:right; }
.muted { color:var(--text-muted); }
.notes-card { background:var(--bg-elev); border:1px solid var(--line); border-radius:18px; padding:15px 16px; white-space:pre-wrap; font-size:14px; box-shadow:var(--sh-1); }
footer.foot { margin-top:56px; padding-top:26px; border-top:1px solid var(--line-soft); color:var(--text-muted); font-size:12px; text-align:center; }
a { color:var(--accent); text-decoration:none; }
a:hover { text-decoration:underline; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    transition-duration:.01ms !important; transition-delay:0ms !important;
    animation-duration:.01ms !important; animation-delay:0ms !important;
  }
}
</style>

6-09-07T00:00:00.000Z","deleted_at":null},{"id":"f9419a42-7ccb-5838-8268-d3254c3bdfd1","trip_id":"9d1da966-2619-5e0f-947a-df54d794aa93","type":"actividad","structured_data":{"nombre":"Cruce Andino","lugar":"Bariloche → Puerto Varas","fecha":"2024-12-31"},"doc_name":null,"doc_url":null,"ref_date":"2024-12-31","ref_time":null,"updated_at":"2026-09-07T00:00:00.000Z","deleted_at":null}],"addresses":[],"destination_info":null,"emergency_contacts":[],"phrases":[],"day_notes":[{"id":"1a40d026-5af9-53e7-bc59-c296517dd9cf","trip_id":"9d1da966-2619-5e0f-947a-df54d794aa93","date":"2024-12-17","title":"Cataratas · lado argentino","color":"verde","text":"🚍 Transporte en autobús\nTerminal de Buses de Puerto Iguazú: https://www.terminaldeiguazu.com.ar/\n\n🎟️ Entradas (sitio oficial) — Derechos de acceso a Parques Nacionales:\nhttps://www.argentina.gob.ar/interior/ambiente/parquesnacionales/tarifas\n\n⚠️ Recomendaciones en el parque\n· Llevar pasaporte y chubasquero.\nUna vez dentro del parque, tras pasar el control de entradas, cruzarás una amplia zona común de bienvenida a visitantes hasta llegar a la conocida como estación central.\nDesde allí parten unos pequeños trenes verdes que te llevarán a la estación cataratas en unos 15 minutos, desde donde se inician el circuito inferior y superior.\nLa frecuencia de estos trenes es cada 30 minutos, por lo que si no quieres esperar, tienes la opción de tomar el sendero verde y caminar 10 minutos, llegando igualmente a la estación cataratas. Todo allí está perfectamente señalizado.\nPara realizar el famoso sendero que te lleva a la Garganta del Diablo, en la estación cataratas deberás tomar otro tren con destino estación garganta, desde donde comienza. La frecuencia de paso del tren es de nuevo cada 30 minutos.\nComo recomendación, empezar primero por la Garganta del Diablo.","updated_at":"2026-09-08T00:00:00.000Z","deleted_at":null},{"id":"1aab42b3-c6d2-5e95-807d-56f96a72e41d","trip_id":"9d1da966-2619-5e0f-947a-df54d794aa93","date":"2024-12-19","title":"Buenos Aires","color":"morado","text":"Free Tour 11:00h - Plaza de Mayo (Civitatis)\nVoucher: https://drive.google.com/file/d/1GKbNmahJxPGsLYyrvEPPWahWvB8IrAqo/view?usp=sharing","updated_at":"2026-09-07T00:00:00.000Z","deleted_at":null},{"id":"217b7693-59c2-58d4-86a8-a05b31337c63","trip_id":"9d1da966-2619-5e0f-947a-df54d794aa93","date":"2025-01-01","title":"Puerto Varas","color":"verde","text":"","updated_at":"2026-09-07T00:00:00.000Z","deleted_at":null},{"id":"38f4d71f-2b41-55f6-986a-5b24bc631cff","trip_id":"9d1da966-2619-5e0f-947a-df54d794aa93","date":"2024-12-21","title":"Buenos Aires","color":"morado","text":"","updated_at":"2026-09-07T00:00:00.000Z","deleted_at":null},{"id":"3f52ad0f-237e-58e4-add3-9d56a39b2a91","trip_id":"9d1da966-2619-5e0f-947a-df54d794aa93","date":"2024-12-23","title":"Parque Nacional Tierra del Fuego","color":"verde","text":"🔥 Parque Natural Tierra del Fuego\n\n🎟️ Entradas (sitio oficial) — Derechos de acceso a Parques Nacionales:\nhttps://www.argentina.gob.ar/interior/ambiente/parquesnacionales/tarifas\n\n⚠️ Recomendaciones en el parque\nSenderos: https://www.argentina.gob.ar/senderos-del-parque-nacional-tierra-del-fuego\nMejor ruta: Senda Costera. Hay rutas que podéis hacer solo un trozo y daros la vuelta cuando queráis, y seguir explorando con el coche por el parque.\n· Lleva ropa de abrigo, viste por capas y no te olvides del cortavientos y el chubasquero.","updated_at":"2026-09-08T00:00:00.000Z","deleted_at":null},{"id":"48a47c20-2220-5194-90c7-e77de394fb20","trip_id":"9d1da966-2619-5e0f-947a-df54d794aa93","date":"2024-12-13","title":"Bogotá - Montevideo","color":"azul","text":"","updated_at":"2026-09-07T00:00:00.000Z","deleted_at":null},{"id":"4ffa1730-c89b-5e6a-9dc3-9961a64f3192","trip_id":"9d1da966-2619-5e0f-947a-df54d794aa93","date":"2024-12-24","title":"Ushuaia","color":"verde","text":"08:00H. Excursión Canal de Beagle (Civitatis)\nVoucher: https://drive.google.com/file/d/1Kna8vJQk12lttBpi-KgNagBfdGsgDtbb/view?usp=sharing","updated_at":"2026-09-07T00:00:00.000Z","deleted_at":null},{"id":"6023cc0e-2e44-5ea9-a5b0-94d920ef9d45","trip_id":"9d1da966-2619-5e0f-947a-df54d794aa93","date":"2024-12-22","title":"Buenos Aires - Ushuaia","color":"naranja","text":"Traslado Buenos Aires - Aeropuerto: UBER","updated_at":"2026-09-07T00:00:00.000Z","deleted_at":null},{"id":"6ac10cf3-5765-5a01-9e61-936f90dda7f9","trip_id":"9d1da966-2619-5e0f-947a-df54d794aa93","date":"2024-12-31","title":"Cruce Andino","color":"azul","text":"Tickets Cruce Andino: https://drive.google.com/file/d/1gsoYzxyNnotY2cmopX7wD9g9ZRmH61ri/view?usp=sharing","updated_at":"2026-09-07T00:00:00.000Z","deleted_at":null},{"id":"7c375dff-15d8-5031-b36f-0f2156db375e","trip_id":"9d1da966-2619-5e0f-947a-df54d794aa93","date":"2024-12-18","title":"Iguazú Brasil → Buenos Aires","color":"naranja","text":"🚖 Transporte en taxi (lado brasileño)\nHay autobuses que llegan hasta las cataratas (empresa Río Uruguay). Nosotros teníamos que coger el vuelo por la tarde y para ir más rápido lo hicimos en taxi, que son unos 45 minutos y se puede pactar ida y vuelta con el taxista. Desde el mismo hotel lo pueden gestionar.\n\n🎟️ Entradas (sitio oficial) — Cataratas do Iguaçu, Parque Nacional do Iguaçu:\nhttps://cataratasdoiguacu.com.br/\n\n⚠️ Recomendaciones en el parque\nHay un restaurante dentro del parque que se puede reservar online cuando compras las entradas. Es tipo bufé libre. No está mal, pero tampoco nada del otro mundo. Está bien para comer viendo las cataratas.\n\n🚖 Traslado aeropuerto → Buenos Aires\nLa mejor opción es Uber. Precio razonable (en diciembre de 2024). Funciona bien, rápido y seguro.\n\n🏠 Alojamiento en Buenos Aires\nNos alojamos en este AirBnB. Normalito pero bien, ubicado en zona segura, con conexión de autobús prácticamente en la puerta, en una avenida concurrida. Buena relación calidad/precio.\nVivienda rentada · Buenos Aires · ★4.93 · 1 habitación · 1 cama · 1 baño:\nhttps://www.airbnb.com.co/rooms/816686078750766272" ja","text":"🚖 Transporte en taxi\nLo más fácil es coger un taxi en el aeropuerto de los que hay allí mismo y pactar precio con él para llegar. Cuando fuimos, nos dijeron que para 2025 iban a subir las tarifas (y subían bastante…).\n\n🏨 Alojamiento en Puerto Iguazú (Argentina)\nO2 Hotel Iguazú: buena relación calidad/precio. Muy cerca de la calle principal de Puerto Iguazú. Es mejor alojarse en la parte argentina y cruzar a Brasil en taxi.","updated_at":"2026-09-08T00:00:00.000Z","deleted_at":null},{"id":"a533dbe2-5ce7-5562-b8b9-b236217e7264","trip_id":"9d1da966-2619-5e0f-947a-df54d794aa93","date":"2024-12-18","title":"Iguazú - Buenos Aires","color":"azul","text":"Entradas Iguazú Brasil y Restaurante: https://drive.google.com/file/d/1vm_UVoK8JS7vCtcIAn8mxiEIORydGKos/view?usp=drivesdk\nWeb oficial Iguazú Brasil: https://cataratasdoiguacu.com.br/\n\nHorarios de los Colectivos Río Uruguay en Iguazú\nLado argentino: cada 20 minutos, desde las 7.00 AM hasta las 19.00 hrs.\nRecorrido: Hito 3 Fronteras > Av. Tres Fronteras > Terminal de Ómnibus > Av. Victoria Aguirre Km5 > Parque Nacional Iguazú.\nLado brasileño: salida todos los días a las 8.00 hrs, frecuencia cada 2 horas ida y vuelta. Empieza en la terminal de Ómnibus de Puerto Iguazú y termina en el Parque Nacional de Brasil.\nHorarios del regreso: 9.00 | 11.00 | 13.00 | 15.00 | 17.00.\nOtra opción sería tomar la de Crucero del Norte, otra empresa que opera cruzando al lado brasilero.\n\nBlog info: https://misindromeviajero.com/cataratas-iguazu-visita-entradas/\n\nBuenos Aires: UBER","updated_at":"2026-09-08T20:59:49.557633+00:00","deleted_at":null},{"id":"a80a5344-eea3-5f56-b309-c85921b0b6d7","trip_id":"9d1da966-2619-5e0f-947a-df54d794aa93","date":"2024-12-15","title":"Colonia Sacramento","color":"rosa","text":"","updated_at":"2026-09-08T21:00:22.812175+00:00","deleted_at":null},{"id":"aad79fe6-6755-5ed7-86b7-0a5880b93c9a","trip_id":"9d1da966-2619-5e0f-947a-df54d794aa93","date":"2024-12-29","title":"Calafate - Bariloch function fmtDayLong(iso){if(!iso)return'';return new Date(iso+'T00:00:00').toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'long'});}
function fmtDateShort(iso){if(!iso)return'';return new Date(iso+'T00:00:00').toLocaleDateString('es-ES',{day:'numeric',month:'short'});}
function daysBetween(a,b){if(!a||!b)return 0;return Math.round((new Date(b+'T00:00:00')-new Date(a+'T00:00:00'))/(24*3600*1000));}
function el(tag, attrs, children) {
  const n = document.createElement(tag);
  if (attrs) for (const k in attrs) { if (k==='class') n.className = attrs[k]; else if (k==='text') n.textContent = attrs[k]; else if (k==='html') n.innerHTML = attrs[k]; else if (k.startsWith('on')) n.addEventListener(k.slice(2), attrs[k]); else if (k==='style') Object.assign(n.style, attrs[k]); else n.setAttribute(k, attrs[k]); }
  if (children) (Array.isArray(children)?children:[children]).forEach(c => { if (c==null||c===false) return; if (typeof c === 'string') n.appendChild(document.createTextNode(c)); else n.appendChild(c); });
  return n;
}

// Pastilla con icono + texto (el icono es decorativo, el texto lleva el dato).
function chip(cls, iconKey, txt) {
  const c = el('span', {class:'chip ' + cls});
  if (iconKey) c.appendChild(el('span', {class:'chip-ico', html: ico(iconKey)}));
  c.appendChild(el('span', {text: txt}));
  return c;
}

// Nota con recorte a dos líneas y botón para desplegarla.
function notaRecortable(texto, claseWrap) {
  const wrap = el('div', {class: claseWrap});
  const txt = el('div', {class:'nota-txt clamp', text: texto});
  const btn = el('button', {class:'nota-mas', type:'button'}, 'Ver más');
  btn.addEventListener('click', (e) => {
    e.preventDefault(); e.stopPropagation();
    const abierto = !txt.classList.toggle('clamp');
    btn.textContent = abierto ? 'Ver menos' : 'Ver más';
  });
  wrap.appendChild(txt); wrap.appendChild(btn);
  return wrap;
}
// Solo se ofrece 'Ver más' si el texto se corta de verdad.
function revisarRecortes(cont) {
  cont.querySelectorAll('.nota-txt.clamp').forEach(txt => {
    const btn = txt.nextElementSibling;
    if (!btn || !btn.classList.contains('nota-mas')) return;
    if (txt.scrollHeight - txt.clientHeight > 4) btn.classList.add('on');
    else txt.classList.remove('clamp');   // cabe entera: ni recorte ni botón
  });
}

// Helpers de fechas y de etiquetado del día.
const isoOf = (d) => d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const LEGS = DATA.trip_legs || [];
// Ciudad a partir de una dirección postal: el segundo segmento, sin el código
// postal de delante ('11000 Montevideo' -> 'Montevideo', 'V9410AVG Ushuaia' -> 'Ushuaia').
// Es una heurística: si no cuadra, simplemente no se muestra la pastilla.
function cityFromAddress(addr) {
  if (!addr) return null;
  const parts = String(addr).split(',').map(x => x.trim()).filter(Boolean);
  if (parts.length < 2) return null;
  const c = parts[1].replace(/^[A-Za-z]{0,2}\d[\w-]*\s+/, '').trim();
  return c && !/^\d+$/.test(c) ? c : null;
}
// Rango [entrada, salida) de un alojamiento. Los tipos 'rango' guardan las
// fechas en consultation_planned_d1/d2; si faltan, se usa el día del evento.
function stayRange(p) {
  const d1 = p.consultation_planned_d1 || p.day_date;
  const d2 = p.consultation_planned_d2 || (p.metadata && p.metadata.end_date) || null;
  return d1 ? { d1, d2 } : null;
}
const STAYS = DATA.planning.filter(p => p.type === 'hotel').map(p => ({ p, r: stayRange(p) })).filter(x => x.r);
function stayOn(iso) {
  // La noche del día: entrada <= día < salida. El día del check-out ya no cuenta.
  const hit = STAYS.find(x => x.r.d1 <= iso && (!x.r.d2 || iso < x.r.d2));
  return hit ? hit.p : null;
}
function legOn(iso) {
  const l = LEGS.find(x => (x.arrival_date || '') <= iso && (!x.departure_date || iso <= x.departure_date));
  return l && l.city ? l.city : null;
}
// La ciudad de cada día viene ya calculada por GeoCities en la app.

// 'MVD · Montevideo' -> 'MVD'. Sin metadata, se cae al título del evento.
const iata = (v) => String(v || '').split('·')[0].trim();
function flightLabel(p) {
  const m = p.metadata || {};
  if (m.origen && m.destino) return iata(m.origen) + ' → ' + iata(m.destino);
  return p.title;
}

const byDay = {};
DATA.planning.forEach(p => { const k = p.day_date || 'sin-fecha'; (byDay[k]=byDay[k]||[]).push(p); });
const noteMap = {}; DATA.day_notes.forEach(n => noteMap[n.date]=n);
Object.keys(noteMap).forEach(k => { if (!byDay[k]) byDay[k] = []; });
if (trip.start_date && trip.end_date) {
  let d = new Date(trip.start_date+'T00:00:00'); const end = new Date(trip.end_date+'T00:00:00');
  while (d <= end) { const k = isoOf(d); if (!byDay[k]) byDay[k]=[]; d.setDate(d.getDate()+1); }
}
const dayKeys = Object.keys(byDay).sort();
const blocks = [];

// Cifras de cabecera: dan la escala del viaje de un vistazo.
(function(){
  const cont = document.getElementById('stats');
  if (!cont) return;
  const ciudades = new Set(Object.values(CIUDAD_DIA).filter(Boolean));
  const paradas = DATA.planning.filter(p => !['hotel','vuelo','coche','transporte'].includes(p.type)).length;
  const vuelos = DATA.planning.filter(p => p.type === 'vuelo').length;
  const aloj = DATA.planning.filter(p => p.type === 'hotel').length;
  [[dayKeys.length, dayKeys.length === 1 ? 'Día' : 'Días'],
   [ciudades.size, ciudades.size === 1 ? 'Ciudad' : 'Ciudades'],
   [paradas, paradas === 1 ? 'Parada' : 'Paradas'],
   [vuelos, 'Vuelos'], [aloj, 'Alojam.']].filter(x => x[0] > 0).forEach(([n, lab]) => {
    const d = el('div', {class:'stat'});
    d.style.setProperty('--i', cont.children.length);
    d.appendChild(el('b', {text: String(n)}));
    d.appendChild(el('span', {text: lab}));
    cont.appendChild(d);
  });
})();

if (dayKeys.length) {
  root.appendChild(el('h2', {class:'section', text:'Itinerario'}));
  const tools = el('div', {class:'itin-tools'});
  const btnAll = el('button', {class:'btn-mini', type:'button'}, 'Desplegar todo');
  btnAll.addEventListener('click', () => {
    const abrir = blocks.some(b => !b.open);
    blocks.forEach(b => { b.open = abrir; });
    btnAll.textContent = abrir ? 'Plegar todo' : 'Desplegar todo';
  });
  tools.appendChild(btnAll);
  tools.appendChild(el('span', {class:'itin-count', text: dayKeys.length + (dayKeys.length===1?' día':' días') + ' · toca uno para ver el detalle'}));
  root.appendChild(tools);

  dayKeys.forEach(k => {
    const items = byDay[k];
    items.sort((a,b) => (a.time||'').localeCompare(b.time||'') || (a.order_index||0)-(b.order_index||0));
    const note = noteMap[k];
    const dayNum = (trip.start_date && k!=='sin-fecha') ? daysBetween(trip.start_date, k)+1 : null;

    const det = el('details', {class:'day-block'});
    det.id = 'dia-' + k;
    const head = el('summary', {class:'day-head'});
    if (dayNum) {
      const badge = el('span', {class:'dh-badge'});
      badge.appendChild(el('span', {text:'día'}));
      badge.appendChild(el('b', {text: String(dayNum)}));
      head.appendChild(badge);
    }
    const main = el('div', {class:'dh-main'});
    main.appendChild(el('div', {class:'dh-date', text: k==='sin-fecha' ? 'Sin fecha' : fmtDayLong(k)}));

    const chips = el('div', {class:'dh-chips'});
    const ciudad = CIUDAD_DIA[k];
    if (ciudad) chips.appendChild(chip('chip-place', 'pin', ciudad));
    // El título que el usuario puso al día no se pierde: si dice algo distinto
    // de la ciudad, va en su propia pastilla.
    if (note && note.title && note.title !== ciudad) {
      chips.appendChild(el('span', {class:'chip chip-count', text: note.title}));
    }
    const stay = stayOn(k);
    if (stay) chips.appendChild(chip('chip-hotel', 'hotel', stay.place_name || stay.title));
    items.filter(p => p.type === 'vuelo').forEach(p => {
      chips.appendChild(chip('chip-flight', 'plane', flightLabel(p)));
    });
    items.filter(p => p.type === 'coche').forEach(p => {
      chips.appendChild(chip('chip-car', 'car', p.place_name || p.title));
    });
    const paradas = items.filter(p => !['hotel','vuelo','coche'].includes(p.type)).length;
    if (paradas) chips.appendChild(el('span', {class:'chip chip-count', text: paradas + (paradas===1?' parada':' paradas')}));
    if (chips.children.length) main.appendChild(chips);
    head.appendChild(main);
    head.appendChild(el('span', {class:'dh-caret', html:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>'}));
    det.appendChild(head);

    const bodyDiv = el('div', {class:'day-body'});
    if (note && note.text) bodyDiv.appendChild(notaRecortable(note.text, 'day-note'));
    if (items.length) {
      const tl = el('div', {class:'timeline'});
      items.forEach((it, idx) => {
        const tlItem = el('div', {class:'tl-item'});
        tlItem.style.setProperty('--i', Math.min(idx, 12));
        const titleDiv = el('div', {class:'tl-title'});
        if (it.time) titleDiv.appendChild(el('span', {class:'tl-time', text: it.time}));
        titleDiv.appendChild(document.createTextNode(it.title));
        tlItem.appendChild(titleDiv);
        if (it.place_name && it.place_name !== it.title) tlItem.appendChild(el('div', {class:'tl-sub', text: it.place_name}));
        if (it.address) tlItem.appendChild(el('div', {class:'tl-sub', text: it.address}));
        if (it.notes) tlItem.appendChild(notaRecortable(it.notes, 'tl-sub'));
        tl.appendChild(tlItem);
      });
      bodyDiv.appendChild(tl);
    } else if (!note || !note.text) {
      bodyDiv.appendChild(el('div', {class:'day-empty', text:'Día libre'}));
    }
    det.appendChild(bodyDiv);
    det.classList.add('reveal');
    det.addEventListener('toggle', () => {
      if (det.open && !det._medido) { det._medido = true; revisarRecortes(det); }
    });
    root.appendChild(det);
    blocks.push(det);
  });
}


// Cada bloque de día aparece cuando se llega a él; una sola vez.
(function(){
  const bloques = document.querySelectorAll('.day-block.reveal');
  if (!bloques.length) return;
  if (!('IntersectionObserver' in window)) {
    bloques.forEach(b => b.classList.add('in'));   // sin soporte, todo visible
    return;
  }
  const io = new IntersectionObserver((es) => {
    es.forEach(e => { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } });
  }, { rootMargin:'0px 0px -8% 0px' });
  bloques.forEach(b => io.observe(b));
})();

// === Reservas ===
if (DATA.bookings.length) {
  root.appendChild(el('h2', {class:'section', text:'Reservas'}));
  const TYPE_LABELS = {vuelo:'Vuelo',hotel:'Hotel',tren:'Tren',ferry:'Ferry',coche:'Coche',actividad:'Actividad',seguro:'Seguro',otro:'Otro'};
  DATA.bookings.forEach(b => {
    const c = el('div', {class:'card'});
    const d = b.structured_data || {};
    const ti = el('div', {class:'ti'});
    ti.appendChild(document.createTextNode(TYPE_LABELS[b.type]||b.type));
    if (b.ref_date) ti.appendChild(el('span', {class:'ref', style:{marginLeft:'8px'}, text: fmtDateShort(b.ref_date)}));
    c.appendChild(ti);
    Object.entries(d).filter(([k,v])=>v).forEach(([k,v]) => {
      const kv = el('div', {class:'kv'});
      kv.appendChild(el('span', {class:'k', text: k.replace(/_/g,' ')}));
      kv.appendChild(el('span', {class:'v', text: String(v)}));
      c.appendChild(kv);
    });
    if (b.doc_url && OPTS.includeDocs) {
      const dwrap = el('div', {style:{marginTop:'8px'}});
      dwrap.appendChild(el('a', {href: b.doc_url, target:'_blank', rel:'noopener', text: b.doc_name || 'Documento'}));
      c.appendChild(dwrap);
    }
    root.appendChild(c);
  });
}

// === Direcciones ===
if (DATA.addresses.length) {
  root.appendChild(el('h2', {class:'section', text:'Direcciones'}));
  DATA.addresses.forEach(a => {
    const c = el('div', {class:'card'});
    c.appendChild(el('div', {class:'ti', text: a.label}));
    if (a.address) c.appendChild(el('div', {class:'sub', text: a.address}));
    if (a.notes) c.appendChild(el('div', {class:'sub', text: a.notes}));
    root.appendChild(c);
  });
}

// === Ficha destino ===
if (DATA.destination_info || DATA.emergency_contacts.length || (DATA.phrases.length && OPTS.includeNotes)) {
  root.appendChild(el('h2', {class:'section', text:'Ficha del destino'}));
  if (DATA.destination_info) {
    const i = DATA.destination_info;
    const c = el('div', {class:'card'});
    const rows = [['Zona horaria',i.timezone],['Dif. con origen',i.tz_diff_origin],['Voltaje',i.voltage],['Enchufe',i.plug_type],['Moneda local',i.local_currency],['Propinas',i.tipping_notes],['Tel. emergencia',i.emergency_number]];
    rows.filter(r => r[1]).forEach(r => {
      const kv = el('div', {class:'kv'});
      kv.appendChild(el('span', {class:'k', text: r[0]}));
      kv.appendChild(el('span', {class:'v', text: r[1]}));
      c.appendChild(kv);
    });
    if (i.embassy_info) { const w = el('div', {style:{marginTop:'10px'}}); w.appendChild(el('div', {class:'k muted', text:'Embajada de España'})); w.appendChild(el('div', {class:'sub', style:{whiteSpace:'pre-wrap'}, text: i.embassy_info})); c.appendChild(w); }
    if (c.children.length) root.appendChild(c);
  }
  if (DATA.emergency_contacts.length) {
    root.appendChild(el('h3', {class:'day', text:'Contactos de emergencia'}));
    DATA.emergency_contacts.forEach(c => {
      const d = el('div', {class:'card'});
      d.appendChild(el('div', {class:'ti', text: c.name}));
      d.appendChild(el('div', {class:'sub', text: [c.relation, c.phone].filter(Boolean).join(' · ')}));
      root.appendChild(d);
    });
  }
  if (DATA.phrases.length && OPTS.includeNotes) {
    root.appendChild(el('h3', {class:'day', text:'Frases útiles'}));
    DATA.phrases.forEach(p => {
      const d = el('div', {class:'card'});
      d.appendChild(el('div', {class:'ti', text: p.phrase_local}));
      d.appendChild(el('div', {class:'sub', text: [p.translation, p.lang].filter(Boolean).join(' · ')}));
      root.appendChild(d);
    });
  }
}

// === Notas generales ===
if (OPTS.includeNotes && trip.notes) {
  root.appendChild(el('h2', {class:'section', text:'Notas'}));
  root.appendChild(el('div', {class:'notes-card', text: trip.notes}));
}

</script>
